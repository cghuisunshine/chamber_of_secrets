the dashboard. Fred twiddled the steering wheel.", "begin": 2563.913, "end": 2583.153, "localBegin": 539.24, "localEnd": 558.48}, {"id": "c003_f000077", "text": "'So, does your dad know you've got the car?' said Harry, guessing the answer.", "begin": 2583.153, "end": 2588.713, "localBegin": 558.48, "localEnd": 564.04}, {"id": "c003_f000078", "text": "'Er, no,' said Ron, 'he had to work tonight. Hopefully we'll be able to get it back in the garage without Mum noticing we flew it.'", "begin": 2588.713, "end": 2597.553, "localBegin": 564.04, "localEnd": 572.88}, {"id": "c003_f000079", "text": "'What does your dad do at the Ministry of Magic, anyway?'", "begin": 2597.553, "end": 2600.433, "localBegin": 572.88, "localEnd": 575.76}, {"id": "c003_f000080", "text": "'He works in the most boring department,' said Ron. 'The Misuse of Muggle Artefacts Office.'", "begin": 2600.433, "end": 2607.593, "localBegin": 575.76, "localEnd": 582.92}, {"id": "c003_f000081", "text": "'The what?'", "begin": 2607.593, "end": 2608.713, "localBegin": 582.92, "localEnd": 584.04}, {"id": "c003_f000082", "text": "'It's all to do with bewitching things that are Muggle-made, you know, in case they end up back in a Muggle shop or house. Like, last year, some old witch died and her tea set was sold to an antiques shop. This Muggle woman bought it, took it home and tried to serve her friends tea in it. It was a nightmare - Dad was working overtime for weeks.'", "begin": 2608.713, "end": 2628.753, "localBegin": 584.04, "localEnd": 604.08}, {"id": "c003_f000083", "text": "'What happened?'", "begin": 2628.753, "end": 2629.353, "localBegin": 604.08, "localEnd": 604.68}, {"id": "c003_f000084", "text": "'The teapot went berserk and squirted boiling tea all over the place and one man ended up in hospital with the sugar tongs clamped to his nose. Dad was going frantic, it's only him and an old warlock called Perkins in the office, and they had to do Memory Charms and all sorts to cover it up ...'", "begin": 2629.353, "end": 2647.833, "localBegin": 604.68, "localEnd": 623.16}, {"id": "c003_f000085", "text": "'But your dad ... this car ...'", "begin": 2647.833, "end": 2650.633, "localBegin": 623.16, "localEnd": 625.96}, {"id": "c003_f000086", "text": "Fred laughed. 'Yeah, Dad's mad about everything to do with Muggles, our shed's full of Muggle stuff. He takes it apart, puts spells on it and puts it back together again. If he raided our house he'd have to put himself straight under arrest. It drives Mum mad.'", "begin": 2650.633, "end": 2667.353, "localBegin": 625.96, "localEnd": 642.68}, {"id": "c003_f000087", "text": "'That's the main road,' said George, peering down through the windscreen. 'We'll be there in ten minutes ... just as well, it's getting light ...'", "begin": 2667.353, "end": 2677.113, "localBegin": 642.68, "localEnd": 652.44}, {"id": "c003_f000088", "text": "A faint pinkish glow was visible along the horizon to the east.", "begin": 2677.113, "end": 2680.953, "localBegin": 652.44, "localEnd": 656.28}, {"id": "c003_f000089", "text": "Fred brought the car lower and Harry saw a dark patchwork of fields and clumps of trees.", "begin": 2680.953, "end": 2686.953, "localBegin": 656.28, "localEnd": 662.28}, {"id": "c003_f000090", "text": "'We're a little way outside the village,' said George. 'Ottery St Catchpole ...'", "begin": 2686.953, "end": 2692.353, "localBegin": 662.28, "localEnd": 667.68}, {"id": "c003_f000091", "text": "Lower and lower went the flying car. The edge of a brilliant red sun was now gleaming through the trees.", "begin": 2692.353, "end": 2698.073, "localBegin": 667.68, "localEnd": 673.4}, {"id": "c003_f000092", "text": "'Touchdown!' said Fred as, with a slight bump, they hit the ground. They had landed next to a tumbledown garage in a small yard and Harry looked out for the first time at Ron's house.", "begin": 2698.073, "end": 2712.913, "localBegin": 673.4, "localEnd": 688.24}, {"id": "c003_f000093", "text": "It looked as though it had once been a large stone pigsty, but extra rooms had been added here and there until it was several storeys high and so crooked it looked as though it was held up by magic (which, Harry reminded himself, it probably was). Four or five chimneys were perched on top of the red roof. A lop-sided sign stuck in the ground near the entrance read 'The Burrow'. Round the front door lay a jumble of wellington boots and a very rusty cauldron. Several fat brown chickens were pecking their way around the yard.", "begin": 2712.913, "end": 2744.153, "localBegin": 688.24, "localEnd": 719.48}, {"id": "c003_f000094", "text": "'It's not much,' said Ron.", "begin": 2744.153, "end": 2746.313, "localBegin": 719.48, "localEnd": 721.64}, {"id": "c003_f000095", "text": "'It's brilliant,' said Harry happily, thinking of Privet Drive.", "begin": 2746.313, "end": 2752.073, "localBegin": 721.64, "localEnd": 727.4}, {"id": "c003_f000096", "text": "They got out of the car.", "begin": 2752.073, "end": 2754.353, "localBegin": 727.4, "localEnd": 729.68}, {"id": "c003_f000097", "text": "'Now, we'll go upstairs really quietly,' said Fred, 'and wait for Mum to call us for breakfast. Then Ron, you come bounding downstairs going, 'Mum, look who turned up in the night!' and", "begin": 2754.353, "end": 2764.753, "localBegin": 729.68, "localEnd": 740.08}, {"id": "c003_f000098", "text": "she'll be all pleased to see Harry and no one need ever know we flew the car.'", "begin": 2764.753, "end": 2769.033, "localBegin": 740.08, "localEnd": 744.36}, {"id": "c003_f000099", "text": "'Right,' said Ron. 'Come on, Harry, I sleep at the -'", "begin": 2769.033, "end": 2775.473, "localBegin": 744.36, "localEnd": 750.8}, {"id": "c003_f000100", "text": "Ron had gone a nasty greenish colour, his eyes fixed on the house. The other three wheeled around.", "begin": 2775.473, "end": 2781.753, "localBegin": 750.8, "localEnd": 757.08}, {"id": "c003_f000101", "text": "Mrs Weasley was marching across the yard, scattering chickens, and for a short, plump, kind-faced woman, it was remarkable how much she looked like a sabre-toothed tiger.", "begin": 2781.753, "end": 2790.913, "localBegin": 757.08, "localEnd": 766.24}, {"id": "c003_f000102", "text": "'Ah,' said Fred.", "begin": 2790.913, "end": 2794.073, "localBegin": 766.24, "localEnd": 769.4}, {"id": "c003_f000103", "text": "'Oh dear,' said George.", "begin": 2794.073, "end": 2797.633, "localBegin": 769.4, "localEnd": 772.96}, {"id": "c003_f000104", "text": "Mrs Weasley came to a halt in front of them, her hands on her hips, staring from one guilty face to the next. She was wearing a flowered apron with a wand sticking out of the pocket.", "begin": 2797.633, "end": 2806.993, "localBegin": 772.96, "localEnd": 782.32}, {"id": "c003_f000105", "text": "'So,' she said.", "begin": 2806.993, "end": 2810.753, "localBegin": 782.32, "localEnd": 786.08}, {"id": "c003_f000106", "text": "'Morning, Mum,' said George, in what he clearly thought was a jaunty, winning voice.", "begin": 2810.753, "end": 2815.193, "localBegin": 786.08, "localEnd": 790.52}, {"id": "c003_f000107", "text": "'Have you any idea how worried I've been?' said Mrs Weasley in a deadly whisper.", "begin": 2815.193, "end": 2820.673, "localBegin": 790.52, "localEnd": 796.0}, {"id": "c003_f000108", "text": "'Sorry, Mum, but see, we had to -'", "begin": 2820.673, "end": 2822.393, "localBegin": 796.0, "localEnd": 797.72}, {"id": "c003_f000109", "text": "All three of Mrs Weasley's sons were taller than she was, but they cowered as her rage broke over them.", "begin": 2822.393, "end": 2828.313, "localBegin": 797.72, "localEnd": 803.64}, {"id": "c003_f000110", "text": "'Beds empty! No note! Car gone ... could have crashed ... out of my mind with worry ... did you care? ... never, as long as I've lived ... you wait until your father gets home, we never had trouble like this from Bill or Charlie or Percy ...'", "begin": 2828.313, "end": 2842.953, "localBegin": 803.64, "localEnd": 818.28}, {"id": "c003_f000111", "text": "'Perfect Percy,' muttered Fred.", "begin": 2842.953, "end": 2845.193, "localBegin": 818.28, "localEnd": 820.52}, {"id": "c003_f000112", "text": "'YOU COULD DO WITH TAKING A LEAF OUT OF PERCY'S BOOK!' yelled Mrs Weasley, prodding a finger in Fred's chest. 'You could have died, you could have been seen, you could have lost your father his job -'", "begin": 2845.193, "end": 2857.713, "localBegin": 820.52, "localEnd": 833.04}, {"id": "c003_f000113", "text": "It seemed to go on for hours. Mrs Weasley had shouted herself hoarse before she turned on Harry, who backed away.", "begin": 2857.713, "end": 2865.673, "localBegin": 833.04, "localEnd": 841.0}, {"id": "c003_f000114", "text": "'I'm very pleased to see you, Harry, dear,' she said, 'Come in and have some breakfast.'", "begin": 2865.673, "end": 2871.193, "localBegin": 841.0, "localEnd": 846.52}, {"id": "c003_f000115", "text": "She turned and walked back into the house and Harry, after a nervous glance at Ron, who nodded encouragingly, followed her.", "begin": 2871.193, "end": 2879.433, "localBegin": 846.52, "localEnd": 854.76}, {"id": "c003_f000116", "text": "The kitchen was small and rather cramped. There was a scrubbed wooden table and chairs in the middle and Harry sat down on the edge of his seat, looking around. He had never been in a wizard house before.", "begin": 2879.433, "end": 2892.153, "localBegin": 854.76, "localEnd": 867.48}, {"id": "c003_f000117", "text": "The clock on the wall opposite him had only one hand and no numbers at all. Written around the edge were things like 'Time to make tea', 'Time to feed the chickens' and 'You're late'. Books were stacked three deep on the mantelpiece, books with titles like Charm Your Own Cheese, Enchantment in Baking and One Minute Feasts - It's Magic! And unless Harry's ears were deceiving him, the old radio next to the sink had just announced that coming up was 'Witching Hour, with the popular singing sorceress, Celestina Warbeck'.", "begin": 2892.153, "end": 2929.153, "localBegin": 867.48, "localEnd": 904.48}, {"id": "c003_f000118", "text": "Mrs Weasley was clattering around, cooking breakfast a little haphazardly, throwing dirty looks at her sons as she threw sausages into the frying pan. Every now and then she muttered things like 'don't know what you were thinking of' and 'never would have believed it'.", "begin": 2929.153, "end": 2944.073, "localBegin": 904.48, "localEnd": 919.4}, {"id": "c003_f000119", "text": "'I don't blame you, dear,' she assured Harry, tipping eight or nine sausages onto his plate. 'Arthur and I have been worried about you, too. Just last night we were saying we'd come and get you ourselves if you hadn't written back to Ron by Friday. But really' (she was now adding three fried eggs to his plate), 'flying an illegal car halfway across the country - anyone could have seen you -'", "begin": 2944.073, "end": 2967.873, "localBegin": 919.4, "localEnd": 943.2}, {"id": "c003_f000120", "text": "She flicked her wand casually at the washing-up in the sink, which began to clean itself, clinking gently in the background.", "begin": 2967.873, "end": 2975.313, "localBegin": 943.2, "localEnd": 950.64}, {"id": "c003_f000121", "text": "'It was cloudy, Mum!' said Fred.", "begin": 2975.313, "end": 2979.793, "localBegin": 950.64, "localEnd": 955.12}, {"id": "c003_f000122", "text": "'You keep your mouth closed while you're eating!' Mrs Weasley snapped.", "begin": 2979.793, "end": 2983.993, "localBegin": 955.12, "localEnd": 959.32}, {"id": "c003_f000123", "text": "'They were starving him, Mum!' said George.", "begin": 2983.993, "end": 2987.033, "localBegin": 959.32, "localEnd": 962.36}, {"id": "c003_f000124", "text": "'And you!' said Mrs Weasley, but it was with a slightly softened expression that she started cutting Harry bread and buttering it for him.", "begin": 2987.033, "end": 2995.913, "localBegin": 962.36, "localEnd": 971.24}, {"id": "c003_f000125", "text": "At that moment, there was a diversion in the form of a small, red-headed figure in a long nightdress, who appeared in the kitchen, gave a small squeal, and ran out again.", "begin": 2995.913, "end": 3005.473, "localBegin": 971.24, "localEnd": 980.8}, {"id": "c003_f000126", "text": "'Ginny,' said Ron in an undertone to Harry. 'My sister. She's been talking about you all summer.'", "begin": 3005.473, "end": 3012.273, "localBegin": 980.8, "localEnd": 987.6}, {"id": "c003_f000127", "text": "'Yeah, she'll be wanting your autograph, Harry,' grinned Fred, but he caught his mother's eye and bent his face over his plate without another word. Nothing more was said until all four plates were clean, which took a surprisingly short time.", "begin": 3012.273, "end": 3026.833, "localBegin": 987.6, "localEnd": 1002.16}, {"id": "c003_f000128", "text": "'Blimey, I'm tired,' yawned Fred, setting down his knife and", "begin": 3026.833, "end": 3033.033, "localBegin": 1002.16, "localEnd": 1008.36}, {"id": "c003_f000129", "text": "fork at last. 'I think I'll go to bed and -'", "begin": 3033.033, "end": 3035.873, "localBegin": 1008.36, "localEnd": 1011.2}, {"id": "c003_f000130", "text": "'You will not,' snapped Mrs Weasley. 'It's your own fault you've been up all night. You're going to de-gnome the garden for me, they're getting completely out of hand again.'", "begin": 3035.873, "end": 3046.433, "localBegin": 1011.2, "localEnd": 1021.76}, {"id": "c003_f000131", "text": "'Oh, Mum -'", "begin": 3046.433, "end": 3047.153, "localBegin": 1021.76, "localEnd": 1022.48}, {"id": "c003_f000132", "text": "'And you two,' she said, glaring at Ron and George. 'You can go up to bed, dear,' she added to Harry. 'You didn't ask them to fly that wretched car.'", "begin": 3047.153, "end": 3056.313, "localBegin": 1022.48, "localEnd": 1031.64}, {"id": "c003_f000133", "text": "But Harry, who felt wide awake, said quickly, 'I'll help Ron, I've never seen a de-gnoming -'", "begin": 3056.313, "end": 3061.513, "localBegin": 1031.64, "localEnd": 1036.84}, {"id": "c003_f000134", "text": "'That's very sweet of you, dear, but it's dull work,' said Mrs Weasley. 'Now, let's see what Lockhart's got to say on the subject.'", "begin": 3061.513, "end": 3069.513, "localBegin": 1036.84, "localEnd": 1044.84}, {"id": "c003_f000135", "text": "And she pulled a heavy book from the stack on the mantelpiece. George groaned.", "begin": 3069.513, "end": 3074.313, "localBegin": 1044.84, "localEnd": 1049.64}, {"id": "c003_f000136", "text": "'Mum, we know how to de-gnome a garden.'", "begin": 3074.313, "end": 3078.553, "localBegin": 1049.64, "localEnd": 1053.88}, {"id": "c003_f000137", "text": "Harry looked at the cover of Mrs Weasley's book. Written across it in fancy gold letters were the words: Gilderoy Lockhart's Guide to Household Pests. There was a big photograph on the front of a very good-looking wizard with wavy blond hair and bright blue eyes. As always in the wizarding world, the photograph was moving; the wizard, who Harry supposed was Gilderoy Lockhart, kept winking cheekily up at them all. Mrs Weasley beamed down at him.", "begin": 3078.553, "end": 3107.873, "localBegin": 1053.88, "localEnd": 1083.2}, {"id": "c003_f000138", "text": "'Oh, he is marvellous,' she said, 'he knows his household pests, all right, it's a wonderful book ...'", "begin": 3107.873, "end": 3114.473, "localBegin": 1083.2, "localEnd": 1089.8}, {"id": "c003_f000139", "text": "'Mum fancies him,' said Fred, in a very audible whisper.", "begin": 3114.473, "end": 3120.073, "localBegin": 1089.8, "localEnd": 1095.4}, {"id": "c003_f000140", "text": "'Don't be so ridiculous, Fred,' said Mrs Weasley, her cheeks rather pink. 'All right, if you think you know better than Lockhart, you can go and get on with it, and woe betide you if there's a single gnome in that garden when I come out to inspect it.'", "begin": 3120.073, "end": 3135.153, "localBegin": 1095.4, "localEnd": 1110.48}, {"id": "c003_f000141", "text": "Yawning and grumbling, the Weasleys slouched outside with Harry behind them. The garden was large and, in Harry's eyes, exactly what a garden should be. The Dursleys wouldn't have liked it - there were plenty of weeds, and the grass needed cutting - but there were gnarled trees all around the walls, plants Harry had never seen spilling from every flowerbed and a big green pond full of frogs.", "begin": 3135.153, "end": 3160.673, "localBegin": 1110.48, "localEnd": 1136.0}, {"id": "c003_f000142", "text": "'Muggles have garden gnomes, too, you know,' Harry told Ron as they crossed the lawn.", "begin": 3160.673, "end": 3166.273, "localBegin": 1136.0, "localEnd": 1141.6}, {"id": "c003_f000143", "text": "'Yeah, I've seen those things they think are gnomes,' said Ron, bent double with his head in a peony bush. 'Like fat little Father Christmases with fishing rods ...'", "begin": 3166.273, "end": 3174.753, "localBegin": 1141.6, "localEnd": 1150.08}, {"id": "c003_f000144", "text": "There was a violent scuffling noise, the peony bush shuddered and Ron straightened up. 'This is a gnome,' he said grimly.", "begin": 3174.753, "end": 3183.233, "localBegin": 1150.08, "localEnd": 1158.56}, {"id": "c003_f000145", "text": "'Gerroff me! Gerroff me!' squealed the gnome.", "begin": 3183.233, "end": 3186.393, "localBegin": 1158.56, "localEnd": 1161.72}, {"id": "c003_f000146", "text": "It was certainly nothing like Father Christmas. It was small and leathery-looking, with a large, knobbly, bald head exactly like a potato. Ron held it at arm's length as it kicked out at him with its horny little feet; he grasped it around the ankles and turned it upside-down.", "begin": 3186.393, "end": 3202.553, "localBegin": 1161.72, "localEnd": 1177.88}, {"id": "c003_f000147", "text": "'This is what you have to do,' he said. He raised the gnome above his head ('Gerroff me!') and started to swing it in great circles like a lasso. Seeing the shocked look on Harry's face, Ron added, 'It doesn't hurt them - you've just got to make them really dizzy so they can't find their way back to the gnomeholes.'", "begin": 3202.553, "end": 3220.153, "localBegin": 1177.88, "localEnd": 1195.48}, {"id": "c003_f000148", "text": "He let go of the gnome's ankles: it flew twenty feet into the air and landed with a thud in the field over the hedge.", "begin": 3220.153, "end": 3227.393, "localBegin": 1195.48, "localEnd": 1202.72}, {"id": "c003_f000149", "text": "'Pitiful,' said Fred. 'I bet I can get mine beyond that stump.'", "begin": 3227.393, "end": 3232.913, "localBegin": 1202.72, "localEnd": 1208.24}, {"id": "c003_f000150", "text": "Harry learned quickly not to feel too sorry for the gnomes. He decided just to drop the first one he caught over the hedge, but the gnome, sensing weakness, sank its razor-sharp teeth into Harry's finger and he had a hard job shaking it off until -", "begin": 3232.913, "end": 3247.593, "localBegin": 1208.24, "localEnd": 1222.92}, {"id": "c003_f000151", "text": "'Wow, Harry - that must've been fifty feet ...'", "begin": 3247.593, "end": 3250.793, "localBegin": 1222.92, "localEnd": 1226.12}, {"id": "c003_f000152", "text": "The air was soon thick with flying gnomes.", "begin": 3250.793, "end": 3254.593, "localBegin": 1226.12, "localEnd": 1229.92}, {"id": "c003_f000153", "text": "'See, they're not too bright,' said George, seizing five or six gnomes at once. 'The moment they know the de-gnoming's going on they storm up to have a look. You'd think they'd have learned by now just to stay put.'", "begin": 3254.593, "end": 3267.033, "localBegin": 1229.92, "localEnd": 1242.36}, {"id": "c003_f000154", "text": "Soon, the crowd of gnomes in the field started walking away in a straggling line, their little shoulders hunched.", "begin": 3267.033, "end": 3274.313, "localBegin": 1242.36, "localEnd": 1249.64}, {"id": "c003_f000155", "text": "'They'll be back,' said Ron, as they watched the gnomes disappear into the hedge on the other side of the field. 'They love it here ... Dad's too soft with them, he thinks they're funny ...'", "begin": 3274.313, "end": 3285.233, "localBegin": 1249.64, "localEnd": 1260.56}, {"id": "c003_f000156", "text": "Just then, the front door slammed.", "begin": 3285.233, "end": 3288.433, "localBegin": 1260.56, "localEnd": 1263.76}, {"id": "c003_f000157", "text": "'He's back!' said George. 'Dad's home!'", "begin": 3288.433, "end": 3291.993, "localBegin": 1263.76, "localEnd": 1267.32}, {"id": "c003_f000158", "text": "They hurried through the garden and back into the house.", "begin": 3291.993, "end": 3295.313, "localBegin": 1267.32, "localEnd": 1270.64}, {"id": "c003_f000159", "text": "Mr Weasley was slumped in a kitchen chair with his glasses off and his eyes closed. He was a thin man, going bald, but the little hair he had was as red as any of his children's. He was wearing", "begin": 3295.313, "end": 3307.713, "localBegin": 1270.64, "localEnd": 1283.04}, {"id": "c003_f000160", "text": "long green robes which were dusty and travel-worn.", "begin": 3307.713, "end": 3310.793, "localBegin": 1283.04, "localEnd": 1286.12}, {"id": "c003_f000161", "text": "'What a night,' he mumbled, groping for the teapot as they all sat down around him. 'Nine raids. Nine! And old Mundungus Fletcher tried to put a hex on me when I had my back turned ...'", "begin": 3310.793, "end": 3324.113, "localBegin": 1286.12, "localEnd": 1299.44}, {"id": "c003_f000162", "text": "Mr Weasley took a long gulp of tea and sighed.", "begin": 3324.113, "end": 3327.873, "localBegin": 1299.44, "localEnd": 1303.2}, {"id": "c003_f000163", "text": "'Find anything, Dad?' said Fred eagerly.", "begin": 3327.873, "end": 3331.393, "localBegin": 1303.2, "localEnd": 1306.72}, {"id": "c003_f000164", "text": "'All I got were a few shrinking door-keys and a biting kettle,' yawned Mr Weasley. 'There was some pretty nasty stuff that wasn't my department, though. Mortlake was taken away for questioning about some extremely odd ferrets, but that's the Committee on Experimental Charms, thank goodness ...'", "begin": 3331.393, "end": 3349.953, "localBegin": 1306.72, "localEnd": 1325.28}, {"id": "c003_f000165", "text": "'Why would anyone bother making door-keys shrink?' said George.", "begin": 3349.953, "end": 3354.833, "localBegin": 1325.28, "localEnd": 1330.16}, {"id": "c003_f000166", "text": "'Just Muggle-baiting,' sighed Mr Weasley. 'Sell them a key that keeps shrinking to nothing so they can never find it when they need it ... Of course, it's very hard to convict anyone because no Muggle would admit their key keeps shrinking - they'll insist they just keep losing it. Bless them, they'll go to any lengths to ignore magic, even if it's staring them in the face ... but the things our lot have taken to enchanting, you wouldn't believe -'", "begin": 3354.833, "end": 3383.073, "localBegin": 1330.16, "localEnd": 1358.4}, {"id": "c003_f000167", "text": "'LIKE CARS, FOR INSTANCE?'", "begin": 3383.073, "end": 3385.753, "localBegin": 1358.4, "localEnd": 1361.08}, {"id": "c003_f000168", "text": "Mrs Weasley had appeared, holding a long poker like a sword. Mr Weasley's eyes jerked open. He stared guiltily at his wife.", "begin": 3385.753, "end": 3393.833, "localBegin": 1361.08, "localEnd": 1369.16}, {"id": "c003_f000169", "text": "'C-cars, Molly, dear?'", "begin": 3393.833, "end": 3396.113, "localBegin": 1369.16, "localEnd": 1371.44}, {"id": "c003_f000170", "text": "'Yes, Arthur, cars,' said Mrs Weasley, her eyes flashing. 'Imagine a wizard buying a rusty old car and telling his wife all he wanted to do with it was take it apart to see how it worked, while really he was enchanting it to make it fly.'", "begin": 3396.113, "end": 3412.113, "localBegin": 1371.44, "localEnd": 1387.44}, {"id": "c003_f000171", "text": "Mr Weasley blinked.", "begin": 3412.113, "end": 3413.953, "localBegin": 1387.44, "localEnd": 1389.28}, {"id": "c003_f000172", "text": "'Well, dear, I think you'll find that he would be quite within the law to do that, even if, er, he maybe would have done better to, um, tell his wife the truth ... There's a loophole in the law, you'll find ... as long as he wasn't intending to fly the car, the fact that the car could fly wouldn't -'", "begin": 3413.953, "end": 3432.353, "localBegin": 1389.28, "localEnd": 1407.68}, {"id": "c003_f000173", "text": "'Arthur Weasley, you made sure there was a loophole when you wrote that law!' shouted Mrs Weasley. 'Just so you could carry on tinkering with all that Muggle rubbish in your shed! And for your information, Harry arrived this morning in the car you weren't intending to fly!'", "begin": 3432.353, "end": 3448.513, "localBegin": 1407.68, "localEnd": 1423.84}, {"id": "c003_f000174", "text": "'Harry?' said Mr Weasley blankly. 'Harry who?'", "begin": 3448.513, "end": 3452.153, "localBegin": 1423.84, "localEnd": 1427.48}, {"id": "c003_f000175", "text": "He looked around, saw Harry and jumped.", "begin": 3452.153, "end": 3455.033, "localBegin": 1427.48, "localEnd": 1430.36}, {"id": "c003_f000176", "text": "'Good Lord, is it Harry Potter? Very pleased to meet you, Ron's told us so much about -'", "begin": 3455.033, "end": 3461.433, "localBegin": 1430.36, "localEnd": 1436.76}, {"id": "c003_f000177", "text": "'Your sons flew that car to Harry's house and back last night!' shouted Mrs Weasley, 'What have you got to say about that, eh?'", "begin": 3461.433, "end": 3468.553, "localBegin": 1436.76, "localEnd": 1443.88}, {"id": "c003_f000178", "text": "'Did you really?' said Mr Weasley eagerly. 'Did it go all right? I-I mean,' he faltered, as sparks flew from Mrs Weasley's eyes, 'thatthat was very wrong, boys - very wrong indeed ...'", "begin": 3468.553, "end": 3482.153, "localBegin": 1443.88, "localEnd": 1457.48}, {"id": "c003_f000179", "text": "'Let's leave them to it,' Ron muttered to Harry, as Mrs Weasley swelled like a bullfrog. 'Come on, I'll show you my bedroom.'", "begin": 3482.153, "end": 3490.113, "localBegin": 1457.48, "localEnd": 1465.44}, {"id": "c003_f000180", "text": "They slipped out of the kitchen and down a narrow passageway to an uneven staircase, which zigzagged its way up through the house. On the third landing, a door stood ajar. Harry just caught sight of a pair of bright brown eyes staring at him before it closed with a snap.", "begin": 3490.113, "end": 3506.673, "localBegin": 1465.44, "localEnd": 1482.0}, {"id": "c003_f000181", "text": "'Ginny,' said Ron. 'You don't know how weird it is for her to be this shy, she never shuts up normally -'", "begin": 3506.673, "end": 3514.513, "localBegin": 1482.0, "localEnd": 1489.84}, {"id": "c003_f000182", "text": "They climbed two more flights until they reached a door with peeling paint and a small plaque on it, saying 'Ronald's Room'.", "begin": 3514.513, "end": 3522.113, "localBegin": 1489.84, "localEnd": 1497.44}, {"id": "c003_f000183", "text": "Harry stepped in, his head almost touching the sloping ceiling, and blinked. It was like walking into a furnace: nearly everything in Ron's room seemed to be a violent shade of orange: the bedspread, the walls, even the ceiling. Then Harry realised that Ron had covered nearly every inch of the shabby wallpaper with posters of the same seven witches and wizards, all wearing bright orange robes, carrying broomsticks and waving energetically.", "begin": 3522.113, "end": 3548.833, "localBegin": 1497.44, "localEnd": 1524.16}, {"id": "c003_f000184", "text": "'Your Quidditch team?' said Harry.", "begin": 3548.833, "end": 3552.433, "localBegin": 1524.16, "localEnd": 1527.76}, {"id": "c003_f000185", "text": "'The Chudley Cannons,' said Ron, pointing at the orange bedspread, which was emblazoned with two giant black Cs and a speeding cannonball. 'Ninth in the league.'", "begin": 3552.433, "end": 3563.273, "localBegin": 1527.76, "localEnd": 1538.6}, {"id": "c003_f000186", "text": "Ron's school spellbooks were stacked untidily in a corner, next to a pile of comics which all seemed to feature The Adventures of Martin Miggs, the Mad Muggle. Ron's magic wand was lying on top of a fish tank full of frogspawn on the windowsill, next to his fat grey rat, Scabbers, who was snoozing in a patch of sun.", "begin": 3563.273, "end": 3583.953, "localBegin": 1538.6, "localEnd": 1559.28}, {"id": "c003_f000187", "text": "Harry stepped over a pack of Self-Shuffling playing cards on the floor and looked out of the tiny window. In the field far below he could see a gang of gnomes sneaking, one by one, back through the Weasleys' hedge. Then he turned to look at Ron, who was watching him almost nervously, as though waiting for his opinion.", "begin": 3583.953, "end": 3602.313, "localBegin": 1559.28, "localEnd": 1577.64}, {"id": "c003_f000188", "text": "'It's a bit small,' said Ron quickly. 'Not like that room you had with the Muggles. And I'm right underneath the ghoul in the attic, he's always banging on the pipes and groaning ...'", "begin": 3602.313, "end": 3613.593, "localBegin": 1577.64, "localEnd": 1588.92}, {"id": "c003_f000189", "text": "But Harry, grinning widely, said, 'This is the best house I've ever been in.'", "begin": 3613.593, "end": 3621.113, "localBegin": 1588.92, "localEnd": 1596.44}, {"id": "c003_f000190", "text": "Ron's ears went pink.", "begin": 3621.113, "end": 3626.673, "localBegin": 1596.44, "localEnd": 1602.0}]}, {"kind": "chapter", "number": 4, "title": "At Flourish and Blotts", "audio": "audio/chapter_004.mp3", "start": 3626.673, "end": 5778.129, "duration": 2151.456, "paragraphs": [{"id": "c004_f000001", "text": "Chapter Four. At Flourish and Blotts.", "begin": 3626.673, "end": 3632.033, "localBegin": 0.0, "localEnd": 5.36}, {"id": "c004_f000002", "text": "Life at The Burrow was as different as possible from life in Privet Drive. The Dursleys liked everything neat and ordered; the Weasleys' house burst with the strange and unexpected. Harry got a shock the first time he looked in the mirror over the kitchen mantelpiece and it shouted, 'Tuck your shirt in, scruffy!' The ghoul in the attic howled and dropped pipes whenever he felt things were getting too quiet, and small explosions from Fred and George's bedroom were considered perfectly normal. What Harry found most unusual about life at Ron's, however, wasn't the talking mirror or the clanking ghoul: it was the fact that everybody there seemed to like him.", "begin": 3632.033, "end": 3670.353, "localBegin": 5.36, "localEnd": 43.68}, {"id": "c004_f000003", "text": "Mrs Weasley fussed over the state of his socks and tried to force him to eat fourth helpings at every meal. Mr Weasley liked Harry to sit next to him at the dinner table so that he could bombard him with questions about life with Muggles, asking him to explain how things like plugs and the postal service worked.", "begin": 3670.353, "end": 3689.633, "localBegin": 43.68, "localEnd": 62.96}, {"id": "c004_f000004", "text": "'Fascinating!' he would say, as Harry talked him through using a telephone. 'Ingenious, really, how many ways Muggles have found of getting along without magic.'", "begin": 3689.633, "end": 3700.953, "localBegin": 62.96, "localEnd": 74.28}, {"id": "c004_f000005", "text": "Harry heard from Hogwarts one sunny morning about a week after he had arrived at The Burrow. He and Ron went down to breakfast to find Mr and Mrs Weasley and Ginny already sitting at the kitchen table. The moment she saw Harry, Ginny accidentally knocked her porridge bowl to the floor with a loud clatter. Ginny seemed very prone to knocking things over whenever Harry entered a room. She dived under the table to retrieve the bowl and emerged with her face glowing like the setting sun. Pretending he hadn't noticed this, Harry sat down and took the toast Mrs Weasley offered him.", "begin": 3700.953, "end": 3734.553, "localBegin": 74.28, "localEnd": 107.88}, {"id": "c004_f000006", "text": "'Letters from school,' said Mr Weasley, passing Harry and Ron", "begin": 3734.553, "end": 3739.033, "localBegin": 107.88, "localEnd": 112.36}, {"id": "c004_f000007", "text": "identical envelopes of yellowish parchment, addressed in green ink. 'Dumbledore already knows you're here, Harry - doesn't miss a trick, that man. You two've got them, too,' he added, as Fred and George ambled in, still in their pyjamas.", "begin": 3739.033, "end": 3754.113, "localBegin": 112.36, "localEnd": 127.44}, {"id": "c004_f000008", "text": "For a few minutes there was silence as they all read their letters. Harry's told him to catch the Hogwarts Express as usual from King's Cross station on September the first. There was also a list of the new books he'd need for the coming year.", "begin": 3754.113, "end": 3768.313, "localBegin": 127.44, "localEnd": 141.64}, {"id": "c004_f000009", "text": "Second-year students will require:", "begin": 3768.313, "end": 3770.553, "localBegin": 141.64, "localEnd": 143.88}, {"id": "c004_f000010", "text": "The Standard Book of Spells, Grade 2 by Miranda Goshawk Break with a Banshee by Gilderoy Lockhart Gadding with Ghouls by Gilderoy Lockhart Holidays with Hags by Gilderoy Lockhart Travels with Trolls by Gilderoy Lockhart Voyages with Vampires by Gilderoy Lockhart Wanderings with Werewolves by Gilderoy Lockhart Year with the Yeti by Gilderoy Lockhart", "begin": 3770.553, "end": 3801.593, "localBegin": 143.88, "localEnd": 174.92}, {"id": "c004_f000011", "text": "Fred, who had finished his own list, peered over at Harry's.", "begin": 3801.593, "end": 3805.353, "localBegin": 174.92, "localEnd": 178.68}, {"id": "c004_f000012", "text": "'You've been told to get all Lockhart's books, too!' he said. 'The new Defence Against the Dark Arts teacher must be a fan - bet it's a witch.'", "begin": 3805.353, "end": 3815.873, "localBegin": 178.68, "localEnd": 189.2}, {"id": "c004_f000013", "text": "At this point, Fred caught his mother's eye and quickly busied himself with the marmalade.", "begin": 3815.873, "end": 3821.153, "localBegin": 189.2, "localEnd": 194.48}, {"id": "c004_f000014", "text": "'That lot won't come cheap,' said George, with a quick look at his parents. 'Lockhart's books are really expensive ...'", "begin": 3821.153, "end": 3827.953, "localBegin": 194.48, "localEnd": 201.28}, {"id": "c004_f000015", "text": "'Well, we'll manage,' said Mrs Weasley, but she looked worried. 'I expect we'll be able to pick up a lot of Ginny's things secondhand.'", "begin": 3827.953, "end": 3836.953, "localBegin": 201.28, "localEnd": 210.28}, {"id": "c004_f000016", "text": "'Oh, are you starting at Hogwarts this year?' Harry asked Ginny.", "begin": 3836.953, "end": 3842.353, "localBegin": 210.28, "localEnd": 215.68}, {"id": "c004_f000017", "text": "She nodded, blushing to the roots of her flaming hair, and put her elbow in the butter dish. Fortunately no one saw this except Harry, because just then Ron's elder brother Percy walked in. He was already dressed, his Hogwarts prefect badge pinned to his knitted tank top.", "begin": 3842.353, "end": 3858.473, "localBegin": 215.68, "localEnd": 231.8}, {"id": "c004_f000018", "text": "'Morning, all,' said Percy briskly. 'Lovely day.'", "begin": 3858.473, "end": 3862.793, "localBegin": 231.8, "localEnd": 236.12}, {"id": "c004_f000019", "text": "He sat down in the only remaining chair but leapt up again almost immediately, pulling from underneath him a moulting,", "begin": 3862.793, "end": 3869.313, "localBegin": 236.12, "localEnd": 242.64}, {"id": "c004_f000020", "text": "grey feather duster - at least, that was what Harry thought it was, until he saw that it was breathing.", "begin": 3869.313, "end": 3876.193, "localBegin": 242.64, "localEnd": 249.52}, {"id": "c004_f000021", "text": "'Errol!' said Ron, taking the limp owl from Percy and extracting a letter from under its wing. 'Finally - he's got Hermione's answer. I wrote to her saying we were going to try and rescue you from the Dursleys.'", "begin": 3876.193, "end": 3889.593, "localBegin": 249.52, "localEnd": 262.92}, {"id": "c004_f000022", "text": "He carried Errol to a perch just inside the back door and tried to stand him on it, but Errol flopped straight off again so Ron laid him on the draining board instead, muttering, 'Pathetic.' Then he ripped open Hermione's letter and read it out loud:", "begin": 3889.593, "end": 3905.513, "localBegin": 262.92, "localEnd": 278.84}, {"id": "c004_f000023", "text": "Dear Ron, and Harry if you're there, I hope everything went all right and that Harry is OK and", "begin": 3905.513, "end": 3911.153, "localBegin": 278.84, "localEnd": 284.48}, {"id": "c004_f000024", "text": "that you didn't do anything illegal to get him out, Ron, because", "begin": 3911.153, "end": 3914.153, "localBegin": 284.48, "localEnd": 287.48}, {"id": "c004_f000025", "text": "that would get Harry into trouble, too. I've been really worried", "begin": 3914.153, "end": 3917.473, "localBegin": 287.48, "localEnd": 290.8}, {"id": "c004_f000026", "text": "and if Harry is all right, will you please let me know at once,", "begin": 3917.473, "end": 3920.593, "localBegin": 290.8, "localEnd": 293.92}, {"id": "c004_f000027", "text": "but perhaps it would be better if you used a different owl,", "begin": 3920.593, "end": 3923.633, "localBegin": 293.92, "localEnd": 296.96}, {"id": "c004_f000028", "text": "because I think another delivery might finish your one off. I'm very busy with school work, of course - 'How can she", "begin": 3923.633, "end": 3930.513, "localBegin": 296.96, "localEnd": 303.84}, {"id": "c004_f000029", "text": "be?' said Ron in horror. 'We're on holiday!' - and we're going", "begin": 3930.513, "end": 3934.233, "localBegin": 303.84, "localEnd": 307.56}, {"id": "c004_f000030", "text": "to London next Wednesday to buy my new books. Why don't we", "begin": 3934.233, "end": 3937.593, "localBegin": 307.56, "localEnd": 310.92}, {"id": "c004_f000031", "text": "meet in Diagon Alley? Let me know what's happening as soon as you can, love from", "begin": 3937.593, "end": 3942.433, "localBegin": 310.92, "localEnd": 315.76}, {"id": "c004_f000032", "text": "Hermione.", "begin": 3942.433, "end": 3944.433, "localBegin": 315.76, "localEnd": 317.76}, {"id": "c004_f000033", "text": "'Well, that fits in nicely, we can go and get all your things then, too,' said Mrs Weasley, starting to clear the table. 'What're you all up to today?'", "begin": 3944.433, "end": 3954.353, "localBegin": 317.76, "localEnd": 327.68}, {"id": "c004_f000034", "text": "Harry, Ron, Fred and George were planning to go up the hill to a small paddock the Weasleys owned. It was surrounded by trees that blocked it from view of the village below, meaning that they could practise Quidditch there, as long as they didn't fly too high. They couldn't use real Quidditch balls, which would have been hard to explain if they had escaped and flown away over the village; instead they threw apples for each other to catch. They took it in turns to ride Harry's Nimbus Two Thousand, which was easily the best broom; Ron's old Shooting Star was often outstripped by passing butterflies.", "begin": 3954.353, "end": 3989.913, "localBegin": 327.68, "localEnd": 363.24}, {"id": "c004_f000035", "text": "Five minutes later they were marching up the hill, broomsticks over their shoulders. They had asked Percy if he wanted to join", "begin": 3989.913, "end": 3996.033, "localBegin": 363.24, "localEnd": 369.36}, {"id": "c004_f000036", "text": "them, but he had said he was busy. Harry had only seen Percy at meal-times so far; he stayed shut in his room the rest of the time.", "begin": 3996.033, "end": 4005.353, "localBegin": 369.36, "localEnd": 378.68}, {"id": "c004_f000037", "text": "'Wish I knew what he was up to,' said Fred, frowning. 'He's not himself. His exam results came the day before you did; twelve O.W.Ls and he hardly gloated at all.'", "begin": 4005.353, "end": 4016.873, "localBegin": 378.68, "localEnd": 390.2}, {"id": "c004_f000038", "text": "'Ordinary Wizarding Levels,' George explained, seeing Harry's puzzled look. 'Bill got twelve, too. If we're not careful, we'll have another Head Boy in the family. I don't think I could stand the shame.'", "begin": 4016.873, "end": 4029.633, "localBegin": 390.2, "localEnd": 402.96}, {"id": "c004_f000039", "text": "Bill was the oldest Weasley brother. He and the next brother, Charlie, had already left Hogwarts. Harry had never met either of them, but knew that Charlie was in Romania, studying dragons, and Bill in Egypt, working for the wizards' bank, Gringotts.", "begin": 4029.633, "end": 4046.153, "localBegin": 402.96, "localEnd": 419.48}, {"id": "c004_f000040", "text": "'Dunno how Mum and Dad are going to afford all our school stuff this year,' said George after a while. 'Five sets of Lockhart books! And Ginny needs robes and a wand and everything ...'", "begin": 4046.153, "end": 4058.673, "localBegin": 419.48, "localEnd": 432.0}, {"id": "c004_f000041", "text": "Harry said nothing. He felt a bit awkward. Stored in an underground vault at Gringotts in London was a small fortune that his parents had left him. Of course, it was only in the wizarding world that he had money; you couldn't use Galleons, Sickles and Knuts in Muggle shops. He had never mentioned his Gringotts bank account to the Dursleys; he didn't think their horror of anything connected with magic would stretch to a large pile of gold. * Mrs Weasley woke them all early the following Wednesday. After a quick half-a-dozen bacon sandwiches each, they pulled on their coats and Mrs Weasley took a flowerpot off the kitchen mantelpiece and peered inside.", "begin": 4058.673, "end": 4098.593, "localBegin": 432.0, "localEnd": 471.92}, {"id": "c004_f000042", "text": "'We're running low, Arthur,' she sighed. 'We'll have to buy some more today ... ah well, guests first! After you, Harry dear!'", "begin": 4098.593, "end": 4107.513, "localBegin": 471.92, "localEnd": 480.84}, {"id": "c004_f000043", "text": "And she offered him the flowerpot.", "begin": 4107.513, "end": 4109.713, "localBegin": 480.84, "localEnd": 483.04}, {"id": "c004_f000044", "text": "Harry stared at them all watching him.", "begin": 4109.713, "end": 4112.793, "localBegin": 483.04, "localEnd": 486.12}, {"id": "c004_f000045", "text": "'W-what am I supposed to do?' he stammered.", "begin": 4112.793, "end": 4116.633, "localBegin": 486.12, "localEnd": 489.96}, {"id": "c004_f000046", "text": "'He's never travelled by Floo powder,' said Ron suddenly. 'Sorry, Harry, I forgot.'", "begin": 4116.633, "end": 4121.753, "localBegin": 489.96, "localEnd": 495.08}, {"id": "c004_f000047", "text": "'Never?' said Mr Weasley. 'But how did you get to Diagon Alley to buy your school things last year?'", "begin": 4121.753, "end": 4128.993, "localBegin": 495.08, "localEnd": 502.32}, {"id": "c004_f000048", "text": "'I went on the Underground -'", "begin": 4128.993, "end": 4130.553, "localBegin": 502.32, "localEnd": 503.88}, {"id": "c004_f000049", "text": "'Really?' said Mr Weasley eagerly. 'Were there escapators? How exactly -'", "begin": 4130.553, "end": 4135.553, "localBegin": 503.88, "localEnd": 508.88}, {"id": "c004_f000050", "text": "'Not now, Arthur,' said Mrs Weasley. 'Floo powder's a lot quicker, dear, but goodness me, if you've never used it before -'", "begin": 4135.553, "end": 4142.313, "localBegin": 508.88, "localEnd": 515.64}, {"id": "c004_f000051", "text": "'He'll be all right, Mum,' said Fred. 'Harry, watch us first.'", "begin": 4142.313, "end": 4147.033, "localBegin": 515.64, "localEnd": 520.36}, {"id": "c004_f000052", "text": "He took a pinch of glittering powder out of the flowerpot, stepped up to the fire and threw the powder into the flames.", "begin": 4147.033, "end": 4154.513, "localBegin": 520.36, "localEnd": 527.84}, {"id": "c004_f000053", "text": "With a roar, the fire turned emerald green and rose higher than Fred, who stepped right into it, shouted, 'Diagon Alley!' and vanished.", "begin": 4154.513, "end": 4163.753, "localBegin": 527.84, "localEnd": 537.08}, {"id": "c004_f000054", "text": "'You must speak clearly, dear,' Mrs Weasley told Harry, as George dipped his hand into the flowerpot. 'And mind you get out at the right grate ...'", "begin": 4163.753, "end": 4172.793, "localBegin": 537.08, "localEnd": 546.12}, {"id": "c004_f000055", "text": "'The right what?' said Harry nervously, as the fire roared and whipped George out of sight too.", "begin": 4172.793, "end": 4178.593, "localBegin": 546.12, "localEnd": 551.92}, {"id": "c004_f000056", "text": "'Well, there are an awful lot of wizard fires to choose from, you know, but as long as you've spoken clearly -'", "begin": 4178.593, "end": 4185.033, "localBegin": 551.92, "localEnd": 558.36}, {"id": "c004_f000057", "text": "'He'll be fine, Molly, don't fuss,' said Mr Weasley, helping himself to Floo powder too.", "begin": 4185.033, "end": 4190.593, "localBegin": 558.36, "localEnd": 563.92}, {"id": "c004_f000058", "text": "'But dear, if he got lost, how would we ever explain to his aunt and uncle?'", "begin": 4190.593, "end": 4195.033, "localBegin": 563.92, "localEnd": 568.36}, {"id": "c004_f000059", "text": "'They wouldn't mind,' Harry reassured her. 'Dudley would think it was a brilliant joke if I got lost up a chimney, don't worry about that.'", "begin": 4195.033, "end": 4202.673, "localBegin": 568.36, "localEnd": 576.0}, {"id": "c004_f000060", "text": "'Well ... all right ... you go after Arthur,' said Mrs Weasley. 'Now, when you get into the fire, say where you're going -'", "begin": 4202.673, "end": 4210.153, "localBegin": 576.0, "localEnd": 583.48}, {"id": "c004_f000061", "text": "'And keep your elbows tucked in,' Ron advised.", "begin": 4210.153, "end": 4212.873, "localBegin": 583.48, "localEnd": 586.2}, {"id": "c004_f000062", "text": "'And your eyes shut,' said Mrs Weasley. 'The soot -'", "begin": 4212.873, "end": 4216.313, "localBegin": 586.2, "localEnd": 589.64}, {"id": "c004_f000063", "text": "'Don't fidget,' said Ron. 'Or you might well fall out of the wrong fireplace -'", "begin": 4216.313, "end": 4220.153, "localBegin": 589.64, "localEnd": 593.48}, {"id": "c004_f000064", "text": "'But don't panic and get out too early, wait until you see Fred and George.'", "begin": 4220.153, "end": 4223.713, "localBegin": 593.48, "localEnd": 597.04}, {"id": "c004_f000065", "text": "Trying hard to bear all this in mind, Harry took a pinch of Floo powder and walked to the edge of the fire. He took a deep breath, scattered the powder into the flames and stepped forward; the fire felt like a warm breeze; he opened his mouth and immediately swallowed a lot of hot ash.", "begin": 4223.713, "end": 4240.233, "localBegin": 597.04, "localEnd": 613.56}, {"id": "c004_f000066", "text": "'D-Dia-gon Alley,' he coughed.", "begin": 4240.233, "end": 4244.513, "localBegin": 613.56, "localEnd": 617.84}, {"id": "c004_f000067", "text": "It felt as though he was being sucked down a giant plug hole. He seemed to be spinning very fast ... the roaring in his ears was deafening ... he tried to keep his eyes open but the whirl of green flames made him feel sick ... something hard knocked his elbow", "begin": 4244.513, "end": 4258.233, "localBegin": 617.84, "localEnd": 631.56}, {"id": "c004_f000068", "text": "and he tucked it in tightly, still spinning and spinning ... now it felt as though cold hands were slapping his face ... squinting through his glasses he saw a blurred stream of fireplaces and snatched glimpses of the rooms beyond ... his bacon sandwiches were churning inside him ... He closed his eyes again wishing it would stop, and then - he fell, face forward, onto cold stone and felt his glasses shatter.", "begin": 4258.233, "end": 4284.273, "localBegin": 631.56, "localEnd": 657.6}, {"id": "c004_f000069", "text": "Dizzy and bruised, covered in soot, he got gingerly to his feet, holding his broken glasses up to his eyes. He was quite alone, but where he was, he had no idea. All he could tell was that he was standing in the stone fireplace of what looked like a large, dimly lit wizard's shop - but nothing in here was ever likely to be on a Hogwarts school list.", "begin": 4284.273, "end": 4307.993, "localBegin": 657.6, "localEnd": 681.32}, {"id": "c004_f000070", "text": "A glass case nearby held a withered hand on a cushion, a blood-stained pack of cards and a staring glass eye. Evil-looking masks leered down from the walls, an assortment of human bones lay upon the counter and rusty, spiked instruments hung from the ceiling. Even worse, the dark, narrow street Harry could see through the dusty shop window was definitely not Diagon Alley.", "begin": 4307.993, "end": 4334.073, "localBegin": 681.32, "localEnd": 707.4}, {"id": "c004_f000071", "text": "The sooner he got out of here, the better. Nose still stinging where it had hit the hearth, Harry made his way swiftly and silently towards the door, but before he'd got halfway towards it, two people appeared on the other side of the glass - and one of them was the very last person Harry wanted to meet when he was lost, covered in soot and wearing broken glasses: Draco Malfoy.", "begin": 4334.073, "end": 4358.833, "localBegin": 707.4, "localEnd": 732.16}, {"id": "c004_f000072", "text": "Harry looked quickly around and spotted a large black cabinet to his left; he shot inside it and pulled the doors to, leaving a small crack to peer through. Seconds later, a bell clanged, and Malfoy stepped into the shop.", "begin": 4358.833, "end": 4373.513, "localBegin": 732.16, "localEnd": 746.84}, {"id": "c004_f000073", "text": "The man who followed could only be his father. He had the same pale, pointed face and identical cold grey eyes. Mr Malfoy crossed the shop, looking lazily at the items on display, and rang a bell on the counter before turning to his son and saying, 'Touch nothing, Draco.'", "begin": 4373.513, "end": 4395.273, "localBegin": 746.84, "localEnd": 768.6}, {"id": "c004_f000074", "text": "Malfoy, who had reached for the glass eye, said, 'I thought you were going to buy me a present.'", "begin": 4395.273, "end": 4401.553, "localBegin": 768.6, "localEnd": 774.88}, {"id": "c004_f000075", "text": "'I said I would buy you a racing broom,' said his father, drumming his fingers on the counter.", "begin": 4401.553, "end": 4407.953, "localBegin": 774.88, "localEnd": 781.28}, {"id": "c004_f000076", "text": "'What's the good of that if I'm not in the house team?' said Malfoy, looking sulky and bad-tempered. 'Harry Potter got a", "begin": 4407.953, "end": 4414.673, "localBegin": 781.28, "localEnd": 788.0}, {"id": "c004_f000077", "text": "Nimbus Two Thousand last year. Special permission from Dumbledore so he could play for Gryffindor. He's not even that good, it's just because he's famous ... famous for having a stupid scar on his forehead ...'", "begin": 4414.673, "end": 4427.513, "localBegin": 788.0, "localEnd": 800.84}, {"id": "c004_f000078", "text": "Malfoy bent down to examine a shelf full of skulls.", "begin": 4427.513, "end": 4431.273, "localBegin": 800.84, "localEnd": 804.6}, {"id": "c004_f000079", "text": "'... everyone thinks he's so smart, wonderful Potter with his scar and his broomstick -", "begin": 4431.273, "end": 4437.153, "localBegin": 804.6, "localEnd": 810.48}, {"id": "c004_f000080", "text": "'You have told me this at least a dozen times already,' said Mr Malfoy, with a quelling look at his son, 'and I would remind you that it is not - prudent - to appear less than fond of Harry Potter, not when most of our kind regard him as the hero who made the Dark Lord disappear - ah, Mr Borgin.'", "begin": 4437.153, "end": 4460.673, "localBegin": 810.48, "localEnd": 834.0}, {"id": "c004_f000081", "text": "A stooping man had appeared behind the counter, smoothing his greasy hair back from his face.", "begin": 4460.673, "end": 4466.073, "localBegin": 834.0, "localEnd": 839.4}, {"id": "c004_f000082", "text": "'Mr Malfoy, what a pleasure to see you again,' said Mr Borgin in a voice as oily as his hair. 'Delighted - and young Master Malfoy, too - charmed. How may I be of assistance? I must show you, just in today, and very reasonably priced -'", "begin": 4466.073, "end": 4485.433, "localBegin": 839.4, "localEnd": 858.76}, {"id": "c004_f000083", "text": "'I'm not buying today, Mr Borgin, but selling,' said Mr Malfoy.", "begin": 4485.433, "end": 4491.433, "localBegin": 858.76, "localEnd": 864.76}, {"id": "c004_f000084", "text": "'Selling?' The smile faded slightly from Mr Borgin's face.", "begin": 4491.433, "end": 4495.833, "localBegin": 864.76, "localEnd": 869.16}, {"id": "c004_f000085", "text": "'You have heard, of course, that the Ministry is conducting more raids,' said Mr Malfoy, taking a roll of parchment from his inside pocket and unravelling it for Mr Borgin to read. 'I have a few - ah - items at home that might embarrass me, if the Ministry were to call ...'", "begin": 4495.833, "end": 4516.513, "localBegin": 869.16, "localEnd": 889.84}, {"id": "c004_f000086", "text": "Mr Borgin fixed a pince-nez to his nose and looked down the list.", "begin": 4516.513, "end": 4520.753, "localBegin": 889.84, "localEnd": 894.08}, {"id": "c004_f000087", "text": "'The Ministry wouldn't presume to trouble you, sir, surely?'", "begin": 4520.753, "end": 4526.313, "localBegin": 894.08, "localEnd": 899.64}, {"id": "c004_f000088", "text": "Mr Malfoy's lip curled.", "begin": 4526.313, "end": 4527.993, "localBegin": 899.64, "localEnd": 901.32}, {"id": "c004_f000089", "text": "'I have not been visited yet. The name Malfoy still commands a certain respect, yet the Ministry grows ever more meddlesome. There are rumours about a new Muggle Protection Act - no doubt that flea-bitten, Muggle-loving fool Arthur Weasley is behind it -'", "begin": 4527.993, "end": 4548.113, "localBegin": 901.32, "localEnd": 921.44}, {"id": "c004_f000090", "text": "Harry felt a hot surge of anger.", "begin": 4548.113, "end": 4550.033, "localBegin": 921.44, "localEnd": 923.36}, {"id": "c004_f000091", "text": "'- and as you see, certain of these poisons might make it appear -'", "begin": 4550.033, "end": 4555.913, "localBegin": 923.36, "localEnd": 929.24}, {"id": "c004_f000092", "text": "'I understand, sir, of course,' said Mr Borgin. 'Let me see ...'", "begin": 4555.913, "end": 4560.873, "localBegin": 929.24, "localEnd": 934.2}, {"id": "c004_f000093", "text": "'Can I have that?' interrupted Draco, pointing at the withered hand on its cushion.", "begin": 4560.873, "end": 4566.793, "localBegin": 934.2, "localEnd": 940.12}, {"id": "c004_f000094", "text": "'Ah, the Hand of Glory!' said Mr Borgin, abandoning Mr Malfoy's list and scurrying over to Draco. 'Insert a candle and it", "begin": 4566.793, "end": 4577.073, "localBegin": 940.12, "localEnd": 950.4}, {"id": "c004_f000095", "text": "gives light only to the holder! Best friend of thieves and plunderers! Your son has fine taste, sir.'", "begin": 4577.073, "end": 4585.153, "localBegin": 950.4, "localEnd": 958.48}, {"id": "c004_f000096", "text": "'I hope my son will amount to more than a thief or a plunderer, Borgin,' said Mr Malfoy coldly and Mr Borgin said quickly, 'No offence, sir, no offence meant -'", "begin": 4585.153, "end": 4596.113, "localBegin": 958.48, "localEnd": 969.44}, {"id": "c004_f000097", "text": "'Though if his school marks don't pick up,' said Mr Malfoy, more coldly still, 'that may indeed be all he is fit for.'", "begin": 4596.113, "end": 4605.793, "localBegin": 969.44, "localEnd": 979.12}, {"id": "c004_f000098", "text": "'It's not my fault,' retorted Draco. 'The teachers all have favourites, that Hermione Granger -'", "begin": 4605.793, "end": 4613.913, "localBegin": 979.12, "localEnd": 987.24}, {"id": "c004_f000099", "text": "'I would have thought you'd be ashamed that a girl of no wizard family beat you in every exam,' snapped Mr Malfoy.", "begin": 4613.913, "end": 4622.193, "localBegin": 987.24, "localEnd": 995.52}, {"id": "c004_f000100", "text": "'Ha!' said Harry under his breath, pleased to see Draco looking both abashed and angry.", "begin": 4622.193, "end": 4629.033, "localBegin": 995.52, "localEnd": 1002.36}, {"id": "c004_f000101", "text": "'It's the same all over,' said Mr Borgin, in his oily voice. 'Wizard blood is counting for less everywhere -'", "begin": 4629.033, "end": 4635.833, "localBegin": 1002.36, "localEnd": 1009.16}, {"id": "c004_f000102", "text": "'Not with me,' said Mr Malfoy, his long nostrils flaring.", "begin": 4635.833, "end": 4641.313, "localBegin": 1009.16, "localEnd": 1014.64}, {"id": "c004_f000103", "text": "'No, sir, nor with me, sir,' said Mr Borgin, with a deep bow.", "begin": 4641.313, "end": 4646.313, "localBegin": 1014.64, "localEnd": 1019.64}, {"id": "c004_f000104", "text": "'In that case, perhaps we can return to my list,' said Mr Malfoy shortly. 'I am in something of a hurry, Borgin, I have important business elsewhere today.'", "begin": 4646.313, "end": 4656.633, "localBegin": 1019.64, "localEnd": 1029.96}, {"id": "c004_f000105", "text": "They started to haggle. Harry watched nervously as Draco drew nearer and nearer to his hiding place, examining the objects for sale. He paused to examine a long coil of hangman's rope and to read, smirking, the card propped on a magnificent necklace of opals: Caution: Do Not Touch. Cursed - Has Claimed the Lives of Nineteen Muggle Owners to Date.", "begin": 4656.633, "end": 4681.913, "localBegin": 1029.96, "localEnd": 1055.24}, {"id": "c004_f000106", "text": "Draco turned away and saw the cabinet right in front of him. He walked forward ... he stretched out his hand for the handle ...", "begin": 4681.913, "end": 4689.673, "localBegin": 1055.24, "localEnd": 1063.0}, {"id": "c004_f000107", "text": "'Done,' said Mr Malfoy at the counter. 'Come, Draco!'", "begin": 4689.673, "end": 4693.673, "localBegin": 1063.0, "localEnd": 1067.0}, {"id": "c004_f000108", "text": "Harry wiped his forehead on his sleeve as Draco turned away.", "begin": 4693.673, "end": 4699.193, "localBegin": 1067.0, "localEnd": 1072.52}, {"id": "c004_f000109", "text": "'Good day to you, Mr Borgin, I'll expect you at the manor tomorrow to pick up the goods.'", "begin": 4699.193, "end": 4706.313, "localBegin": 1072.52, "localEnd": 1079.64}, {"id": "c004_f000110", "text": "The moment the door had closed, Mr Borgin dropped his oily manner.", "begin": 4706.313, "end": 4711.953, "localBegin": 1079.64, "localEnd": 1085.28}, {"id": "c004_f000111", "text": "'Good day yourself, Mister Malfoy, and if the stories are true, you haven't sold me half of what's hidden in your manor ...'", "begin": 4711.953, "end": 4721.033, "localBegin": 1085.28, "localEnd": 1094.36}, {"id": "c004_f000112", "text": "Muttering darkly, Mr Borgin disappeared into a back room. Harry waited for a minute in case he came back, then, quietly as he could, slipped out of the cabinet, past the glass cases and out of the shop door.", "begin": 4721.033, "end": 4733.673, "localBegin": 1094.36, "localEnd": 1107.0}, {"id": "c004_f000113", "text": "Clutching his broken glasses to his face he stared around. He had emerged into a dingy alleyway that seemed to be made up entirely of shops devoted to the Dark Arts. The one he'd just left, Borgin and Burkes, looked like the largest, but opposite was a nasty window display of shrunken heads, and two doors down, a large cage was alive with gigantic black spiders. Two shabbylooking wizards were watching him from the shadow of a doorway, muttering to each other. Feeling jumpy, Harry set off, trying to hold his glasses on straight and hoping against hope he'd be able to find a way out of there.", "begin": 4733.673, "end": 4773.473, "localBegin": 1107.0, "localEnd": 1146.8}, {"id": "c004_f000114", "text": "An old wooden street sign hanging over a shop selling poisonous candles told him he was in Knockturn Alley. This didn't help, as Harry had never heard of such a place. He supposed he hadn't spoken clearly enough through his mouthful of ashes back in the Weasleys' fire. Trying to stay calm, he wondered what to do.", "begin": 4773.473, "end": 4794.793, "localBegin": 1146.8, "localEnd": 1168.12}, {"id": "c004_f000115", "text": "'Not lost are you, my dear?' said a voice in his ear, making him jump.", "begin": 4794.793, "end": 4800.913, "localBegin": 1168.12, "localEnd": 1174.24}, {"id": "c004_f000116", "text": "An aged witch stood in front of him, holding a tray of what looked horribly like whole human fingernails. She leered at him, showing mossy teeth. Harry backed away.", "begin": 4800.913, "end": 4812.353, "localBegin": 1174.24, "localEnd": 1185.68}, {"id": "c004_f000117", "text": "'I'm fine, thanks,' he said. 'I'm just -'", "begin": 4812.353, "end": 4815.433, "localBegin": 1185.68, "localEnd": 1188.76}, {"id": "c004_f000118", "text": "'HARRY! What d'yeh think yer doin' down there?'", "begin": 4815.433, "end": 4820.033, "localBegin": 1188.76, "localEnd": 1193.36}, {"id": "c004_f000119", "text": "Harry's heart leapt. So did the witch; a load of fingernails cascaded down over her feet and she cursed as the massive form of Hagrid, the Hogwarts gamekeeper, came striding towards them, beetle-black eyes flashing over his great bristling beard.", "begin": 4820.033, "end": 4834.313, "localBegin": 1193.36, "localEnd": 1207.64}, {"id": "c004_f000120", "text": "'Hagrid!' Harry croaked in relief. 'I was lost ... Floo powder ...'", "begin": 4834.313, "end": 4839.713, "localBegin": 1207.64, "localEnd": 1213.04}, {"id": "c004_f000121", "text": "Hagrid seized Harry by the scruff of the neck and pulled him away from the witch, knocking the tray right out of her hands. Her shrieks followed them all the way along the twisting alleyway out into bright sunlight. Harry saw a familiar, snow-white marble building in the distance: Gringotts bank. Hagrid had steered him right into Diagon Alley.", "begin": 4839.713, "end": 4859.753, "localBegin": 1213.04, "localEnd": 1233.08}, {"id": "c004_f000122", "text": "'Yer a mess!' said Hagrid gruffly, brushing soot off Harry so forcefully he nearly knocked him into a barrel of dragon dung outside an apothecary's. 'Skulkin' around Knockturn Alley, I dunno - dodgy place, Harry - don' want no one ter see yeh down there -'", "begin": 4859.753, "end": 4877.473, "localBegin": 1233.08, "localEnd": 1250.8}, {"id": "c004_f000123", "text": "'I realised that,' said Harry, ducking as Hagrid made to brush him off again. 'I told you, I was lost - what were you doing down there, anyway?'", "begin": 4877.473, "end": 4887.233, "localBegin": 1250.8, "localEnd": 1260.56}, {"id": "c004_f000124", "text": "'I was lookin' fer a Flesh-Eatin' Slug Repellent,' growled Hagrid. 'They're ruinin' the school cabbages. Yer not on yer own?'", "begin": 4887.233, "end": 4895.913, "localBegin": 1260.56, "localEnd": 1269.24}, {"id": "c004_f000125", "text": "'I'm staying with the Weasleys but we got separated,' Harry explained. 'I've got to go and find them ...'", "begin": 4895.913, "end": 4901.073, "localBegin": 1269.24, "localEnd": 1274.4}, {"id": "c004_f000126", "text": "They set off together down the street.", "begin": 4901.073, "end": 4903.753, "localBegin": 1274.4, "localEnd": 1277.08}, {"id": "c004_f000127", "text": "'How come yeh never wrote back ter me?' said Hagrid, as Harry jogged alongside him (he had to take three steps to every stride of Hagrid's enormous boots). Harry explained all about Dobby and the Dursleys.", "begin": 4903.753, "end": 4916.713, "localBegin": 1277.08, "localEnd": 1290.04}, {"id": "c004_f000128", "text": "'Ruddy Muggles,' growled Hagrid. 'If I'd've known -'", "begin": 4916.713, "end": 4921.033, "localBegin": 1290.04, "localEnd": 1294.36}, {"id": "c004_f000129", "text": "'Harry! Harry! Over here!'", "begin": 4921.033, "end": 4923.673, "localBegin": 1294.36, "localEnd": 1297.0}, {"id": "c004_f000130", "text": "Harry looked up and saw Hermione Granger standing at the top of the white flight of steps to Gringotts. She ran down to meet them, her bushy brown hair flying behind her.", "begin": 4923.673, "end": 4933.233, "localBegin": 1297.0, "localEnd": 1306.56}, {"id": "c004_f000131", "text": "'What happened to your glasses? Hello, Hagrid ... Oh, it's wonderful to see you two again ... Are you coming into Gringotts, Harry?'", "begin": 4933.233, "end": 4940.033, "localBegin": 1306.56, "localEnd": 1313.36}, {"id": "c004_f000132", "text": "'As soon as I've found the Weasleys,' said Harry.", "begin": 4940.033, "end": 4943.273, "localBegin": 1313.36, "localEnd": 1316.6}, {"id": "c004_f000133", "text": "'Yeh won't have long ter wait,' grinned Hagrid.", "begin": 4943.273, "end": 4946.713, "localBegin": 1316.6, "localEnd": 1320.04}, {"id": "c004_f000134", "text": "Harry and Hermione looked around; sprinting up the crowded street were Ron, Fred, George, Percy and Mr Weasley.", "begin": 4946.713, "end": 4954.673, "localBegin": 1320.04, "localEnd": 1328.0}, {"id": "c004_f000135", "text": "'Harry,' Mr Weasley panted. 'We hoped you'd only gone one grate too far ...' He mopped his glistening bald patch. 'Molly's frantic - she's coming now.'", "begin": 4954.673, "end": 4966.673, "localBegin": 1328.0, "localEnd": 1340.0}, {"id": "c004_f000136", "text": "'Where did you come out?' Ron asked.", "begin": 4966.673, "end": 4969.313, "localBegin": 1340.0, "localEnd": 1342.64}, {"id": "c004_f000137", "text": "'Knockturn Alley,' said Hagrid grimly.", "begin": 4969.313, "end": 4971.793, "localBegin": 1342.64, "localEnd": 1345.12}, {"id": "c004_f000138", "text": "'Brilliant!' said Fred and George together.", "begin": 4971.793, "end": 4974.993, "localBegin": 1345.12, "localEnd": 1348.32}, {"id": "c004_f000139", "text": "'We've never been allowed in,' said Ron enviously.", "begin": 4974.993, "end": 4978.473, "localBegin": 1348.32, "localEnd": 1351.8}, {"id": "c004_f000140", "text": "'I should ruddy well think not,' growled Hagrid.", "begin": 4978.473, "end": 4980.953, "localBegin": 1351.8, "localEnd": 1354.28}, {"id": "c004_f000141", "text": "Mrs Weasley now came galloping into view, her handbag swinging wildly in one hand, Ginny just clinging onto the other.", "begin": 4980.953, "end": 4988.713, "localBegin": 1354.28, "localEnd": 1362.04}, {"id": "c004_f000142", "text": "'Oh, Harry - oh, my dear - you could have been anywhere -'", "begin": 4988.713, "end": 4992.513, "localBegin": 1362.04, "localEnd": 1365.84}, {"id": "c004_f000143", "text": "Gasping for breath she pulled a large clothes brush out of her bag and began sweeping off the soot Hagrid hadn't managed to beat away. Mr Weasley took Harry's glasses, gave them a tap of his wand and returned them, good as new.", "begin": 4992.513, "end": 5005.713, "localBegin": 1365.84, "localEnd": 1379.04}, {"id": "c004_f000144", "text": "'Well, gotta be off,' said Hagrid, who was having his hand wrung by Mrs Weasley ('Knockturn Alley! If you hadn't found him, Hagrid!'). 'See yer at Hogwarts!' And he strode away, head and shoulders taller than anyone else in the packed street.", "begin": 5005.713, "end": 5021.073, "localBegin": 1379.04, "localEnd": 1394.4}, {"id": "c004_f000145", "text": "'Guess who I saw in Borgin and Burkes?' Harry asked Ron and Hermione as they climbed the Gringotts steps. 'Malfoy and his father.'", "begin": 5021.073, "end": 5030.473, "localBegin": 1394.4, "localEnd": 1403.8}, {"id": "c004_f000146", "text": "'Did Lucius Malfoy buy anything?' said Mr Weasley sharply behind them.", "begin": 5030.473, "end": 5036.313, "localBegin": 1403.8, "localEnd": 1409.64}, {"id": "c004_f000147", "text": "'No, he was selling.'", "begin": 5036.313, "end": 5038.193, "localBegin": 1409.64, "localEnd": 1411.52}, {"id": "c004_f000148", "text": "'So he's worried,' said Mr Weasley with grim satisfaction. 'Oh, I'd love to get Lucius Malfoy for something ...'", "begin": 5038.193, "end": 5045.873, "localBegin": 1411.52, "localEnd": 1419.2}, {"id": "c004_f000149", "text": "'You be careful, Arthur,' said Mrs Weasley sharply, as they were ushered into the bank by a bowing goblin at the door. 'That family's trouble, don't go biting off more than you can chew.'", "begin": 5045.873, "end": 5056.393, "localBegin": 1419.2, "localEnd": 1429.72}, {"id": "c004_f000150", "text": "'So you don't think I'm a match for Lucius Malfoy?' said Mr Weasley indignantly, but he was distracted almost at once by the sight of Hermione's parents, who were standing nervously at the counter that ran all along the great marble hall, waiting for Hermione to introduce them.", "begin": 5056.393, "end": 5072.633, "localBegin": 1429.72, "localEnd": 1445.96}, {"id": "c004_f000151", "text": "'But you're Muggles!' said Mr Weasley delightedly. 'We must have a drink! What's that you've got there? Oh, you're changing Muggle money. Molly, look!' He pointed excitedly at the tenpound notes in Mr Granger's hand.", "begin": 5072.633, "end": 5087.833, "localBegin": 1445.96, "localEnd": 1461.16}, {"id": "c004_f000152", "text": "'Meet you back here,' Ron said to Hermione, as the Weasleys and Harry were led off to their underground vaults by another Gringotts goblin.", "begin": 5087.833, "end": 5095.673, "localBegin": 1461.16, "localEnd": 1469.0}, {"id": "c004_f000153", "text": "The vaults were reached by means of small, goblin-driven carts that sped along miniature train-tracks through the bank's underground tunnels. Harry enjoyed the breakneck journey down to the Weasleys' vault, but felt dreadful, far worse than he had in Knockturn Alley, when it was opened. There was a very small pile of silver Sickles inside, and just one gold Galleon. Mrs Weasley felt right into the corners before sweeping the whole lot into her bag. Harry felt even worse when they reached his vault. He tried to block the contents from view as he hastily shoved handfuls of coins into a leather bag.", "begin": 5095.673, "end": 5131.913, "localBegin": 1469.0, "localEnd": 1505.24}, {"id": "c004_f000154", "text": "Back outside on the marble steps, they all separated. Percy muttered vaguely about needing a new quill. Fred and George had spotted their friend from Hogwarts, Lee Jordan. Mrs Weasley and Ginny were going to a second-hand robe shop. Mr Weasley was insisting on taking the Grangers off to the Leaky Cauldron for a drink.", "begin": 5131.913, "end": 5150.593, "localBegin": 1505.24, "localEnd": 1523.92}, {"id": "c004_f000155", "text": "'We'll all meet at Flourish and Blotts in an hour to buy your", "begin": 5150.593, "end": 5153.953, "localBegin": 1523.92, "localEnd": 1527.28}, {"id": "c004_f000156", "text": "school books,' said Mrs Weasley, setting off with Ginny. 'And not one step down Knockturn Alley!' she shouted at the twins' retreating backs.", "begin": 5153.953, "end": 5162.193, "localBegin": 1527.28, "localEnd": 1535.52}, {"id": "c004_f000157", "text": "Harry, Ron and Hermione strolled off along the winding, cobbled street. The bag of gold, silver and bronze jangling cheerfully in Harry's pocket was clamouring to be spent, so he bought three large strawberry and peanut-butter ice-creams which they slurped happily as they wandered up the alley, examining the fascinating shop windows. Ron gazed longingly at a full set of Chudley Cannon robes in the windows of 'Quality Quidditch Supplies' until Hermione dragged them off to buy ink and parchment next door. In Gambol and Japes Wizarding Joke Shop, they met Fred, George and Lee Jordan, who were stocking up on 'Dr Filibuster's Fabulous Wet-Start, No-Heat Fireworks', and in a tiny junk shop full of broken wands, wonky brass scales and old cloaks covered in potion stains they found Percy, deeply immersed in a small and deeply boring book called Prefects Who Gained Power.", "begin": 5162.193, "end": 5217.073, "localBegin": 1535.52, "localEnd": 1590.4}, {"id": "c004_f000158", "text": "'A study of Hogwarts Prefects and their later careers,' Ron read aloud off the back cover. 'That sounds fascinating ...'", "begin": 5217.073, "end": 5225.713, "localBegin": 1590.4, "localEnd": 1599.04}, {"id": "c004_f000159", "text": "'Go away,' Percy snapped.", "begin": 5225.713, "end": 5228.433, "localBegin": 1599.04, "localEnd": 1601.76}, {"id": "c004_f000160", "text": "''Course, he's very ambitious, Percy, he's got it all planned out ... he wants to be Minister of Magic ...' Ron told Harry and Hermione in an undertone, as they left Percy to it.", "begin": 5228.433, "end": 5238.673, "localBegin": 1601.76, "localEnd": 1612.0}, {"id": "c004_f000161", "text": "An hour later, they headed for Flourish and Blotts. They were by no means the only ones making their way to the bookshop. As they approached it, they saw to their surprise a large crowd jostling outside the doors, trying to get in. The reason for this was proclaimed by a large banner stretched across the upper windows:", "begin": 5238.673, "end": 5258.153, "localBegin": 1612.0, "localEnd": 1631.48}, {"id": "c004_f000162", "text": "GILDEROY LOCKHART will be signing copies of his autobiography MAGICAL ME today 12.30 - 4.30 pm", "begin": 5258.153, "end": 5268.673, "localBegin": 1631.48, "localEnd": 1642.0}, {"id": "c004_f000163", "text": "'We can actually meet him!' Hermione squealed. 'I mean, he's written almost the whole booklist!'", "begin": 5268.673, "end": 5274.513, "localBegin": 1642.0, "localEnd": 1647.84}, {"id": "c004_f000164", "text": "The crowd seemed to be made up mostly of witches around Mrs Weasley's age. A harassed-looking wizard stood at the door, saying, 'Calmly, please ladies ... don't push, there ... mind the books, now ...'", "begin": 5274.513, "end": 5287.233, "localBegin": 1647.84, "localEnd": 1660.56}, {"id": "c004_f000165", "text": "Harry, Ron and Hermione squeezed inside. A long queue wound right to the back of the shop, where Gilderoy Lockhart was signing his books. They each grabbed a copy of Break with a Banshee, and sneaked up the line to where the rest of the Weasleys were standing with Mr and Mrs Granger.", "begin": 5287.233, "end": 5305.393, "localBegin": 1660.56, "localEnd": 1678.72}, {"id": "c004_f000166", "text": "'Oh, there you are, good,' said Mrs Weasley. She sounded breathless and kept patting her hair. 'We'll be able to see him in a minute ...'", "begin": 5305.393, "end": 5313.593, "localBegin": 1678.72, "localEnd": 1686.92}, {"id": "c004_f000167", "text": "Gilderoy Lockhart came slowly into view, seated at a table surrounded by large pictures of his own face, all winking and flashing dazzlingly white teeth at the crowd. The real Lockhart was wearing robes of forget-me-not blue which exactly matched his eyes; his pointed wizard's hat was set at a jaunty angle on his wavy hair.", "begin": 5313.593, "end": 5332.993, "localBegin": 1686.92, "localEnd": 1706.32}, {"id": "c004_f000168", "text": "A short, irritable-looking man was dancing around taking photographs with a large black camera that emitted puffs of purple smoke with every blinding flash.", "begin": 5332.993, "end": 5342.353, "localBegin": 1706.32, "localEnd": 1715.68}, {"id": "c004_f000169", "text": "'Out of the way, there,' he snarled at Ron, moving back to get a better shot. 'This is for the Daily Prophet.'", "begin": 5342.353, "end": 5347.953, "localBegin": 1715.68, "localEnd": 1721.28}, {"id": "c004_f000170", "text": "'Big deal,' said Ron, rubbing his foot where the photographer had stepped on it.", "begin": 5347.953, "end": 5353.153, "localBegin": 1721.28, "localEnd": 1726.48}, {"id": "c004_f000171", "text": "Gilderoy Lockhart heard him. He looked up. He saw Ron - and then he saw Harry. He stared. Then he leapt to his feet and positively shouted, 'It can't be Harry Potter?'", "begin": 5353.153, "end": 5366.313, "localBegin": 1726.48, "localEnd": 1739.64}, {"id": "c004_f000172", "text": "The crowd parted, whispering excitedly. Lockhart dived forward, seized Harry's arm and pulled him to the front. The crowd burst into applause. Harry's face burned as Lockhart shook his hand for the photographer, who was clicking away madly, wafting thick smoke over the Weasleys.", "begin": 5366.313, "end": 5384.153, "localBegin": 1739.64, "localEnd": 1757.48}, {"id": "c004_f000173", "text": "'Nice big smile, Harry,' said Lockhart, through his own gleaming teeth. 'Together, you and I are worth the front page.'", "begin": 5384.153, "end": 5392.473, "localBegin": 1757.48, "localEnd": 1765.8}, {"id": "c004_f000174", "text": "When he finally let go of Harry's hand, Harry could hardly feel his fingers. He tried to sidle back over to the Weasleys, but Lockhart threw an arm around his shoulders and clamped him tightly to his side.", "begin": 5392.473, "end": 5404.033, "localBegin": 1765.8, "localEnd": 1777.36}, {"id": "c004_f000175", "text": "'Ladies and gentlemen,' he said loudly, waving for quiet. 'What an extraordinary moment this is! The perfect moment for me to make a little announcement I've been sitting on for some time!", "begin": 5404.033, "end": 5417.993, "localBegin": 1777.36, "localEnd": 1791.32}, {"id": "c004_f000176", "text": "'When young Harry here stepped into Flourish and Blotts today, he only wanted to buy my autobiography - which I shall be", "begin": 5417.993, "end": 5426.313, "localBegin": 1791.32, "localEnd": 1799.64}, {"id": "c004_f000177", "text": "happy to present him now, free of charge -' the crowd applauded again,'- he had no idea,' Lockhart continued, giving Harry a little shake that made his glasses slip to the end of his nose, 'that he would shortly be getting much, much more than my book, Magical Me. He and his school fellows will, in fact, be getting the real, magical me. Yes, ladies and gentlemen, I have great pleasure and pride in announcing that, this September, I will be taking up the post of Defence Against the Dark Arts teacher at Hogwarts School of Witchcraft and Wizardry!'", "begin": 5426.313, "end": 5468.313, "localBegin": 1799.64, "localEnd": 1841.64}, {"id": "c004_f000178", "text": "The crowd cheered and clapped and Harry found himself being presented with the entire works of Gilderoy Lockhart. Staggering slightly under their weight, he managed to make his way out of the limelight to the edge of the room, where Ginny was standing next to her new cauldron.", "begin": 5468.313, "end": 5484.193, "localBegin": 1841.64, "localEnd": 1857.52}, {"id": "c004_f000179", "text": "'You have these,' Harry mumbled to her, tipping the books into the cauldron. 'I'll buy my own -'", "begin": 5484.193, "end": 5490.913, "localBegin": 1857.52, "localEnd": 1864.24}, {"id": "c004_f000180", "text": "'Bet you loved that, didn't you, Potter?' said a voice Harry had no trouble recognising. He straightened up and found himself face to face with Draco Malfoy, who was wearing his usual sneer.", "begin": 5490.913, "end": 5503.513, "localBegin": 1864.24, "localEnd": 1876.84}, {"id": "c004_f000181", "text": "'Famous Harry Potter,' said Malfoy. 'Can't even go into a bookshop without making the front page.'", "begin": 5503.513, "end": 5510.513, "localBegin": 1876.84, "localEnd": 1883.84}, {"id": "c004_f000182", "text": "'Leave him alone, he didn't want all that!' said Ginny. It was the first time she had spoken in front of Harry. She was glaring at Malfoy.", "begin": 5510.513, "end": 5518.913, "localBegin": 1883.84, "localEnd": 1892.24}, {"id": "c004_f000183", "text": "'Potter, you've got yourself a girlfriend!' drawled Malfoy. Ginny went scarlet as Ron and Hermione fought their way over, both clutching stacks of Lockhart's books.", "begin": 5518.913, "end": 5529.433, "localBegin": 1892.24, "localEnd": 1902.76}, {"id": "c004_f000184", "text": "'Oh, it's you,' said Ron, looking at Malfoy as if he were something unpleasant on the sole of his shoe. 'Bet you're surprised to see Harry here, eh?'", "begin": 5529.433, "end": 5538.553, "localBegin": 1902.76, "localEnd": 1911.88}, {"id": "c004_f000185", "text": "'Not as surprised as I am to see you in a shop, Weasley,' retorted Malfoy. 'I suppose your parents will go hungry for a month to pay for that lot.'", "begin": 5538.553, "end": 5547.513, "localBegin": 1911.88, "localEnd": 1920.84}, {"id": "c004_f000186", "text": "Ron went as red as Ginny. He dropped his books into the cauldron, too, and started towards Malfoy, but Harry and Hermione grabbed the back of his jacket.", "begin": 5547.513, "end": 5556.553, "localBegin": 1920.84, "localEnd": 1929.
