l very sleepy. He sat on the edge of his four-poster, thinking hard about everything Aragog had said.", "begin": 26416.498, "end": 26429.578, "localBegin": 1678.2, "localEnd": 1691.28}, {"id": "c015_f000159", "text": "The creature that was lurking somewhere in the castle, he thought, sounded like a sort of monster Voldemort - even other monsters didn't want to name it. But he and Ron were no closer to finding out what it was, or how it Petrified its victims. Even Hagrid had never known what was in the Chamber of Secrets.", "begin": 26429.578, "end": 26449.418, "localBegin": 1691.28, "localEnd": 1711.12}, {"id": "c015_f000160", "text": "Harry swung his legs up onto his bed and leaned back against his pillows, watching the moon glinting at him through the tower window.", "begin": 26449.418, "end": 26457.738, "localBegin": 1711.12, "localEnd": 1719.44}, {"id": "c015_f000161", "text": "He couldn't see what else they could do. They had hit dead ends everywhere. Riddle had caught the wrong person, the heir of", "begin": 26457.738, "end": 26466.658, "localBegin": 1719.44, "localEnd": 1728.36}, {"id": "c015_f000162", "text": "Slytherin had got off, and no one could tell whether it was the same person, or a different one, who had opened the Chamber this time. There was nobody else to ask. Harry lay down, still thinking about what Aragog said.", "begin": 26466.658, "end": 26481.378, "localBegin": 1728.36, "localEnd": 1743.08}, {"id": "c015_f000163", "text": "He was becoming drowsy when what seemed like their very last hope occurred to him and he suddenly sat bolt upright.", "begin": 26481.378, "end": 26488.818, "localBegin": 1743.08, "localEnd": 1750.52}, {"id": "c015_f000164", "text": "'Ron,' he hissed through the dark. 'Ron!'", "begin": 26488.818, "end": 26491.658, "localBegin": 1750.52, "localEnd": 1753.36}, {"id": "c015_f000165", "text": "Ron woke with a yelp like Fang's, stared wildly around and saw Harry.", "begin": 26491.658, "end": 26496.418, "localBegin": 1753.36, "localEnd": 1758.12}, {"id": "c015_f000166", "text": "'Ron - that girl who died. Aragog said she was found in a bathroom,' said Harry, ignoring Neville's snuffling snores from the corner. 'What if she never left the bathroom? What if she's still there?'", "begin": 26496.418, "end": 26510.498, "localBegin": 1758.12, "localEnd": 1772.2}, {"id": "c015_f000167", "text": "Ron rubbed his eyes, frowning through the moonlight. And then he understood.", "begin": 26510.498, "end": 26516.658, "localBegin": 1772.2, "localEnd": 1778.36}, {"id": "c015_f000168", "text": "'You don't think - not Moaning Myrtle?'", "begin": 26516.658, "end": 26523.298, "localBegin": 1778.36, "localEnd": 1785.0}]}, {"kind": "chapter", "number": 16, "title": "The Chamber of Secrets", "audio": "audio/chapter_016.mp3", "start": 26523.298, "end": 28701.413, "duration": 2178.115, "paragraphs": [{"id": "c016_f000001", "text": "Chapter Sixteen. The Chamber of Secrets.", "begin": 26523.298, "end": 26529.458, "localBegin": 0.0, "localEnd": 6.16}, {"id": "c016_f000002", "text": "'All those times we were in that bathroom, and she was just three toilets away,' said Ron bitterly at breakfast next day, 'and we could've asked her, and now ...'", "begin": 26529.458, "end": 26539.378, "localBegin": 6.16, "localEnd": 16.08}, {"id": "c016_f000003", "text": "It had been hard enough trying to look for spiders. Escaping their teachers long enough to sneak into a girls' bathroom, the girls' bathroom, moreover, right next to the scene of the first attack, was going to be almost impossible.", "begin": 26539.378, "end": 26552.218, "localBegin": 16.08, "localEnd": 28.92}, {"id": "c016_f000004", "text": "But something happened in their first lesson, Transfiguration, which drove the Chamber of Secrets out of their minds for the first time in weeks. Ten minutes into the class, Professor McGonagall told them that their exams would start on the first of June, one week from today.", "begin": 26552.218, "end": 26568.098, "localBegin": 28.92, "localEnd": 44.8}, {"id": "c016_f000005", "text": "'Exams?' howled Seamus Finnigan. 'We're still getting exams?'", "begin": 26568.098, "end": 26573.338, "localBegin": 44.8, "localEnd": 50.04}, {"id": "c016_f000006", "text": "There was a loud bang behind Harry as Neville Longbottom's wand slipped, vanishing one of the legs on his desk. Professor McGonagall restored it with a wave of her own wand, and turned, frowning, to Seamus.", "begin": 26573.338, "end": 26586.538, "localBegin": 50.04, "localEnd": 63.24}, {"id": "c016_f000007", "text": "'The whole point of keeping the school open at this time is for you to receive your education,' she said sternly. 'The exams will therefore take place as usual, and I trust you are all revising hard.'", "begin": 26586.538, "end": 26599.898, "localBegin": 63.24, "localEnd": 76.6}, {"id": "c016_f000008", "text": "Revising hard! It had never occurred to Harry that there would be exams with the castle in this state. There was a great deal of mutinous muttering around the room, which made Professor McGonagall scowl even more darkly.", "begin": 26599.898, "end": 26611.738, "localBegin": 76.6, "localEnd": 88.44}, {"id": "c016_f000009", "text": "'Professor Dumbledore's instructions were to keep the school running as normally as possible,' she said. 'And that, I need hardly point out, means finding out how much you have learned this year.'", "begin": 26611.738, "end": 26624.618, "localBegin": 88.44, "localEnd": 101.32}, {"id": "c016_f000010", "text": "Harry looked down at the pair of white rabbits he was supposed to be turning into slippers. What had he learned so far this", "begin": 26624.618, "end": 26631.378, "localBegin": 101.32, "localEnd": 108.08}, {"id": "c016_f000011", "text": "year? He couldn't seem to think of anything that would be useful in an exam.", "begin": 26631.378, "end": 26636.098, "localBegin": 108.08, "localEnd": 112.8}, {"id": "c016_f000012", "text": "Ron looked as though he'd just been told he had to go and live in the Forbidden Forest.", "begin": 26636.098, "end": 26640.138, "localBegin": 112.8, "localEnd": 116.84}, {"id": "c016_f000013", "text": "'Can you imagine me taking exams with this?' he asked Harry, holding up his wand, which had just started whistling loudly. * Three days before their first exam, Professor McGonagall made another announcement at breakfast.", "begin": 26640.138, "end": 26656.498, "localBegin": 116.84, "localEnd": 133.2}, {"id": "c016_f000014", "text": "'I have good news,' she said, and the Great Hall, instead of falling silent, erupted.", "begin": 26656.498, "end": 26662.578, "localBegin": 133.2, "localEnd": 139.28}, {"id": "c016_f000015", "text": "'Dumbledore's coming back!' several people yelled joyfully.", "begin": 26662.578, "end": 26666.298, "localBegin": 139.28, "localEnd": 143.0}, {"id": "c016_f000016", "text": "'You've caught the heir of Slytherin!' squealed a girl on the Ravenclaw table.", "begin": 26666.298, "end": 26670.538, "localBegin": 143.0, "localEnd": 147.24}, {"id": "c016_f000017", "text": "'Quidditch matches are back on!' roared Wood excitedly.", "begin": 26670.538, "end": 26675.538, "localBegin": 147.24, "localEnd": 152.24}, {"id": "c016_f000018", "text": "When the hubbub had subsided, Professor McGonagall said, 'Professor Sprout has informed me that the Mandrakes are ready for cutting at last. Tonight, we will be able to revive those people who have been Petrified. I need hardly remind you all that one of them may well be able to tell us who, or what, attacked them. I am hopeful that this dreadful year will end with our catching the culprit.'", "begin": 26675.538, "end": 26702.578, "localBegin": 152.24, "localEnd": 179.28}, {"id": "c016_f000019", "text": "There was an explosion of cheering. Harry looked over at the Slytherin table and wasn't at all surprised to see that Draco Malfoy hadn't joined in. Ron, however, was looking happier than he'd looked in days.", "begin": 26702.578, "end": 26714.698, "localBegin": 179.28, "localEnd": 191.4}, {"id": "c016_f000020", "text": "'It won't matter that we never asked Myrtle, then!' he said to Harry. 'Hermione'll probably have all the answers when they wake her up! Mind you, she'll go mad when she finds out we've got exams in three days' time. She hasn't revised. It might be kinder to leave her where she is till they're over.'", "begin": 26714.698, "end": 26731.178, "localBegin": 191.4, "localEnd": 207.88}, {"id": "c016_f000021", "text": "Just then, Ginny Weasley came over and sat down next to Ron. She looked tense and nervous, and Harry noticed that her hands were twisting in her lap.", "begin": 26731.178, "end": 26740.458, "localBegin": 207.88, "localEnd": 217.16}, {"id": "c016_f000022", "text": "'What's up?' said Ron, helping himself to more porridge.", "begin": 26740.458, "end": 26744.218, "localBegin": 217.16, "localEnd": 220.92}, {"id": "c016_f000023", "text": "Ginny didn't say anything, but glanced up and down the Gryffindor table with a scared look on her face that reminded Harry of someone, though he couldn't think who.", "begin": 26744.218, "end": 26753.618, "localBegin": 220.92, "localEnd": 230.32}, {"id": "c016_f000024", "text": "'Spit it out,' said Ron, watching her.", "begin": 26753.618, "end": 26756.858, "localBegin": 230.32, "localEnd": 233.56}, {"id": "c016_f000025", "text": "Harry suddenly realised who Ginny looked like. She was", "begin": 26756.858, "end": 26760.258, "localBegin": 233.56, "localEnd": 236.96}, {"id": "c016_f000026", "text": "rocking backwards and forwards slightly in her chair, exactly like Dobby did when he was teetering on the edge of revealing forbidden information.", "begin": 26760.258, "end": 26769.098, "localBegin": 236.96, "localEnd": 245.8}, {"id": "c016_f000027", "text": "'I've got to tell you something,' Ginny mumbled, carefully not looking at Harry.", "begin": 26769.098, "end": 26775.698, "localBegin": 245.8, "localEnd": 252.4}, {"id": "c016_f000028", "text": "'What is it?' said Harry.", "begin": 26775.698, "end": 26777.178, "localBegin": 252.4, "localEnd": 253.88}, {"id": "c016_f000029", "text": "Ginny looked as though she couldn't find the right words.", "begin": 26777.178, "end": 26780.658, "localBegin": 253.88, "localEnd": 257.36}, {"id": "c016_f000030", "text": "'What?' said Ron.", "begin": 26780.658, "end": 26782.218, "localBegin": 257.36, "localEnd": 258.92}, {"id": "c016_f000031", "text": "Ginny opened her mouth, but no sound came out. Harry leaned forward and spoke quietly, so that only Ginny and Ron could hear him.", "begin": 26782.218, "end": 26790.538, "localBegin": 258.92, "localEnd": 267.24}, {"id": "c016_f000032", "text": "'Is it something about the Chamber of Secrets? Have you seen something? Someone acting oddly?'", "begin": 26790.538, "end": 26797.018, "localBegin": 267.24, "localEnd": 273.72}, {"id": "c016_f000033", "text": "Ginny drew a deep breath and, at that precise moment, Percy Weasley appeared, looking tired and wan.", "begin": 26797.018, "end": 26803.418, "localBegin": 273.72, "localEnd": 280.12}, {"id": "c016_f000034", "text": "'If you've finished eating, I'll take that seat, Ginny. I'm starving, I've only just come off patrol duty.'", "begin": 26803.418, "end": 26809.778, "localBegin": 280.12, "localEnd": 286.48}, {"id": "c016_f000035", "text": "Ginny jumped up as though her chair had just been electrified, gave Percy a fleeting, frightened look, and scarpered away. Percy sat down and grabbed a mug from the centre of the table.", "begin": 26809.778, "end": 26819.098, "localBegin": 286.48, "localEnd": 295.8}, {"id": "c016_f000036", "text": "'Percy!' said Ron angrily. 'She was just about to tell us something important!'", "begin": 26819.098, "end": 26824.778, "localBegin": 295.8, "localEnd": 301.48}, {"id": "c016_f000037", "text": "Halfway through a gulp of tea, Percy choked.", "begin": 26824.778, "end": 26828.218, "localBegin": 301.48, "localEnd": 304.92}, {"id": "c016_f000038", "text": "'What sort of thing?' he said, coughing.", "begin": 26828.218, "end": 26831.058, "localBegin": 304.92, "localEnd": 307.76}, {"id": "c016_f000039", "text": "'I just asked her if she'd seen anything odd, and she started to say -'", "begin": 26831.058, "end": 26834.698, "localBegin": 307.76, "localEnd": 311.4}, {"id": "c016_f000040", "text": "'Oh - that - that's nothing to do with the Chamber of Secrets,' said Percy at once.", "begin": 26834.698, "end": 26839.858, "localBegin": 311.4, "localEnd": 316.56}, {"id": "c016_f000041", "text": "'How do you know?' said Ron, his eyebrows raised.", "begin": 26839.858, "end": 26842.818, "localBegin": 316.56, "localEnd": 319.52}, {"id": "c016_f000042", "text": "'Well, er, if you must know, Ginny, er, walked in on me the other day when I was - well, never mind - the point is, she spotted me doing something and I, um, I asked her not to mention it to anybody. I must say, I did think she'd keep her word. It's nothing, really, I'd just rather -'", "begin": 26842.818, "end": 26862.138, "localBegin": 319.52, "localEnd": 338.84}, {"id": "c016_f000043", "text": "Harry had never seen Percy look so uncomfortable.", "begin": 26862.138, "end": 26866.098, "localBegin": 338.84, "localEnd": 342.8}, {"id": "c016_f000044", "text": "'What were you doing, Percy?' said Ron, grinning. 'Go on, tell us, we won't laugh.'", "begin": 26866.098, "end": 26873.058, "localBegin": 342.8, "localEnd": 349.76}, {"id": "c016_f000045", "text": "Percy didn't smile back.", "begin": 26873.058, "end": 26875.338, "localBegin": 349.76, "localEnd": 352.04}, {"id": "c016_f000046", "text": "'Pass me those rolls, Harry, I'm starving.' *", "begin": 26875.338, "end": 26881.818, "localBegin": 352.04, "localEnd": 358.52}, {"id": "c016_f000047", "text": "Harry knew the whole mystery might be solved tomorrow without their help, but he wasn't about to pass up a chance to speak to Myrtle if it turned up - and to his delight it did, mid-morning, when they were being led to History of Magic by Gilderoy Lockhart.", "begin": 26881.818, "end": 26897.618, "localBegin": 358.52, "localEnd": 374.32}, {"id": "c016_f000048", "text": "Lockhart, who had so often assured them that all danger had passed, only to be proved wrong straight away, was now wholeheartedly convinced that it was hardly worth the trouble to see them safely down the corridors. His hair wasn't as sleek as usual; it seemed he had been up most of the night, patrolling the fourth floor.", "begin": 26897.618, "end": 26915.658, "localBegin": 374.32, "localEnd": 392.36}, {"id": "c016_f000049", "text": "'Mark my words,' he said, ushering them around a corner, 'the first words out of those poor Petrified people's mouths will be, \"It was Hagrid.\" Frankly I'm astounded Professor McGonagall thinks all these security measures are necessary.'", "begin": 26915.658, "end": 26932.858, "localBegin": 392.36, "localEnd": 409.56}, {"id": "c016_f000050", "text": "'I agree, sir,' said Harry, making Ron drop his books in surprise.", "begin": 26932.858, "end": 26937.378, "localBegin": 409.56, "localEnd": 414.08}, {"id": "c016_f000051", "text": "'Thank you, Harry,' said Lockhart graciously, while they waited for a long line of Hufflepuffs to pass. 'I mean, we teachers have quite enough to be getting on with, without walking students to classes and standing guard all night ...'", "begin": 26937.378, "end": 26953.098, "localBegin": 414.08, "localEnd": 429.8}, {"id": "c016_f000052", "text": "'That's right,' said Ron, catching on. 'Why don't you leave us here, sir, we've only got one more corridor to go.'", "begin": 26953.098, "end": 26959.978, "localBegin": 429.8, "localEnd": 436.68}, {"id": "c016_f000053", "text": "'You know, Weasley, I think I will,' said Lockhart. 'I really should go and prepare my next class.'", "begin": 26959.978, "end": 26966.938, "localBegin": 436.68, "localEnd": 443.64}, {"id": "c016_f000054", "text": "And he hurried off.", "begin": 26966.938, "end": 26967.858, "localBegin": 443.64, "localEnd": 444.56}, {"id": "c016_f000055", "text": "'Prepare his class,' Ron sneered after him. 'Gone to curl his hair, more like.'", "begin": 26967.858, "end": 26975.178, "localBegin": 444.56, "localEnd": 451.88}, {"id": "c016_f000056", "text": "They let the rest of the Gryffindors draw ahead of them, then darted down a side passage and hurried off towards Moaning Myrtle's bathroom. But just as they were congratulating each other on their brilliant scheme ...", "begin": 26975.178, "end": 26986.498, "localBegin": 451.88, "localEnd": 463.2}, {"id": "c016_f000057", "text": "'Potter! Weasley! What are you doing?'", "begin": 26986.498, "end": 26990.098, "localBegin": 463.2, "localEnd": 466.8}, {"id": "c016_f000058", "text": "It was Professor McGonagall, and her mouth was the thinnest of thin lines.", "begin": 26990.098, "end": 26995.098, "localBegin": 466.8, "localEnd": 471.8}, {"id": "c016_f000059", "text": "'We were - we were -' Ron stammered, 'we were going to - to go and see -'", "begin": 26995.098, "end": 26999.218, "localBegin": 471.8, "localEnd": 475.92}, {"id": "c016_f000060", "text": "'Hermione,' said Harry. Ron and Professor McGonagall both looked at him.", "begin": 26999.218, "end": 27004.738, "localBegin": 475.92, "localEnd": 481.44}, {"id": "c016_f000061", "text": "'We haven't seen her for ages, Professor,' Harry went on hurriedly, treading on Ron's foot, 'and we thought we'd sneak into the", "begin": 27004.738, "end": 27011.058, "localBegin": 481.44, "localEnd": 487.76}, {"id": "c016_f000062", "text": "hospital wing, you know, and tell her the Mandrakes are nearly ready and, er, not to worry.'", "begin": 27011.058, "end": 27016.458, "localBegin": 487.76, "localEnd": 493.16}, {"id": "c016_f000063", "text": "Professor McGonagall was still staring at him, and for a moment, Harry thought she was going to explode, but when she spoke, it was in a strangely croaky voice.", "begin": 27016.458, "end": 27027.178, "localBegin": 493.16, "localEnd": 503.88}, {"id": "c016_f000064", "text": "'Of course,' she said, and Harry, amazed, saw a tear glistening in her beady eye. 'Of course, I realise this has all been hardest on the friends of those who have been ... I quite understand. Yes, Potter, of course you may visit Miss Granger. I will inform Professor Binns where you've gone. Tell Madam Pomfrey I have given my permission.'", "begin": 27027.178, "end": 27052.618, "localBegin": 503.88, "localEnd": 529.32}, {"id": "c016_f000065", "text": "Harry and Ron walked away, hardly daring to believe that they'd avoided detention. As they turned the corner, they distinctly heard Professor McGonagall blow her nose.", "begin": 27052.618, "end": 27062.578, "localBegin": 529.32, "localEnd": 539.28}, {"id": "c016_f000066", "text": "'That,' said Ron fervently, 'was the best story you've ever come up with.'", "begin": 27062.578, "end": 27069.258, "localBegin": 539.28, "localEnd": 545.96}, {"id": "c016_f000067", "text": "They had no choice now but to go to the hospital wing and tell Madam Pomfrey that they had Professor McGonagall's permission to visit Hermione.", "begin": 27069.258, "end": 27076.298, "localBegin": 545.96, "localEnd": 553.0}, {"id": "c016_f000068", "text": "Madam Pomfrey let them in, but reluctantly.", "begin": 27076.298, "end": 27079.978, "localBegin": 553.0, "localEnd": 556.68}, {"id": "c016_f000069", "text": "'There's just no point talking to a Petrified person,' she said, and they had to admit she was right when they'd taken their seats next to Hermione. It was plain that Hermione didn't have the faintest inkling that she had visitors, and that they might just as well tell her bedside cabinet not to worry for all the good it would do.", "begin": 27079.978, "end": 27100.338, "localBegin": 556.68, "localEnd": 577.04}, {"id": "c016_f000070", "text": "'Wonder if she did see the attacker, though?' said Ron, looking sadly at Hermione's rigid face. 'Because if he sneaked up on them all, no one'll ever know ...'", "begin": 27100.338, "end": 27109.738, "localBegin": 577.04, "localEnd": 586.44}, {"id": "c016_f000071", "text": "But Harry wasn't looking at Hermione's face. He was more interested in her right hand. It lay clenched on top of her blankets, and bending closer, he saw that a piece of paper was scrunched inside her fist.", "begin": 27109.738, "end": 27122.898, "localBegin": 586.44, "localEnd": 599.6}, {"id": "c016_f000072", "text": "Making sure that Madam Pomfrey was nowhere near, he pointed this out to Ron.", "begin": 27122.898, "end": 27127.218, "localBegin": 599.6, "localEnd": 603.92}, {"id": "c016_f000073", "text": "'Try and get it out,' Ron whispered, shifting his chair so that he blocked Harry from Madam Pomfrey's view.", "begin": 27127.218, "end": 27135.058, "localBegin": 603.92, "localEnd": 611.76}, {"id": "c016_f000074", "text": "It was no easy task. Hermione's hand was clamped so tightly around the paper that Harry was sure he was going to tear it. While Ron kept watch he tugged and twisted, and at last, after several tense minutes, the paper came free.", "begin": 27135.058, "end": 27149.298, "localBegin": 611.76, "localEnd": 626.0}, {"id": "c016_f000075", "text": "It was a page torn from a very old library book. Harry smoothed it out eagerly and Ron leaned close to read it too.", "begin": 27149.298, "end": 27158.338, "localBegin": 626.0, "localEnd": 635.04}, {"id": "c016_f000076", "text": "Of the many fearsome beasts and monsters that roam our land,", "begin": 27158.338, "end": 27162.178, "localBegin": 635.04, "localEnd": 638.88}, {"id": "c016_f000077", "text": "there is none more curious or more deadly than the Basilisk,", "begin": 27162.178, "end": 27166.298, "localBegin": 638.88, "localEnd": 643.0}, {"id": "c016_f000078", "text": "known also as the King of Serpents. This snake, which may", "begin": 27166.298, "end": 27170.578, "localBegin": 643.0, "localEnd": 647.28}, {"id": "c016_f000079", "text": "reach gigantic size, and live many hundreds of years, is born", "begin": 27170.578, "end": 27174.338, "localBegin": 647.28, "localEnd": 651.04}, {"id": "c016_f000080", "text": "from a chicken's egg, hatched beneath a toad. Its methods of", "begin": 27174.338, "end": 27178.378, "localBegin": 651.04, "localEnd": 655.08}, {"id": "c016_f000081", "text": "killing are most wondrous, for aside from its deadly and ven-", "begin": 27178.378, "end": 27182.178, "localBegin": 655.08, "localEnd": 658.88}, {"id": "c016_f000082", "text": "omous fangs, the Basilisk has a murderous stare, and all who are", "begin": 27182.178, "end": 27186.378, "localBegin": 658.88, "localEnd": 663.08}, {"id": "c016_f000083", "text": "fixed with the beam of its eye shall suffer instant death. Spiders", "begin": 27186.378, "end": 27191.098, "localBegin": 663.08, "localEnd": 667.8}, {"id": "c016_f000084", "text": "flee before the Basilisk, for it is their mortal enemy, and the", "begin": 27191.098, "end": 27194.978, "localBegin": 667.8, "localEnd": 671.68}, {"id": "c016_f000085", "text": "Basilisk flees only from the crowing of the rooster, which is fatal", "begin": 27194.978, "end": 27198.938, "localBegin": 671.68, "localEnd": 675.64}, {"id": "c016_f000086", "text": "to it.", "begin": 27198.938, "end": 27200.778, "localBegin": 675.64, "localEnd": 677.48}, {"id": "c016_f000087", "text": "And beneath this, a single word had been written, in a hand Harry recognised as Hermione's. Pipes.", "begin": 27200.778, "end": 27208.058, "localBegin": 677.48, "localEnd": 684.76}, {"id": "c016_f000088", "text": "It was as though somebody had just flicked a light on in his brain.", "begin": 27208.058, "end": 27212.178, "localBegin": 684.76, "localEnd": 688.88}, {"id": "c016_f000089", "text": "'Ron,' he breathed, 'this is it. This is the answer. The monster in the Chamber's a Basilisk - a giant serpent! That's why I've been hearing that voice all over the place, and nobody else has heard it. It's because I understand Parseltongue ...'", "begin": 27212.178, "end": 27228.978, "localBegin": 688.88, "localEnd": 705.68}, {"id": "c016_f000090", "text": "Harry looked up at the beds around him.", "begin": 27228.978, "end": 27231.658, "localBegin": 705.68, "localEnd": 708.36}, {"id": "c016_f000091", "text": "'The Basilisk kills people by looking at them. But no one's died - because no one looked it straight in the eye. Colin saw it through his camera. The Basilisk burned up all the film inside it, but Colin just got Petrified. Justin ... Justin must've seen the Basilisk through Nearly Headless Nick! Nick got the full blast of it, but he couldn't die again ... and Hermione and that Ravenclaw Prefect were found with a mirror next to them. Hermione had just realised the monster was a Basilisk. I bet you anything she warned the first person she met to look round corners with a mirror first! And that girl pulled out her mirror - and -'", "begin": 27231.658, "end": 27274.298, "localBegin": 708.36, "localEnd": 751.0}, {"id": "c016_f000092", "text": "Ron's jaw had dropped.", "begin": 27274.298, "end": 27276.378, "localBegin": 751.0, "localEnd": 753.08}, {"id": "c016_f000093", "text": "'And Mrs Norris?' he whispered eagerly.", "begin": 27276.378, "end": 27280.538, "localBegin": 753.08, "localEnd": 757.24}, {"id": "c016_f000094", "text": "Harry thought hard, picturing the scene on the night of Hallowe'en.", "begin": 27280.538, "end": 27284.618, "localBegin": 757.24, "localEnd": 761.32}, {"id": "c016_f000095", "text": "'The water ...' he said slowly, 'the flood from Moaning Myrtle's bathroom. I bet you Mrs Norris only saw the reflection ...'", "begin": 27284.618, "end": 27294.658, "localBegin": 761.32, "localEnd": 771.36}, {"id": "c016_f000096", "text": "He scanned the page in his hand eagerly. The more he looked at it, the more it made sense.", "begin": 27294.658, "end": 27299.698, "localBegin": 771.36, "localEnd": 776.4}, {"id": "c016_f000097", "text": "'The Basilisk flees only from the crowing of the rooster, which is fatal to it!' he read aloud. 'Hagrid's roosters were killed! The heir of Slytherin didn't want one anywhere near the castle once the Chamber was opened! Spiders flee before the Basilisk! It all fits!'", "begin": 27299.698, "end": 27315.378, "localBegin": 776.4, "localEnd": 792.08}, {"id": "c016_f000098", "text": "'But how's the Basilisk been getting around the place?' said Ron. 'A dirty great snake ... Someone would've seen ...'", "begin": 27315.378, "end": 27321.498, "localBegin": 792.08, "localEnd": 798.2}, {"id": "c016_f000099", "text": "Harry, however, pointed at the word Hermione had scribbled at the foot of the page.", "begin": 27321.498, "end": 27326.258, "localBegin": 798.2, "localEnd": 802.96}, {"id": "c016_f000100", "text": "'Pipes,' he said. 'Pipes ... Ron, it's been using the plumbing. I've been hearing that voice inside the walls ...'", "begin": 27326.258, "end": 27336.778, "localBegin": 802.96, "localEnd": 813.48}, {"id": "c016_f000101", "text": "Ron suddenly grabbed Harry's arm.", "begin": 27336.778, "end": 27339.058, "localBegin": 813.48, "localEnd": 815.76}, {"id": "c016_f000102", "text": "'The entrance to the Chamber of Secrets!' he said hoarsely. 'What if it's a bathroom? What if it's in -'", "begin": 27339.058, "end": 27344.378, "localBegin": 815.76, "localEnd": 821.08}, {"id": "c016_f000103", "text": "'- Moaning Myrtle's bathroom,' said Harry.", "begin": 27344.378, "end": 27348.058, "localBegin": 821.08, "localEnd": 824.76}, {"id": "c016_f000104", "text": "They sat there, excitement coursing through them, hardly able to believe it.", "begin": 27348.058, "end": 27353.258, "localBegin": 824.76, "localEnd": 829.96}, {"id": "c016_f000105", "text": "'This means,' said Harry, 'I can't be the only Parselmouth in the school. The heir of Slytherin's one, too. That's how they've been controlling the Basilisk.'", "begin": 27353.258, "end": 27362.098, "localBegin": 829.96, "localEnd": 838.8}, {"id": "c016_f000106", "text": "'What're we going to do?' said Ron, whose eyes were flashing. 'Shall we go straight to McGonagall?'", "begin": 27362.098, "end": 27368.018, "localBegin": 838.8, "localEnd": 844.72}, {"id": "c016_f000107", "text": "'Let's go to the staff room,' said Harry, jumping up. 'She'll be there in ten minutes, it's nearly break.'", "begin": 27368.018, "end": 27373.338, "localBegin": 844.72, "localEnd": 850.04}, {"id": "c016_f000108", "text": "They ran downstairs. Not wanting to be discovered hanging around in another corridor, they went straight into the deserted staff room. It was a large, panelled room full of dark wooden chairs. Harry and Ron paced around it, too excited to sit down.", "begin": 27373.338, "end": 27388.858, "localBegin": 850.04, "localEnd": 865.56}, {"id": "c016_f000109", "text": "But the bell to signal break never came.", "begin": 27388.858, "end": 27392.658, "localBegin": 865.56, "localEnd": 869.36}, {"id": "c016_f000110", "text": "Instead, echoing through the corridors came Professor McGonagall's voice, magically magnified.", "begin": 27392.658, "end": 27398.298, "localBegin": 869.36, "localEnd": 875.0}, {"id": "c016_f000111", "text": "'All students to return to their house dormitories at once. All teachers return to the staff room. Immediately, please.'", "begin": 27398.298, "end": 27407.858, "localBegin": 875.0, "localEnd": 884.56}, {"id": "c016_f000112", "text": "Harry wheeled around to stare at Ron.", "begin": 27407.858, "end": 27409.898, "localBegin": 884.56, "localEnd": 886.6}, {"id": "c016_f000113", "text": "'Not another attack? Not now?'", "begin": 27409.898, "end": 27413.738, "localBegin": 886.6, "localEnd": 890.44}, {"id": "c016_f000114", "text": "'What'll we do?' said Ron, aghast. 'Go back to the dormitory?'", "begin": 27413.738, "end": 27417.338, "localBegin": 890.44, "localEnd": 894.04}, {"id": "c016_f000115", "text": "'No,' said Harry, glancing around. There was an ugly sort of wardrobe to his left, full of the teachers' cloaks. 'In here. Let's hear what it's all about. Then we can tell them what we've found out.'", "begin": 27417.338, "end": 27429.018, "localBegin": 894.04, "localEnd": 905.72}, {"id": "c016_f000116", "text": "They hid themselves inside it, listening to the rumbling of hundreds of people moving overhead, and the staff-room door banging open. From between the musty folds of the cloaks, they watched the teachers filtering into the room. Some of them were looking puzzled, others downright scared. Then Professor McGonagall arrived.", "begin": 27429.018, "end": 27449.498, "localBegin": 905.72, "localEnd": 926.2}, {"id": "c016_f000117", "text": "'It has happened,' she told the silent staff room. 'A student has been taken by the monster. Right into the Chamber itself.'", "begin": 27449.498, "end": 27458.658, "localBegin": 926.2, "localEnd": 935.36}, {"id": "c016_f000118", "text": "Professor Flitwick let out a squeal. Professor Sprout clapped her hands over her mouth. Snape gripped the back of a chair very hard and said, 'How can you be sure?'", "begin": 27458.658, "end": 27469.778, "localBegin": 935.36, "localEnd": 946.48}, {"id": "c016_f000119", "text": "'The heir of Slytherin,' said Professor McGonagall, who was very white, 'left another message. Right underneath the first one. Her skeleton will lie in the Chamber for ever.'", "begin": 27469.778, "end": 27482.338, "localBegin": 946.48, "localEnd": 959.04}, {"id": "c016_f000120", "text": "Professor Flitwick burst into tears.", "begin": 27482.338, "end": 27485.538, "localBegin": 959.04, "localEnd": 962.24}, {"id": "c016_f000121", "text": "'Who is it?' said Madam Hooch, who had sunk, weak-kneed into a chair. 'Which student?'", "begin": 27485.538, "end": 27491.258, "localBegin": 962.24, "localEnd": 967.96}, {"id": "c016_f000122", "text": "'Ginny Weasley,' said Professor McGonagall.", "begin": 27491.258, "end": 27495.578, "localBegin": 967.96, "localEnd": 972.28}, {"id": "c016_f000123", "text": "Harry felt Ron slide silently down onto the wardrobe floor beside him.", "begin": 27495.578, "end": 27500.858, "localBegin": 972.28, "localEnd": 977.56}, {"id": "c016_f000124", "text": "'We shall have to send all the students home tomorrow,' said Professor McGonagall. 'This is the end of Hogwarts. Dumbledore always said ...'", "begin": 27500.858, "end": 27510.538, "localBegin": 977.56, "localEnd": 987.24}, {"id": "c016_f000125", "text": "The staff-room door banged open again. For one wild moment, Harry was sure it would be Dumbledore. But it was Lockhart, and he was beaming.", "begin": 27510.538, "end": 27519.618, "localBegin": 987.24, "localEnd": 996.32}, {"id": "c016_f000126", "text": "'So sorry - dozed off - what have I missed?'", "begin": 27519.618, "end": 27524.178, "localBegin": 996.32, "localEnd": 1000.88}, {"id": "c016_f000127", "text": "He didn't seem to notice that the other teachers were looking at him with something remarkably like hatred. Snape stepped forward.", "begin": 27524.178, "end": 27532.978, "localBegin": 1000.88, "localEnd": 1009.68}, {"id": "c016_f000128", "text": "'Just the man,' he said. 'The very man. A girl has been snatched by the monster, Lockhart. Taken into the Chamber of Secrets itself. Your moment has come at last.'", "begin": 27532.978, "end": 27546.938, "localBegin": 1009.68, "localEnd": 1023.64}, {"id": "c016_f000129", "text": "Lockhart blanched.", "begin": 27546.938, "end": 27549.258, "localBegin": 1023.64, "localEnd": 1025.96}, {"id": "c016_f000130", "text": "'That's right, Gilderoy,' chipped in Professor Sprout. 'Weren't you saying just last night that you've known all along where the entrance to the Chamber of Secrets is?'", "begin": 27549.258, "end": 27559.418, "localBegin": 1025.96, "localEnd": 1036.12}, {"id": "c016_f000131", "text": "'I - well, I -' spluttered Lockhart.", "begin": 27559.418, "end": 27563.778, "localBegin": 1036.12, "localEnd": 1040.48}, {"id": "c016_f000132", "text": "'Yes, didn't you tell me you were sure you knew what was inside it?' piped up Professor Flitwick.", "begin": 27563.778, "end": 27570.418, "localBegin": 1040.48, "localEnd": 1047.12}, {"id": "c016_f000133", "text": "'D-did I? I don't recall ...'", "begin": 27570.418, "end": 27573.938, "localBegin": 1047.12, "localEnd": 1050.64}, {"id": "c016_f000134", "text": "'I certainly remember you saying you were sorry you hadn't had a crack at the monster before Hagrid was arrested,' said Snape. 'Didn't you say that the whole affair had been bungled, and that you should have been given a free rein from the first?'", "begin": 27573.938, "end": 27590.458, "localBegin": 1050.64, "localEnd": 1067.16}, {"id": "c016_f000135", "text": "Lockhart stared around at his stony-faced colleagues.", "begin": 27590.458, "end": 27594.178, "localBegin": 1067.16, "localEnd": 1070.88}, {"id": "c016_f000136", "text": "'I ... I really never ... You may have misunderstood ...'", "begin": 27594.178, "end": 27599.338, "localBegin": 1070.88, "localEnd": 1076.04}, {"id": "c016_f000137", "text": "'We'll leave it to you, then, Gilderoy,' said Professor McGonagall. 'Tonight will be an excellent time to do it. We'll make sure everyone's out of your way. You'll be able to tackle the monster all by yourself. A free rein at last.'", "begin": 27599.338, "end": 27616.018, "localBegin": 1076.04, "localEnd": 1092.72}, {"id": "c016_f000138", "text": "Lockhart gazed desperately around him, but nobody came to the rescue. He didn't look remotely handsome any more. His lip was trembling, and in the absence of his usually toothy grin he looked weak-chinned and weedy.", "begin": 27616.018, "end": 27629.698, "localBegin": 1092.72, "localEnd": 1106.4}, {"id": "c016_f000139", "text": "'V-very well,' he said. 'I'll - I'll be in my office, getting - getting ready.'", "begin": 27629.698, "end": 27637.058, "localBegin": 1106.4, "localEnd": 1113.76}, {"id": "c016_f000140", "text": "And he left the room.", "begin": 27637.058, "end": 27638.858, "localBegin": 1113.76, "localEnd": 1115.56}, {"id": "c016_f000141", "text": "'Right,' said Professor McGonagall, whose nostrils were flared, 'that's got him out from under our feet. The Heads of Houses should go and inform their students what has happened. Tell them the Hogwarts Express will take them home first thing tomorrow. Will the rest of you please make sure no students have been left outside their dormitories.'", "begin": 27638.858, "end": 27660.138, "localBegin": 1115.56, "localEnd": 1136.84}, {"id": "c016_f000142", "text": "The teachers rose, and left one by one. * It was probably the worst day of Harry's entire life. He, Ron, Fred and George sat together in a corner of the Gryffindor common room, unable to say anything to each other. Percy wasn't there. He had gone to send an owl to Mr and Mrs Weasley, then shut himself up in his dormitory.", "begin": 27660.138, "end": 27682.978, "localBegin": 1136.84, "localEnd": 1159.68}, {"id": "c016_f000143", "text": "No afternoon ever lasted as long as that one, nor had Gryffindor Tower ever been so crowded, yet so quiet. Near sunset, Fred and George went up to bed, unable to sit there any longer.", "begin": 27682.978, "end": 27695.498, "localBegin": 1159.68, "localEnd": 1172.2}, {"id": "c016_f000144", "text": "'She knew something, Harry,' said Ron, speaking for the first time since they had entered the wardrobe in the staff room. 'That's why she was taken. It wasn't some stupid thing about Percy at all. She'd found out something about the Chamber of Secrets. That must be why she was -' Ron rubbed his eyes frantically. 'I mean, she was a pure-blood. There can't be any other reason.'", "begin": 27695.498, "end": 27718.458, "localBegin": 1172.2, "localEnd": 1195.16}, {"id": "c016_f000145", "text": "Harry could see the sun sinking, blood red, below the skyline. This was the worst he had ever felt. If only there was something they could do. Anything.", "begin": 27718.458, "end": 27728.578, "localBegin": 1195.16, "localEnd": 1205.28}, {"id": "c016_f000146", "text": "'Harry,' said Ron, 'd'you think there's any chance at all she's not - you know -'", "begin": 27728.578, "end": 27734.538, "localBegin": 1205.28, "localEnd": 1211.24}, {"id": "c016_f000147", "text": "Harry didn't know what to say. He couldn't see how Ginny could still be alive.", "begin": 27734.538, "end": 27739.938, "localBegin": 1211.24, "localEnd": 1216.64}, {"id": "c016_f000148", "text": "'D'you know what?' said Ron, 'I think we should go and see Lockhart. Tell him what we know. He's going to try and get into the Chamber. We can tell him where we think it is, and tell him it's a Basilisk in there.'", "begin": 27739.938, "end": 27750.658, "localBegin": 1216.64, "localEnd": 1227.36}, {"id": "c016_f000149", "text": "Because Harry couldn't think of anything else to do, and because he wanted to be doing something, he agreed. The Gryffindors around them were so miserable, and felt so sorry for the Weasleys, that nobody tried to stop them as they got up, crossed the room, and left through the portrait hole.", "begin": 27750.658, "end": 27767.218, "localBegin": 1227.36, "localEnd": 1243.92}, {"id": "c016_f000150", "text": "Darkness was falling as they walked down to Lockhart's office. There seemed to be a lot of activity going on inside it. They could hear scraping, thumps and hurried footsteps.", "begin": 27767.218, "end": 27777.778, "localBegin": 1243.92, "localEnd": 1254.48}, {"id": "c016_f000151", "text": "Harry knocked and there was a sudden silence from inside. Then the door opened the tiniest crack and they saw one of Lockhart's eyes peering through it.", "begin": 27777.778, "end": 27786.738, "localBegin": 1254.48, "localEnd": 1263.44}, {"id": "c016_f000152", "text": "'Oh ... Mr Potter ... Mr Weasley ...' he said, opening the door a mite wider. 'I'm rather busy at the moment. If you would be quick ...'", "begin": 27786.738, "end": 27797.058, "localBegin": 1263.44, "localEnd": 1273.76}, {"id": "c016_f000153", "text": "'Professor, we've got some information for you,' said Harry. 'We think it'll help you.'", "begin": 27797.058, "end": 27802.938, "localBegin": 1273.76, "localEnd": 1279.64}, {"id": "c016_f000154", "text": "'Er - well - it's not terribly -' The side of Lockhart's face that they could see looked very uncomfortable. 'I mean - well - all right.'", "begin": 27802.938, "end": 27812.738, "localBegin": 1279.64, "localEnd": 1289.44}, {"id": "c016_f000155", "text": "He opened the door and they entered.", "begin": 27812.738, "end": 27815.338, "localBegin": 1289.44, "localEnd": 1292.04}, {"id": "c016_f000156", "text": "His office had been almost completely stripped. Two large trunks stood open on the floor. Robes, jade green, lilac, midnight blue, had been hastily folded into one of them; books were jumbled untidily into the other. The photographs that had covered the walls were now crammed into boxes on the desk.", "begin": 27815.338, "end": 27834.578, "localBegin": 1292.04, "localEnd": 1311.28}, {"id": "c016_f000157", "text": "'Are you going somewhere?' said Harry.", "begin": 27834.578, "end": 27838.378, "localBegin": 1311.28, "localEnd": 1315.08}, {"id": "c016_f000158", "text": "'Er, well, yes,' said Lockhart, ripping a life-size poster of himself from the back of the door as he spoke, and starting to roll it up. 'Urgent call ... unavoidable ... got to go ...'", "begin": 27838.378, "end": 27851.098, "localBegin": 1315.08, "localEnd": 1327.8}, {"id": "c016_f000159", "text": "'What about my sister?' said Ron jerkily.", "begin": 27851.098, "end": 27855.778, "localBegin": 1327.8, "localEnd": 1332.48}, {"id": "c016_f000160", "text": "'Well, as to that - most unfortunate,' said Lockhart, avoiding their eyes as he wrenched open a drawer and started emptying the contents into a bag. 'No one regrets more than I -'", "begin": 27855.778, "end": 27867.418, "localBegin": 1332.48, "localEnd": 1344.12}, {"id": "c016_f000161", "text": "'You're the Defence Against the Dark Arts teacher!' said Harry. 'You can't go now! Not with all the dark stuff going on here!'", "begin": 27867.418, "end": 27874.898, "localBegin": 1344.12, "localEnd": 1351.6}, {"id": "c016_f000162", "text": "'Well, I must say ... when I took the job ...' Lockhart muttered, now piling socks on top of his robes, 'nothing in the job description ... didn't expect ...'", "begin": 27874.898, "end": 27885.338, "localBegin": 1351.6, "localEnd": 1362.04}, {"id": "c016_f000163", "text": "'You mean you're running away?' said Harry disbelievingly. 'After all that stuff you did in your books?'", "begin": 27885.338, "end": 27892.018, "localBegin": 1362.04, "localEnd": 1368.72}, {"id": "c016_f000164", "text": "'Books can be misleading,' said Lockhart delicately.", "begin": 27892.018, "end": 27896.698, "localBegin": 1368.72, "localEnd": 1373.4}, {"id": "c016_f000165", "text": "'You wrote them!' Harry shouted.", "begin": 27896.698, "end": 27900.258, "localBegin": 1373.4, "localEnd": 1376.96}, {"id": "c016_f000166", "text": "'My dear boy,' said Lockhart, straightening up and frowning at Harry. 'Do use your common sense. My books wouldn't have sold half as well if people didn't think I'd done all those things. No one wants to read about some ugly old Armenian warlock, even if he did save a village from werewolves. He'd look dreadful on the front cover. No dress sense at all. And the witch who banished the Bandon Banshee had a hairy chin. I mean, come on ...'", "begin": 27900.258, "end": 27931.138, "localBegin": 1376.96, "localEnd": 1407.84}, {"id": "c016_f000167", "text": "'So you've just been taking credit for what a load of other people have done?' said Harry incredulously.", "begin": 27931.138, "end": 27938.298, "localBegin": 1407.84, "localEnd": 1415.0}, {"id": "c016_f000168", "text": "'Harry, Harry,' said Lockhart, shaking his head impatiently, 'it's not nearly as simple as that. There was work involved. I had to track these people down. Ask them exactly how they managed to do what they did. Then I had to put a Memory Charm on them so they wouldn't remember doing it. If there's one thing I pride myself on, it's my Memory Charms. No, it's been a lot of work, Harry. It's not all book-signings and publicity photos, you know. You want fame, you have to be prepared for a long hard slog.'", "begin": 27938.298, "end": 27975.538, "localBegin": 1415.0, "localEnd": 1452.24}, {"id": "c016_f000169", "text": "He banged the lids of his trunks shut and locked them.", "begin": 27975.538, "end": 27979.058, "localBegin": 1452.24, "localEnd": 1455.76}, {"id": "c016_f000170", "text": "'Let's see,' he said. 'I think that's everything. Yes. Only one thing left.'", "begin": 27979.058, "end": 27984.978, "localBegin": 1455.76, "localEnd": 1461.68}, {"id": "c016_f000171", "text": "He pulled out his wand and turned to them.", "begin": 27984.978, "end": 27988.178, "localBegin": 1461.68, "localEnd": 1464.88}, {"id": "c016_f000172", "text": "'Awfully sorry, boys, but I'll have to put a Memory Charm on you now. Can't have you blabbing my secrets all over the place. I'd never sell another book ...'", "begin": 27988.178, "end": 27997.338, "localBegin": 1464.88, "localEnd": 1474.04}, {"id": "c016_f000173", "text": "Harry reached his wand just in time. Lockhart had barely raised his, when Harry bellowed, 'Expelliarmus!'", "begin": 27997.338, "end": 28004.258, "localBegin": 1474.04, "localEnd": 1480.96}, {"id": "c016_f000174", "text": "Lockhart was blasted backwards, falling over his trunk. His wand flew high into the air; Ron caught it, and flung it out of the open window.", "begin": 28004.258, "end": 28012.578, "localBegin": 1480.96, "localEnd": 1489.28}, {"id": "c016_f000175", "text": "'Shouldn't have let Professor Snape teach us that one,' said Harry furiously, kicking Lockhart's trunk aside. Lockhart was looking up at him, weedy once more. Harry was still pointing his wand at him.", "begin": 28012.578, "end": 28024.458, "localBegin": 1489.28, "localEnd": 1501.16}, {"id": "c016_f000176", "text": "'What d'you want me to do?' said Lockhart weakly. 'I don't know where the Chamber of Secrets is. There's nothing I can do.'", "begin": 28024.458, "end": 28033.818, "localBegin": 1501.16, "localEnd": 1510.52}, {"id": "c016_f000177", "text": "'You're in luck,' said Harry, forcing Lockhart to his feet at wandpoint. 'We think we know where it is. And what's inside it. Let's go.'", "begin": 28033.818, "end": 28044.018, "localBegin": 1510.52, "localEnd": 1520.72}, {"id": "c016_f000178", "text": "They marched Lockhart out of his office and down the nearest stairs, along the dark corridor where the messages shone on the wall, to the door of Moaning Myrtle's bathroom.", "begin": 28044.018, "end": 28054.338, "localBegin": 1520.72, "localEnd": 1531.04}, {"id": "c016_f000179", "text": "They sent Lockhart in first. Harry was pleased to see that he was shaking.", "begin": 28054.338, "end": 28059.098, "localBegin": 1531.04, "localEnd": 1535.8}, {"id": "c016_f000180", "text": "Moaning Myrtle was sitting on the cistern of the end toilet.", "begin": 28059.098, "end": 28063.058, "localBegin": 1535.8, "localEnd": 1539.76}, {"id": "c016_f000181", "text": "'Oh, it's you,' she said, when she saw Harry. 'What do you want this time?'", "begin": 28063.058, "end": 28069.778, "localBegin": 1539.76, "localEnd": 1546.48}, {"id": "c016_f000182", "text": "'To ask you how you died,' said Harry.", "begin": 28069.778, "end": 28074.218, "localBegin": 1546.48, "localEnd": 1550.92}, {"id": "c016_f000183", "text": "Myrtle's whole aspect changed at once. She looked as though she had never been asked such a flattering question.", "begin": 28074.218, "end": 28081.818, "localBegin": 1550.92, "localEnd": 1558.52}, {"id": "c016_f000184", "text": "'Ooooh, it was dreadful,' she said with relish. 'It happened right in here. I died in this very cubicle. I remember it so well. I'd hidden because Olive Hornby was teasing me about my glasses. The door was locked, and I was crying, and then I heard somebody come in. They said something funny. A different language, I think it must have been. Anyway, what really got me was that it was a boy speaking. So I unlocked the door, to tell him to go and use his own toilet, and then -' Myrtle swelled importantly, her face shining, 'I died.'", "begin": 28081.818, "end": 28126.418, "localBegin": 1558.52, "localEnd": 1603.12}, {"id": "c016_f000185", "text": "'How?' said Harry.", "begin": 28126.418, "end": 28128.938, "localBegin": 1603.12, "localEnd": 1605.64}, {"id": "c016_f000186", "text": "'No idea,' said Myrtle in hushed tones. 'I just remember seeing a pair of great big yellow eyes. My whole body sort of seized up, and then I was floating away ...' She looked dreamily at Harry. 'And then I came back again. I was determined to haunt Olive Hornby, you see. Oh, she was sorry she'd ever laughed at my glasses.'", "begin": 28128.938, "end": 28158.138, "localBegin": 1605.64, "localEnd": 1634.84}, {"id": "c016_f000187", "text": "'Where exactly did you see the eyes?' said Harry.", "begin": 28158.138, "end": 28162.618, "localBegin": 1634.84, "localEnd": 1639.32}, {"id": "c016_f000188", "text": "'Somewhere there,' said Myrtle, pointing vaguely towards the sink in front of her toilet.", "begin": 28162.618, "end": 28169.138, "localBegin": 1639.32, "localEnd": 1645.84}, {"id": "c016_f000189", "text": "Harry and Ron hurried over to it. Lockhart was standing well back, a look of utter terror on his face.", "begin": 28169.138, "end": 28176.258, "localBegin": 1645.84, "localEnd": 1652.96}, {"id": "c016_f000190", "text": "It looked like an ordinary sink. They examined every inch of it, inside and out, including the pipes below. And then Harry saw it: scratched on the side of one of the copper taps was a tiny snake.", "begin": 28176.258, "end": 28190.018, "localBegin": 1652.96, "localEnd": 1666.72}, {"id": "c016_f000191", "text": "'That tap's never worked,' said Myrtle brightly, as he tried to turn it.", "begin": 28190.018, "end": 28195.338, "localBegin": 1666.72, "localEnd": 1672.04}, {"id": "c016_f000192", "text": "'Harry,' said Ron, 'say something. Something in Parseltongue.'", "begin": 28195.338, "end": 28200.138, "localBegin": 1672.04, "localEnd": 1676.84}, {"id": "c016_f000193", "text": "'But -' Harry thought hard. The only times he'd ever managed to speak Parseltongue were when he'd been faced with a real snake. He stared hard at the tiny engraving, trying to imagine it was real.", "begin": 28200.138, "end": 28213.538, "localBegin": 1676.84, "localEnd": 1690.24}, {"id": "c016_f000194", "text": "'Open up,' he said.", "begin": 28213.538, "end": 28216.058, "localBegin": 1690.24, "localEnd": 1692.76}, {"id": "c016_f000195", "text": "He looked at Ron, who shook his head.", "begin": 28216.058, "end": 28218.658, "localBegin": 1692.76, "localEnd": 1695.36}, {"id": "c016_f000196", "text": "'English,' he said.", "begin": 28218.658, "end": 28220.618, "localBegin": 1695.36, "localEnd": 1697.32}, {"id": "c016_f000197", "text": "Harry looked back at the snake, willing himself to believe it was alive. If he moved his head, the candlelight made it look as though it was moving.", "begin": 28220.618, "end": 28229.898, "localBegin": 1697.32, "localEnd": 1706.6}, {"id": "c016_f000198", "text": "'Open up,' he said.", "begin": 28229.898, "end": 28233.818, "localBegin": 1706.6, "localEnd": 1710.52}, {"id": "c016_f000199", "text": "Except that the words weren't what he heard; a strange hissing had escaped him, and at once the tap glowed with a brilliant white light and began to spin. Next second, the sink began to move. The sink, in fact, sank, right out of sight, leaving a large pipe exposed, a pipe wide enough for a man to slide into.", "begin": 28233.818, "end": 28254.418, "localBegin": 1710.52, "localEnd": 1731.12}, {"id": "c016_f000200", "text": "Harry heard Ron gasp and looked up again. He had made up his mind what he was going to do.", "begin": 28254.418, "end": 28260.818, "localBegin": 1731.12, "localEnd": 1737.52}, {"id": "c016_f000201", "text": "'I'm going down there,' he said.", "begin": 28260.818, "end": 28262.818, "localBegin": 1737.52, "localEnd": 1739.52}, {"id": "c016_f000202", "text": "He couldn't not go, not now they had found the entrance to the Chamber, not if there was even the faintest, slimmest, wildest chance that Ginny might be alive.", "begin": 28262.818, "end": 28272.938, "localBegin": 1739.52, "localEnd": 1749.64}, {"id": "c016_f000203", "text": "'Me too,' said Ron.", "begin": 28272.938, "end": 28274.978, "localBegin": 1749.64, "localEnd": 1751.68}, {"id": "c016_f000204", "text": "There was a pause.", "begin": 28274.978, "end": 28276.858, "localBegin": 1751.68, "localEnd": 1753.56}, {"id": "c016_f000205", "text": "'Well, you hardly seem to need me,' said Lockhart, with a shadow of his old smile. 'I'll just -'", "begin": 28276.858, "end": 28284.938, "localBegin": 1753.56, "localEnd": 1761.64}, {"id": "c016_f000206", "text": "He put his hand on the door knob, but Ron and Harry both pointed their wands at him.", "begin": 28284.938, "end": 28289.738, "localBegin": 1761.64, "localEnd": 1766.44}, {"id": "c016_f000207", "text": "'You can go first,' Ron snarled.", "begin": 28289.738, "end": 28292.418, "localBegin": 1766.44, "localEnd": 1769.12}, {"id": "c016_f000208", "text": "White-faced and wandless, Lockhart approached the opening.", "begin": 28292.418, "end": 28296.978, "localBegin": 1769.12, "localEnd": 1773.68}, {"id": "c016_f000209", "text": "'Boys,' he said, his voice feeble, 'boys, what good will it do?'", "begin": 28296.978, "end": 28303.858, "localBegin": 1773.68, "localEnd": 1780.56}, {"id": "c016_f000210", "text": "Harry jabbed him in the back with his wand. Lockhart slid his legs into the pipe.", "begin": 28303.858, "end": 28308.938, "localBegin": 1780.56, "localEnd": 1785.64}, {"id": "c016_f000211", "text": "'I really don't think -' he started to say, but Ron gave him a push, and he slid out of sight. Harry followed quickly. He lowered himself slowly into the pipe, then let go.", "begin": 28308.938, "end": 28320.698, "localBegin": 1785.64, "localEnd": 1797.4}, {"id": "c016_f000212", "text": "It was like rushing down an endless, slimy, dark slide. He could see more pipes branching off in all directions, but none as large as theirs, which twisted and turned, sloping steeply downwards, and he knew that he was falling deeper below the school than even the dungeons. Behind him he could hear Ron, thudding slightly at the curves.", "begin": 28320.698, "end": 28341.498, "localBegin": 1797.4, "localEnd": 1818.2}, {"id": "c016_f000213", "text": "And then, just as he had begun to worry about what would happen when he hit the ground, the pipe levelled out, and he shot out of the end with a wet thud, landing on the damp floor of a dark stone tunnel, large enough to stand in. Lockhart was getting to his feet a little way away, covered in slime and white as a ghost. Harry stood aside as Ron came whizzing out of the pipe, too.", "begin": 28341.498, "end": 28365.658, "localBegin": 1818.2, "localEnd": 1842.36}, {"id": "c016_f000214", "text": "'We must be miles under the school,' said Harry, his voice echoing in the black tunnel.", "begin": 28365.658, "end": 28372.058, "localBegin": 1842.36, "localEnd": 1848.76}, {"id": "c016_f000215", "text": "'Under the lake, probably,' said Ron, squinting around at the dark, slimy walls.", "begin": 28372.058, "end": 28377.138, "localBegin": 1848.76, "localEnd": 1853.84}, {"id": "c016_f000216", "text": "All three of them turned to stare into the darkness ahead.", "begin": 28377.138, "end": 28380.858, "localBegin": 1853.84, "localEnd": 1857.56}, {"id": "c016_f000217", "text": "'Lumos!' Harry muttered to his wand and it lit again. 'C'mon,' he said to Ron and Lockhart, and off they went, their footsteps slapping loudly on the wet floor.", "begin": 28380.858, "end": 28392.498, "localBegin": 1857.56, "localEnd": 1869.2}, {"id": "c016_f000218", "text": "The tunnel was so dark that they could only see a little distance ahead. Their shadows on the wet walls looked monstrous in the wandlight.", "begin": 28392.498, "end": 28401.298, "localBegin": 1869.2, "localEnd": 1878.0}, {"id": "c016_f000219", "text": "'Remember,' Harry said quietly, as they walked cautiously forward, 'any sign of movement, close your eyes straight away ...'", "begin": 28401.298, "end": 28409.818, "localBegin": 1878.0, "localEnd": 1886.52}, {"id": "c016_f000220", "text": "But the tunnel was quiet as the grave, and the first unexpected sound they heard was a loud crunch as Ron stepped on what turned out to be a rat's skull. Harry lowered his wand to look at the floor and saw that it was littered with small animal bones. Trying very hard not to imagine what Ginny might look like if they found her, Harry led the way forward, round a dark bend in the tunnel.", "begin": 28409.818, "end": 28435.058, "localBegin": 1886.52, "localEnd": 1911.76}, {"id": "c016_f000221", "text": "'Harry, there's something up there ...' said Ron hoarsely", "begin": 28435.058, "end": 28441.098, "localBegin": 1911.76, "localEnd": 1917.8}, {"id": "c016_f000222", "text": "grabbing Harry's shoulder.", "begin": 28441.098, "end": 28442.418, "localBegin": 1917.8, "localEnd": 1919.12}, {"id": "c016_f000223", "text": "They froze, watching. Harry could just see the outline of something huge and curved, lying right across the tunnel. It wasn't moving.", "begin": 28442.418, "end": 28452.778, "localBegin": 1919.12, "localEnd": 1929.48}, {"id": "c016_f000224", "text": "'Maybe it's asleep,' he breathed, glancing back at the other two. Lockhart's hands were pressed over his eyes. Harry turned back to look at the thing, his heart beating so fast it hurt.", "begin": 28452.778, "end": 28465.898, "localBegin": 1929.48, "localEnd": 1942.6}, {"id": "c016_f000225", "text": "Very slowly, his eyes as narrow as he could make them and still see, Harry edged forward, his wand held high.", "begin": 28465.898, "end": 28473.378, "localBegin": 1942.6, "localEnd": 1950.08}, {"id": "c016_f000226", "text": "The light slid over a gigantic snake skin, of a vivid, poisonous green, lying curled and empty across the tunnel floor. The creature that had shed it must have been twenty feet long at least.", "begin": 28473.378, "end": 28487.258, "localBegin": 1950.08, "localEnd": 1963.96}, {"id": "c016_f000227", "text": "'Blimey,' said Ron weakly.", "begin": 28487.258, "end": 28490.778, "localBegin": 1963.96, "localEnd": 1967.48}, {"id": "c016_f000228", "text": "There was a sudden movement behind them. Gilderoy Lockhart's knees had given way.", "begin": 28490.778, "end": 28495.898, "localBegin": 1967.48, "localEnd": 1972.6}, {"id": "c016_f000229", "text": "'Get up,' said Ron sharply, pointing his wand at Lockhart.", "begin": 28495.898, "end": 28500.058, "localBegin": 1972.6, "localEnd": 1976.76}, {"id": "c016_f000230", "text": "Lockhart got to his feet - then he dived at Ron, knocking him to the ground.", "begin": 28500.058, "end": 28504.498, "localBegin": 1976.76, "localEnd": 1981.2}, {"id": "c016_f000231", "text": "Harry jumped forward, but too late. Lockhart was straightening up, panting, Ron's wand in his hand and a gleaming smile back on his face.", "begin": 28504.498, "end": 28513.098, "localBegin": 1981.2, "localEnd": 1989.8}, {"id": "c016_f000232", "text": "'The adventure ends here, boys!' he said. 'I shall take a bit of this skin back up to the school, tell them I was too late to save the girl, and that you two tragically lost your minds at the sight of her mangled body. Say goodbye to your memories!'", "begin": 28513.098, "end": 28530.538, "localBegin": 1989.8, "localEnd": 2007.24}, {"id": "c016_f000233", "text": "He raised Ron's Spellotaped wand high over his head and yelled, 'Obliviate!'", "begin": 28530.538, "end": 28536.698, "localBegin": 2007.24, "localEnd": 2013.4}, {"id": "c016_f000234", "text": "The wand exploded with the force of a small bomb. Harry flung his arms over his head and ran, slipping over the coils of snake skin, out of the way of great chunks of tunnel ceiling which were thundering to the floor. Next moment, he was standing alone, gazing at a solid wall of broken rock.", "begin": 28536.698, "end": 28554.178, "localBegin": 2013.4, "localEnd": 2030.88}, {"id": "c016_f000235", "text": "'Ron!' he shouted. 'Are you OK? Ron!'", "begin": 28554.178, "end": 28557.898, "localBegin": 2030.88, "localEnd": 2034.6}, {"id": "c016_f000236", "text": "'I'm here!' came Ron's muffled voice from behind the rockfall. 'I'm OK. This git's not, though - he got blasted by the wand.'", "begin": 28557.898, "end": 28568.498, "localBegin": 2034.6, "localEnd": 2045.2}, {"id": "c016_f000237", "text": "There was a dull thud and a loud 'ow!'. It sounded as though Ron had just kicked Lockhart in the shins.", "begin": 28568.498, "end": 28576.058, "localBegin": 2045.2, "localEnd": 2052.76}, {"id": "c016_f000238", "text": "'What now?' Ron's voice said, sounding desperate. 'We can't get through. It'll take ages ...'", "begin": 28576.058, "end": 28583.298, "localBegin": 2052.76, "localEnd": 2060.0}, {"id": "c016_f000239", "text": "Harry looked up at the tunnel ceiling. Huge cracks had", "begin": 28583.298, "end": 28587.218, "localBegin": 2060.0, "localEnd": 2063.92}, {"id": "c016_f000240", "text": "appeared in it. He had never tried to break apart anything as large as these rocks by magic, and now didn't seem a good moment to try - what if the whole tunnel caved in?", "begin": 28587.218, "end": 28597.178, "localBegin": 2063.92, "localEnd": 2073.88}, {"id": "c016_f000241", "text": "There was another thud and another 'ow!' from behind the rocks. They were wasting time. Ginny had already been in the Chamber of Secrets for hours. Harry knew there was only one thing to do.", "begin": 28597.178, "end": 28609.698, "localBegin": 2073.88, "localEnd": 2086.4}, {"id": "c016_f000242", "text": "'Wait there,' he called to Ron. 'Wait with Lockhart. I'll go on. If I'm not back in an hour ...'", "begin": 28609.698, "end": 28616.538, "localBegin": 2086.4, "localEnd": 2093.24}, {"id": "c016_f000243", "text": "There was a very pregnant pause.", "begin": 28616.538, "end": 28619.538, "localBegin": 2093.24, "localEnd": 2096.24}, {"id": "c016_f000244", "text": "'I'll try and shift some of this rock,' said Ron, who seemed to be trying to keep his voice steady. 'So you can - can get back through. And, Harry -'", "begin": 28619.538, "end": 28629.498, "localBegin": 2096.24, "localEnd": 2106.2}, {"id": "c016_f000245", "text": "'See you in a bit,' said Harry, trying to inject some confidence into his shaking voice.", "begin": 28629.498, "end": 28634.538, "localBegin": 2106.2, "localEnd": 2111.24}, {"id": "c016_f000246", "text": "And he set off alone past the giant snake skin.", "begin": 28634.538, "end": 28638.658, "localBegin": 2111.24, "localEnd": 2115.36}, {"id": "c016_f000247", "text": "Soon the distant noise of Ron straining to shift the rocks was gone. The tunnel turned and turned again. Every nerve in Harry's body was tingling unpleasantly. He wanted the tunnel to end, yet dreaded what he'd find when it did. And then, at last, as he crept around yet another bend, he saw a solid wall ahead on which two entwined serpents were carved, their eyes set with great, glinting emeralds.", "begin": 28638.658, "end": 28667.058, "localBegin": 2115.36, "localEnd": 2143.76}, {"id": "c016_f000248", "text": "Harry approached, his throat very dry. There was no need to pretend these stone snakes were real, their eyes looked strangely alive.", "begin": 28667.058, "end": 28676.498, "localBegin": 2143.76, "localEnd": 2153.2}, {"id": "c016_f000249", "text": "He could guess what he had to do. He cleared his throat, and the emerald eyes seemed to flicker.", "begin": 28676.498, "end": 28682.618, "localBegin": 2153.2, "localEnd": 2159.32}, {"id": "c016_f000250", "text": "'Open,' said Harry, in a low, faint hiss.", "begin": 28682.618, "end": 28688.258, "localBegin": 2159.32, "localEnd": 2164.96}, {"id": "c016_f000251", "text": "The serpents parted as the wall cracked open, the halves slid smoothly out of sight, and Harry, shaking from head to foot, walked inside.", "begin": 28688.258, "end": 28701.378, "localBegin": 2164.96, "localEnd": 2178.08}]}, {"kind": "chapter", "number": 17, "title": "The Heir of Slytherin", "audio": "audio/chapter_017.mp3", "start": 28701.413, "end": 30883.413, "duration": 2182.0, "paragraphs": [{"id": "c017_f000001", "text": "Chapter Seventeen. The Heir of Slytherin.", "begin": 28701.413, "end": 28706.853, "localBegin": 0.0, "localEnd": 5.44}, {"id": "c017_f000002", "text": "He was standing at the end of a very long, dimly lit chamber. Towering stone pillars entwined with more carved serpents rose to support a ceiling lost in darkness, casting long black shadows through the odd, greenish gloom that filled the place.", "begin": 28706.853, "end": 28722.293, "localBegin": 5.44, "localEnd": 20.88}, {"id": "c017_f000003", "text": "His heart beating very fast, Harry stood listening to the chill silence. Could the Basilisk be lurking in a shadowy corner, behind a pillar? And where was Ginny?", "begin": 28722.293, "end": 28734.053, "localBegin": 20.88, "localEnd": 32.64}, {"id": "c017_f000004", "text": "He pulled out his wand and moved forward between the serpentine columns. Every careful footstep echoed loudly off the shadowy walls. He kept his eyes narrowed, ready to clamp them shut at the smallest sign of movement. The hollow eye sockets of the stone snakes seemed to be following him. More than once, with a jolt of the stomach, he thought he saw one stir.", "begin": 28734.053, "end": 28756.333, "localBegin": 32.64, "localEnd": 54.92}, {"id": "c017_f000005", "text": "Then, as he drew level with the last pair of pillars, a statue high as the Chamber itself loomed into view, standing against the back wall.", "begin": 28756.333, "end": 28766.373, "localBegin": 54.92, "localEnd": 64.96}, {"id": "c017_f000006", "text": "Harry had to crane his neck to look up into the giant face above: it was ancient and monkey-like, with a long thin beard that fell almost to the bottom of the wizard's sweeping stone robes, where two enormous grey feet stood on the smooth chamber floor. And between the feet, face down, lay a small, black-robed figure with flaming red hair.", "begin": 28766.373, "end": 28791.173, "localBegin": 64.96, "localEnd": 89.76}, {"id": "c017_f000007", "text": "'Ginny!' Harry muttered, sprinting to her and dropping to his knees. 'Ginny! Don't be dead! Please don't be dead!' He flung his wand aside, grabbed Ginny's shoulders and turned her over. Her face was white as marble, and as cold, yet her eyes were closed, so she wasn't Petrified. But then she must be ...", "begin": 28791.173, "end": 28815.093, "localBegin": 89.76, "localEnd": 113.68}, {"id": "c017_f000008", "text": "'Ginny, please wake up,' Harry muttered desperately, shaking her. Ginny's head lolled hopelessly from side to side.", "begin": 28815.093, "end": 28825.973, "localBegin": 113.68, "localEnd": 124.56}, {"id": "c017_f000009", "text": "'She won't wake,' said a soft voice.", "begin": 28825.973, "end": 28829.093, "localBegin": 124.56, "localEnd": 127.68}, {"id": "c017_f000010", "text": "Harry jumped and spun around on his knees.", "begin": 28829.093, "end": 28832.453, "localBegin": 127.68, "localEnd": 131.04}, {"id": "c017_f000011", "text": "A tall, black-haired boy was leaning against the nearest pillar, watching. He was strangely blurred around the edges, as though Harry was looking at him through a misted window. But there was no mistaking him.", "begin": 28832.453, "end": 28845.013, "localBegin": 131.04, "localEnd": 143.6}, {"id": "c017_f000012", "text": "'Tom - Tom Riddle?'", "begin": 28845.013, "end": 28849.493, "localBegin": 143.6, "localEnd": 148.08}, {"id": "c017_f000013", "text": "Riddle nodded, not taking his eyes off Harry's face.", "begin": 28849.493, "end": 28853.493, "localBegin": 148.08, "localEnd": 152.08}, {"id": "c017_f000014", "text": "'What d'you mean, she won't wake?' Harry said desperately. 'She's not - she's not -?'", "begin": 28853.493, "end": 28858.333, "localBegin": 152.08, "localEnd": 156.92}, {"id": "c017_f000015", "text": "'She's still alive,' said Riddle. 'But only just.'", "begin": 28858.333, "end": 28863.333, "localBegin": 156.92, "localEnd": 161.92}, {"id": "c017_f000016", "text": "Harry stared at him. Tom Riddle had been at Hogwarts fifty years ago, yet here he stood, a weird, misty light shining about him, not a day older than sixteen.", "begin": 28863.333, "end": 28876.493, "localBegin": 161.92, "localEnd": 175.08}, {"id": "c017_f000017", "text": "'Are you a ghost?' Harry said uncertainly.", "begin": 28876.493, "end": 28880.613, "localBegin": 175.08, "localEnd": 179.2}, {"id": "c017_f000018", "text": "'A memory,' said Riddle quietly. 'Preserved in a diary for fifty years.'", "begin": 28880.613, "end": 28887.173, "localBegin": 179.2, "localEnd": 185.76}, {"id": "c017_f000019", "text": "He pointed towards the floor near the statue's giant toes. Lying open there was the little black diary Harry had found in Moaning Myrtle's bathroom. For a second, Harry wondered how it had got there - but there were more pressing matters to deal with.", "begin": 28887.173, "end": 28902.613, "localBegin": 185.76, "localEnd": 201.2}, {"id": "c017_f000020", "text": "'You've got to help me, Tom,' Harry said, raising Ginny's head again. 'We've got to get her out of here. There's a Basilisk ... I don't know where it is, but it could be along any moment. Please, help me ...'", "begin": 28902.613, "end": 28915.333, "localBegin": 201.2, "localEnd": 213.92}, {"id": "c017_f000021", "text": "Riddle didn't move. Harry, sweating, managed to hoist Ginny half off the floor, and bent to pick up his wand again.", "begin": 28915.333, "end": 28923.733, "localBegin": 213.92, "localEnd": 222.32}, {"id": "c017_f000022", "text": "But his wand had gone.", "begin": 28923.733, "end": 28925.813, "localBegin": 222.32, "localEnd": 224.4}, {"id": "c017_f000023", "text": "'Did you see -?'", "begin": 28925.813, "end": 28927.293, "localBegin": 224.4, "localEnd": 225.88}, {"id": "c017_f000024", "text": "He looked up. Riddle was still watching him - twirling Harry's wand between his long fingers.", "begin": 28927.293, "end": 28933.213, "localBegin": 225.88, "localEnd": 231.8}, {"id": "c017_f000025", "text": "'Thanks,' said Harry, stretching out his hand for it.", "begin": 28933.213, "end": 28937.333, "localBegin": 231.8, "localEnd": 235.92}, {"id": "c017_f000026", "text": "A smile curled the corners of Riddle's mouth. He continued to stare at Harry, twirling the wand idly.", "begin": 28937.333, "end": 28944.693, "localBegin": 235.92, "localEnd": 243.28}, {"id": "c017_f000027", "text": "'Listen,' said Harry urgently, his knees sagging with Ginny's dead weight, 'we've got to go! If the Basilisk comes ...'", "begin": 28944.693, "end": 28952.213, "localBegin": 243.28, "localEnd": 250.8}, {"id": "c017_f000028", "text": "'It won't come until it is called,' said Riddle calmly.", "begin": 28952.213, "end": 28957.573, "localBegin": 250.8, "localEnd": 256.16}, {"id": "c017_f000029", "text": "Harry lowered Ginny back onto the floor, unable to hold her up any longer.", "begin": 28957.573, "end": 28961.973, "localBegin": 256.16, "localEnd": 260.56}, {"id": "c017_f000030", "text": "'What d'you mean?' he said. 'Look, give me my wand, I might need it.'", "begin": 28961.973, "end": 28966.413, "localBegin": 260.56, "localEnd": 265.0}, {"id": "c017_f000031", "text": "Riddle's smile broadened.", "begin": 28966.413, "end": 28968.493, "localBegin": 265.0, "localEnd": 267.08}, {"id": "c017_f000032", "text": "'You won't be needing it,' he said.", "begin": 28968.493, "end": 28971.853, "localBegin": 267.08, "localEnd": 270.44}, {"id": "c017_f000033", "text": "Harry stared at him.", "begin": 28971.853, "end": 28972.973, "localBegin": 270.44, "localEnd": 271.56}, {"id": "c017_f000034", "text": "'What d'you mean, I won't be -?'", "begin": 28972.973, "end": 28974.853, "localBegin": 271.56, "localEnd": 273.44}, {"id": "c017_f000035", "text": "'I've waited a long time for this, Harry Potter,' said Riddle. 'For the chance to see you. To speak to you.'", "begin": 28974.853, "end": 28982.733, "localBegin": 273.44, "localEnd": 281.32}, {"id": "c017_f000036", "text": "'Look,' said Harry, losing patience, 'I don't think you get it. We're in the Chamber of Secrets. We can talk later.'", "begin": 28982.733, "end": 28989.693, "localBegin": 281.32, "localEnd": 288.28}, {"id": "c017_f000037", "text": "'We're going to talk now,' said Riddle, still smiling broadly, and he pocketed Harry's wand.", "begin": 28989.693, "end": 28996.373, "localBegin": 288.28, "localEnd": 294.96}, {"id": "c017_f000038", "text": "Harry stared at him. There was something very funny going on here.", "begin": 28996.373, "end": 29001.613, "localBegin": 294.96, "localEnd": 300.2}, {"id": "c017_f000039", "text": "'How did Ginny get like this?' he asked slowly.", "begin": 29001.613, "end": 29006.293, "localBegin": 300.2, "localEnd": 304.88}, {"id": "c017_f000040", "text": "'Well, that's an interesting question,' said Riddle pleasantly. 'And quite a long story. I suppose the real reason Ginny Weasley's like this is because she opened her heart and spilled all her secrets to an invisible stranger.'", "begin": 29006.293, "end": 29022.373, "localBegin": 304.88, "localEnd": 320.96}, {"id": "c017_f000041", "text": "'What are you talking about?' said Harry.", "begin": 29022.373, "end": 29025.133, "localBegin": 320.96, "localEnd": 323.72}, {"id": "c017_f000042", "text": "'The diary,' said Riddle. 'My diary. Little Ginny's been writing in it for months and months, telling me all her pitiful worries and woes: how her brothers tease her, how she had to come to school with second-hand robes and books, how -' Riddle's eyes glinted '- how she didn't think famous, good, great Harry Potter would ever like her ...'", "begin": 29025.133, "end": 29050.493, "localBegin": 323.72, "localEnd": 349.08}, {"id": "c017_f000043", "text": "All the time he spoke, Riddle's eyes never left Harry's face. There was an almost hungry look in them.", "begin": 29050.493, "end": 29058.013, "localBegin": 349.08, "localEnd": 356.6}, {"id": "c017_f000044", "text": "'It's very boring, having to listen to the silly little troubles of an eleven-year-old girl,' he went on. 'But I was patient. I wrote back, I was sympathetic, I was kind. Ginny simply loved me. No one's ever understood me like you, Tom ... I'm so glad I've got this diary to confide in ... It's like having a friend I can carry round in my pocket ...'", "begin": 29058.013, "end": 29083.653, "localBegin": 356.6, "localEnd": 382.24}, {"id": "c017_f000045", "text": "Riddle laughed, a high, cold laugh that didn't suit him. It made the hairs stand up on the back of Harry's neck.", "begin": 29083.653, "end": 29091.253, "localBegin": 382.24, "localEnd": 389.84}, {"id": "c017_f000046", "text": "'If I say it myself, Harry, I've always been able to charm the people I needed. So Ginny poured out her soul to me, and her soul happened to be exactly what I wanted. I grew stronger and stronger on a diet of her deepest fears, her darkest secrets. I grew powerful, far more powerful than little Miss Weasley. Powerful enough to start feeding Miss Weasley a few of my secrets, to start pouring a little of my soul back into her ...'", "begin": 29091.253, "end": 29123.093, "localBegin": 389.84, "localEnd": 421.68}, {"id": "c017_f000047", "text": "'What d'you mean?' said Harry, whose mouth had gone very dry.", "begin": 29123.093, "end": 29127.533, "localBegin": 421.68, "localEnd": 426.12}, {"id": "c017_f000048", "text": "'Haven't you guessed yet, Harry Potter?' said Riddle softly. 'Ginny Weasley opened the Chamber of Secrets. She strangled the school roosters and daubed threatening messages on the walls. She set the serpent of Slytherin on four Mudbloods, and the Squib's cat.'", "begin": 29127.533, "end": 29145.333, "localBegin": 426.12, "localEnd": 443.92}, {"id": "c017_f000049", "text": "'No,' Harry whispered.", "begin": 29145.333, "end": 29147.213, "localBegin": 443.92, "localEnd": 445.8}, {"id": "c017_f000050", "text": "'Yes,' said Riddle, calmly. 'Of course, she didn't know what she was doing at first. It was very amusing. I wish you could have seen her new diary entries ... Far more interesting, they became ... Dear Tom,' he recited, watching Harry's horrified face, 'I think I'm losing my memory. There are rooster feathers all over my robes and I don't know how they got there. Dear Tom, I can't remember what I did on the night of Hallowe'en, but a cat was attacked and I've got paint all down my front. Dear Tom, Percy keeps telling me I'm pale and I'm not myself. I think he suspects me ... There was another attack today and I don't know where I was. Tom, what am I going to do? I think I'm going mad ... I think I'm the one attacking everyone, Tom!'", "begin": 29147.213, "end": 29200.173, "localBegin": 445.8, "localEnd": 498.76}, {"id": "c017_f000051", "text": "Harry's fists were clenched, the nails digging deep into his palms.", "begin": 29200.173, "end": 29205.613, "localBegin": 498.76, "localEnd": 504.2}, {"id": "c017_f000052", "text": "'It took a very long time for stupid little Ginny to stop trusting her diary,' said Riddle. 'But she finally became suspicious and tried to dispose of it. And that's where you came in, Harry. You found it, and I couldn't have been more delighted. Of all the people who could have picked it up, it was you, the very person I was most anxious to meet ...'", "begin": 29205.613, "end": 29231.573, "localBegin": 504.2, "localEnd": 530.16}, {"id": "c017_f000053", "text": "'And why did you want to meet me?' said Harry. Anger was coursing through him and it was an effort to keep his voice steady.", "begin": 29231.573, "end": 29239.293, "localBegin": 530.16, "localEnd": 537.88}, {"id": "c017_f000054", "text": "'Well, you see, Ginny told me all about you, Harry,' said Riddle. 'Your whole fascinating history.' His eyes roved over the lightning scar on Harry's forehead, and his expression grew hungrier. 'I knew I must find out more about you, talk to you, meet you if I could. So I decided to show you my famous capture of that great oaf, Hagrid, to gain your trust.'", "begin": 29239.293, "end": 29264.973, "localBegin": 537.88, "localEnd": 563.56}, {"id": "c017_f000055", "text": "'Hagrid's my friend,' said Harry, his voice now shaking. 'And you framed him, didn't you? I thought you made a mistake, but -'", "begin": 29264.973, "end": 29272.413, "localBegin": 563.56, "localEnd": 571.0}, {"id": "c017_f000056", "text": "Riddle laughed his high laugh again.", "begin": 29272.413, "end": 29274.933, "localBegin": 571.0, "localEnd": 573.52}, {"id": "c017_f000057", "text": "'It was my word against Hagrid's, Harry. Well, you can imagine how it looked to old Armando Dippet. On the one hand, Tom", "begin": 29274.933, "end": 29284.213, "localBegin": 573.52, "localEnd": 582.8}, {"id": "c017_f000058", "text": "Riddle, poor but brilliant, parentless but so brave, school Prefect, model student; on the other hand, big, blundering Hagrid, in trouble every other week, trying to raise werewolf cubs under his bed, sneaking off to the Forbidden Forest to wrestle trolls. But I admit, even I was surprised how well the plan worked. I thought someone must realise that Hagrid couldn't possibly be the heir of Slytherin. It had taken me five whole years to find out everything I could about the Chamber of Secrets and discover the secret entrance ... as though Hagrid had the brains, or the power!", "begin": 29284.213, "end": 29324.293, "localBegin": 582.8, "localEnd": 622.88}, {"id": "c017_f000059", "text": "'Only the Transfiguration teacher, Dumbledore, seemed to think Hagrid was innocent. He persuaded Dippet to keep Hagrid and train him as gamekeeper. Yes, I think Dumbledore might have guessed. Dumbledore never seemed to like me as much as the other teachers did ...'", "begin": 29324.293, "end": 29342.413, "localBegin": 622.88, "localEnd": 641.0}, {"id": "c017_f000060", "text": "'I bet Dumbledore saw right through you,' said Harry, his teeth
