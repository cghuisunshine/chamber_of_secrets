gritted.", "begin": 29342.413, "end": 29348.293, "localBegin": 641.0, "localEnd": 646.88}, {"id": "c017_f000061", "text": "'Well, he certainly kept an annoyingly close watch on me after Hagrid was expelled,' said Riddle carelessly. 'I knew it wouldn't be safe to open the Chamber again while I was still at school. But I wasn't going to waste those long years I'd spent searching for it. I decided to leave behind a diary, preserving my sixteen-year-old self in its pages, so that one day, with luck, I would be able to lead another in my footsteps, and finish Salazar Slytherin's noble work.'", "begin": 29348.293, "end": 29379.973, "localBegin": 646.88, "localEnd": 678.56}, {"id": "c017_f000062", "text": "'Well, you haven't finished it,' said Harry triumphantly. 'No one's died this time, not even the cat. In a few hours the Mandrake Draught will be ready and everyone who was Petrified will be all right again.'", "begin": 29379.973, "end": 29391.973, "localBegin": 678.56, "localEnd": 690.56}, {"id": "c017_f000063", "text": "'Haven't I already told you,' said Riddle quietly, 'that killing Mudbloods doesn't matter to me any more? For many months now, my new target has been - you.'", "begin": 29391.973, "end": 29405.413, "localBegin": 690.56, "localEnd": 704.0}, {"id": "c017_f000064", "text": "Harry stared at him.", "begin": 29405.413, "end": 29407.333, "localBegin": 704.0, "localEnd": 705.92}, {"id": "c017_f000065", "text": "'Imagine how angry I was when the next time my diary was opened, it was Ginny who was writing to me, not you. She saw you with the diary, you see, and panicked. What if you found out how to work it, and I repeated all her secrets to you? What if, even worse, I told you who'd been strangling roosters? So the foolish little brat waited until your dormitory was deserted and stole it back. But I knew what I must do. It was clear to me that you were on the trail of Slytherin's heir. From everything Ginny", "begin": 29407.333, "end": 29436.253, "localBegin": 705.92, "localEnd": 734.84}, {"id": "c017_f000066", "text": "had told me about you, I knew you would go to any lengths to solve the mystery - particularly if one of your best friends was attacked. And Ginny had told me the whole school was buzzing because you could speak Parseltongue ...", "begin": 29436.253, "end": 29449.533, "localBegin": 734.84, "localEnd": 748.12}, {"id": "c017_f000067", "text": "'So I made Ginny write her own farewell on the wall and come down here to wait. She struggled and cried and became very boring. But there isn't much life left in her: she put too much into the diary, into me. Enough to let me leave its pages at last. I have been waiting for you to appear since we arrived here. I knew you'd come. I have many questions for you, Harry Potter.'", "begin": 29449.533, "end": 29478.893, "localBegin": 748.12, "localEnd": 777.48}, {"id": "c017_f000068", "text": "'Like what?' Harry spat, fists still clenched.", "begin": 29478.893, "end": 29483.653, "localBegin": 777.48, "localEnd": 782.24}, {"id": "c017_f000069", "text": "'Well,' said Riddle, smiling pleasantly, 'how is it that a baby with no extraordinary magical talent managed to defeat the greatest wizard of all time? How did you escape with nothing but a scar, while Lord Voldemort's powers were destroyed?'", "begin": 29483.653, "end": 29504.053, "localBegin": 782.24, "localEnd": 802.64}, {"id": "c017_f000070", "text": "There was an odd red gleam in his hungry eyes now.", "begin": 29504.053, "end": 29506.773, "localBegin": 802.64, "localEnd": 805.36}, {"id": "c017_f000071", "text": "'Why do you care how I escaped?' said Harry slowly. 'Voldemort was after your time.'", "begin": 29506.773, "end": 29514.253, "localBegin": 805.36, "localEnd": 812.84}, {"id": "c017_f000072", "text": "'Voldemort,' said Riddle softly, 'is my past, present and future, Harry Potter ...'", "begin": 29514.253, "end": 29522.933, "localBegin": 812.84, "localEnd": 821.52}, {"id": "c017_f000073", "text": "He pulled Harry's wand from his pocket and began to trace it through the air, writing three shimmering words: TOM MARVOLO RIDDLE", "begin": 29522.933, "end": 29532.813, "localBegin": 821.52, "localEnd": 831.4}, {"id": "c017_f000074", "text": "Then he waved the wand once, and the letters of his name rearranged themselves: I AM LORD VOLDEMORT", "begin": 29532.813, "end": 29542.333, "localBegin": 831.4, "localEnd": 840.92}, {"id": "c017_f000075", "text": "'You see?' he whispered. 'It was a name I was already using at Hogwarts, to my most intimate friends only, of course. You think I was going to use my filthy Muggle father's name for ever? I, in whose veins runs the blood of Salazar Slytherin himself, through my mother's side? I, keep the name of a foul, common Muggle, who abandoned me even before I was born, just because he found out his wife was a witch? No, Harry. I fashioned myself a new name, a name I knew wizards everywhere would one day fear to speak, when I had become the greatest sorcerer in the world!'", "begin": 29542.333, "end": 29585.853, "localBegin": 840.92, "localEnd": 884.44}, {"id": "c017_f000076", "text": "Harry's brain seemed to have jammed. He stared numbly at Riddle, at the orphaned boy who had grown up to murder Harry's own parents, and so many others ... At last he forced himself to speak.", "begin": 29585.853, "end": 29600.373, "localBegin": 884.44, "localEnd": 898.96}, {"id": "c017_f000077", "text": "'You're not,' he said, his quiet voice full of hatred.", "begin": 29600.373, "end": 29604.773, "localBegin": 898.96, "localEnd": 903.36}, {"id": "c017_f000078", "text": "'Not what?' snapped Riddle.", "begin": 29604.773, "end": 29607.133, "localBegin": 903.36, "localEnd": 905.72}, {"id": "c017_f000079", "text": "'Not the greatest sorcerer in the world,' said Harry, breathing fast. 'Sorry to disappoint you, and all that, but the greatest wizard in the world is Albus Dumbledore. Everyone says so. Even when you were strong, you didn't dare try and take over at Hogwarts. Dumbledore saw through you when you were at school and he still frightens you now, wherever you're hiding these days.'", "begin": 29607.133, "end": 29628.013, "localBegin": 905.72, "localEnd": 926.6}, {"id": "c017_f000080", "text": "The smile had gone from Riddle's face, to be replaced by a very ugly look.", "begin": 29628.013, "end": 29632.973, "localBegin": 926.6, "localEnd": 931.56}, {"id": "c017_f000081", "text": "'Dumbledore's been driven out of this castle by the mere memory of me!' he hissed.", "begin": 29632.973, "end": 29639.653, "localBegin": 931.56, "localEnd": 938.24}, {"id": "c017_f000082", "text": "'He's not as gone as you might think!' Harry retorted. He was speaking at random, wanting to scare Riddle, wishing rather than believing it to be true.", "begin": 29639.653, "end": 29649.453, "localBegin": 938.24, "localEnd": 948.04}, {"id": "c017_f000083", "text": "Riddle opened his mouth, but froze.", "begin": 29649.453, "end": 29653.093, "localBegin": 948.04, "localEnd": 951.68}, {"id": "c017_f000084", "text": "Music was coming from somewhere. Riddle whirled around to stare down the empty chamber. The music was growing louder. It was eerie, spine-tingling, unearthly; it lifted the hair on Harry's scalp and made his heart feel as though it was swelling to twice its normal size. Then, as the music reached such a pitch that Harry felt it vibrating inside his own ribs, flames erupted at the top of the nearest pillar.", "begin": 29653.093, "end": 29679.653, "localBegin": 951.68, "localEnd": 978.24}, {"id": "c017_f000085", "text": "A crimson bird the size of a swan had appeared, piping its weird music to the vaulted ceiling. It had a glittering golden tail as long as a peacock's and gleaming golden talons, which were gripping a ragged bundle.", "begin": 29679.653, "end": 29693.613, "localBegin": 978.24, "localEnd": 992.2}, {"id": "c017_f000086", "text": "A second later, the bird was flying straight at Harry. It dropped the ragged thing it was carrying at his feet, then landed heavily on his shoulder. As it folded its great wings, Harry looked up and saw it had a long, sharp golden beak and beady black eyes.", "begin": 29693.613, "end": 29711.213, "localBegin": 992.2, "localEnd": 1009.8}, {"id": "c017_f000087", "text": "The bird stopped singing. It sat still and warm next to Harry's cheek, gazing steadily at Riddle.", "begin": 29711.213, "end": 29720.173, "localBegin": 1009.8, "localEnd": 1018.76}, {"id": "c017_f000088", "text": "'That's a phoenix ...' said Riddle, staring shrewdly back at it.", "begin": 29720.173, "end": 29725.733, "localBegin": 1018.76, "localEnd": 1024.32}, {"id": "c017_f000089", "text": "'Fawkes?' Harry breathed, and he felt the bird's golden claws squeeze his shoulder gently.", "begin": 29725.733, "end": 29732.333, "localBegin": 1024.32, "localEnd": 1030.92}, {"id": "c017_f000090", "text": "'And that -' said Riddle, now eyeing the ragged thing that Fawkes had dropped, 'that's the old school Sorting Hat.'", "begin": 29732.333, "end": 29741.693, "localBegin": 1030.92, "localEnd": 1040.28}, {"id": "c017_f000091", "text": "So it was. Patched, frayed and dirty, the Hat lay motionless at Harry's feet.", "begin": 29741.693, "end": 29746.973, "localBegin": 1040.28, "localEnd": 1045.56}, {"id": "c017_f000092", "text": "Riddle began to laugh again. He laughed so hard that the dark", "begin": 29746.973, "end": 29751.013, "localBegin": 1045.56, "localEnd": 1049.6}, {"id": "c017_f000093", "text": "chamber rang with it, as though ten Riddles were laughing at once.", "begin": 29751.013, "end": 29755.093, "localBegin": 1049.6, "localEnd": 1053.68}, {"id": "c017_f000094", "text": "'This is what Dumbledore sends his defender! A songbird and an old hat! Do you feel brave, Harry Potter? Do you feel safe now?'", "begin": 29755.093, "end": 29764.293, "localBegin": 1053.68, "localEnd": 1062.88}, {"id": "c017_f000095", "text": "Harry didn't answer. He might not see what use Fawkes or the Sorting Hat were, but he was no longer alone, and he waited with mounting courage for Riddle to stop laughing.", "begin": 29764.293, "end": 29775.093, "localBegin": 1062.88, "localEnd": 1073.68}, {"id": "c017_f000096", "text": "'To business, Harry,' said Riddle, still smiling broadly. 'Twice in your past, in my future - we have met. And twice I failed to kill you. How did you survive? Tell me everything. The longer you talk,' he added softly, 'the longer you stay alive.'", "begin": 29775.093, "end": 29795.533, "localBegin": 1073.68, "localEnd": 1094.12}, {"id": "c017_f000097", "text": "Harry was thinking fast, weighing his chances. Riddle had the wand. He, Harry, had Fawkes and the Sorting Hat, neither of which would be much good in a duel. It looked bad, all right. But the longer Riddle stood there, the more life was dwindling out of Ginny ... and in the meantime, Harry noticed suddenly, Riddle's outline was becoming clearer, more solid. If it had to be a fight between him and Riddle, better sooner than later.", "begin": 29795.533, "end": 29822.733, "localBegin": 1094.12, "localEnd": 1121.32}, {"id": "c017_f000098", "text": "'No one knows why you lost your powers when you attacked me,' said Harry abruptly. 'I don't know myself. But I know why you couldn't kill me. Because my mother died to save me. My common Muggle-born mother,' he added, shaking with suppressed rage. 'She stopped you killing me. And I've seen the real you, I saw you last year. You're a wreck. You're barely alive. That's where all your power got you. You're in hiding. You're ugly, you're foul!'", "begin": 29822.733, "end": 29851.453, "localBegin": 1121.32, "localEnd": 1150.04}, {"id": "c017_f000099", "text": "Riddle's face contorted. Then he forced it into an awful smile.", "begin": 29851.453, "end": 29856.293, "localBegin": 1150.04, "localEnd": 1154.88}, {"id": "c017_f000100", "text": "'So. Your mother died to save you. Yes, that's a powerful counter-charm. I can see now - there is nothing special about you, after all. I wondered, you see. Because there are strange likenesses between us, Harry Potter. Even you must have noticed. Both half-bloods, orphans, raised by Muggles. Probably the only two Parselmouths to come to Hogwarts since the great Slytherin himself. We even look something alike ... But after all, it was merely a lucky chance that saved you from me. That's all I wanted to know.'", "begin": 29856.293, "end": 29891.933, "localBegin": 1154.88, "localEnd": 1190.52}, {"id": "c017_f000101", "text": "Harry stood, tense, waiting for Riddle to raise his wand. But Riddle's twisted smile was widening again.", "begin": 29891.933, "end": 29899.293, "localBegin": 1190.52, "localEnd": 1197.88}, {"id": "c017_f000102", "text": "'Now, Harry, I'm going to teach you a little lesson. Let's match the powers of Lord Voldemort, heir of Salazar Slytherin, against famous Harry Potter, and the best weapons Dumbledore can give him.'", "begin": 29899.293, "end": 29915.213, "localBegin": 1197.88, "localEnd": 1213.8}, {"id": "c017_f000103", "text": "He cast an amused eye over Fawkes and the Sorting Hat, then walked away. Harry, fear spreading up his numb legs, watched Riddle stop between the high pillars and look up into the stone face of Slytherin, high above him in the half-darkness. Riddle opened his mouth wide and hissed - but Harry understood what he was saying.", "begin": 29915.213, "end": 29935.533, "localBegin": 1213.8, "localEnd": 1234.12}, {"id": "c017_f000104", "text": "'Speak to me, Slytherin, greatest of the Hogwarts Four.'", "begin": 29935.533, "end": 29941.173, "localBegin": 1234.12, "localEnd": 1239.76}, {"id": "c017_f000105", "text": "Harry wheeled around to look up at the statue, Fawkes swaying on his shoulder.", "begin": 29941.173, "end": 29946.933, "localBegin": 1239.76, "localEnd": 1245.52}, {"id": "c017_f000106", "text": "Slytherin's gigantic stone face was moving. Horror-struck, Harry saw his mouth opening, wider and wider, to make a huge black hole.", "begin": 29946.933, "end": 29957.253, "localBegin": 1245.52, "localEnd": 1255.84}, {"id": "c017_f000107", "text": "And something was stirring inside the statue's mouth. Something was slithering up from its depths.", "begin": 29957.253, "end": 29965.493, "localBegin": 1255.84, "localEnd": 1264.08}, {"id": "c017_f000108", "text": "Harry backed away until he hit the dark Chamber wall, and as he shut his eyes tight he felt Fawkes's wing sweep his cheek as he took flight. Harry wanted to shout, 'Don't leave me!' but what chance did a phoenix have against the king of serpents?", "begin": 29965.493, "end": 29981.453, "localBegin": 1264.08, "localEnd": 1280.04}, {"id": "c017_f000109", "text": "Something huge hit the stone floor of the chamber, Harry felt it shudder. He knew what was happening, he could sense it, could almost see the giant serpent uncoiling itself from Slytherin's mouth. Then he heard Riddle's hissing voice: 'Kill him.'", "begin": 29981.453, "end": 29997.293, "localBegin": 1280.04, "localEnd": 1295.88}, {"id": "c017_f000110", "text": "The Basilisk was moving towards Harry, he could hear its heavy body slithering ponderously across the dusty floor. Eyes still tightly shut, Harry began to run blindly sideways, his hands outstretched, feeling his way. Riddle was laughing ...", "begin": 29997.293, "end": 30013.533, "localBegin": 1295.88, "localEnd": 1312.12}, {"id": "c017_f000111", "text": "Harry tripped. He fell hard onto the stone and tasted blood. The serpent was barely feet from him, he could hear it coming.", "begin": 30013.533, "end": 30020.773, "localBegin": 1312.12, "localEnd": 1319.36}, {"id": "c017_f000112", "text": "There was a loud, explosive spitting sound right above him and then something heavy hit Harry so hard that he was smashed against the wall. Waiting for fangs to sink through his body he heard more mad hissing, something thrashing wildly off the pillars.", "begin": 30020.773, "end": 30035.813, "localBegin": 1319.36, "localEnd": 1334.4}, {"id": "c017_f000113", "text": "He couldn't help it. He opened his eyes wide enough to squint at what was going on.", "begin": 30035.813, "end": 30041.773, "localBegin": 1334.4, "localEnd": 1340.36}, {"id": "c017_f000114", "text": "The enormous serpent, bright, poisonous green, thick as an oak trunk, had raised itself high in the air and its great blunt head was weaving drunkenly between the pillars. As Harry trembled, ready to close his eyes if it turned, he saw what had distracted the snake.", "begin": 30041.773, "end": 30059.693, "localBegin": 1340.36, "localEnd": 1358.28}, {"id": "c017_f000115", "text": "Fawkes was soaring around its head, and the Basilisk was", "begin": 30059.693, "end": 30063.613, "localBegin": 1358.28, "localEnd": 1362.2}, {"id": "c017_f000116", "text": "snapping furiously at him with fangs long and thin as sabres.", "begin": 30063.613, "end": 30068.293, "localBegin": 1362.2, "localEnd": 1366.88}, {"id": "c017_f000117", "text": "Fawkes dived. His long golden beak sank out of sight and a sudden shower of dark blood spattered the floor. The snake's tail thrashed, narrowly missing Harry, and before Harry could shut his eyes, it turned. Harry looked straight into its face, and saw that its eyes, both its great bulbous yellow eyes, had been punctured by the phoenix; blood was streaming to the floor and the snake was spitting in agony.", "begin": 30068.293, "end": 30096.933, "localBegin": 1366.88, "localEnd": 1395.52}, {"id": "c017_f000118", "text": "'No!' Harry heard Riddle screaming. 'Leave the bird! Leave the bird! The boy is behind you! You can still smell him! Kill him!'", "begin": 30096.933, "end": 30109.173, "localBegin": 1395.52, "localEnd": 1407.76}, {"id": "c017_f000119", "text": "The blinded serpent swayed, confused, still deadly. Fawkes was circling its head, piping his eerie song, jabbing here and there at the Basilisk's scaly nose as the blood poured from its ruined eyes.", "begin": 30109.173, "end": 30122.173, "localBegin": 1407.76, "localEnd": 1420.76}, {"id": "c017_f000120", "text": "'Help me, help me,' Harry muttered wildly, 'someone, anyone!'", "begin": 30122.173, "end": 30129.053, "localBegin": 1420.76, "localEnd": 1427.64}, {"id": "c017_f000121", "text": "The snake's tail whipped across the floor again. Harry ducked. Something soft hit his face.", "begin": 30129.053, "end": 30134.373, "localBegin": 1427.64, "localEnd": 1432.96}, {"id": "c017_f000122", "text": "The Basilisk had swept the Sorting Hat into Harry's arms. Harry seized it. It was all he had left, his only chance. He rammed it onto his head and threw himself flat onto the floor as the Basilisk's tail swung over him again.", "begin": 30134.373, "end": 30147.613, "localBegin": 1432.96, "localEnd": 1446.2}, {"id": "c017_f000123", "text": "'Help me ... help me ...' Harry thought, his eyes screwed tight under the Hat. 'Please help me!'", "begin": 30147.613, "end": 30155.053, "localBegin": 1446.2, "localEnd": 1453.64}, {"id": "c017_f000124", "text": "There was no answering voice. Instead, the Hat contracted, as though an invisible hand was squeezing it very tightly.", "begin": 30155.053, "end": 30163.413, "localBegin": 1453.64, "localEnd": 1462.0}, {"id": "c017_f000125", "text": "Something very hard and heavy thudded onto the top of Harry's head, almost knocking him out. Stars winking in front of his eyes, he grabbed the top of the Hat to pull it off and felt something long and hard beneath it.", "begin": 30163.413, "end": 30177.453, "localBegin": 1462.0, "localEnd": 1476.04}, {"id": "c017_f000126", "text": "A gleaming silver sword had appeared inside the Hat, its handle glittering with rubies the size of eggs.", "begin": 30177.453, "end": 30184.853, "localBegin": 1476.04, "localEnd": 1483.44}, {"id": "c017_f000127", "text": "'Kill the boy! Leave the bird! The boy is behind you! Sniff - smell him!'", "begin": 30184.853, "end": 30191.213, "localBegin": 1483.44, "localEnd": 1489.8}, {"id": "c017_f000128", "text": "Harry was on his feet, ready. The Basilisk's head was falling, its body coiling around, hitting pillars as it twisted to face him. He could see the vast, bloody eye sockets, see the mouth stretching wide, wide enough to swallow him whole, lined with fangs long as his sword, thin, glittering, venomous ...", "begin": 30191.213, "end": 30211.413, "localBegin": 1489.8, "localEnd": 1510.0}, {"id": "c017_f000129", "text": "It lunged blindly. Harry dodged and it hit the Chamber wall. It lunged again, and its forked tongue lashed Harry's side. He raised the sword in both his hands.", "begin": 30211.413, "end": 30221.773, "localBegin": 1510.0, "localEnd": 1520.36}, {"id": "c017_f000130", "text": "The Basilisk lunged again, and this time its aim was true. Harry threw his whole weight behind the sword and drove it to the hilt into the roof of the serpent's mouth.", "begin": 30221.773, "end": 30232.493, "localBegin": 1520.36, "localEnd": 1531.08}, {"id": "c017_f000131", "text": "But as warm blood drenched Harry's arms, he felt a searing pain just above his elbow. One long, poisonous fang was sinking deeper and deeper into his arm and it splintered as the Basilisk keeled over sideways and fell, twitching, to the floor.", "begin": 30232.493, "end": 30250.373, "localBegin": 1531.08, "localEnd": 1548.96}, {"id": "c017_f000132", "text": "Harry slid down the wall. He gripped the fang that was spreading poison through his body and wrenched it out of his arm. But he knew it was too late. White-hot pain was spreading slowly and steadily from the wound. Even as he dropped the fang and watched his own blood soaking his robes, his vision went foggy. The Chamber was dissolving in a whirl of dull colour.", "begin": 30250.373, "end": 30277.013, "localBegin": 1548.96, "localEnd": 1575.6}, {"id": "c017_f000133", "text": "A patch of scarlet swam past and Harry heard a soft clatter of claws beside him.", "begin": 30277.013, "end": 30283.173, "localBegin": 1575.6, "localEnd": 1581.76}, {"id": "c017_f000134", "text": "'Fawkes,' said Harry thickly. 'You were brilliant, Fawkes ...' He felt the bird lay its beautiful head on the spot where the serpent's fang had pierced him.", "begin": 30283.173, "end": 30296.013, "localBegin": 1581.76, "localEnd": 1594.6}, {"id": "c017_f000135", "text": "He could hear echoing footsteps and then a dark shadow moved in front of him.", "begin": 30296.013, "end": 30301.493, "localBegin": 1594.6, "localEnd": 1600.08}, {"id": "c017_f000136", "text": "'You're dead, Harry Potter,' said Riddle's voice above him. 'Dead. Even Dumbledore's bird knows it. Do you see what he's doing, Potter? He's crying.'", "begin": 30301.493, "end": 30316.893, "localBegin": 1600.08, "localEnd": 1615.48}, {"id": "c017_f000137", "text": "Harry blinked. Fawkes's head slid in and out of focus. Thick, pearly tears were trickling down the glossy feathers.", "begin": 30316.893, "end": 30326.133, "localBegin": 1615.48, "localEnd": 1624.72}, {"id": "c017_f000138", "text": "'I'm going to sit here and watch you die, Harry Potter. Take your time. I'm in no hurry.'", "begin": 30326.133, "end": 30335.853, "localBegin": 1624.72, "localEnd": 1634.44}, {"id": "c017_f000139", "text": "Harry felt drowsy. Everything around him seemed to be spinning.", "begin": 30335.853, "end": 30341.373, "localBegin": 1634.44, "localEnd": 1639.96}, {"id": "c017_f000140", "text": "'So ends the famous Harry Potter,' said Riddle's distant voice. 'Alone in the Chamber of Secrets, forsaken by his friends, defeated at last by the Dark Lord he so unwisely challenged. You'll be back with your dear Mudblood mother soon, Harry ... She bought you twelve years of borrowed time ... but Lord Voldemort got you in the end, as you knew he must.'", "begin": 30341.373, "end": 30372.933, "localBegin": 1639.96, "localEnd": 1671.52}, {"id": "c017_f000141", "text": "If this is dying, thought Harry, it's not so bad. Even the pain was leaving him ...", "begin": 30372.933, "end": 30380.973, "localBegin": 1671.52, "localEnd": 1679.56}, {"id": "c017_f000142", "text": "But was this dying? Instead of going black, the Chamber seemed to be coming back into focus. Harry gave his head a little shake and there was Fawkes, still resting his head on Harry's arm.", "begin": 30380.973, "end": 30393.773, "localBegin": 1679.56, "localEnd": 1692.36}, {"id": "c017_f000143", "text": "A pearly patch of tears was shining all around the wound - except that there was no wound.", "begin": 30393.773, "end": 30400.693, "localBegin": 1692.36, "localEnd": 1699.28}, {"id": "c017_f000144", "text": "'Get away, bird,' said Riddle's voice suddenly. 'Get away from him. I said, get away!'", "begin": 30400.693, "end": 30407.733, "localBegin": 1699.28, "localEnd": 1706.32}, {"id": "c017_f000145", "text": "Harry raised his head. Riddle was pointing Harry's wand at Fawkes; there was a bang like a gun and Fawkes took flight again in a whirl of gold and scarlet.", "begin": 30407.733, "end": 30417.613, "localBegin": 1706.32, "localEnd": 1716.2}, {"id": "c017_f000146", "text": "'Phoenix tears ...' said Riddle quietly, staring at Harry's arm. 'Of course ... healing powers ... I forgot ...'", "begin": 30417.613, "end": 30428.973, "localBegin": 1716.2, "localEnd": 1727.56}, {"id": "c017_f000147", "text": "He looked into Harry's face. 'But it makes no difference. In fact, I prefer it this way. Just you and me, Harry Potter ... you and me ...'", "begin": 30428.973, "end": 30438.413, "localBegin": 1727.56, "localEnd": 1737.0}, {"id": "c017_f000148", "text": "He raised the wand.", "begin": 30438.413, "end": 30440.293, "localBegin": 1737.0, "localEnd": 1738.88}, {"id": "c017_f000149", "text": "Then, in a rush of wings, Fawkes soared back overhead and something fell into Harry's lap - the diary.", "begin": 30440.293, "end": 30446.493, "localBegin": 1738.88, "localEnd": 1745.08}, {"id": "c017_f000150", "text": "For a split second, both Harry and Riddle, wand still raised, stared at it. Then, without thinking, without considering, as though he had meant to do it all along, Harry seized the Basilisk fang on the floor next to him and plunged it straight into the heart of the book.", "begin": 30446.493, "end": 30463.333, "localBegin": 1745.08, "localEnd": 1761.92}, {"id": "c017_f000151", "text": "There was a long, dreadful, piercing scream. Ink spurted out of the diary in torrents, streaming over Harry's hands, flooding the floor. Riddle was writhing and twisting, screaming and flailing and then ...", "begin": 30463.333, "end": 30479.613, "localBegin": 1761.92, "localEnd": 1778.2}, {"id": "c017_f000152", "text": "He had gone. Harry's wand fell to the floor with a clatter and there was silence. Silence except for the steady drip drip of ink still oozing from the diary. The Basilisk venom had burned a sizzling hole right through it.", "begin": 30479.613, "end": 30498.773, "localBegin": 1778.2, "localEnd": 1797.36}, {"id": "c017_f000153", "text": "Shaking all over, Harry pulled himself up. His head was spinning as though he'd just travelled miles by Floo powder. Slowly, he gathered together his wand and the Sorting Hat, and, with a huge tug, retrieved the glittering sword from the roof of the Basilisk's mouth.", "begin": 30498.773, "end": 30517.213, "localBegin": 1797.36, "localEnd": 1815.8}, {"id": "c017_f000154", "text": "Then came a faint moan from the end of the Chamber. Ginny was stirring. As Harry hurried towards her, she sat up. Her bemused eyes travelled from the huge form of the dead Basilisk, over Harry, in his blood-soaked robes, then to the diary in his hand. She drew a great, shuddering gasp and tears began to pour down her face.", "begin": 30517.213, "end": 30540.773, "localBegin": 1815.8, "localEnd": 1839.36}, {"id": "c017_f000155", "text": "'Harry - oh, Harry - I tried to tell you at b-breakfast, but I c-couldn't say it in front of Percy. It was me, Harry - but I - I", "begin": 30540.773, "end": 30553.293, "localBegin": 1839.36, "localEnd": 1851.88}, {"id": "c017_f000156", "text": "s-swear I d-didn't mean to - R-Riddle made me, he t-took me over - and - how did you kill that - that thing? W-where's Riddle? The last thing I r-remember is him coming out of the diary -'", "begin": 30553.293, "end": 30570.733, "localBegin": 1851.88, "localEnd": 1869.32}, {"id": "c017_f000157", "text": "'It's all right,' said Harry, holding up the diary, and showing Ginny the fang hole, 'Riddle's finished. Look! Him and the Basilisk. C'mon, Ginny, let's get out of here -'", "begin": 30570.733, "end": 30583.893, "localBegin": 1869.32, "localEnd": 1882.48}, {"id": "c017_f000158", "text": "'I'm going to be expelled!' Ginny wept, as Harry helped her awkwardly to her feet. 'I've looked forward to coming to Hogwarts ever since B-Bill came and n-now I'll have to leave and - w-what'll Mum and Dad say?'", "begin": 30583.893, "end": 30600.093, "localBegin": 1882.48, "localEnd": 1898.68}, {"id": "c017_f000159", "text": "Fawkes was waiting for them, hovering in the Chamber entrance. Harry urged Ginny forward; they stepped over the motionless coils of the dead Basilisk, through the echoing gloom and back into the tunnel. Harry heard the stone doors close behind them with a soft hiss.", "begin": 30600.093, "end": 30617.893, "localBegin": 1898.68, "localEnd": 1916.48}, {"id": "c017_f000160", "text": "After a few minutes' progress up the dark tunnel, a distant sound of slowly shifting rock reached Harry's ears.", "begin": 30617.893, "end": 30625.213, "localBegin": 1916.48, "localEnd": 1923.8}, {"id": "c017_f000161", "text": "'Ron!' Harry yelled, speeding up. 'Ginny's OK! I've got her!'", "begin": 30625.213, "end": 30629.933, "localBegin": 1923.8, "localEnd": 1928.52}, {"id": "c017_f000162", "text": "He heard Ron give a strangled cheer and they turned the next bend to see his eager face staring through the sizeable gap he had managed to make in the rock fall.", "begin": 30629.933, "end": 30638.893, "localBegin": 1928.52, "localEnd": 1937.48}, {"id": "c017_f000163", "text": "'Ginny!' Ron thrust an arm through the gap in the rock to pull her through first. 'You're alive! I don't believe it! What happened?'", "begin": 30638.893, "end": 30645.973, "localBegin": 1937.48, "localEnd": 1944.56}, {"id": "c017_f000164", "text": "He tried to hug her but Ginny held him off, sobbing.", "begin": 30645.973, "end": 30647.773, "localBegin": 1944.56, "localEnd": 1946.36}, {"id": "c017_f000165", "text": "'But you're okay, Ginny,' said Ron, beaming at her. 'It's over now, it's - where did that bird come from?'", "begin": 30647.773, "end": 30651.253, "localBegin": 1946.36, "localEnd": 1949.84}, {"id": "c017_f000166", "text": "Fawkes had swooped through the gap after Ginny.", "begin": 30651.253, "end": 30654.453, "localBegin": 1949.84, "localEnd": 1953.04}, {"id": "c017_f000167", "text": "'He's Dumbledore's,' said Harry, squeezing through himself.", "begin": 30654.453, "end": 30658.213, "localBegin": 1953.04, "localEnd": 1956.8}, {"id": "c017_f000168", "text": "'And how come you've got a sword?' said Ron, gaping at the glittering weapon in Harry's hand.", "begin": 30658.213, "end": 30664.373, "localBegin": 1956.8, "localEnd": 1962.96}, {"id": "c017_f000169", "text": "'I'll explain when we get out of here,' said Harry, with a sideways glance at Ginny.", "begin": 30664.373, "end": 30669.853, "localBegin": 1962.96, "localEnd": 1968.44}, {"id": "c017_f000170", "text": "'But -'", "begin": 30669.853, "end": 30671.413, "localBegin": 1968.44, "localEnd": 1970.0}, {"id": "c017_f000171", "text": "'Later,' Harry said quickly. He didn't think it was a good idea to tell Ron yet who'd been opening the Chamber, not in front of Ginny, anyway. 'Where's Lockhart?'", "begin": 30671.413, "end": 30682.573, "localBegin": 1970.0, "localEnd": 1981.16}, {"id": "c017_f000172", "text": "'Back there,' said Ron, grinning and jerking his head up the tunnel towards the pipe. 'He's in a bad way. Come and see.'", "begin": 30682.573, "end": 30690.493, "localBegin": 1981.16, "localEnd": 1989.08}, {"id": "c017_f000173", "text": "Led by Fawkes, whose wide scarlet wings emitted a soft golden glow in the darkness, they walked all the way back to the mouth", "begin": 30690.493, "end": 30699.493, "localBegin": 1989.08, "localEnd": 1998.08}, {"id": "c017_f000174", "text": "of the pipe. Gilderoy Lockhart was sitting there, humming placidly to himself.", "begin": 30699.493, "end": 30704.533, "localBegin": 1998.08, "localEnd": 2003.12}, {"id": "c017_f000175", "text": "'His memory's gone,' said Ron. 'The Memory Charm backfired. Hit him instead of us. Hasn't got a clue who he is, or where he is, or who we are. I told him to come and wait here. He's a danger to himself.'", "begin": 30704.533, "end": 30718.693, "localBegin": 2003.12, "localEnd": 2017.28}, {"id": "c017_f000176", "text": "Lockhart peered good-naturedly up at them all.", "begin": 30718.693, "end": 30721.893, "localBegin": 2017.28, "localEnd": 2020.48}, {"id": "c017_f000177", "text": "'Hello,' he said. 'Odd sort of place, this, isn't it? Do you live here?'", "begin": 30721.893, "end": 30726.733, "localBegin": 2020.48, "localEnd": 2025.32}, {"id": "c017_f000178", "text": "'No,' said Ron, raising his eyebrows at Harry.", "begin": 30726.733, "end": 30730.413, "localBegin": 2025.32, "localEnd": 2029.0}, {"id": "c017_f000179", "text": "Harry bent down and looked up the long, dark pipe.", "begin": 30730.413, "end": 30733.373, "localBegin": 2029.0, "localEnd": 2031.96}, {"id": "c017_f000180", "text": "'Have you thought how we're going to get back up this?' he said to Ron.", "begin": 30733.373, "end": 30737.973, "localBegin": 2031.96, "localEnd": 2036.56}, {"id": "c017_f000181", "text": "Ron shook his head, but Fawkes the phoenix had swooped past Harry and was now fluttering in front of him, his beady eyes bright in the dark. He was waving his long golden tail feathers. Harry looked uncertainly at him.", "begin": 30737.973, "end": 30752.253, "localBegin": 2036.56, "localEnd": 2050.84}, {"id": "c017_f000182", "text": "'He looks like he wants you to grab hold ...' said Ron, looking perplexed. 'But you're much too heavy for a bird to pull up there.'", "begin": 30752.253, "end": 30760.773, "localBegin": 2050.84, "localEnd": 2059.36}, {"id": "c017_f000183", "text": "'Fawkes,' said Harry, 'isn't an ordinary bird.' He turned quickly to the others. 'We've got to hold on to each other. Ginny, grab Ron's hand. Professor Lockhart -'", "begin": 30760.773, "end": 30772.133, "localBegin": 2059.36, "localEnd": 2070.72}, {"id": "c017_f000184", "text": "'He means you,' said Ron sharply to Lockhart.", "begin": 30772.133, "end": 30775.493, "localBegin": 2070.72, "localEnd": 2074.08}, {"id": "c017_f000185", "text": "'You hold Ginny's other hand.'", "begin": 30775.493, "end": 30777.493, "localBegin": 2074.08, "localEnd": 2076.08}, {"id": "c017_f000186", "text": "Harry tucked the sword and the Sorting Hat into his belt, Ron took hold of the back of Harry's robes, and Harry reached out and took hold of Fawkes's strangely hot tail feathers.", "begin": 30777.493, "end": 30787.933, "localBegin": 2076.08, "localEnd": 2086.52}, {"id": "c017_f000187", "text": "An extraordinary lightness seemed to spread through his whole body, and next second, with a whoosh, they were flying upwards through the pipe. Harry could hear Lockhart dangling below him, saying, 'Amazing! Amazing! This is just like magic!' The chill air was whipping through Harry's hair, and before he'd stopped enjoying the ride, it was over - all four of them were hitting the wet floor of Moaning Myrtle's bathroom, and as Lockhart straightened his hat, the sink that hid the pipe was sliding back into place.", "begin": 30787.933, "end": 30821.213, "localBegin": 2086.52, "localEnd": 2119.8}, {"id": "c017_f000188", "text": "Myrtle goggled at them.", "begin": 30821.213, "end": 30825.333, "localBegin": 2119.8, "localEnd": 2123.92}, {"id": "c017_f000189", "text": "'You're alive,' she said blankly to Harry.", "begin": 30825.333, "end": 30828.813, "localBegin": 2123.92, "localEnd": 2127.4}, {"id": "c017_f000190", "text": "'There's no need to sound so disappointed,' he said grimly, wiping flecks of blood and slime off his glasses.", "begin": 30828.813, "end": 30835.853, "localBegin": 2127.4, "localEnd": 2134.44}, {"id": "c017_f000191", "text": "'Oh, well ... I'd just been thinking. If you had died, you'd have", "begin": 30835.853, "end": 30840.733, "localBegin": 2134.44, "localEnd": 2139.32}, {"id": "c017_f000192", "text": "been welcome to share my toilet,' said Myrtle, blushing silver.", "begin": 30840.733, "end": 30846.213, "localBegin": 2139.32, "localEnd": 2144.8}, {"id": "c017_f000193", "text": "'Urgh!' said Ron, as they left the bathroom for the dark, deserted corridor outside. 'Harry! I think Myrtle's got fond of you! You've got competition, Ginny!'", "begin": 30846.213, "end": 30857.453, "localBegin": 2144.8, "localEnd": 2156.04}, {"id": "c017_f000194", "text": "But tears were still flooding silently down Ginny's face.", "begin": 30857.453, "end": 30861.773, "localBegin": 2156.04, "localEnd": 2160.36}, {"id": "c017_f000195", "text": "'Where now?' said Ron, with an anxious look at Ginny. Harry pointed.", "begin": 30861.773, "end": 30867.173, "localBegin": 2160.36, "localEnd": 2165.76}, {"id": "c017_f000196", "text": "Fawkes was leading the way, glowing gold along the corridor. They strode after him, and moments later, found themselves outside Professor McGonagall's office.", "begin": 30867.173, "end": 30878.413, "localBegin": 2165.76, "localEnd": 2177.0}, {"id": "c017_f000197", "text": "Harry knocked and pushed the door open.", "begin": 30878.413, "end": 30883.413, "localBegin": 2177.0, "localEnd": 2182.0}]}, {"kind": "chapter", "number": 18, "title": "Dobby's Reward", "audio": "audio/chapter_018.mp3", "start": 30883.413, "end": 32466.413, "duration": 1583.0, "paragraphs": [{"id": "c018_f000001", "text": "Chapter Eighteen. Dobby's Reward.", "begin": 30883.413, "end": 30888.453, "localBegin": 0.0, "localEnd": 5.04}, {"id": "c018_f000002", "text": "For a moment, there was silence as Harry, Ron, Ginny and Lockhart stood in the doorway, covered in muck and slime and (in Harry's case) blood. Then there was a scream.", "begin": 30888.453, "end": 30900.893, "localBegin": 5.04, "localEnd": 17.48}, {"id": "c018_f000003", "text": "'Ginny!'", "begin": 30900.893, "end": 30902.053, "localBegin": 17.48, "localEnd": 18.64}, {"id": "c018_f000004", "text": "It was Mrs Weasley, who had been sitting crying in front of the fire. She leapt to her feet, closely followed by Mr Weasley, and both of them flung themselves on their daughter.", "begin": 30902.053, "end": 30911.693, "localBegin": 18.64, "localEnd": 28.28}, {"id": "c018_f000005", "text": "Harry, however, was looking past them. Professor Dumbledore was standing by the mantelpiece, beaming, next to Professor McGonagall, who was taking great, steadying gasps, clutching her chest. Fawkes went whooshing past Harry's ear and settled on Dumbledore's shoulder, just as Harry found himself and Ron being swept into Mrs Weasley's tight embrace.", "begin": 30911.693, "end": 30934.773, "localBegin": 28.28, "localEnd": 51.36}, {"id": "c018_f000006", "text": "'You saved her! You saved her! How did you do it?'", "begin": 30934.773, "end": 30939.053, "localBegin": 51.36, "localEnd": 55.64}, {"id": "c018_f000007", "text": "'I think we'd all like to know that,' said Professor McGonagall weakly.", "begin": 30939.053, "end": 30944.533, "localBegin": 55.64, "localEnd": 61.12}, {"id": "c018_f000008", "text": "Mrs Weasley let go of Harry, who hesitated for a moment, then walked over to the desk and laid upon it the Sorting Hat, the ruby-encrusted sword and what remained of Riddle's diary.", "begin": 30944.533, "end": 30955.693, "localBegin": 61.12, "localEnd": 72.28}, {"id": "c018_f000009", "text": "Then he started telling them everything. For nearly a quarter of an hour he spoke into the rapt silence: he told them about hearing the disembodied voice, how Hermione had finally realised that he was hearing a Basilisk in the pipes; how he and Ron had followed the spiders into the Forest, that Aragog had told them where the last victim of the Basilisk had died; how he had guessed that Moaning Myrtle had been the victim, and that the entrance to the Chamber of Secrets might be in her bathroom ...", "begin": 30955.693, "end": 30984.693, "localBegin": 72.28, "localEnd": 101.28}, {"id": "c018_f000010", "text": "'Very well,' Professor McGonagall prompted him, as he paused, 'so you found out where the entrance was - breaking a hundred school rules into pieces along the way, I might add - but how on", "begin": 30984.693, "end": 30995.173, "localBegin": 101.28, "localEnd": 111.76}, {"id": "c018_f000011", "text": "earth did you all get out of there alive, Potter?'", "begin": 30995.173, "end": 30998.773, "localBegin": 111.76, "localEnd": 115.36}, {"id": "c018_f000012", "text": "So Harry, his voice now growing hoarse from all this talking, told them about Fawkes's timely arrival and about the Sorting Hat giving him the sword. But then he faltered. He had so far avoided mentioning Riddle's diary - or Ginny. She was standing with her head against Mrs Weasley's shoulder, and tears were still coursing silently down her cheeks. What if they expelled her? Harry thought in panic. Riddle's diary didn't work any more ... How could they prove it had been he who'd made her do it all?", "begin": 30998.773, "end": 31030.733, "localBegin": 115.36, "localEnd": 147.32}, {"id": "c018_f000013", "text": "Instinctively, Harry looked at Dumbledore, who smiled faintly, the firelight glancing off his half-moon spectacles.", "begin": 31030.733, "end": 31038.533, "localBegin": 147.32, "localEnd": 155.12}, {"id": "c018_f000014", "text": "'What interests me most,' said Dumbledore gently, 'is how Lord Voldemort managed to enchant Ginny, when my sources tell me he is currently in hiding in the forests of Albania.'", "begin": 31038.533, "end": 31053.213, "localBegin": 155.12, "localEnd": 169.8}, {"id": "c018_f000015", "text": "Relief - warm, sweeping, glorious relief - swept over Harry.", "begin": 31053.213, "end": 31058.453, "localBegin": 169.8, "localEnd": 175.04}, {"id": "c018_f000016", "text": "'W-what's that?' said Mr Weasley in a stunned voice. 'You Know Who? En-enchant Ginny? But Ginny's not ... Ginny hasn't been ... has she?'", "begin": 31058.453, "end": 31071.173, "localBegin": 175.04, "localEnd": 187.76}, {"id": "c018_f000017", "text": "'It was this diary,' said Harry quickly, picking it up and showing it to Dumbledore. 'Riddle wrote it when he was sixteen.'", "begin": 31071.173, "end": 31078.893, "localBegin": 187.76, "localEnd": 195.48}, {"id": "c018_f000018", "text": "Dumbledore took the diary from Harry and peered keenly down his long, crooked nose at its burnt and soggy pages.", "begin": 31078.893, "end": 31086.133, "localBegin": 195.48, "localEnd": 202.72}, {"id": "c018_f000019", "text": "'Brilliant,' he said softly. 'Of course, he was probably the most brilliant student Hogwarts has ever seen.' He turned around to the Weasleys, who were looking utterly bewildered.", "begin": 31086.133, "end": 31099.213, "localBegin": 202.72, "localEnd": 215.8}, {"id": "c018_f000020", "text": "'Very few people know that Lord Voldemort was once called Tom Riddle. I taught him myself, fifty years ago, at Hogwarts. He disappeared after leaving the school ... travelled far and wide ... sank so deeply into the Dark Arts, consorted with the very worst of our kind, underwent so many dangerous, magical transformations, that when he resurfaced as Lord Voldemort, he was barely recognisable. Hardly anyone connected Lord Voldemort with the clever, handsome boy who was once Head Boy here.'", "begin": 31099.213, "end": 31136.773, "localBegin": 215.8, "localEnd": 253.36}, {"id": "c018_f000021", "text": "'But Ginny,' said Mrs Weasley, 'what's our Ginny got to do with - with - him?'", "begin": 31136.773, "end": 31142.293, "localBegin": 253.36, "localEnd": 258.88}, {"id": "c018_f000022", "text": "'His d-diary!' Ginny sobbed. 'I've b-been writing in it, and he's been w-writing back all year -'", "begin": 31142.293, "end": 31150.213, "localBegin": 258.88, "localEnd": 266.8}, {"id": "c018_f000023", "text": "'Ginny!' said Mr Weasley flabbergasted. 'Haven't I taught you anything? What have I always told you? Never trust anything that can think for itself if you can't see where it keeps its brain. Why", "begin": 31150.213, "end": 31163.373, "localBegin": 266.8, "localEnd": 279.96}, {"id": "c018_f000024", "text": "didn't you show the diary to me, or your mother? A suspicious object like that, it was clearly full of Dark Magic!'", "begin": 31163.373, "end": 31171.733, "localBegin": 279.96, "localEnd": 288.32}, {"id": "c018_f000025", "text": "'I d-didn't know,' sobbed Ginny. 'I found it inside one of the books Mum got me. I th-thought someone had just left it in there and forgotten about it ...'", "begin": 31171.733, "end": 31181.773, "localBegin": 288.32, "localEnd": 298.36}, {"id": "c018_f000026", "text": "'Miss Weasley should go up to the hospital wing straight away,' Dumbledore interrupted in a firm voice. 'This has been a terrible ordeal for her. There will be no punishment. Older and wiser wizards than she have been hoodwinked by Lord Voldemort.' He strode over to the door and opened it. 'Bed rest and perhaps a large, steaming mug of hot chocolate. I always find that cheers me up,' he added, twinkling kindly down at her. 'You will find that Madam Pomfrey is still awake. She's just giving out Mandrake juice - I dare say the Basilisk's victims will be waking up any moment.'", "begin": 31181.773, "end": 31220.213, "localBegin": 298.36, "localEnd": 336.8}, {"id": "c018_f000027", "text": "'So Hermione's OK!' said Ron brightly.", "begin": 31220.213, "end": 31223.213, "localBegin": 336.8, "localEnd": 339.8}, {"id": "c018_f000028", "text": "'There has been no lasting harm done,' said Dumbledore.", "begin": 31223.213, "end": 31229.093, "localBegin": 339.8, "localEnd": 345.68}, {"id": "c018_f000029", "text": "Mrs Weasley led Ginny out, and Mr Weasley followed, still looking deeply shaken.", "begin": 31229.093, "end": 31234.613, "localBegin": 345.68, "localEnd": 351.2}, {"id": "c018_f000030", "text": "'You know, Minerva,' Professor Dumbledore said thoughtfully to Professor McGonagall, 'I think all this merits a good feast. Might I ask you to go and alert the kitchens?'", "begin": 31234.613, "end": 31246.613, "localBegin": 351.2, "localEnd": 363.2}, {"id": "c018_f000031", "text": "'Right,' said Professor McGonagall crisply, also moving to the door. 'I'll leave you to deal with Potter and Weasley, shall I?'", "begin": 31246.613, "end": 31254.733, "localBegin": 363.2, "localEnd": 371.32}, {"id": "c018_f000032", "text": "'Certainly,' said Dumbledore.", "begin": 31254.733, "end": 31257.693, "localBegin": 371.32, "localEnd": 374.28}, {"id": "c018_f000033", "text": "She left, and Harry and Ron gazed uncertainly at Dumbledore. What exactly had Professor McGonagall meant, deal with them? Surely - surely - they weren't about to be punished?", "begin": 31257.693, "end": 31270.813, "localBegin": 374.28, "localEnd": 387.4}, {"id": "c018_f000034", "text": "'I seem to remember telling you both that I would have to expel you if you broke any more school rules,' said Dumbledore.", "begin": 31270.813, "end": 31279.493, "localBegin": 387.4, "localEnd": 396.08}, {"id": "c018_f000035", "text": "Ron opened his mouth in horror.", "begin": 31279.493, "end": 31281.653, "localBegin": 396.08, "localEnd": 398.24}, {"id": "c018_f000036", "text": "'Which goes to show that the best of us must sometimes eat our words,' Dumbledore went on, smiling. 'You will both receive Special Awards for Services to the School and - let me see - yes, I think two hundred points apiece for Gryffindor.'", "begin": 31281.653, "end": 31300.013, "localBegin": 398.24, "localEnd": 416.6}, {"id": "c018_f000037", "text": "Ron went as brightly pink as Lockhart's Valentine flowers and closed his mouth again.", "begin": 31300.013, "end": 31305.093, "localBegin": 416.6, "localEnd": 421.68}, {"id": "c018_f000038", "text": "'But one of us seems to be keeping mightily quiet about his part in this dangerous adventure,' Dumbledore added. 'Why so modest, Gilderoy?'", "begin": 31305.093, "end": 31316.093, "localBegin": 421.68, "localEnd": 432.68}, {"id": "c018_f000039", "text": "Harry gave a start. He had completely forgotten about", "begin": 31316.093, "end": 31319.173, "localBegin": 432.68, "localEnd": 435.76}, {"id": "c018_f000040", "text": "Lockhart. He turned and saw that Lockhart was standing in a corner of the room, still wearing his vague smile. When Dumbledore addressed him, Lockhart looked over his shoulder to see who he was talking to.", "begin": 31319.173, "end": 31329.773, "localBegin": 435.76, "localEnd": 446.36}, {"id": "c018_f000041", "text": "'Professor Dumbledore,' Ron said quickly, 'there was an accident down in the Chamber of Secrets. Professor Lockhart -'", "begin": 31329.773, "end": 31337.973, "localBegin": 446.36, "localEnd": 454.56}, {"id": "c018_f000042", "text": "'Am I a Professor?' said Lockhart in mild surprise. 'Goodness. I expect I was hopeless, was I?'", "begin": 31337.973, "end": 31345.973, "localBegin": 454.56, "localEnd": 462.56}, {"id": "c018_f000043", "text": "'He tried to do a Memory Charm and the wand backfired,' Ron explained quietly to Dumbledore.", "begin": 31345.973, "end": 31351.413, "localBegin": 462.56, "localEnd": 468.0}, {"id": "c018_f000044", "text": "'Dear me,' said Dumbledore, shaking his head, his long silver moustache quivering. 'Impaled upon your own sword, Gilderoy!'", "begin": 31351.413, "end": 31361.933, "localBegin": 468.0, "localEnd": 478.52}, {"id": "c018_f000045", "text": "'Sword?' said Lockhart dimly. 'Haven't got a sword. That boy has, though.' He pointed at Harry. 'He'll lend you one.'", "begin": 31361.933, "end": 31370.733, "localBegin": 478.52, "localEnd": 487.32}, {"id": "c018_f000046", "text": "'Would you mind taking Professor Lockhart up to the hospital wing, too?' Dumbledore said to Ron. 'I'd like a few more words with Harry ...'", "begin": 31370.733, "end": 31380.213, "localBegin": 487.32, "localEnd": 496.8}, {"id": "c018_f000047", "text": "Lockhart ambled out. Ron cast a curious look back at Dumbledore and Harry as he closed the door.", "begin": 31380.213, "end": 31386.973, "localBegin": 496.8, "localEnd": 503.56}, {"id": "c018_f000048", "text": "Dumbledore crossed to one of the chairs by the fire.", "begin": 31386.973, "end": 31390.373, "localBegin": 503.56, "localEnd": 506.96}, {"id": "c018_f000049", "text": "'Sit down, Harry,' he said, and Harry sat, feeling unaccountably nervous.", "begin": 31390.373, "end": 31397.613, "localBegin": 506.96, "localEnd": 514.2}, {"id": "c018_f000050", "text": "'First of all, Harry, I want to thank you,' said Dumbledore, eyes twinkling again. 'You must have shown me real loyalty down in the Chamber. Nothing but that could have called Fawkes to you.'", "begin": 31397.613, "end": 31411.933, "localBegin": 514.2, "localEnd": 528.52}, {"id": "c018_f000051", "text": "He stroked the phoenix, which had fluttered down onto his knee. Harry grinned awkwardly as Dumbledore watched him.", "begin": 31411.933, "end": 31419.133, "localBegin": 528.52, "localEnd": 535.72}, {"id": "c018_f000052", "text": "'And so you met Tom Riddle,' said Dumbledore thoughtfully. 'I imagine he was most interested in you ...'", "begin": 31419.133, "end": 31428.373, "localBegin": 535.72, "localEnd": 544.96}, {"id": "c018_f000053", "text": "Suddenly, something that was nagging at Harry came tumbling out of his mouth.", "begin": 31428.373, "end": 31432.453, "localBegin": 544.96, "localEnd": 549.04}, {"id": "c018_f000054", "text": "'Professor Dumbledore ... Riddle said I'm like him. Strange likenesses, he said ...'", "begin": 31432.453, "end": 31439.573, "localBegin": 549.04, "localEnd": 556.16}, {"id": "c018_f000055", "text": "'Did he, now?' said Dumbledore, looking thoughtfully under his thick silver eyebrows at Harry. And what do you think, Harry?'", "begin": 31439.573, "end": 31449.133, "localBegin": 556.16, "localEnd": 565.72}, {"id": "c018_f000056", "text": "'I don't think I'm like him!' said Harry, more loudly than he'd intended. 'I mean, I'm - I'm in Gryffindor, I'm ...'", "begin": 31449.133, "end": 31459.373, "localBegin": 565.72, "localEnd": 575.96}, {"id": "c018_f000057", "text": "But he fell silent, a lurking doubt resurfacing in his mind.", "begin": 31459.373, "end": 31463.173, "localBegin": 575.96, "localEnd": 579.76}, {"id": "c018_f000058", "text": "'Professor,' he started again after a moment, 'the Sorting Hat", "begin": 31463.173, "end": 31467.733, "localBegin": 579.76, "localEnd": 584.32}, {"id": "c018_f000059", "text": "told me I'd - I'd have done well in Slytherin. Everyone thought I was Slytherin's heir for a while ... because I can speak Parseltongue ...'", "begin": 31467.733, "end": 31476.693, "localBegin": 584.32, "localEnd": 593.28}, {"id": "c018_f000060", "text": "'You can speak Parseltongue, Harry,' said Dumbledore calmly, 'because Lord Voldemort - who is the last remaining descendant of Salazar Slytherin - can speak Parseltongue. Unless I'm much mistaken, he transferred some of his own powers to you the night he gave you that scar. Not something he intended to do, I'm sure ...'", "begin": 31476.693, "end": 31501.253, "localBegin": 593.28, "localEnd": 617.84}, {"id": "c018_f000061", "text": "'Voldemort put a bit of himself in me?' Harry said, thunderstruck.", "begin": 31501.253, "end": 31506.493, "localBegin": 617.84, "localEnd": 623.08}, {"id": "c018_f000062", "text": "'It certainly seems so.'", "begin": 31506.493, "end": 31508.933, "localBegin": 623.08, "localEnd": 625.52}, {"id": "c018_f000063", "text": "'So I should be in Slytherin,' Harry said, looking desperately into Dumbledore's face. 'The Sorting Hat could see Slytherin's power in me, and it -'", "begin": 31508.933, "end": 31517.373, "localBegin": 625.52, "localEnd": 633.96}, {"id": "c018_f000064", "text": "'Put you in Gryffindor,' said Dumbledore calmly. 'Listen to me, Harry. You happen to have many qualities Salazar Slytherin prized in his hand-picked students. His own very rare gift, Parseltongue ... resourcefulness ... determination ... a certain disregard for rules,' he added, his moustache quivering again. 'Yet the Sorting Hat placed you in Gryffindor. You know why that was. Think.'", "begin": 31517.373, "end": 31549.813, "localBegin": 633.96, "localEnd": 666.4}, {"id": "c018_f000065", "text": "'It only put me in Gryffindor,' said Harry in a defeated voice, 'because I asked not to go in Slytherin ...'", "begin": 31549.813, "end": 31559.693, "localBegin": 666.4, "localEnd": 676.28}, {"id": "c018_f000066", "text": "'Exactly,' said Dumbledore, beaming once more. 'Which makes you very different from Tom Riddle. It is our choices, Harry, that show what we truly are, far more than our abilities.' Harry sat motionless in his chair, stunned. 'If you want proof, Harry, that you belong in Gryffindor, I suggest you look more closely at this.'", "begin": 31559.693, "end": 31588.373, "localBegin": 676.28, "localEnd": 704.96}, {"id": "c018_f000067", "text": "Dumbledore reached across to Professor McGonagall's desk, picked up the blood-stained silver sword and handed it to Harry. Dully, Harry turned it over, the rubies blazing in the firelight. And then he saw the name engraved just below the hilt.", "begin": 31588.373, "end": 31604.893, "localBegin": 704.96, "localEnd": 721.48}, {"id": "c018_f000068", "text": "Godric Gryffindor.", "begin": 31604.893, "end": 31607.573, "localBegin": 721.48, "localEnd": 724.16}, {"id": "c018_f000069", "text": "'Only a true Gryffindor could have pulled that out of the Hat, Harry,' said Dumbledore simply.", "begin": 31607.573, "end": 31615.573, "localBegin": 724.16, "localEnd": 732.16}, {"id": "c018_f000070", "text": "For a minute, neither of them spoke. Then Dumbledore pulled open one of the drawers in Professor McGonagall's desk, and took out a quill and a bottle of ink.", "begin": 31615.573, "end": 31626.933, "localBegin": 732.16, "localEnd": 743.52}, {"id": "c018_f000071", "text": "'What you need, Harry, is some food and sleep. I suggest you go down to the feast, while I write to Azkaban - we need our gamekeeper back. And I must draft an advertisement for the Daily", "begin": 31626.933, "end": 31640.493, "localBegin": 743.52, "localEnd": 757.08}, {"id": "c018_f000072", "text": "Prophet, too,' he added thoughtfully. 'We'll be needing a new Defence Against the Dark Arts teacher. Dear me, we do seem to run through them, don't we?'", "begin": 31640.493, "end": 31651.853, "localBegin": 757.08, "localEnd": 768.44}, {"id": "c018_f000073", "text": "Harry got up and crossed to the door. He had just reached for the handle, however, when the door burst open so violently that it bounced back off the wall.", "begin": 31651.853, "end": 31660.573, "localBegin": 768.44, "localEnd": 777.16}, {"id": "c018_f000074", "text": "Lucius Malfoy stood there, fury in his face. And cowering under his arm, heavily wrapped in bandages, was Dobby.", "begin": 31660.573, "end": 31670.093, "localBegin": 777.16, "localEnd": 786.68}, {"id": "c018_f000075", "text": "'Good evening, Lucius,' said Dumbledore pleasantly.", "begin": 31670.093, "end": 31674.613, "localBegin": 786.68, "localEnd": 791.2}, {"id": "c018_f000076", "text": "Mr Malfoy almost knocked Harry over as he swept into the room. Dobby went scurrying in after him, crouching at the hem of his cloak, a look of abject terror on his face.", "begin": 31674.613, "end": 31696.453, "localBegin": 791.2, "localEnd": 813.04}, {"id": "c018_f000077", "text": "'So!' said Lucius Malfoy, his cold eyes fixed on Dumbledore. 'You've come back. The governors suspended you, but you still saw fit to return to Hogwarts.'", "begin": 31696.453, "end": 31717.013, "localBegin": 813.04, "localEnd": 833.6}, {"id": "c018_f000078", "text": "'Well, you see, Lucius,' said Dumbledore, smiling serenely, 'the other eleven governors contacted me today. It was something like being caught in a hailstorm of owls, to tell the truth. They'd heard that Arthur Weasley's daughter had been killed and wanted me back here at once. They seemed to think I was the best man for the job after all. Very strange tales they told me, too. Several of them seemed to think that you had threatened to curse their families if they didn't agree to suspend me in the first place.'", "begin": 31717.013, "end": 31750.973, "localBegin": 833.6, "localEnd": 867.56}, {"id": "c018_f000079", "text": "Mr Malfoy went even paler than usual, but his eyes were still slits of fury.", "begin": 31750.973, "end": 31756.853, "localBegin": 867.56, "localEnd": 873.44}, {"id": "c018_f000080", "text": "'So - have you stopped the attacks yet?' he sneered. 'Have you caught the culprit?'", "begin": 31756.853, "end": 31763.613, "localBegin": 873.44, "localEnd": 880.2}, {"id": "c018_f000081", "text": "'We have,' said Dumbledore, with a smile.", "begin": 31763.613, "end": 31766.573, "localBegin": 880.2, "localEnd": 883.16}, {"id": "c018_f000082", "text": "'Well?' said Mr Malfoy sharply. 'Who is it?'", "begin": 31766.573, "end": 31770.333, "localBegin": 883.16, "localEnd": 886.92}, {"id": "c018_f000083", "text": "'The same person as last time, Lucius,' said Dumbledore. 'But this time, Lord Voldemort was acting through somebody else. By means of this diary.'", "begin": 31770.333, "end": 31781.493, "localBegin": 886.92, "localEnd": 898.08}, {"id": "c018_f000084", "text": "He held up the small black book with the large hole through the centre, watching Mr Malfoy closely. Harry, however, was watching Dobby.", "begin": 31781.493, "end": 31790.133, "localBegin": 898.08, "localEnd": 906.72}, {"id": "c018_f000085", "text": "The elf was doing something very odd. His great eyes fixed meaningfully on Harry, he kept pointing at the diary, then at Mr Malfoy, and then hitting himself hard on the head with his fist.", "begin": 31790.133, "end": 31802.053, "localBegin": 906.72, "localEnd": 918.64}, {"id": "c018_f000086", "text": "'I see ...' said Mr Malfoy slowly to Dumbledore.", "begin": 31802.053, "end": 31807.013, "localBegin": 918.64, "localEnd": 923.6}, {"id": "c018_f000087", "text": "'A clever plan,' said Dumbledore in a level voice, still staring Mr", "begin": 31807.013, "end": 31811.573, "localBegin": 923.6, "localEnd": 928.16}, {"id": "c018_f000088", "text": "Malfoy straight in the eye. 'Because if Harry here -' Mr Malfoy shot Harry a swift, sharp look, 'and his friend Ron hadn't discovered this book, why - Ginny Weasley might have taken all the blame. No one would ever have been able to prove she hadn't acted of her own free will ...'", "begin": 31811.573, "end": 31834.093, "localBegin": 928.16, "localEnd": 950.68}, {"id": "c018_f000089", "text": "Mr Malfoy said nothing. His face was suddenly mask-like.", "begin": 31834.093, "end": 31838.493, "localBegin": 950.68, "localEnd": 955.08}, {"id": "c018_f000090", "text": "'And imagine,' Dumbledore went on, 'what might have happened then ... The Weasleys are one of our most prominent pure-blood families. Imagine the effect on Arthur Weasley and his Muggle Protection Act, if his own daughter was discovered attacking and killing Muggle-borns. Very fortunate the diary was discovered, and Riddle's memories wiped from it. Who knows what the consequences might have been otherwise ...'", "begin": 31838.493, "end": 31869.893, "localBegin": 955.08, "localEnd": 986.48}, {"id": "c018_f000091", "text": "Mr Malfoy forced himself to speak.", "begin": 31869.893, "end": 31873.133, "localBegin": 986.48, "localEnd": 989.72}, {"id": "c018_f000092", "text": "'Very fortunate,' he said stiffly.", "begin": 31873.133, "end": 31877.173, "localBegin": 989.72, "localEnd": 993.76}, {"id": "c018_f000093", "text": "And still, behind his back, Dobby was pointing, first to the diary, then to Lucius Malfoy, then punching himself in the head.", "begin": 31877.173, "end": 31884.773, "localBegin": 993.76, "localEnd": 1001.36}, {"id": "c018_f000094", "text": "And Harry suddenly understood. He nodded at Dobby, and Dobby backed into a corner, now twisting his ears in punishment.", "begin": 31884.773, "end": 31895.053, "localBegin": 1001.36, "localEnd": 1011.64}, {"id": "c018_f000095", "text": "'Don't you want to know how Ginny got hold of that diary, Mr Malfoy?' said Harry.", "begin": 31895.053, "end": 31900.533, "localBegin": 1011.64, "localEnd": 1017.12}, {"id": "c018_f000096", "text": "Lucius Malfoy rounded on him.", "begin": 31900.533, "end": 31902.173, "localBegin": 1017.12, "localEnd": 1018.76}, {"id": "c018_f000097", "text": "'How should I know how the stupid little girl got hold of it?' he said.", "begin": 31902.173, "end": 31907.053, "localBegin": 1018.76, "localEnd": 1023.64}, {"id": "c018_f000098", "text": "'Because you gave it to her,' said Harry. 'In Flourish and Blotts. You picked up her old Transfiguration book, and slipped the diary inside it, didn't you?'", "begin": 31907.053, "end": 31916.613, "localBegin": 1023.64, "localEnd": 1033.2}, {"id": "c018_f000099", "text": "He saw Mr Malfoy's white hands clench and unclench.", "begin": 31916.613, "end": 31921.053, "localBegin": 1033.2, "localEnd": 1037.64}, {"id": "c018_f000100", "text": "'Prove it,' he hissed.", "begin": 31921.053, "end": 31923.813, "localBegin": 1037.64, "localEnd": 1040.4}, {"id": "c018_f000101", "text": "'Oh, no one will be able to do that,' said Dumbledore, smiling at Harry. 'Not now Riddle has vanished from the book. On the other hand, I would advise you, Lucius, not to go giving out any more of Lord Voldemort's old school things. If any more of them find their way into innocent hands, I think Arthur Weasley, for one, will make sure they are traced back to you ...'", "begin": 31923.813, "end": 31951.453, "localBegin": 1040.4, "localEnd": 1068.04}, {"id": "c018_f000102", "text": "Lucius Malfoy stood for a moment, and Harry distinctly saw his right hand twitch as though he was longing to reach for his wand. Instead, he turned to his house-elf.", "begin": 31951.453, "end": 31963.253, "localBegin": 1068.04, "localEnd": 1079.84}, {"id": "c018_f000103", "text": "'We're going, Dobby!'", "begin": 31963.253, "end": 31964.733, "localBegin": 1079.84, "localEnd": 1081.32}, {"id": "c018_f000104", "text": "He wrenched open the door, and as the elf came hurrying up to", "begin": 31964.733, "end": 31968.813, "localBegin": 1081.32, "localEnd": 1085.4}, {"id": "c018_f000105", "text": "him, he kicked him right through it. They could hear Dobby squealing with pain all the way along the corridor. Harry stood for a moment, thinking hard. Then it came to him.", "begin": 31968.813, "end": 31978.973, "localBegin": 1085.4, "localEnd": 1095.56}, {"id": "c018_f000106", "text": "'Professor Dumbledore,' he said hurriedly, 'can I give that diary back to Mr Malfoy, please?'", "begin": 31978.973, "end": 31985.013, "localBegin": 1095.56, "localEnd": 1101.6}, {"id": "c018_f000107", "text": "'Certainly, Harry,' said Dumbledore calmly. 'But hurry. The feast, remember.'", "begin": 31985.013, "end": 31990.973, "localBegin": 1101.6, "localEnd": 1107.56}, {"id": "c018_f000108", "text": "Harry grabbed the diary and dashed out of the office. He could hear Dobby's squeals of pain receding around the corner. Quickly, wondering if this plan could possibly work, Harry took off one of his shoes, pulled off his slimy, filthy sock, and stuffed the diary into it. Then he ran down the dark corridor.", "begin": 31990.973, "end": 32010.613, "localBegin": 1107.56, "localEnd": 1127.2}, {"id": "c018_f000109", "text": "He caught up with them at the top of the stairs.", "begin": 32010.613, "end": 32013.333, "localBegin": 1127.2, "localEnd": 1129.92}, {"id": "c018_f000110", "text": "'Mr Malfoy,' he gasped, skidding to a halt, 'I've got something for you.'", "begin": 32013.333, "end": 32017.813, "localBegin": 1129.92, "localEnd": 1134.4}, {"id": "c018_f000111", "text": "And he forced the smelly sock into Lucius Malfoy's hand.", "begin": 32017.813, "end": 32022.253, "localBegin": 1134.4, "localEnd": 1138.84}, {"id": "c018_f000112", "text": "'What the -?'", "begin": 32022.253, "end": 32024.053, "localBegin": 1138.84, "localEnd": 1140.64}, {"id": "c018_f000113", "text": "Mr Malfoy ripped the sock off the diary, threw it aside, then looked furiously from the ruined book to Harry.", "begin": 32024.053, "end": 32031.973, "localBegin": 1140.64, "localEnd": 1148.56}, {"id": "c018_f000114", "text": "'You'll meet the same sticky end as your parents one of these days, Harry Potter,' he said softly. 'They were meddlesome fools, too.'", "begin": 32031.973, "end": 32043.933, "localBegin": 1148.56, "localEnd": 1160.52}, {"id": "c018_f000115", "text": "He turned to go.", "begin": 32043.933, "end": 32044.973, "localBegin": 1160.52, "localEnd": 1161.56}, {"id": "c018_f000116", "text": "'Come, Dobby. I said, Come!'", "begin": 32044.973, "end": 32047.613, "localBegin": 1161.56, "localEnd": 1164.2}, {"id": "c018_f000117", "text": "But Dobby didn't move. He was holding up Harry's disgusting, slimy sock, and looking at it as though it were a priceless treasure.", "begin": 32047.613, "end": 32058.533, "localBegin": 1164.2, "localEnd": 1175.12}, {"id": "c018_f000118", "text": "'Master has given Dobby a sock,' said the elf in wonderment. 'Master gave it to Dobby.'", "begin": 32058.533, "end": 32067.333, "localBegin": 1175.12, "localEnd": 1183.92}, {"id": "c018_f000119", "text": "'What's that?' spat Mr Malfoy. 'What did you say?'", "begin": 32067.333, "end": 32070.773, "localBegin": 1183.92, "localEnd": 1187.36}, {"id": "c018_f000120", "text": "'Dobby has got a sock,' said Dobby in disbelief. 'Master threw it, and Dobby caught it, and Dobby - Dobby is free.'", "begin": 32070.773, "end": 32082.693, "localBegin": 1187.36, "localEnd": 1199.28}, {"id": "c018_f000121", "text": "Lucius Malfoy stood frozen, staring at the elf. Then he lunged at Harry.", "begin": 32082.693, "end": 32089.813, "localBegin": 1199.28, "localEnd": 1206.4}, {"id": "c018_f000122", "text": "'You've lost me my servant, boy!'", "begin": 32089.813, "end": 32092.333, "localBegin": 1206.4, "localEnd": 1208.92}, {"id": "c018_f000123", "text": "But Dobby shouted, 'You shall not harm Harry Potter!'", "begin": 32092.333, "end": 32096.293, "localBegin": 1208.92, "localEnd": 1212.88}, {"id": "c018_f000124", "text": "There was a loud bang, and Mr Malfoy was thrown backwards. He crashed down the stairs, three at a time, landing in a crumpled heap on the landing below. He got up, his face livid, and pulled out his wand, but Dobby raised a long threatening finger.", "begin": 32096.293, "end": 32112.573, "localBegin": 1212.88, "localEnd": 1229.16}, {"id": "c018_f000125", "text": "'You shall go now,' he said fiercely, pointing down at Mr Malfoy.", "begin": 32112.573, "end": 32119.333, "localBegin": 1229.16, "localEnd": 1235.92}, {"id": "c018_f000126", "text": "'You shall not touch Harry Potter. You shall go now.'", "begin": 32119.333, "end": 32126.973, "localBegin": 1235.92, "localEnd": 1243.56}, {"id": "c018_f000127", "text": "Lucius Malfoy had no choice. With a last, incensed stare at the pair of them, he swung his cloak around him and hurried out of sight.", "begin": 32126.973, "end": 32136.813, "localBegin": 1243.56, "localEnd": 1253.4}, {"id": "c018_f000128", "text": "'Harry Potter freed Dobby!' said the elf shrilly, gazing up at Harry, moonlight from the nearest window reflected in his orb-like eyes. 'Harry Potter set Dobby free!'", "begin": 32136.813, "end": 32151.453, "localBegin": 1253.4, "localEnd": 1268.04}, {"id": "c018_f000129", "text": "'Least I could do, Dobby,' said Harry, grinning. 'Just promise never to try and save my life again.'", "begin": 32151.453, "end": 32157.853, "localBegin": 1268.04, "localEnd": 1274.44}, {"id": "c018_f000130", "text": "The elf's ugly brown face split suddenly into a wide, toothy smile.", "begin": 32157.853, "end": 32163.173, "localBegin": 1274.44, "localEnd": 1279.76}, {"id": "c018_f000131", "text": "'I've just got one question, Dobby,' said Harry, as Dobby pulled on Harry's sock with shaking hands. 'You told me all this had nothing to do with He Who Must Not Be Named, remember? Well -'", "begin": 32163.173, "end": 32175.733, "localBegin": 1279.76, "localEnd": 1292.32}, {"id": "c018_f000132", "text": "'It was a clue, sir,' said Dobby, his eyes widening, as though this was obvious. 'Dobby was giving you a clue. The Dark Lord, before he changed his name, could be freely named, you see?'", "begin": 32175.733, "end": 32190.893, "localBegin": 1292.32, "localEnd": 1307.48}, {"id": "c018_f000133", "text": "'Right,' said Harry weakly. 'Well, I'd better go. There's a feast, and my friend Hermione should be awake by now ...'", "begin": 32190.893, "end": 32200.133, "localBegin": 1307.48, "localEnd": 1316.72}, {"id": "c018_f000134", "text": "Dobby threw his arms around Harry's middle and hugged him.", "begin": 32200.133, "end": 32203.893, "localBegin": 1316.72, "localEnd": 1320.48}, {"id": "c018_f000135", "text": "'Harry Potter is greater by far than Dobby knew!' he sobbed. 'Farewell, Harry Potter!'", "begin": 32203.893, "end": 32213.093, "localBegin": 1320.48, "localEnd": 1329.68}, {"id": "c018_f000136", "text": "And with a final loud crack, Dobby disappeared. * Harry had been to several Hogwarts feasts, but never one quite like this. Everybody was in their pyjamas, and the celebrations lasted all night. Harry didn't know whether the best bit was Hermione running towards him, screaming, 'You solved it! You solved it!' or Justin hurrying over from the Hufflepuff table to wring his hand and apologise endlessly for suspecting him, or Hagrid turning up at half past three, cuffing Harry and Ron so hard on the shoulders that they were knocked into their plates of trifle, or his and Ron's four hundred points securing Gryffindor the House Cup for the second year running, or Professor McGonagall standing up to tell them all that the exams had been cancelled as a school treat ('Oh, no!' said Hermione), or Dumbledore announcing that, unfortunately, Professor Lockhart would be unable to return next year, owing to the fact that he needed to go away and get his memory back. Quite a few of the teachers joined in the cheering that greeted this news.", "begin": 32213.093, "end": 32284.173, "localBegin": 1329.68, "localEnd": 1400.76}, {"id": "c018_f000137", "text": "'Shame,' said Ron, helping himself to a jam doughnut. 'He was starting to grow on me.' * The rest of the summer term passed in a haze of blazing sunshine. Hogwarts was back to normal, with only a few, small differences: Defence Against the Dark Arts classes were cancelled ('but we've had plenty of practice at that anyway,' Ron told a disgruntled Hermione) and Lucius Malfoy had been sacked as a school governor. Draco was no longer strutting around the school as though he owned the place. On the contrary, he looked resentful and sulky. On the other hand, Ginny Weasley was perfectly happy again.", "begin": 32284.173, "end": 32325.493, "localBegin": 1400.76, "localEnd": 1442.08}, {"id": "c018_f000138", "text": "Too soon, it was time for the journey home on the Hogwarts Express. Harry, Ron, Hermione, Fred, George and Ginny got a compartment to themselves. They made the most of the last few hours in which they were allowed to do magic before the holidays. They played Exploding Snap, set off the very last of Fred and George's Filibuster Fireworks, and practised disarming each other by magic. Harry was getting very good at it.", "begin": 32325.493, "end": 32352.333, "localBegin": 1442.08, "localEnd": 1468.92}, {"id": "c018_f000139", "text": "They were almost at King's Cross when Harry remembered something.", "begin": 32352.333, "end": 32357.053, "localBegin": 1468.92, "localEnd": 1473.64}, {"id": "c018_f000140", "text": "'Ginny - what did you see Percy doing, that he didn't want you to tell anyone?'", "begin": 32357.053, "end": 32363.133, "localBegin": 1473.64, "localEnd": 1479.72}, {"id": "c018_f000141", "text": "'Oh, that,' said Ginny, giggling. 'Well - Percy's got a girlfriend.'", "begin": 32363.133, "end": 32370.733, "localBegin": 1479.72, "localEnd": 1487.32}, {"id": "c018_f000142", "text": "Fred dropped a stack of books on George's head.", "begin": 32370.733, "end": 32374.413, "localBegin": 1487.32, "localEnd": 1491.0}, {"id": "c018_f000143", "text": "'What?'", "begin": 32374.413, "end": 32375.693, "localBegin": 1491.0, "localEnd": 1492.28}, {"id": "c018_f000144", "text": "'It's that Ravenclaw Prefect, Penelope Clearwater,' said Ginny. 'That's who he was writing to all last summer. He's been meeting her all over the school in secret. I walked in on them kissing in an empty classroom one day. He was so upset when she was you know - attacked. You won't tease him, will you?' she added anxiously.", "begin": 32375.693, "end": 32398.813, "localBegin": 1492.28, "localEnd": 1515.4}, {"id": "c018_f000145", "text": "'Wouldn't dream of it,' said Fred, who was looking as if his birthday had come early.", "begin": 32398.813, "end": 32405.893, "localBegin": 1515.4, "localEnd": 1522.48}, {"id": "c018_f000146", "text": "'Definitely not,' said George, sniggering.", "begin": 32405.893, "end": 32409.933, "localBegin": 1522.48, "localEnd": 1526.52}, {"id": "c018_f000147", "text": "The Hogwarts Express slowed and finally stopped.", "begin": 32409.933, "end": 32413.813, "localBegin": 1526.52, "localEnd": 1530.4}, {"id": "c018_f000148", "text": "Harry pulled out his quill and a bit of parchment and turned to Ron and Hermione.", "begin": 32413.813, "end": 32418.413, "localBegin": 1530.4, "localEnd": 1535.0}, {"id": "c018_f000149", "text": "'This is called a telephone number,' he told Ron, scribbling it twice, tearing the parchment in two and handing it to them. 'I told", "begin": 32418.413, "end": 32427.693, "localBegin": 1535.0, "localEnd": 1544.28}, {"id": "c018_f000150", "text": "your dad how to use a telephone last summer, he'll know. Call me at the Dursleys, OK? I can't stand another two months with only Dudley to talk to ...'", "begin": 32427.693, "end": 32437.093, "localBegin": 1544.28, "localEnd": 1553.68}, {"id": "c018_f000151", "text": "'Your aunt and uncle will be proud, though, won't they?' said Hermione, as they got off the train and joined the crowd thronging towards the enchanted barrier. 'When they hear what you did this year?'", "begin": 32437.093, "end": 32448.493, "localBegin": 1553.68, "localEnd": 1565.08}, {"id": "c018_f000152", "text": "'Proud?' said Harry. 'Are you mad? All those times I could've died, and I didn't manage it? They'll be furious ...'", "begin": 32448.493, "end": 32458.053, "localBegin": 1565.08, "localEnd": 1574.64}, {"id": "c018_f000153", "text": "And together they walked back through the gateway to the Muggle world.", "begin": 32458.053, "end": 32466.413, "localBegin": 1574.64, "localEnd": 1583.0}]}]};
    const audio = document.getElementById('audio');
    const chapterList = document.getElementById('chapterList');
    const reader = document.getElementById('reader');
    const chapterTitle = document.getElementById('chapterTitle');
    const playButton = document.getElementById('playButton');
    const prevButton = document.getElementById('prevButton');
    const nextButton = document.getElementById('nextButton');
    const seekBar = document.getElementById('seekBar');
    const timeLabel = document.getElementById('timeLabel');
    const chapterTime = document.getElementById('chapterTime');
    let currentIndex = 0;
    let currentParagraphId = null;

    function formatTime(seconds) {
      seconds = Math.max(0, Math.floor(seconds || 0));
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
    }

    function renderNav() {
      chapterList.innerHTML = '';
      manifest.chapters.forEach((chapter, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'chapter-link' + (index === currentIndex ? ' active' : '');
        const number = chapter.kind === 'chapter' ? String(chapter.number).padStart(2, '0') : '--';
        button.innerHTML = `<span class="chapter-number">${number}</span><span>${chapter.title}</span>`;
        button.addEventListener('click', () => loadChapter(index, true));
        chapterList.appendChild(button);
      });
    }

    function loadChapter(index, autoplay = false) {
      currentIndex = Math.max(0, Math.min(index, manifest.chapters.length - 1));
      const chapter = manifest.chapters[currentIndex];
      currentParagraphId = null;
      audio.src = chapter.audio;
      chapterTitle.textContent = chapter.kind === 'chapter' ? `Chapter ${chapter.number}. ${chapter.title}` : chapter.title;
      reader.innerHTML = '';
      if (chapter.paragraphs.length) {
        chapter.paragraphs.forEach((paragraph) => {
          const node = document.createElement('p');
          node.className = 'paragraph';
          node.id = paragraph.id;
          node.textContent = paragraph.text;
          node.addEventListener('click', () => {
            audio.currentTime = paragraph.localBegin;
            audio.play();
          });
          reader.appendChild(node);
        });
      } else {
        const node = document.createElement('p');
        node.className = 'outro';
        node.textContent = 'Audio outro';
        reader.appendChild(node);
      }
      renderNav();
      updateTimes();
      if (autoplay) {
        audio.play();
      }
    }

    function updateTimes() {
      const chapter = manifest.chapters[currentIndex];
      const local = audio.currentTime || 0;
      timeLabel.textContent = `${formatTime(chapter.start + local)} / ${formatTime(manifest.duration)}`;
      chapterTime.textContent = `${formatTime(local)} / ${formatTime(chapter.duration)}`;
      seekBar.value = chapter.duration ? String(Math.round((local / chapter.duration) * 1000)) : '0';
      updateHighlight(local);
    }

    function updateHighlight(local) {
      const chapter = manifest.chapters[currentIndex];
      const paragraph = chapter.paragraphs.find((item) => local >= item.localBegin && local < item.localEnd);
      const nextId = paragraph ? paragraph.id : null;
      if (nextId === currentParagraphId) return;
      if (currentParagraphId) {
        document.getElementById(currentParagraphId)?.classList.remove('active');
      }
      currentParagraphId = nextId;
      if (currentParagraphId) {
        const node = document.getElementById(currentParagraphId);
        node?.classList.add('active');
        node?.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    }

    playButton.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    });
    prevButton.addEventListener('click', () => loadChapter(currentIndex - 1, !audio.paused));
    nextButton.addEventListener('click', () => loadChapter(currentIndex + 1, !audio.paused));
    seekBar.addEventListener('input', () => {
      const chapter = manifest.chapters[currentIndex];
      audio.currentTime = (Number(seekBar.value) / 1000) * chapter.duration;
    });
    audio.addEventListener('play', () => playButton.textContent = 'Pause');
    audio.addEventListener('pause', () => playButton.textContent = 'Play');
    audio.addEventListener('timeupdate', updateTimes);
    audio.addEventListener('loadedmetadata', updateTimes);
    audio.addEventListener('ended', () => {
      if (currentIndex < manifest.chapters.length - 1) {
        loadChapter(currentIndex + 1, true);
      }
    });

    loadChapter(0, false);
  </script>
</body>
</html>
