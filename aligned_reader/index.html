88}, {"id": "c004_f000187", "text": "'Ron!' said Mr Weasley, struggling over with Fred and George. 'What are you doing? It's mad in here, let's go outside.'", "begin": 5556.553, "end": 5564.233, "localBegin": 1929.88, "localEnd": 1937.56}, {"id": "c004_f000188", "text": "'Well, well, well - Arthur Weasley.'", "begin": 5564.233, "end": 5568.993, "localBegin": 1937.56, "localEnd": 1942.32}, {"id": "c004_f000189", "text": "It was Mr Malfoy. He stood with his hand on Draco's shoulder,", "begin": 5568.993, "end": 5573.553, "localBegin": 1942.32, "localEnd": 1946.88}, {"id": "c004_f000190", "text": "sneering in just the same way.", "begin": 5573.553, "end": 5575.393, "localBegin": 1946.88, "localEnd": 1948.72}, {"id": "c004_f000191", "text": "'Lucius,' said Mr Weasley, nodding coldly.", "begin": 5575.393, "end": 5579.113, "localBegin": 1948.72, "localEnd": 1952.44}, {"id": "c004_f000192", "text": "'Busy time at the Ministry, I hear,' said Mr Malfoy. 'All those raids ... I hope they're paying you overtime?'", "begin": 5579.113, "end": 5587.833, "localBegin": 1952.44, "localEnd": 1961.16}, {"id": "c004_f000193", "text": "He reached into Ginny's cauldron and extracted, from amidst the glossy Lockhart books, a very old, very battered copy of A Beginner's Guide to Transfiguration.", "begin": 5587.833, "end": 5598.233, "localBegin": 1961.16, "localEnd": 1971.56}, {"id": "c004_f000194", "text": "'Obviously not,' he said. 'Dear me, what's the use of being a disgrace to the name of wizard if they don't even pay you well for it?'", "begin": 5598.233, "end": 5608.953, "localBegin": 1971.56, "localEnd": 1982.28}, {"id": "c004_f000195", "text": "Mr Weasley flushed darker than either Ron or Ginny.", "begin": 5608.953, "end": 5613.433, "localBegin": 1982.28, "localEnd": 1986.76}, {"id": "c004_f000196", "text": "'We have a very different idea of what disgraces the name of wizard, Malfoy,' he said.", "begin": 5613.433, "end": 5619.713, "localBegin": 1986.76, "localEnd": 1993.04}, {"id": "c004_f000197", "text": "'Clearly,' said Mr Malfoy, his pale eyes straying to Mr and Mrs Granger, who were watching apprehensively. 'The company you keep, Weasley ... and I thought your family could sink no lower -'", "begin": 5619.713, "end": 5633.553, "localBegin": 1993.04, "localEnd": 2006.88}, {"id": "c004_f000198", "text": "There was a thud of metal as Ginny's cauldron went flying; Mr Weasley had thrown himself at Mr Malfoy, knocking him backwards into a bookshelf. Dozens of heavy spellbooks came thundering down on all their heads; there was a yell of 'Get him, Dad!' from Fred or George; Mrs Weasley was shrieking, 'No, Arthur, no!'; the crowd stampeded backwards, knocking more shelves over; 'Gentlemen, please - please!' cried the assistant and then, louder than all, 'Break it up, there, gents, break it up -'", "begin": 5633.553, "end": 5662.273, "localBegin": 2006.88, "localEnd": 2035.6}, {"id": "c004_f000199", "text": "Hagrid was wading towards them through the sea of books. In an instant he had pulled Mr Weasley and Mr Malfoy apart. Mr Weasley had a cut lip and Mr Malfoy had been hit in the eye by an Encyclopedia of Toadstools. He was still holding Ginny's old transfiguration book. He thrust it at her, his eyes glittering with malice.", "begin": 5662.273, "end": 5683.473, "localBegin": 2035.6, "localEnd": 2056.8}, {"id": "c004_f000200", "text": "'Here, girl - take your book - it's the best your father can give you -'", "begin": 5683.473, "end": 5689.473, "localBegin": 2056.8, "localEnd": 2062.8}, {"id": "c004_f000201", "text": "Pulling himself out of Hagrid's grip he beckoned to Draco and swept from the shop.", "begin": 5689.473, "end": 5694.913, "localBegin": 2062.8, "localEnd": 2068.24}, {"id": "c004_f000202", "text": "'Yeh should've ignored him, Arthur,' said Hagrid, almost lifting Mr Weasley off his feet as he straightened his robes. 'Rotten ter the core, the whole family, everyone knows that. No Malfoy's worth listenin' ter. Bad blood, that's what it is. Come on now let's get outta here.'", "begin": 5694.913, "end": 5712.513, "localBegin": 2068.24, "localEnd": 2085.84}, {"id": "c004_f000203", "text": "The assistant looked as though he wanted to stop them leaving, but he barely came up to Hagrid's waist and seemed to think better of it. They hurried up the street, the Grangers shaking with", "begin": 5712.513, "end": 5722.553, "localBegin": 2085.84, "localEnd": 2095.88}, {"id": "c004_f000204", "text": "fright and Mrs Weasley beside herself with fury.", "begin": 5722.553, "end": 5725.673, "localBegin": 2095.88, "localEnd": 2099.0}, {"id": "c004_f000205", "text": "'A fine example to set to your children ... brawling in public ... what Gilderoy Lockhart must've thought ...'", "begin": 5725.673, "end": 5732.313, "localBegin": 2099.0, "localEnd": 2105.64}, {"id": "c004_f000206", "text": "'He was pleased,' said Fred. 'Didn't you hear him as we were leaving? He was asking that bloke from the Daily Prophet if he'd be able to work the fight into his report - said it was all publicity.'", "begin": 5732.313, "end": 5743.113, "localBegin": 2105.64, "localEnd": 2116.44}, {"id": "c004_f000207", "text": "But it was a subdued group who headed back to the fireside in the Leaky Cauldron, where Harry, the Weasleys and all their shopping would be travelling back to The Burrow using Floo powder. They said goodbye to the Grangers, who were leaving the pub for the Muggle street on the other side. Mr Weasley started to ask them how bus stops worked, but stopped quickly at the look on Mrs Weasley's face.", "begin": 5743.113, "end": 5765.753, "localBegin": 2116.44, "localEnd": 2139.08}, {"id": "c004_f000208", "text": "Harry took off his glasses and put them safely in his pocket before helping himself to Floo powder. It definitely wasn't his favourite way to travel.", "begin": 5765.753, "end": 5778.113, "localBegin": 2139.08, "localEnd": 2151.44}]}, {"kind": "chapter", "number": 5, "title": "The Whomping Willow", "audio": "audio/chapter_005.mp3", "start": 5778.129, "end": 7765.129, "duration": 1987.0, "paragraphs": [{"id": "c005_f000001", "text": "Chapter Five. The Whomping Willow.", "begin": 5778.129, "end": 5783.129, "localBegin": 0.0, "localEnd": 5.0}, {"id": "c005_f000002", "text": "The end of the summer holidays came too quickly for Harry's liking. He was looking forward to getting back to Hogwarts, but his month at The Burrow had been the happiest of his life. It was difficult not to feel jealous of Ron when he thought of the Dursleys and the sort of welcome he could expect next time he turned up in Privet Drive.", "begin": 5783.129, "end": 5800.889, "localBegin": 5.0, "localEnd": 22.76}, {"id": "c005_f000003", "text": "On their last evening, Mrs Weasley conjured up a sumptuous dinner which included all of Harry's favourite things, ending with a mouthwatering treacle pudding. Fred and George rounded off the evening with a display of Filibuster fireworks; they filled the kitchen with red and blue stars that bounced from ceiling to wall for at least half an hour. Then it was time for a last mug of hot chocolate and bed.", "begin": 5800.889, "end": 5823.889, "localBegin": 22.76, "localEnd": 45.76}, {"id": "c005_f000004", "text": "It took a long while to get started next morning. They were up at cock-crow, but somehow they still seemed to have a great deal to do. Mrs Weasley dashed about in a bad mood looking for spare socks and quills, people kept colliding on the stairs, half-dressed with bits of toast in their hands, and Mr Weasley nearly broke his neck, tripping over a stray chicken as he crossed the yard carrying Ginny's trunk to the car.", "begin": 5823.889, "end": 5847.249, "localBegin": 45.76, "localEnd": 69.12}, {"id": "c005_f000005", "text": "Harry couldn't see how eight people, six large trunks, two owls and a rat were going to fit into one small Ford Anglia. He had reckoned, of course, without the special features which Mr Weasley had added.", "begin": 5847.249, "end": 5860.169, "localBegin": 69.12, "localEnd": 82.04}, {"id": "c005_f000006", "text": "'Not a word to Molly,' he whispered to Harry as he opened the boot and showed him how it had been magically expanded so that the trunks fitted easily.", "begin": 5860.169, "end": 5869.929, "localBegin": 82.04, "localEnd": 91.8}, {"id": "c005_f000007", "text": "When at last they were all in the car, Mrs Weasley glanced into the back seat, where Harry, Ron, Fred, George and Percy were all sitting comfortably side by side, and said, 'Muggles do know more", "begin": 5869.929, "end": 5880.769, "localBegin": 91.8, "localEnd": 102.64}, {"id": "c005_f000008", "text": "than we give them credit for, don't they?' She and Ginny got into the front seat, which had been stretched so that it resembled a park bench. 'I mean, you'd never know it was this roomy from the outside, would you?'", "begin": 5880.769, "end": 5893.929, "localBegin": 102.64, "localEnd": 115.8}, {"id": "c005_f000009", "text": "Mr Weasley started up the engine and they trundled out of the yard, Harry turning back for a last look at the house. He barely had time to wonder when he'd see it again when they were back: George had forgotten his box of Filibuster fireworks. Five minutes after that, they skidded to a halt in the yard so that Fred could run in for his broomstick. They had almost reached the motorway when Ginny shrieked that she'd left her diary. By the time she had clambered back into the car, they were running very late, and tempers were running high.", "begin": 5893.929, "end": 5924.609, "localBegin": 115.8, "localEnd": 146.48}, {"id": "c005_f000010", "text": "Mr Weasley glanced at his watch and then at his wife.", "begin": 5924.609, "end": 5928.009, "localBegin": 146.48, "localEnd": 149.88}, {"id": "c005_f000011", "text": "'Molly, dear -'", "begin": 5928.009, "end": 5928.849, "localBegin": 149.88, "localEnd": 150.72}, {"id": "c005_f000012", "text": "'No, Arthur.'", "begin": 5928.849, "end": 5930.209, "localBegin": 150.72, "localEnd": 152.08}, {"id": "c005_f000013", "text": "'No one would see. This little button here is an Invisibility Booster I installed - that'd get us up in the air - then we fly above the clouds. We'd be there in ten minutes and no one would be any the wiser ...'", "begin": 5930.209, "end": 5943.369, "localBegin": 152.08, "localEnd": 165.24}, {"id": "c005_f000014", "text": "'I said no, Arthur, not in broad daylight.'", "begin": 5943.369, "end": 5947.729, "localBegin": 165.24, "localEnd": 169.6}, {"id": "c005_f000015", "text": "They reached King's Cross at a quarter to eleven. Mr Weasley dashed across the road to get trolleys for their trunks and they all hurried into the station.", "begin": 5947.729, "end": 5956.529, "localBegin": 169.6, "localEnd": 178.4}, {"id": "c005_f000016", "text": "Harry had caught the Hogwarts Express the previous year. The tricky bit was getting onto platform nine and three-quarters, which wasn't visible to the Muggle eye. What you had to do was walk through the solid barrier dividing platforms nine and ten. It didn't hurt, but it had to be done carefully so that none of the Muggles noticed you vanishing.", "begin": 5956.529, "end": 5977.009, "localBegin": 178.4, "localEnd": 198.88}, {"id": "c005_f000017", "text": "'Percy first,' said Mrs Weasley, looking nervously at the clock overhead, which showed they had only five minutes to disappear casually through the barrier.", "begin": 5977.009, "end": 5985.049, "localBegin": 198.88, "localEnd": 206.92}, {"id": "c005_f000018", "text": "Percy strode briskly forward and vanished. Mr Weasley went next, Fred and George followed.", "begin": 5985.049, "end": 5992.369, "localBegin": 206.92, "localEnd": 214.24}, {"id": "c005_f000019", "text": "'I'll take Ginny and you two come right after us,' Mrs Weasley told Harry and Ron, grabbing Ginny's hand and setting off. In the blink of an eye they were gone.", "begin": 5992.369, "end": 6002.529, "localBegin": 214.24, "localEnd": 224.4}, {"id": "c005_f000020", "text": "'Let's go together, we've only got a minute,' Ron said to Harry.", "begin": 6002.529, "end": 6006.449, "localBegin": 224.4, "localEnd": 228.32}, {"id": "c005_f000021", "text": "Harry made sure that Hedwig's cage was safely wedged on top", "begin": 6006.449, "end": 6009.609, "localBegin": 228.32, "localEnd": 231.48}, {"id": "c005_f000022", "text": "of his trunk and wheeled his trolley about to face the barrier. He felt perfectly confident; this wasn't nearly as uncomfortable as using Floo powder. Both of them bent low over the handles of their trolleys and walked purposefully towards the barrier, gathering speed. A few feet away from it, they broke into a run and -", "begin": 6009.609, "end": 6026.969, "localBegin": 231.48, "localEnd": 248.84}, {"id": "c005_f000023", "text": "CRASH.", "begin": 6026.969, "end": 6029.529, "localBegin": 248.84, "localEnd": 251.4}, {"id": "c005_f000024", "text": "Both trolleys hit the barrier and bounced backwards. Ron's trunk fell off with a loud thump, Harry was knocked off his feet, and Hedwig's cage bounced onto the shiny floor and she rolled away, shrieking indignantly. People all around them stared and a guard nearby yelled, 'What in blazes d'you think you're doing?'", "begin": 6029.529, "end": 6048.049, "localBegin": 251.4, "localEnd": 269.92}, {"id": "c005_f000025", "text": "'Lost control of the trolley,' Harry gasped, clutching his ribs as he got up. Ron ran to pick up Hedwig, who was causing such a scene that there was a lot of muttering about cruelty to animals from the surrounding crowd.", "begin": 6048.049, "end": 6061.409, "localBegin": 269.92, "localEnd": 283.28}, {"id": "c005_f000026", "text": "'Why can't we get through?' Harry hissed to Ron.", "begin": 6061.409, "end": 6064.889, "localBegin": 283.28, "localEnd": 286.76}, {"id": "c005_f000027", "text": "'I dunno -'", "begin": 6064.889, "end": 6066.369, "localBegin": 286.76, "localEnd": 288.24}, {"id": "c005_f000028", "text": "Ron looked wildly around. A dozen curious people were still watching them.", "begin": 6066.369, "end": 6070.649, "localBegin": 288.24, "localEnd": 292.52}, {"id": "c005_f000029", "text": "'We're going to miss the train,' Ron whispered. 'I don't understand why the gateway's sealed itself ...'", "begin": 6070.649, "end": 6075.969, "localBegin": 292.52, "localEnd": 297.84}, {"id": "c005_f000030", "text": "Harry looked up at the giant clock with a sickening feeling in the pit of his stomach. Ten seconds ... nine seconds ...", "begin": 6075.969, "end": 6082.169, "localBegin": 297.84, "localEnd": 304.04}, {"id": "c005_f000031", "text": "He wheeled his trolley forward cautiously until it was right against the barrier, and pushed with all his might. The metal remained solid.", "begin": 6082.169, "end": 6090.009, "localBegin": 304.04, "localEnd": 311.88}, {"id": "c005_f000032", "text": "Three seconds ... two seconds ... one second ...", "begin": 6090.009, "end": 6094.129, "localBegin": 311.88, "localEnd": 316.0}, {"id": "c005_f000033", "text": "'It's gone,' said Ron, sounding stunned. 'The train's left. What if Mum and Dad can't get back through to us? Have you got any Muggle money?'", "begin": 6094.129, "end": 6103.889, "localBegin": 316.0, "localEnd": 325.76}, {"id": "c005_f000034", "text": "Harry gave a hollow laugh. 'The Dursleys haven't given me pocket money for about six years.'", "begin": 6103.889, "end": 6109.409, "localBegin": 325.76, "localEnd": 331.28}, {"id": "c005_f000035", "text": "Ron pressed his ear to the cold barrier.", "begin": 6109.409, "end": 6111.409, "localBegin": 331.28, "localEnd": 333.28}, {"id": "c005_f000036", "text": "'Can't hear a thing,' he said tensely. 'What're we going to do? I don't know how long it'll take Mum and Dad to get back to us.'", "begin": 6111.409, "end": 6119.969, "localBegin": 333.28, "localEnd": 341.84}, {"id": "c005_f000037", "text": "They looked around. People were still watching them, mainly because of Hedwig's continuing screeches.", "begin": 6119.969, "end": 6126.049, "localBegin": 341.84, "localEnd": 347.92}, {"id": "c005_f000038", "text": "'I think we'd better go and wait by the car,' said Harry. We're attracting too much atten-'", "begin": 6126.049, "end": 6130.529, "localBegin": 347.92, "localEnd": 352.4}, {"id": "c005_f000039", "text": "'Harry!' said Ron, his eyes gleaming. 'The car!'", "begin": 6130.529, "end": 6134.409, "localBegin": 352.4, "localEnd": 356.28}, {"id": "c005_f000040", "text": "'What about it?'", "begin": 6134.409, "end": 6138.289, "localBegin": 356.28, "localEnd": 360.16}, {"id": "c005_f000041", "text": "'We can fly the car to Hogwarts!'", "begin": 6138.289, "end": 6141.409, "localBegin": 360.16, "localEnd": 363.28}, {"id": "c005_f000042", "text": "'But I thought -'", "begin": 6141.409, "end": 6144.009, "localBegin": 363.28, "localEnd": 365.88}, {"id": "c005_f000043", "text": "'We're stuck, right? And we've got to get to school, haven't we? And even underage wizards are allowed to use magic if it's a real emergency, section nineteen or something of the Restriction of Thingy ...'", "begin": 6144.009, "end": 6170.289, "localBegin": 365.88, "localEnd": 392.16}, {"id": "c005_f000044", "text": "Harry's feeling of panic turned suddenly to excitement.", "begin": 6170.289, "end": 6173.169, "localBegin": 392.16, "localEnd": 395.04}, {"id": "c005_f000045", "text": "'Can you fly it?'", "begin": 6173.169, "end": 6175.289, "localBegin": 395.04, "localEnd": 397.16}, {"id": "c005_f000046", "text": "'No problem,' said Ron, wheeling his trolley around to face the exit. 'C'mon, let's go, if we hurry we'll be able to follow the Hogwarts Express.'", "begin": 6175.289, "end": 6184.809, "localBegin": 397.16, "localEnd": 406.68}, {"id": "c005_f000047", "text": "And they marched off through the crowd of curious Muggles, out of the station and back into the side road where the old Ford Anglia was parked.", "begin": 6184.809, "end": 6192.889, "localBegin": 406.68, "localEnd": 414.76}, {"id": "c005_f000048", "text": "Ron unlocked the cavernous boot with a series of taps from his wand. They heaved their trunks back in, put Hedwig on the back seat and got into the front.", "begin": 6192.889, "end": 6200.769, "localBegin": 414.76, "localEnd": 422.64}, {"id": "c005_f000049", "text": "'Check no one's watching,' said Ron, starting the ignition with another tap of his wand. Harry stuck his head out of the window: traffic was rumbling along the main road ahead, but their street was empty.", "begin": 6200.769, "end": 6213.129, "localBegin": 422.64, "localEnd": 435.0}, {"id": "c005_f000050", "text": "'OK,' he said.", "begin": 6213.129, "end": 6215.529, "localBegin": 435.0, "localEnd": 437.4}, {"id": "c005_f000051", "text": "Ron pressed a tiny silver button on the dashboard. The car around them vanished - and so did they. Harry could feel the seat vibrating beneath him, hear the engine, feel his hands on his knees and his glasses on his nose, but for all he could see, he had become a pair of eyeballs, floating a few feet above the ground in a dingy street full of parked cars.", "begin": 6215.529, "end": 6237.809, "localBegin": 437.4, "localEnd": 459.68}, {"id": "c005_f000052", "text": "'Let's go,' said Ron's voice from his right.", "begin": 6237.809, "end": 6242.089, "localBegin": 459.68, "localEnd": 463.96}, {"id": "c005_f000053", "text": "The ground and the dirty buildings on either side fell away, dropping out of sight as the car rose; in seconds, the whole of London lay, smoky and glittering, below them.", "begin": 6242.089, "end": 6252.929, "localBegin": 463.96, "localEnd": 474.8}, {"id": "c005_f000054", "text": "Then there was a popping noise and the car, Harry and Ron reappeared.", "begin": 6252.929, "end": 6258.409, "localBegin": 474.8, "localEnd": 480.28}, {"id": "c005_f000055", "text": "'Uh oh,' said Ron, jabbing at the Invisibility Booster. 'It's faulty -'", "begin": 6258.409, "end": 6264.449, "localBegin": 480.28, "localEnd": 486.32}, {"id": "c005_f000056", "text": "Both of them pummelled it. The car vanished. Then it flickered back again.", "begin": 6264.449, "end": 6268.049, "localBegin": 486.32, "localEnd": 489.92}, {"id": "c005_f000057", "text": "'Hold on!' Ron yelled, and he slammed his foot on the accelerator; they shot straight into the low woolly clouds and everything", "begin": 6268.049, "end": 6275.809, "localBegin": 489.92, "localEnd": 497.68}, {"id": "c005_f000058", "text": "turned dull and foggy.", "begin": 6275.809, "end": 6278.609, "localBegin": 497.68, "localEnd": 500.48}, {"id": "c005_f000059", "text": "'Now what?' said Harry, blinking at the solid mass of cloud pressing in on them from all sides.", "begin": 6278.609, "end": 6284.529, "localBegin": 500.48, "localEnd": 506.4}, {"id": "c005_f000060", "text": "'We need to see the train to know what direction to go in,' said Ron.", "begin": 6284.529, "end": 6288.649, "localBegin": 506.4, "localEnd": 510.52}, {"id": "c005_f000061", "text": "'Dip back down again - quickly -'", "begin": 6288.649, "end": 6290.369, "localBegin": 510.52, "localEnd": 512.24}, {"id": "c005_f000062", "text": "They dropped back beneath the clouds and twisted around in their seats, squinting at the ground -", "begin": 6290.369, "end": 6296.289, "localBegin": 512.24, "localEnd": 518.16}, {"id": "c005_f000063", "text": "'I can see it!' Harry yelled. 'Right ahead - there!'", "begin": 6296.289, "end": 6300.049, "localBegin": 518.16, "localEnd": 521.92}, {"id": "c005_f000064", "text": "The Hogwarts Express was streaking along below them like a scarlet snake.", "begin": 6300.049, "end": 6305.609, "localBegin": 521.92, "localEnd": 527.48}, {"id": "c005_f000065", "text": "'Due north,' said Ron, checking the compass on the dashboard. 'OK, we'll just have to check on it every half an hour or so. Hold on ...' And they shot up through the clouds. A minute later, they burst out into a blaze of sunlight.", "begin": 6305.609, "end": 6320.889, "localBegin": 527.48, "localEnd": 542.76}, {"id": "c005_f000066", "text": "It was a different world. The wheels of the car skimmed the sea of fluffy cloud, the sky a bright, endless blue under the blinding white sun.", "begin": 6320.889, "end": 6331.569, "localBegin": 542.76, "localEnd": 553.44}, {"id": "c005_f000067", "text": "'All we've got to worry about now are aeroplanes,' said Ron.", "begin": 6331.569, "end": 6335.049, "localBegin": 553.44, "localEnd": 556.92}, {"id": "c005_f000068", "text": "They looked at each other and started to laugh; for a long time, they couldn't stop.", "begin": 6335.049, "end": 6340.889, "localBegin": 556.92, "localEnd": 562.76}, {"id": "c005_f000069", "text": "It was as though they had been plunged into a fabulous dream. This, thought Harry, was surely the only way to travel: past swirls and turrets of snowy cloud, in a car full of hot, bright sunlight, with a fat pack of toffees in the glove compartment, and the prospect of seeing Fred and George's jealous faces when they landed smoothly and spectacularly on the sweeping lawn in front of Hogwarts castle.", "begin": 6340.889, "end": 6366.169, "localBegin": 562.76, "localEnd": 588.04}, {"id": "c005_f000070", "text": "They made regular checks on the train as they flew further and further north, each dip beneath the clouds showing them a different view. London was soon far behind them, replaced by neat green fields which gave way in turn to wide, purplish moors, villages with tiny toy churches and a great city alive with cars like multi-coloured ants.", "begin": 6366.169, "end": 6389.609, "localBegin": 588.04, "localEnd": 611.48}, {"id": "c005_f000071", "text": "Several uneventful hours later, however, Harry had to admit that some of the fun was wearing off. The toffees had made them extremely thirsty and they had nothing to drink. He and Ron had pulled off their jumpers, but Harry's T-shirt was sticking to the back of his seat and his glasses kept sliding down to the end of his sweaty nose. He had stopped noticing the fantastic cloud shapes", "begin": 6389.609, "end": 6410.849, "localBegin": 611.48, "localEnd": 632.72}, {"id": "c005_f000072", "text": "now, and was thinking longingly of the train miles below, where you could buy ice-cold pumpkin juice from a trolley pushed by a plump witch. Why hadn't they been able to get onto platform nine and three-quarters?", "begin": 6410.849, "end": 6423.649, "localBegin": 632.72, "localEnd": 645.52}, {"id": "c005_f000073", "text": "'Can't be much further, can it?' croaked Ron, hours later still, as the sun started to sink into their floor of cloud, staining it a deep pink. 'Ready for another check on the train?'", "begin": 6423.649, "end": 6435.369, "localBegin": 645.52, "localEnd": 657.24}, {"id": "c005_f000074", "text": "It was still right below them, winding its way past a snowcapped mountain. It was much darker beneath the canopy of clouds.", "begin": 6435.369, "end": 6444.449, "localBegin": 657.24, "localEnd": 666.32}, {"id": "c005_f000075", "text": "Ron put his foot on the accelerator and drove them upwards again, but as he did so, the engine began to whine.", "begin": 6444.449, "end": 6450.609, "localBegin": 666.32, "localEnd": 672.48}, {"id": "c005_f000076", "text": "Harry and Ron exchanged nervous glances.", "begin": 6450.609, "end": 6454.289, "localBegin": 672.48, "localEnd": 676.16}, {"id": "c005_f000077", "text": "'It's probably just tired,' said Ron. 'It's never been this far before ...'", "begin": 6454.289, "end": 6459.209, "localBegin": 676.16, "localEnd": 681.08}, {"id": "c005_f000078", "text": "And they both pretended not to notice the whining growing louder and louder as the sky became steadily darker. Stars were blossoming in the blackness. Harry pulled his jumper back on, trying to ignore the way the windscreen wipers were now waving feebly, as though in protest.", "begin": 6459.209, "end": 6475.529, "localBegin": 681.08, "localEnd": 697.4}, {"id": "c005_f000079", "text": "'Not far,' said Ron, more to the car than to Harry, 'not far now,' and he patted the dashboard nervously.", "begin": 6475.529, "end": 6484.329, "localBegin": 697.4, "localEnd": 706.2}, {"id": "c005_f000080", "text": "When they flew back beneath the clouds a little while later, they had to squint through the darkness for a landmark they knew.", "begin": 6484.329, "end": 6491.169, "localBegin": 706.2, "localEnd": 713.04}, {"id": "c005_f000081", "text": "'There!' Harry shouted, making Ron and Hedwig jump. 'Straight ahead!'", "begin": 6491.169, "end": 6494.969, "localBegin": 713.04, "localEnd": 716.84}, {"id": "c005_f000082", "text": "Silhouetted on the dark horizon, high on the cliff over the lake, stood the many turrets and towers of Hogwarts castle.", "begin": 6494.969, "end": 6503.049, "localBegin": 716.84, "localEnd": 724.92}, {"id": "c005_f000083", "text": "But the car had begun to shudder and was losing speed.", "begin": 6503.049, "end": 6506.569, "localBegin": 724.92, "localEnd": 728.44}, {"id": "c005_f000084", "text": "'Come on,' Ron said cajolingly, giving the steering wheel a little shake, 'nearly there, come on -'", "begin": 6506.569, "end": 6515.849, "localBegin": 728.44, "localEnd": 737.72}, {"id": "c005_f000085", "text": "The engine groaned. Narrow jets of steam were issuing from under the bonnet. Harry found himself gripping the edges of his seat very hard as they flew towards the lake.", "begin": 6515.849, "end": 6525.969, "localBegin": 737.72, "localEnd": 747.84}, {"id": "c005_f000086", "text": "The car gave a nasty wobble. Glancing out of his window, Harry saw the smooth, black, glassy surface of the water, a mile below. Ron's knuckles were white on the steering wheel. The car wobbled again.", "begin": 6525.969, "end": 6537.449, "localBegin": 747.84, "localEnd": 759.32}, {"id": "c005_f000087", "text": "'Come on,' Ron muttered.", "begin": 6537.449, "end": 6540.409, "localBegin": 759.32, "localEnd": 762.28}, {"id": "c005_f000088", "text": "They were over the lake ... the castle was right ahead ... Ron", "begin": 6540.409, "end": 6543.649, "localBegin": 762.28, "localEnd": 765.52}, {"id": "c005_f000089", "text": "put his foot down.", "begin": 6543.649, "end": 6544.729, "localBegin": 765.52, "localEnd": 766.6}, {"id": "c005_f000090", "text": "There was a loud clunk, a splutter, and the engine died completely.", "begin": 6544.729, "end": 6552.089, "localBegin": 766.6, "localEnd": 773.96}, {"id": "c005_f000091", "text": "'Uh oh,' said Ron, into the silence.", "begin": 6552.089, "end": 6555.209, "localBegin": 773.96, "localEnd": 777.08}, {"id": "c005_f000092", "text": "The nose of the car dropped. They were falling, gathering speed, heading straight for the solid castle wall.", "begin": 6555.209, "end": 6562.809, "localBegin": 777.08, "localEnd": 784.68}, {"id": "c005_f000093", "text": "'Noooooo!' Ron yelled, swinging the steering wheel around; they missed the dark stone wall by inches as the car turned in a great arc, soaring over the dark greenhouses, then the vegetable patch and then out over the black lawns, losing height all the time.", "begin": 6562.809, "end": 6581.089, "localBegin": 784.68, "localEnd": 802.96}, {"id": "c005_f000094", "text": "Ron let go of the steering wheel completely and pulled his wand out of his back pocket.", "begin": 6581.089, "end": 6584.809, "localBegin": 802.96, "localEnd": 806.68}, {"id": "c005_f000095", "text": "'STOP! STOP!' he yelled, whacking the dashboard and the windscreen, but they were still plummeting, the ground flying up towards them ...", "begin": 6584.809, "end": 6592.929, "localBegin": 806.68, "localEnd": 814.8}, {"id": "c005_f000096", "text": "'MIND THAT TREE!' Harry bellowed, lunging for the steering wheel, but too late -", "begin": 6592.929, "end": 6597.449, "localBegin": 814.8, "localEnd": 819.32}, {"id": "c005_f000097", "text": "CRUNCH.", "begin": 6597.449, "end": 6598.449, "localBegin": 819.32, "localEnd": 820.32}, {"id": "c005_f000098", "text": "With an ear-splitting bang of metal on wood, they hit the thick tree trunk and dropped to the ground with a heavy jolt. Steam was billowing from under the crumpled bonnet; Hedwig was shrieking in terror, a golf-ball-sized lump was throbbing on Harry's head where he had hit the windscreen, and to his right, Ron let out a low, despairing groan.", "begin": 6598.449, "end": 6619.849, "localBegin": 820.32, "localEnd": 841.72}, {"id": "c005_f000099", "text": "'Are you OK?' Harry said urgently.", "begin": 6619.849, "end": 6622.729, "localBegin": 841.72, "localEnd": 844.6}, {"id": "c005_f000100", "text": "'My wand,' said Ron, in a shaky voice. 'Look at my wand.'", "begin": 6622.729, "end": 6626.769, "localBegin": 844.6, "localEnd": 848.64}, {"id": "c005_f000101", "text": "It had snapped, almost in two; the tip was dangling limply, held on by a few splinters.", "begin": 6626.769, "end": 6634.249, "localBegin": 848.64, "localEnd": 856.12}, {"id": "c005_f000102", "text": "Harry opened his mouth to say he was sure they'd be able to mend it up at the school, but he never even got started. At that very moment, something hit his side of the car with the force of a charging bull, sending him lurching sideways into Ron, just as an equally heavy blow hit the roof.", "begin": 6634.249, "end": 6650.529, "localBegin": 856.12, "localEnd": 872.4}, {"id": "c005_f000103", "text": "'What's happen-?'", "begin": 6650.529, "end": 6651.409, "localBegin": 872.4, "localEnd": 873.28}, {"id": "c005_f000104", "text": "Ron gasped, staring through the windscreen, and Harry looked around just in time to see a branch as thick as a python smash into it. The tree they had hit was attacking them. Its trunk was bent almost double, and its gnarled boughs were pummelling every inch of the car it could reach.", "begin": 6651.409, "end": 6668.009, "localBegin": 873.28, "localEnd": 889.88}, {"id": "c005_f000105", "text": "'Aaargh!' said Ron, as another twisted limb punched a large dent into his door; the windscreen was now trembling under a hail of blows from knuckle-like twigs and a branch as thick as a battering ram was pounding furiously on the roof, which seemed to be caving in -", "begin": 6668.009, "end": 6684.209, "localBegin": 889.88, "localEnd": 906.08}, {"id": "c005_f000106", "text": "'Run for it!' Ron shouted, throwing his full weight against his door, but next second he had been knocked backwards into Harry's lap by a vicious upper cut from another branch.", "begin": 6684.209, "end": 6694.889, "localBegin": 906.08, "localEnd": 916.76}, {"id": "c005_f000107", "text": "'We're done for!' he moaned, as the ceiling sagged, but suddenly the floor of the car was vibrating - the engine had re-started.", "begin": 6694.889, "end": 6703.249, "localBegin": 916.76, "localEnd": 925.12}, {"id": "c005_f000108", "text": "'Reverse!' Harry yelled, and the car shot backwards. The tree was still trying to hit them; they could hear its roots creaking as it almost ripped itself up, lashing out at them as they sped out of reach.", "begin": 6703.249, "end": 6714.609, "localBegin": 925.12, "localEnd": 936.48}, {"id": "c005_f000109", "text": "'That,' panted Ron, 'was close. Well done, car.'", "begin": 6714.609, "end": 6720.649, "localBegin": 936.48, "localEnd": 942.52}, {"id": "c005_f000110", "text": "The car, however, had reached the end of its tether. With two smart clunks, the doors flew open and Harry felt his seat tip sideways: next thing he knew he was sprawled on the damp ground. Loud thuds told him that the car was ejecting their luggage from the boot. Hedwig's cage flew through the air and burst open; she rose out of it with a loud, angry screech and sped off towards the castle without a backwards look. Then, dented, scratched and steaming, the car rumbled off into the darkness, its rear lights blazing angrily.", "begin": 6720.649, "end": 6754.649, "localBegin": 942.52, "localEnd": 976.52}, {"id": "c005_f000111", "text": "'Come back!' Ron yelled after it, brandishing his broken wand. 'Dad'll kill me!'", "begin": 6754.649, "end": 6761.329, "localBegin": 976.52, "localEnd": 983.2}, {"id": "c005_f000112", "text": "But the car disappeared from view with one last snort from its exhaust.", "begin": 6761.329, "end": 6766.489, "localBegin": 983.2, "localEnd": 988.36}, {"id": "c005_f000113", "text": "'Can you believe our luck?' said Ron miserably, bending down to pick up Scabbers the rat. 'Of all the trees we could've hit, we had to get one that hits back.'", "begin": 6766.489, "end": 6777.729, "localBegin": 988.36, "localEnd": 999.6}, {"id": "c005_f000114", "text": "He glanced over his shoulder at the ancient tree, which was still flailing its branches threateningly.", "begin": 6777.729, "end": 6783.889, "localBegin": 999.6, "localEnd": 1005.76}, {"id": "c005_f000115", "text": "'Come on,' said Harry wearily, 'we'd better get up to the school ...'", "begin": 6783.889, "end": 6791.329, "localBegin": 1005.76, "localEnd": 1013.2}, {"id": "c005_f000116", "text": "It wasn't at all the triumphant arrival they had pictured. Stiff, cold and bruised, they seized the ends of their trunks and began dragging them up the grassy slope, towards the great oak front doors.", "begin": 6791.329, "end": 6802.809, "localBegin": 1013.2, "localEnd": 1024.68}, {"id": "c005_f000117", "text": "'I think the feast's already started,' said Ron, dropping his trunk at the foot of the front steps and crossing quietly to look through", "begin": 6802.809, "end": 6810.369, "localBegin": 1024.68, "localEnd": 1032.24}, {"id": "c005_f000118", "text": "a brightly lit window. 'Hey, Harry, come and look - it's the Sorting!'", "begin": 6810.369, "end": 6815.089, "localBegin": 1032.24, "localEnd": 1036.96}, {"id": "c005_f000119", "text": "Harry hurried over and, together, he and Ron peered in at the Great Hall.", "begin": 6815.089, "end": 6819.769, "localBegin": 1036.96, "localEnd": 1041.64}, {"id": "c005_f000120", "text": "Innumerable candles were hovering in mid-air over four long, crowded tables, making the golden plates and goblets sparkle. Overhead, the bewitched ceiling which always mirrored the sky outside, sparkled with stars.", "begin": 6819.769, "end": 6834.369, "localBegin": 1041.64, "localEnd": 1056.24}, {"id": "c005_f000121", "text": "Through the forest of pointed black Hogwarts hats, Harry saw a long line of scared-looking first-years filing into the Hall. Ginny was amongst them, easily visible because of her vivid Weasley hair. Meanwhile, Professor McGonagall, a bespectacled witch with her hair in a tight bun, was placing the famous Hogwarts Sorting Hat on a stool before the newcomers.", "begin": 6834.369, "end": 6857.609, "localBegin": 1056.24, "localEnd": 1079.48}, {"id": "c005_f000122", "text": "Every year, this aged old hat, patched, frayed and dirty, sorted new students into the four Hogwarts houses (Gryffindor, Hufflepuff, Ravenclaw and Slytherin). Harry well remembered putting it on, exactly one year ago, and waiting, petrified, for its decision as it muttered aloud in his ear. For a few horrible seconds he had feared that the hat was going to put him in Slytherin, the house which had turned out more dark witches and wizards than any other - but he had ended up in Gryffindor, along with Ron, Hermione and the rest of the Weasleys. Last term, Harry and Ron had helped Gryffindor win the House Championship, beating Slytherin for the first time in seven years.", "begin": 6857.609, "end": 6901.449, "localBegin": 1079.48, "localEnd": 1123.32}, {"id": "c005_f000123", "text": "A very small, mousey-haired boy had been called forward to place the hat on his head. Harry's eyes wandered past him to where Professor Dumbledore, the Headmaster, sat watching the Sorting from the staff table, his long silver beard and half-moon glasses shining brightly in the candlelight. Several seats along, Harry saw Gilderoy Lockhart, dressed in robes of aquamarine. And there at the end was Hagrid, huge and hairy, drinking deeply from his goblet.", "begin": 6901.449, "end": 6930.089, "localBegin": 1123.32, "localEnd": 1151.96}, {"id": "c005_f000124", "text": "'Hang on ...' Harry muttered to Ron. 'There's an empty chair at the staff table ... Where's Snape?'", "begin": 6930.089, "end": 6937.689, "localBegin": 1151.96, "localEnd": 1159.56}, {"id": "c005_f000125", "text": "Professor Severus Snape was Harry's least favourite teacher. Harry also happened to be Snape's least favourite student. Cruel, sarcastic and disliked by everybody except the students from his own house (Slytherin), Snape taught Potions.", "begin": 6937.689, "end": 6954.889, "localBegin": 1159.56, "localEnd": 1176.76}, {"id": "c005_f000126", "text": "'Maybe he's ill!' said Ron hopefully.", "begin": 6954.889, "end": 6957.889, "localBegin": 1176.76, "localEnd": 1179.76}, {"id": "c005_f000127", "text": "'Maybe he's left,' said Harry, 'because he missed out on the Defence Against the Dark Arts job again!'", "begin": 6957.889, "end": 6964.009, "localBegin": 1179.76, "localEnd": 1185.88}, {"id": "c005_f000128", "text": "'Or he might have been sacked!' said Ron enthusiastically. 'I mean, everyone hates him -'", "begin": 6964.009, "end": 6969.769, "localBegin": 1185.88, "localEnd": 1191.64}, {"id": "c005_f000129", "text": "'Or maybe,' said a very cold voice right behind them, 'he's waiting to hear why you two didn't arrive on the school train.'", "begin": 6969.769, "end": 6977.569, "localBegin": 1191.64, "localEnd": 1199.44}, {"id": "c005_f000130", "text": "Harry spun around. There, his black robes rippling in a cold breeze, stood Severus Snape. He was a thin man with sallow skin, a hooked nose and greasy, shoulder-length black hair, and at this moment, he was smiling in a way that told Harry he and Ron were in very deep trouble.", "begin": 6977.569, "end": 6996.969, "localBegin": 1199.44, "localEnd": 1218.84}, {"id": "c005_f000131", "text": "'Follow me,' said Snape.", "begin": 6996.969, "end": 6999.889, "localBegin": 1218.84, "localEnd": 1221.76}, {"id": "c005_f000132", "text": "Not daring even to look at each other, Harry and Ron followed Snape up the steps into the vast, echoing Entrance Hall, which was lit with flaming torches. A delicious smell of food was wafting from the Great Hall, but Snape led them away from the warmth and light, down a narrow stone staircase that led into the dungeons.", "begin": 6999.889, "end": 7020.249, "localBegin": 1221.76, "localEnd": 1242.12}, {"id": "c005_f000133", "text": "'In!' he said, opening a door halfway down the cold passageway and pointing.", "begin": 7020.249, "end": 7026.689, "localBegin": 1242.12, "localEnd": 1248.56}, {"id": "c005_f000134", "text": "They entered Snape's office, shivering. The shadowy walls were lined with shelves of large glass jars, in which floated all manner of revolting things Harry didn't really want to know the name of at the moment. The fireplace was dark and empty. Snape closed the door and turned to look at them.", "begin": 7026.689, "end": 7045.649, "localBegin": 1248.56, "localEnd": 1267.52}, {"id": "c005_f000135", "text": "'So,' he said softly, 'the train isn't good enough for the famous Harry Potter and his faithful sidekick Weasley. Wanted to arrive with a bang, did we, boys?'", "begin": 7045.649, "end": 7059.209, "localBegin": 1267.52, "localEnd": 1281.08}, {"id": "c005_f000136", "text": "'No, sir, it was the barrier at King's Cross, it -'", "begin": 7059.209, "end": 7062.369, "localBegin": 1281.08, "localEnd": 1284.24}, {"id": "c005_f000137", "text": "'Silence!' said Snape coldly. 'What have you done with the car?'", "begin": 7062.369, "end": 7068.409, "localBegin": 1284.24, "localEnd": 1290.28}, {"id": "c005_f000138", "text": "Ron gulped. This wasn't the first time Snape had given Harry the impression of being able to read minds. But a moment later, he understood, as Snape unrolled today's issue of the Evening Prophet.", "begin": 7068.409, "end": 7081.249, "localBegin": 1290.28, "localEnd": 1303.12}, {"id": "c005_f000139", "text": "'You were seen,' he hissed, showing them the headline: FLYING FORD ANGLIA MYSTIFIES MUGGLES. He began to read aloud. ' \"Two Muggles in London, convinced they saw an old car flying over the Post Office tower ... at noon in Norfolk, Mrs Hetty Bayliss, while hanging out her washing ... Mr Angus Fleet, of Peebles, reported to police\" ... six or seven Muggles in all. I", "begin": 7081.249, "end": 7108.169, "localBegin": 1303.12, "localEnd": 1330.04}, {"id": "c005_f000140", "text": "believe your father works in the Misuse of Muggle Artefacts Office?' he said, looking up at Ron and smiling still more nastily. 'Dear, dear ... his own son ...'", "begin": 7108.169, "end": 7122.169, "localBegin": 1330.04, "localEnd": 1344.04}, {"id": "c005_f000141", "text": "Harry felt as though he'd just been walloped in the stomach by one of the mad tree's larger branches. If anyone found out Mr Weasley had bewitched the car ... he hadn't thought of that ...", "begin": 7122.169, "end": 7133.849, "localBegin": 1344.04, "localEnd": 1355.72}, {"id": "c005_f000142", "text": "'I noticed, in my search of the park, that considerable damage seems to have been done to a very valuable Whomping Willow,' Snape went on.", "begin": 7133.849, "end": 7145.369, "localBegin": 1355.72, "localEnd": 1367.24}, {"id": "c005_f000143", "text": "'That tree did more damage to us than we -' Ron blurted out.", "begin": 7145.369, "end": 7149.089, "localBegin": 1367.24, "localEnd": 1370.96}, {"id": "c005_f000144", "text": "'Silence!' snapped Snape again. 'Most unfortunately, you are not in my house and the decision to expel you does not rest with me. I shall go and fetch the people who do have that happy power. You will wait here.'", "begin": 7149.089, "end": 7165.569, "localBegin": 1370.96, "localEnd": 1387.44}, {"id": "c005_f000145", "text": "Harry and Ron stared at each other, white-faced. Harry didn't feel hungry any more. He now felt extremely sick. He tried not to look at a large, slimy something suspended in green liquid on a shelf behind Snape's desk. If Snape had gone to fetch Professor McGonagall, head of Gryffindor house, they were hardly any better off. She might be fairer than Snape, but she was still extremely strict.", "begin": 7165.569, "end": 7190.649, "localBegin": 1387.44, "localEnd": 1412.52}, {"id": "c005_f000146", "text": "Ten minutes later, Snape returned, and sure enough it was Professor McGonagall who accompanied him. Harry had seen Professor McGonagall angry on several occasions, but either he had forgotten just how thin her mouth could go, or he had never seen her this angry before. She raised her wand the moment she entered. Harry and Ron both flinched, but she merely pointed it at the empty fireplace, where flames suddenly erupted.", "begin": 7190.649, "end": 7218.329, "localBegin": 1412.52, "localEnd": 1440.2}, {"id": "c005_f000147", "text": "'Sit,' she said, and they both backed into chairs by the fire.", "begin": 7218.329, "end": 7223.729, "localBegin": 1440.2, "localEnd": 1445.6}, {"id": "c005_f000148", "text": "'Explain,' she said, her glasses glinting ominously.", "begin": 7223.729, "end": 7228.169, "localBegin": 1445.6, "localEnd": 1450.04}, {"id": "c005_f000149", "text": "Ron launched into the story, starting with the barrier at the station refusing to let them through.", "begin": 7228.169, "end": 7234.249, "localBegin": 1450.04, "localEnd": 1456.12}, {"id": "c005_f000150", "text": "'... so we had no choice, Professor, we couldn't get on the train.'", "begin": 7234.249, "end": 7238.289, "localBegin": 1456.12, "localEnd": 1460.16}, {"id": "c005_f000151", "text": "'Why didn't you send us a letter by owl? I believe you have an owl?' Professor McGonagall said coldly to Harry.", "begin": 7238.289, "end": 7245.169, "localBegin": 1460.16, "localEnd": 1467.04}, {"id": "c005_f000152", "text": "Harry gaped at her. Now she said it, that seemed the obvious thing to have done.", "begin": 7245.169, "end": 7250.849, "localBegin": 1467.04, "localEnd": 1472.72}, {"id": "c005_f000153", "text": "'I - I didn't think -'", "begin": 7250.849, "end": 7253.529, "localBegin": 1472.72, "localEnd": 1475.4}, {"id": "c005_f000154", "text": "'That,' said Professor McGonagall, 'is obvious.'", "begin": 7253.529, "end": 7257.249, "localBegin": 1475.4, "localEnd": 1479.12}, {"id": "c005_f000155", "text": "There was a knock on the office door and Snape, now looking", "begin": 7257.249, "end": 7261.369, "localBegin": 1479.12, "localEnd": 1483.24}, {"id": "c005_f000156", "text": "happier than ever, opened it. There stood the Headmaster, Professor Dumbledore.", "begin": 7261.369, "end": 7265.409, "localBegin": 1483.24, "localEnd": 1487.28}, {"id": "c005_f000157", "text": "Harry's whole body went numb. Dumbledore was looking unusually grave. He stared down his very crooked nose at them and Harry suddenly found himself wishing he and Ron were still being beaten up by the Whomping Willow.", "begin": 7265.409, "end": 7280.049, "localBegin": 1487.28, "localEnd": 1501.92}, {"id": "c005_f000158", "text": "There was a long silence. Then Dumbledore said, 'Please explain why you did this.'", "begin": 7280.049, "end": 7287.969, "localBegin": 1501.92, "localEnd": 1509.84}, {"id": "c005_f000159", "text": "It would have been better if he had shouted. Harry hated the disappointment in his voice. For some reason, he was unable to look Dumbledore in the eyes, and spoke instead to his knees. He told Dumbledore everything except that Mr Weasley owned the bewitched car, making it sound as though he and Ron had happened to find a flying car parked outside the station. He knew Dumbledore would see through this at once, but Dumbledore asked no questions about the car. When Harry had finished, he merely continued to peer at them through his spectacles.", "begin": 7287.969, "end": 7322.929, "localBegin": 1509.84, "localEnd": 1544.8}, {"id": "c005_f000160", "text": "'We'll go and get our stuff,' said Ron in a hopeless sort of voice.", "begin": 7322.929, "end": 7329.249, "localBegin": 1544.8, "localEnd": 1551.12}, {"id": "c005_f000161", "text": "'What are you talking about, Weasley?' barked Professor McGonagall.", "begin": 7329.249, "end": 7333.769, "localBegin": 1551.12, "localEnd": 1555.64}, {"id": "c005_f000162", "text": "'Well, you're expelling us, aren't you?' said Ron.", "begin": 7333.769, "end": 7337.449, "localBegin": 1555.64, "localEnd": 1559.32}, {"id": "c005_f000163", "text": "Harry looked quickly at Dumbledore.", "begin": 7337.449, "end": 7340.249, "localBegin": 1559.32, "localEnd": 1562.12}, {"id": "c005_f000164", "text": "'Not today, Mr Weasley,' said Dumbledore. 'But I must impress upon both of you the seriousness of what you have done. I will be writing to both your families tonight. I must also warn you that if you do anything like this again, I will have no choice but to expel you.'", "begin": 7340.249, "end": 7360.649, "localBegin": 1562.12, "localEnd": 1582.52}, {"id": "c005_f000165", "text": "Snape looked as though Christmas had been cancelled. He cleared his throat and said, 'Professor Dumbledore, these boys have flouted the Decree for the Restriction of Underage Wizardry, caused serious damage to an old and valuable tree ... surely acts of this nature ...'", "begin": 7360.649, "end": 7380.209, "localBegin": 1582.52, "localEnd": 1602.08}, {"id": "c005_f000166", "text": "'It will be for Professor McGonagall to decide on these boys' punishments, Severus,' said Dumbledore calmly. 'They are in her house and are therefore her responsibility.' He turned to Professor McGonagall. 'I must go back to the feast, Minerva, I've got to give out a few notices. Come, Severus, there's a delicious-looking custard tart I want to sample.'", "begin": 7380.209, "end": 7405.529, "localBegin": 1602.08, "localEnd": 1627.4}, {"id": "c005_f000167", "text": "Snape shot a look of pure venom at Harry and Ron as he allowed himself to be swept out of his office, leaving them alone", "begin": 7405.529, "end": 7413.569, "localBegin": 1627.4, "localEnd": 1635.44}, {"id": "c005_f000168", "text": "with Professor McGonagall, who was still eyeing them like a wrathful eagle.", "begin": 7413.569, "end": 7417.649, "localBegin": 1635.44, "localEnd": 1639.52}, {"id": "c005_f000169", "text": "'You'd better get along to the hospital wing, Weasley, you're bleeding.'", "begin": 7417.649, "end": 7422.249, "localBegin": 1639.52, "localEnd": 1644.12}, {"id": "c005_f000170", "text": "'Not much,' said Ron, hastily wiping the cut over his eye with his sleeve. 'Professor, I wanted to watch my sister being Sorted -'", "begin": 7422.249, "end": 7430.969, "localBegin": 1644.12, "localEnd": 1652.84}, {"id": "c005_f000171", "text": "'The Sorting Ceremony is over,' said Professor McGonagall. 'Your sister is also in Gryffindor.'", "begin": 7430.969, "end": 7437.729, "localBegin": 1652.84, "localEnd": 1659.6}, {"id": "c005_f000172", "text": "'Oh, good,' said Ron.", "begin": 7437.729, "end": 7440.449, "localBegin": 1659.6, "localEnd": 1662.32}, {"id": "c005_f000173", "text": "'And speaking of Gryffindor -' Professor McGonagall said sharply, but Harry cut in: 'Professor, when we took the car, term hadn't started, so - so Gryffindor shouldn't really have points taken from it, should it?' he finished, watching her anxiously.", "begin": 7440.449, "end": 7457.129, "localBegin": 1662.32, "localEnd": 1679.0}, {"id": "c005_f000174", "text": "Professor McGonagall gave him a piercing look, but he was sure she had almost smiled. Her mouth looked less thin, anyway.", "begin": 7457.129, "end": 7465.129, "localBegin": 1679.0, "localEnd": 1687.0}, {"id": "c005_f000175", "text": "'I will not take any points from Gryffindor,' she said, and Harry's heart lightened considerably. 'But you will both get a detention.'", "begin": 7465.129, "end": 7474.569, "localBegin": 1687.0, "localEnd": 1696.44}, {"id": "c005_f000176", "text": "It was better than Harry had expected. As for Dumbledore's writing to the Dursleys, that was nothing. Harry knew perfectly well they'd just be disappointed that the Whomping Willow hadn't squashed him flat.", "begin": 7474.569, "end": 7486.769, "localBegin": 1696.44, "localEnd": 1708.64}, {"id": "c005_f000177", "text": "Professor McGonagall raised her wand again and pointed it at Snape's desk. A large plate of sandwiches, two silver goblets and a jug of iced pumpkin juice appeared with a pop.", "begin": 7486.769, "end": 7498.569, "localBegin": 1708.64, "localEnd": 1720.44}, {"id": "c005_f000178", "text": "'You will eat in here and then go straight up to your dormitory,' she said. 'I must also return to the feast.'", "begin": 7498.569, "end": 7506.169, "localBegin": 1720.44, "localEnd": 1728.04}, {"id": "c005_f000179", "text": "When the door had closed behind her, Ron let out a long, low whistle.", "begin": 7506.169, "end": 7510.889, "localBegin": 1728.04, "localEnd": 1732.76}, {"id": "c005_f000180", "text": "'I thought we'd had it,' he said, grabbing a sandwich.", "begin": 7510.889, "end": 7515.289, "localBegin": 1732.76, "localEnd": 1737.16}, {"id": "c005_f000181", "text": "'So did I,' said Harry, taking one too.", "begin": 7515.289, "end": 7518.489, "localBegin": 1737.16, "localEnd": 1740.36}, {"id": "c005_f000182", "text": "'Can you believe our luck, though?' said Ron thickly through a mouthful of chicken and ham. 'Fred and George must've flown that car five or six times and no Muggle ever saw them.' He swallowed and took another huge bite. 'Why couldn't we get through the barrier?'", "begin": 7518.489, "end": 7534.329, "localBegin": 1740.36, "localEnd": 1756.2}, {"id": "c005_f000183", "text": "Harry shrugged. 'We'll have to watch our step from now on, though,' he said, taking a grateful swig of pumpkin juice. 'Wish we could've gone up to the feast ...'", "begin": 7534.329, "end": 7544.169, "localBegin": 1756.2, "localEnd": 1766.04}, {"id": "c005_f000184", "text": "'She didn't want us showing off,' said Ron sagely. 'Doesn't want", "begin": 7544.169, "end": 7548.649, "localBegin": 1766.04, "localEnd": 1770.52}, {"id": "c005_f000185", "text": "people to think it's clever, arriving by flying car.'", "begin": 7548.649, "end": 7551.729, "localBegin": 1770.52, "localEnd": 1773.6}, {"id": "c005_f000186", "text": "When they had eaten as many sandwiches as they could (the plate kept re-filling itself) they rose and left the office, treading the familiar path to Gryffindor Tower. The castle was quiet; it seemed that the feast was over. They walked past muttering portraits and creaking suits of armour, and climbed narrow flights of stone stairs, until at last they reached the passage where the secret entrance to Gryffindor Tower was hidden, behind an oil painting of a very fat woman in a pink silk dress.", "begin": 7551.729, "end": 7581.089, "localBegin": 1773.6, "localEnd": 1802.96}, {"id": "c005_f000187", "text": "'Password?' she said, as they approached.", "begin": 7581.089, "end": 7584.729, "localBegin": 1802.96, "localEnd": 1806.6}, {"id": "c005_f000188", "text": "'Er -' said Harry.", "begin": 7584.729, "end": 7587.089, "localBegin": 1806.6, "localEnd": 1808.96}, {"id": "c005_f000189", "text": "They didn't know the new year's password, not having met a Gryffindor Prefect yet, but help came almost immediately; they heard hurrying feet behind them and turned to see Hermione dashing towards them.", "begin": 7587.089, "end": 7599.809, "localBegin": 1808.96, "localEnd": 1821.68}, {"id": "c005_f000190", "text": "'There you are! Where have you been? The most ridiculous rumours - someone said you'd been expelled for crashing a flying car.'", "begin": 7599.809, "end": 7608.129, "localBegin": 1821.68, "localEnd": 1830.0}, {"id": "c005_f000191", "text": "'Well, we haven't been expelled,' Harry assured her.", "begin": 7608.129, "end": 7610.769, "localBegin": 1830.0, "localEnd": 1832.64}, {"id": "c005_f000192", "text": "'You're not telling me you did fly here?' said Hermione, sounding almost as severe as Professor McGonagall.", "begin": 7610.769, "end": 7617.089, "localBegin": 1832.64, "localEnd": 1838.96}, {"id": "c005_f000193", "text": "'Skip the lecture,' said Ron impatiently, 'and tell us the new password.'", "begin": 7617.089, "end": 7621.329, "localBegin": 1838.96, "localEnd": 1843.2}, {"id": "c005_f000194", "text": "'It's \"wattlebird\",' said Hermione impatiently, 'but that's not the point -'", "begin": 7621.329, "end": 7625.689, "localBegin": 1843.2, "localEnd": 1847.56}, {"id": "c005_f000195", "text": "Her words were cut short, however, as the portrait of the fat lady swung open and there was a sudden storm of clapping. It looked as though the whole of Gryffindor house was still awake, packed into the circular common room, standing on the lop-sided tables and squashy armchairs, waiting for them to arrive. Arms reached through the portrait hole to pull Harry and Ron inside, leaving Hermione to scramble in after them.", "begin": 7625.689, "end": 7650.289, "localBegin": 1847.56, "localEnd": 1872.16}, {"id": "c005_f000196", "text": "'Brilliant!' yelled Lee Jordan. 'Inspired! What an entrance! Flying a car right into the Whomping Willow, people'll be talking about that one for years!'", "begin": 7650.289, "end": 7659.649, "localBegin": 1872.16, "localEnd": 1881.52}, {"id": "c005_f000197", "text": "'Good on you,' said a fifth-year Harry had never spoken to; someone was patting him on the back as though he'd just won a marathon. Fred and George pushed their way to the front of the crowd and said together, 'Why couldn't you've called us back, eh?' Ron was scarlet in the face, grinning embarrassedly, but Harry", "begin": 7659.649, "end": 7678.049, "localBegin": 1881.52, "localEnd": 1899.92}, {"id": "c005_f000198", "text": "could see one person who didn't look happy at all. Percy was visible over the heads of some excited first-years, and he seemed to be trying to get near enough to start telling them off. Harry nudged Ron in the ribs and nodded in Percy's direction. Ron got the point at once.", "begin": 7678.049, "end": 7693.809, "localBegin": 1899.92, "localEnd": 1915.68}, {"id": "c005_f000199", "text": "'Got to get upstairs - bit tired,' he said, and the two of them started pushing their way towards the door on the other side of the room, which led to a spiral staircase and the dormitories.", "begin": 7693.809, "end": 7705.649, "localBegin": 1915.68, "localEnd": 1927.52}, {"id": "c005_f000200", "text": "'Night,' Harry called back to Hermione, who was wearing a scowl just like Percy's.", "begin": 7705.649, "end": 7711.209, "localBegin": 1927.52, "localEnd": 1933.08}, {"id": "c005_f000201", "text": "They managed to get to the other side of the common room, still having their backs slapped, and gained the peace of the staircase. They hurried up it, right to the top, and at last reached the door of their old dormitory, which now had a sign on it saying 'second-years'. They entered the familiar, circular room, with its five four-posters hung with red velvet and its high, narrow windows. Their trunks had been brought up for them and placed at the ends of their beds.", "begin": 7711.209, "end": 7738.209, "localBegin": 1933.08, "localEnd": 1960.08}, {"id": "c005_f000202", "text": "Ron grinned guiltily at Harry.", "begin": 7738.209, "end": 7741.209, "localBegin": 1960.08, "localEnd": 1963.08}, {"id": "c005_f000203", "text": "'I know I shouldn't've enjoyed that or anything, but -'", "begin": 7741.209, "end": 7744.849, "localBegin": 1963.08, "localEnd": 1966.72}, {"id": "c005_f000204", "text": "The dormitory door flew open and in came the other secondyear Gryffindor boys, Seamus Finnigan, Dean Thomas and Neville Longbottom.", "begin": 7744.849, "end": 7753.129, "localBegin": 1966.72, "localEnd": 1975.0}, {"id": "c005_f000205", "text": "'Unbelievable!' beamed Seamus.", "begin": 7753.129, "end": 7755.889, "localBegin": 1975.0, "localEnd": 1977.76}, {"id": "c005_f000206", "text": "'Cool,' said Dean.", "begin": 7755.889, "end": 7757.489, "localBegin": 1977.76, "localEnd": 1979.36}, {"id": "c005_f000207", "text": "'Amazing,' said Neville, awestruck.", "begin": 7757.489, "end": 7760.369, "localBegin": 1979.36, "localEnd": 1982.24}, {"id": "c005_f000208", "text": "Harry couldn't help it. He grinned, too.", "begin": 7760.369, "end": 7765.129, "localBegin": 1982.24, "localEnd": 1987.0}]}, {"kind": "chapter", "number": 6, "title": "Gilderoy Lockhart", "audio": "audio/chapter_006.mp3", "start": 7765.129, "end": 9505.567, "duration": 1740.438, "paragraphs": [{"id": "c006_f000001", "text": "Chapter Six. Gilderoy Lockhart.", "begin": 7765.129, "end": 7770.249, "localBegin": 0.0, "localEnd": 5.12}, {"id": "c006_f000002", "text": "The next day, however, Harry barely grinned once. Things started to go downhill from breakfast in the Great Hall. The four long house tables were laden with tureens of porridge, plates of kippers, mountains of toast and dishes of eggs and bacon, beneath the enchanted ceiling (today, a dull, cloudy grey). Harry and Ron sat down at the Gryffindor table next to Hermione, who had her copy of Voyages with Vampires propped open against a milk jug. There was a slight stiffness in the way she said 'Morning' which told Harry that she was still disapproving of the way they had arrived. Neville Longbottom, on the other hand, greeted them cheerfully. Neville was a round-faced and accident-prone boy with the worst memory of anyone Harry had ever met.", "begin": 7770.249, "end": 7814.529, "localBegin": 5.12, "localEnd": 49.4}, {"id": "c006_f000003", "text": "'Post's due any minute - I think Gran's sending on a few things I forgot.'", "begin": 7814.529, "end": 7819.729, "localBegin": 49.4, "localEnd": 54.6}, {"id": "c006_f000004", "text": "Harry had only just started his porridge when, sure enough, there was a rushing sound overhead and a hundred or so owls streamed in, circling the Hall and dropping letters and packages into the chattering crowd. A big, lumpy parcel bounced off Neville's head, and a second later, something large and grey fell into Hermione's jug, spraying them all with milk and feathers.", "begin": 7819.729, "end": 7842.329, "localBegin": 54.6, "localEnd": 77.2}, {"id": "c006_f000005", "text": "'Errol!' said Ron, pulling the bedraggled owl out by the feet. Errol slumped, unconscious, onto the table, his legs in the air and a damp red envelope in his beak.", "begin": 7842.329, "end": 7853.689, "localBegin": 77.2, "localEnd": 88.56}, {"id": "c006_f000006", "text": "'Oh no -' Ron gasped.", "begin": 7853.689, "end": 7856.089, "localBegin": 88.56, "localEnd": 90.96}, {"id": "c006_f000007", "text": "'It's all right, he's still alive,' said Hermione, prodding Errol gently with the tip of her finger.", "begin": 7856.089, "end": 7862.049, "localBegin": 90.96, "localEnd": 96.92}, {"id": "c006_f000008", "text": "'It's not that - it's that.'", "begin": 7862.049, "end": 7865.489, "localBegin": 96.92, "localEnd": 100.36}, {"id": "c006_f000009", "text": "Ron was pointing at the red envelope. It looked quite ordinary to Harry, but Ron and Neville were both looking at it as though they expected it to explode.", "begin": 7865.489, "end": 7874.609, "localBegin": 100.36, "localEnd": 109.48}, {"id": "c006_f000010", "text": "'What's the matter?' said Harry.", "begin": 7874.609, "end": 7876.649, "localBegin": 109.48, "localEnd": 111.52}, {"id": "c006_f000011", "text": "'She's - she's sent me a Howler,' said Ron faintly.", "begin": 7876.649, "end": 7882.209, "localBegin": 111.52, "localEnd": 117.08}, {"id": "c006_f000012", "text": "'You'd better open it, Ron,' said Neville, in a timid whisper. 'It'll be worse if you don't. My Gran sent me one once, and I ignored it and -' he gulped, 'it was horrible.'", "begin": 7882.209, "end": 7894.009, "localBegin": 117.08, "localEnd": 128.88}, {"id": "c006_f000013", "text": "Harry looked from their petrified faces to the red envelope.", "begin": 7894.009, "end": 7897.609, "localBegin": 128.88, "localEnd": 132.48}, {"id": "c006_f000014", "text": "'What's a Howler?' he said.", "begin": 7897.609, "end": 7899.969, "localBegin": 132.48, "localEnd": 134.84}, {"id": "c006_f000015", "text": "But Ron's whole attention was fixed on the letter, which had begun to smoke at the corners.", "begin": 7899.969, "end": 7904.889, "localBegin": 134.84, "localEnd": 139.76}, {"id": "c006_f000016", "text": "'Open it,' Neville urged. 'It'll all be over in a few minutes ...'", "begin": 7904.889, "end": 7910.169, "localBegin": 139.76, "localEnd": 145.04}, {"id": "c006_f000017", "text": "Ron stretched out a shaking hand, eased the envelope from Errol's beak and slit it open. Neville stuffed his fingers in his ears. A split second later, Harry knew why. He thought for a moment it had exploded; a roar of sound filled the huge Hall, shaking dust from the ceiling.", "begin": 7910.169, "end": 7929.969, "localBegin": 145.04, "localEnd": 164.84}, {"id": "c006_f000018", "text": "'... STEALING THE CAR, I WOULDN'T HAVE BEEN SUR- PRISED IF THEYD EXPELLED YOU, YOU WAIT TILL I GET HOLD OF YOU, I DON'T SUPPOSE YOU STOPPED TO THINK WHAT YOUR FATHER AND I WENT THROUGH WHEN WE SAW IT HAD GONE ...'", "begin": 7929.969, "end": 7940.449, "localBegin": 164.84, "localEnd": 175.32}, {"id": "c006_f000019", "text": "Mrs Weasley's yells, a hundred times louder than usual, made the plates and spoons rattle on the table, and echoed deafeningly off the stone walls. People throughout the Hall were swivelling around to see who had received the Howler and Ron sank so low in his chair that only his crimson forehead could be seen.", "begin": 7940.449, "end": 7959.169, "localBegin": 175.32, "localEnd": 194.04}, {"id": "c006_f000020", "text": "'... LETTER FROM DUMBLEDORE LAST NIGHT, I THOUGHT YOUR FATHER WOULD DIE OF SHAME, WE DIDN'T BRING YOU UP TO BEHAVE LIKE THIS, YOU AND HARRY COULD BOTH HAVE DIED ...'", "begin": 7959.169, "end": 7967.889, "localBegin": 194.04, "localEnd": 202.76}, {"id": "c006_f000021", "text": "Harry had been wondering when his name was going to crop up. He tried very hard to look as though he couldn't hear the voice that was making his eardrums throb.", "begin": 7967.889, "end": 7975.889, "localBegin": 202.76, "localEnd": 210.76}, {"id": "c006_f000022", "text": "'... ABSOLUTELY DISGUSTED, YOUR FATHER'S FACING AN INQUIRY AT WORK, IT'S ENTIRELY YOUR FAULT AND IF YOU PUT ANOTHER TOE OUT OF LINE WE'LL BRING YOU STRAIGHT BACK HOME.'", "begin": 7975.889, "end": 7986.489, "localBegin": 210.76, "localEnd": 221.36}, {"id": "c006_f000023", "text": "A ringing silence fell. The red envelope, which had dropped from Ron's hand, burst into flames and curled into ashes. Harry and Ron sat stunned, as though a tidal wave had just passed over them. A few people laughed and gradually, a babble of talk broke", "begin": 7986.489, "end": 8003.209, "localBegin": 221.36, "localEnd": 238.08}, {"id": "c006_f000024", "text": "out again.", "begin": 8003.209, "end": 8004.769, "localBegin": 238.08, "localEnd": 239.64}, {"id": "c006_f000025", "text": "Hermione closed Voyages with Vampires and looked down at the top of Ron's head.", "begin": 8004.769, "end": 8009.889, "localBegin": 239.64, "localEnd": 244.76}, {"id": "c006_f000026", "text": "'Well, I don't know what you expected, Ron, but you -'", "begin": 8009.889, "end": 8013.889, "localBegin": 244.76, "localEnd": 248.76}, {"id": "c006_f000027", "text": "'Don't tell me I deserved it,' snapped Ron.", "begin": 8013.889, "end": 8017.609, "localBegin": 248.76, "localEnd": 252.48}, {"id": "c006_f000028", "text": "Harry pushed his porridge away. His insides were burning with guilt. Mr Weasley was facing an inquiry at work. After all Mr and Mrs Weasley had done for him over the summer ...", "begin": 8017.609, "end": 8028.489, "localBegin": 252.48, "localEnd": 263.36}, {"id": "c006_f000029", "text": "But he had no time to dwell on this; Professor McGonagall was moving along the Gryffindor table, handing out timetables. Harry took his, and saw that they had double Herbology with the Hufflepuffs first.", "begin": 8028.489, "end": 8041.129, "localBegin": 263.36, "localEnd": 276.0}, {"id": "c006_f000030", "text": "Harry, Ron and Hermione left the castle together, crossed the vegetable patch and made for the greenhouses, where the magical plants were kept. At least the Howler had done one good thing: Hermione seemed to think they had now been punished enough and was being perfectly friendly again.", "begin": 8041.129, "end": 8057.449, "localBegin": 276.0, "localEnd": 292.32}, {"id": "c006_f000031", "text": "As they neared the greenhouses they saw the rest of the class standing outside, waiting for Professor Sprout. Harry, Ron and Hermione had only just joined them when she came striding into view across the lawn, accompanied by Gilderoy Lockhart. Professor Sprout's arms were full of bandages, and with another twinge of guilt, Harry spotted the Whomping Willow in the distance, several of its branches now in slings.", "begin": 8057.449, "end": 8080.369, "localBegin": 292.32, "localEnd": 315.24}, {"id": "c006_f000032", "text": "Professor Sprout was a squat little witch who wore a patched hat over her flyaway hair; there was usually a large amount of earth on her clothes, and her fingernails would have made Aunt Petunia faint. Gilderoy Lockhart, however, was immaculate in sweeping robes of turquoise, his golden hair shining under a perfectly positioned turquoise hat with gold trimming.", "begin": 8080.369, "end": 8104.169, "localBegin": 315.24, "localEnd": 339.04}, {"id": "c006_f000033", "text": "'Oh, hello there!' Lockhart called, beaming around at the assembled students. 'Just been showing Professor Sprout the right way to doctor a Whomping Willow! But I don't want you running away with the idea that I'm better at Herbology than she is! I just happen to have met several of these exotic plants on my travels ...'", "begin": 8104.169, "end": 8126.529, "localBegin": 339.04, "localEnd": 361.4}, {"id": "c006_f000034", "text": "'Greenhouse Three today, chaps!' said Professor Sprout, who was looking distinctly disgruntled, not at all her usual cheerful self.", "begin": 8126.529, "end": 8136.209, "localBegin": 361.4, "localEnd": 371.08}, {"id": "c006_f000035", "text": "There was a murmur of interest. They had only ever worked in Greenhouse One before - Greenhouse Three housed far more", "begin": 8136.209, "end": 8142.849, "localBegin": 371.08, "localEnd": 377.72}, {"id": "c006_f000036", "text": "interesting and dangerous plants. Professor Sprout took a large key from her belt and unlocked the door. Harry caught a whiff of damp earth and fertiliser, mingling with the heavy perfume of some giant, umbrella-sized flowers dangling from the ceiling. He was about to follow Ron and Hermione inside when Lockhart's hand shot out.", "begin": 8142.849, "end": 8162.809, "localBegin": 377.72, "localEnd": 397.68}, {"id": "c006_f000037", "text": "'Harry! I've been wanting a word - you don't mind if he's a couple of minutes late, do you, Professor Sprout?'", "begin": 8162.809, "end": 8171.729, "localBegin": 397.68, "localEnd": 406.6}, {"id": "c006_f000038", "text": "Judging by Professor Sprout's scowl, she did mind, but Lockhart said, 'That's the ticket,' and closed the greenhouse door in her face.", "begin": 8171.729, "end": 8180.929, "localBegin": 406.6, "localEnd": 415.8}, {"id": "c006_f000039", "text": "'Harry,' said Lockhart, his large white teeth gleaming in the sunlight as he shook his head. 'Harry, Harry, Harry.'", "begin": 8180.929, "end": 8188.729, "localBegin": 415.8, "localEnd": 423.6}, {"id": "c006_f000040", "text": "Completely nonplussed, Harry said nothing.", "begin": 8188.729, "end": 8192.809, "localBegin": 423.6, "localEnd": 427.68}, {"id": "c006_f000041", "text": "'When I heard - well, of course, it was all my fault. Could have kicked myself.'", "begin": 8192.809, "end": 8198.649, "localBegin": 427.68, "localEnd": 433.52}, {"id": "c006_f000042", "text": "Harry had no idea what he was talking about. He was about to say so when Lockhart went on, 'Don't know when I've been more shocked. Flying a car to Hogwarts! Well, of course, I knew at once why you'd done it. Stood out a mile. Harry, Harry, Harry.'", "begin": 8198.649, "end": 8219.809, "localBegin": 433.52, "localEnd": 454.68}, {"id": "c006_f000043", "text": "It was remarkable how he could show every one of those brilliant teeth even when he wasn't talking.", "begin": 8219.809, "end": 8226.169, "localBegin": 454.68, "localEnd": 461.04}, {"id": "c006_f000044", "text": "'Gave you a taste for publicity, didn't I?' said Lockhart. 'Gave you the bug. You got onto the front page of the paper with me and you couldn't wait to do it again.'", "begin": 8226.169, "end": 8238.449, "localBegin": 461.04, "localEnd": 473.32}, {"id": "c006_f000045", "text": "'Oh - no, Professor, see -'", "begin": 8238.449, "end": 8239.969, "localBegin": 473.32, "localEnd": 474.84}, {"id": "c006_f000046", "text": "'Harry, Harry, Harry,' said Lockhart, reaching out and grasping his shoulder. 'I understand. Natural to want a bit more once you've had that first taste - and I blame myself for giving you that, because it was bound to go to your head - but see here, young man, you can't start flying cars to try and get yourself noticed. Just calm down, all right? Plenty of time for all that when you're older. Yes, yes, I know what you're thinking! \"It's all right for him, he's an internationally famous wizard already!\" But when I was twelve, I was just as much of a nobody as you are now. In fact, I'd say I was even more of a nobody! I mean, a few people have heard of you, haven't they? All that business with He Who Must Not Be Named!' He glanced at the lightning scar on Harry's forehead. 'I know, I know, it's not quite as good as winning Witch Weekly's Most-Charming-Smile Award five times in a row, as I have - but", "begin": 8239.969, "end": 8306.769, "localBegin": 474.84, "localEnd": 541.64}, {"id": "c006_f000047", "text": "it's a start, Harry, it's a start.'", "begin": 8306.769, "end": 8311.769, "localBegin": 541.64, "localEnd": 546.64}, {"id": "c006_f000048", "text": "He gave Harry a hearty wink and strode off. Harry stood stunned for a few seconds, then, remembering he was supposed to be in the greenhouse, he opened the door and slid inside.", "begin": 8311.769, "end": 8322.569, "localBegin": 546.64, "localEnd": 557.44}, {"id": "c006_f000049", "text": "Professor Sprout was standing behind a trestle bench in the centre of the greenhouse. About twenty pairs of different-coloured earmuffs were lying on the bench. When Harry had taken his place between Ron and Hermione, she said, 'We'll be re-potting Mandrakes today. Now, who can tell me the properties of the Mandrake?'", "begin": 8322.569, "end": 8343.169, "localBegin": 557.44, "localEnd": 578.04}, {"id": "c006_f000050", "text": "To nobody's surprise, Hermione's hand was first into the air.", "begin": 8343.169, "end": 8348.329, "localBegin": 578.04, "localEnd": 583.2}, {"id": "c006_f000051", "text": "'Mandrake, or Mandragora, is a powerful restorative,' said Hermione, sounding as usual as though she had swallowed the textbook. 'It is used to return people who have been transfigured or cursed, to their original state.'", "begin": 8348.329, "end": 8362.049, "localBegin": 583.2, "localEnd": 596.92}, {"id": "c006_f000052", "text": "'Excellent. Ten points to Gryffindor,' said Professor Sprout. 'The Mandrake forms an essential part of most antidotes. It is also, however, dangerous. Who can tell me why?'", "begin": 8362.049, "end": 8376.729, "localBegin": 596.92, "localEnd": 611.6}, {"id": "c006_f000053", "text": "Hermione's hand narrowly missed Harry's glasses as it shot up again.", "begin": 8376.729, "end": 8380.129, "localBegin": 611.6, "localEnd": 615.0}, {"id": "c006_f000054", "text": "'The cry of the Mandrake is fatal to anyone who hears it,' she said promptly.", "begin": 8380.129, "end": 8384.529, "localBegin": 615.0, "localEnd": 619.4}, {"id": "c006_f000055", "text": "'Precisely. Take another ten points,' said Professor Sprout. 'Now, the Mandrakes we have here are still very young.'", "begin": 8384.529, "end": 8394.129, "localBegin": 619.4, "localEnd": 629.0}, {"id": "c006_f000056", "text": "She pointed to a row of deep trays as she spoke and everyone shuffled forward for a better look. A hundred or so tufty little plants, purplish green in colour, were growing there in rows. They looked quite unremarkable to Harry, who didn't have the slightest idea what Hermione meant by the 'cry' of the Mandrake.", "begin": 8394.129, "end": 8413.809, "localBegin": 629.0, "localEnd": 648.68}, {"id": "c006_f000057", "text": "'Everyone take a pair of earmuffs,' said Professor Sprout.", "begin": 8413.809, "end": 8418.529, "localBegin": 648.68, "localEnd": 653.4}, {"id": "c006_f000058", "text": "There was a scramble as everyone tried to seize a pair that wasn't pink and fluffy.", "begin": 8418.529, "end": 8424.129, "localBegin": 653.4, "localEnd": 659.0}, {"id": "c006_f000059", "text": "'When I tell you to put them on, make sure your ears are completely covered,' said Professor Sprout. 'When it is safe to remove them, I will give you the thumbs-up. Right - earmuffs on.'", "begin": 8424.129, "end": 8439.969, "localBegin": 659.0, "localEnd": 674.84}, {"id": "c006_f000060", "text": "Harry snapped the earmuffs over his ears. They shut out sound completely. Professor Sprout put a pink fluffy pair over her own ears, rolled up the sleeves of her robes, grasped one of the tufty plants firmly, and pulled hard.", "begin": 8439.969, "end": 8454.849, "localBegin": 674.84, "localEnd": 689.72}, {"id": "c006_f000061", "text": "Harry let out a gasp of surprise that no one could hear.", "begin": 8454.849, "end": 8458.569, "localBegin": 689.72, "localEnd": 693.44}, {"id": "c006_f000062", "text": "Instead of roots, a small, muddy and extremely ugly baby popped out of the earth. The leaves were growing right out of his head. He had pale green, mottled skin, and was clearly bawling at the top of his lungs.", "begin": 8458.569, "end": 8471.009, "localBegin": 693.44, "localEnd": 705.88}, {"id": "c006_f000063", "text": "Professor Sprout took a large plant pot from under the table and plunged the Mandrake into it, burying him in dark, damp compost until only the tufted leaves were visible. Professor Sprout dusted off her hands, gave them all the thumbs-up and removed her own earmuffs.", "begin": 8471.009, "end": 8489.089, "localBegin": 705.88, "localEnd": 723.96}, {"id": "c006_f000064", "text": "'As our Mandrakes are only seedlings, their cries won't kill yet,' she said calmly, as though she'd just done nothing more exciting than water a begonia. 'However, they will knock you out for several hours, and as I'm sure none of you want to miss your first day back, make sure your earmuffs are securely in place while you work. I will attract your attention when it is time to pack up.", "begin": 8489.089, "end": 8515.209, "localBegin": 723.96, "localEnd": 750.08}, {"id": "c006_f000065", "text": "'Four to a tray - there is a large supply of pots here - compost in the sacks over there - and be careful of the Venomous Tentacula, it's teething.'", "begin": 8515.209, "end": 8528.329, "localBegin": 750.08, "localEnd": 763.2}, {"id": "c006_f000066", "text": "She gave a sharp slap to a spiky, dark red plant as she spoke, making it draw in the long feelers that had been inching sneakily over her shoulder.", "begin": 8528.329, "end": 8537.329, "localBegin": 763.2, "localEnd": 772.2}, {"id": "c006_f000067", "text": "Harry, Ron and Hermione were joined at their tray by a curlyhaired Hufflepuff boy Harry knew by sight, but had never spoken to.", "begin": 8537.329, "end": 8545.369, "localBegin": 772.2, "localEnd": 780.24}, {"id": "c006_f000068", "text": "'Justin Finch-Fletchley,' he said brightly, shaking Harry by the hand. 'Know who you are, of course, the famous Harry Potter ... and you're Hermione Granger - always top in everything ...' (Hermione beamed as she had her hand shaken, too) 'and Ron Weasley. Wasn't that your flying car?'", "begin": 8545.369, "end": 8562.609, "localBegin": 780.24, "localEnd": 797.48}, {"id": "c006_f000069", "text": "Ron didn't s
