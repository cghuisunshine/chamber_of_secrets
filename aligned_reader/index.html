iddle was going to go back to some Muggle orphanage if they closed Hogwarts,' said Harry. 'I don't blame him for wanting to stay here ...'", "begin": 23326.42, "end": 23333.46, "localBegin": 95.16, "localEnd": 102.2}, {"id": "c014_f000011", "text": "Ron bit his lip, then said tentatively, 'You met Hagrid down Knockturn Alley, didn't you, Harry?'", "begin": 23333.46, "end": 23338.42, "localBegin": 102.2, "localEnd": 107.16}, {"id": "c014_f000012", "text": "'He was buying a Flesh-Eating Slug Repellent,' said Harry quickly.", "begin": 23338.42, "end": 23342.98, "localBegin": 107.16, "localEnd": 111.72}, {"id": "c014_f000013", "text": "The three of them fell silent. After a long pause, Hermione voiced the knottiest question of all in a hesitant voice: 'Do you think we should go and ask Hagrid about it all?'", "begin": 23342.98, "end": 23355.3, "localBegin": 111.72, "localEnd": 124.04}, {"id": "c014_f000014", "text": "'That'd be a cheerful visit,' said Ron. 'Hello, Hagrid, tell us, have you been setting anything mad and hairy loose in the castle lately?'", "begin": 23355.3, "end": 23364.54, "localBegin": 124.04, "localEnd": 133.28}, {"id": "c014_f000015", "text": "In the end, they decided that they wouldn't say anything to Hagrid unless there was another attack, and as more and more days went by with no whisper from the disembodied voice, they became hopeful that they would never need to talk to him about why he had been expelled. It was now nearly four months since Justin and Nearly Headless Nick had been Petrified, and nearly everybody seemed to think that the attacker, whoever it was, had retired for good. Peeves had finally got bored of his 'Oh Potter, you rotter' song, Ernie Macmillan asked Harry quite politely to pass a bucket of leaping toadstools in Herbology one day, and in March several of the Mandrakes threw a loud and raucous party in Greenhouse Three. This made Professor Sprout very happy.", "begin": 23364.54, "end": 23410.26, "localBegin": 133.28, "localEnd": 179.0}, {"id": "c014_f000016", "text": "'The moment they start trying to move into each other's pots, we'll know they're fully mature,' she told Harry. 'Then we'll be able to revive those poor people in the hospital wing.' * The second-years were given something new to think about during their Easter holidays. The time had come to choose their subjects for the third year, a matter that Hermione, at least, took very seriously.", "begin": 23410.26, "end": 23436.5, "localBegin": 179.0, "localEnd": 205.24}, {"id": "c014_f000017", "text": "'It could affect our whole future,' she told Harry and Ron, as they pored over lists of new subjects, marking them with ticks.", "begin": 23436.5, "end": 23444.54, "localBegin": 205.24, "localEnd": 213.28}, {"id": "c014_f000018", "text": "'I just want to give up Potions,' said Harry.", "begin": 23444.54, "end": 23447.98, "localBegin": 213.28, "localEnd": 216.72}, {"id": "c014_f000019", "text": "'We can't,' said Ron gloomily. 'We keep all our old subjects, or I'd've ditched Defence Against the Dark Arts.'", "begin": 23447.98, "end": 23455.14, "localBegin": 216.72, "localEnd": 223.88}, {"id": "c014_f000020", "text": "'But that's very important!' said Hermione, shocked.", "begin": 23455.14, "end": 23459.02, "localBegin": 223.88, "localEnd": 227.76}, {"id": "c014_f000021", "text": "'Not the way Lockhart teaches it,' said Ron. 'I haven't learned anything from him except not to set pixies loose.'", "begin": 23459.02, "end": 23466.22, "localBegin": 227.76, "localEnd": 234.96}, {"id": "c014_f000022", "text": "Neville Longbottom had been sent letters from all the witches and wizards in his family, all giving him different advice on what to choose. Confused and worried, he sat reading the subject lists", "begin": 23466.22, "end": 23476.74, "localBegin": 234.96, "localEnd": 245.48}, {"id": "c014_f000023", "text": "with his tongue poking out, asking people whether they thought Arithmancy sounded more difficult than Study of Ancient Runes. Dean Thomas, who, like Harry, had grown up with Muggles, ended up closing his eyes and jabbing his wand at the list, then picking the subjects it landed on. Hermione took nobody's advice but signed up for everything.", "begin": 23476.74, "end": 23497.58, "localBegin": 245.48, "localEnd": 266.32}, {"id": "c014_f000024", "text": "Harry smiled grimly to himself at the thought of what Uncle Vernon and Aunt Petunia would say if he tried to discuss his career in wizardry with them. Not that he didn't get any guidance: Percy Weasley was eager to share his experience.", "begin": 23497.58, "end": 23511.78, "localBegin": 266.32, "localEnd": 280.52}, {"id": "c014_f000025", "text": "'Depends where you want to go, Harry,' he said. 'It's never too early to think about the future, so I'd recommend Divination. People say Muggle Studies is a soft option, but I personally think wizards should have a thorough understanding of the nonmagical community, particularly if they're thinking of working in close contact with them - look at my father, he has to deal with Muggle business all the time. My brother Charlie was always more of an outdoor type, so he went for Care of Magical Creatures. Play to your strengths, Harry.'", "begin": 23511.78, "end": 23546.42, "localBegin": 280.52, "localEnd": 315.16}, {"id": "c014_f000026", "text": "But the only thing Harry felt he was really good at was Quidditch. In the end, he chose the same new subjects as Ron, feeling that if he was rubbish at them, at least he'd have someone friendly to help him. * Gryffindor's next Quidditch match would be against Hufflepuff. Wood was insisting on team practices every night after dinner, so that Harry barely had time for anything but Quidditch and homework. However, the training sessions were getting better, or at least drier, and the evening before Saturday's match, he went up to his dormitory to drop off his broomstick, feeling Gryffindor's chances for the Quidditch Cup had never been better.", "begin": 23546.42, "end": 23586.3, "localBegin": 315.16, "localEnd": 355.04}, {"id": "c014_f000027", "text": "But his cheerful mood didn't last long. At the top of the stairs to the dormitory, he met Neville Longbottom, who was looking frantic.", "begin": 23586.3, "end": 23594.66, "localBegin": 355.04, "localEnd": 363.4}, {"id": "c014_f000028", "text": "'Harry - I don't know who did it. I just found -'", "begin": 23594.66, "end": 23599.22, "localBegin": 363.4, "localEnd": 367.96}, {"id": "c014_f000029", "text": "Watching Harry fearfully, Neville pushed open the door.", "begin": 23599.22, "end": 23603.02, "localBegin": 367.96, "localEnd": 371.76}, {"id": "c014_f000030", "text": "The contents of Harry's trunk had been thrown everywhere. His cloak lay ripped on the floor. The bedclothes had been pulled off his four-poster and the drawer had been pulled out of his bedside cabinet, the contents strewn over the mattress.", "begin": 23603.02, "end": 23616.9, "localBegin": 371.76, "localEnd": 385.64}, {"id": "c014_f000031", "text": "Harry walked over to the bed, open-mouthed, treading on a few loose pages of Travels with Trolls.", "begin": 23616.9, "end": 23623.38, "localBegin": 385.64, "localEnd": 392.12}, {"id": "c014_f000032", "text": "As he and Neville pulled the blankets back onto his bed, Ron, Dean and Seamus came in. Dean swore loudly.", "begin": 23623.38, "end": 23630.3, "localBegin": 392.12, "localEnd": 399.04}, {"id": "c014_f000033", "text": "'What happened, Harry?'", "begin": 23630.3, "end": 23632.42, "localBegin": 399.04, "localEnd": 401.16}, {"id": "c014_f000034", "text": "'No idea,' said Harry. But Ron was examining Harry's robes. All the pockets were hanging out.", "begin": 23632.42, "end": 23638.78, "localBegin": 401.16, "localEnd": 407.52}, {"id": "c014_f000035", "text": "'Someone's been looking for something,' said Ron. 'Is there anything missing?'", "begin": 23638.78, "end": 23643.18, "localBegin": 407.52, "localEnd": 411.92}, {"id": "c014_f000036", "text": "Harry started to pick up all his things and throw them into his trunk. It was only as he threw the last of the Lockhart books back into it that he realised what wasn't there.", "begin": 23643.18, "end": 23653.9, "localBegin": 411.92, "localEnd": 422.64}, {"id": "c014_f000037", "text": "'Riddle's diary's gone,' he said in an undertone to Ron.", "begin": 23653.9, "end": 23658.5, "localBegin": 422.64, "localEnd": 427.24}, {"id": "c014_f000038", "text": "'What?'", "begin": 23658.5, "end": 23659.9, "localBegin": 427.24, "localEnd": 428.64}, {"id": "c014_f000039", "text": "Harry jerked his head towards the dormitory door and Ron followed him out. They hurried back down to the Gryffindor common room, which was half-empty, and joined Hermione, who was sitting alone, reading a book called Ancient Runes Made Easy.", "begin": 23659.9, "end": 23673.94, "localBegin": 428.64, "localEnd": 442.68}, {"id": "c014_f000040", "text": "Hermione looked aghast at the news.", "begin": 23673.94, "end": 23676.78, "localBegin": 442.68, "localEnd": 445.52}, {"id": "c014_f000041", "text": "'But - only a Gryffindor could have stolen - nobody else knows our password ...'", "begin": 23676.78, "end": 23683.5, "localBegin": 445.52, "localEnd": 452.24}, {"id": "c014_f000042", "text": "'Exactly,' said Harry. * They woke next day to brilliant sunshine and a light, refreshing breeze.", "begin": 23683.5, "end": 23692.86, "localBegin": 452.24, "localEnd": 461.6}, {"id": "c014_f000043", "text": "'Perfect Quidditch conditions!' said Wood enthusiastically at the Gryffindor table, loading the team's plates with scrambled eggs. 'Harry, buck up there, you need a decent breakfast.'", "begin": 23692.86, "end": 23704.22, "localBegin": 461.6, "localEnd": 472.96}, {"id": "c014_f000044", "text": "Harry had been staring down the packed Gryffindor table, wondering if the new owner of Riddle's diary was right in front of his eyes. Hermione had been urging him to report the robbery, but Harry didn't like the idea. He'd have to tell a teacher all about the diary and how many people knew why Hagrid had been expelled fifty years ago? He didn't want to be the one who brought it all up again.", "begin": 23704.22, "end": 23727.02, "localBegin": 472.96, "localEnd": 495.76}, {"id": "c014_f000045", "text": "As he left the Great Hall with Ron and Hermione to go and collect his Quidditch things, another, very serious worry was added to Harry's growing list. He had just set foot on the marble staircase when he heard it yet again: 'Kill this time ... let me rip ... tear ...'", "begin": 23727.02, "end": 23747.06, "localBegin": 495.76, "localEnd": 515.8}, {"id": "c014_f000046", "text": "He shouted aloud and Ron and Hermione both jumped away", "begin": 23747.06, "end": 23754.9, "localBegin": 515.8, "localEnd": 523.64}, {"id": "c014_f000047", "text": "from him in alarm.", "begin": 23754.9, "end": 23755.9, "localBegin": 523.64, "localEnd": 524.64}, {"id": "c014_f000048", "text": "'The voice!' said Harry, looking over his shoulder. 'I just heard it again - didn't you?'", "begin": 23755.9, "end": 23762.42, "localBegin": 524.64, "localEnd": 531.16}, {"id": "c014_f000049", "text": "Ron shook his head, wide-eyed. Hermione, however, clapped a hand to her forehead.", "begin": 23762.42, "end": 23767.1, "localBegin": 531.16, "localEnd": 535.84}, {"id": "c014_f000050", "text": "'Harry - I think I've just understood something! I've got to go to the library!'", "begin": 23767.1, "end": 23773.34, "localBegin": 535.84, "localEnd": 542.08}, {"id": "c014_f000051", "text": "And she sprinted away, up the stairs.", "begin": 23773.34, "end": 23776.62, "localBegin": 542.08, "localEnd": 545.36}, {"id": "c014_f000052", "text": "'What does she understand?' said Harry distractedly, still looking around, trying to tell where the voice had come from.", "begin": 23776.62, "end": 23783.7, "localBegin": 545.36, "localEnd": 552.44}, {"id": "c014_f000053", "text": "'Loads more than I do,' said Ron, shaking his head.", "begin": 23783.7, "end": 23786.66, "localBegin": 552.44, "localEnd": 555.4}, {"id": "c014_f000054", "text": "'But why's she got to go to the library?'", "begin": 23786.66, "end": 23789.42, "localBegin": 555.4, "localEnd": 558.16}, {"id": "c014_f000055", "text": "'Because that's what Hermione does,' said Ron, shrugging. 'When in doubt, go to the library.'", "begin": 23789.42, "end": 23795.54, "localBegin": 558.16, "localEnd": 564.28}, {"id": "c014_f000056", "text": "Harry stood, irresolute, trying to catch the voice again, but people were now emerging from the Great Hall behind him, talking loudly, exiting through the front doors on their way to the Quidditch pitch.", "begin": 23795.54, "end": 23807.14, "localBegin": 564.28, "localEnd": 575.88}, {"id": "c014_f000057", "text": "'You'd better get moving,' said Ron. 'It's nearly eleven - the match.'", "begin": 23807.14, "end": 23811.62, "localBegin": 575.88, "localEnd": 580.36}, {"id": "c014_f000058", "text": "Harry raced up to Gryffindor Tower, collected his Nimbus Two Thousand and joined the large crowd swarming across the grounds, but his mind was still in the castle, along with the bodiless voice, and as he pulled on his scarlet robes in the changing room, his only comfort was that everyone was now outside to watch the game.", "begin": 23811.62, "end": 23830.62, "localBegin": 580.36, "localEnd": 599.36}, {"id": "c014_f000059", "text": "The teams walked onto the pitch to tumultuous applause. Oliver Wood took off for a warm-up flight around the goalposts, Madam Hooch released the balls. The Hufflepuffs, who played in canary yellow, were standing in a huddle, having a last-minute discussion of tactics.", "begin": 23830.62, "end": 23846.9, "localBegin": 599.36, "localEnd": 615.64}, {"id": "c014_f000060", "text": "Harry was just mounting his broom when Professor McGonagall came half-marching, half-running across the pitch, carrying an enormous purple megaphone.", "begin": 23846.9, "end": 23855.02, "localBegin": 615.64, "localEnd": 623.76}, {"id": "c014_f000061", "text": "Harry's heart dropped like a stone.", "begin": 23855.02, "end": 23857.78, "localBegin": 623.76, "localEnd": 626.52}, {"id": "c014_f000062", "text": "'This match has been cancelled,' Professor McGonagall called through the megaphone, addressing the packed stadium. There were boos and shouts. Oliver Wood, looking devastated, landed and ran towards Professor McGonagall without getting off his broomstick.", "begin": 23857.78, "end": 23872.3, "localBegin": 626.52, "localEnd": 641.04}, {"id": "c014_f000063", "text": "'But Professor!' he shouted. 'We've got to play ... the Cup ... Gryffindor ...'", "begin": 23872.3, "end": 23876.86, "localBegin": 641.04, "localEnd": 645.6}, {"id": "c014_f000064", "text": "Professor McGonagall ignored him and continued to shout through her megaphone: 'All students are to make their way back to the house common rooms, where their Heads of Houses will give them further information. As quickly as you can, please!'", "begin": 23876.86, "end": 23891.02, "localBegin": 645.6, "localEnd": 659.76}, {"id": "c014_f000065", "text": "Then she lowered the megaphone and beckoned Harry over to her.", "begin": 23891.02, "end": 23894.18, "localBegin": 659.76, "localEnd": 662.92}, {"id": "c014_f000066", "text": "'Potter, I think you'd better come with me ...'", "begin": 23894.18, "end": 23898.26, "localBegin": 662.92, "localEnd": 667.0}, {"id": "c014_f000067", "text": "Wondering how she could possibly suspect him this time, Harry saw Ron detach himself from the complaining crowd; he came running up to them as they set off towards the castle. To Harry's surprise, Professor McGonagall didn't object.", "begin": 23898.26, "end": 23911.62, "localBegin": 667.0, "localEnd": 680.36}, {"id": "c014_f000068", "text": "'Yes, perhaps you'd better come too, Weasley.'", "begin": 23911.62, "end": 23915.54, "localBegin": 680.36, "localEnd": 684.28}, {"id": "c014_f000069", "text": "Some of the students swarming around them were grumbling about the match being cancelled, others looked worried. Harry and Ron followed Professor McGonagall back into the school and up the marble staircase. But they weren't taken to anybody's office this time.", "begin": 23915.54, "end": 23930.46, "localBegin": 684.28, "localEnd": 699.2}, {"id": "c014_f000070", "text": "'This will be a bit of a shock,' said Professor McGonagall in a surprisingly gentle voice as they approached the hospital wing. 'There has been another attack ... another double attack.'", "begin": 23930.46, "end": 23943.42, "localBegin": 699.2, "localEnd": 712.16}, {"id": "c014_f000071", "text": "Harry's insides did a horrible somersault. Professor McGonagall pushed the door open and he and Ron entered.", "begin": 23943.42, "end": 23950.54, "localBegin": 712.16, "localEnd": 719.28}, {"id": "c014_f000072", "text": "Madam Pomfrey was bending over a sixth-year girl with long curly hair. Harry recognised her as the Ravenclaw they'd accidentally asked for directions to the Slytherin common room. And on the bed next to her was -", "begin": 23950.54, "end": 23963.26, "localBegin": 719.28, "localEnd": 732.0}, {"id": "c014_f000073", "text": "'Hermione!' Ron groaned.", "begin": 23963.26, "end": 23967.18, "localBegin": 732.0, "localEnd": 735.92}, {"id": "c014_f000074", "text": "Hermione lay utterly still, her eyes open and glassy.", "begin": 23967.18, "end": 23971.46, "localBegin": 735.92, "localEnd": 740.2}, {"id": "c014_f000075", "text": "'They were found near the library.' said Professor McGonagall. 'I don't suppose either of you can explain this? It was on the floor next to them ...'", "begin": 23971.46, "end": 23981.18, "localBegin": 740.2, "localEnd": 749.92}, {"id": "c014_f000076", "text": "She was holding up a small, circular mirror.", "begin": 23981.18, "end": 23984.58, "localBegin": 749.92, "localEnd": 753.32}, {"id": "c014_f000077", "text": "Harry and Ron shook their heads, both staring at Hermione.", "begin": 23984.58, "end": 23989.38, "localBegin": 753.32, "localEnd": 758.12}, {"id": "c014_f000078", "text": "'I will escort you back to Gryffindor Tower,' said Professor McGonagall heavily. 'I need to address the students in any case.' * 'All students will return to their house common rooms by six o'clock in the evening. No student is to leave the dormitories after", "begin": 23989.38, "end": 24007.26, "localBegin": 758.12, "localEnd": 776.0}, {"id": "c014_f000079", "text": "that time. You will be escorted to each lesson by a teacher. No student is to use the bathroom unaccompanied by a teacher. All further Quidditch training and matches are to be postponed. There will be no more evening activities.'", "begin": 24007.26, "end": 24023.3, "localBegin": 776.0, "localEnd": 792.04}, {"id": "c014_f000080", "text": "The Gryffindors packed inside the common room listened to Professor McGonagall in silence. She rolled up the parchment from which she had been reading and said in a somewhat choked voice, 'I need hardly add that I have rarely been so distressed. It is likely that the school will be closed unless the culprit behind these attacks is caught. I would urge anyone who thinks they might know anything about them to come forward.'", "begin": 24023.3, "end": 24052.62, "localBegin": 792.04, "localEnd": 821.36}, {"id": "c014_f000081", "text": "She climbed somewhat awkwardly out of the portrait hole, and the Gryffindors began talking immediately.", "begin": 24052.62, "end": 24057.66, "localBegin": 821.36, "localEnd": 826.4}, {"id": "c014_f000082", "text": "'That's two Gryffindors down, not counting a Gryffindor ghost, one Ravenclaw and one Hufflepuff,' said the Weasley twins' friend Lee Jordan, counting on his fingers. 'Haven't any of the teachers noticed that the Slytherins are all safe? Isn't it obvious all this stuff's coming from Slytherin? The heir of Slytherin, the monster of Slytherin - why don't they just chuck all the Slytherins out?' he roared, to nods and scattered applause.", "begin": 24057.66, "end": 24082.98, "localBegin": 826.4, "localEnd": 851.72}, {"id": "c014_f000083", "text": "Percy Weasley was sitting in a chair behind Lee, but for once he didn't seem keen to make his views heard. He was looking pale and stunned.", "begin": 24082.98, "end": 24091.26, "localBegin": 851.72, "localEnd": 860.0}, {"id": "c014_f000084", "text": "'Percy's in shock,' George told Harry quietly. 'That Ravenclaw girl - Penelope Clearwater - she's a Prefect. I don't think he thought the monster would dare attack a Prefect.'", "begin": 24091.26, "end": 24102.38, "localBegin": 860.0, "localEnd": 871.12}, {"id": "c014_f000085", "text": "But Harry was only half-listening. He didn't seem to be able to get rid of the picture of Hermione, lying on the hospital bed as though carved out of stone. And if the culprit wasn't caught soon, he was looking at a lifetime back with the Dursleys. Tom Riddle had turned Hagrid in because he was faced with the prospect of a Muggle orphanage if the school closed. Harry now knew exactly how he had felt.", "begin": 24102.38, "end": 24126.74, "localBegin": 871.12, "localEnd": 895.48}, {"id": "c014_f000086", "text": "'What're we going to do?' said Ron quietly in Harry's ear. 'D'you think they suspect Hagrid?'", "begin": 24126.74, "end": 24133.46, "localBegin": 895.48, "localEnd": 902.2}, {"id": "c014_f000087", "text": "'We've got to go and talk to him,' said Harry, making up his mind. 'I can't believe it's him this time, but if he set the monster loose last time he'll know how to get inside the Chamber of Secrets, and that's a start.'", "begin": 24133.46, "end": 24144.94, "localBegin": 902.2, "localEnd": 913.68}, {"id": "c014_f000088", "text": "'But McGonagall said we've got to stay in our tower unless we're in class -'", "begin": 24144.94, "end": 24149.82, "localBegin": 913.68, "localEnd": 918.56}, {"id": "c014_f000089", "text": "'I think,' said Harry, more quietly still, 'it's time to get my dad's old Cloak out again.' * Harry had inherited just one thing from his father: a long and silvery Invisibility Cloak. It was their only chance of sneaking out of the school to visit Hagrid without anyone knowing about it. They went to bed at the usual time, waited until Neville, Dean and Seamus had stopped discussing the Chamber of Secrets and finally fallen asleep, then got up, dressed again, and threw the Cloak over themselves.", "begin": 24149.82, "end": 24182.22, "localBegin": 918.56, "localEnd": 950.96}, {"id": "c014_f000090", "text": "The journey through the dark and deserted castle corridors wasn't enjoyable. Harry, who had wandered the castle at night several times before, had never seen it so crowded after sunset. Teachers, Prefects and ghosts were marching the corridors in pairs, staring around for any unusual activity. Their Invisibility Cloak didn't stop them making any noise, and there was a particularly tense moment when Ron stubbed his toe only yards from the spot where Snape was standing guard. Thankfully, Snape sneezed at almost exactly the moment Ron swore. It was with relief that they reached the oak front doors and eased them open.", "begin": 24182.22, "end": 24222.3, "localBegin": 950.96, "localEnd": 991.04}, {"id": "c014_f000091", "text": "It was a clear, starry night. They hurried towards the lighted windows of Hagrid's house, and pulled off the Cloak only when they were right outside his front door.", "begin": 24222.3, "end": 24230.7, "localBegin": 991.04, "localEnd": 999.44}, {"id": "c014_f000092", "text": "Seconds after they had knocked, Hagrid flung it open. They found themselves face to face, with him aiming a crossbow at them, Fang the boarhound barking loudly behind him.", "begin": 24230.7, "end": 24241.5, "localBegin": 999.44, "localEnd": 1010.24}, {"id": "c014_f000093", "text": "'Oh,' he said, lowering the weapon and staring at them. 'What're you two doin' here?'", "begin": 24241.5, "end": 24248.3, "localBegin": 1010.24, "localEnd": 1017.04}, {"id": "c014_f000094", "text": "'What's that for?' said Harry, pointing at the crossbow as they stepped inside.", "begin": 24248.3, "end": 24252.26, "localBegin": 1017.04, "localEnd": 1021.0}, {"id": "c014_f000095", "text": "'Nothin' ... nothin',' Hagrid muttered. 'I've bin expectin' ... doesn' matter ... Sit down ... I'll make tea ...'", "begin": 24252.26, "end": 24258.26, "localBegin": 1021.0, "localEnd": 1027.0}, {"id": "c014_f000096", "text": "He hardly seemed to know what he was doing. He nearly extinguished the fire, spilling water from the kettle on it, and then smashed the teapot with a nervous jerk of his massive hand.", "begin": 24258.26, "end": 24269.58, "localBegin": 1027.0, "localEnd": 1038.32}, {"id": "c014_f000097", "text": "'Are you OK, Hagrid?' said Harry. 'Did you hear about Hermione?'", "begin": 24269.58, "end": 24274.22, "localBegin": 1038.32, "localEnd": 1042.96}, {"id": "c014_f000098", "text": "'Oh, I heard, all righ',' said Hagrid, a slight break in his voice.", "begin": 24274.22, "end": 24278.26, "localBegin": 1042.96, "localEnd": 1047.0}, {"id": "c014_f000099", "text": "He kept glancing nervously at the windows. He poured them both large mugs of boiling water (he had forgotten to add tea bags) and was just putting a slab of fruitcake on a plate, when there was a loud knock on the door.", "begin": 24278.26, "end": 24290.42, "localBegin": 1047.0, "localEnd": 1059.16}, {"id": "c014_f000100", "text": "Hagrid dropped the fruitcake. Harry and Ron exchanged panicstricken looks, then threw the Invisibility Cloak back over themselves and retreated into a corner. Hagrid checked that they were hidden, seized his crossbow and flung open his door once more.", "begin": 24290.42, "end": 24304.74, "localBegin": 1059.16, "localEnd": 1073.48}, {"id": "c014_f000101", "text": "'Good evening, Hagrid.'", "begin": 24304.74, "end": 24308.18, "localBegin": 1073.48, "localEnd": 1076.92}, {"id": "c014_f000102", "text": "It was Dumbledore. He entered, looking deadly serious, and was followed by a second, very odd-looking man.", "begin": 24308.18, "end": 24314.78, "localBegin": 1076.92, "localEnd": 1083.52}, {"id": "c014_f000103", "text": "The stranger was a short, portly man with rumpled grey hair and an anxious expression. He was wearing a strange mixture of clothes: a pin-striped suit, a scarlet tie, a long black cloak and pointed purple boots. Under his arm he carried a lime-green bowler.", "begin": 24314.78, "end": 24330.7, "localBegin": 1083.52, "localEnd": 1099.44}, {"id": "c014_f000104", "text": "'That's Dad's boss!' Ron breathed. 'Cornelius Fudge, the Minister of Magic!'", "begin": 24330.7, "end": 24338.06, "localBegin": 1099.44, "localEnd": 1106.8}, {"id": "c014_f000105", "text": "Harry elbowed Ron hard to make him shut up.", "begin": 24338.06, "end": 24341.74, "localBegin": 1106.8, "localEnd": 1110.48}, {"id": "c014_f000106", "text": "Hagrid had gone pale and sweaty. He dropped into one of his chairs and looked from Dumbledore to Cornelius Fudge.", "begin": 24341.74, "end": 24348.38, "localBegin": 1110.48, "localEnd": 1117.12}, {"id": "c014_f000107", "text": "'Bad business, Hagrid,' said Fudge, in rather clipped tones. 'Very bad business. Had to come. Four attacks on Muggle-borns. Things've gone far enough. Ministry's got to act.'", "begin": 24348.38, "end": 24361.3, "localBegin": 1117.12, "localEnd": 1130.04}, {"id": "c014_f000108", "text": "'I never,' said Hagrid, looking imploringly at Dumbledore, 'you know I never, Professor Dumbledore, sir ...'", "begin": 24361.3, "end": 24369.42, "localBegin": 1130.04, "localEnd": 1138.16}, {"id": "c014_f000109", "text": "'I want it understood, Cornelius, that Hagrid has my full confidence,' said Dumbledore, frowning at Fudge.", "begin": 24369.42, "end": 24376.94, "localBegin": 1138.16, "localEnd": 1145.68}, {"id": "c014_f000110", "text": "'Look, Albus,' said Fudge, uncomfortably. 'Hagrid's record's against him. Ministry's got to do something - the school governors have been in touch.'", "begin": 24376.94, "end": 24386.9, "localBegin": 1145.68, "localEnd": 1155.64}, {"id": "c014_f000111", "text": "'Yet again, Cornelius, I tell you that taking Hagrid away will not help in the slightest,' said Dumbledore. His blue eyes were full of a fire Harry had never seen before.", "begin": 24386.9, "end": 24397.74, "localBegin": 1155.64, "localEnd": 1166.48}, {"id": "c014_f000112", "text": "'Look at it from my point of view,' said Fudge, fidgeting with his bowler. 'I'm under a lot of pressure. Got to be seen to be doing something. If it turns out it wasn't Hagrid, he'll be back and no more said. But I've got to take him. Got to. Wouldn't be doing my duty -'", "begin": 24397.74, "end": 24415.66, "localBegin": 1166.48, "localEnd": 1184.4}, {"id": "c014_f000113", "text": "'Take me?' said Hagrid, who was trembling. 'Take me where?'", "begin": 24415.66, "end": 24420.46, "localBegin": 1184.4, "localEnd": 1189.2}, {"id": "c014_f000114", "text": "'For a short stretch only,' said Fudge, not meeting Hagrid's eyes. 'Not a punishment, Hagrid, more a precaution. If someone else is caught, you'll be let out with a full apology ...'", "begin": 24420.46, "end": 24433.42, "localBegin": 1189.2, "localEnd": 1202.16}, {"id": "c014_f000115", "text": "'Not Azkaban?' croaked Hagrid.", "begin": 24433.42, "end": 24437.46, "localBegin": 1202.16, "localEnd": 1206.2}, {"id": "c014_f000116", "text": "Before Fudge could answer, there was another loud rap on the door.", "begin": 24437.46, "end": 24441.7, "localBegin": 1206.2, "localEnd": 1210.44}, {"id": "c014_f000117", "text": "Dumbledore answered it. It was Harry's turn for an elbow in the ribs: he'd let out an audible gasp.", "begin": 24441.7, "end": 24448.3, "localBegin": 1210.44, "localEnd": 1217.04}, {"id": "c014_f000118", "text": "Mr Lucius Malfoy strode into Hagrid's hut, swathed in a long black travelling cloak, smiling a cold and satisfied smile. Fang started to growl.", "begin": 24448.3, "end": 24459.98, "localBegin": 1217.04, "localEnd": 1228.72}, {"id": "c014_f000119", "text": "'Already here, Fudge,' he said approvingly. 'Good, good ...'", "begin": 24459.98, "end": 24465.46, "localBegin": 1228.72, "localEnd": 1234.2}, {"id": "c014_f000120", "text": "'What're you doin' here?' said Hagrid furiously. 'Get outta my house!'", "begin": 24465.46, "end": 24469.98, "localBegin": 1234.2, "localEnd": 1238.72}, {"id": "c014_f000121", "text": "'My dear man, please believe me, I have no pleasure at all in being inside your - er - d'you call this a house?' said Lucius Malfoy, sneering as he looked around the small cabin. 'I simply called at the school and was told that the Headmaster was here.'", "begin": 24469.98, "end": 24488.22, "localBegin": 1238.72, "localEnd": 1256.96}, {"id": "c014_f000122", "text": "'And what exactly did you want with me, Lucius?' said Dumbledore. He spoke politely, but the fire was still blazing in his blue eyes.", "begin": 24488.22, "end": 24497.62, "localBegin": 1256.96, "localEnd": 1266.36}, {"id": "c014_f000123", "text": "'Dreadful thing, Dumbledore,' said Mr Malfoy lazily, taking out a long roll of parchment, 'but the governors feel it's time for you to step aside. This is an Order of Suspension - you'll find all twelve signatures on it. I'm afraid we feel you're losing your touch. How many attacks have there been now? Two more this afternoon, wasn't it? At this rate, there'll be no Muggle-borns left at Hogwarts, and we all know what an awful loss that would be to the school.'", "begin": 24497.62, "end": 24531.58, "localBegin": 1266.36, "localEnd": 1300.32}, {"id": "c014_f000124", "text": "'Oh, now, see here, Lucius,' said Fudge, looking alarmed, 'Dumbledore suspended ... no, no ... last thing we want just now ...'", "begin": 24531.58, "end": 24542.74, "localBegin": 1300.32, "localEnd": 1311.48}, {"id": "c014_f000125", "text": "'The appointment - or suspension - of the Headmaster is a matter for the governors, Fudge,' said Mr Malfoy smoothly. 'And as Dumbledore has failed to stop these attacks ...'", "begin": 24542.74, "end": 24554.82, "localBegin": 1311.48, "localEnd": 1323.56}, {"id": "c014_f000126", "text": "'Now look, Lucius, if Dumbledore can't stop them -' said Fudge, whose upper lip was sweating now, 'I mean to say, who can?'", "begin": 24554.82, "end": 24562.62, "localBegin": 1323.56, "localEnd": 1331.36}, {"id": "c014_f000127", "text": "'That remains to be seen,' said Mr Malfoy, with a nasty smile. 'But as all twelve of us have voted ...'", "begin": 24562.62, "end": 24571.3, "localBegin": 1331.36, "localEnd": 1340.04}, {"id": "c014_f000128", "text": "Hagrid leapt to his feet, his shaggy black head grazing the ceiling.", "begin": 24571.3, "end": 24575.82, "localBegin": 1340.04, "localEnd": 1344.56}, {"id": "c014_f000129", "text": "'An' how many did yeh have ter threaten an' blackmail before they agreed, Malfoy, eh?' he roared.", "begin": 24575.82, "end": 24581.58, "localBegin": 1344.56, "localEnd": 1350.32}, {"id": "c014_f000130", "text": "'Dear, dear, you know, that temper of yours will lead you into trouble one of these days, Hagrid,' said Mr Malfoy. 'I would advise you not to shout at the Azkaban guards like that. They won't like it at all.'", "begin": 24581.58, "end": 24596.5, "localBegin": 1350.32, "localEnd": 1365.24}, {"id": "c014_f000131", "text": "'Yeh can' take Dumbledore!' yelled Hagrid, making Fang the boarhound cower and whimper in his basket. 'Take him away, an' the Muggle-borns won' stand a chance! There'll be killin's next!'", "begin": 24596.5, "end": 24609.02, "localBegin": 1365.24, "localEnd": 1377.76}, {"id": "c014_f000132", "text": "'Calm yourself, Hagrid,' said Dumbledore sharply. He looked at Lucius Malfoy.", "begin": 24609.02, "end": 24614.7, "localBegin": 1377.76, "localEnd": 1383.44}, {"id": "c014_f000133", "text": "'If the governors want my removal, Lucius, I shall of course step aside.'", "begin": 24614.7, "end": 24620.06, "localBegin": 1383.44, "localEnd": 1388.8}, {"id": "c014_f000134", "text": "'But -' stuttered Fudge.", "begin": 24620.06, "end": 24622.42, "localBegin": 1388.8, "localEnd": 1391.16}, {"id": "c014_f000135", "text": "'No!' growled Hagrid.", "begin": 24622.42, "end": 24625.22, "localBegin": 1391.16, "localEnd": 1393.96}, {"id": "c014_f000136", "text": "Dumbledore had not taken his bright blue eyes off Lucius Malfoy's cold grey ones.", "begin": 24625.22, "end": 24630.98, "localBegin": 1393.96, "localEnd": 1399.72}, {"id": "c014_f000137", "text": "'However,' said Dumbledore, speaking very slowly and clearly, so that none of them could miss a word, 'you will find that I will only truly have left this school when none here are loyal to me. You will also find that help will always be given at Hogwarts to those who ask for it.'", "begin": 24630.98, "end": 24650.98, "localBegin": 1399.72, "localEnd": 1419.72}, {"id": "c014_f000138", "text": "For a second, Harry was almost sure Dumbledore's eyes flickered towards the corner where he and Ron stood hidden.", "begin": 24650.98, "end": 24658.38, "localBegin": 1419.72, "localEnd": 1427.12}, {"id": "c014_f000139", "text": "'Admirable sentiments,' said Malfoy, bowing. 'We shall all miss your - er - highly individual way of running things, Albus, and only hope that your successor will manage to prevent any - ah - \"killin's\".'", "begin": 24658.38, "end": 24674.82, "localBegin": 1427.12, "localEnd": 1443.56}, {"id": "c014_f000140", "text": "He strode to the cabin door, opened it and bowed Dumbledore out. Fudge, fiddling with his bowler, waited for Hagrid to go ahead of him, but Hagrid stood his ground, took a deep breath and said carefully, 'If anyone wanted ter find out some stuff, all they'd have ter do would be ter follow the spiders. That'd lead 'em right! That's all I'm sayin'.'", "begin": 24674.82, "end": 24699.06, "localBegin": 1443.56, "localEnd": 1467.8}, {"id": "c014_f000141", "text": "Fudge stared at him in amazement.", "begin": 24699.06, "end": 24701.98, "localBegin": 1467.8, "localEnd": 1470.72}, {"id": "c014_f000142", "text": "'All right, I'm comin',' said Hagrid, pulling on his moleskin overcoat. But as he was about to follow Fudge through the door, he stopped again and said loudly, 'An' someone'll need ter feed Fang while I'm away.'", "begin": 24701.98, "end": 24715.38, "localBegin": 1470.72, "localEnd": 1484.12}, {"id": "c014_f000143", "text": "The door banged shut and Ron pulled the Invisibility Cloak off.", "begin": 24715.38, "end": 24720.54, "localBegin": 1484.12, "localEnd": 1489.28}, {"id": "c014_f000144", "text": "'We're in trouble now,' he said hoarsely. 'No Dumbledore. They might as well close the school tonight. There'll be an attack a day with him gone.'", "begin": 24720.54, "end": 24731.3, "localBegin": 1489.28, "localEnd": 1500.04}, {"id": "c014_f000145", "text": "Fang started howling, scratching at the closed door.", "begin": 24731.3, "end": 24738.26, "localBegin": 1500.04, "localEnd": 1507.0}]}, {"kind": "chapter", "number": 15, "title": "Aragog", "audio": "audio/chapter_015.mp3", "start": 24738.298, "end": 26523.298, "duration": 1785.0, "paragraphs": [{"id": "c015_f000001", "text": "Chapter Fifteen. Aragog.", "begin": 24738.298, "end": 24742.658, "localBegin": 0.0, "localEnd": 4.36}, {"id": "c015_f000002", "text": "Summer was creeping over the grounds around the castle; sky and lake alike turned periwinkle blue and flowers large as cabbages burst into bloom in the greenhouses. But with no Hagrid visible from the castle windows, striding the grounds with Fang at his heels, the scene didn't look right to Harry; no better, in fact, than the inside of the castle, where things were so horribly wrong.", "begin": 24742.658, "end": 24765.618, "localBegin": 4.36, "localEnd": 27.32}, {"id": "c015_f000003", "text": "Harry and Ron had tried to visit Hermione, but visitors were now barred from the hospital wing.", "begin": 24765.618, "end": 24771.818, "localBegin": 27.32, "localEnd": 33.52}, {"id": "c015_f000004", "text": "'We're taking no more chances,' Madam Pomfrey told them severely through a crack in the hospital door. 'No, I'm sorry, there's every chance the attacker might come back to finish these people off ...'", "begin": 24771.818, "end": 24784.978, "localBegin": 33.52, "localEnd": 46.68}, {"id": "c015_f000005", "text": "With Dumbledore gone, fear had spread as never before, so that the sun warming the castle walls outside seemed to stop at the mullioned windows. There was barely a face to be seen in the school that didn't look worried and tense, and any laughter that rang through the corridors sounded shrill and unnatural and was quickly stifled.", "begin": 24784.978, "end": 24804.858, "localBegin": 46.68, "localEnd": 66.56}, {"id": "c015_f000006", "text": "Harry constantly repeated Dumbledore's final words to himself. 'I will only truly have left this school when none here are loyal to me ... Help will always be given at Hogwarts to those who ask for it.' But what good were these words? Who exactly were they supposed to ask for help, when everyone was just as confused and scared as they were?", "begin": 24804.858, "end": 24827.738, "localBegin": 66.56, "localEnd": 89.44}, {"id": "c015_f000007", "text": "Hagrid's hint about the spiders was far easier to understand the trouble was, there didn't seem to be a single spider left in the castle to follow. Harry looked everywhere he went, helped (rather reluctantly) by Ron. They were hampered, of course, by the fact that they weren't allowed to wander off on their own, but had to move around the castle in a pack with the other Gryffindors. Most", "begin": 24827.738, "end": 24849.498, "localBegin": 89.44, "localEnd": 111.2}, {"id": "c015_f000008", "text": "of their fellow students seemed glad that they were being shepherded from class to class by teachers, but Harry found it very irksome.", "begin": 24849.498, "end": 24857.458, "localBegin": 111.2, "localEnd": 119.16}, {"id": "c015_f000009", "text": "One person, however, seemed to be thoroughly enjoying the atmosphere of terror and suspicion. Draco Malfoy was strutting around the school as though he had just been appointed Head Boy. Harry didn't realise what he was so pleased about until the Potions lesson about a fortnight after Dumbledore and Hagrid had left, when, sitting right behind Malfoy, Harry overheard him gloating to Crabbe and Goyle.", "begin": 24857.458, "end": 24881.578, "localBegin": 119.16, "localEnd": 143.28}, {"id": "c015_f000010", "text": "'I always thought Father might be the one who got rid of Dumbledore,' he said, not troubling to keep his voice down. 'I told you he thinks Dumbledore's the worst Headmaster the school's ever had. Maybe we'll get a decent Headmaster now. Someone who won't want the Chamber of Secrets closed. McGonagall won't last long, she's only filling in ...'", "begin": 24881.578, "end": 24902.418, "localBegin": 143.28, "localEnd": 164.12}, {"id": "c015_f000011", "text": "Snape swept past Harry, making no comment about Hermione's empty seat and cauldron.", "begin": 24902.418, "end": 24907.698, "localBegin": 164.12, "localEnd": 169.4}, {"id": "c015_f000012", "text": "'Sir,' said Malfoy loudly. 'Sir, why don't you apply for the Headmaster's job?'", "begin": 24907.698, "end": 24914.378, "localBegin": 169.4, "localEnd": 176.08}, {"id": "c015_f000013", "text": "'Now, now, Malfoy,' said Snape, though he couldn't suppress a thin-lipped smile. 'Professor Dumbledore has only been suspended by the governors. I dare say he'll be back with us soon enough.'", "begin": 24914.378, "end": 24926.938, "localBegin": 176.08, "localEnd": 188.64}, {"id": "c015_f000014", "text": "'Yeah, right,' said Malfoy, smirking. 'I expect you'd have Father's vote, sir, if you wanted to apply for the job. I'll tell Father you're the best teacher here, sir ...'", "begin": 24926.938, "end": 24938.938, "localBegin": 188.64, "localEnd": 200.64}, {"id": "c015_f000015", "text": "Snape smirked as he swept off around the dungeon, fortunately not spotting Seamus Finnigan, who was pretending to vomit into his cauldron.", "begin": 24938.938, "end": 24948.018, "localBegin": 200.64, "localEnd": 209.72}, {"id": "c015_f000016", "text": "'I'm quite surprised the Mudbloods haven't all packed their bags by now,' Malfoy went on. 'Bet you five Galleons the next one dies. Pity it wasn't Granger ...'", "begin": 24948.018, "end": 24960.058, "localBegin": 209.72, "localEnd": 221.76}, {"id": "c015_f000017", "text": "The bell rang at that moment, which was lucky; at Malfoy's last words, Ron had leapt off his stool, and in the scramble to collect bags and books, his attempts to reach Malfoy went unnoticed.", "begin": 24960.058, "end": 24971.458, "localBegin": 221.76, "localEnd": 233.16}, {"id": "c015_f000018", "text": "'Let me at him,' Ron growled, as Harry and Dean hung onto his arms. 'I don't care, I don't need my wand, I'm going to kill him with my bare hands -'", "begin": 24971.458, "end": 24980.498, "localBegin": 233.16, "localEnd": 242.2}, {"id": "c015_f000019", "text": "'Hurry up, I've got to take you all to Herbology,' barked Snape over the class's heads, and off they went, crocodile fashion, with", "begin": 24980.498, "end": 24987.178, "localBegin": 242.2, "localEnd": 248.88}, {"id": "c015_f000020", "text": "Harry, Ron and Dean bringing up the rear, Ron still trying to get loose. It was only safe to let go of him when Snape had seen them out of the castle, and they were making their way across the vegetable patch towards the greenhouses.", "begin": 24987.178, "end": 25001.418, "localBegin": 248.88, "localEnd": 263.12}, {"id": "c015_f000021", "text": "The Herbology class was very subdued; there were now two missing from their number, Justin and Hermione.", "begin": 25001.418, "end": 25009.338, "localBegin": 263.12, "localEnd": 271.04}, {"id": "c015_f000022", "text": "Professor Sprout set them all to work pruning the Abyssinian Shrivelfigs. Harry went to tip an armful of withered stalks onto the compost heap and found himself face to face with Ernie Macmillan. Ernie took a deep breath and said, very formally, 'I just want to say, Harry, that I'm sorry I ever suspected you. I know you'd never attack Hermione Granger, and I apologise for all the stuff I said. We're all in the same boat now, and, well -'", "begin": 25009.338, "end": 25039.418, "localBegin": 271.04, "localEnd": 301.12}, {"id": "c015_f000023", "text": "He held out a pudgy hand, and Harry shook it.", "begin": 25039.418, "end": 25043.058, "localBegin": 301.12, "localEnd": 304.76}, {"id": "c015_f000024", "text": "Ernie and his friend Hannah came to work at the same Shrivelfig as Harry and Ron.", "begin": 25043.058, "end": 25048.298, "localBegin": 304.76, "localEnd": 310.0}, {"id": "c015_f000025", "text": "'That Draco Malfoy character,' said Ernie, breaking off dead twigs, 'he seems very pleased about all this, doesn't he? D'you know, I think he might be Slytherin's heir.'", "begin": 25048.298, "end": 25060.938, "localBegin": 310.0, "localEnd": 322.64}, {"id": "c015_f000026", "text": "'That's clever of you,' said Ron, who didn't seem to have forgiven Ernie as readily as Harry.", "begin": 25060.938, "end": 25066.738, "localBegin": 322.64, "localEnd": 328.44}, {"id": "c015_f000027", "text": "'Do you think it's Malfoy, Harry?' Ernie asked.", "begin": 25066.738, "end": 25070.498, "localBegin": 328.44, "localEnd": 332.2}, {"id": "c015_f000028", "text": "'No,' said Harry, so firmly that Ernie and Hannah stared.", "begin": 25070.498, "end": 25075.218, "localBegin": 332.2, "localEnd": 336.92}, {"id": "c015_f000029", "text": "A second later, Harry spotted something that made him hit Ron over the hand with his pruning shears.", "begin": 25075.218, "end": 25086.938, "localBegin": 336.92, "localEnd": 348.64}, {"id": "c015_f000030", "text": "'Ouch! What're you -'", "begin": 25086.938, "end": 25088.698, "localBegin": 348.64, "localEnd": 350.4}, {"id": "c015_f000031", "text": "Harry was pointing at the ground a few feet away. Several large spiders were scurrying across the earth.", "begin": 25088.698, "end": 25098.498, "localBegin": 350.4, "localEnd": 360.2}, {"id": "c015_f000032", "text": "'Oh, yeah,' said Ron, trying, and failing, to look pleased. 'But we can't follow them now ...'", "begin": 25098.498, "end": 25105.898, "localBegin": 360.2, "localEnd": 367.6}, {"id": "c015_f000033", "text": "Ernie and Hannah were listening curiously.", "begin": 25105.898, "end": 25108.578, "localBegin": 367.6, "localEnd": 370.28}, {"id": "c015_f000034", "text": "Harry watched the spiders running away.", "begin": 25108.578, "end": 25113.658, "localBegin": 370.28, "localEnd": 375.36}, {"id": "c015_f000035", "text": "'Looks like they're heading for the Forbidden Forest ...'", "begin": 25113.658, "end": 25121.578, "localBegin": 375.36, "localEnd": 383.28}, {"id": "c015_f000036", "text": "And Ron looked even unhappier about that.", "begin": 25121.578, "end": 25125.418, "localBegin": 383.28, "localEnd": 387.12}, {"id": "c015_f000037", "text": "At the end of the lesson Professor Sprout escorted the class to their Defence Against the Dark Arts lesson. Harry and Ron lagged behind the others so they could talk out of earshot.", "begin": 25125.418, "end": 25136.258, "localBegin": 387.12, "localEnd": 397.96}, {"id": "c015_f000038", "text": "'We'll have to use the Invisibility Cloak again,' Harry told Ron. 'We can take Fang with us. He's used to going into the Forest with Hagrid, he might be some help.'", "begin": 25136.258, "end": 25145.578, "localBegin": 397.96, "localEnd": 407.28}, {"id": "c015_f000039", "text": "'Right,' said Ron, who was twirling his wand nervously in his fingers. 'Er - aren't there - aren't there supposed to be werewolves in the Forest?' he added, as they took their usual places at the back of Lockhart's classroom.", "begin": 25145.578, "end": 25158.698, "localBegin": 407.28, "localEnd": 420.4}, {"id": "c015_f000040", "text": "Preferring not to answer that question, Harry said, 'There are good things in there, too. The centaurs are all right, and the unicorns.'", "begin": 25158.698, "end": 25168.658, "localBegin": 420.4, "localEnd": 430.36}, {"id": "c015_f000041", "text": "Ron had never been into the Forbidden Forest before. Harry had entered it only once, and had hoped never to do so again.", "begin": 25168.658, "end": 25176.258, "localBegin": 430.36, "localEnd": 437.96}, {"id": "c015_f000042", "text": "Lockhart bounded into the room and the class stared at him. Every other teacher in the place was looking grimmer than usual, but Lockhart appeared nothing short of buoyant.", "begin": 25176.258, "end": 25185.618, "localBegin": 437.96, "localEnd": 447.32}, {"id": "c015_f000043", "text": "'Come now,' he cried, beaming around him, 'why all these long faces?'", "begin": 25185.618, "end": 25192.138, "localBegin": 447.32, "localEnd": 453.84}, {"id": "c015_f000044", "text": "People swapped exasperated looks, but nobody answered.", "begin": 25192.138, "end": 25196.378, "localBegin": 453.84, "localEnd": 458.08}, {"id": "c015_f000045", "text": "'Don't you people realise,' said Lockhart, speaking slowly, as though they were all a bit dim, 'the danger has passed! The culprit has been taken away.'", "begin": 25196.378, "end": 25207.658, "localBegin": 458.08, "localEnd": 469.36}, {"id": "c015_f000046", "text": "'Says who?' said Dean Thomas loudly.", "begin": 25207.658, "end": 25210.698, "localBegin": 469.36, "localEnd": 472.4}, {"id": "c015_f000047", "text": "'My dear young man, the Minister of Magic wouldn't have taken Hagrid if he hadn't been one hundred per cent sure that he was guilty,' said Lockhart, in the tone of someone explaining that one and one made two.", "begin": 25210.698, "end": 25225.498, "localBegin": 472.4, "localEnd": 487.2}, {"id": "c015_f000048", "text": "'Oh, yes he would,' said Ron, even more loudly than Dean.", "begin": 25225.498, "end": 25229.298, "localBegin": 487.2, "localEnd": 491.0}, {"id": "c015_f000049", "text": "'I flatter myself I know a touch more about Hagrid's arrest than you do, Mr Weasley,' said Lockhart in a self-satisfied tone.", "begin": 25229.298, "end": 25239.858, "localBegin": 491.0, "localEnd": 501.56}, {"id": "c015_f000050", "text": "Ron started to say that he didn't think so, somehow, but stopped in mid-sentence when Harry kicked him hard under the desk.", "begin": 25239.858, "end": 25246.698, "localBegin": 501.56, "localEnd": 508.4}, {"id": "c015_f000051", "text": "'We weren't there, remember?' Harry muttered.", "begin": 25246.698, "end": 25250.578, "localBegin": 508.4, "localEnd": 512.28}, {"id": "c015_f000052", "text": "But Lockhart's disgusting cheeriness, his hints that he had always thought Hagrid was no good, his confidence that the whole business was now at an end, irritated Harry so much that he yearned to throw Gadding with Ghouls right in Lockhart's stupid face. Instead he contented himself with scrawling a note to Ron: 'Let's do it tonight.'", "begin": 25250.578, "end": 25272.338, "localBegin": 512.28, "localEnd": 534.04}, {"id": "c015_f000053", "text": "Ron read the message, swallowed hard and looked sideways at the empty seat usually filled by Hermione. The sight seemed to stiffen his resolve, and he nodded. *", "begin": 25272.338, "end": 25285.218, "localBegin": 534.04, "localEnd": 546.92}, {"id": "c015_f000054", "text": "The Gryffindor common room was always very crowded these days, because from six o'clock onwards, the Gryffindors had nowhere else to go. They also had plenty to talk about, with the result that the common room often didn't empty until past midnight.", "begin": 25285.218, "end": 25297.898, "localBegin": 546.92, "localEnd": 559.6}, {"id": "c015_f000055", "text": "Harry went to get the Invisibility Cloak out of his trunk right after dinner, and spent the evening sitting on it, waiting for the room to clear. Fred and George challenged Harry and Ron to a few games of Exploding Snap and Ginny sat watching them, very subdued in Hermione's usual chair. Harry and Ron kept losing on purpose, trying to finish the games quickly, but even so, it was well past midnight when Fred, George and Ginny finally went to bed.", "begin": 25297.898, "end": 25324.618, "localBegin": 559.6, "localEnd": 586.32}, {"id": "c015_f000056", "text": "Harry and Ron waited for the distant sounds of two dormitory doors closing before seizing the Cloak, throwing it over themselves, and climbing through the portrait hole.", "begin": 25324.618, "end": 25334.818, "localBegin": 586.32, "localEnd": 596.52}, {"id": "c015_f000057", "text": "It was another difficult journey through the castle, dodging all the teachers. At last they reached the Entrance Hall, slid back the lock on the oak front doors, squeezed between them, trying to stop any creaking, and stepped out into the moonlit grounds.", "begin": 25334.818, "end": 25348.218, "localBegin": 596.52, "localEnd": 609.92}, {"id": "c015_f000058", "text": "''Course,' said Ron abruptly, as they strode across the black grass, 'we might get to the Forest and find there's nothing to follow. Those spiders might not've been going there at all. I know it looked like they were moving in that sort of general direction, but ...'", "begin": 25348.218, "end": 25363.258, "localBegin": 609.92, "localEnd": 624.96}, {"id": "c015_f000059", "text": "His voice tailed away hopefully.", "begin": 25363.258, "end": 25366.218, "localBegin": 624.96, "localEnd": 627.92}, {"id": "c015_f000060", "text": "They reached Hagrid's house, sad and sorry-looking with its blank windows. When Harry pushed the door open, Fang went mad with joy at the sight of them. Worried he might wake everyone at the castle with his deep, booming barks, they hastily fed him treacle fudge from a tin on the mantelpiece, which glued his teeth together.", "begin": 25366.218, "end": 25385.058, "localBegin": 627.92, "localEnd": 646.76}, {"id": "c015_f000061", "text": "Harry left the Invisibility Cloak on Hagrid's table. There would be no need for it in the pitch-dark Forest.", "begin": 25385.058, "end": 25391.178, "localBegin": 646.76, "localEnd": 652.88}, {"id": "c015_f000062", "text": "'C'mon, Fang, we're going for a walk,' said Harry, patting his leg, and Fang bounded happily out of the house behind them, dashed to the edge of the Forest and lifted his leg against a large sycamore tree.", "begin": 25391.178, "end": 25403.178, "localBegin": 652.88, "localEnd": 664.88}, {"id": "c015_f000063", "text": "Harry took out his wand, murmured, 'Lumos!' and a tiny light appeared at the end of it, just enough to let them watch the path", "begin": 25403.178, "end": 25411.338, "localBegin": 664.88, "localEnd": 673.04}, {"id": "c015_f000064", "text": "for signs of spiders.", "begin": 25411.338, "end": 25412.858, "localBegin": 673.04, "localEnd": 674.56}, {"id": "c015_f000065", "text": "'Good thinking,' said Ron. 'I'd light mine too, but you know it'd probably blow up or something ...'", "begin": 25412.858, "end": 25418.338, "localBegin": 674.56, "localEnd": 680.04}, {"id": "c015_f000066", "text": "Harry tapped Ron on the shoulder, pointing at the grass. Two solitary spiders were hurrying away from the wandlight into the shade of the trees.", "begin": 25418.338, "end": 25427.658, "localBegin": 680.04, "localEnd": 689.36}, {"id": "c015_f000067", "text": "'OK,' Ron sighed, as though resigned to the worst, 'I'm ready. Let's go.'", "begin": 25427.658, "end": 25432.978, "localBegin": 689.36, "localEnd": 694.68}, {"id": "c015_f000068", "text": "So, with Fang scampering around them, sniffing tree roots and leaves, they entered the Forest. By the glow of Harry's wand, they followed the steady trickle of spiders moving along the path. They walked for about twenty minutes, not speaking, listening hard for noises other than breaking twigs and rustling leaves. Then, when the trees had become thicker than ever, so that the stars overhead were no longer visible, and Harry's wand shone alone in the sea of dark, they saw their spider guides leaving the path.", "begin": 25432.978, "end": 25465.818, "localBegin": 694.68, "localEnd": 727.52}, {"id": "c015_f000069", "text": "Harry paused, trying to see where the spiders were going, but everything outside his little sphere of light was pitch black. He had never been this deep into the Forest before. He could vividly remember Hagrid advising him not to leave the Forest path last time he'd been in here. But Hagrid was miles away now, probably sitting in a cell in Azkaban, and he had also said to follow the spiders.", "begin": 25465.818, "end": 25490.178, "localBegin": 727.52, "localEnd": 751.88}, {"id": "c015_f000070", "text": "Something wet touched Harry's hand and he jumped backwards, crushing Ron's foot, but it was only Fang's nose.", "begin": 25490.178, "end": 25497.298, "localBegin": 751.88, "localEnd": 759.0}, {"id": "c015_f000071", "text": "'What d'you reckon?' Harry said to Ron, whose eyes he could just make out, reflecting the light from his wand.", "begin": 25497.298, "end": 25503.058, "localBegin": 759.0, "localEnd": 764.76}, {"id": "c015_f000072", "text": "'We've come this far,' said Ron.", "begin": 25503.058, "end": 25505.538, "localBegin": 764.76, "localEnd": 767.24}, {"id": "c015_f000073", "text": "So they followed the darting shadows of the spiders into the trees. They couldn't move very quickly now; there were tree roots and stumps in their way, barely visible in the near blackness. Harry could feel Fang's hot breath on his hand. More than once, they had to stop, so that Harry could crouch down and find the spiders in the wandlight.", "begin": 25505.538, "end": 25525.978, "localBegin": 767.24, "localEnd": 787.68}, {"id": "c015_f000074", "text": "They walked for what seemed like at least half an hour, their robes snagging on low-slung branches and brambles. After a while, they noticed that the ground seemed to be sloping downwards, though the trees were as thick as ever.", "begin": 25525.978, "end": 25539.018, "localBegin": 787.68, "localEnd": 800.72}, {"id": "c015_f000075", "text": "Then Fang suddenly let loose a great, echoing bark, making both Harry and Ron jump out of their skins.", "begin": 25539.018, "end": 25544.898, "localBegin": 800.72, "localEnd": 806.6}, {"id": "c015_f000076", "text": "'What?' said Ron loudly, looking around into the pitch dark, and gripping Harry's elbow very hard.", "begin": 25544.898, "end": 25551.858, "localBegin": 806.6, "localEnd": 813.56}, {"id": "c015_f000077", "text": "'There's something moving over there,' Harry breathed. 'Listen ... Sounds like something big.'", "begin": 25551.858, "end": 25558.898, "localBegin": 813.56, "localEnd": 820.6}, {"id": "c015_f000078", "text": "They listened. Some distance to their right, the something big was snapping branches as it carved a path through the trees.", "begin": 25558.898, "end": 25568.698, "localBegin": 820.6, "localEnd": 830.4}, {"id": "c015_f000079", "text": "'Oh no,' said Ron. 'Oh no, oh no, oh -'", "begin": 25568.698, "end": 25574.898, "localBegin": 830.4, "localEnd": 836.6}, {"id": "c015_f000080", "text": "'Shut up,' said Harry frantically. 'It'll hear you.'", "begin": 25574.898, "end": 25578.618, "localBegin": 836.6, "localEnd": 840.32}, {"id": "c015_f000081", "text": "'Hear me?' said Ron in an unnaturally high voice. 'It's already heard Fang!'", "begin": 25578.618, "end": 25583.338, "localBegin": 840.32, "localEnd": 845.04}, {"id": "c015_f000082", "text": "The darkness seemed to be pressing on their eyeballs as they stood, terrified, waiting. There was a strange rumbling noise and then silence.", "begin": 25583.338, "end": 25593.658, "localBegin": 845.04, "localEnd": 855.36}, {"id": "c015_f000083", "text": "'What d'you think it's doing?' said Harry.", "begin": 25593.658, "end": 25596.058, "localBegin": 855.36, "localEnd": 857.76}, {"id": "c015_f000084", "text": "'Probably getting ready to pounce,' said Ron.", "begin": 25596.058, "end": 25600.938, "localBegin": 857.76, "localEnd": 862.64}, {"id": "c015_f000085", "text": "They waited, shivering, hardly daring to move.", "begin": 25600.938, "end": 25604.418, "localBegin": 862.64, "localEnd": 866.12}, {"id": "c015_f000086", "text": "'D'you think it's gone?' Harry whispered.", "begin": 25604.418, "end": 25608.298, "localBegin": 866.12, "localEnd": 870.0}, {"id": "c015_f000087", "text": "'Dunno -'", "begin": 25608.298, "end": 25609.698, "localBegin": 870.0, "localEnd": 871.4}, {"id": "c015_f000088", "text": "Then, to their right, came a sudden blaze of light, so bright in the darkness that both of them flung up their hands to shield their eyes. Fang yelped and tried to run, but got lodged in a tangle of thorns and yelped even louder.", "begin": 25609.698, "end": 25623.538, "localBegin": 871.4, "localEnd": 885.24}, {"id": "c015_f000089", "text": "'Harry!' Ron shouted, his voice breaking with relief. 'Harry, it's our car!'", "begin": 25623.538, "end": 25629.698, "localBegin": 885.24, "localEnd": 891.4}, {"id": "c015_f000090", "text": "'What?'", "begin": 25629.698, "end": 25630.058, "localBegin": 891.4, "localEnd": 891.76}, {"id": "c015_f000091", "text": "'Come on!'", "begin": 25630.058, "end": 25631.498, "localBegin": 891.76, "localEnd": 893.2}, {"id": "c015_f000092", "text": "Harry blundered after Ron towards the light, stumbling and tripping, and a moment later they had emerged into a clearing.", "begin": 25631.498, "end": 25637.618, "localBegin": 893.2, "localEnd": 899.32}, {"id": "c015_f000093", "text": "Mr Weasley's car was standing, empty, in the middle of a circle of thick trees under a roof of dense branches, its headlamps ablaze. As Ron walked, open-mouthed, towards it, it moved slowly towards him, exactly like a large, turquoise dog greeting its owner.", "begin": 25637.618, "end": 25656.778, "localBegin": 899.32, "localEnd": 918.48}, {"id": "c015_f000094", "text": "'It's been here all the time!' said Ron delightedly, walking around the car. 'Look at it. The Forest's turned it wild ...'", "begin": 25656.778, "end": 25664.738, "localBegin": 918.48, "localEnd": 926.44}, {"id": "c015_f000095", "text": "The wings of the car were scratched and smeared with mud. Apparently it had taken to trundling around the Forest on its own. Fang didn't seem at all keen on it; he kept close to Harry, who could feel him quivering. His breathing slowing down again, Harry stuffed his wand back into his robes.", "begin": 25664.738, "end": 25682.618, "localBegin": 926.44, "localEnd": 944.32}, {"id": "c015_f000096", "text": "'And we thought it was going to attack us!' said Ron, leaning against the car and patting it. 'I wondered where it had gone!'", "begin": 25682.618, "end": 25690.218, "localBegin": 944.32, "localEnd": 951.92}, {"id": "c015_f000097", "text": "Harry squinted around on the floodlit ground for signs of more spiders, but they had all scuttled away from the glare of the headlights.", "begin": 25690.218, "end": 25698.898, "localBegin": 951.92, "localEnd": 960.6}, {"id": "c015_f000098", "text": "'We've lost the trail,' he said. 'C'mon, let's go and find them.'", "begin": 25698.898, "end": 25702.298, "localBegin": 960.6, "localEnd": 964.0}, {"id": "c015_f000099", "text": "Ron didn't speak. He didn't move. His eyes were fixed on a point some ten feet above the Forest floor, right behind Harry. His face was livid with terror.", "begin": 25702.298, "end": 25714.938, "localBegin": 964.0, "localEnd": 976.64}, {"id": "c015_f000100", "text": "Harry didn't even have time to turn around. There was a loud clicking noise and suddenly he felt something long and hairy seize him around the middle and lift him off the ground, so that he was hanging, face down. Struggling, terrified, he heard more clicking, and saw Ron's legs leave the ground too, heard Fang whimpering and howling - next moment, he was being swept away into the dark trees.", "begin": 25714.938, "end": 25737.058, "localBegin": 976.64, "localEnd": 998.76}, {"id": "c015_f000101", "text": "Head hanging, Harry saw that what had hold of him was marching on six immensely long, hairy legs, the front two clutching him tightly below a pair of shining black pincers. Behind him, he could hear another of the creatures, no doubt carrying Ron. They were moving into the very heart of the Forest. Harry could hear Fang fighting to free himself from a third monster, whining loudly, but Harry couldn't have yelled even if he had wanted to; he seemed to have left his voice back with the car in the clearing.", "begin": 25737.058, "end": 25767.138, "localBegin": 998.76, "localEnd": 1028.84}, {"id": "c015_f000102", "text": "He never knew how long he was in the creature's clutches; he only knew that the darkness suddenly lifted enough for him to see that the leaf-strewn ground was now swarming with spiders. Craning his neck sideways, he realised that they had reached the rim of a vast hollow, a hollow which had been cleared of trees, so that the stars shone brightly onto the worst scene he had ever clapped eyes upon.", "begin": 25767.138, "end": 25792.498, "localBegin": 1028.84, "localEnd": 1054.2}, {"id": "c015_f000103", "text": "Spiders. Not tiny spiders like those surging over the leaves below. Spiders the size of carthorses, eight-eyed, eight-legged, black, hairy, gigantic. The massive specimen that was carrying Harry made its way down the steep slope, towards a misty domed web in the very centre of the hollow, while its fellows closed in all around it, clicking their pincers excitedly at the sight of its load.", "begin": 25792.498, "end": 25822.458, "localBegin": 1054.2, "localEnd": 1084.16}, {"id": "c015_f000104", "text": "Harry fell to the ground on all fours as the spider released him. Ron and Fang thudded down next to him. Fang wasn't howling any more, but cowering silently on the spot. Ron looked exactly", "begin": 25822.458, "end": 25837.258, "localBegin": 1084.16, "localEnd": 1098.96}, {"id": "c015_f000105", "text": "like Harry felt. His mouth was stretched wide in a kind of silent scream and his eyes were popping.", "begin": 25837.258, "end": 25843.938, "localBegin": 1098.96, "localEnd": 1105.64}, {"id": "c015_f000106", "text": "Harry suddenly realised that the spider which had dropped him was saying something. It had been hard to tell, because he clicked his pincers with every word he spoke.", "begin": 25843.938, "end": 25854.698, "localBegin": 1105.64, "localEnd": 1116.4}, {"id": "c015_f000107", "text": "'Aragog!' it called. 'Aragog!'", "begin": 25854.698, "end": 25859.858, "localBegin": 1116.4, "localEnd": 1121.56}, {"id": "c015_f000108", "text": "And from the middle of the misty domed web, a spider the size of a small elephant emerged, very slowly. There was grey in the black of his body and legs, and each of the eyes on his ugly, pincered head was milky white. He was blind.", "begin": 25859.858, "end": 25876.938, "localBegin": 1121.56, "localEnd": 1138.64}, {"id": "c015_f000109", "text": "'What is it?' he said, clicking his pincers rapidly.", "begin": 25876.938, "end": 25881.738, "localBegin": 1138.64, "localEnd": 1143.44}, {"id": "c015_f000110", "text": "'Men,' clicked the spider who had caught Harry.", "begin": 25881.738, "end": 25885.698, "localBegin": 1143.44, "localEnd": 1147.4}, {"id": "c015_f000111", "text": "'Is it Hagrid?' said Aragog, moving closer, his eight milky eyes wandering vaguely.", "begin": 25885.698, "end": 25893.258, "localBegin": 1147.4, "localEnd": 1154.96}, {"id": "c015_f000112", "text": "'Strangers,' clicked the spider who had brought Ron.", "begin": 25893.258, "end": 25897.898, "localBegin": 1154.96, "localEnd": 1159.6}, {"id": "c015_f000113", "text": "'Kill them,' clicked Aragog fretfully. 'I was sleeping ...'", "begin": 25897.898, "end": 25903.618, "localBegin": 1159.6, "localEnd": 1165.32}, {"id": "c015_f000114", "text": "'We're friends of Hagrid's,' Harry shouted. His heart seemed to have left his chest to pound in his throat.", "begin": 25903.618, "end": 25911.058, "localBegin": 1165.32, "localEnd": 1172.76}, {"id": "c015_f000115", "text": "Click, click, click went the pincers of the spiders all around the hollow.", "begin": 25911.058, "end": 25915.618, "localBegin": 1172.76, "localEnd": 1177.32}, {"id": "c015_f000116", "text": "Aragog paused.", "begin": 25915.618, "end": 25917.498, "localBegin": 1177.32, "localEnd": 1179.2}, {"id": "c015_f000117", "text": "'Hagrid has never sent men into our hollow before,' he said slowly.", "begin": 25917.498, "end": 25923.938, "localBegin": 1179.2, "localEnd": 1185.64}, {"id": "c015_f000118", "text": "'Hagrid's in trouble,' said Harry, breathing very fast. 'That's why we've come.'", "begin": 25923.938, "end": 25928.858, "localBegin": 1185.64, "localEnd": 1190.56}, {"id": "c015_f000119", "text": "'In trouble?' said the aged spider, and Harry thought he heard concern beneath the clicking pincers. 'But why has he sent you?'", "begin": 25928.858, "end": 25939.538, "localBegin": 1190.56, "localEnd": 1201.24}, {"id": "c015_f000120", "text": "Harry thought of getting to his feet, but decided against it; he didn't think his legs would support him. So he spoke from the ground, as calmly as he could.", "begin": 25939.538, "end": 25949.218, "localBegin": 1201.24, "localEnd": 1210.92}, {"id": "c015_f000121", "text": "'They think, up at the school, that Hagrid's been setting a - a something on students. They've taken him to Azkaban.'", "begin": 25949.218, "end": 25959.258, "localBegin": 1210.92, "localEnd": 1220.96}, {"id": "c015_f000122", "text": "Aragog clicked his pincers furiously, and all around the hollow the sound was echoed by the crowd of spiders; it was like applause, except applause didn't usually make Harry feel sick with fear.", "begin": 25959.258, "end": 25971.218, "localBegin": 1220.96, "localEnd": 1232.92}, {"id": "c015_f000123", "text": "'But that was years ago,' said Aragog fretfully. 'Years and years ago. I remember it well. That's why they made him leave the school. They believed that I was the monster that dwells in what they call the Chamber of Secrets. They thought that Hagrid had", "begin": 25971.218, "end": 25994.418, "localBegin": 1232.92, "localEnd": 1256.12}, {"id": "c015_f000124", "text": "opened the Chamber and set me free.'", "begin": 25994.418, "end": 25997.378, "localBegin": 1256.12, "localEnd": 1259.08}, {"id": "c015_f000125", "text": "'And you ... you didn't come from the Chamber of Secrets?' said Harry, who could feel cold sweat on his forehead.", "begin": 25997.378, "end": 26006.738, "localBegin": 1259.08, "localEnd": 1268.44}, {"id": "c015_f000126", "text": "'I!' said Aragog, clicking angrily. 'I was not born in the castle. I come from a distant land. A traveller gave me to Hagrid when I was an egg. Hagrid was only a boy, but he cared for me, hidden in a cupboard in the castle, feeding me on scraps from the table. Hagrid is my good friend, and a good man. When I was discovered, and blamed for the death of a girl, he protected me. I have lived here in the Forest ever since, where Hagrid still visits me. He even found me a wife, Mosag, and you see how our family has grown, all through Hagrid's goodness ...'", "begin": 26006.738, "end": 26055.418, "localBegin": 1268.44, "localEnd": 1317.12}, {"id": "c015_f000127", "text": "Harry summoned what remained of his courage.", "begin": 26055.418, "end": 26059.218, "localBegin": 1317.12, "localEnd": 1320.92}, {"id": "c015_f000128", "text": "'So you never - never attacked anyone?'", "begin": 26059.218, "end": 26064.618, "localBegin": 1320.92, "localEnd": 1326.32}, {"id": "c015_f000129", "text": "'Never,' croaked the old spider. 'It would have been my instinct, but from respect of Hagrid, I never harmed a human. The body of the girl who was killed was discovered in a bathroom. I never saw any part of the castle but the cupboard in which I grew up. Our kind like the dark and the quiet ...'", "begin": 26064.618, "end": 26089.418, "localBegin": 1326.32, "localEnd": 1351.12}, {"id": "c015_f000130", "text": "'But then ... Do you know what did kill that girl?' said Harry. 'Because whatever it is, it's back and attacking people again -'", "begin": 26089.418, "end": 26099.578, "localBegin": 1351.12, "localEnd": 1361.28}, {"id": "c015_f000131", "text": "His words were drowned by a loud outbreak of clicking and the rustling of many long legs shifting angrily; large black shapes shifted all around him.", "begin": 26099.578, "end": 26109.298, "localBegin": 1361.28, "localEnd": 1371.0}, {"id": "c015_f000132", "text": "'The thing that lives in the castle,' said Aragog, 'is an ancient creature we spiders fear above all others. Well do I remember how I pleaded with Hagrid to let me go, when I sensed the beast moving about the school.'", "begin": 26109.298, "end": 26126.938, "localBegin": 1371.0, "localEnd": 1388.64}, {"id": "c015_f000133", "text": "'What is it?' said Harry urgently.", "begin": 26126.938, "end": 26130.778, "localBegin": 1388.64, "localEnd": 1392.48}, {"id": "c015_f000134", "text": "More loud clicking, more rustling; the spiders seemed to be closing in.", "begin": 26130.778, "end": 26135.218, "localBegin": 1392.48, "localEnd": 1396.92}, {"id": "c015_f000135", "text": "'We do not speak of it!' said Aragog fiercely. 'We do not name it! I never even told Hagrid the name of that dread creature, though he asked me, many times.'", "begin": 26135.218, "end": 26148.298, "localBegin": 1396.92, "localEnd": 1410.0}, {"id": "c015_f000136", "text": "Harry didn't want to press the subject, not with the spiders pressing closer on all sides. Aragog seemed to be tired of talking. He was backing slowly into his domed web, but his fellow spiders continued to inch slowly towards Harry and Ron.", "begin": 26148.298, "end": 26165.018, "localBegin": 1410.0, "localEnd": 1426.72}, {"id": "c015_f000137", "text": "'We'll just go, then,' Harry called desperately to Aragog, hearing leaves rustling behind him.", "begin": 26165.018, "end": 26171.778, "localBegin": 1426.72, "localEnd": 1433.48}, {"id": "c015_f000138", "text": "'Go?' said Aragog slowly. 'I think not ...'", "begin": 26171.778, "end": 26177.778, "localBegin": 1433.48, "localEnd": 1439.48}, {"id": "c015_f000139", "text": "'But - but -'", "begin": 26177.778, "end": 26178.978, "localBegin": 1439.48, "localEnd": 1440.68}, {"id": "c015_f000140", "text": "'My sons and daughters do not harm Hagrid, on my command. But I cannot deny them fresh meat, when it wanders so willingly into our midst. Goodbye, friend of Hagrid.'", "begin": 26178.978, "end": 26194.258, "localBegin": 1440.68, "localEnd": 1455.96}, {"id": "c015_f000141", "text": "Harry spun around. Feet away, towering above him, was a solid wall of spiders, clicking, their many eyes gleaming in their ugly black heads ...", "begin": 26194.258, "end": 26204.338, "localBegin": 1455.96, "localEnd": 1466.04}, {"id": "c015_f000142", "text": "Even as he reached for his wand, Harry knew it was no good, there were too many of them, but as he tried to stand, ready to die fighting, a loud, long note sounded, and a blaze of light flamed through the hollow.", "begin": 26204.338, "end": 26216.578, "localBegin": 1466.04, "localEnd": 1478.28}, {"id": "c015_f000143", "text": "Mr Weasley's car was thundering down the slope, headlamps glaring, its horn screeching, knocking spiders aside; several were thrown onto their backs, their endless legs waving in the air. The car screeched to a halt in front of Harry and Ron and the doors flew open.", "begin": 26216.578, "end": 26232.618, "localBegin": 1478.28, "localEnd": 1494.32}, {"id": "c015_f000144", "text": "'Get Fang!' Harry yelled, diving into the front seat; Ron seized the boarhound round the middle and threw him, yelping, into the back of the car. The doors slammed shut. Ron didn't touch the accelerator but the car didn't need him; the engine roared and they were off, hitting more spiders. They sped up the slope, out of the hollow, and they were soon crashing through the Forest, branches whipping the windows as the car wound its way cleverly through the widest gaps, following a path it obviously knew.", "begin": 26232.618, "end": 26261.938, "localBegin": 1494.32, "localEnd": 1523.64}, {"id": "c015_f000145", "text": "Harry looked sideways at Ron. His mouth was still open in the silent scream, but his eyes weren't popping any more.", "begin": 26261.938, "end": 26270.618, "localBegin": 1523.64, "localEnd": 1532.32}, {"id": "c015_f000146", "text": "'Are you OK?'", "begin": 26270.618, "end": 26272.498, "localBegin": 1532.32, "localEnd": 1534.2}, {"id": "c015_f000147", "text": "Ron stared straight ahead, unable to speak.", "begin": 26272.498, "end": 26276.178, "localBegin": 1534.2, "localEnd": 1537.88}, {"id": "c015_f000148", "text": "They smashed their way through the undergrowth, Fang howling loudly in the back seat, and Harry saw the wing mirror snap off as they squeezed past a large oak. After ten noisy, rocky minutes, the trees thinned, and Harry could again see patches of sky.", "begin": 26276.178, "end": 26292.458, "localBegin": 1537.88, "localEnd": 1554.16}, {"id": "c015_f000149", "text": "The car stopped so suddenly that they were nearly thrown into the windscreen. They had reached the edge of the Forest. Fang flung himself at the window in his anxiety to get out and when Harry opened the door, he shot off through the trees to Hagrid's house, tail between his legs. Harry got out too, and after a minute or so, Ron seemed to regain the feeling in his limbs and followed, still stiff-necked and staring. Harry gave the car a grateful pat as it", "begin": 26292.458, "end": 26321.938, "localBegin": 1554.16, "localEnd": 1583.64}, {"id": "c015_f000150", "text": "reversed back into the Forest and disappeared from view.", "begin": 26321.938, "end": 26325.378, "localBegin": 1583.64, "localEnd": 1587.08}, {"id": "c015_f000151", "text": "Harry went back into Hagrid's cabin to get the Invisibility Cloak. Fang was trembling under a blanket in his basket. When Harry got outside again, he found Ron being violently sick in the pumpkin patch.", "begin": 26325.378, "end": 26338.178, "localBegin": 1587.08, "localEnd": 1599.88}, {"id": "c015_f000152", "text": "'Follow the spiders,' said Ron weakly, wiping his mouth on his sleeve. 'I'll never forgive Hagrid. We're lucky to be alive.'", "begin": 26338.178, "end": 26347.778, "localBegin": 1599.88, "localEnd": 1609.48}, {"id": "c015_f000153", "text": "'I bet he thought Aragog wouldn't hurt friends of his,' said Harry.", "begin": 26347.778, "end": 26352.418, "localBegin": 1609.48, "localEnd": 1614.12}, {"id": "c015_f000154", "text": "'That's exactly Hagrid's problem!' said Ron, thumping the wall of the cabin. 'He always thinks monsters aren't as bad as they're made out, and look where it's got him! A cell in Azkaban!' He was shivering uncontrollably now. 'What was the point of sending us in there? What have we found out, I'd like to know?'", "begin": 26352.418, "end": 26369.938, "localBegin": 1614.12, "localEnd": 1631.64}, {"id": "c015_f000155", "text": "'That Hagrid never opened the Chamber of Secrets,' said Harry, throwing the cloak over Ron and prodding him in the arm to make him walk. 'He was innocent.'", "begin": 26369.938, "end": 26380.458, "localBegin": 1631.64, "localEnd": 1642.16}, {"id": "c015_f000156", "text": "Ron gave a loud snort. Evidently, hatching Aragog out in a cupboard wasn't his idea of being innocent.", "begin": 26380.458, "end": 26387.858, "localBegin": 1642.16, "localEnd": 1649.56}, {"id": "c015_f000157", "text": "As the castle loomed nearer Harry twitched the Cloak to make sure their feet were hidden, then pushed the creaking front doors ajar. They walked carefully back across the Entrance Hall and up the marble staircase, holding their breath as they passed corridors where watchful sentries were walking. At last they reached the safety of the Gryffindor common room, where the fire had burned itself into glowing ash. They took off the Cloak and climbed the winding staircase to their dormitory.", "begin": 26387.858, "end": 26416.498, "localBegin": 1649.56, "localEnd": 1678.2}, {"id": "c015_f000158", "text": "Ron fell onto his bed without bothering to get undressed. Harry, however, didn't fee
