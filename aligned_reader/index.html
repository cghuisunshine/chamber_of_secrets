gin": 17513.988, "end": 17518.948, "localBegin": 568.8, "localEnd": 573.76}, {"id": "c011_f000047", "text": "'It'll be ready in a fortnight,' she said happily.", "begin": 17518.948, "end": 17522.668, "localBegin": 573.76, "localEnd": 577.48}, {"id": "c011_f000048", "text": "'Snape can't prove it was you,' said Ron reassuringly to Harry. 'What can he do?'", "begin": 17522.668, "end": 17528.588, "localBegin": 577.48, "localEnd": 583.4}, {"id": "c011_f000049", "text": "'Knowing Snape, something foul,' said Harry, as the potion frothed and bubbled. * A week later, Harry, Ron and Hermione were walking across the Entrance Hall when they saw a small knot of people gathered around the noticeboard, reading a piece of parchment that had just been pinned up. Seamus Finnigan and Dean Thomas beckoned them over, looking excited.", "begin": 17528.588, "end": 17552.308, "localBegin": 583.4, "localEnd": 607.12}, {"id": "c011_f000050", "text": "'They're starting a Duelling Club!' said Seamus. 'First meeting tonight! I wouldn't mind duelling lessons, they might come in handy one of these days ...'", "begin": 17552.308, "end": 17560.788, "localBegin": 607.12, "localEnd": 615.6}, {"id": "c011_f000051", "text": "'What, you reckon Slytherin's monster can duel?' said Ron, but he too read the sign with interest.", "begin": 17560.788, "end": 17566.468, "localBegin": 615.6, "localEnd": 621.28}, {"id": "c011_f000052", "text": "'Could be useful,' he said to Harry and Hermione as they went into dinner. 'Shall we go?'", "begin": 17566.468, "end": 17573.468, "localBegin": 621.28, "localEnd": 628.28}, {"id": "c011_f000053", "text": "Harry and Hermione were all for it, so at eight o'clock that evening they hurried back to the Great Hall. The long dining tables had vanished and a golden stage had appeared along one wall, lit by thousands of candles floating overhead. The ceiling was velvety black once more and most of the school seemed to be packed beneath it, all carrying their wands and looking excited.", "begin": 17573.468, "end": 17595.828, "localBegin": 628.28, "localEnd": 650.64}, {"id": "c011_f000054", "text": "'I wonder who'll be teaching us?' said Hermione, as they edged into the chattering crowd. 'Someone told me Flitwick was a duelling champion when he was young, maybe it'll be him.'", "begin": 17595.828, "end": 17606.428, "localBegin": 650.64, "localEnd": 661.24}, {"id": "c011_f000055", "text": "'As long as it's not -' Harry began, but he ended on a groan: Gilderoy Lockhart was walking onto the stage, resplendent in robes of deep plum and accompanied by none other than Snape, wearing his usual black.", "begin": 17606.428, "end": 17621.988, "localBegin": 661.24, "localEnd": 676.8}, {"id": "c011_f000056", "text": "Lockhart waved an arm for silence and called, 'Gather round, gather round! Can everyone see me? Can you all hear me? Excellent!", "begin": 17621.988, "end": 17632.988, "localBegin": 676.8, "localEnd": 687.8}, {"id": "c011_f000057", "text": "'Now, Professor Dumbledore has granted me permission to start this little Duelling Club, to train you all up in case you ever need to defend yourselves as I myself have done on countless occasions - for full details, see my published works.", "begin": 17632.988, "end": 17650.708, "localBegin": 687.8, "localEnd": 705.52}, {"id": "c011_f000058", "text": "'Let me introduce my assistant Professor Snape,' said Lockhart, flashing a wide smile. 'He tells me he knows a tiny little bit about duelling himself and has sportingly agreed to help me with a short demonstration before we begin. Now, I don't want any of you youngsters to worry - you'll still have your Potions master when I'm through with him, never fear!'", "begin": 17650.708, "end": 17678.228, "localBegin": 705.52, "localEnd": 733.04}, {"id": "c011_f000059", "text": "'Wouldn't it be good if they finished each other off?' Ron muttered in Harry's ear.", "begin": 17678.228, "end": 17684.028, "localBegin": 733.04, "localEnd": 738.84}, {"id": "c011_f000060", "text": "Snape's upper lip was curling. Harry wondered why Lockhart was still smiling; if Snape had been looking at him like that he'd have been running as fast as he could in the opposite direction.", "begin": 17684.028, "end": 17695.668, "localBegin": 738.84, "localEnd": 750.48}, {"id": "c011_f000061", "text": "Lockhart and Snape turned to face each other and bowed; at least, Lockhart did, with much twirling of his hands, whereas Snape jerked his head irritably. Then they raised their wands like swords in front of them.", "begin": 17695.668, "end": 17708.868, "localBegin": 750.48, "localEnd": 763.68}, {"id": "c011_f000062", "text": "'As you see, we are holding our wands in the accepted combative position,' Lockhart told the silent crowd. 'On the count of three, we will cast our first spells. Neither of us will be aiming to kill, of course.'", "begin": 17708.868, "end": 17725.028, "localBegin": 763.68, "localEnd": 779.84}, {"id": "c011_f000063", "text": "'I wouldn't bet on that,' Harry murmured, watching Snape baring his teeth.", "begin": 17725.028, "end": 17729.748, "localBegin": 779.84, "localEnd": 784.56}, {"id": "c011_f000064", "text": "'One - two - three -'", "begin": 17729.748, "end": 17733.428, "localBegin": 784.56, "localEnd": 788.24}, {"id": "c011_f000065", "text": "Both of them swung their wands up and over their shoulders. Snape cried: 'Expelliarmus!' There was a dazzling flash of scarlet light and Lockhart was blasted off his feet: he flew backwards off the stage, smashed into the wall and slid down it to sprawl on the floor.", "begin": 17733.428, "end": 17750.908, "localBegin": 788.24, "localEnd": 805.72}, {"id": "c011_f000066", "text": "Malfoy and some of the other Slytherins cheered. Hermione was dancing on tiptoes. 'Do you think he's all right?' she squealed through her fingers.", "begin": 17750.908, "end": 17758.908, "localBegin": 805.72, "localEnd": 813.72}, {"id": "c011_f000067", "text": "THE DUELLING CLUB 143", "begin": 17758.908, "end": 17759.548, "localBegin": 813.72, "localEnd": 814.36}, {"id": "c011_f000068", "text": "'Who cares?' said Harry and Ron together.", "begin": 17759.548, "end": 17762.828, "localBegin": 814.36, "localEnd": 817.64}, {"id": "c011_f000069", "text": "Lockhart was getting unsteadily to his feet. His hat had fallen off and his wavy hair was standing on end.", "begin": 17762.828, "end": 17769.148, "localBegin": 817.64, "localEnd": 823.96}, {"id": "c011_f000070", "text": "'Well, there you have it!' he said, tottering back onto the platform. 'That was a Disarming Charm - as you see, I've lost my wand - ah, thank you, Miss Brown. Yes, an excellent idea to show them that, Professor Snape, but if you don't mind my saying so, it was very obvious what you were about to do. If I had wanted to stop you it would have been only too easy. However, I felt it would be instructive to let them see ...'", "begin": 17769.148, "end": 17799.428, "localBegin": 823.96, "localEnd": 854.24}, {"id": "c011_f000071", "text": "Snape was looking murderous. Possibly Lockhart had noticed, because he said, 'Enough demonstrating! I'm going to come amongst you now and put you all into pairs. Professor Snape, if you'd like to help me ...'", "begin": 17799.428, "end": 17812.908, "localBegin": 854.24, "localEnd": 867.72}, {"id": "c011_f000072", "text": "They moved through the crowd, matching up partners. Lockhart teamed Neville with Justin Finch-Fletchley, but Snape reached Harry and Ron first.", "begin": 17812.908, "end": 17821.948, "localBegin": 867.72, "localEnd": 876.76}, {"id": "c011_f000073", "text": "'Time to split up the dream team, I think,' he sneered. 'Weasley, you can partner Finnigan. Potter -'", "begin": 17821.948, "end": 17831.388, "localBegin": 876.76, "localEnd": 886.2}, {"id": "c011_f000074", "text": "Harry moved automatically towards Hermione.", "begin": 17831.388, "end": 17834.588, "localBegin": 886.2, "localEnd": 889.4}, {"id": "c011_f000075", "text": "'I don't think so,' said Snape, smiling coldly. 'Mr Malfoy, come over here. Let's see what you make of the famous Potter. And you, Miss Granger - you can partner Miss Bulstrode.'", "begin": 17834.588, "end": 17850.548, "localBegin": 889.4, "localEnd": 905.36}, {"id": "c011_f000076", "text": "Malfoy strutted over, smirking. Behind him walked a Slytherin girl who reminded Harry of a picture he'd seen in Holidays with Hags. She was large and square and her heavy jaw jutted aggressively. Hermione gave her a weak smile which she did not return.", "begin": 17850.548, "end": 17866.228, "localBegin": 905.36, "localEnd": 921.04}, {"id": "c011_f000077", "text": "'Face your partners!' called Lockhart, back on the platform, 'and bow!'", "begin": 17866.228, "end": 17873.228, "localBegin": 921.04, "localEnd": 928.04}, {"id": "c011_f000078", "text": "Harry and Malfoy barely inclined their heads, not taking their eyes off each other.", "begin": 17873.228, "end": 17878.588, "localBegin": 928.04, "localEnd": 933.4}, {"id": "c011_f000079", "text": "'Wands at the ready!' shouted Lockhart. 'When I count to three, cast your charms to disarm your opponent - only to disarm them - we don't want any accidents. One ... two ... three ...'", "begin": 17878.588, "end": 17894.028, "localBegin": 933.4, "localEnd": 948.84}, {"id": "c011_f000080", "text": "Harry swung his wand over his shoulder, but Malfoy had already started on 'two': his spell hit Harry so hard he felt as though he'd been hit over the head with a saucepan. He stumbled, but everything still seemed to be working, and wasting no more time, Harry pointed his wand straight at Malfoy and shouted, 'Rictusempra!'", "begin": 17894.028, "end": 17913.068, "localBegin": 948.84, "localEnd": 967.88}, {"id": "c011_f000081", "text": "A jet of silver light hit Malfoy in the stomach and he doubled up, wheezing.", "begin": 17913.068, "end": 17917.948, "localBegin": 967.88, "localEnd": 972.76}, {"id": "c011_f000082", "text": "'I said disarm only!' Lockhart shouted in alarm over the heads of the battling crowd, as Malfoy sank to his knees; Harry had hit him with a Tickling Charm, and he could barely move for laughing. Harry hung back, with a vague feeling it would be unsporting to bewitch Malfoy while he was on the floor, but this was a mistake. Gasping for breath, Malfoy pointed his wand at Harry's knees, choked, 'Tarantallegra!' and next second Harry's legs had begun to jerk around out of his control in a kind of quickstep.", "begin": 17917.948, "end": 17949.828, "localBegin": 972.76, "localEnd": 1004.64}, {"id": "c011_f000083", "text": "'Stop! Stop!' screamed Lockhart, but Snape took charge.", "begin": 17949.828, "end": 17955.428, "localBegin": 1004.64, "localEnd": 1010.24}, {"id": "c011_f000084", "text": "'Finite Incantatem!' he shouted; Harry's feet stopped dancing, Malfoy stopped laughing and they were able to look up.", "begin": 17955.428, "end": 17965.068, "localBegin": 1010.24, "localEnd": 1019.88}, {"id": "c011_f000085", "text": "A haze of greenish smoke was hovering over the scene. Both Neville and Justin were lying on the floor, panting; Ron was holding up an ashen-faced Seamus, apologising for whatever his broken wand had done; but Hermione and Millicent Bulstrode were still moving; Millicent had Hermione in a headlock and Hermione was whimpering in pain. Both their wands lay forgotten on the floor. Harry leapt forward and pulled Millicent off. It was difficult; she was a lot bigger than he was.", "begin": 17965.068, "end": 17993.588, "localBegin": 1019.88, "localEnd": 1048.4}, {"id": "c011_f000086", "text": "'Dear, dear,' said Lockhart, skittering through the crowd, looking at the aftermath of the duels. 'Up you get, Macmillan ... careful there, Miss Fawcett ... pinch it hard, it'll stop bleeding in a second, Boot ...", "begin": 17993.588, "end": 18007.228, "localBegin": 1048.4, "localEnd": 1062.04}, {"id": "c011_f000087", "text": "'I think I'd better teach you how to block unfriendly spells,' said Lockhart, standing flustered in the midst of the hall. He glanced at Snape, whose black eyes glinted, and looked quickly away. Let's have a volunteer pair - Longbottom and Finch-Fletchley, how about you?'", "begin": 18007.228, "end": 18025.788, "localBegin": 1062.04, "localEnd": 1080.6}, {"id": "c011_f000088", "text": "'A bad idea, Professor Lockhart,' said Snape, gliding over like a large and malevolent bat. 'Longbottom causes devastation with the simplest spells. We'll be sending what's left of Finch-Fletchley up to the hospital wing in a matchbox.' Neville's round pink face went pinker. 'How about Malfoy and Potter?' said Snape with a twisted smile.", "begin": 18025.788, "end": 18049.508, "localBegin": 1080.6, "localEnd": 1104.32}, {"id": "c011_f000089", "text": "'Excellent idea!' said Lockhart, gesturing Harry and Malfoy into the middle of the Hall as the crowd backed away to give them room.", "begin": 18049.508, "end": 18057.628, "localBegin": 1104.32, "localEnd": 1112.44}, {"id": "c011_f000090", "text": "'Now, Harry,' said Lockhart, 'when Draco points his wand at", "begin": 18057.628, "end": 18062.148, "localBegin": 1112.44, "localEnd": 1116.96}, {"id": "c011_f000091", "text": "THE DUELLING CLUB 145", "begin": 18062.148, "end": 18063.348, "localBegin": 1116.96, "localEnd": 1118.16}, {"id": "c011_f000092", "text": "you, you do this.'", "begin": 18063.348, "end": 18064.308, "localBegin": 1118.16, "localEnd": 1119.12}, {"id": "c011_f000093", "text": "He raised his own wand, attempted a complicated sort of wiggling action and dropped it. Snape smirked as Lockhart quickly picked it up, saying, 'Whoops - my wand is a little over-excited.'", "begin": 18064.308, "end": 18077.908, "localBegin": 1119.12, "localEnd": 1132.72}, {"id": "c011_f000094", "text": "Snape moved closer to Malfoy, bent down and whispered something in his ear. Malfoy smirked, too. Harry looked nervously up at Lockhart and said, 'Professor, could you show me that blocking thing again?'", "begin": 18077.908, "end": 18090.788, "localBegin": 1132.72, "localEnd": 1145.6}, {"id": "c011_f000095", "text": "'Scared?' muttered Malfoy, so that Lockhart couldn't hear him.", "begin": 18090.788, "end": 18095.468, "localBegin": 1145.6, "localEnd": 1150.28}, {"id": "c011_f000096", "text": "'You wish,' said Harry out of the corner of his mouth.", "begin": 18095.468, "end": 18100.588, "localBegin": 1150.28, "localEnd": 1155.4}, {"id": "c011_f000097", "text": "Lockhart cuffed Harry merrily on the shoulder. 'Just do what I did, Harry!'", "begin": 18100.588, "end": 18105.228, "localBegin": 1155.4, "localEnd": 1160.04}, {"id": "c011_f000098", "text": "'What, drop my wand?'", "begin": 18105.228, "end": 18106.828, "localBegin": 1160.04, "localEnd": 1161.64}, {"id": "c011_f000099", "text": "But Lockhart wasn't listening.", "begin": 18106.828, "end": 18109.268, "localBegin": 1161.64, "localEnd": 1164.08}, {"id": "c011_f000100", "text": "'Three - two - one - go!' he shouted.", "begin": 18109.268, "end": 18113.988, "localBegin": 1164.08, "localEnd": 1168.8}, {"id": "c011_f000101", "text": "Malfoy raised his wand quickly and bellowed, 'Serpensortia!'", "begin": 18113.988, "end": 18118.668, "localBegin": 1168.8, "localEnd": 1173.48}, {"id": "c011_f000102", "text": "The end of his wand exploded. Harry watched, aghast, as a long black snake shot out of it, fell heavily onto the floor between them and raised itself, ready to strike. There were screams as the crowd backed swiftly away, clearing the floor.", "begin": 18118.668, "end": 18133.068, "localBegin": 1173.48, "localEnd": 1187.88}, {"id": "c011_f000103", "text": "'Don't move, Potter,' said Snape lazily, clearly enjoying the sight of Harry standing motionless, eye to eye with the angry snake. 'I'll get rid of it ...'", "begin": 18133.068, "end": 18144.508, "localBegin": 1187.88, "localEnd": 1199.32}, {"id": "c011_f000104", "text": "'Allow me!' shouted Lockhart. He brandished his wand at the snake and there was a loud bang; the snake, instead of vanishing, flew ten feet into the air and fell back to the floor with a loud smack. Enraged, hissing furiously, it slithered straight towards Justin Finch-Fletchley and raised itself again, fangs exposed, poised to strike.", "begin": 18144.508, "end": 18167.028, "localBegin": 1199.32, "localEnd": 1221.84}, {"id": "c011_f000105", "text": "Harry wasn't sure what made him do it. He wasn't even aware of deciding to do it. All he knew was that his legs were carrying him forward as though he was on castors and that he had shouted stupidly at the snake, 'Leave him!' And miraculously - inexplicably - the snake slumped to the floor, docile as a thick black garden hose, its eyes now on Harry. Harry felt the fear drain out of him. He knew the snake wouldn't attack anyone now, though how he knew it, he couldn't have explained.", "begin": 18167.028, "end": 18199.388, "localBegin": 1221.84, "localEnd": 1254.2}, {"id": "c011_f000106", "text": "He looked up at Justin, grinning, expecting to see Justin looking relieved, or puzzled, or even grateful - but certainly not angry and scared.", "begin": 18199.388, "end": 18208.668, "localBegin": 1254.2, "localEnd": 1263.48}, {"id": "c011_f000107", "text": "'What do you think you're playing at?' he shouted, and before Harry could say anything, Justin had turned and stormed out of the Hall.", "begin": 18208.668, "end": 18215.708, "localBegin": 1263.48, "localEnd": 1270.52}, {"id": "c011_f000108", "text": "Snape stepped forward, waved his wand and the snake vanished in a small puff of black smoke. Snape, too, was looking at Harry in an unexpected way: it was a shrewd and calculating look, and Harry didn't like it. He was also dimly aware of an ominous muttering all around the walls. Then he felt a tugging on the back of his robes.", "begin": 18215.708, "end": 18237.828, "localBegin": 1270.52, "localEnd": 1292.64}, {"id": "c011_f000109", "text": "'Come on,' said Ron's voice in his ear. 'Move - come on ...'", "begin": 18237.828, "end": 18243.228, "localBegin": 1292.64, "localEnd": 1298.04}, {"id": "c011_f000110", "text": "Ron steered him out of the Hall, Hermione hurrying alongside them. As they went through the doors, the people on either side drew away as though they were frightened of catching something. Harry didn't have a clue what was going on, and neither Ron nor Hermione explained anything until they had dragged him all the way up to the empty Gryffindor common room. Then Ron pushed Harry into an armchair and said, 'You're a Parselmouth. Why didn't you tell us?'", "begin": 18243.228, "end": 18270.588, "localBegin": 1298.04, "localEnd": 1325.4}, {"id": "c011_f000111", "text": "'I'm a what?' said Harry.", "begin": 18270.588, "end": 18273.868, "localBegin": 1325.4, "localEnd": 1328.68}, {"id": "c011_f000112", "text": "'A Parselmouth!' said Ron. 'You can talk to snakes!'", "begin": 18273.868, "end": 18280.308, "localBegin": 1328.68, "localEnd": 1335.12}, {"id": "c011_f000113", "text": "'I know,' said Harry. 'I mean, that's only the second time I've ever done it. I accidentally set a boa constrictor on my cousin Dudley at the zoo once - long story - but it was telling me it had never seen Brazil and I sort of set it free without meaning to. That was before I knew I was a wizard ...'", "begin": 18280.308, "end": 18298.468, "localBegin": 1335.12, "localEnd": 1353.28}, {"id": "c011_f000114", "text": "'A boa constrictor told you it had never seen Brazil?' Ron repeated faintly.", "begin": 18298.468, "end": 18303.708, "localBegin": 1353.28, "localEnd": 1358.52}, {"id": "c011_f000115", "text": "'So?' said Harry. 'I bet loads of people here can do it.'", "begin": 18303.708, "end": 18308.148, "localBegin": 1358.52, "localEnd": 1362.96}, {"id": "c011_f000116", "text": "'Oh no they can't,' said Ron. 'It's not a very common gift. Harry, this is bad.'", "begin": 18308.148, "end": 18314.068, "localBegin": 1362.96, "localEnd": 1368.88}, {"id": "c011_f000117", "text": "'What's bad?' said Harry, starting to feel quite angry. 'What's wrong with everyone? Listen, if I hadn't told that snake not to attack Justin -'", "begin": 18314.068, "end": 18322.068, "localBegin": 1368.88, "localEnd": 1376.88}, {"id": "c011_f000118", "text": "'Oh, that's what you said to it?'", "begin": 18322.068, "end": 18324.828, "localBegin": 1376.88, "localEnd": 1379.64}, {"id": "c011_f000119", "text": "'What d'you mean? You were there ... you heard me.'", "begin": 18324.828, "end": 18328.428, "localBegin": 1379.64, "localEnd": 1383.24}, {"id": "c011_f000120", "text": "'I heard you speaking Parseltongue,' said Ron, 'snake language. You could have been saying anything. No wonder Justin panicked, you sounded like you were egging the snake on or something. It was creepy, you know.'", "begin": 18328.428, "end": 18342.628, "localBegin": 1383.24, "localEnd": 1397.44}, {"id": "c011_f000121", "text": "Harry gaped at him.", "begin": 18342.628, "end": 18344.028, "localBegin": 1397.44, "localEnd": 1398.84}, {"id": "c011_f000122", "text": "THE DUELLING CLUB 147", "begin": 18344.028, "end": 18345.468, "localBegin": 1398.84, "localEnd": 1400.28}, {"id": "c011_f000123", "text": "'I spoke a different language? But - I didn't realise - how can I speak a language without knowing I can speak it?'", "begin": 18345.468, "end": 18355.588, "localBegin": 1400.28, "localEnd": 1410.4}, {"id": "c011_f000124", "text": "Ron shook his head. Both he and Hermione were looking as though someone had died. Harry couldn't see what was so terrible.", "begin": 18355.588, "end": 18362.788, "localBegin": 1410.4, "localEnd": 1417.6}, {"id": "c011_f000125", "text": "'D'you want to tell me what's wrong with stopping a dirty great snake biting Justin's head off?' he said. 'What does it matter how I did it as long as Justin doesn't have to join the Headless Hunt?'", "begin": 18362.788, "end": 18374.628, "localBegin": 1417.6, "localEnd": 1429.44}, {"id": "c011_f000126", "text": "'It matters,' said Hermione, speaking at last in a hushed voice, 'because being able to talk to snakes was what Salazar Slytherin was famous for. That's why the symbol of Slytherin house is a serpent.'", "begin": 18374.628, "end": 18388.148, "localBegin": 1429.44, "localEnd": 1442.96}, {"id": "c011_f000127", "text": "Harry's mouth fell open.", "begin": 18388.148, "end": 18390.908, "localBegin": 1442.96, "localEnd": 1445.72}, {"id": "c011_f000128", "text": "'Exactly,' said Ron. 'And now the whole school's going to think you're his great-great-great-great-grandson or something ...'", "begin": 18390.908, "end": 18398.708, "localBegin": 1445.72, "localEnd": 1453.52}, {"id": "c011_f000129", "text": "'But I'm not,' said Harry, with a panic he couldn't quite explain.", "begin": 18398.708, "end": 18403.748, "localBegin": 1453.52, "localEnd": 1458.56}, {"id": "c011_f000130", "text": "'You'll find that hard to prove,' said Hermione. 'He lived about a thousand years ago; for all we know, you could be.' * Harry lay awake for hours that night. Through a gap in the hangings round his four-poster he watched snow starting to drift past the tower window, and wondered.", "begin": 18403.748, "end": 18423.268, "localBegin": 1458.56, "localEnd": 1478.08}, {"id": "c011_f000131", "text": "Could he be a descendant of Salazar Slytherin? He didn't know anything about his father's family, after all. The Dursleys had always forbidden questions about his wizarding relatives.", "begin": 18423.268, "end": 18435.308, "localBegin": 1478.08, "localEnd": 1490.12}, {"id": "c011_f000132", "text": "Quietly, Harry tried to say something in Parseltongue. The words wouldn't come. It seemed he had to be face to face with a snake to do it.", "begin": 18435.308, "end": 18445.388, "localBegin": 1490.12, "localEnd": 1500.2}, {"id": "c011_f000133", "text": "'But I'm in Gryffindor,' Harry thought. 'The Sorting Hat wouldn't have put me in here if I had Slytherin blood ...'", "begin": 18445.388, "end": 18453.588, "localBegin": 1500.2, "localEnd": 1508.4}, {"id": "c011_f000134", "text": "'Ah,' said a nasty little voice in his brain, 'But the Sorting Hat wanted to put you in Slytherin, don't you remember?'", "begin": 18453.588, "end": 18462.108, "localBegin": 1508.4, "localEnd": 1516.92}, {"id": "c011_f000135", "text": "Harry turned over. He'd see Justin next day in Herbology and he'd explain that he'd been calling the snake off, not egging it on, which (he thought angrily, pummelling his pillow) any fool should have realised. * By next morning, however, the snow that had begun in the night had turned into a blizzard so thick that the last Herbology lesson of term was cancelled: Professor Sprout wanted to fit socks and", "begin": 18462.108, "end": 18488.428, "localBegin": 1516.92, "localEnd": 1543.24}, {"id": "c011_f000136", "text": "scarves on the Mandrakes, a tricky operation she would entrust to no one else, now that it was so important for the Mandrakes to grow quickly and revive Mrs Norris and Colin Creevey.", "begin": 18488.428, "end": 18498.628, "localBegin": 1543.24, "localEnd": 1553.44}, {"id": "c011_f000137", "text": "Harry fretted about this next to the fire in the Gryffindor common room, while Ron and Hermione used their lesson off to play a game of wizard chess.", "begin": 18498.628, "end": 18507.188, "localBegin": 1553.44, "localEnd": 1562.0}, {"id": "c011_f000138", "text": "'For heaven's sake, Harry,' said Hermione, exasperated, as one of Ron's bishops wrestled her knight off his horse and dragged him off the board. 'Go and find Justin if it's so important to you.'", "begin": 18507.188, "end": 18519.908, "localBegin": 1562.0, "localEnd": 1574.72}, {"id": "c011_f000139", "text": "So Harry got up and left through the portrait hole, wondering where Justin might be.", "begin": 18519.908, "end": 18525.348, "localBegin": 1574.72, "localEnd": 1580.16}, {"id": "c011_f000140", "text": "The castle was darker than it usually was in daytime, because of the thick, swirling grey snow at every window. Shivering, Harry walked past classrooms where lessons were taking place, catching snatches of what was happening within. Professor McGonagall was shouting at someone who, by the sound of it, had turned his friend into a badger. Resisting the urge to take a look, Harry walked on by, thinking that Justin might be using his free lesson to catch up on some work, and deciding to check the library first.", "begin": 18525.348, "end": 18555.188, "localBegin": 1580.16, "localEnd": 1610.0}, {"id": "c011_f000141", "text": "A group of the Hufflepuffs who should have been in Herbology were indeed sitting at the back of the library, but they didn't seem to be working. Between the long lines of high bookshelves, Harry could see that their heads were close together and they were having what looked like an absorbing conversation. He couldn't see whether Justin was among them. He was walking towards them when something of what they were saying met his ears, and he paused to listen, hidden in the Invisibility section.", "begin": 18555.188, "end": 18582.348, "localBegin": 1610.0, "localEnd": 1637.16}, {"id": "c011_f000142", "text": "'So anyway,' a stout boy was saying, 'I told Justin to hide up in our dormitory. I mean to say, if Potter's marked him down as his next victim, it's best if he keeps a low profile for a while. Of course, Justin's been waiting for something like this to happen ever since he let slip to Potter he was Muggle-born. Justin actually told him he'd been down for Eton. That's not the kind of thing you bandy about with Slytherin's heir on the loose, is it?'", "begin": 18582.348, "end": 18612.548, "localBegin": 1637.16, "localEnd": 1667.36}, {"id": "c011_f000143", "text": "'You definitely think it is Potter, then, Ernie?' said a girl with blonde pigtails anxiously.", "begin": 18612.548, "end": 18618.788, "localBegin": 1667.36, "localEnd": 1673.6}, {"id": "c011_f000144", "text": "'Hannah,' said the stout boy solemnly, 'he's a Parselmouth. Everyone knows that's the mark of a dark wizard. Have you ever heard of a decent one who could talk to snakes? They called", "begin": 18618.788, "end": 18631.588, "localBegin": 1673.6, "localEnd": 1686.4}, {"id": "c011_f000145", "text": "THE DUELLING CLUB 149", "begin": 18631.588, "end": 18632.988, "localBegin": 1686.4, "localEnd": 1687.8}, {"id": "c011_f000146", "text": "Slytherin himself Serpent-tongue.'", "begin": 18632.988, "end": 18634.828, "localBegin": 1687.8, "localEnd": 1689.64}, {"id": "c011_f000147", "text": "There was some heavy murmuring at this, and Ernie went on, 'Remember what was written on the wall? Enemies of the Heir Beware. Potter had some sort of run-in with Filch. Next thing we know, Filch's cat's attacked. That first-year, Creevey, was annoying Potter at the Quidditch match, taking pictures of him while he was lying in the mud. Next thing we know, Creevey's been attacked.'", "begin": 18634.828, "end": 18660.348, "localBegin": 1689.64, "localEnd": 1715.16}, {"id": "c011_f000148", "text": "'He always seems so nice, though,' said Hannah uncertainly, 'and, well, he's the one who made You Know Who disappear. He can't be all bad, can he?'", "begin": 18660.348, "end": 18670.468, "localBegin": 1715.16, "localEnd": 1725.28}, {"id": "c011_f000149", "text": "Ernie lowered his voice mysteriously, the Hufflepuffs bent closer, and Harry edged nearer so that he could catch Ernie's words.", "begin": 18670.468, "end": 18678.708, "localBegin": 1725.28, "localEnd": 1733.52}, {"id": "c011_f000150", "text": "'No one knows how he survived that attack by You Know Who. I mean to say, he was only a baby when it happened. He should have been blasted into smithereens. Only a really powerful Dark Wizard could have survived a curse like that.' He dropped his voice until it was barely more than a whisper, and said, 'That's probably why You Know Who wanted to kill him in the first place. Didn't want another Dark Lord competing with him. I wonder what other powers Potter's been hiding?'", "begin": 18678.708, "end": 18713.068, "localBegin": 1733.52, "localEnd": 1767.88}, {"id": "c011_f000151", "text": "Harry couldn't take any more. Clearing his throat loudly, he stepped out from behind the bookshelves. If he hadn't been feeling so angry, he would have found the sight that greeted him funny: every one of the Hufflepuffs looked as though they had been Petrified by the sight of him, and the colour was draining out of Ernie's face.", "begin": 18713.068, "end": 18730.988, "localBegin": 1767.88, "localEnd": 1785.8}, {"id": "c011_f000152", "text": "'Hello,' said Harry. 'I'm looking for Justin Finch-Fletchley.'", "begin": 18730.988, "end": 18735.468, "localBegin": 1785.8, "localEnd": 1790.28}, {"id": "c011_f000153", "text": "The Hufflepuffs' worst fears had clearly been confirmed. They all looked fearfully at Ernie.", "begin": 18735.468, "end": 18741.748, "localBegin": 1790.28, "localEnd": 1796.56}, {"id": "c011_f000154", "text": "'What do you want with him?' said Ernie, in a quavering voice.", "begin": 18741.748, "end": 18747.228, "localBegin": 1796.56, "localEnd": 1802.04}, {"id": "c011_f000155", "text": "'I wanted to tell him what really happened with that snake at the Duelling Club,' said Harry.", "begin": 18747.228, "end": 18752.428, "localBegin": 1802.04, "localEnd": 1807.24}, {"id": "c011_f000156", "text": "Ernie bit his white lips and then, taking a deep breath, said, 'We were all there. We saw what happened.'", "begin": 18752.428, "end": 18760.468, "localBegin": 1807.24, "localEnd": 1815.28}, {"id": "c011_f000157", "text": "'Then you noticed that, after I spoke to it, the snake backed off?' said Harry.", "begin": 18760.468, "end": 18765.428, "localBegin": 1815.28, "localEnd": 1820.24}, {"id": "c011_f000158", "text": "'All I saw,' said Ernie stubbornly, though he was trembling as he spoke, 'was you speaking Parseltongue and chasing the snake towards Justin.'", "begin": 18765.428, "end": 18776.188, "localBegin": 1820.24, "localEnd": 1831.0}, {"id": "c011_f000159", "text": "'I didn't chase it at him!' Harry said, his voice shaking with anger. 'It didn't even touch him!'", "begin": 18776.188, "end": 18782.948, "localBegin": 1831.0, "localEnd": 1837.76}, {"id": "c011_f000160", "text": "'It was a very near miss,' said Ernie. 'And in case you're getting ideas,' he added hastily, 'I might tell you that you can trace my family back through nine generations of witches and warlocks and my blood's as pure as anyone's, so -'", "begin": 18782.948, "end": 18798.588, "localBegin": 1837.76, "localEnd": 1853.4}, {"id": "c011_f000161", "text": "'I don't care what sort of blood you've got!' said Harry fiercely. 'Why would I want to attack Muggle-borns?'", "begin": 18798.588, "end": 18804.948, "localBegin": 1853.4, "localEnd": 1859.76}, {"id": "c011_f000162", "text": "'I've heard you hate those Muggles you live with,' said Ernie swiftly.", "begin": 18804.948, "end": 18809.628, "localBegin": 1859.76, "localEnd": 1864.44}, {"id": "c011_f000163", "text": "'It's not possible to live with the Dursleys and not hate them,' said Harry. 'I'd like to see you try it.'", "begin": 18809.628, "end": 18815.908, "localBegin": 1864.44, "localEnd": 1870.72}, {"id": "c011_f000164", "text": "He turned on his heel and stormed out of the library, earning himself a reproving glare from Madam Pince, who was polishing the gilded cover of a large spellbook.", "begin": 18815.908, "end": 18825.268, "localBegin": 1870.72, "localEnd": 1880.08}, {"id": "c011_f000165", "text": "Harry blundered up the corridor, barely noticing where he was going, he was in such a fury. The result was that he walked into something very large and solid, which knocked him backwards onto the floor.", "begin": 18825.268, "end": 18836.748, "localBegin": 1880.08, "localEnd": 1891.56}, {"id": "c011_f000166", "text": "'Oh, hullo, Hagrid,' Harry said, looking up.", "begin": 18836.748, "end": 18840.148, "localBegin": 1891.56, "localEnd": 1894.96}, {"id": "c011_f000167", "text": "Hagrid's face was entirely hidden by a woolly, snow-covered balaclava, but it couldn't possibly be anyone else, as he filled most of the corridor in his moleskin overcoat. A dead rooster was hanging from one of his massive, gloved hands.", "begin": 18840.148, "end": 18855.148, "localBegin": 1894.96, "localEnd": 1909.96}, {"id": "c011_f000168", "text": "'All righ', Harry?' he said, pulling up the balaclava so he could speak. 'Why aren't yeh in class?'", "begin": 18855.148, "end": 18861.428, "localBegin": 1909.96, "localEnd": 1916.24}, {"id": "c011_f000169", "text": "'Cancelled,' said Harry, getting up. 'What're you doing in here?'", "begin": 18861.428, "end": 18866.188, "localBegin": 1916.24, "localEnd": 1921.0}, {"id": "c011_f000170", "text": "Hagrid held up the limp rooster.", "begin": 18866.188, "end": 18868.628, "localBegin": 1921.0, "localEnd": 1923.44}, {"id": "c011_f000171", "text": "'Second one killed this term,' he explained. 'It's either foxes or a Blood-Suckin' Bugbear, an' I need the Headmaster's permission ter put a charm round the hen-coop.'", "begin": 18868.628, "end": 18878.948, "localBegin": 1923.44, "localEnd": 1933.76}, {"id": "c011_f000172", "text": "He peered more closely at Harry from under his thick, snowflecked eyebrows.", "begin": 18878.948, "end": 18884.028, "localBegin": 1933.76, "localEnd": 1938.84}, {"id": "c011_f000173", "text": "'Yeh sure yeh're all righ'? Yeh look all hot an' bothered.'", "begin": 18884.028, "end": 18887.348, "localBegin": 1938.84, "localEnd": 1942.16}, {"id": "c011_f000174", "text": "Harry couldn't bring himself to repeat what Ernie and the rest of the Hufflepuffs had been saying about him.", "begin": 18887.348, "end": 18893.108, "localBegin": 1942.16, "localEnd": 1947.92}, {"id": "c011_f000175", "text": "'It's nothing,' he said. 'I'd better get going, Hagrid, it's Transfiguration next and I've got to pick up my books.'", "begin": 18893.108, "end": 18899.268, "localBegin": 1947.92, "localEnd": 1954.08}, {"id": "c011_f000176", "text": "He walked off, his mind still full of what Ernie had said about him.", "begin": 18899.268, "end": 18903.268, "localBegin": 1954.08, "localEnd": 1958.08}, {"id": "c011_f000177", "text": "THE DUELLING CLUB 151", "begin": 18903.268, "end": 18903.788, "localBegin": 1958.08, "localEnd": 1958.6}, {"id": "c011_f000178", "text": "'Justin's been waiting for something like this to happen ever since he let slip to Potter he was Muggle-born ...'", "begin": 18903.788, "end": 18911.148, "localBegin": 1958.6, "localEnd": 1965.96}, {"id": "c011_f000179", "text": "Harry stamped up the stairs and turned along another corridor, which was particularly dark; the torches had been extinguished by a strong, icy draught which was blowing through a loose window pane. He was halfway down the passage when he tripped headlong over something lying on the floor.", "begin": 18911.148, "end": 18926.868, "localBegin": 1965.96, "localEnd": 1981.68}, {"id": "c011_f000180", "text": "He turned to squint at what he'd fallen over, and felt as though his stomach had dissolved.", "begin": 18926.868, "end": 18933.308, "localBegin": 1981.68, "localEnd": 1988.12}, {"id": "c011_f000181", "text": "Justin Finch-Fletchley was lying on the floor, rigid and cold, a look of shock frozen on his face, his eyes staring blankly at the ceiling. And that wasn't all. Next to him was another figure, the strangest sight Harry had ever seen.", "begin": 18933.308, "end": 18949.908, "localBegin": 1988.12, "localEnd": 2004.72}, {"id": "c011_f000182", "text": "It was Nearly Headless Nick, no longer pearly-white and transparent, but black and smoky, floating immobile and horizontal, six inches off the floor. His head was half off and his face wore an expression of shock identical to Justin's.", "begin": 18949.908, "end": 18967.428, "localBegin": 2004.72, "localEnd": 2022.24}, {"id": "c011_f000183", "text": "Harry got to his feet, his breathing fast and shallow, his heart doing a kind of drum-roll against his ribs. He looked wildly up and down the deserted corridor and saw a line of spiders scuttling as fast as they could away from the bodies. The only sounds were the muffled voices of teachers from the classes on either side.", "begin": 18967.428, "end": 18987.188, "localBegin": 2022.24, "localEnd": 2042.0}, {"id": "c011_f000184", "text": "He could run, and no one would ever know he had been there. But he couldn't just leave them lying here ... he had to get help. Would anyone believe he hadn't had anything to do with this?", "begin": 18987.188, "end": 18998.308, "localBegin": 2042.0, "localEnd": 2053.12}, {"id": "c011_f000185", "text": "As he stood there, panicking, a door right next to him opened with a bang. Peeves the poltergeist came shooting out.", "begin": 18998.308, "end": 19006.468, "localBegin": 2053.12, "localEnd": 2061.28}, {"id": "c011_f000186", "text": "'Why, it's potty wee Potter!' cackled Peeves, knocking Harry's glasses askew as he bounced past him. 'What's Potter up to? Why's Potter lurking -'", "begin": 19006.468, "end": 19017.148, "localBegin": 2061.28, "localEnd": 2071.96}, {"id": "c011_f000187", "text": "Peeves stopped, halfway through a mid-air somersault. Upsidedown, he spotted Justin and Nearly Headless Nick. He flipped the right way up, filled his lungs and, before Harry could stop him, screamed, ATTACK! ATTACK! ANOTHER ATTACK! NO MORTAL OR GHOST IS SAFE! RUN FOR YOUR LIVES! ATTAAAACK!'", "begin": 19017.148, "end": 19036.068, "localBegin": 2071.96, "localEnd": 2090.88}, {"id": "c011_f000188", "text": "Crash - crash - crash: door after door flew open along the corridor and people flooded out. For several long minutes, there was a scene of such confusion that Justin was in danger of being squashed and people kept standing in Nearly Headless Nick.", "begin": 19036.068, "end": 19050.628, "localBegin": 2090.88, "localEnd": 2105.44}, {"id": "c011_f000189", "text": "Harry found himself pinned against the wall as the teachers shouted for quiet. Professor McGonagall came running, followed by her own class, one of whom still had black and white striped hair. She used her wand to set off a loud bang, which restored silence, and ordered everyone back into their classes. No sooner had the scene cleared somewhat than Ernie the Hufflepuff arrived, panting, on the scene.", "begin": 19050.628, "end": 19073.348, "localBegin": 2105.44, "localEnd": 2128.16}, {"id": "c011_f000190", "text": "'Caught in the act!' Ernie yelled, his face stark white, pointing his finger dramatically at Harry.", "begin": 19073.348, "end": 19080.588, "localBegin": 2128.16, "localEnd": 2135.4}, {"id": "c011_f000191", "text": "'That will do, Macmillan!' said Professor McGonagall sharply.", "begin": 19080.588, "end": 19084.428, "localBegin": 2135.4, "localEnd": 2139.24}, {"id": "c011_f000192", "text": "Peeves was bobbing overhead, now grinning wickedly, surveying the scene; Peeves always loved chaos. As the teachers bent over Justin and Nearly Headless Nick, examining them, Peeves broke into song:", "begin": 19084.428, "end": 19097.668, "localBegin": 2139.24, "localEnd": 2152.48}, {"id": "c011_f000193", "text": "'Oh Potter, you rotter, oh what have you done?", "begin": 19097.668, "end": 19100.628, "localBegin": 2152.48, "localEnd": 2155.44}, {"id": "c011_f000194", "text": "You're killing off students, you think it's good fun -'", "begin": 19100.628, "end": 19103.428, "localBegin": 2155.44, "localEnd": 2158.24}, {"id": "c011_f000195", "text": "'That's enough Peeves!' barked Professor McGonagall, and Peeves zoomed away backwards, with his tongue out at Harry.", "begin": 19103.428, "end": 19110.508, "localBegin": 2158.24, "localEnd": 2165.32}, {"id": "c011_f000196", "text": "Justin was carried up to the hospital wing by Professor Flitwick and Professor Sinistra of the Astronomy department, but nobody seemed to know what to do for Nearly Headless Nick. In the end, Professor McGonagall conjured a large fan out of thin air, which she gave to Ernie with instructions to waft Nearly Headless Nick up the stairs. This Ernie did, fanning Nick along like a silent black hovercraft. This left Harry and Professor McGonagall alone together.", "begin": 19110.508, "end": 19140.988, "localBegin": 2165.32, "localEnd": 2195.8}, {"id": "c011_f000197", "text": "'This way, Potter,' she said.", "begin": 19140.988, "end": 19143.988, "localBegin": 2195.8, "localEnd": 2198.8}, {"id": "c011_f000198", "text": "'Professor,' said Harry at once, 'I swear I didn't -'", "begin": 19143.988, "end": 19147.828, "localBegin": 2198.8, "localEnd": 2202.64}, {"id": "c011_f000199", "text": "'This is out of my hands, Potter,' said Professor McGonagall curtly.", "begin": 19147.828, "end": 19152.508, "localBegin": 2202.64, "localEnd": 2207.32}, {"id": "c011_f000200", "text": "They marched in silence around a corner and she stopped before a large and extremely ugly stone gargoyle.", "begin": 19152.508, "end": 19159.308, "localBegin": 2207.32, "localEnd": 2214.12}, {"id": "c011_f000201", "text": "'Sherbet lemon!' she said. This was evidently a password, because the gargoyle sprang suddenly to life, and hopped aside as the wall behind him split in two. Even full of dread for what was coming, Harry couldn't fail to be amazed. Behind the wall was a spiral staircase which was moving smoothly upwards, like an escalator. As he and Professor McGonagall stepped onto it, Harry heard the wall thud closed behind them. They rose upwards in circles, higher and higher, until at last, slightly dizzy, Harry could", "begin": 19159.308, "end": 19193.748, "localBegin": 2214.12, "localEnd": 2248.56}, {"id": "c011_f000202", "text": "THE DUELLING CLUB 153", "begin": 19193.748, "end": 19195.228, "localBegin": 2248.56, "localEnd": 2250.04}, {"id": "c011_f000203", "text": "see a gleaming oak door ahead, with a brass knocker in the shape of a griffon.", "begin": 19195.228, "end": 19197.948, "localBegin": 2250.04, "localEnd": 2252.76}, {"id": "c011_f000204", "text": "He knew where he was being taken. This must be where Dumbledore lived.", "begin": 19197.948, "end": 19206.188, "localBegin": 2252.76, "localEnd": 2261.0}]}, {"kind": "chapter", "number": 12, "title": "The Polyjuice Potion", "audio": "audio/chapter_012.mp3", "start": 19206.188, "end": 21177.26, "duration": 1971.072, "paragraphs": [{"id": "c012_f000001", "text": "Chapter Twelve. The Polyjuice Potion.", "begin": 19206.188, "end": 19210.948, "localBegin": 0.0, "localEnd": 4.76}, {"id": "c012_f000002", "text": "They stepped off the stone staircase at the top and Professor McGonagall rapped on the door. It opened silently and they entered. Professor McGonagall told Harry to wait, and left him there, alone.", "begin": 19210.948, "end": 19222.188, "localBegin": 4.76, "localEnd": 16.0}, {"id": "c012_f000003", "text": "Harry looked around. One thing was certain: of all the teachers' offices Harry had visited so far this year, Dumbledore's was by far the most interesting. If he hadn't been scared out of his wits that he was about to be thrown out of school, he would have been very pleased to have a chance to look around it.", "begin": 19222.188, "end": 19238.708, "localBegin": 16.0, "localEnd": 32.52}, {"id": "c012_f000004", "text": "It was a large and beautiful circular room, full of funny little noises. A number of curious silver instruments stood on spindlelegged tables, whirring and emitting little puffs of smoke. The walls were covered with portraits of old headmasters and headmistresses, all of whom were snoozing gently in their frames. There was also an enormous, claw-footed desk, and, sitting on a shelf behind it, a shabby, tattered wizard's hat - the Sorting Hat.", "begin": 19238.708, "end": 19266.428, "localBegin": 32.52, "localEnd": 60.24}, {"id": "c012_f000005", "text": "Harry hesitated. He cast a wary eye around the sleeping witches and wizards on the walls. Surely it couldn't hurt if he took the Hat down and tried it on again? Just to see ... just to make sure it had put him in the right house.", "begin": 19266.428, "end": 19279.948, "localBegin": 60.24, "localEnd": 73.76}, {"id": "c012_f000006", "text": "He walked quietly around the desk, lifted the Hat from its shelf, and lowered it slowly onto his head. It was much too large and slipped down over his eyes, just as it had done the last time he'd put it on. Harry stared at the black inside of the Hat, waiting. Then a small voice said in his ear, 'Bee in your bonnet, Harry Potter?'", "begin": 19279.948, "end": 19301.588, "localBegin": 73.76, "localEnd": 95.4}, {"id": "c012_f000007", "text": "'Er, yes,' Harry muttered. 'Er - sorry to bother you - I wanted to ask -'", "begin": 19301.588, "end": 19306.908, "localBegin": 95.4, "localEnd": 100.72}, {"id": "c012_f000008", "text": "'You've been wondering whether I put you in the right house,' said the Hat smartly. 'Yes ... you were particularly difficult to place. But I stand by what I said before -' Harry's heart leapt '-", "begin": 19306.908, "end": 19318.188, "localBegin": 100.72, "localEnd": 112.0}, {"id": "c012_f000009", "text": "you would have done well in Slytherin.'", "begin": 19318.188, "end": 19321.868, "localBegin": 112.0, "localEnd": 115.68}, {"id": "c012_f000010", "text": "Harry's stomach plummeted. He grabbed the point of the Hat and pulled it off. It hung limply in his hand, grubby and faded. Harry pushed it back onto its shelf, feeling sick.", "begin": 19321.868, "end": 19333.068, "localBegin": 115.68, "localEnd": 126.88}, {"id": "c012_f000011", "text": "'You're wrong,' he said aloud to the still and silent Hat. It didn't move. Harry backed away, watching it. Then a strange, gagging noise behind him made him wheel around.", "begin": 19333.068, "end": 19344.948, "localBegin": 126.88, "localEnd": 138.76}, {"id": "c012_f000012", "text": "He wasn't alone after all. Standing on a golden perch behind the door was a decrepit-looking bird which resembled a half-plucked turkey. Harry stared at it and the bird looked balefully back, making its gagging noise again. Harry thought it looked very ill. Its eyes were dull and, even as Harry watched, a couple more feathers fell out of its tail.", "begin": 19344.948, "end": 19367.028, "localBegin": 138.76, "localEnd": 160.84}, {"id": "c012_f000013", "text": "Harry was just thinking that all he needed was for Dumbledore's pet bird to die while he was alone in the office with it, when the bird burst into flames.", "begin": 19367.028, "end": 19375.948, "localBegin": 160.84, "localEnd": 169.76}, {"id": "c012_f000014", "text": "Harry yelled in shock and backed away into the desk. He looked feverishly around in case there was a glass of water somewhere, but couldn't see one. The bird, meanwhile, had become a fireball; it gave one loud shriek and next second there was nothing but a smouldering pile of ash on the floor.", "begin": 19375.948, "end": 19392.588, "localBegin": 169.76, "localEnd": 186.4}, {"id": "c012_f000015", "text": "The office door opened. Dumbledore came in, looking very sombre.", "begin": 19392.588, "end": 19397.068, "localBegin": 186.4, "localEnd": 190.88}, {"id": "c012_f000016", "text": "'Professor,' Harry gasped, 'your bird - I couldn't do anything he just caught fire -'", "begin": 19397.068, "end": 19402.828, "localBegin": 190.88, "localEnd": 196.64}, {"id": "c012_f000017", "text": "To Harry's astonishment, Dumbledore smiled.", "begin": 19402.828, "end": 19406.788, "localBegin": 196.64, "localEnd": 200.6}, {"id": "c012_f000018", "text": "'About time, too,' he said. 'He's been looking dreadful for days, I've been telling him to get a move on.'", "begin": 19406.788, "end": 19414.988, "localBegin": 200.6, "localEnd": 208.8}, {"id": "c012_f000019", "text": "He chuckled at the stunned look on Harry's face.", "begin": 19414.988, "end": 19417.588, "localBegin": 208.8, "localEnd": 211.4}, {"id": "c012_f000020", "text": "'Fawkes is a phoenix, Harry. Phoenixes burst into flame when it is time for them to die and are reborn from the ashes. Watch him ...'", "begin": 19417.588, "end": 19428.188, "localBegin": 211.4, "localEnd": 222.0}, {"id": "c012_f000021", "text": "Harry looked down in time to see a tiny, wrinkled, new-born bird poke its head out of the ashes. It was quite as ugly as the old one.", "begin": 19428.188, "end": 19436.068, "localBegin": 222.0, "localEnd": 229.88}, {"id": "c012_f000022", "text": "'It's a shame you had to see him on a Burning Day,' said Dumbledore, seating himself behind his desk. 'He's really very handsome most of the time: wonderful red and gold plumage. Fascinating creatures, phoenixes. They can carry immensely heavy loads, their tears have healing powers and they make highly faithful pets.'", "begin": 19436.068, "end": 19459.628, "localBegin": 229.88, "localEnd": 253.44}, {"id": "c012_f000023", "text": "In the shock of Fawkes catching fire, Harry had forgotten what he was there for, but it all came back to him as Dumbledore settled himself in the high-backed chair behind the desk and fixed Harry with his penetrating, light-blue stare.", "begin": 19459.628, "end": 19471.948, "localBegin": 253.44, "localEnd": 265.76}, {"id": "c012_f000024", "text": "Before Dumbledore could speak another word, however, the door of the office flew open with an almighty bang and Hagrid burst in, a wild look in his eyes, his balaclava perched on top of his shaggy black head and the dead rooster still swinging from his hand.", "begin": 19471.948, "end": 19487.308, "localBegin": 265.76, "localEnd": 281.12}, {"id": "c012_f000025", "text": "'It wasn' Harry, Professor Dumbledore!' said Hagrid urgently. 'I was talkin' ter him seconds before that kid was found, he never had time, sir ...'", "begin": 19487.308, "end": 19497.068, "localBegin": 281.12, "localEnd": 290.88}, {"id": "c012_f000026", "text": "Dumbledore tried to say something, but Hagrid went ranting on, waving the rooster around in his agitation, sending feathers everywhere.", "begin": 19497.068, "end": 19504.668, "localBegin": 290.88, "localEnd": 298.48}, {"id": "c012_f000027", "text": "'... It can't've bin him, I'll swear it in front o' the Ministry o' Magic if I have to ...'", "begin": 19504.668, "end": 19509.188, "localBegin": 298.48, "localEnd": 303.0}, {"id": "c012_f000028", "text": "'Hagrid, I -'", "begin": 19509.188, "end": 19510.548, "localBegin": 303.0, "localEnd": 304.36}, {"id": "c012_f000029", "text": "'... Yeh've got the wrong boy, sir, I know Harry never -'", "begin": 19510.548, "end": 19513.788, "localBegin": 304.36, "localEnd": 307.6}, {"id": "c012_f000030", "text": "'Hagrid!' said Dumbledore loudly. 'I do not think that Harry attacked those people.'", "begin": 19513.788, "end": 19522.988, "localBegin": 307.6, "localEnd": 316.8}, {"id": "c012_f000031", "text": "'Oh,' said Hagrid, the rooster falling limply at his side. 'Right. I'll wait outside then, Headmaster.'", "begin": 19522.988, "end": 19532.548, "localBegin": 316.8, "localEnd": 326.36}, {"id": "c012_f000032", "text": "And he stomped out looking embarrassed.", "begin": 19532.548, "end": 19535.668, "localBegin": 326.36, "localEnd": 329.48}, {"id": "c012_f000033", "text": "'You don't think it was me, Professor?' Harry repeated hopefully, as Dumbledore brushed rooster feathers off his desk.", "begin": 19535.668, "end": 19542.468, "localBegin": 329.48, "localEnd": 336.28}, {"id": "c012_f000034", "text": "'No, Harry, I don't,' said Dumbledore, though his face was sombre again. 'But I still want to talk to you.'", "begin": 19542.468, "end": 19550.268, "localBegin": 336.28, "localEnd": 344.08}, {"id": "c012_f000035", "text": "Harry waited nervously while Dumbledore considered him, the tips of his long fingers together.", "begin": 19550.268, "end": 19555.948, "localBegin": 344.08, "localEnd": 349.76}, {"id": "c012_f000036", "text": "'I must ask you, Harry, whether there is anything you'd like to tell me,' he said gently. 'Anything at all.'", "begin": 19555.948, "end": 19563.908, "localBegin": 349.76, "localEnd": 357.72}, {"id": "c012_f000037", "text": "Harry didn't know what to say. He thought of Malfoy shouting, 'You'll be next, Mudbloods!' and of the Polyjuice Potion, simmering away in Moaning Myrtle's bathroom. Then he thought of the disembodied voice he had heard twice and remembered what Ron had said: 'Hearing voices no one else can hear isn't a good sign, even in the wizarding world.' He thought, too, about what everyone was saying about him, and his growing dread that he was somehow connected with Salazar Slytherin ...", "begin": 19563.908, "end": 19593.028, "localBegin": 357.72, "localEnd": 386.84}, {"id": "c012_f000038", "text": "'No,' said Harry, 'there isn't anything, Professor.' * The double attack on Justin and Nearly Headless Nick turned what had hitherto been nervousness into real panic. Curiously, it was Nearly Headless Nick's fate that seemed to worry people most. What could possibly do that to a ghost, people asked each other; what terrible power could harm someone who was already dead? There was almost a stampede to book seats on the Hogwarts Express so that students could go home for Christmas.", "begin": 19593.028, "end": 19625.708, "localBegin": 386.84, "localEnd": 419.52}, {"id": "c012_f000039", "text": "'At this rate, we'll be the only ones left,' Ron told Harry and Hermione. 'Us, Malfoy, Crabbe and Goyle. What a jolly holiday it's going to be.'", "begin": 19625.708, "end": 19634.948, "localBegin": 419.52, "localEnd": 428.76}, {"id": "c012_f000040", "text": "Crabbe and Goyle, who always did whatever Malfoy did, had signed up to stay over the holidays too. But Harry was glad that most people were leaving. He was tired of people skirting around him in the corridors, as though he was about to sprout fangs or spit poison; tired of all the muttering, pointing and hissing as he passed.", "begin": 19634.948, "end": 19653.788, "localBegin": 428.76, "localEnd": 447.6}, {"id": "c012_f000041", "text": "Fred and George, however, found all this very funny. They went out of their way to march ahead of Harry down the corridors, shouting, 'Make way for the heir of Slytherin, seriously evil wizard coming through ...'", "begin": 19653.788, "end": 19664.828, "localBegin": 447.6, "localEnd": 458.64}, {"id": "c012_f000042", "text": "Percy was deeply disapproving of this behaviour.", "begin": 19664.828, "end": 19667.988, "localBegin": 458.64, "localEnd": 461.8}, {"id": "c012_f000043", "text": "'It is not a laughing matter,' he said coldly.", "begin": 19667.988, "end": 19672.108, "localBegin": 461.8, "localEnd": 465.92}, {"id": "c012_f000044", "text": "'Oh, get out of the way, Percy,' said Fred. 'Harry's in a hurry.'", "begin": 19672.108, "end": 19675.628, "localBegin": 465.92, "localEnd": 469.44}, {"id": "c012_f000045", "text": "'Yeah, he's nipping off to the Chamber of Secrets for a cup of tea with his fanged servant,' said George, chortling.", "begin": 19675.628, "end": 19682.268, "localBegin": 469.44, "localEnd": 476.08}, {"id": "c012_f000046", "text": "Ginny didn't find it amusing either.", "begin": 19682.268, "end": 19684.588, "localBegin": 476.08, "localEnd": 478.4}, {"id": "c012_f000047", "text": "'Oh, don't,' she wailed every time Fred asked Harry loudly who he was planning to attack next, or George pretended to ward Harry off with a large clove of garlic when they met.", "begin": 19684.588, "end": 19695.668, "localBegin": 478.4, "localEnd": 489.48}, {"id": "c012_f000048", "text": "Harry didn't mind; it made him feel better that Fred and George, at least, thought the idea of his being Slytherin's heir was quite ludicrous. But their antics seemed to be aggravating Draco Malfoy, who looked increasingly sour each time he saw them at it.", "begin": 19695.668, "end": 19710.948, "localBegin": 489.48, "localEnd": 504.76}, {"id": "c012_f000049", "text": "'It's because he's bursting to say it's really him,' said Ron knowingly. 'You know how he hates anyone beating him at anything, and you're getting all the credit for his dirty work.'", "begin": 19710.948, "end": 19720.828, "localBegin": 504.76, "localEnd": 514.64}, {"id": "c012_f000050", "text": "'Not for long,' said Hermione in a satisfied tone. 'The Polyjuice", "begin": 19720.828, "end": 19724.548, "localBegin": 514.64, "localEnd": 518.36}, {"id": "c012_f000051", "text": "Potion's nearly ready. We'll be getting the truth out of him any day now.' * At last the term ended, and a silence deep as the snow on the grounds descended on the castle. Harry found it peaceful, rather than gloomy, and enjoyed the fact that he, Hermione and the Weasleys had the run of Gryffindor Tower, which meant they could play Exploding Snap loudly without bothering anyone, and practise duelling in private. Fred, George and Ginny had chosen to stay at school rather than visit Bill in Egypt with Mr and Mrs Weasley. Percy, who disapproved of what he termed their childish behaviour, didn't spend much time in the Gryffindor common room. He had already told them pompously that he was only staying over Christmas because it was his duty as a Prefect to support the teachers during this troubled time.", "begin": 19724.548, "end": 19774.028, "localBegin": 518.36, "localEnd": 567.84}, {"id": "c012_f000052", "text": "Christmas morning dawned, cold and white. Harry and Ron, the only ones left in their dormitory, were woken very early by Hermione, who burst in, fully dressed and carrying presents for them both.", "begin": 19774.028, "end": 19786.348, "localBegin": 567.84, "localEnd": 580.16}, {"id": "c012_f000053", "text": "'Wake up,' she said loudly, pulling back the curtains at the window.", "begin": 19786.348, "end": 19789.948, "localBegin": 580.16, "localEnd": 583.76}, {"id": "c012_f000054", "text": "'Hermione - you're not supposed to be in here,' said Ron, shielding his eyes against the light.", "begin": 19789.948, "end": 19796.548, "localBegin": 583.76, "localEnd": 590.36}, {"id": "c012_f000055", "text": "'Merry Christmas to you, too,' said Hermione, throwing him his present. 'I've been up for nearly an hour, adding more lacewings to the Potion. It's ready.'", "begin": 19796.548, "end": 19805.268, "localBegin": 590.36, "localEnd": 599.08}, {"id": "c012_f000056", "text": "Harry sat up, suddenly wide awake.", "begin": 19805.268, "end": 19808.788, "localBegin": 599.08, "localEnd": 602.6}, {"id": "c012_f000057", "text": "'Are you sure?'", "begin": 19808.788, "end": 19809.548, "localBegin": 602.6, "localEnd": 603.36}, {"id": "c012_f000058", "text": "'Positive,' said Hermione, shifting Scabbers the rat so that she could sit down on the end of his four-poster. 'If we're going to do it, I say it should be tonight.'", "begin": 19809.548, "end": 19820.108, "localBegin": 603.36, "localEnd": 613.92}, {"id": "c012_f000059", "text": "At that moment, Hedwig swooped into the room, carrying a very small package in her beak.", "begin": 19820.108, "end": 19824.708, "localBegin": 613.92, "localEnd": 618.52}, {"id": "c012_f000060", "text": "'Hello,' said Harry happily, as she landed on his bed, 'are you speaking to me again?'", "begin": 19824.708, "end": 19831.308, "localBegin": 618.52, "localEnd": 625.12}, {"id": "c012_f000061", "text": "She nibbled his ear in an affectionate sort of way, which was a far better present than the one which she had brought him, which turned out to be from the Dursleys. They had sent Harry a toothpick and a note telling him to find out whether he'd be able to stay at Hogwarts for the summer holidays, too.", "begin": 19831.308, "end": 19847.988, "localBegin": 625.12, "localEnd": 641.8}, {"id": "c012_f000062", "text": "The rest of Harry's Christmas presents were far more satisfactory. Hagrid had sent him a large tin of treacle fudge, which Harry decided to soften by the fire before eating; Ron had given him a book called Flying with the Cannons, a book of interesting facts about his favourite Quidditch team; and Hermione had bought him a luxury eagle-feather quill. Harry opened the last present to find a new, hand-knitted jumper from Mrs Weasley, and a large plum cake. He put up her card with a fresh surge of guilt, thinking about Mr Weasley's car, which hadn't been seen since its crash with the Whomping Willow, and the bout of rule-breaking he and Ron were planning next. * No one, not even someone dreading taking Polyjuice Potion later, could fail to enjoy Christmas dinner at Hogwarts.", "begin": 19847.988, "end": 19896.508, "localBegin": 641.8, "localEnd": 690.32}, {"id": "c012_f000063", "text": "The Great Hall looked magnificent. Not only were there a dozen frost-covered Christmas trees and thick streamers of holly and mistletoe criss-crossing the ceiling, but enchanted snow was falling, warm and dry, from the ceiling. Dumbledore led them in a few of his favourite carols, Hagrid booming more and more loudly with every goblet of eggnog he consumed. Percy, who hadn't noticed that Fred had bewitched his prefect badge so that it now read 'Pinhead', kept asking them all what they were sniggering at. Harry didn't even care that Draco Malfoy was making loud, snide remarks about his new jumper from the Slytherin table. With a bit of luck, Malfoy would be getting his come-uppance in a few hours' time.", "begin": 19896.508, "end": 19937.468, "localBegin": 690.32, "localEnd": 731.28}, {"id": "c012_f000064", "text": "Harry and Ron had barely finished their third helpings of Christmas pudding when Hermione ushered them out of the Hall to finalise their plans for the evening.", "begin": 19937.468, "end": 19945.508, "localBegin": 731.28, "localEnd": 739.32}, {"id": "c012_f000065", "text": "'We still need a bit of the people you're changing into,' said Hermione matter-of-factly, as though she was sending them to the supermarket for washing-powder. 'And obviously, it'll be best if you can get something of Crabbe and Goyle's; they're Malfoy's best friends, he'll tell them anything. And we also need to make sure the real Crabbe and Goyle can't burst in on us while we're interrogating him.", "begin": 19945.508, "end": 19966.908, "localBegin": 739.32, "localEnd": 760.72}, {"id": "c012_f000066", "text": "'I've got it all worked out,' she went on smoothly, ignoring Harry and Ron's stupefied faces. She held up two plump chocolate cakes. 'I've filled these with a simple Sleeping Draught. All you have to do is make sure Crabbe and Goyle find them. You know", "begin": 19966.908, "end": 19980.868, "localBegin": 760.72, "localEnd": 774.68}, {"id": "c012_f000067", "text": "how greedy they are, they're bound to eat them. Once they're asleep, pull out a few of their hairs and hide them in a broom cupboard.'", "begin": 19980.868, "end": 19987.588, "localBegin": 774.68, "localEnd": 781.4}, {"id": "c012_f000068", "text": "Harry and Ron looked incredulously at each other.", "begin": 19987.588, "end": 19990.308, "localBegin": 781.4, "localEnd": 784.12}, {"id": "c012_f000069", "text": "'Hermione, I don't think -'", "begin": 19990.308, "end": 19993.188, "localBegin": 784.12, "localEnd": 787.0}, {"id": "c012_f000070", "text": "'That could go seriously wrong -'", "begin": 19993.188, "end": 19995.628, "localBegin": 787.0, "localEnd": 789.44}, {"id": "c012_f000071", "text": "But Hermione had a steely glint in her eye not unlike the one Professor McGonagall sometimes had.", "begin": 19995.628, "end": 20000.748, "localBegin": 789.44, "localEnd": 794.56}, {"id": "c012_f000072", "text": "'The Potion will be useless without Crabbe and Goyle's hair,' she said sternly. 'You do want to investigate Malfoy, don't you?'", "begin": 20000.748, "end": 20009.668, "localBegin": 794.56, "localEnd": 803.48}, {"id": "c012_f000073", "text": "'Oh, all right, all right,' said Harry. 'But what about you? Whose hair are you ripping out?'", "begin": 20009.668, "end": 20015.828, "localBegin": 803.48, "localEnd": 809.64}, {"id": "c012_f000074", "text": "'I've already got mine!' said Hermione brightly, pulling a tiny bottle out of her pocket and showing them the single hair inside it. 'Remember Millicent Bulstrode wrestling with me at the Duelling Club? She left this on my robes when she was trying to strangle me! And she's gone home for Christmas - so I'll just have to tell the Slytherins I've decided to come back.'", "begin": 20015.828, "end": 20035.708, "localBegin": 809.64, "localEnd": 829.52}, {"id": "c012_f000075", "text": "When Hermione had bustled off to check on the Polyjuice Potion again, Ron turned to Harry with a doom-laden expression.", "begin": 20035.708, "end": 20042.028, "localBegin": 829.52, "localEnd": 835.84}, {"id": "c012_f000076", "text": "'Have you ever heard of a plan where so many things could go wrong?' * But to Harry and Ron's utter amazement, stage one of the operation went just as smoothly as Hermione had said. They lurked in the deserted Entrance Hall after Christmas tea, waiting for Crabbe and Goyle, who had remained alone at the Slytherin table, shovelling down fourth helpings of trifle. Harry had perched the chocolate cakes on the end of the banisters. When they spotted Crabbe and Goyle coming out of the Great Hall, Harry and Ron hid quickly behind a suit of armour next to the front door.", "begin": 20042.028, "end": 20077.948, "localBegin": 835.84, "localEnd": 871.76}, {"id": "c012_f000077", "text": "'How thick can you get?' Ron whispered ecstatically, as Crabbe gleefully pointed out the cakes to Goyle and grabbed them. Grinning stupidly, they stuffed the cakes whole into their large mouths. For a moment, both of them chewed greedily, looks of triumph on their faces. Then, without the smallest change of expression, they both keeled over backwards onto the floor.", "begin": 20077.948, "end": 20101.228, "localBegin": 871.76, "localEnd": 895.04}, {"id": "c012_f000078", "text": "Much the most difficult bit was hiding them in the cupboard across the hall. Once they were safely stowed amongst the buckets and mops, Harry yanked out a couple of the bristles that covered", "begin": 20101.228, "end": 20110.268, "localBegin": 895.04, "localEnd": 904.08}, {"id": "c012_f000079", "text": "Goyle's forehead and Ron pulled out several of Crabbe's hairs. They also stole their shoes, because their own were far too small for Crabbe- and Goyle-sized feet. Then, still stunned at what they had just done, they sprinted up to Moaning Myrtle's bathroom.", "begin": 20110.268, "end": 20125.548, "localBegin": 904.08, "localEnd": 919.36}, {"id": "c012_f000080", "text": "They could hardly see for the thick black smoke issuing from the cubicle in which Hermione was stirring the cauldron. Pulling their robes up over their faces, Harry and Ron knocked softly on the door.", "begin": 20125.548, "end": 20136.028, "localBegin": 919.36, "localEnd": 929.84}, {"id": "c012_f000081", "text": "'Hermione?'", "begin": 20136.028, "end": 20138.148, "localBegin": 929.84, "localEnd": 931.96}, {"id": "c012_f000082", "text": "They heard the scrape of the lock and Hermione emerged, shiny-faced and looking anxious. Behind her they heard the gloop gloop of the bubbling, treacle-thick Potion. Three glass tumblers stood ready on the toilet seat.", "begin": 20138.148, "end": 20150.908, "localBegin": 931.96, "localEnd": 944.72}, {"id": "c012_f000083", "text": "'Did you get them?' Hermione asked breathlessly.", "begin": 20150.908, "end": 20153.788, "localBegin": 944.72, "localEnd": 947.6}, {"id": "c012_f000084", "text": "Harry showed her Goyle's hair.", "begin": 20153.788, "end": 20155.428, "localBegin": 947.6, "localEnd": 949.24}, {"id": "c012_f000085", "text": "'Good. And I sneaked these spare robes out of the laundry,' Hermione said, holding up a small sack. 'You'll need bigger sizes once you're Crabbe and Goyle.'", "begin": 20155.428, "end": 20164.548, "localBegin": 949.24, "localEnd": 958.36}, {"id": "c012_f000086", "text": "The three of them stared into the cauldron. Close up, the Potion looked like thick, dark mud, bubbling sluggishly.", "begin": 20164.548, "end": 20172.188, "localBegin": 958.36, "localEnd": 966.0}, {"id": "c012_f000087", "text": "'I'm sure I've done everything right,' said Hermione, nervously re-reading the splotched page of Moste Potente Potions. 'It looks like the book says it should ... Once we've drunk it, we'll have exactly an hour before we change back into ourselves.'", "begin": 20172.188, "end": 20188.428, "localBegin": 966.0, "localEnd": 982.24}, {"id": "c012_f000088", "text": "'Now what?' Ron whispered.", "begin": 20188.428, "end": 20190.068, "localBegin": 982.24, "localEnd": 983.88}, {"id": "c012_f000089", "text": "'We separate it into three glasses and add the hairs.'", "begin": 20190.068, "end": 20193.308, "localBegin": 983.88, "localEnd": 987.12}, {"id": "c012_f000090", "text": "Hermione ladled large dollops of the Potion into each of the glasses. Then, her hand trembling, she shook Millicent Bulstrode's hair out of its bottle into the first glass.", "begin": 20193.308, "end": 20203.148, "localBegin": 987.12, "localEnd": 996.96}, {"id": "c012_f000091", "text": "The Potion hissed loudly like a boiling kettle and frothed madly. A second later, it had turned a sick sort of yellow.", "begin": 20203.148, "end": 20211.788, "localBegin": 996.96, "localEnd": 1005.6}, {"id": "c012_f000092", "text": "'Urgh - essence of Millicent Bulstrode,' said Ron, eyeing it with loathing. 'Bet it tastes disgusting.'", "begin": 20211.788, "end": 20220.028, "localBegin": 1005.6, "localEnd": 1013.84}, {"id": "c012_f000093", "text": "'Add yours, then,' said Hermione.", "begin": 20220.028, "end": 20222.108, "localBegin": 1013.84, "localEnd": 1015.92}, {"id": "c012_f000094", "text": "Harry dropped Goyle's hair into the middle glass and Ron put Crabbe's into the last one. Both glasses hissed and frothed: Goyle's turned the khaki colour of a bogey, Crabbe's a dark, murky brown.", "begin": 20222.108, "end": 20234.508, "localBegin": 1015.92, "localEnd": 1028.32}, {"id": "c012_f000095", "text": "'Hang on,' said Harry, as Ron and Hermione reached for their glasses. 'We'd better not all drink them in here: once we turn into", "begin": 20234.508, "end": 20243.188, "localBegin": 1028.32, "localEnd": 1037.0}, {"id": "c012_f000096", "text": "Crabbe and Goyle we won't fit. And Millicent Bulstrode's no pixie.'", "begin": 20243.188, "end": 20246.308, "localBegin": 1037.0, "localEnd": 1040.12}, {"id": "c012_f000097", "text": "'Good thinking,' said Ron, unlocking the door. 'We'll take separate cubicles.'", "begin": 20246.308, "end": 20250.948, "localBegin": 1040.12, "localEnd": 1044.76}, {"id": "c012_f000098", "text": "Careful not to spill a drop of his Polyjuice Potion, Harry slipped into the middle cubicle.", "begin": 20250.948, "end": 20257.228, "localBegin": 1044.76, "localEnd": 1051.04}, {"id": "c012_f000099", "text": "'Ready?' he called.", "begin": 20257.228, "end": 20258.988, "localBegin": 1051.04, "localEnd": 1052.8}, {"id": "c012_f000100", "text": "'Ready,' came Ron and Hermione's voices.", "begin": 20258.988, "end": 20261.708, "localBegin": 1052.8, "localEnd": 1055.52}, {"id": "c012_f000101", "text": "'One ... two ... three ...'", "begin": 20261.708, "end": 20265.068, "localBegin": 1055.52, "localEnd": 1058.88}, {"id": "c012_f000102", "text": "Pinching his nose, Harry drank the Potion down in two large gulps. It tasted like overcooked cabbage.", "begin": 20265.068, "end": 20273.348, "localBegin": 1058.88, "localEnd": 1067.16}, {"id": "c012_f000103", "text": "Immediately, his insides started writhing as though he'd just swallowed live snakes - doubled up, he wondered whether he was going to be sick - then a burning sensation spread rapidly from his stomach to the very ends of his fingers and toes. Next, bringing him gasping to all fours, came a horrible melting feeling, as the skin all over his body bubbled like hot wax, and before his eyes, his hands began to grow, the fingers thickened, the nails broadened and the knuckles were bulging like bolts. His shoulders stretched painfully and a prickling on his forehead told him that hair was creeping down towards his eyebrows; his robes ripped as his chest expanded like a barrel bursting its hoops; his feet were agony in shoes four sizes too small ...", "begin": 20273.348, "end": 20319.108, "localBegin": 1067.16, "localEnd": 1112.92}, {"id": "c012_f000104", "text": "As suddenly as it had started, everything stopped. Harry lay face down on the cold stone floor, listening to Myrtle gurgling morosely in the end toilet. With difficulty, he kicked off his shoes and stood up. So this was what it felt like, being Goyle. His large hands trembling, he pulled off his old robes, which were hanging a foot above his ankles, pulled on the spare ones and laced up Goyle's boat-like shoes. He reached up to brush his hair out of his eyes and met only the short growth of wiry bristles, low on his forehead. Then he realised that his glasses were clouding his eyes, because Goyle obviously didn't need them. He took them off and called, 'Are you two OK?' Goyle's low rasp of a voice issued from his mouth.", "begin": 20319.108, "end": 20364.588, "localBegin": 1112.92, "localEnd": 1158.4}, {"id": "c012_f000105", "text": "'Yeah,' came the deep grunt of Crabbe from his right.", "begin": 20364.588, "end": 20368.188, "localBegin": 1158.4, "localEnd": 1162.0}, {"id": "c012_f000106", "text": "Harry unlocked his door and stepped in front of the cracked mirror. Goyle stared back at him out of dull, deep-set eyes. Harry scratched his ear. So did Goyle.", "begin": 20368.188, "end": 20378.748, "localBegin": 1162.0, "localEnd": 1172.56}, {"id": "c012_f000107", "text": "Ron's door opened. They stared at each other. Except that he looked pale and shocked, Ron was indistinguishable from Crabbe,", "begin": 20378.748, "end": 20386.908, "localBegin": 1172.56, "localEnd": 1180.72}, {"id": "c012_f000108", "text": "from the pudding-basin haircut to the long, gorilla arms.", "begin": 20386.908, "end": 20390.588, "localBegin": 1180.72, "localEnd": 1184.4}, {"id": "c012_f000109", "text": "'This is unbelievable,' said Ron, approaching the mirror and prodding Crabbe's flat nose. 'Unbelievable.'", "begin": 20390.588, "end": 20398.788, "localBegin": 1184.4, "localEnd": 1192.6}, {"id": "c012_f000110", "text": "'We'd better get going,' said Harry, loosening the watch that was cutting into Goyle's thick wrist. 'We've still got to find out where the Slytherin common room is, I only hope we can find someone to follow ...'", "begin": 20398.788, "end": 20410.788, "localBegin": 1192.6, "localEnd": 1204.6}, {"id": "c012_f000111", "text": "Ron, who had been gazing at Harry, said, 'You don't know how bizarre it is to see Goyle thinking.' He banged on Hermione's door. 'C'mon, we need to go ...'", "begin": 20410.788, "end": 20420.388, "localBegin": 1204.6, "localEnd": 1214.2}, {"id": "c012_f000112", "text": "A high-pitched voice answered him. 'I - I don't think I'm going to come after all. You go on without me.'", "begin": 20420.388, "end": 20428.428, "localBegin": 1214.2, "localEnd": 1222.24}, {"id": "c012_f000113", "text": "'Hermione, we know Millicent Bulstrode's ugly, no one's going to know it's you.'", "begin": 20428.428, "end": 20434.668, "localBegin": 1222.24, "localEnd": 1228.48}, {"id": "c012_f000114", "text": "'No - really - I don't think I'll come. You two hurry up, you're wasting time.'", "begin": 20434.668, "end": 20439.348, "localBegin": 1228.48, "localEnd": 1233.16}, {"id": "c012_f000115", "text": "Harry looked at Ron, bewildered.", "begin": 20439.348, "end": 20441.948, "localBegin": 1233.16, "localEnd": 1235.76}, {"id": "c012_f000116", "text": "'That looks more like Goyle,' said Ron. 'That's how he looks every time a teacher asks him a question.'", "begin": 20441.948, "end": 20447.828, "localBegin": 1235.76, "localEnd": 1241.64}, {"id": "c012_f000117", "text": "'Hermione, are you OK?' said Harry through the door.", "begin": 20447.828, "end": 20451.868, "localBegin": 1241.64, "localEnd": 1245.68}, {"id": "c012_f000118", "text": "'Fine - I'm fine ... Go on -'", "begin": 20451.868, "end": 20454.948, "localBegin": 1245.68, "localEnd": 1248.76}, {"id": "c012_f000119", "text": "Harry looked at his watch. Five of their precious sixty minutes had already passed.", "begin": 20454.948, "end": 20460.148, "localBegin": 1248.76, "localEnd": 1253.96}, {"id": "c012_f000120", "text": "'We'll meet you back here, all right?' he said.", "begin": 20460.148, "end": 20463.348, "localBegin": 1253.96, "localEnd": 1257.16}, {"id": "c012_f000121", "text": "Harry and Ron opened the door of the bathroom carefully, checked that the coast was clear and set off.", "begin": 20463.348, "end": 20470.388, "localBegin": 1257.16, "localEnd": 1264.2}, {"id": "c012_f000122", "text": "'Don't swing your arms like that,' Harry muttered to Ron.", "begin": 20470.388, "end": 20473.628, "localBegin": 1264.2, "localEnd": 1267.44}, {"id": "c012_f000123", "text": "'Eh?'", "begin": 20473.628, "end": 20474.468, "localBegin": 1267.44, "localEnd": 1268.28}, {"id": "c012_f000124", "text": "'Crabbe holds them sort of stiff ...'", "begin": 20474.468, "end": 20476.948, "localBegin": 1268.28, "localEnd": 1270.76}, {"id": "c012_f000125", "text": "'How's this?'", "begin": 20476.948, "end": 20478.548, "localBegin": 1270.76, "localEnd": 1272.36}, {"id": "c012_f000126", "text": "'Yeah, that's better.'", "begin": 20478.548, "end": 20479.508, "localBegin": 1272.36, "localEnd": 1273.32}, {"id": "c012_f000127", "text": "They went down the marble staircase. All they needed now was a Slytherin whom they could follow to the Slytherin common room, but there was nobody around.", "begin": 20479.508, "end": 20488.828, "localBegin": 1273.32, "localEnd": 1282.64}, {"id": "c012_f000128", "text": "'Any ideas?' muttered Harry.", "begin": 20488.828, "end": 20491.548, "localBegin": 1282.64, "localEnd": 1285.36}, {"id": "c012_f000129", "text": "'The Slytherins always come up to breakfast from over there,' said Ron, nodding at the entrance to the dungeons. The words had barely left his mouth when a girl with long curly hair emerged from the entrance.", "begin": 20491.548, "end": 20504.508, "localBegin": 1285.36, "localEnd": 1298.32}, {"id": "c012_f000130", "text": "'Excuse me,' said Ron, hurrying up to her, 'we'
