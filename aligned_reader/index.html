' toilet.'", "begin": 14508.02, "end": 14512.1, "localBegin": 1544.52, "localEnd": 1548.6}, {"id": "c009_f000162", "text": "'Oh, Ron, there won't be anyone in there,' said Hermione, standing up and coming over. 'That's Moaning Myrtle's place. Come on, let's have a look.'", "begin": 14512.1, "end": 14520.18, "localBegin": 1548.6, "localEnd": 1556.68}, {"id": "c009_f000163", "text": "And ignoring the large 'Out of Order' sign, she opened the door.", "begin": 14520.18, "end": 14524.42, "localBegin": 1556.68, "localEnd": 1560.92}, {"id": "c009_f000164", "text": "It was the gloomiest, most depressing bathroom Harry had ever set foot in. Under a large, cracked and spotted mirror were a row of chipped, stone sinks. The floor was damp and reflected the dull light given off by the stubs of a few candles, burning low in their holders; the wooden doors to the cubicles were flaking and scratched and one of them was dangling off its hinges.", "begin": 14524.42, "end": 14546.42, "localBegin": 1560.92, "localEnd": 1582.92}, {"id": "c009_f000165", "text": "Hermione put her fingers to her lips and set off towards the end cubicle. When she reached it she said, 'Hello, Myrtle, how are you?'", "begin": 14546.42, "end": 14554.22, "localBegin": 1582.92, "localEnd": 1590.72}, {"id": "c009_f000166", "text": "Harry and Ron went to look. Moaning Myrtle was floating on the cistern of the toilet, picking a spot on her chin.", "begin": 14554.22, "end": 14561.34, "localBegin": 1590.72, "localEnd": 1597.84}, {"id": "c009_f000167", "text": "'This is a girls' bathroom,' she said, eyeing Ron and Harry suspiciously. 'They're not girls.'", "begin": 14561.34, "end": 14569.66, "localBegin": 1597.84, "localEnd": 1606.16}, {"id": "c009_f000168", "text": "'No,' Hermione agreed. 'I just wanted to show them how - er nice it is in here.'", "begin": 14569.66, "end": 14575.66, "localBegin": 1606.16, "localEnd": 1612.16}, {"id": "c009_f000169", "text": "She waved vaguely at the dirty old mirror and the damp floor.", "begin": 14575.66, "end": 14579.3, "localBegin": 1612.16, "localEnd": 1615.8}, {"id": "c009_f000170", "text": "'Ask her if she saw anything,' Harry mouthed at Hermione.", "begin": 14579.3, "end": 14583.98, "localBegin": 1615.8, "localEnd": 1620.48}, {"id": "c009_f000171", "text": "'What are you whispering?' said Myrtle, staring at him.", "begin": 14583.98, "end": 14588.62, "localBegin": 1620.48, "localEnd": 1625.12}, {"id": "c009_f000172", "text": "'Nothing,' said Harry quickly. 'We wanted to ask -'", "begin": 14588.62, "end": 14591.62, "localBegin": 1625.12, "localEnd": 1628.12}, {"id": "c009_f000173", "text": "'I wish people would stop talking behind my back!' said Myrtle, in a voice choked with tears. 'I do have feelings, you know, even if I am dead.'", "begin": 14591.62, "end": 14603.58, "localBegin": 1628.12, "localEnd": 1640.08}, {"id": "c009_f000174", "text": "'Myrtle, no one wants to upset you,' said Hermione. 'Harry only -'", "begin": 14603.58, "end": 14608.34, "localBegin": 1640.08, "localEnd": 1644.84}, {"id": "c009_f000175", "text": "'No one wants to upset me! That's a good one!' howled Myrtle. 'My life was nothing but misery at this place and now people come along ruining my death!'", "begin": 14608.34, "end": 14620.7, "localBegin": 1644.84, "localEnd": 1657.2}, {"id": "c009_f000176", "text": "'We wanted to ask you if you'd seen anything funny lately,' said Hermione quickly, 'because a cat was attacked right outside your front door on Hallowe'en.'", "begin": 14620.7, "end": 14630.9, "localBegin": 1657.2, "localEnd": 1667.4}, {"id": "c009_f000177", "text": "'Did you see anyone near here that night?' said Harry.", "begin": 14630.9, "end": 14634.58, "localBegin": 1667.4, "localEnd": 1671.08}, {"id": "c009_f000178", "text": "'I wasn't paying attention,' said Myrtle dramatically. 'Peeves upset me so much I came in here and tried to kill myself. Then, of course, I remembered that I'm - that I'm -'", "begin": 14634.58, "end": 14650.54, "localBegin": 1671.08, "localEnd": 1687.04}, {"id": "c009_f000179", "text": "'Already dead,' said Ron helpfully.", "begin": 14650.54, "end": 14653.78, "localBegin": 1687.04, "localEnd": 1690.28}, {"id": "c009_f000180", "text": "Myrtle gave a tragic sob, rose up in the air, turned over and dived head first into the toilet, splashing water all over them and vanishing from sight; from the direction of her muffled sobs, she had come to rest somewhere in the U-bend.", "begin": 14653.78, "end": 14669.14, "localBegin": 1690.28, "localEnd": 1705.64}, {"id": "c009_f000181", "text": "Harry and Ron stood with their mouths open, but Hermione shrugged wearily and said, 'Honestly, that was almost cheerful for Myrtle ... come on, let's go.'", "begin": 14669.14, "end": 14679.1, "localBegin": 1705.64, "localEnd": 1715.6}, {"id": "c009_f000182", "text": "Harry had barely closed the door on Myrtle's gurgling sobs when a loud voice made all three of them jump.", "begin": 14679.1, "end": 14685.86, "localBegin": 1715.6, "localEnd": 1722.36}, {"id": "c009_f000183", "text": "'RON!'", "begin": 14685.86, "end": 14687.3, "localBegin": 1722.36, "localEnd": 1723.8}, {"id": "c009_f000184", "text": "Percy Weasley had stopped dead at the head of the stairs, prefect badge agleam, an expression of complete shock on his face.", "begin": 14687.3, "end": 14695.78, "localBegin": 1723.8, "localEnd": 1732.28}, {"id": "c009_f000185", "text": "'That's a girls' bathroom!' he gasped. 'What were you -?'", "begin": 14695.78, "end": 14700.54, "localBegin": 1732.28, "localEnd": 1737.04}, {"id": "c009_f000186", "text": "'Just having a look around,' Ron shrugged. 'Clues, you know ...'", "begin": 14700.54, "end": 14704.78, "localBegin": 1737.04, "localEnd": 1741.28}, {"id": "c009_f000187", "text": "Percy swelled in a manner that reminded Harry forcefully of Mrs Weasley.", "begin": 14704.78, "end": 14709.38, "localBegin": 1741.28, "localEnd": 1745.88}, {"id": "c009_f000188", "text": "'Get - away - from - there -' he said, striding towards them and starting to chivvy them along, flapping his arms. 'Don't you care what this looks like? Coming back here while everyone's at dinner ...'", "begin": 14709.38, "end": 14722.5, "localBegin": 1745.88, "localEnd": 1759.0}, {"id": "c009_f000189", "text": "'Why shouldn't we be here?' said Ron hotly, stopping short and glaring at Percy. 'Listen, we never laid a finger on that cat!'", "begin": 14722.5, "end": 14730.42, "localBegin": 1759.0, "localEnd": 1766.92}, {"id": "c009_f000190", "text": "'That's what I told Ginny,' said Percy fiercely, 'but she still seems to think you're going to be expelled; I've never seen her so upset, crying her eyes out. You might think of her, all the first-years are thoroughly over-excited by this business -'", "begin": 14730.42, "end": 14745.9, "localBegin": 1766.92, "localEnd": 1782.4}, {"id": "c009_f000191", "text": "'You don't care about Ginny,' said Ron, whose ears were reddening now. 'You're just worried I'm going to mess up your chances of being Head Boy.'", "begin": 14745.9, "end": 14753.54, "localBegin": 1782.4, "localEnd": 1790.04}, {"id": "c009_f000192", "text": "'Five points from Gryffindor!' Percy said tersely, fingering his prefect badge. 'And I hope it teaches you a lesson! No more detective work, or I'll write to Mum!'", "begin": 14753.54, "end": 14764.62, "localBegin": 1790.04, "localEnd": 1801.12}, {"id": "c009_f000193", "text": "And he strode off, the back of his neck as red as Ron's ears. * Harry, Ron and Hermione chose seats as far as possible from Percy in the common room that night. Ron was still in a very bad temper and kept blotting his Charms homework. When he reached absently for his wand to remove the smudges, it ignited the parchment. Fuming almost as much as his homework, Ron slammed The Standard Book of Spells, Grade 2 shut. To Harry's surprise,", "begin": 14764.62, "end": 14793.22, "localBegin": 1801.12, "localEnd": 1829.72}, {"id": "c009_f000194", "text": "Hermione followed suit.", "begin": 14793.22, "end": 14794.66, "localBegin": 1829.72, "localEnd": 1831.16}, {"id": "c009_f000195", "text": "'Who can it be, though?' she said in a quiet voice, as though continuing a conversation they had just been having. 'Who'd want all the Squibs and Muggle-borns out of Hogwarts?'", "begin": 14794.66, "end": 14806.42, "localBegin": 1831.16, "localEnd": 1842.92}, {"id": "c009_f000196", "text": "'Let's think,' said Ron in mock puzzlement. 'Who do we know who thinks Muggle-borns are scum?'", "begin": 14806.42, "end": 14814.1, "localBegin": 1842.92, "localEnd": 1850.6}, {"id": "c009_f000197", "text": "He looked at Hermione. Hermione looked back, unconvinced.", "begin": 14814.1, "end": 14817.94, "localBegin": 1850.6, "localEnd": 1854.44}, {"id": "c009_f000198", "text": "'If you're talking about Malfoy -'", "begin": 14817.94, "end": 14820.18, "localBegin": 1854.44, "localEnd": 1856.68}, {"id": "c009_f000199", "text": "'Of course I am!' said Ron. 'You heard him: \"You'll be next, Mudbloods!\" Come on, you've only got to look at his foul rat face to know it's him -'", "begin": 14820.18, "end": 14829.86, "localBegin": 1856.68, "localEnd": 1866.36}, {"id": "c009_f000200", "text": "'Malfoy, the heir of Slytherin?' said Hermione sceptically.", "begin": 14829.86, "end": 14835.1, "localBegin": 1866.36, "localEnd": 1871.6}, {"id": "c009_f000201", "text": "'Look at his family,' said Harry, closing his books, too. 'The whole lot of them have been in Slytherin, he's always boasting about it. They could easily be Slytherin's descendants. His father's definitely evil enough.'", "begin": 14835.1, "end": 14848.66, "localBegin": 1871.6, "localEnd": 1885.16}, {"id": "c009_f000202", "text": "'They could've had the key to the Chamber of Secrets for centuries!' said Ron. 'Handing it down, father to son ...'", "begin": 14848.66, "end": 14855.46, "localBegin": 1885.16, "localEnd": 1891.96}, {"id": "c009_f000203", "text": "'Well,' said Hermione cautiously, 'I suppose it's possible ...'", "begin": 14855.46, "end": 14860.7, "localBegin": 1891.96, "localEnd": 1897.2}, {"id": "c009_f000204", "text": "'But how do we prove it?' said Harry darkly.", "begin": 14860.7, "end": 14863.66, "localBegin": 1897.2, "localEnd": 1900.16}, {"id": "c009_f000205", "text": "'There might be a way,' said Hermione slowly, dropping her voice still further with a quick glance across the room at Percy. 'Of course, it would be difficult. And dangerous, very dangerous. We'd be breaking about fifty school rules, I expect.'", "begin": 14863.66, "end": 14880.22, "localBegin": 1900.16, "localEnd": 1916.72}, {"id": "c009_f000206", "text": "'If, in a month or so, you feel like explaining, you will let us know, won't you?' said Ron irritably.", "begin": 14880.22, "end": 14885.82, "localBegin": 1916.72, "localEnd": 1922.32}, {"id": "c009_f000207", "text": "'All right,' said Hermione coldly. 'What we'd need to do is to get inside the Slytherin common room and ask Malfoy a few questions without him realising it's us.'", "begin": 14885.82, "end": 14894.9, "localBegin": 1922.32, "localEnd": 1931.4}, {"id": "c009_f000208", "text": "'But that's impossible,' Harry said, as Ron laughed.", "begin": 14894.9, "end": 14898.62, "localBegin": 1931.4, "localEnd": 1935.12}, {"id": "c009_f000209", "text": "'No, it's not,' said Hermione. 'All we'd need would be some Polyjuice Potion.'", "begin": 14898.62, "end": 14903.62, "localBegin": 1935.12, "localEnd": 1940.12}, {"id": "c009_f000210", "text": "'What's that?' said Ron and Harry together.", "begin": 14903.62, "end": 14907.34, "localBegin": 1940.12, "localEnd": 1943.84}, {"id": "c009_f000211", "text": "'Snape mentioned it in class a few weeks ago -'", "begin": 14907.34, "end": 14910.34, "localBegin": 1943.84, "localEnd": 1946.84}, {"id": "c009_f000212", "text": "'D'you think we've got nothing better to do in Potions than listen to Snape?' muttered Ron.", "begin": 14910.34, "end": 14916.34, "localBegin": 1946.84, "localEnd": 1952.84}, {"id": "c009_f000213", "text": "'It transforms you into somebody else. Think about it! We could change into three of the Slytherins. No one would know it was us. Malfoy would probably tell us anything. He's probably boasting about it in the Slytherin common room right now, if only", "begin": 14916.34, "end": 14932.7, "localBegin": 1952.84, "localEnd": 1969.2}, {"id": "c009_f000214", "text": "we could hear him.'", "begin": 14932.7, "end": 14933.62, "localBegin": 1969.2, "localEnd": 1970.12}, {"id": "c009_f000215", "text": "'This Polyjuice stuff sounds a bit dodgy to me,' said Ron, frowning. 'What if we were stuck looking like three of the Slytherins for ever?'", "begin": 14933.62, "end": 14943.18, "localBegin": 1970.12, "localEnd": 1979.68}, {"id": "c009_f000216", "text": "'It wears off after a while,' said Hermione, waving her hand impatiently, 'but getting hold of the recipe will be very difficult. Snape said it was in a book called Moste Potente Potions and it's bound to be in the Restricted Section of the library.'", "begin": 14943.18, "end": 14959.1, "localBegin": 1979.68, "localEnd": 1995.6}, {"id": "c009_f000217", "text": "There was only one way to get out a book from the Restricted Section: you needed a signed note of permission from a teacher.", "begin": 14959.1, "end": 14966.58, "localBegin": 1995.6, "localEnd": 2003.08}, {"id": "c009_f000218", "text": "'Hard to see why we'd want the book, really,' said Ron, 'if we weren't going to try and make one of the potions.'", "begin": 14966.58, "end": 14973.46, "localBegin": 2003.08, "localEnd": 2009.96}, {"id": "c009_f000219", "text": "'I think,' said Hermione, 'that if we made it sound as though we were just interested in the theory, we might stand a chance ...'", "begin": 14973.46, "end": 14980.98, "localBegin": 2009.96, "localEnd": 2017.48}, {"id": "c009_f000220", "text": "'Oh, come on, no teacher's going to fall for that,' said Ron. 'They'd have to be really thick ...'", "begin": 14980.98, "end": 14988.5, "localBegin": 2017.48, "localEnd": 2025.0}]}, {"kind": "chapter", "number": 10, "title": "The Rogue Bludger", "audio": "audio/chapter_010.mp3", "start": 14988.5, "end": 16945.188, "duration": 1956.688, "paragraphs": [{"id": "c010_f000001", "text": "Chapter Ten. The Rogue Bludger.", "begin": 14988.5, "end": 14993.94, "localBegin": 0.0, "localEnd": 5.44}, {"id": "c010_f000002", "text": "Since the disastrous episode of the pixies, Professor Lockhart had not brought live creatures to class. Instead, he read passages from his books to them, and sometimes re-enacted some of the more dramatic bits. He usually picked Harry to help him with these reconstructions; so far, Harry had been forced to play a simple Transylvanian villager whom Lockhart had cured of a Babbling Curse, a yeti with a head-cold, and a vampire who had been unable to eat anything except lettuce since Lockhart had dealt with him.", "begin": 14993.94, "end": 15024.22, "localBegin": 5.44, "localEnd": 35.72}, {"id": "c010_f000003", "text": "Harry was hauled to the front of the class during their very next Defence Against the Dark Arts lesson, this time acting a werewolf. If he hadn't had a very good reason for keeping Lockhart in a good mood, he would have refused to do it.", "begin": 15024.22, "end": 15038.3, "localBegin": 35.72, "localEnd": 49.8}, {"id": "c010_f000004", "text": "'Nice loud howl, Harry - exactly - and then, if you'll believe it, I pounced - like this - slammed him to the floor - thus - with one hand, I managed to hold him down - with my other, I put my wand to his throat - I then screwed up my remaining strength and performed the immensely complex Homorphus Charm - he let out a piteous moan - go on, Harry - higher than that - good - the fur vanished - the fangs shrank - and he turned back into a man. Simple, yet effective - and another village will remember me forever as the hero who delivered them from the monthly terror of werewolf attacks.'", "begin": 15038.3, "end": 15079.94, "localBegin": 49.8, "localEnd": 91.44}, {"id": "c010_f000005", "text": "The bell rang and Lockhart got to his feet.", "begin": 15079.94, "end": 15082.5, "localBegin": 91.44, "localEnd": 94.0}, {"id": "c010_f000006", "text": "'Homework: compose a poem about my defeat of the Wagga Wagga werewolf! Signed copies of Magical Me to the author of the best one!'", "begin": 15082.5, "end": 15093.06, "localBegin": 94.0, "localEnd": 104.56}, {"id": "c010_f000007", "text": "The class began to leave. Harry returned to the back of the room, where Ron and Hermione were waiting.", "begin": 15093.06, "end": 15099.34, "localBegin": 104.56, "localEnd": 110.84}, {"id": "c010_f000008", "text": "'Ready?' Harry muttered.", "begin": 15099.34, "end": 15100.94, "localBegin": 110.84, "localEnd": 112.44}, {"id": "c010_f000009", "text": "'Wait till everyone's gone,' said Hermione nervously. 'All right ...'", "begin": 15100.94, "end": 15105.74, "localBegin": 112.44, "localEnd": 117.24}, {"id": "c010_f000010", "text": "She approached Lockhart's desk, a piece of paper clutched tightly in her hand, Harry and Ron right behind her.", "begin": 15105.74, "end": 15112.1, "localBegin": 117.24, "localEnd": 123.6}, {"id": "c010_f000011", "text": "'Er - Professor Lockhart?' Hermione stammered. 'I wanted to to get this book out of the library. Just for background reading.' She held out the piece of paper, her hand shaking slightly. 'But the thing is, it's in the Restricted Section of the library, so I need a teacher to sign for it - I'm sure it would help me understand what you say in Gadding with Ghouls about slow-acting venoms ...'", "begin": 15112.1, "end": 15136.54, "localBegin": 123.6, "localEnd": 148.04}, {"id": "c010_f000012", "text": "'Ah, Gadding with Ghouls!' said Lockhart, taking the note from Hermione and smiling widely at her. 'Possibly my very favourite book. You enjoyed it?'", "begin": 15136.54, "end": 15147.5, "localBegin": 148.04, "localEnd": 159.0}, {"id": "c010_f000013", "text": "'Oh, yes,' said Hermione eagerly. 'So clever, the way you trapped that last one with the tea-strainer ...'", "begin": 15147.5, "end": 15153.9, "localBegin": 159.0, "localEnd": 165.4}, {"id": "c010_f000014", "text": "'Well, I'm sure no one will mind me giving the best student in the year a little extra help,' said Lockhart warmly, and he pulled out an enormous peacock quill. 'Yes, nice, isn't it?' he said, misreading the revolted look on Ron's face. 'I usually save it for booksignings.'", "begin": 15153.9, "end": 15173.38, "localBegin": 165.4, "localEnd": 184.88}, {"id": "c010_f000015", "text": "He scrawled an enormous loopy signature on the note and handed it back to Hermione.", "begin": 15173.38, "end": 15178.9, "localBegin": 184.88, "localEnd": 190.4}, {"id": "c010_f000016", "text": "'So, Harry,' said Lockhart, while Hermione folded the note with fumbling fingers and slipped it into her bag, 'tomorrow's the first Quidditch match of the season, I believe? Gryffindor against Slytherin, is it not? I hear you're a useful player. I was a Seeker, too. I was asked to try for the National Squad, but preferred to dedicate my life to the eradication of the Dark Forces. Still, if ever you feel the need for a little private training, don't hesitate to ask. Always happy to pass on my expertise to less able players ...'", "begin": 15178.9, "end": 15217.98, "localBegin": 190.4, "localEnd": 229.48}, {"id": "c010_f000017", "text": "Harry made an indistinct noise in his throat and then hurried off after Ron and Hermione.", "begin": 15217.98, "end": 15223.98, "localBegin": 229.48, "localEnd": 235.48}, {"id": "c010_f000018", "text": "'I don't believe it,' he said, as the three of them examined the signature on the note, 'He didn't even look at the book we wanted.'", "begin": 15223.98, "end": 15231.78, "localBegin": 235.48, "localEnd": 243.28}, {"id": "c010_f000019", "text": "'That's because he's a brainless git,' said Ron. 'But who cares, we've got what we needed.'", "begin": 15231.78, "end": 15237.1, "localBegin": 243.28, "localEnd": 248.6}, {"id": "c010_f000020", "text": "'He is not a brainless git,' said Hermione shrilly, as they half-ran towards the library.", "begin": 15237.1, "end": 15243.46, "localBegin": 248.6, "localEnd": 254.96}, {"id": "c010_f000021", "text": "'Just because he said you were the best student in the year ...'", "begin": 15243.46, "end": 15246.98, "localBegin": 254.96, "localEnd": 258.48}, {"id": "c010_f000022", "text": "They dropped their voices as they entered the muffled stillness", "begin": 15246.98, "end": 15249.62, "localBegin": 258.48, "localEnd": 261.12}, {"id": "c010_f000023", "text": "of the library. Madam Pince, the librarian, was a thin, irritable woman who looked like an underfed vulture.", "begin": 15249.62, "end": 15257.18, "localBegin": 261.12, "localEnd": 268.68}, {"id": "c010_f000024", "text": "'Moste Potente Potions?' she repeated suspiciously, trying to take the note from Hermione; but Hermione wouldn't let go.", "begin": 15257.18, "end": 15265.82, "localBegin": 268.68, "localEnd": 277.32}, {"id": "c010_f000025", "text": "'I was wondering if I could keep it,' she said breathlessly.", "begin": 15265.82, "end": 15269.58, "localBegin": 277.32, "localEnd": 281.08}, {"id": "c010_f000026", "text": "'Oh, come on,' said Ron, wrenching it from her grasp and thrusting it at Madam Pince. 'We'll get you another autograph. Lockhart'll sign anything if it stands still long enough.'", "begin": 15269.58, "end": 15280.54, "localBegin": 281.08, "localEnd": 292.04}, {"id": "c010_f000027", "text": "Madam Pince held the note up to the light, as though determined to detect a forgery, but it passed the test. She stalked away between the lofty shelves and returned several minutes later carrying a large and mouldy-looking book. Hermione put it carefully into her bag and they left, trying not to walk too quickly or look too guilty.", "begin": 15280.54, "end": 15300.78, "localBegin": 292.04, "localEnd": 312.28}, {"id": "c010_f000028", "text": "Five minutes later, they were barricaded in Moaning Myrtle's out-of-order bathroom once again. Hermione had overridden Ron's objections by pointing out that it was the last place anyone in their right minds would go, so they were guaranteed some privacy. Moaning Myrtle was crying noisily in her cubicle, but they were ignoring her, and she them.", "begin": 15300.78, "end": 15322.02, "localBegin": 312.28, "localEnd": 333.52}, {"id": "c010_f000029", "text": "Hermione opened Moste Potente Potions carefully, and the three of them bent over the damp-spotted pages. It was clear from a glance why it belonged in the Restricted Section. Some of the potions had effects almost too gruesome to think about, and there were some very unpleasant illustrations, which included a man who seemed to have been turned inside out and a witch sprouting several extra pairs of arms out of her head.", "begin": 15322.02, "end": 15348.42, "localBegin": 333.52, "localEnd": 359.92}, {"id": "c010_f000030", "text": "'Here it is,' said Hermione excitedly, as she found the page headed The Polyjuice Potion. It was decorated with drawings of people halfway through transforming into other people. Harry sincerely hoped the artist had imagined the looks of intense pain on their faces.", "begin": 15348.42, "end": 15365.1, "localBegin": 359.92, "localEnd": 376.6}, {"id": "c010_f000031", "text": "'This is the most complicated potion I've ever seen,' said Hermione, as they scanned the recipe. 'Lacewing flies, leeches, fluxweed and knotgrass,' she murmured, running her finger down the list of ingredients. 'Well, they're easy enough, they're in the student store-cupboard, we can help ourselves. Oooh, look, powdered horn of a Bicorn - don't know where we're going to get that ... Shredded skin of a Boomslang - that'll be tricky, too - and of course a bit of whoever we want to change into.'", "begin": 15365.1, "end": 15399.7, "localBegin": 376.6, "localEnd": 411.2}, {"id": "c010_f000032", "text": "'Excuse me?' said Ron sharply. 'What d'you mean, a bit of whoever we're changing into? I'm drinking nothing with Crabbe's toenails in it ...'", "begin": 15399.7, "end": 15409.38, "localBegin": 411.2, "localEnd": 420.88}, {"id": "c010_f000033", "text": "Hermione continued as though she hadn't heard him.", "begin": 15409.38, "end": 15411.46, "localBegin": 420.88, "localEnd": 422.96}, {"id": "c010_f000034", "text": "'We don't have to worry about that yet, though, because we add those bits last ...'", "begin": 15411.46, "end": 15416.46, "localBegin": 422.96, "localEnd": 427.96}, {"id": "c010_f000035", "text": "Ron turned, speechless, to Harry, who had another worry.", "begin": 15416.46, "end": 15419.98, "localBegin": 427.96, "localEnd": 431.48}, {"id": "c010_f000036", "text": "'D'you realise how much we're going to have to steal, Hermione? Shredded skin of Boomslang, that's definitely not in the students' cupboard. What're we going to do, break into Snape's private stores? I don't know if this is a good idea ...'", "begin": 15419.98, "end": 15435.54, "localBegin": 431.48, "localEnd": 447.04}, {"id": "c010_f000037", "text": "Hermione shut the book with a snap.", "begin": 15435.54, "end": 15437.5, "localBegin": 447.04, "localEnd": 449.0}, {"id": "c010_f000038", "text": "'Well, if you two are going to chicken out, fine,' she said. There were bright pink patches on her cheeks and her eyes were brighter than usual. 'I don't want to break rules, you know. I think threatening Muggle-borns is far worse than brewing up a difficult potion. But if you don't want to find out if it's Malfoy, I'll go straight to Madam Pince now and hand the book back in ...'", "begin": 15437.5, "end": 15459.02, "localBegin": 449.0, "localEnd": 470.52}, {"id": "c010_f000039", "text": "'I never thought I'd see the day when you'd be persuading us to break rules,' said Ron. 'All right, we'll do it. But not toenails, OK?'", "begin": 15459.02, "end": 15467.9, "localBegin": 470.52, "localEnd": 479.4}, {"id": "c010_f000040", "text": "'How long will it take to make, anyway?' said Harry, as Hermione, looking happier, opened the book again.", "begin": 15467.9, "end": 15474.54, "localBegin": 479.4, "localEnd": 486.04}, {"id": "c010_f000041", "text": "'Well, as the fluxweed has got to be picked at the full moon and the lacewings have got to be stewed for twenty-one days ... I'd say it'd be ready in about a month, if we can get all the ingredients.'", "begin": 15474.54, "end": 15485.78, "localBegin": 486.04, "localEnd": 497.28}, {"id": "c010_f000042", "text": "'A month?' said Ron. 'Malfoy could have attacked half the Muggle-borns in the school by then!' But Hermione's eyes narrowed dangerously again, and he added swiftly, 'But it's the best plan we've got, so full steam ahead, I say.'", "begin": 15485.78, "end": 15500.9, "localBegin": 497.28, "localEnd": 512.4}, {"id": "c010_f000043", "text": "However, while Hermione was checking that the coast was clear for them to leave the bathroom, Ron muttered to Harry, 'It'll be a lot less hassle if you can just knock Malfoy off his broom tomorrow.' * Harry woke early on Saturday morning and lay for a while thinking about the coming Quidditch match. He was nervous, mainly at the thought of what Wood would say if Gryffindor lost, but also at the idea of facing a team mounted on the fastest racing brooms gold could buy. He had never wanted to beat Slytherin so badly. After half an hour of lying there with his insides churning, he got", "begin": 15500.9, "end": 15537.14, "localBegin": 512.4, "localEnd": 548.64}, {"id": "c010_f000044", "text": "up, dressed, and went down to breakfast early, where he found the rest of the Gryffindor team huddled at the long, empty table, all looking uptight and not speaking much.", "begin": 15537.14, "end": 15547.42, "localBegin": 548.64, "localEnd": 558.92}, {"id": "c010_f000045", "text": "As eleven o'clock approached, the whole school started to make its way down to the Quidditch stadium. It was a muggy sort of day with a hint of thunder in the air. Ron and Hermione came hurrying over to wish Harry good luck as he entered the changing rooms. The team pulled on their scarlet Gryffindor robes, then sat down to listen to Wood's usual pre-match pep talk.", "begin": 15547.42, "end": 15568.82, "localBegin": 558.92, "localEnd": 580.32}, {"id": "c010_f000046", "text": "'Slytherin have better brooms than us,' he began, 'no point denying it. But we've got better people on our brooms. We've trained harder than they have, we've been flying in all weathers -' ('Too true,' muttered George Weasley. 'I haven't been properly dry since August') '- and we're going to make them rue the day they let that little bit of slime, Malfoy, buy his way onto their team.'", "begin": 15568.82, "end": 15590.22, "localBegin": 580.32, "localEnd": 601.72}, {"id": "c010_f000047", "text": "Chest heaving with emotion, Wood turned to Harry.", "begin": 15590.22, "end": 15594.02, "localBegin": 601.72, "localEnd": 605.52}, {"id": "c010_f000048", "text": "'It'll be down to you, Harry, to show them that a Seeker has to have something more than a rich father. Get to that Snitch before Malfoy or die trying, Harry, because we've got to win today, we've got to.'", "begin": 15594.02, "end": 15607.3, "localBegin": 605.52, "localEnd": 618.8}, {"id": "c010_f000049", "text": "'So no pressure, Harry,' said Fred, winking at him.", "begin": 15607.3, "end": 15611.62, "localBegin": 618.8, "localEnd": 623.12}, {"id": "c010_f000050", "text": "As they walked out onto the pitch, a roar of noise greeted them; mainly cheers, because Ravenclaw and Hufflepuff were anxious to see Slytherin beaten, but the Slytherins in the crowd made their boos and hisses heard too. Madam Hooch, the Quidditch teacher, asked Flint and Wood to shake hands, which they did, giving each other threatening stares and gripping rather harder than was necessary.", "begin": 15611.62, "end": 15634.1, "localBegin": 623.12, "localEnd": 645.6}, {"id": "c010_f000051", "text": "'On my whistle,' said Madam Hooch, 'three ... two ... one ...'", "begin": 15634.1, "end": 15639.7, "localBegin": 645.6, "localEnd": 651.2}, {"id": "c010_f000052", "text": "With a roar from the crowd to speed them upwards, the fourteen players rose towards the leaden sky. Harry flew higher than any of them, squinting around for the Snitch.", "begin": 15639.7, "end": 15649.74, "localBegin": 651.2, "localEnd": 661.24}, {"id": "c010_f000053", "text": "'All right there, Scarhead?' yelled Malfoy, shooting underneath him as though to show off the speed of his broom.", "begin": 15649.74, "end": 15656.5, "localBegin": 661.24, "localEnd": 668.0}, {"id": "c010_f000054", "text": "Harry had no time to reply. At that very moment, a heavy black Bludger came pelting towards him; he avoided it so narrowly that he felt it ruffle his hair as it passed.", "begin": 15656.5, "end": 15666.54, "localBegin": 668.0, "localEnd": 678.04}, {"id": "c010_f000055", "text": "'Close one, Harry!' said George, streaking past him with his club in his hand, ready to knock the Bludger back towards a Slytherin. Harry saw George give the Bludger a powerful whack in", "begin": 15666.54, "end": 15678.14, "localBegin": 678.04, "localEnd": 689.64}, {"id": "c010_f000056", "text": "the direction of Adrian Pucey, but the Bludger changed direction in mid-air and shot straight for Harry again.", "begin": 15678.14, "end": 15684.22, "localBegin": 689.64, "localEnd": 695.72}, {"id": "c010_f000057", "text": "Harry dropped quickly to avoid it, and George managed to hit it hard towards Malfoy. Once again, the Bludger swerved like a boomerang and shot at Harry's head.", "begin": 15684.22, "end": 15694.14, "localBegin": 695.72, "localEnd": 705.64}, {"id": "c010_f000058", "text": "Harry put on a burst of speed and zoomed towards the other end of the pitch. He could hear the Bludger whistling along behind him. What was going on? Bludgers never concentrated on one player like this, it was their job to try and unseat as many people as possible ...", "begin": 15694.14, "end": 15708.7, "localBegin": 705.64, "localEnd": 720.2}, {"id": "c010_f000059", "text": "Fred Weasley was waiting for the Bludger at the other end. Harry ducked as Fred swung at the Bludger with all his might; the Bludger was knocked off course.", "begin": 15708.7, "end": 15717.46, "localBegin": 720.2, "localEnd": 728.96}, {"id": "c010_f000060", "text": "'That's done it!' Fred yelled happily, but he was wrong; as though it was magnetically attracted towards Harry, the Bludger pelted after him once more and Harry was forced to fly off at full speed.", "begin": 15717.46, "end": 15728.1, "localBegin": 728.96, "localEnd": 739.6}, {"id": "c010_f000061", "text": "It had started to rain; Harry felt heavy drops fall onto his face, splattering onto his glasses. He didn't have a clue what was going on in the rest of the game until he heard Lee Jordan, who was commentating, say, 'Slytherin lead, sixty points to zero.'", "begin": 15728.1, "end": 15745.58, "localBegin": 739.6, "localEnd": 757.08}, {"id": "c010_f000062", "text": "The Slytherins' superior brooms were clearly doing their jobs, and meanwhile the mad Bludger was doing all it could to knock Harry out of the air. Fred and George were now flying so close to him on either side that Harry could see nothing at all except their flailing arms and had no chance to look for the Snitch, let alone catch it.", "begin": 15745.58, "end": 15763.62, "localBegin": 757.08, "localEnd": 775.12}, {"id": "c010_f000063", "text": "'Someone's - tampered - with - this - Bludger -' Fred grunted, swinging his bat with all his might at it as it launched a new attack on Harry.", "begin": 15763.62, "end": 15772.78, "localBegin": 775.12, "localEnd": 784.28}, {"id": "c010_f000064", "text": "'We need time out,' said George, trying to signal to Wood and stop the Bludger breaking Harry's nose at the same time.", "begin": 15772.78, "end": 15779.94, "localBegin": 784.28, "localEnd": 791.44}, {"id": "c010_f000065", "text": "Wood had obviously got the message. Madam Hooch's whistle rang out and Harry, Fred and George dived for the ground, still trying to avoid the mad Bludger.", "begin": 15779.94, "end": 15790.46, "localBegin": 791.44, "localEnd": 801.96}, {"id": "c010_f000066", "text": "'What's going on?' said Wood, as the Gryffindor team huddled together, while Slytherins in the crowd jeered. 'We're being flattened. Fred, George, where were you when that Bludger stopped Angelina scoring?'", "begin": 15790.46, "end": 15801.5, "localBegin": 801.96, "localEnd": 813.0}, {"id": "c010_f000067", "text": "'We were twenty feet above her, stopping the other Bludger", "begin": 15801.5, "end": 15804.7, "localBegin": 813.0, "localEnd": 816.2}, {"id": "c010_f000068", "text": "murdering Harry, Oliver,' said George angrily. 'Someone's fixed it it won't leave Harry alone, it hasn't gone for anyone else all game. The Slytherins must have done something to it.'", "begin": 15804.7, "end": 15816.34, "localBegin": 816.2, "localEnd": 827.84}, {"id": "c010_f000069", "text": "'But the Bludgers have been locked in Madam Hooch's office since our last practice, and there was nothing wrong with them then ...' said Wood, anxiously.", "begin": 15816.34, "end": 15824.9, "localBegin": 827.84, "localEnd": 836.4}, {"id": "c010_f000070", "text": "Madam Hooch was walking towards them. Over her shoulder, Harry could see the Slytherin team jeering and pointing in his direction.", "begin": 15824.9, "end": 15832.86, "localBegin": 836.4, "localEnd": 844.36}, {"id": "c010_f000071", "text": "'Listen,' said Harry, as she came nearer and nearer, 'with you two flying round me all the time the only way I'm going to catch the Snitch is if it flies up my sleeve. Go back to the rest of the team and let me deal with the rogue one.'", "begin": 15832.86, "end": 15844.78, "localBegin": 844.36, "localEnd": 856.28}, {"id": "c010_f000072", "text": "'Don't be thick,' said Fred. 'It'll take your head off.'", "begin": 15844.78, "end": 15848.46, "localBegin": 856.28, "localEnd": 859.96}, {"id": "c010_f000073", "text": "Wood was looking from Harry to the Weasleys.", "begin": 15848.46, "end": 15851.14, "localBegin": 859.96, "localEnd": 862.64}, {"id": "c010_f000074", "text": "'Oliver, this is mad,' said Alicia Spinnet angrily. 'You can't let Harry deal with that thing on his own. Let's ask for an inquiry -'", "begin": 15851.14, "end": 15859.74, "localBegin": 862.64, "localEnd": 871.24}, {"id": "c010_f000075", "text": "'If we stop now, we'll have to forfeit the match!' said Harry. 'And we're not losing to Slytherin just because of a mad Bludger! Come on, Oliver, tell them to leave me alone!'", "begin": 15859.74, "end": 15868.98, "localBegin": 871.24, "localEnd": 880.48}, {"id": "c010_f000076", "text": "'This is all your fault,' George said angrily to Wood. ' \"Get the Snitch or die trying\" - what a stupid thing to tell him!'", "begin": 15868.98, "end": 15877.06, "localBegin": 880.48, "localEnd": 888.56}, {"id": "c010_f000077", "text": "Madam Hooch had joined them.", "begin": 15877.06, "end": 15879.06, "localBegin": 888.56, "localEnd": 890.56}, {"id": "c010_f000078", "text": "'Ready to resume play?' she asked Wood.", "begin": 15879.06, "end": 15882.5, "localBegin": 890.56, "localEnd": 894.0}, {"id": "c010_f000079", "text": "Wood looked at the determined look on Harry's face.", "begin": 15882.5, "end": 15886.02, "localBegin": 894.0, "localEnd": 897.52}, {"id": "c010_f000080", "text": "'All right,' he said. 'Fred, George, you heard Harry - leave him alone and let him deal with the Bludger on his own.'", "begin": 15886.02, "end": 15891.42, "localBegin": 897.52, "localEnd": 902.92}, {"id": "c010_f000081", "text": "The rain was falling more heavily now. On Madam Hooch's whistle, Harry kicked hard into the air and heard the tell-tale whoosh of the Bludger behind him. Higher and higher Harry climbed. He looped and swooped, spiralled, zig-zagged and rolled. Slightly dizzy, he nevertheless kept his eyes wide open. Rain was speckling his glasses and ran up his nostrils as he hung upside down, avoiding another fierce dive from the Bludger. He could hear laughter from the crowd; he knew he must look very stupid, but the rogue Bludger was heavy and couldn't change direction as quickly as he could. He began a kind of roller-coaster ride around the edges of the stadium, squinting through the silver sheets of rain to the Gryffindor goalposts, where Adrian Pucey was trying to get past Wood ...", "begin": 15891.42, "end": 15936.74, "localBegin": 902.92, "localEnd": 948.24}, {"id": "c010_f000082", "text": "A whistling in Harry's ear told him the Bludger had just missed him again; he turned right over and sped in the opposite direction.", "begin": 15936.74, "end": 15943.3, "localBegin": 948.24, "localEnd": 954.8}, {"id": "c010_f000083", "text": "'Training for the ballet, Potter?' yelled Malfoy, as Harry was forced to do a stupid kind of twirl in mid-air to dodge the Bludger. Off Harry fled, the Bludger trailing a few feet behind him: and then, glaring back at Malfoy in hatred, he saw it, the Golden Snitch. It was hovering inches above Malfoy's left ear - and Malfoy, busy laughing at Harry, hadn't seen it.", "begin": 15943.3, "end": 15967.66, "localBegin": 954.8, "localEnd": 979.16}, {"id": "c010_f000084", "text": "For an agonising moment, Harry hung in mid-air, not daring to speed towards Malfoy in case he looked up and saw the Snitch.", "begin": 15967.66, "end": 15975.5, "localBegin": 979.16, "localEnd": 987.0}, {"id": "c010_f000085", "text": "WHAM!", "begin": 15975.5, "end": 15976.7, "localBegin": 987.0, "localEnd": 988.2}, {"id": "c010_f000086", "text": "He had stayed still a second too long. The Bludger had hit him at last, smashed into his elbow, and Harry felt his arm break. Dimly, dazed by the searing pain in his arm, he slid sideways on his rain-drenched broom, one knee still crooked over it, his right arm dangling useless at his side. The Bludger came pelting back for a second attack, this time aiming at his face. Harry swerved out of the way, one idea firmly lodged in his numb brain: get to Malfoy.", "begin": 15976.7, "end": 16005.82, "localBegin": 988.2, "localEnd": 1017.32}, {"id": "c010_f000087", "text": "Through a haze of rain and pain he dived for the shimmering, sneering face below him and saw its eyes widen with fear: Malfoy thought Harry was attacking him.", "begin": 16005.82, "end": 16017.06, "localBegin": 1017.32, "localEnd": 1028.56}, {"id": "c010_f000088", "text": "'What the -' he gasped, careering out of Harry's way.", "begin": 16017.06, "end": 16020.86, "localBegin": 1028.56, "localEnd": 1032.36}, {"id": "c010_f000089", "text": "Harry took his remaining hand off his broom and made a wild snatch; he felt his fingers close on the cold Snitch but was now only gripping the broom with his legs and there was a yell from the crowd below as he headed straight for the ground, trying hard not to pass out.", "begin": 16020.86, "end": 16036.34, "localBegin": 1032.36, "localEnd": 1047.84}, {"id": "c010_f000090", "text": "With a splattering thud he hit the mud and rolled off his broom. His arm was hanging at a very strange angle. Riddled with pain, he heard, as though from a distance, a good deal of whistling and shouting. He focused on the Snitch clutched in his good hand.", "begin": 16036.34, "end": 16052.42, "localBegin": 1047.84, "localEnd": 1063.92}, {"id": "c010_f000091", "text": "'Aha,' he said vaguely, 'we've won.'", "begin": 16052.42, "end": 16056.66, "localBegin": 1063.92, "localEnd": 1068.16}, {"id": "c010_f000092", "text": "And he fainted.", "begin": 16056.66, "end": 16057.5, "localBegin": 1068.16, "localEnd": 1069.0}, {"id": "c010_f000093", "text": "He came round, rain falling on his face, still lying on the pitch, with someone leaning over him. He saw a glitter of teeth.", "begin": 16057.5, "end": 16066.82, "localBegin": 1069.0, "localEnd": 1078.32}, {"id": "c010_f000094", "text": "'Oh no, not you,' he moaned.", "begin": 16066.82, "end": 16070.26, "localBegin": 1078.32, "localEnd": 1081.76}, {"id": "c010_f000095", "text": "'Doesn't know what he's saying,' said Lockhart loudly, to the", "begin": 16070.26, "end": 16074.1, "localBegin": 1081.76, "localEnd": 1085.6}, {"id": "c010_f000096", "text": "anxious crowd of Gryffindors pressing around them. 'Not to worry, Harry. I'm about to fix your arm.'", "begin": 16074.1, "end": 16080.1, "localBegin": 1085.6, "localEnd": 1091.6}, {"id": "c010_f000097", "text": "'No!' said Harry. 'I'll keep it like this, thanks ...'", "begin": 16080.1, "end": 16083.5, "localBegin": 1091.6, "localEnd": 1095.0}, {"id": "c010_f000098", "text": "He tried to sit up, but the pain was terrible. He heard a familiar clicking noise nearby.", "begin": 16083.5, "end": 16089.38, "localBegin": 1095.0, "localEnd": 1100.88}, {"id": "c010_f000099", "text": "'I don't want a photo of this, Colin,' he said loudly.", "begin": 16089.38, "end": 16093.02, "localBegin": 1100.88, "localEnd": 1104.52}, {"id": "c010_f000100", "text": "'Lie back, Harry,' said Lockhart soothingly. 'It's a simple charm I've used countless times.'", "begin": 16093.02, "end": 16100.26, "localBegin": 1104.52, "localEnd": 1111.76}, {"id": "c010_f000101", "text": "'Why can't I just go to the hospital wing?' said Harry through clenched teeth.", "begin": 16100.26, "end": 16104.54, "localBegin": 1111.76, "localEnd": 1116.04}, {"id": "c010_f000102", "text": "'He should really, Professor,' said a muddy Wood, who couldn't help grinning even though his Seeker was injured. 'Great capture, Harry, really spectacular, your best yet, I'd say.'", "begin": 16104.54, "end": 16115.22, "localBegin": 1116.04, "localEnd": 1126.72}, {"id": "c010_f000103", "text": "Through the thicket of legs around him, Harry spotted Fred and George Weasley, wrestling the rogue Bludger into a box. It was still putting up a terrific fight.", "begin": 16115.22, "end": 16124.58, "localBegin": 1126.72, "localEnd": 1136.08}, {"id": "c010_f000104", "text": "'Stand back,' said Lockhart, who was rolling up his jade-green sleeves.", "begin": 16124.58, "end": 16129.46, "localBegin": 1136.08, "localEnd": 1140.96}, {"id": "c010_f000105", "text": "'No - don't -' said Harry weakly, but Lockhart was twirling his wand and a second later had directed it straight at Harry's arm.", "begin": 16129.46, "end": 16137.38, "localBegin": 1140.96, "localEnd": 1148.88}, {"id": "c010_f000106", "text": "A strange and unpleasant sensation started at Harry's shoulder and spread all the way down to his fingertips. It felt as though his arm was being deflated. He didn't dare look at what was happening. He had shut his eyes, his face turned away from his arm, but his worst fears were realised as the people above him gasped and Colin Creevey began clicking away madly. His arm didn't hurt any more - but nor did it feel remotely like an arm.", "begin": 16137.38, "end": 16164.94, "localBegin": 1148.88, "localEnd": 1176.44}, {"id": "c010_f000107", "text": "'Ah,' said Lockhart. 'Yes. Well, that can sometimes happen. But the point is, the bones are no longer broken. That's the thing to bear in mind. So, Harry, just toddle up to the Hospital Wing - ah, Mr Weasley, Miss Granger, would you escort him? - and Madam Pomfrey will be able to - er - tidy you up a bit.'", "begin": 16164.94, "end": 16191.5, "localBegin": 1176.44, "localEnd": 1203.0}, {"id": "c010_f000108", "text": "As Harry got to his feet, he felt strangely lopsided. Taking a deep breath he looked down at his right side. What he saw nearly made him pass out again.", "begin": 16191.5, "end": 16201.1, "localBegin": 1203.0, "localEnd": 1212.6}, {"id": "c010_f000109", "text": "Poking out of the end of his robes was what looked like a thick, flesh-coloured rubber glove. He tried to move his fingers. Nothing happened.", "begin": 16201.1, "end": 16209.9, "localBegin": 1212.6, "localEnd": 1221.4}, {"id": "c010_f000110", "text": "Lockhart hadn't mended Harry's bones. He had removed them. *", "begin": 16209.9, "end": 16214.82, "localBegin": 1221.4, "localEnd": 1226.32}, {"id": "c010_f000111", "text": "Madam Pomfrey wasn't at all pleased.", "begin": 16214.82, "end": 16219.54, "localBegin": 1226.32, "localEnd": 1231.04}, {"id": "c010_f000112", "text": "'You should have come straight to me!' she raged, holding up the sad, limp remainder of what, half an hour before, had been a working arm. 'I can mend bones in a second - but growing them back -'", "begin": 16219.54, "end": 16230.7, "localBegin": 1231.04, "localEnd": 1242.2}, {"id": "c010_f000113", "text": "'You will be able to, won't you?' said Harry desperately.", "begin": 16230.7, "end": 16234.34, "localBegin": 1242.2, "localEnd": 1245.84}, {"id": "c010_f000114", "text": "'I'll be able to, certainly, but it will be painful,' said Madam Pomfrey grimly, throwing Harry a pair of pyjamas. 'You'll have to stay the night ...'", "begin": 16234.34, "end": 16243.54, "localBegin": 1245.84, "localEnd": 1255.04}, {"id": "c010_f000115", "text": "Hermione waited outside the curtain drawn around Harry's bed while Ron helped him into his pyjamas. It took a while to stuff the rubbery, boneless arm into a sleeve.", "begin": 16243.54, "end": 16253.9, "localBegin": 1255.04, "localEnd": 1265.4}, {"id": "c010_f000116", "text": "'How can you stick up for Lockhart now, Hermione, eh?' Ron called through the curtain as he pulled Harry's limp fingers through the cuff. 'If Harry had wanted de-boning he would have asked.'", "begin": 16253.9, "end": 16265.66, "localBegin": 1265.4, "localEnd": 1277.16}, {"id": "c010_f000117", "text": "'Anyone can make a mistake,' said Hermione, 'And it doesn't hurt any more, does it, Harry?'", "begin": 16265.66, "end": 16270.3, "localBegin": 1277.16, "localEnd": 1281.8}, {"id": "c010_f000118", "text": "'No,' said Harry, 'but it doesn't do anything else, either.'", "begin": 16270.3, "end": 16274.7, "localBegin": 1281.8, "localEnd": 1286.2}, {"id": "c010_f000119", "text": "As he swung himself onto the bed, his arm flapped pointlessly.", "begin": 16274.7, "end": 16278.9, "localBegin": 1286.2, "localEnd": 1290.4}, {"id": "c010_f000120", "text": "Hermione and Madam Pomfrey came around the curtain. Madam Pomfrey was holding a large bottle of something labelled 'Skele-Gro'.", "begin": 16278.9, "end": 16286.54, "localBegin": 1290.4, "localEnd": 1298.04}, {"id": "c010_f000121", "text": "'You're in for a rough night,' she said, pouring out a steaming beakerful and handing it to him. 'Regrowing bones is a nasty business.'", "begin": 16286.54, "end": 16295.34, "localBegin": 1298.04, "localEnd": 1306.84}, {"id": "c010_f000122", "text": "So was taking the Skele-Gro. It burned Harry's mouth and throat as it went down, making him cough and splutter. Still tuttutting about dangerous sports and inept teachers, Madam Pomfrey retreated, leaving Ron and Hermione to help Harry gulp down some water.", "begin": 16295.34, "end": 16312.38, "localBegin": 1306.84, "localEnd": 1323.88}, {"id": "c010_f000123", "text": "'We won, though,' said Ron, a grin breaking across his face. 'That was some catch you made. Malfoy's face ... he looked ready to kill!'", "begin": 16312.38, "end": 16320.82, "localBegin": 1323.88, "localEnd": 1332.32}, {"id": "c010_f000124", "text": "'I want to know how he fixed that Bludger,' said Hermione darkly.", "begin": 16320.82, "end": 16325.66, "localBegin": 1332.32, "localEnd": 1337.16}, {"id": "c010_f000125", "text": "'We can add that to the list of questions we'll ask him when we've taken the Polyjuice Potion,' said Harry, sinking back onto his pillows. 'I hope it tastes better than this stuff ...'", "begin": 16325.66, "end": 16334.74, "localBegin": 1337.16, "localEnd": 1346.24}, {"id": "c010_f000126", "text": "'If it's got bits of Slytherins in it? You've got to be joking,' said Ron.", "begin": 16334.74, "end": 16339.7, "localBegin": 1346.24, "localEnd": 1351.2}, {"id": "c010_f000127", "text": "The door of the hospital wing burst open at that moment. Filthy and soaking wet, the rest of the Gryffindor team had arrived to see Harry.", "begin": 16339.7, "end": 16348.26, "localBegin": 1351.2, "localEnd": 1359.76}, {"id": "c010_f000128", "text": "'Unbelievable flying, Harry,' said George. 'I've just seen Marcus Flint yelling at Malfoy. Something about having the Snitch on top of his head and not noticing. Malfoy didn't seem too happy.'", "begin": 16348.26, "end": 16360.58, "localBegin": 1359.76, "localEnd": 1372.08}, {"id": "c010_f000129", "text": "They had brought cakes, sweets and bottles of pumpkin juice; they gathered around Harry's bed and were just getting started on what promised to be a good party when Madam Pomfrey came storming over, shouting, 'This boy needs rest, he's got thirty-three bones to regrow! Out! OUT!'", "begin": 16360.58, "end": 16378.06, "localBegin": 1372.08, "localEnd": 1389.56}, {"id": "c010_f000130", "text": "And Harry was left alone, with nothing to distract him from the stabbing pains in his limp arm. * Hours and hours later, Harry woke quite suddenly in the pitch blackness and gave a small yelp of pain: his arm now felt full of large splinters. For a second, he thought it was that which had woken him. Then, with a thrill of horror, he realised that someone was sponging his forehead in the dark.", "begin": 16378.06, "end": 16406.14, "localBegin": 1389.56, "localEnd": 1417.64}, {"id": "c010_f000131", "text": "'Get off!' he said loudly, and then, 'Dobby!'", "begin": 16406.14, "end": 16410.18, "localBegin": 1417.64, "localEnd": 1421.68}, {"id": "c010_f000132", "text": "The house-elf's goggling tennis-ball eyes were peering at Harry through the darkness. A single tear was running down his long, pointed nose.", "begin": 16410.18, "end": 16419.06, "localBegin": 1421.68, "localEnd": 1430.56}, {"id": "c010_f000133", "text": "'Harry Potter came back to school,' he whispered miserably. 'Dobby warned and warned Harry Potter. Ah sir, why didn't you heed Dobby? Why didn't Harry Potter go back home when he missed the train?'", "begin": 16419.06, "end": 16433.62, "localBegin": 1430.56, "localEnd": 1445.12}, {"id": "c010_f000134", "text": "Harry heaved himself up on his pillows and pushed Dobby's sponge away.", "begin": 16433.62, "end": 16438.18, "localBegin": 1445.12, "localEnd": 1449.68}, {"id": "c010_f000135", "text": "'What're you doing here?' he said. 'And how did you know I missed the train?'", "begin": 16438.18, "end": 16442.94, "localBegin": 1449.68, "localEnd": 1454.44}, {"id": "c010_f000136", "text": "Dobby's lip trembled and Harry was seized by a sudden suspicion.", "begin": 16442.94, "end": 16447.58, "localBegin": 1454.44, "localEnd": 1459.08}, {"id": "c010_f000137", "text": "'It was you!' he said slowly. 'You stopped the barrier letting us through!'", "begin": 16447.58, "end": 16454.86, "localBegin": 1459.08, "localEnd": 1466.36}, {"id": "c010_f000138", "text": "'Indeed yes, sir,' said Dobby, nodding his head vigorously, ears flapping. 'Dobby hid and watched for Harry Potter and sealed the gateway and Dobby had to iron his hands afterwards -' he showed Harry ten, long, bandaged fingers, '- but Dobby didn't care, sir, for he thought Harry Potter was safe, and never did Dobby dream that", "begin": 16454.86, "end": 16477.38, "localBegin": 1466.36, "localEnd": 1488.88}, {"id": "c010_f000139", "text": "Harry Potter would get to school another way!'", "begin": 16477.38, "end": 16479.62, "localBegin": 1488.88, "localEnd": 1491.12}, {"id": "c010_f000140", "text": "He was rocking backwards and forwards, shaking his ugly head.", "begin": 16479.62, "end": 16483.5, "localBegin": 1491.12, "localEnd": 1495.0}, {"id": "c010_f000141", "text": "'Dobby was so shocked when he heard Harry Potter was back at Hogwarts, he let his master's dinner burn! Such a flogging Dobby never had, sir ...'", "begin": 16483.5, "end": 16494.26, "localBegin": 1495.0, "localEnd": 1505.76}, {"id": "c010_f000142", "text": "Harry slumped back onto his pillows.", "begin": 16494.26, "end": 16497.14, "localBegin": 1505.76, "localEnd": 1508.64}, {"id": "c010_f000143", "text": "'You nearly got Ron and me expelled,' he said fiercely. 'You'd better clear off before my bones come back, Dobby, or I might strangle you.'", "begin": 16497.14, "end": 16505.38, "localBegin": 1508.64, "localEnd": 1516.88}, {"id": "c010_f000144", "text": "Dobby smiled weakly.", "begin": 16505.38, "end": 16507.62, "localBegin": 1516.88, "localEnd": 1519.12}, {"id": "c010_f000145", "text": "'Dobby is used to death threats, sir. Dobby gets them five times a day at home.'", "begin": 16507.62, "end": 16514.1, "localBegin": 1519.12, "localEnd": 1525.6}, {"id": "c010_f000146", "text": "He blew his nose on a corner of the filthy pillowcase he wore, looking so pathetic that Harry felt his anger ebb away in spite of himself.", "begin": 16514.1, "end": 16522.86, "localBegin": 1525.6, "localEnd": 1534.36}, {"id": "c010_f000147", "text": "'Why d'you wear that thing, Dobby?' he asked curiously.", "begin": 16522.86, "end": 16527.5, "localBegin": 1534.36, "localEnd": 1539.0}, {"id": "c010_f000148", "text": "'This, sir?' said Dobby, plucking at the pillowcase. ''Tis a mark of the house-elf's enslavement, sir. Dobby can only be freed if his masters present him with clothes, sir. The family is careful not to pass Dobby even a sock, sir, for then he would be free to leave their house for ever.'", "begin": 16527.5, "end": 16549.14, "localBegin": 1539.0, "localEnd": 1560.64}, {"id": "c010_f000149", "text": "Dobby mopped his bulging eyes and said suddenly, 'Harry Potter must go home! Dobby thought his Bludger would be enough to make -'", "begin": 16549.14, "end": 16557.86, "localBegin": 1560.64, "localEnd": 1569.36}, {"id": "c010_f000150", "text": "'Your Bludger?' said Harry, anger rising once more. 'What d'you mean, your Bludger? You made that Bludger try and kill me?'", "begin": 16557.86, "end": 16566.3, "localBegin": 1569.36, "localEnd": 1577.8}, {"id": "c010_f000151", "text": "'Not kill you, sir, never kill you!' said Dobby, shocked. 'Dobby wants to save Harry Potter's life! Better sent home, grievously injured, than remain here, sir! Dobby only wanted Harry Potter hurt enough to be sent home!'", "begin": 16566.3, "end": 16584.46, "localBegin": 1577.8, "localEnd": 1595.96}, {"id": "c010_f000152", "text": "'Oh, is that all?' said Harry angrily. 'I don't suppose you're going to tell me why you wanted me sent home in pieces?'", "begin": 16584.46, "end": 16591.78, "localBegin": 1595.96, "localEnd": 1603.28}, {"id": "c010_f000153", "text": "'Ah, if Harry Potter only knew!' Dobby groaned, more tears dripping onto his ragged pillowcase. 'If he knew what he means to us, to the lowly, the enslaved, us dregs of the magical world! Dobby remembers how it was when He Who Must Not Be Named was at the height of his powers, sir! We house-elves were treated like vermin, sir! Of course, Dobby is still treated like that, sir,' he admitted, drying his face on the pillowcase. 'But mostly, sir, life", "begin": 16591.78, "end": 16625.34, "localBegin": 1603.28, "localEnd": 1636.84}, {"id": "c010_f000154", "text": "has improved for my kind since you triumphed over He Who Must Not Be Named. Harry Potter survived, and the Dark Lord's power was broken, and it was a new dawn, sir, and Harry Potter shone like a beacon of hope for those of us who thought the dark days would never end, sir ... And now, at Hogwarts, terrible things are to happen, are perhaps happening already, and Dobby cannot let Harry Potter stay here now that history is to repeat itself, now that the Chamber of Secrets is open once more -'", "begin": 16625.34, "end": 16661.74, "localBegin": 1636.84, "localEnd": 1673.24}, {"id": "c010_f000155", "text": "Dobby froze, horror-struck, then grabbed Harry's water jug from his bedside table and cracked it over his own head, toppling out of sight. A second later, he crawled back onto the bed, crosseyed, muttering, 'Bad Dobby, very bad Dobby ...'", "begin": 16661.74, "end": 16677.7, "localBegin": 1673.24, "localEnd": 1689.2}, {"id": "c010_f000156", "text": "'So there is a Chamber of Secrets?' Harry whispered. And - did you say it's been opened before? Tell me, Dobby!'", "begin": 16677.7, "end": 16687.98, "localBegin": 1689.2, "localEnd": 1699.48}, {"id": "c010_f000157", "text": "He seized the elf's bony wrist as Dobby's hand inched towards the water jug. 'But I'm not Muggle-born - how can I be in danger from the Chamber?'", "begin": 16687.98, "end": 16697.86, "localBegin": 1699.48, "localEnd": 1709.36}, {"id": "c010_f000158", "text": "'Ah, sir, ask no more, ask no more of poor Dobby,' stammered the elf, his eyes huge in the dark. 'Dark deeds are planned in this place, but Harry Potter must not be here when they happen. Go home, Harry Potter. Go home. Harry Potter must not meddle in this, sir, 'tis too dangerous -'", "begin": 16697.86, "end": 16720.74, "localBegin": 1709.36, "localEnd": 1732.24}, {"id": "c010_f000159", "text": "'Who is it, Dobby?' Harry said, keeping a firm hold on Dobby's wrist to stop him hitting himself with the water jug again. 'Who's opened it? Who opened it last time?'", "begin": 16720.74, "end": 16731.42, "localBegin": 1732.24, "localEnd": 1742.92}, {"id": "c010_f000160", "text": "'Dobby can't, sir, Dobby can't, Dobby mustn't tell!' squealed the elf. 'Go home, Harry Potter, go home!'", "begin": 16731.42, "end": 16740.9, "localBegin": 1742.92, "localEnd": 1752.4}, {"id": "c010_f000161", "text": "'I'm not going anywhere!' said Harry fiercely. 'One of my best friends is Muggle-born, she'll be first in line if the Chamber really has been opened -'", "begin": 16740.9, "end": 16749.22, "localBegin": 1752.4, "localEnd": 1760.72}, {"id": "c010_f000162", "text": "'Harry Potter risks his own life for his friends!' moaned Dobby, in a kind of miserable ecstasy. 'So noble! So valiant! But he must save himself, he must, Harry Potter must not -'", "begin": 16749.22, "end": 16763.34, "localBegin": 1760.72, "localEnd": 1774.84}, {"id": "c010_f000163", "text": "Dobby suddenly froze, his bat ears quivering. Harry heard it, too. There were footsteps coming down the passageway outside.", "begin": 16763.34, "end": 16771.02, "localBegin": 1774.84, "localEnd": 1782.52}, {"id": "c010_f000164", "text": "'Dobby must go!' breathed the elf, terrified; there was a loud crack, and Harry's fist was suddenly clenched on thin air. He slumped back into bed, his eyes on the dark doorway to the hospital wing as the footsteps drew nearer.", "begin": 16771.02, "end": 16785.02, "localBegin": 1782.52, "localEnd": 1796.52}, {"id": "c010_f000165", "text": "Next moment, Dumbledore was backing into the dormitory,", "begin": 16785.02, "end": 16789.14, "localBegin": 1796.52, "localEnd": 1800.64}, {"id": "c010_f000166", "text": "wearing a long woolly dressing gown and a nightcap. He was carrying one end of what looked like a statue. Professor McGonagall appeared a second later, carrying its feet. Together, they heaved it onto a bed.", "begin": 16789.14, "end": 16800.62, "localBegin": 1800.64, "localEnd": 1812.12}, {"id": "c010_f000167", "text": "'Get Madam Pomfrey,' whispered Dumbledore, and Professor McGonagall hurried past the end of Harry's bed out of sight. Harry lay quite still, pretending to be asleep. He heard urgent voices, and then Professor McGonagall swept back into view, closely followed by Madam Pomfrey, who was pulling a cardigan on over her nightdress. He heard a sharp intake of breath.", "begin": 16800.62, "end": 16823.66, "localBegin": 1812.12, "localEnd": 1835.16}, {"id": "c010_f000168", "text": "'What happened?' Madam Pomfrey whispered to Dumbledore, bending over the statue on the bed.", "begin": 16823.66, "end": 16830.14, "localBegin": 1835.16, "localEnd": 1841.64}, {"id": "c010_f000169", "text": "'Another attack,' said Dumbledore. 'Minerva found him on the stairs.'", "begin": 16830.14, "end": 16835.82, "localBegin": 1841.64, "localEnd": 1847.32}, {"id": "c010_f000170", "text": "'There was a bunch of grapes next to him,' said Professor McGonagall. 'We think he was trying to sneak up here to visit Potter.'", "begin": 16835.82, "end": 16842.66, "localBegin": 1847.32, "localEnd": 1854.16}, {"id": "c010_f000171", "text": "Harry's stomach gave a horrible lurch. Slowly and carefully, he raised himself a few inches so he could look at the statue on the bed. A ray of moonlight lay across its staring face.", "begin": 16842.66, "end": 16853.5, "localBegin": 1854.16, "localEnd": 1865.0}, {"id": "c010_f000172", "text": "It was Colin Creevey. His eyes were wide and his hands were stuck up in front of him, holding his camera.", "begin": 16853.5, "end": 16861.74, "localBegin": 1865.0, "localEnd": 1873.24}, {"id": "c010_f000173", "text": "'Petrified?' whispered Madam Pomfrey.", "begin": 16861.74, "end": 16865.46, "localBegin": 1873.24, "localEnd": 1876.96}, {"id": "c010_f000174", "text": "'Yes,' said Professor McGonagall. 'But I shudder to think ... If Albus hadn't been on the way downstairs for hot chocolate, who knows what might have ...'", "begin": 16865.46, "end": 16874.86, "localBegin": 1876.96, "localEnd": 1886.36}, {"id": "c010_f000175", "text": "The three of them stared down at Colin. Then Dumbledore leaned forward and prised the camera out of Colin's rigid grip.", "begin": 16874.86, "end": 16881.94, "localBegin": 1886.36, "localEnd": 1893.44}, {"id": "c010_f000176", "text": "'You don't think he managed to get a picture of his attacker?' said Professor McGonagall eagerly.", "begin": 16881.94, "end": 16887.9, "localBegin": 1893.44, "localEnd": 1899.4}, {"id": "c010_f000177", "text": "Dumbledore didn't answer. He prised open the back of the camera.", "begin": 16887.9, "end": 16891.34, "localBegin": 1899.4, "localEnd": 1902.84}, {"id": "c010_f000178", "text": "'Good gracious!' said Madam Pomfrey.", "begin": 16891.34, "end": 16895.58, "localBegin": 1902.84, "localEnd": 1907.08}, {"id": "c010_f000179", "text": "A jet of steam had hissed out of the camera. Harry, three beds away, caught the acrid smell of burnt plastic.", "begin": 16895.58, "end": 16902.38, "localBegin": 1907.08, "localEnd": 1913.88}, {"id": "c010_f000180", "text": "'Melted,' said Madam Pomfrey wonderingly, 'all melted ...'", "begin": 16902.38, "end": 16906.9, "localBegin": 1913.88, "localEnd": 1918.4}, {"id": "c010_f000181", "text": "'What does this mean, Albus?' Professor McGonagall asked urgently.", "begin": 16906.9, "end": 16911.62, "localBegin": 1918.4, "localEnd": 1923.12}, {"id": "c010_f000182", "text": "'It means,' said Dumbledore, 'that the Chamber of Secrets is indeed open again.'", "begin": 16911.62, "end": 16917.86, "localBegin": 1923.12, "localEnd": 1929.36}, {"id": "c010_f000183", "text": "Madam Pomfrey clapped a hand to her mouth. Professor McGonagall stared at Dumbledore.", "begin": 16917.86, "end": 16923.42, "localBegin": 1929.36, "localEnd": 1934.92}, {"id": "c010_f000184", "text": "'But Albus ... surely ... who?'", "begin": 16923.42, "end": 16926.1, "localBegin": 1934.92, "localEnd": 1937.6}, {"id": "c010_f000185", "text": "'The question is not who,' said Dumbledore, his eyes on Colin. 'The question is, how ...'", "begin": 16926.1, "end": 16935.5, "localBegin": 1937.6, "localEnd": 1947.0}, {"id": "c010_f000186", "text": "And from what Harry could see of Professor McGonagall's shadowy face, she didn't understand this any better than he did.", "begin": 16935.5, "end": 16945.18, "localBegin": 1947.0, "localEnd": 1956.68}]}, {"kind": "chapter", "number": 11, "title": "The Dueling Club", "audio": "audio/chapter_011.mp3", "start": 16945.188, "end": 19206.188, "duration": 2261.0, "paragraphs": [{"id": "c011_f000001", "text": "Chapter Eleven. The Dueling Club.", "begin": 16945.188, "end": 16946.948, "localBegin": 0.0, "localEnd": 1.76}, {"id": "c011_f000002", "text": "The Duelling Club Harry woke up on Sunday morning to find the dormitory blazing with winter sunlight and his arm re-boned but very stiff. He sat up quickly and looked over at Colin's bed, but it had been blocked from view by the high curtains Harry had changed behind yesterday. Seeing that he was awake, Madam Pomfrey came bustling over with a breakfast tray and then began bending and stretching his arm and fingers.", "begin": 16946.948, "end": 16973.108, "localBegin": 1.76, "localEnd": 27.92}, {"id": "c011_f000003", "text": "'All in order,' she said, as he clumsily fed himself porridge lefthanded. 'When you've finished eating, you may leave.'", "begin": 16973.108, "end": 16981.828, "localBegin": 27.92, "localEnd": 36.64}, {"id": "c011_f000004", "text": "Harry dressed as quickly as he could and hurried off to Gryffindor Tower, desperate to tell Ron and Hermione about Colin and Dobby, but they weren't there. Harry left to look for them, wondering where they could have got to and feeling slightly hurt that they weren't interested in whether he had his bones back or not.", "begin": 16981.828, "end": 17000.188, "localBegin": 36.64, "localEnd": 55.0}, {"id": "c011_f000005", "text": "As Harry passed the library, Percy Weasley strolled out of it, looking in far better spirits than last time they'd met.", "begin": 17000.188, "end": 17006.748, "localBegin": 55.0, "localEnd": 61.56}, {"id": "c011_f000006", "text": "'Oh, hello, Harry,' he said. 'Excellent flying yesterday, really excellent. Gryffindor have just taken the lead for the House Cup you earned fifty points!'", "begin": 17006.748, "end": 17017.068, "localBegin": 61.56, "localEnd": 71.88}, {"id": "c011_f000007", "text": "'You haven't seen Ron or Hermione, have you?' said Harry.", "begin": 17017.068, "end": 17020.628, "localBegin": 71.88, "localEnd": 75.44}, {"id": "c011_f000008", "text": "'No, I haven't,' said Percy, his smile fading. 'I hope Ron's not in another girls' toilet ...'", "begin": 17020.628, "end": 17027.948, "localBegin": 75.44, "localEnd": 82.76}, {"id": "c011_f000009", "text": "Harry forced a laugh, watched Percy out of sight and then headed straight for Moaning Myrtle's bathroom. He couldn't see why Ron and Hermione would be in there again, but after making sure that neither Filch nor any Prefects were around, he opened the door and heard their voices coming from a locked cubicle.", "begin": 17027.948, "end": 17045.548, "localBegin": 82.76, "localEnd": 100.36}, {"id": "c011_f000010", "text": "'It's me,' he said, closing the door behind him. There was a clunk, a splash and a gasp from within the cubicle and he saw", "begin": 17045.548, "end": 17053.388, "localBegin": 100.36, "localEnd": 108.2}, {"id": "c011_f000011", "text": "Hermione's eye peering through the keyhole.", "begin": 17053.388, "end": 17055.788, "localBegin": 108.2, "localEnd": 110.6}, {"id": "c011_f000012", "text": "'Harry!' she said. 'You gave us such a fright. Come in - how's your arm?'", "begin": 17055.788, "end": 17061.628, "localBegin": 110.6, "localEnd": 116.44}, {"id": "c011_f000013", "text": "'Fine,' said Harry, squeezing into the cubicle. An old cauldron was perched on the toilet, and a crackling from under the rim told Harry they had lit a fire beneath it. Conjuring up portable, waterproof fires was a speciality of Hermione's.", "begin": 17061.628, "end": 17077.548, "localBegin": 116.44, "localEnd": 132.36}, {"id": "c011_f000014", "text": "'We'd've come to meet you, but we decided to get started on the Polyjuice Potion,' Ron explained, as Harry, with difficulty, locked the cubicle again. 'We've decided this is the safest place to hide it.'", "begin": 17077.548, "end": 17089.028, "localBegin": 132.36, "localEnd": 143.84}, {"id": "c011_f000015", "text": "Harry started to tell them about Colin, but Hermione interrupted. 'We already know, we heard Professor McGonagall telling Professor Flitwick this morning. That's why we decided we'd better get going -'", "begin": 17089.028, "end": 17099.428, "localBegin": 143.84, "localEnd": 154.24}, {"id": "c011_f000016", "text": "'The sooner we get a confession out of Malfoy, the better,' snarled Ron. 'D'you know what I think? He was in such a foul temper after the Quidditch match, he took it out on Colin.'", "begin": 17099.428, "end": 17111.028, "localBegin": 154.24, "localEnd": 165.84}, {"id": "c011_f000017", "text": "'There's something else,' said Harry, watching Hermione tearing bundles of knotgrass and throwing them into the potion. 'Dobby came to visit me in the middle of the night.'", "begin": 17111.028, "end": 17120.588, "localBegin": 165.84, "localEnd": 175.4}, {"id": "c011_f000018", "text": "Ron and Hermione looked up, amazed. Harry told them everything Dobby had told him - or hadn't told him. Ron and Hermione listened with their mouths open.", "begin": 17120.588, "end": 17130.668, "localBegin": 175.4, "localEnd": 185.48}, {"id": "c011_f000019", "text": "'The Chamber of Secrets has been opened before?' said Hermione.", "begin": 17130.668, "end": 17135.188, "localBegin": 185.48, "localEnd": 190.0}, {"id": "c011_f000020", "text": "'This settles it,' said Ron in a triumphant voice. 'Lucius Malfoy must've opened the Chamber when he was at school here and now he's told dear old Draco how to do it. It's obvious. Wish Dobby'd told you what kind of monster's in there, though. I want to know how come nobody's noticed it sneaking round the school.'", "begin": 17135.188, "end": 17153.908, "localBegin": 190.0, "localEnd": 208.72}, {"id": "c011_f000021", "text": "'Maybe it can make itself invisible,' said Hermione, prodding leeches to the bottom of the cauldron. 'Or maybe it can disguise itself - pretend to be a suit of armour or something. I've read about Chameleon Ghouls ...'", "begin": 17153.908, "end": 17167.148, "localBegin": 208.72, "localEnd": 221.96}, {"id": "c011_f000022", "text": "'You read too much, Hermione,' said Ron, pouring dead lacewings on top of the leeches. He crumpled up the empty lacewing bag and looked round at Harry.", "begin": 17167.148, "end": 17176.628, "localBegin": 221.96, "localEnd": 231.44}, {"id": "c011_f000023", "text": "'So Dobby stopped us getting on the train and broke your arm ...' He shook his head. 'You know what, Harry? If he doesn't stop trying to save your life he's going to kill you.' *", "begin": 17176.628, "end": 17185.788, "localBegin": 231.44, "localEnd": 240.6}, {"id": "c011_f000024", "text": "THE DUELLING CLUB 139", "begin": 17185.788, "end": 17190.348, "localBegin": 240.6, "localEnd": 245.16}, {"id": "c011_f000025", "text": "The news that Colin Creevey had been attacked and was now lying as though dead in the hospital wing had spread through the entire school by Monday morning. The air was suddenly thick with rumour and suspicion. The first-years were now moving around the castle in tight-knit groups, as though scared they would be attacked if they ventured forth alone.", "begin": 17190.348, "end": 17208.788, "localBegin": 245.16, "localEnd": 263.6}, {"id": "c011_f000026", "text": "Ginny Weasley, who sat next to Colin Creevey in Charms, was distraught, but Harry felt that Fred and George were going the wrong way about cheering her up. They were taking it in turns to cover themselves with fur or boils and jump out at her from behind statues. They only stopped when Percy, apoplectic with rage, told them he was going to write to Mrs Weasley and tell her Ginny was having nightmares.", "begin": 17208.788, "end": 17232.948, "localBegin": 263.6, "localEnd": 287.76}, {"id": "c011_f000027", "text": "Meanwhile, hidden from the teachers, a roaring trade in talismans, amulets and other protective devices was sweeping the school. Neville Longbottom bought a large, evil-smelling green onion, a pointed purple crystal and a rotting newt-tail before the other Gryffindor boys pointed out that he was in no danger: he was a pure-blood, and therefore unlikely to be attacked.", "begin": 17232.948, "end": 17254.428, "localBegin": 287.76, "localEnd": 309.24}, {"id": "c011_f000028", "text": "'They went for Filch first,' Neville said, his round face fearful, 'and everyone knows I'm almost a Squib.' * In the second week of December Professor McGonagall came around as usual, collecting names of those who would be staying at school for Christmas. Harry, Ron and Hermione signed her list; they had heard that Malfoy was staying, which struck them as very suspicious. The holidays would be the perfect time to use the Polyjuice Potion and try to worm a confession out of him.", "begin": 17254.428, "end": 17286.188, "localBegin": 309.24, "localEnd": 341.0}, {"id": "c011_f000029", "text": "Unfortunately, the potion was only half-finished. They still needed the Bicorn horn and the Boomslang skin, and the only place they were going to get them was from Snape's private stores. Harry privately felt he'd rather face Slytherin's legendary monster than have Snape catch him robbing his office.", "begin": 17286.188, "end": 17302.268, "localBegin": 341.0, "localEnd": 357.08}, {"id": "c011_f000030", "text": "'What we need,' said Hermione briskly, as Thursday afternoon's double Potions lesson loomed nearer, 'is a diversion. Then one of us can sneak into Snape's office and take what we need.'", "begin": 17302.268, "end": 17313.428, "localBegin": 357.08, "localEnd": 368.24}, {"id": "c011_f000031", "text": "Harry and Ron looked at her nervously.", "begin": 17313.428, "end": 17315.508, "localBegin": 368.24, "localEnd": 370.32}, {"id": "c011_f000032", "text": "'I think I'd better do the actual stealing,' Hermione continued, in a matter-of-fact tone. 'You two will be expelled if you get in any more trouble, and I've got a clean record. So all you need to do is", "begin": 17315.508, "end": 17326.228, "localBegin": 370.32, "localEnd": 381.04}, {"id": "c011_f000033", "text": "cause enough mayhem to keep Snape busy for five minutes or so.'", "begin": 17326.228, "end": 17330.548, "localBegin": 381.04, "localEnd": 385.36}, {"id": "c011_f000034", "text": "Harry smiled feebly. Deliberately causing mayhem in Snape's Potions class was about as safe as poking a sleeping dragon in the eye.", "begin": 17330.548, "end": 17339.668, "localBegin": 385.36, "localEnd": 394.48}, {"id": "c011_f000035", "text": "Potions lessons took place in one of the large dungeons. Thursday afternoon's lesson proceeded in the usual way. Twenty cauldrons stood steaming between the wooden desks, on which stood brass scales and jars of ingredients. Snape prowled through the fumes, making waspish remarks about the Gryffindors' work while the Slytherins sniggered appreciatively. Draco Malfoy, who was Snape's favourite student, kept flicking puffer-fish eyes at Ron and Harry, who knew that if they retaliated they would get detention faster than you could say 'unfair'.", "begin": 17339.668, "end": 17372.868, "localBegin": 394.48, "localEnd": 427.68}, {"id": "c011_f000036", "text": "Harry's Swelling Solution was far too runny, but he had his mind on more important things. He was waiting for Hermione's signal, and he hardly listened as Snape paused to sneer at his watery potion. When Snape turned and walked off to bully Neville, Hermione caught Harry's eye and nodded.", "begin": 17372.868, "end": 17390.668, "localBegin": 427.68, "localEnd": 445.48}, {"id": "c011_f000037", "text": "Harry ducked swiftly down behind his cauldron, pulled one of Fred's Filibuster fireworks out of his pocket and gave it a quick prod with his wand. The firework began to fizz and sputter. Knowing he had only seconds, Harry straightened up, took aim, and lobbed it into the air; it landed right on target in Goyle's cauldron.", "begin": 17390.668, "end": 17410.308, "localBegin": 445.48, "localEnd": 465.12}, {"id": "c011_f000038", "text": "Goyle's potion exploded, showering the whole class. People shrieked as splashes of the Swelling Solution hit them. Malfoy got a faceful and his nose began to swell like a balloon; Goyle blundered around, his hands over his eyes, which had expanded to the size of dinner plates, while Snape was trying to restore calm and find out what had happened. Through the confusion, Harry saw Hermione slip quietly out of the door.", "begin": 17410.308, "end": 17435.228, "localBegin": 465.12, "localEnd": 490.04}, {"id": "c011_f000039", "text": "'Silence! SILENCE!' Snape roared. 'Anyone who has been splashed, come here for a Deflating Draught. When I find out who did this ...'", "begin": 17435.228, "end": 17448.588, "localBegin": 490.04, "localEnd": 503.4}, {"id": "c011_f000040", "text": "Harry tried not to laugh as he watched Malfoy hurry forward, his head drooping with the weight of a nose like a small melon. As half the class lumbered up to Snape's desk, some weighed down with arms like clubs, others unable to talk through gigantic puffed-up lips, Harry saw Hermione slide back into the dungeon, the front of her robes bulging.", "begin": 17448.588, "end": 17468.268, "localBegin": 503.4, "localEnd": 523.08}, {"id": "c011_f000041", "text": "THE DUELLING CLUB 141", "begin": 17468.268, "end": 17470.188, "localBegin": 523.08, "localEnd": 525.0}, {"id": "c011_f000042", "text": "When everyone had taken a swig of antidote and the various swellings had subsided, Snape swept over to Goyle's cauldron and scooped out the twisted black remains of the firework. There was a sudden hush.", "begin": 17470.188, "end": 17484.428, "localBegin": 525.0, "localEnd": 539.24}, {"id": "c011_f000043", "text": "'If I ever find out who threw this,' Snape whispered, 'I shall make sure that person is expelled.'", "begin": 17484.428, "end": 17495.348, "localBegin": 539.24, "localEnd": 550.16}, {"id": "c011_f000044", "text": "Harry arranged his face into what he hoped was a puzzled expression. Snape was looking right at him, and the bell which rang ten minutes later could not have been more welcome.", "begin": 17495.348, "end": 17506.188, "localBegin": 550.16, "localEnd": 561.0}, {"id": "c011_f000045", "text": "'He knew it was me,' Harry told Ron and Hermione, as they hurried back to Moaning Myrtle's bathroom. 'I could tell.'", "begin": 17506.188, "end": 17513.988, "localBegin": 561.0, "localEnd": 568.8}, {"id": "c011_f000046", "text": "Hermione threw the new ingredients into the cauldron and began to stir feverishly.", "be
