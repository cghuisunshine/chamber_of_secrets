<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Harry Potter and the Chamber of Secrets</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f4;
      --surface: #ffffff;
      --line: #d7d3cc;
      --text: #1c1917;
      --muted: #6b6258;
      --active: #fff3c4;
      --active-line: #b45309;
      --button: #1c1917;
      --button-text: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      font-size: 16px;
      line-height: 1.55;
    }
    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
    }
    aside {
      border-right: 1px solid var(--line);
      background: var(--surface);
      height: 100vh;
      position: sticky;
      top: 0;
      overflow: auto;
      padding: 20px 16px;
    }
    .book-title {
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 16px;
      line-height: 1.3;
    }
    .chapter-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .chapter-link {
      width: 100%;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 8px;
      padding: 8px;
      text-align: left;
      font: inherit;
      line-height: 1.3;
    }
    .chapter-link:hover { background: #f0eee9; }
    .chapter-link.active {
      background: #e7e1d8;
      font-weight: 650;
    }
    .chapter-number { color: var(--muted); font-variant-numeric: tabular-nums; }
    main {
      min-width: 0;
      padding: 28px 32px 112px;
    }
    .topbar {
      max-width: 840px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    h1 {
      font-size: 22px;
      line-height: 1.25;
      margin: 0;
      font-weight: 750;
    }
    .time {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .reader {
      max-width: 840px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 28px 34px;
    }
    .chapter-heading {
      font-size: 20px;
      margin: 0 0 22px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }
    .paragraph {
      margin: 0 0 14px;
      padding: 3px 6px;
      border-left: 3px solid transparent;
      border-radius: 4px;
      cursor: pointer;
    }
    .paragraph:hover { background: #f8f6f1; }
    .paragraph.active {
      background: var(--active);
      border-left-color: var(--active-line);
    }
    .outro {
      color: var(--muted);
      margin: 0;
    }
    .player {
      position: fixed;
      left: 280px;
      right: 0;
      bottom: 0;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
      display: grid;
      grid-template-columns: auto auto auto minmax(120px, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 12px 20px;
    }
    button.control {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      min-height: 36px;
      padding: 0 12px;
      font: inherit;
      font-weight: 650;
    }
    button.primary {
      background: var(--button);
      color: var(--button-text);
      border-color: var(--button);
      min-width: 68px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #b45309;
    }
    @media (max-width: 760px) {
      .app { display: block; }
      aside {
        position: static;
        height: auto;
        max-height: 240px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      main { padding: 20px 16px 120px; }
      .reader { padding: 22px 18px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .player {
        left: 0;
        grid-template-columns: auto auto auto;
      }
      .player input[type="range"] {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>

  <div class="app">
    <aside>
      <p class="book-title">Harry Potter and the Chamber of Secrets</p>
      <nav class="chapter-list" id="chapterList"></nav>
    </aside>

      <div class="topbar">
        <h1 id="chapterTitle"></h1>
        <div class="time" id="timeLabel">0:00 / 0:00</div>

    </main>
  </div>
  <div class="player">
    <button class="control" id="prevButton" type="button">Prev</button>
    <button class="control primary" id="playButton" type="button">Play</button>
    <button class="control" id="nextButton" type="button">Next</button>
    <input id="seekBar" type="range" min="0" max="1000" value="0" aria-label="Seek">
    <span class="time" id="chapterTime">0:00</span>

  <audio id="audio" preload="metadata"></audio>
  <script>
    const manifest = {"title": "Harry Potter and the Chamber of Secrets", "duration": 32466.413, "chapters": [{"kind": "chapter", "number": 1, "title": "The Worst Birthday", "audio": "audio/chapter_001.mp3", "start": 0.0, "end": 951.0, "duration": 951.0, "paragraphs": [{"id": "c001_f000001", "text": "Chapter One. The Worst Birthday.", "begin": 0.0, "end": 7.68, "localBegin": 0.0, "localEnd": 7.68}, {"id": "c001_f000002", "text": "Not for the first time, an argument had broken out over breakfast at number four, Privet Drive. Mr Vernon Dursley had been woken in the early hours of the morning by a loud, hooting noise from his nephew Harry's room.", "begin": 7.68, "end": 34.12, "localBegin": 7.68, "localEnd": 34.12}, {"id": "c001_f000003", "text": "'Third time this week!' he roared across the table. 'If you can't control that owl, it'll have to go!'", "begin": 34.12, "end": 41.92, "localBegin": 34.12, "localEnd": 41.92}, {"id": "c001_f000004", "text": "Harry tried, yet again, to explain.", "begin": 41.92, "end": 44.68, "localBegin": 41.92, "localEnd": 44.68}, {"id": "c001_f000005", "text": "'She's bored,' he said. 'She's used to flying around outside. If I could just let her out at night ...'", "begin": 44.68, "end": 50.24, "localBegin": 44.68, "localEnd": 50.24}, {"id": "c001_f000006", "text": "'Do I look stupid?' snarled Uncle Vernon, a bit of fried egg dangling from his bushy moustache. 'I know what'll happen if that owl's let out.'", "begin": 50.24, "end": 59.72, "localBegin": 50.24, "localEnd": 59.72}, {"id": "c001_f000007", "text": "He exchanged dark looks with his wife, Petunia.", "begin": 59.72, "end": 63.04, "localBegin": 59.72, "localEnd": 63.04}, {"id": "c001_f000008", "text": "Harry tried to argue back but his words were drowned by a long, loud belch from the Dursleys' son, Dudley.", "begin": 63.04, "end": 69.92, "localBegin": 63.04, "localEnd": 69.92}, {"id": "c001_f000009", "text": "'I want more bacon.'", "begin": 69.92, "end": 72.16, "localBegin": 69.92, "localEnd": 72.16}, {"id": "c001_f000010", "text": "'There's more in the frying pan, sweetums,' said Aunt Petunia, turning misty eyes on her massive son. 'We must feed you up while we've got the chance ... I don't like the sound of that school food ...'", "begin": 72.16, "end": 82.92, "localBegin": 72.16, "localEnd": 82.92}, {"id": "c001_f000011", "text": "'Nonsense, Petunia, I never went hungry when I was at Smeltings,' said Uncle Vernon heartily. 'Dudley gets enough, don't you, son?'", "begin": 82.92, "end": 92.16, "localBegin": 82.92, "localEnd": 92.16}, {"id": "c001_f000012", "text": "Dudley, who was so large his bottom drooped over either side of the kitchen chair, grinned and turned to Harry.", "begin": 92.16, "end": 99.2, "localBegin": 92.16, "localEnd": 99.2}, {"id": "c001_f000013", "text": "'Pass the frying pan.'", "begin": 99.2, "end": 101.68, "localBegin": 99.2, "localEnd": 101.68}, {"id": "c001_f000014", "text": "'You've forgotten the magic word,' said Harry irritably.", "begin": 101.68, "end": 106.48, "localBegin": 101.68, "localEnd": 106.48}, {"id": "c001_f000015", "text": "The effect of this simple sentence on the rest of the family was incredible: Dudley gasped and fell off his chair with a crash that shook the whole kitchen; Mrs Dursley gave a small scream and", "begin": 106.48, "end": 115.4, "localBegin": 106.48, "localEnd": 115.4}, {"id": "c001_f000016", "text": "clapped her hands to her mouth; Mr Dursley jumped to his feet, veins throbbing in his temples.", "begin": 115.4, "end": 120.76, "localBegin": 115.4, "localEnd": 120.76}, {"id": "c001_f000017", "text": "'I meant \"please\"!' said Harry quickly. 'I didn't mean -'", "begin": 120.76, "end": 124.04, "localBegin": 120.76, "localEnd": 124.04}, {"id": "c001_f000018", "text": "'WHAT HAVE I TOLD YOU,' thundered his uncle, spraying spit over the table, 'ABOUT SAYING THE M WORD IN OUR HOUSE?'", "begin": 124.04, "end": 131.48, "localBegin": 124.04, "localEnd": 131.48}, {"id": "c001_f000019", "text": "'But I -'", "begin": 131.48, "end": 132.08, "localBegin": 131.48, "localEnd": 132.08}, {"id": "c001_f000020", "text": "'HOW DARE YOU THREATEN DUDLEY!' roared Uncle Vernon, pounding the table with his fist.", "begin": 132.08, "end": 137.24, "localBegin": 132.08, "localEnd": 137.24}, {"id": "c001_f000021", "text": "'I just -'", "begin": 137.24, "end": 137.8, "localBegin": 137.24, "localEnd": 137.8}, {"id": "c001_f000022", "text": "'I WARNED YOU! I WILL NOT TOLERATE MENTION OF YOUR ABNORMALITY UNDER THIS ROOF!'", "begin": 137.8, "end": 143.76, "localBegin": 137.8, "localEnd": 143.76}, {"id": "c001_f000023", "text": "Harry stared from his purple-faced uncle to his pale aunt, who was trying to heave Dudley to his feet.", "begin": 143.76, "end": 149.8, "localBegin": 143.76, "localEnd": 149.8}, {"id": "c001_f000024", "text": "'All right,' said Harry, 'all right ...'", "begin": 149.8, "end": 153.64, "localBegin": 149.8, "localEnd": 153.64}, {"id": "c001_f000025", "text": "Uncle Vernon sat back down, breathing like a winded rhinoceros and watching Harry closely out of the corners of his small, sharp eyes.", "begin": 153.64, "end": 162.28, "localBegin": 153.64, "localEnd": 162.28}, {"id": "c001_f000026", "text": "Ever since Harry had come home for the summer holidays, Uncle Vernon had been treating him like a bomb that might go off at any moment, because Harry wasn't a normal boy. As a matter of fact, he was as not normal as it is possible to be.", "begin": 162.28, "end": 177.08, "localBegin": 162.28, "localEnd": 177.08}, {"id": "c001_f000027", "text": "Harry Potter was a wizard - a wizard fresh from his first year at Hogwarts School of Witchcraft and Wizardry. And if the Dursleys were unhappy to have him back for the holidays, it was nothing to how Harry felt.", "begin": 177.08, "end": 190.4, "localBegin": 177.08, "localEnd": 190.4}, {"id": "c001_f000028", "text": "He missed Hogwarts so much it was like having a constant stomach ache. He missed the castle, with its secret passageways and ghosts, his lessons (though perhaps not Snape, the Potions master), the post arriving by owl, eating banquets in the Great Hall, sleeping in his four-poster bed in the tower dormitory, visiting the gamekeeper, Hagrid, in his cabin in the grounds next to the Forbidden Forest and, especially, Quidditch, the most popular sport in the wizarding world (six tall goalposts, four flying balls and fourteen players on broomsticks).", "begin": 190.4, "end": 226.16, "localBegin": 190.4, "localEnd": 226.16}, {"id": "c001_f000029", "text": "All Harry's spellbooks, his wand, robes, cauldron and top-of-the-range Nimbus Two Thousand broomstick had been locked in a cupboard under the stairs by Uncle Vernon the instant Harry had come home. What did the Dursleys care if Harry lost his place in the house Quidditch team because he hadn't practised all sum-", "begin": 226.16, "end": 242.48, "localBegin": 226.16, "localEnd": 242.48}, {"id": "c001_f000030", "text": "mer? What was it to the Dursleys if Harry went back to school without any of his homework done? The Dursleys were what wizards called Muggles (not a drop of magical blood in their veins) and as far as they were concerned, having a wizard in the family was a matter of deepest shame. Uncle Vernon had even padlocked Harry's owl, Hedwig, inside her cage, to stop her carrying messages to anyone in the wizarding world.", "begin": 242.48, "end": 268.04, "localBegin": 242.48, "localEnd": 268.04}, {"id": "c001_f000031", "text": "Harry looked nothing like the rest of the family. Uncle Vernon was large and neckless, with an enormous black moustache; Aunt Petunia was horse-faced and bony; Dudley was blond, pink and porky. Harry, on the other hand, was small and skinny, with brilliant green eyes and jet-black hair that was always untidy. He wore round glasses, and on his forehead was a thin, lightning-shaped scar.", "begin": 268.04, "end": 295.12, "localBegin": 268.04, "localEnd": 295.12}, {"id": "c001_f000032", "text": "It was this scar that made Harry so particularly unusual, even for a wizard. This scar was the only hint of Harry's very mysterious past, of the reason he had been left on the Dursleys' doorstep eleven years before.", "begin": 295.12, "end": 309.8, "localBegin": 295.12, "localEnd": 309.8}, {"id": "c001_f000033", "text": "At the age of one, Harry had somehow survived a curse from the greatest dark sorcerer of all time, Lord Voldemort, whose name most witches and wizards still feared to speak. Harry's parents had died in Voldemort's attack, but Harry had escaped with his lightning scar, and somehow - nobody understood why - Voldemort's powers had been destroyed the instant he had failed to kill Harry.", "begin": 309.8, "end": 336.2, "localBegin": 309.8, "localEnd": 336.2}, {"id": "c001_f000034", "text": "So Harry had been brought up by his dead mother's sister and her husband. He had spent ten years with the Dursleys, never understanding why he kept making odd things happen without meaning to, believing the Dursleys' story that he had got his scar in the car crash which had killed his parents.", "begin": 336.2, "end": 354.08, "localBegin": 336.2, "localEnd": 354.08}, {"id": "c001_f000035", "text": "And then, exactly a year ago, Hogwarts had written to Harry, and the whole story had come out. Harry had taken up his place at wizard school, where he and his scar were famous ... but now the school year was over, and he was back with the Dursleys for the summer, back to being treated like a dog that had rolled in something smelly.", "begin": 354.08, "end": 374.24, "localBegin": 354.08, "localEnd": 374.24}, {"id": "c001_f000036", "text": "The Dursleys hadn't even remembered that today happened to be Harry's twelfth birthday. Of course, his hopes hadn't been high; they'd never given him a proper present, let alone a cake - but to ignore it completely ...", "begin": 374.24, "end": 387.32, "localBegin": 374.24, "localEnd": 387.32}, {"id": "c001_f000037", "text": "At that moment, Uncle Vernon cleared his throat importantly and said, 'Now, as we all know, today is a very important day.'", "begin": 387.32, "end": 396.64, "localBegin": 387.32, "localEnd": 396.64}, {"id": "c001_f000038", "text": "Harry looked up, hardly daring to believe it.", "begin": 396.64, "end": 399.44, "localBegin": 396.64, "localEnd": 399.44}, {"id": "c001_f000039", "text": "'This could well be the day I make the biggest deal of my career,' said Uncle Vernon.", "begin": 399.44, "end": 405.68, "localBegin": 399.44, "localEnd": 405.68}, {"id": "c001_f000040", "text": "Harry went back to his toast. Of course, he thought bitterly, Uncle Vernon was talking about the stupid dinner party. He'd been talking of nothing else for a fortnight. Some rich builder and his wife were coming to dinner and Uncle Vernon was hoping to get a huge order from him (Uncle Vernon's company made drills).", "begin": 405.68, "end": 425.6, "localBegin": 405.68, "localEnd": 425.6}, {"id": "c001_f000041", "text": "'I think we should run through the schedule one more time,' said Uncle Vernon. 'We should all be in position at eight o'clock. Petunia, you will be -?'", "begin": 425.6, "end": 434.48, "localBegin": 425.6, "localEnd": 434.48}, {"id": "c001_f000042", "text": "'In the lounge,' said Aunt Petunia promptly, 'waiting to welcome them graciously to our home.'", "begin": 434.48, "end": 440.76, "localBegin": 434.48, "localEnd": 440.76}, {"id": "c001_f000043", "text": "'Good, good. And Dudley?'", "begin": 440.76, "end": 443.2, "localBegin": 440.76, "localEnd": 443.2}, {"id": "c001_f000044", "text": "'I'll be waiting to open the door.' Dudley put on a foul, simpering smile. 'May I take your coats, Mr and Mrs Mason?'", "begin": 443.2, "end": 452.52, "localBegin": 443.2, "localEnd": 452.52}, {"id": "c001_f000045", "text": "'They'll love him!' cried Aunt Petunia rapturously.", "begin": 452.52, "end": 457.52, "localBegin": 452.52, "localEnd": 457.52}, {"id": "c001_f000046", "text": "'Excellent, Dudley,' said Uncle Vernon. Then he rounded on Harry. 'And you?'", "begin": 457.52, "end": 463.16, "localBegin": 457.52, "localEnd": 463.16}, {"id": "c001_f000047", "text": "'I'll be in my bedroom, making no noise and pretending I'm not there,' said Harry tonelessly.", "begin": 463.16, "end": 468.76, "localBegin": 463.16, "localEnd": 468.76}, {"id": "c001_f000048", "text": "'Exactly,' said Uncle Vernon nastily. 'I will lead them into the lounge, introduce you, Petunia, and pour them drinks. At eight fifteen -'", "begin": 468.76, "end": 478.16, "localBegin": 468.76, "localEnd": 478.16}, {"id": "c001_f000049", "text": "'I'll announce dinner,' said Aunt Petunia.", "begin": 478.16, "end": 481.52, "localBegin": 478.16, "localEnd": 481.52}, {"id": "c001_f000050", "text": "'And Dudley, you'll say -'", "begin": 481.52, "end": 483.2, "localBegin": 481.52, "localEnd": 483.2}, {"id": "c001_f000051", "text": "'May I take you through to the dining room, Mrs Mason?' said Dudley, offering his fat arm to an invisible woman.", "begin": 483.2, "end": 491.56, "localBegin": 483.2, "localEnd": 491.56}, {"id": "c001_f000052", "text": "'My perfect little gentleman!' sniffed Aunt Petunia.", "begin": 491.56, "end": 495.36, "localBegin": 491.56, "localEnd": 495.36}, {"id": "c001_f000053", "text": "'And you?' said Uncle Vernon viciously to Harry.", "begin": 495.36, "end": 498.6, "localBegin": 495.36, "localEnd": 498.6}, {"id": "c001_f000054", "text": "'I'll be in my room, making no noise and pretending I'm not there,' said Harry dully.", "begin": 498.6, "end": 504.0, "localBegin": 498.6, "localEnd": 504.0}, {"id": "c001_f000055", "text": "'Precisely. Now, we should aim to get in a few good compliments at dinner. Petunia, any ideas?'", "begin": 504.0, "end": 512.12, "localBegin": 504.0, "localEnd": 512.12}, {"id": "c001_f000056", "text": "'Vernon tells me you're a wonderful golfer, Mr Mason ... Do tell me where you bought your dress, Mrs Mason ...'", "begin": 512.12, "end": 518.68, "localBegin": 512.12, "localEnd": 518.68}, {"id": "c001_f000057", "text": "'Perfect ... Dudley?'", "begin": 518.68, "end": 520.8, "localBegin": 518.68, "localEnd": 520.8}, {"id": "c001_f000058", "text": "'How about: \"We had to write an essay about our hero at", "begin": 520.8, "end": 526.28, "localBegin": 520.8, "localEnd": 526.28}, {"id": "c001_f000059", "text": "school, Mr Mason, and I wrote about you.\" '", "begin": 526.28, "end": 529.76, "localBegin": 526.28, "localEnd": 529.76}, {"id": "c001_f000060", "text": "This was too much for both Aunt Petunia and Harry. Aunt Petunia burst into tears and hugged her son, while Harry ducked under the table so they wouldn't see him laughing.", "begin": 529.76, "end": 538.88, "localBegin": 529.76, "localEnd": 538.88}, {"id": "c001_f000061", "text": "'And you, boy?'", "begin": 538.88, "end": 540.96, "localBegin": 538.88, "localEnd": 540.96}, {"id": "c001_f000062", "text": "Harry fought to keep his face straight as he emerged.", "begin": 540.96, "end": 544.32, "localBegin": 540.96, "localEnd": 544.32}, {"id": "c001_f000063", "text": "'I'll be in my room, making no noise and pretending I'm not there,' he said.", "begin": 544.32, "end": 549.08, "localBegin": 544.32, "localEnd": 549.08}, {"id": "c001_f000064", "text": "'Too right you will,' said Uncle Vernon forcefully. 'The Masons don't know anything about you and it's going to stay that way. When dinner's over, you take Mrs Mason back to the lounge for coffee, Petunia, and I'll bring the subject round to drills. With any luck, I'll have the deal signed and sealed before the News at Ten. We'll be shopping for a holiday home in Majorca this time tomorrow.'", "begin": 549.08, "end": 574.16, "localBegin": 549.08, "localEnd": 574.16}, {"id": "c001_f000065", "text": "Harry couldn't feel too excited about this. He didn't think the Dursleys would like him any better in Majorca than they did in Privet Drive.", "begin": 574.16, "end": 583.0, "localBegin": 574.16, "localEnd": 583.0}, {"id": "c001_f000066", "text": "'Right - I'm off into town to pick up the dinner jackets for Dudley and me. And you,' he snarled at Harry, 'you stay out of your aunt's way while she's cleaning.'", "begin": 583.0, "end": 592.44, "localBegin": 583.0, "localEnd": 592.44}, {"id": "c001_f000067", "text": "Harry left through the back door. It was a brilliant, sunny day. He crossed the lawn, slumped down on the garden bench and sang under his breath, 'Happy birthday to me ... happy birthday to me ...'", "begin": 592.44, "end": 607.16, "localBegin": 592.44, "localEnd": 607.16}, {"id": "c001_f000068", "text": "No cards, no presents, and he would be spending the evening pretending not to exist. He gazed miserably into the hedge. He had never felt so lonely. More than anything else at Hogwarts, more even than playing Quidditch, Harry missed his best friends, Ron Weasley and Hermione Granger. They, however, didn't seem to be missing him at all. Neither of them had written to him all summer, even though Ron had said he was going to ask Harry to come and stay.", "begin": 607.16, "end": 635.4, "localBegin": 607.16, "localEnd": 635.4}, {"id": "c001_f000069", "text": "Countless times, Harry had been on the point of unlocking Hedwig's cage by magic and sending her to Ron and Hermione with a letter, but it wasn't worth the risk. Underage wizards weren't allowed to use magic outside school. Harry hadn't told the Dursleys this; he knew it was only their terror that he might turn them all into dung beetles that stopped them locking him in the cupboard under the stairs with his wand and broomstick. For the", "begin": 635.4, "end": 661.12, "localBegin": 635.4, "localEnd": 661.12}, {"id": "c001_f000070", "text": "first couple of weeks back, Harry had enjoyed muttering nonsense words under his breath and watching Dudley tearing out of the room as fast as his fat legs would carry him. But the long silence from Ron and Hermione had made Harry feel so cut off from the magical world that even taunting Dudley had lost its appeal - and now Ron and Hermione had forgotten his birthday.", "begin": 661.12, "end": 682.68, "localBegin": 661.12, "localEnd": 682.68}, {"id": "c001_f000071", "text": "What wouldn't he give now for a message from Hogwarts? From any witch or wizard? He'd almost be glad of a sight of his arch-enemy, Draco Malfoy, just to be sure it hadn't all been a dream ...", "begin": 682.68, "end": 694.84, "localBegin": 682.68, "localEnd": 694.84}, {"id": "c001_f000072", "text": "Not that his whole year at Hogwarts had been fun. At the very end of last term, Harry had come face to face with none other than Lord Voldemort himself. Voldemort might be a ruin of his former self, but he was still terrifying, still cunning, still determined to regain power. Harry had slipped through Voldemort's clutches for a second time, but it had been a narrow escape, and even now, weeks later, Harry kept waking in the night, drenched in cold sweat, wondering where Voldemort was now, remembering his livid face, his wide, mad eyes ...", "begin": 694.84, "end": 728.24, "localBegin": 694.84, "localEnd": 728.24}, {"id": "c001_f000073", "text": "Harry suddenly sat bolt upright on the garden bench. He had been staring absent-mindedly into the hedge - and the hedge was staring back. Two enormous green eyes had appeared among the leaves.", "begin": 728.24, "end": 739.72, "localBegin": 728.24, "localEnd": 739.72}, {"id": "c001_f000074", "text": "Harry jumped to his feet just as a jeering voice floated across the lawn.", "begin": 739.72, "end": 744.48, "localBegin": 739.72, "localEnd": 744.48}, {"id": "c001_f000075", "text": "'I know what day it is,' sang Dudley, waddling towards him.", "begin": 744.48, "end": 749.68, "localBegin": 744.48, "localEnd": 749.68}, {"id": "c001_f000076", "text": "The huge eyes blinked and vanished.", "begin": 749.68, "end": 753.24, "localBegin": 749.68, "localEnd": 753.24}, {"id": "c001_f000077", "text": "'What?' said Harry, not taking his eyes off the spot where they had been.", "begin": 753.24, "end": 756.6, "localBegin": 753.24, "localEnd": 756.6}, {"id": "c001_f000078", "text": "'I know what day it is,' Dudley repeated, coming right up to him.", "begin": 756.6, "end": 762.24, "localBegin": 756.6, "localEnd": 762.24}, {"id": "c001_f000079", "text": "'Well done,' said Harry. 'So you've finally learned the days of the week.'", "begin": 762.24, "end": 766.12, "localBegin": 762.24, "localEnd": 766.12}, {"id": "c001_f000080", "text": "'Today's your birthday,' sneered Dudley. 'How come you haven't got any cards? Haven't you even got friends at that freak place?'", "begin": 766.12, "end": 776.16, "localBegin": 766.12, "localEnd": 776.16}, {"id": "c001_f000081", "text": "'Better not let your mum hear you talking about my school,' said Harry coolly.", "begin": 776.16, "end": 781.28, "localBegin": 776.16, "localEnd": 781.28}, {"id": "c001_f000082", "text": "Dudley hitched up his trousers, which were slipping down his fat bottom.", "begin": 781.28, "end": 785.16, "localBegin": 781.28, "localEnd": 785.16}, {"id": "c001_f000083", "text": "'Why're you staring at the hedge?' he said suspiciously.", "begin": 785.16, "end": 789.12, "localBegin": 785.16, "localEnd": 789.12}, {"id": "c001_f000084", "text": "'I'm trying to decide what would be the best spell to set it on fire,' said Harry.", "begin": 789.12, "end": 793.72, "localBegin": 789.12, "localEnd": 793.72}, {"id": "c001_f000085", "text": "Dudley stumbled backwards at once, a look of panic on his fat face.", "begin": 793.72, "end": 798.24, "localBegin": 793.72, "localEnd": 798.24}, {"id": "c001_f000086", "text": "'You c-can't - Dad told you you're not to do m-magic - he said he'll chuck you out of the house - and you haven't got anywhere else to go - you haven't got any friends to take you -'", "begin": 798.24, "end": 808.36, "localBegin": 798.24, "localEnd": 808.36}, {"id": "c001_f000087", "text": "'Jiggery pokery!' said Harry in a fierce voice. 'Hocus pocus ... squiggly wiggly ...'", "begin": 808.36, "end": 813.96, "localBegin": 808.36, "localEnd": 813.96}, {"id": "c001_f000088", "text": "'MUUUUUUM!' howled Dudley, tripping over his feet as he dashed back towards the house. 'MUUUUM! He's doing you know what!'", "begin": 813.96, "end": 821.64, "localBegin": 813.96, "localEnd": 821.64}, {"id": "c001_f000089", "text": "Harry paid dearly for his moment of fun. As neither Dudley nor the hedge was in any way hurt, Aunt Petunia knew he hadn't really done magic, but he still had to duck as she aimed a heavy blow at his head with the soapy frying pan. Then she gave him work to do, with the promise he wouldn't eat again until he'd finished.", "begin": 821.64, "end": 840.12, "localBegin": 821.64, "localEnd": 840.12}, {"id": "c001_f000090", "text": "While Dudley lolled around watching and eating ice-creams, Harry cleaned the windows, washed the car, mowed the lawn, trimmed the flowerbeds, pruned and watered the roses and repainted the garden bench. The sun blazed overhead, burning the back of his neck. Harry knew he shouldn't have risen to Dudley's bait, but Dudley had said the very thing Harry had been thinking himself ... maybe he didn't have any friends at Hogwarts ...", "begin": 840.12, "end": 865.8, "localBegin": 840.12, "localEnd": 865.8}, {"id": "c001_f000091", "text": "'Wish they could see famous Harry Potter now,' he thought savagely, as he spread manure on the flowerbeds, his back aching, sweat running down his face.", "begin": 865.8, "end": 877.48, "localBegin": 865.8, "localEnd": 877.48}, {"id": "c001_f000092", "text": "It was half past seven in the evening when at last, exhausted, he heard Aunt Petunia calling him.", "begin": 877.48, "end": 882.68, "localBegin": 877.48, "localEnd": 882.68}, {"id": "c001_f000093", "text": "'Get in here! And walk on the newspaper!'", "begin": 882.68, "end": 886.16, "localBegin": 882.68, "localEnd": 886.16}, {"id": "c001_f000094", "text": "Harry moved gladly into the shade of the gleaming kitchen. On top of the fridge stood tonight's pudding: a huge mound of whipped cream and sugared violets. A joint of roast pork was sizzling in the oven.", "begin": 886.16, "end": 897.36, "localBegin": 886.16, "localEnd": 897.36}, {"id": "c001_f000095", "text": "'Eat quickly! The Masons will be here soon!' snapped Aunt Petunia, pointing to two slices of bread and a lump of cheese on the kitchen table. She was already wearing a salmon-pink cocktail dress.", "begin": 897.36, "end": 909.0, "localBegin": 897.36, "localEnd": 909.0}, {"id": "c001_f000096", "text": "Harry washed his hands and bolted down his pitiful supper. The moment he had finished, Aunt Petunia whisked away his", "begin": 909.0, "end": 915.8, "localBegin": 909.0, "localEnd": 915.8}, {"id": "c001_f000097", "text": "plate. 'Upstairs! Hurry!'", "begin": 915.8, "end": 918.92, "localBegin": 915.8, "localEnd": 918.92}, {"id": "c001_f000098", "text": "As he passed the door to the living room, Harry caught a glimpse of Uncle Vernon and Dudley in bow-ties and dinner jackets. He had only just reached the upstairs landing when the doorbell rang and Uncle Vernon's furious face appeared at the foot of the stairs.", "begin": 918.92, "end": 932.96, "localBegin": 918.92, "localEnd": 932.96}, {"id": "c001_f000099", "text": "'Remember, boy - one sound ...'", "begin": 932.96, "end": 935.64, "localBegin": 932.96, "localEnd": 935.64}, {"id": "c001_f000100", "text": "Harry crossed to his bedroom on tiptoe, slipped inside, closed the door and turned to collapse on his bed.", "begin": 935.64, "end": 943.12, "localBegin": 935.64, "localEnd": 943.12}, {"id": "c001_f000101", "text": "The trouble was, there was already someone sitting on it.", "begin": 943.12, "end": 951.0, "localBegin": 943.12, "localEnd": 951.0}]}, {"kind": "chapter", "number": 2, "title": "Dobby's Warning", "audio": "audio/chapter_002.mp3", "start": 951.0, "end": 2024.673, "duration": 1073.673, "paragraphs": [{"id": "c002_f000001", "text": "Chapter Two. Dobby's Warning.", "begin": 951.0, "end": 955.76, "localBegin": 0.0, "localEnd": 4.76}, {"id": "c002_f000002", "text": "Harry managed not to shout out, but it was a close thing. The little creature on the bed had large, bat-like ears and bulging green eyes the size of tennis balls. Harry knew instantly that this was what had been watching him out of the garden hedge that morning.", "begin": 955.76, "end": 970.12, "localBegin": 4.76, "localEnd": 19.12}, {"id": "c002_f000003", "text": "As they stared at each other, Harry heard Dudley's voice from the hall.", "begin": 970.12, "end": 974.64, "localBegin": 19.12, "localEnd": 23.64}, {"id": "c002_f000004", "text": "'May I take your coats, Mr and Mrs Mason?'", "begin": 974.64, "end": 978.56, "localBegin": 23.64, "localEnd": 27.56}, {"id": "c002_f000005", "text": "The creature slipped off the bed and bowed so low that the end of its long thin nose touched the carpet. Harry noticed that it was wearing what looked like an old pillowcase, with rips for arm and leg holes.", "begin": 978.56, "end": 990.36, "localBegin": 27.56, "localEnd": 39.36}, {"id": "c002_f000006", "text": "'Er - hello,' said Harry nervously.", "begin": 990.36, "end": 994.08, "localBegin": 39.36, "localEnd": 43.08}, {"id": "c002_f000007", "text": "'Harry Potter!' said the creature, in a high-pitched voice Harry was sure would carry down the stairs. 'So long has Dobby wanted to meet you, sir ... Such an honour it is ...'", "begin": 994.08, "end": 1004.8, "localBegin": 43.08, "localEnd": 53.8}, {"id": "c002_f000008", "text": "'Th-thank you,' said Harry, edging along the wall and sinking into his desk chair, next to Hedwig, who was asleep in her large cage. He wanted to ask, 'What are you?' but thought it would sound too rude, so instead he said, 'Who are you?'", "begin": 1004.8, "end": 1020.16, "localBegin": 53.8, "localEnd": 69.16}, {"id": "c002_f000009", "text": "'Dobby, sir. Just Dobby. Dobby the house-elf,' said the creature.", "begin": 1020.16, "end": 1025.32, "localBegin": 69.16, "localEnd": 74.32}, {"id": "c002_f000010", "text": "'Oh - really?' said Harry. 'Er - I don't want to be rude or anything, but - this isn't a great time for me to have a house-elf in my bedroom.'", "begin": 1025.32, "end": 1034.72, "localBegin": 74.32, "localEnd": 83.72}, {"id": "c002_f000011", "text": "Aunt Petunia's high, false laugh sounded from the living room. The elf hung his head.", "begin": 1034.72, "end": 1040.04, "localBegin": 83.72, "localEnd": 89.04}, {"id": "c002_f000012", "text": "'Not that I'm not pleased to meet you,' said Harry quickly, 'but, er, is there any particular reason you're here?'", "begin": 1040.04, "end": 1046.84, "localBegin": 89.04, "localEnd": 95.84}, {"id": "c002_f000013", "text": "'Oh, yes, sir,' said Dobby earnestly. 'Dobby has come to tell you, sir ... it is difficult, sir ... Dobby wonders where to begin ...'", "begin": 1046.84, "end": 1055.64, "localBegin": 95.84, "localEnd": 104.64}, {"id": "c002_f000014", "text": "'Sit down,' said Harry politely, pointing at the bed.", "begin": 1055.64, "end": 1059.44, "localBegin": 104.64, "localEnd": 108.44}, {"id": "c002_f000015", "text": "To his horror, the elf burst into tears - very noisy tears.", "begin": 1059.44, "end": 1063.6, "localBegin": 108.44, "localEnd": 112.6}, {"id": "c002_f000016", "text": "'S-sit down!' he wailed. 'Never ... never ever ...'", "begin": 1063.6, "end": 1068.32, "localBegin": 112.6, "localEnd": 117.32}, {"id": "c002_f000017", "text": "Harry thought he heard the voices downstairs falter.", "begin": 1068.32, "end": 1070.92, "localBegin": 117.32, "localEnd": 119.92}, {"id": "c002_f000018", "text": "'I'm sorry,' he whispered, 'I didn't mean to offend you or anything.'", "begin": 1070.92, "end": 1075.32, "localBegin": 119.92, "localEnd": 124.32}, {"id": "c002_f000019", "text": "'Offend Dobby!' choked the elf. 'Dobby has never been asked to sit down by a wizard - like an equal -'", "begin": 1075.32, "end": 1083.36, "localBegin": 124.32, "localEnd": 132.36}, {"id": "c002_f000020", "text": "Harry, trying to say 'Shh!' and look comforting at the same time, ushered Dobby back onto the bed where he sat hiccoughing, looking like a large and very ugly doll. At last he managed to control himself, and sat with his great eyes fixed on Harry in an expression of watery adoration.", "begin": 1083.36, "end": 1100.6, "localBegin": 132.36, "localEnd": 149.6}, {"id": "c002_f000021", "text": "'You can't have met many decent wizards,' said Harry, trying to cheer him up.", "begin": 1100.6, "end": 1104.84, "localBegin": 149.6, "localEnd": 153.84}, {"id": "c002_f000022", "text": "Dobby shook his head. Then, without warning, he leapt up and started banging his head furiously on the window, shouting, 'Bad Dobby! Bad Dobby!'", "begin": 1104.84, "end": 1113.36, "localBegin": 153.84, "localEnd": 162.36}, {"id": "c002_f000023", "text": "'Don't - what are you doing?' Harry hissed, springing up and pulling Dobby back onto the bed. Hedwig had woken up with a particularly loud screech and was beating her wings wildly against the bars of her cage.", "begin": 1113.36, "end": 1125.72, "localBegin": 162.36, "localEnd": 174.72}, {"id": "c002_f000024", "text": "'Dobby had to punish himself, sir,' said the elf, who had gone slightly cross-eyed. 'Dobby almost spoke ill of his family, sir ...'", "begin": 1125.72, "end": 1133.6, "localBegin": 174.72, "localEnd": 182.6}, {"id": "c002_f000025", "text": "'Your family?'", "begin": 1133.6, "end": 1134.32, "localBegin": 182.6, "localEnd": 183.32}, {"id": "c002_f000026", "text": "'The wizard family Dobby serves, sir ... Dobby is a house-elf bound to serve one house and one family for ever ...'", "begin": 1134.32, "end": 1142.88, "localBegin": 183.32, "localEnd": 191.88}, {"id": "c002_f000027", "text": "'Do they know you're here?' asked Harry curiously.", "begin": 1142.88, "end": 1146.36, "localBegin": 191.88, "localEnd": 195.36}, {"id": "c002_f000028", "text": "Dobby shuddered.", "begin": 1146.36, "end": 1147.92, "localBegin": 195.36, "localEnd": 196.92}, {"id": "c002_f000029", "text": "'Oh no, sir, no ... Dobby will have to punish himself most grievously for coming to see you, sir. Dobby will have to shut his ears in the oven door for this. If they ever knew, sir -'", "begin": 1147.92, "end": 1161.52, "localBegin": 196.92, "localEnd": 210.52}, {"id": "c002_f000030", "text": "'But won't they notice if you shut your ears in the oven door?'", "begin": 1161.52, "end": 1165.24, "localBegin": 210.52, "localEnd": 214.24}, {"id": "c002_f000031", "text": "'Dobby doubts it, sir. Dobby is always having to punish himself for something, sir. They lets Dobby get on with it, sir. Sometimes they reminds me to do extra punishments ...'", "begin": 1165.24, "end": 1176.88, "localBegin": 214.24, "localEnd": 225.88}, {"id": "c002_f000032", "text": "'But why don't you leave? Escape?'", "begin": 1176.88, "end": 1179.2, "localBegin": 225.88, "localEnd": 228.2}, {"id": "c002_f000033", "text": "'A house-elf must be set free, sir. And the family will never set Dobby free ... Dobby will serve the family until he dies, sir ...'", "begin": 1179.2, "end": 1189.04, "localBegin": 228.2, "localEnd": 238.04}, {"id": "c002_f000034", "text": "Harry stared.", "begin": 1189.04, "end": 1190.88, "localBegin": 238.04, "localEnd": 239.88}, {"id": "c002_f000035", "text": "'And I thought I was hard-done-by staying here for another four weeks,' he said. 'This makes the Dursleys sound almost human. Can't anyone help you? Can't I?'", "begin": 1190.88, "end": 1200.84, "localBegin": 239.88, "localEnd": 249.84}, {"id": "c002_f000036", "text": "Almost at once, Harry wished he hadn't spoken. Dobby dissolved again into wails of gratitude.", "begin": 1200.84, "end": 1207.2, "localBegin": 249.84, "localEnd": 256.2}, {"id": "c002_f000037", "text": "'Please,' Harry whispered frantically, 'please be quiet. If the Dursleys hear anything, if they know you're here ...'", "begin": 1207.2, "end": 1213.92, "localBegin": 256.2, "localEnd": 262.92}, {"id": "c002_f000038", "text": "'Harry Potter asks if he can help Dobby ... Dobby has heard of your greatness, sir, but of your goodness, Dobby never knew ...'", "begin": 1213.92, "end": 1224.04, "localBegin": 262.92, "localEnd": 273.04}, {"id": "c002_f000039", "text": "Harry, who was feeling distinctly hot in the face, said, 'Whatever you've heard about my greatness is a load of rubbish. I'm not even top of my year at Hogwarts, that's Hermione, she -'", "begin": 1224.04, "end": 1234.44, "localBegin": 273.04, "localEnd": 283.44}, {"id": "c002_f000040", "text": "But he stopped quickly, because thinking about Hermione was painful.", "begin": 1234.44, "end": 1239.16, "localBegin": 283.44, "localEnd": 288.16}, {"id": "c002_f000041", "text": "'Harry Potter is humble and modest,' said Dobby reverently, his orb-like eyes aglow. 'Harry Potter speaks not of his triumph over He Who Must Not Be Named.'", "begin": 1239.16, "end": 1251.16, "localBegin": 288.16, "localEnd": 300.16}, {"id": "c002_f000042", "text": "'Voldemort?' said Harry.", "begin": 1251.16, "end": 1253.28, "localBegin": 300.16, "localEnd": 302.28}, {"id": "c002_f000043", "text": "Dobby clapped his hands over his bat ears and moaned, 'Ah, speak not the name, sir! Speak not the name!'", "begin": 1253.28, "end": 1261.28, "localBegin": 302.28, "localEnd": 310.28}, {"id": "c002_f000044", "text": "'Sorry,' said Harry quickly. 'I know lots of people don't like it my friend Ron ...'", "begin": 1261.28, "end": 1266.88, "localBegin": 310.28, "localEnd": 315.88}, {"id": "c002_f000045", "text": "He stopped again. Thinking about Ron was painful, too.", "begin": 1266.88, "end": 1271.24, "localBegin": 315.88, "localEnd": 320.24}, {"id": "c002_f000046", "text": "Dobby leaned towards Harry, his eyes wide as headlamps.", "begin": 1271.24, "end": 1275.08, "localBegin": 320.24, "localEnd": 324.08}, {"id": "c002_f000047", "text": "'Dobby heard tell,' he said hoarsely, 'that Harry Potter met the Dark Lord for a second time, just weeks ago ... that Harry Potter escaped yet again.'", "begin": 1275.08, "end": 1286.56, "localBegin": 324.08, "localEnd": 335.56}, {"id": "c002_f000048", "text": "Harry nodded and Dobby's eyes suddenly shone with tears.", "begin": 1286.56, "end": 1291.28, "localBegin": 335.56, "localEnd": 340.28}, {"id": "c002_f000049", "text": "'Ah, sir,' he gasped, dabbing his face with a corner of the grubby pillowcase he was wearing. 'Harry Potter is valiant and bold! He has braved so many dangers already! But Dobby has come to protect Harry Potter, to warn him, even if he does have to shut his ears in the oven door later ... Harry Potter must not go back to Hogwarts.'", "begin": 1291.28, "end": 1313.56, "localBegin": 340.28, "localEnd": 362.56}, {"id": "c002_f000050", "text": "There was a silence broken only by the chink of knives and forks from downstairs and the distant rumble of Uncle Vernon's voice.", "begin": 1313.56, "end": 1321.72, "localBegin": 362.56, "localEnd": 370.72}, {"id": "c002_f000051", "text": "'W-what?' Harry stammered. 'But I've got to go back - term starts on September the first. It's all that's keeping me going. You don't know what it's like here. I don't belong here. I belong in your", "begin": 1321.72, "end": 1334.36, "localBegin": 370.72, "localEnd": 383.36}, {"id": "c002_f000052", "text": "world - at Hogwarts.'", "begin": 1334.36, "end": 1335.96, "localBegin": 383.36, "localEnd": 384.96}, {"id": "c002_f000053", "text": "'No, no, no,' squeaked Dobby, shaking his head so hard his ears flapped. 'Harry Potter must stay where he is safe. He is too great, too good, to lose. If Harry Potter goes back to Hogwarts, he will be in mortal danger.'", "begin": 1335.96, "end": 1352.6, "localBegin": 384.96, "localEnd": 401.6}, {"id": "c002_f000054", "text": "'Why?' said Harry in surprise.", "begin": 1352.6, "end": 1355.08, "localBegin": 401.6, "localEnd": 404.08}, {"id": "c002_f000055", "text": "'There is a plot, Harry Potter. A plot to make most terrible things happen at Hogwarts School of Witchcraft and Wizardry this year,' whispered Dobby, suddenly trembling all over. 'Dobby has known it for months, sir. Harry Potter must not put himself in peril. He is too important, sir!'", "begin": 1355.08, "end": 1374.0, "localBegin": 404.08, "localEnd": 423.0}, {"id": "c002_f000056", "text": "'What terrible things?' said Harry at once. 'Who's plotting them?'", "begin": 1374.0, "end": 1378.68, "localBegin": 423.0, "localEnd": 427.68}, {"id": "c002_f000057", "text": "Dobby made a funny choking noise and then banged his head madly against the wall.", "begin": 1378.68, "end": 1383.44, "localBegin": 427.68, "localEnd": 432.44}, {"id": "c002_f000058", "text": "'All right!' cried Harry, grabbing the elf's arm to stop him. 'You can't say, I understand. But why are you warning me?' A sudden, unpleasant thought struck him. 'Hang on - this hasn't got anything to do with Vol- sorry - with You Know Who, has it? You could just shake or nod,' he added hastily, as Dobby's head tilted worryingly close to the wall again.", "begin": 1383.44, "end": 1408.16, "localBegin": 432.44, "localEnd": 457.16}, {"id": "c002_f000059", "text": "Slowly, Dobby shook his head.", "begin": 1408.16, "end": 1410.16, "localBegin": 457.16, "localEnd": 459.16}, {"id": "c002_f000060", "text": "'Not - not He Who Must Not Be Named, sir.'", "begin": 1410.16, "end": 1415.08, "localBegin": 459.16, "localEnd": 464.08}, {"id": "c002_f000061", "text": "But Dobby's eyes were wide and he seemed to be trying to give Harry a hint. Harry, however, was completely at sea.", "begin": 1415.08, "end": 1421.6, "localBegin": 464.08, "localEnd": 470.6}, {"id": "c002_f000062", "text": "'He hasn't got a brother, has he?'", "begin": 1421.6, "end": 1423.72, "localBegin": 470.6, "localEnd": 472.72}, {"id": "c002_f000063", "text": "Dobby shook his head, his eyes wider than ever.", "begin": 1423.72, "end": 1427.32, "localBegin": 472.72, "localEnd": 476.32}, {"id": "c002_f000064", "text": "'Well then, I can't think who else would have a chance of making horrible things happen at Hogwarts,' said Harry. 'I mean, there's Dumbledore, for one thing - you know who Dumbledore is, don't you?'", "begin": 1427.32, "end": 1436.8, "localBegin": 476.32, "localEnd": 485.8}, {"id": "c002_f000065", "text": "Dobby bowed his head.", "begin": 1436.8, "end": 1439.4, "localBegin": 485.8, "localEnd": 488.4}, {"id": "c002_f000066", "text": "'Albus Dumbledore is the greatest Headmaster Hogwarts has ever had. Dobby knows it, sir. Dobby has heard Dumbledore's powers rival those of He Who Must Not Be Named at the height of his strength. But sir,' Dobby's voice dropped to an urgent whisper, 'there are powers Dumbledore doesn't ... powers no decent wizard ...'", "begin": 1439.4, "end": 1460.08, "localBegin": 488.4, "localEnd": 509.08}, {"id": "c002_f000067", "text": "And before Harry could stop him, Dobby bounded off the bed, seized Harry's desk lamp and started beating himself around the", "begin": 1460.08, "end": 1467.24, "localBegin": 509.08, "localEnd": 516.24}, {"id": "c002_f000068", "text": "head with ear-splitting yelps.", "begin": 1467.24, "end": 1469.36, "localBegin": 516.24, "localEnd": 518.36}, {"id": "c002_f000069", "text": "A sudden silence fell downstairs. Two seconds later Harry, heart thudding madly, heard Uncle Vernon coming into the hall, calling, 'Dudley must have left his television on again, the little tyke!'", "begin": 1469.36, "end": 1480.4, "localBegin": 518.36, "localEnd": 529.4}, {"id": "c002_f000070", "text": "'Quick! In the wardrobe!' hissed Harry, stuffing Dobby in, shutting the door and flinging himself onto the bed just as the door handle turned.", "begin": 1480.4, "end": 1489.52, "localBegin": 529.4, "localEnd": 538.52}, {"id": "c002_f000071", "text": "'What - the - devil - are - you - doing?' said Uncle Vernon through gritted teeth, his face horribly close to Harry's. 'You've just ruined the punchline of my Japanese-golfer joke ... one more sound and you'll wish you'd never been born, boy!'", "begin": 1489.52, "end": 1505.56, "localBegin": 538.52, "localEnd": 554.56}, {"id": "c002_f000072", "text": "He stomped flat-footed from the room.", "begin": 1505.56, "end": 1508.08, "localBegin": 554.56, "localEnd": 557.08}, {"id": "c002_f000073", "text": "Shaking, Harry let Dobby out of the wardrobe.", "begin": 1508.08, "end": 1511.32, "localBegin": 557.08, "localEnd": 560.32}, {"id": "c002_f000074", "text": "'See what it's like here?' he said. 'See why I've got to go back to Hogwarts? It's the only place I've got - well, I think I've got friends.'", "begin": 1511.32, "end": 1519.44, "localBegin": 560.32, "localEnd": 568.44}, {"id": "c002_f000075", "text": "'Friends who don't even write to Harry Potter?' said Dobby slyly.", "begin": 1519.44, "end": 1525.48, "localBegin": 568.44, "localEnd": 574.48}, {"id": "c002_f000076", "text": "'I expect they've just been - hang on,' said Harry, frowning. 'How do you know my friends haven't been writing to me?'", "begin": 1525.48, "end": 1533.0, "localBegin": 574.48, "localEnd": 582.0}, {"id": "c002_f000077", "text": "Dobby shuffled his feet.", "begin": 1533.0, "end": 1534.56, "localBegin": 582.0, "localEnd": 583.56}, {"id": "c002_f000078", "text": "'Harry Potter mustn't be angry with Dobby - Dobby did it for the best ...'", "begin": 1534.56, "end": 1538.68, "localBegin": 583.56, "localEnd": 587.68}, {"id": "c002_f000079", "text": "'Have you been stopping my letters?'", "begin": 1538.68, "end": 1541.64, "localBegin": 587.68, "localEnd": 590.64}, {"id": "c002_f000080", "text": "'Dobby has them here, sir,' said the elf. Stepping nimbly out of Harry's reach, he pulled a thick wad of envelopes from the inside of the pillowcase he was wearing. Harry could make out Hermione's neat writing, Ron's untidy scrawl and even a scribble that looked as though it was from the Hogwarts gamekeeper, Hagrid.", "begin": 1541.64, "end": 1558.64, "localBegin": 590.64, "localEnd": 607.64}, {"id": "c002_f000081", "text": "Dobby blinked anxiously up at Harry.", "begin": 1558.64, "end": 1561.08, "localBegin": 607.64, "localEnd": 610.08}, {"id": "c002_f000082", "text": "'Harry Potter mustn't be angry ... Dobby hoped ... if Harry Potter thought his friends had forgotten him ... Harry Potter might not want to go back to school, sir ...'", "begin": 1561.08, "end": 1570.4, "localBegin": 610.08, "localEnd": 619.4}, {"id": "c002_f000083", "text": "Harry wasn't listening. He made a grab for the letters, but Dobby jumped out of reach.", "begin": 1570.4, "end": 1575.2, "localBegin": 619.4, "localEnd": 624.2}, {"id": "c002_f000084", "text": "'Harry Potter will have them, sir, if he gives Dobby his word that he will not return to Hogwarts. Ah, sir, this is a danger you must not face! Say you won't go back, sir!'", "begin": 1575.2, "end": 1586.68, "localBegin": 624.2, "localEnd": 635.68}, {"id": "c002_f000085", "text": "'No,' said Harry angrily. 'Give me my friends' letters!'", "begin": 1586.68, "end": 1589.68, "localBegin": 635.68, "localEnd": 638.68}, {"id": "c002_f000086", "text": "'Then Harry Potter leaves Dobby no choice,' said the elf sadly.", "begin": 1589.68, "end": 1595.64, "localBegin": 638.68, "localEnd": 644.64}, {"id": "c002_f000087", "text": "Before Harry could move, Dobby had darted to the bedroom door, pulled it open - and sprinted down the stairs.", "begin": 1595.64, "end": 1601.88, "localBegin": 644.64, "localEnd": 650.88}, {"id": "c002_f000088", "text": "Mouth dry, stomach lurching, Harry sprang after him, trying not to make a sound. He jumped the last six stairs, landing catlike on the hall carpet, looking around for Dobby. From the dining room he heard Uncle Vernon saying, '... tell Petunia that very funny story about those American plumbers, Mr Mason, she's been dying to hear ...'", "begin": 1601.88, "end": 1621.68, "localBegin": 650.88, "localEnd": 670.68}, {"id": "c002_f000089", "text": "Harry ran up the hall into the kitchen and felt his stomach disappear.", "begin": 1621.68, "end": 1626.88, "localBegin": 670.68, "localEnd": 675.88}, {"id": "c002_f000090", "text": "Aunt Petunia's masterpiece of a pudding, the mountain of cream and sugared violets, was floating up near the ceiling. On top of a cupboard in the corner crouched Dobby.", "begin": 1626.88, "end": 1638.76, "localBegin": 675.88, "localEnd": 687.76}, {"id": "c002_f000091", "text": "'No,' croaked Harry. 'Please ... they'll kill me ...'", "begin": 1638.76, "end": 1644.36, "localBegin": 687.76, "localEnd": 693.36}, {"id": "c002_f000092", "text": "'Harry Potter must say he's not going back to school -'", "begin": 1644.36, "end": 1648.64, "localBegin": 693.36, "localEnd": 697.64}, {"id": "c002_f000093", "text": "'Dobby ... please ...'", "begin": 1648.64, "end": 1650.92, "localBegin": 697.64, "localEnd": 699.92}, {"id": "c002_f000094", "text": "'Say it, sir ...'", "begin": 1650.92, "end": 1653.08, "localBegin": 699.92, "localEnd": 702.08}, {"id": "c002_f000095", "text": "'I can't!'", "begin": 1653.08, "end": 1654.0, "localBegin": 702.08, "localEnd": 703.0}, {"id": "c002_f000096", "text": "Dobby gave him a tragic look.", "begin": 1654.0, "end": 1656.2, "localBegin": 703.0, "localEnd": 705.2}, {"id": "c002_f000097", "text": "'Then Dobby must do it, sir, for Harry Potter's own good.'", "begin": 1656.2, "end": 1662.24, "localBegin": 705.2, "localEnd": 711.24}, {"id": "c002_f000098", "text": "The pudding fell to the floor with a heart-stopping crash. Cream splattered the windows and walls as the dish shattered. With a crack like a whip, Dobby vanished.", "begin": 1662.24, "end": 1671.52, "localBegin": 711.24, "localEnd": 720.52}, {"id": "c002_f000099", "text": "There were screams from the dining room and Uncle Vernon burst into the kitchen to find Harry, rigid with shock, covered from head to foot in Aunt Petunia's pudding.", "begin": 1671.52, "end": 1682.12, "localBegin": 720.52, "localEnd": 731.12}, {"id": "c002_f000100", "text": "At first, it looked as though Uncle Vernon would manage to gloss the whole thing over ('Just our nephew - very disturbed meeting strangers upsets him, so we kept him upstairs ...') He shooed the shocked Masons back into the dining room, promised Harry he would flay him to within an inch of his life when the Masons had left, and handed him a mop. Aunt Petunia dug some ice-cream out of the freezer and Harry, still shaking, started scrubbing the kitchen clean.", "begin": 1682.12, "end": 1711.24, "localBegin": 731.12, "localEnd": 760.24}, {"id": "c002_f000101", "text": "Uncle Vernon might still have been able to make his deal - if it hadn't been for the owl.", "begin": 1711.24, "end": 1718.48, "localBegin": 760.24, "localEnd": 767.48}, {"id": "c002_f000102", "text": "Aunt Petunia was just handing round a box of after-dinner mints when a huge barn owl swooped through the dining room window, dropped a letter on Mrs Mason's head and swooped out", "begin": 1718.48, "end": 1727.64, "localBegin": 767.48, "localEnd": 776.64}, {"id": "c002_f000103", "text": "again. Mrs Mason screamed like a banshee and ran from the house, shouting about lunatics. Mr Mason stayed just long enough to tell the Dursleys that his wife was mortally afraid of birds of all shapes and sizes, and to ask whether this was their idea of a joke.", "begin": 1727.64, "end": 1743.0, "localBegin": 776.64, "localEnd": 792.0}, {"id": "c002_f000104", "text": "Harry stood in the kitchen, clutching the mop for support as Uncle Vernon advanced on him, a demonic glint in his tiny eyes.", "begin": 1743.0, "end": 1751.64, "localBegin": 792.0, "localEnd": 800.64}, {"id": "c002_f000105", "text": "'Read it!' he hissed evilly, brandishing the letter the owl had delivered. 'Go on - read it!'", "begin": 1751.64, "end": 1758.8, "localBegin": 800.64, "localEnd": 807.8}, {"id": "c002_f000106", "text": "Harry took it. It did not contain birthday greetings.", "begin": 1758.8, "end": 1765.08, "localBegin": 807.8, "localEnd": 814.08}, {"id": "c002_f000107", "text": "Dear Mr Potter, We have received intelligence that a Hover Charm was used at", "begin": 1765.08, "end": 1769.16, "localBegin": 814.08, "localEnd": 818.16}, {"id": "c002_f000108", "text": "your place of residence this evening at twelve minutes past nine. As you know, underage wizards are not permitted to perform", "begin": 1769.16, "end": 1775.08, "localBegin": 818.16, "localEnd": 824.08}, {"id": "c002_f000109", "text": "spells outside school, and further spellwork on your part may", "begin": 1775.08, "end": 1778.76, "localBegin": 824.08, "localEnd": 827.76}, {"id": "c002_f000110", "text": "lead to expulsion from said school (Decree for the Reasonable", "begin": 1778.76, "end": 1782.12, "localBegin": 827.76, "localEnd": 831.12}, {"id": "c002_f000111", "text": "Restriction of Underage sorcery, 1875, Paragraph C). We would also ask you to remember that any magical activity", "begin": 1782.12, "end": 1790.0, "localBegin": 831.12, "localEnd": 839.0}, {"id": "c002_f000112", "text": "which risks notice by members of the non-magical community", "begin": 1790.0, "end": 1793.36, "localBegin": 839.0, "localEnd": 842.36}, {"id": "c002_f000113", "text": "(Muggles) is a serious offence, under section 13 of the", "begin": 1793.36, "end": 1797.48, "localBegin": 842.36, "localEnd": 846.48}, {"id": "c002_f000114", "text": "International Confederation of Warlocks' Statute of Secrecy. Enjoy your holidays! Yours sincerely, Mafalda Hopkirk Improper Use of Magic Office Ministry of Magic", "begin": 1797.48, "end": 1810.04, "localBegin": 846.48, "localEnd": 859.04}, {"id": "c002_f000115", "text": "Harry looked up from the letter and gulped.", "begin": 1810.04, "end": 1813.56, "localBegin": 859.04, "localEnd": 862.56}, {"id": "c002_f000116", "text": "'You didn't tell us you weren't allowed to use magic outside school,' said Uncle Vernon, a mad gleam dancing in his eyes. 'Forgot to mention it ... slipped your mind, I dare say ...'", "begin": 1813.56, "end": 1825.56, "localBegin": 862.56, "localEnd": 874.56}, {"id": "c002_f000117", "text": "He was bearing down on Harry like a great bulldog, all his teeth bared. 'Well, I've got news for you, boy ... I'm locking you up ... you're never going back to that school ... never ... and if you try and magic yourself out - they'll expel you!'", "begin": 1825.56, "end": 1840.56, "localBegin": 874.56, "localEnd": 889.56}, {"id": "c002_f000118", "text": "And laughing like a maniac, he dragged Harry back upstairs.", "begin": 1840.56, "end": 1846.04, "localBegin": 889.56, "localEnd": 895.04}, {"id": "c002_f000119", "text": "Uncle Vernon was as bad as his word. The following morning, he paid a man to fit bars on Harry's window. He himself fitted the cat-flap in the bedroom door, so that small amounts of food could be pushed inside three times a day. They let Harry out to use the", "begin": 1846.04, "end": 1861.08, "localBegin": 895.04, "localEnd": 910.08}, {"id": "c002_f000120", "text": "bathroom morning and evening. Otherwise, he was locked in his room around the clock. * Three days later, the Dursleys were showing no sign of relenting and Harry couldn't see any way out of his situation. He lay on his bed watching the sun sinking behind the bars on the window and wondered miserably what was going to happen to him.", "begin": 1861.08, "end": 1882.84, "localBegin": 910.08, "localEnd": 931.84}, {"id": "c002_f000121", "text": "What was the good of magicking himself out of his room if Hogwarts would expel him for doing it? Yet life at Privet Drive had reached an all-time low. Now the Dursleys knew they weren't going to wake up as fruitbats, he had lost his only weapon. Dobby might have saved Harry from horrible happenings at Hogwarts, but the way things were going, he'd probably starve to death anyway.", "begin": 1882.84, "end": 1904.28, "localBegin": 931.84, "localEnd": 953.28}, {"id": "c002_f000122", "text": "The cat-flap rattled and Aunt Petunia's hand appeared, pushing a bowl of tinned soup into the room. Harry, whose insides were aching with hunger, jumped off his bed and seized it. The soup was stone cold, but he drank half of it in one gulp. Then he crossed the room to Hedwig's cage and tipped the soggy vegetables at the bottom of the bowl into her empty food tray. She ruffled her feathers and gave him a look of deep disgust.", "begin": 1904.28, "end": 1931.84, "localBegin": 953.28, "localEnd": 980.84}, {"id": "c002_f000123", "text": "'It's no good turning your beak up at it, that's all we've got,' said Harry grimly.", "begin": 1931.84, "end": 1937.8, "localBegin": 980.84, "localEnd": 986.8}, {"id": "c002_f000124", "text": "He put the empty bowl back on the floor next to the cat-flap and lay back down on the bed, somehow even hungrier than he had been before the soup.", "begin": 1937.8, "end": 1947.0, "localBegin": 986.8, "localEnd": 996.0}, {"id": "c002_f000125", "text": "Supposing he was still alive in another four weeks, what would happen if he didn't turn up at Hogwarts? Would someone be sent to see why he hadn't come back? Would they be able to make the Dursleys let him go?", "begin": 1947.0, "end": 1959.84, "localBegin": 996.0, "localEnd": 1008.84}, {"id": "c002_f000126", "text": "The room was growing dark. Exhausted, stomach rumbling, mind spinning over the same unanswerable questions, Harry fell into an uneasy sleep.", "begin": 1959.84, "end": 1970.8, "localBegin": 1008.84, "localEnd": 1019.8}, {"id": "c002_f000127", "text": "He dreamed that he was on show in a zoo, with a card reading 'Underage Wizard' attached to his cage. People goggled through the bars at him as he lay, starving and weak, on a bed of straw. He saw Dobby's face in the crowd and shouted out, asking for help, but Dobby called, 'Harry Potter is safe there, sir!' and vanished. Then the Dursleys appeared and Dudley rattled the bars of the cage, laughing at him.", "begin": 1970.8, "end": 1996.68, "localBegin": 1019.8, "localEnd": 1045.68}, {"id": "c002_f000128", "text": "'Stop it,' Harry muttered, as the rattling pounded in his sore head. 'Leave me alone ... cut it out ... I'm trying to sleep ...'", "begin": 1996.68, "end": 2005.48, "localBegin": 1045.68, "localEnd": 1054.48}, {"id": "c002_f000129", "text": "He opened his eyes. Moonlight was shining through the bars on the window. And someone was goggling through the bars at him: a freckle-faced, red-haired, long-nosed someone.", "begin": 2005.48, "end": 2018.76, "localBegin": 1054.48, "localEnd": 1067.76}, {"id": "c002_f000130", "text": "Ron Weasley was outside Harry's window.", "begin": 2018.76, "end": 2024.64, "localBegin": 1067.76, "localEnd": 1073.64}]}, {"kind": "chapter", "number": 3, "title": "The Burrow", "audio": "audio/chapter_003.mp3", "start": 2024.673, "end": 3626.673, "duration": 1602.0, "paragraphs": [{"id": "c003_f000001", "text": "Chapter Three. The Burrow.", "begin": 2024.673, "end": 2028.913, "localBegin": 0.0, "localEnd": 4.24}, {"id": "c003_f000002", "text": "'Ron!' breathed Harry, creeping to the window and pushing it up so they could talk through the bars. 'Ron, how did you - what the -?'", "begin": 2028.913, "end": 2038.513, "localBegin": 4.24, "localEnd": 13.84}, {"id": "c003_f000003", "text": "Harry's mouth fell open as the full impact of what he was seeing hit him. Ron was leaning out of the back window of an old turquoise car, which was parked in mid-air. Grinning at Harry from the front seats were Fred and George, Ron's elder twin brothers.", "begin": 2038.513, "end": 2055.113, "localBegin": 13.84, "localEnd": 30.44}, {"id": "c003_f000004", "text": "'All right, Harry?'", "begin": 2055.113, "end": 2057.313, "localBegin": 30.44, "localEnd": 32.64}, {"id": "c003_f000005", "text": "'What's been going on?' said Ron. 'Why haven't you been answering my letters? I've asked you to stay about twelve times, and then Dad came home and said you'd got an official warning for using magic in front of Muggles ...'", "begin": 2057.313, "end": 2069.873, "localBegin": 32.64, "localEnd": 45.2}, {"id": "c003_f000006", "text": "'It wasn't me - and how did he know?'", "begin": 2069.873, "end": 2072.353, "localBegin": 45.2, "localEnd": 47.68}, {"id": "c003_f000007", "text": "'He works for the Ministry,' said Ron. 'You know we're not supposed to do spells outside school -'", "begin": 2072.353, "end": 2078.953, "localBegin": 47.68, "localEnd": 54.28}, {"id": "c003_f000008", "text": "'Bit rich coming from you,' said Harry, staring at the floating car.", "begin": 2078.953, "end": 2082.313, "localBegin": 54.28, "localEnd": 57.64}, {"id": "c003_f000009", "text": "'Oh, this doesn't count,' said Ron. 'We're only borrowing this, it's Dad's, we didn't enchant it. But doing magic in front of those Muggles you live with ...'", "begin": 2082.313, "end": 2092.193, "localBegin": 57.64, "localEnd": 67.52}, {"id": "c003_f000010", "text": "'I told you, I didn't - but it'll take too long to explain now. Look, can you explain to them at Hogwarts that the Dursleys have locked me up and won't let me come back, and obviously I can't magic myself out, because the Ministry'll think that's the second spell I've done in three days, so -'", "begin": 2092.193, "end": 2108.473, "localBegin": 67.52, "localEnd": 83.8}, {"id": "c003_f000011", "text": "'Stop gibbering,' said Ron, 'we've come to take you home with us.'", "begin": 2108.473, "end": 2113.633, "localBegin": 83.8, "localEnd": 88.96}, {"id": "c003_f000012", "text": "'But you can't magic me out either -'", "begin": 2113.633, "end": 2115.793, "localBegin": 88.96, "localEnd": 91.12}, {"id": "c003_f000013", "text": "'We don't need to,' said Ron, jerking his head towards the front seats and grinning. 'You forget who I've got with me.'", "begin": 2115.793, "end": 2123.393, "localBegin": 91.12, "localEnd": 98.72}, {"id": "c003_f000014", "text": "'Tie that round the bars,' said Fred, throwing the end of a rope to Harry.", "begin": 2123.393, "end": 2127.993, "localBegin": 98.72, "localEnd": 103.32}, {"id": "c003_f000015", "text": "'If the Dursleys wake up, I'm dead,' said Harry, as he tied the rope tightly around a bar and Fred revved up the car.", "begin": 2127.993, "end": 2135.233, "localBegin": 103.32, "localEnd": 110.56}, {"id": "c003_f000016", "text": "'Don't worry,' said Fred, 'and stand back.'", "begin": 2135.233, "end": 2138.633, "localBegin": 110.56, "localEnd": 113.96}, {"id": "c003_f000017", "text": "Harry moved back into the shadows next to Hedwig, who seemed to have realised how important this was and kept still and silent. The car revved louder and louder and suddenly, with a crunching noise, the bars were pulled clean out of the window as Fred drove straight up in the air - Harry ran back to the window to see the bars dangling a few feet above the ground. Panting, Ron hoisted them up into the car. Harry listened anxiously, but there was no sound from the Dursleys' bedroom.", "begin": 2138.633, "end": 2165.833, "localBegin": 113.96, "localEnd": 141.16}, {"id": "c003_f000018", "text": "When the bars were safely in the back seat with Ron, Fred reversed as close as possible to Harry's window.", "begin": 2165.833, "end": 2172.793, "localBegin": 141.16, "localEnd": 148.12}, {"id": "c003_f000019", "text": "'Get in,' Ron said.", "begin": 2172.793, "end": 2174.193, "localBegin": 148.12, "localEnd": 149.52}, {"id": "c003_f000020", "text": "'But all my Hogwarts stuff ... my wand ... my broomstick ...'", "begin": 2174.193, "end": 2177.753, "localBegin": 149.52, "localEnd": 153.08}, {"id": "c003_f000021", "text": "'Where is it?'", "begin": 2177.753, "end": 2178.593, "localBegin": 153.08, "localEnd": 153.92}, {"id": "c003_f000022", "text": "'Locked in the cupboard under the stairs, and I can't get out of this room -'", "begin": 2178.593, "end": 2182.473, "localBegin": 153.92, "localEnd": 157.8}, {"id": "c003_f000023", "text": "'No problem,' said George from the front passenger seat. 'Out of the way, Harry.'", "begin": 2182.473, "end": 2187.633, "localBegin": 157.8, "localEnd": 162.96}, {"id": "c003_f000024", "text": "Fred and George climbed carefully through the window into Harry's room. You had to hand it to them, thought Harry, as George took an ordinary hairpin from his pocket and started to pick the lock.", "begin": 2187.633, "end": 2198.713, "localBegin": 162.96, "localEnd": 174.04}, {"id": "c003_f000025", "text": "'A lot of wizards think it's a waste of time, knowing this sort of Muggle trick,' said Fred, 'but we feel they're skills worth learning, even if they are a bit slow.'", "begin": 2198.713, "end": 2207.953, "localBegin": 174.04, "localEnd": 183.28}, {"id": "c003_f000026", "text": "There was a small click and the door swung open.", "begin": 2207.953, "end": 2211.753, "localBegin": 183.28, "localEnd": 187.08}, {"id": "c003_f000027", "text": "'So - we'll get your trunk - you grab anything you need from your room and hand it out to Ron,' whispered George.", "begin": 2211.753, "end": 2218.513, "localBegin": 187.08, "localEnd": 193.84}, {"id": "c003_f000028", "text": "'Watch out for the bottom stair, it creaks,' Harry whispered back, as the twins disappeared onto the dark landing.", "begin": 2218.513, "end": 2225.633, "localBegin": 193.84, "localEnd": 200.96}, {"id": "c003_f000029", "text": "Harry dashed around his room, collecting his things together and passing them out of the window to Ron. Then he went to help Fred and George heave his trunk up the stairs. Harry heard Uncle Vernon cough.", "begin": 2225.633, "end": 2236.673, "localBegin": 200.96, "localEnd": 212.0}, {"id": "c003_f000030", "text": "At last, panting, they reached the landing, then carried the trunk through Harry's room to the open window. Fred climbed", "begin": 2236.673, "end": 2243.353, "localBegin": 212.0, "localEnd": 218.68}, {"id": "c003_f000031", "text": "back into the car to pull with Ron, and Harry and George pushed from the bedroom side. Inch by inch, the trunk slid through the window.", "begin": 2243.353, "end": 2252.593, "localBegin": 218.68, "localEnd": 227.92}, {"id": "c003_f000032", "text": "Uncle Vernon coughed again.", "begin": 2252.593, "end": 2254.913, "localBegin": 227.92, "localEnd": 230.24}, {"id": "c003_f000033", "text": "'A bit more,' panted Fred, who was pulling from inside the car, 'one good push ...'", "begin": 2254.913, "end": 2262.193, "localBegin": 230.24, "localEnd": 237.52}, {"id": "c003_f000034", "text": "Harry and George threw their shoulders against the trunk and it slid out of the window into the back seat of the car.", "begin": 2262.193, "end": 2268.073, "localBegin": 237.52, "localEnd": 243.4}, {"id": "c003_f000035", "text": "'OK, let's go,' George whispered.", "begin": 2268.073, "end": 2271.313, "localBegin": 243.4, "localEnd": 246.64}, {"id": "c003_f000036", "text": "But as Harry climbed onto the windowsill there came a sudden loud screech from behind him, followed immediately by the thunder of Uncle Vernon's voice.", "begin": 2271.313, "end": 2279.953, "localBegin": 246.64, "localEnd": 255.28}, {"id": "c003_f000037", "text": "'THAT RUDDY OWL!'", "begin": 2279.953, "end": 2282.673, "localBegin": 255.28, "localEnd": 258.0}, {"id": "c003_f000038", "text": "'I've forgotten Hedwig!'", "begin": 2282.673, "end": 2284.633, "localBegin": 258.0, "localEnd": 259.96}, {"id": "c003_f000039", "text": "Harry tore back across the room as the landing light clicked on. He snatched up Hedwig's cage, dashed to the window and passed it out to Ron. He was scrambling back onto the chest of drawers when Uncle Vernon hammered on the unlocked door - and it crashed open.", "begin": 2284.633, "end": 2298.553, "localBegin": 259.96, "localEnd": 273.88}, {"id": "c003_f000040", "text": "For a split second, Uncle Vernon stood framed in the doorway; then he let out a bellow like an angry bull and dived at Harry, grabbing him by the ankle.", "begin": 2298.553, "end": 2307.673, "localBegin": 273.88, "localEnd": 283.0}, {"id": "c003_f000041", "text": "Ron, Fred and George seized Harry's arms and pulled as hard as they could.", "begin": 2307.673, "end": 2312.193, "localBegin": 283.0, "localEnd": 287.52}, {"id": "c003_f000042", "text": "'Petunia!' roared Uncle Vernon. 'He's getting away! HE'S GET- TING AWAY!'", "begin": 2312.193, "end": 2318.513, "localBegin": 287.52, "localEnd": 293.84}, {"id": "c003_f000043", "text": "The Weasleys gave a gigantic tug and Harry's leg slid out of Uncle Vernon's grasp. As soon as Harry was in the car and had slammed the door shut, Ron yelled, 'Put your foot down, Fred!' and the car shot suddenly towards the moon.", "begin": 2318.513, "end": 2332.113, "localBegin": 293.84, "localEnd": 307.44}, {"id": "c003_f000044", "text": "Harry couldn't believe it - he was free. He wound down the window, the night air whipping his hair, and looked back at the shrinking rooftops of Privet Drive. Uncle Vernon, Aunt Petunia and Dudley were all hanging, dumbstruck, out of Harry's window.", "begin": 2332.113, "end": 2348.553, "localBegin": 307.44, "localEnd": 323.88}, {"id": "c003_f000045", "text": "'See you next summer!' Harry yelled.", "begin": 2348.553, "end": 2352.273, "localBegin": 323.88, "localEnd": 327.6}, {"id": "c003_f000046", "text": "The Weasleys roared with laughter and Harry settled back in his seat, grinning from ear to ear.", "begin": 2352.273, "end": 2358.473, "localBegin": 327.6, "localEnd": 333.8}, {"id": "c003_f000047", "text": "'Let Hedwig out,' he told Ron, 'she can fly behind us. She hasn't had a chance to stretch her wings for ages.'", "begin": 2358.473, "end": 2364.593, "localBegin": 333.8, "localEnd": 339.92}, {"id": "c003_f000048", "text": "George handed the hairpin to Ron and a moment later, Hedwig", "begin": 2364.593, "end": 2368.753, "localBegin": 339.92, "localEnd": 344.08}, {"id": "c003_f000049", "text": "had soared joyfully out of the window to glide alongside them like a ghost.", "begin": 2368.753, "end": 2373.953, "localBegin": 344.08, "localEnd": 349.28}, {"id": "c003_f000050", "text": "'So - what's the story, Harry?' said Ron impatiently. 'What's been happening?'", "begin": 2373.953, "end": 2379.553, "localBegin": 349.28, "localEnd": 354.88}, {"id": "c003_f000051", "text": "Harry told them all about Dobby, the warning he'd given Harry and the fiasco of the violet pudding. There was a long shocked silence when he had finished.", "begin": 2379.553, "end": 2389.833, "localBegin": 354.88, "localEnd": 365.16}, {"id": "c003_f000052", "text": "'Very fishy,' said Fred finally.", "begin": 2389.833, "end": 2392.793, "localBegin": 365.16, "localEnd": 368.12}, {"id": "c003_f000053", "text": "'Definitely dodgy,' agreed George. 'So he wouldn't even tell you who's supposed to be plotting all this stuff?'", "begin": 2392.793, "end": 2399.953, "localBegin": 368.12, "localEnd": 375.28}, {"id": "c003_f000054", "text": "'I don't think he could,' said Harry. 'I told you, every time he got close to letting something slip, he started banging his head against the wall.'", "begin": 2399.953, "end": 2407.313, "localBegin": 375.28, "localEnd": 382.64}, {"id": "c003_f000055", "text": "He saw Fred and George look at each other.", "begin": 2407.313, "end": 2411.033, "localBegin": 382.64, "localEnd": 386.36}, {"id": "c003_f000056", "text": "'What, you think he was lying to me?' said Harry.", "begin": 2411.033, "end": 2414.953, "localBegin": 386.36, "localEnd": 390.28}, {"id": "c003_f000057", "text": "'Well,' said Fred, 'put it this way - house-elves have got powerful magic of their own, but they can't usually use it without their masters' permission. I reckon old Dobby was sent to stop you coming back to Hogwarts. Someone's idea of a joke. Can you think of anyone at school with a grudge against you?'", "begin": 2414.953, "end": 2434.033, "localBegin": 390.28, "localEnd": 409.36}, {"id": "c003_f000058", "text": "'Yes,' said Harry and Ron together, instantly.", "begin": 2434.033, "end": 2437.713, "localBegin": 409.36, "localEnd": 413.04}, {"id": "c003_f000059", "text": "'Draco Malfoy,' Harry explained. 'He hates me.'", "begin": 2437.713, "end": 2442.793, "localBegin": 413.04, "localEnd": 418.12}, {"id": "c003_f000060", "text": "'Draco Malfoy?' said George, turning round. 'Not Lucius Malfoy's son?'", "begin": 2442.793, "end": 2448.473, "localBegin": 418.12, "localEnd": 423.8}, {"id": "c003_f000061", "text": "'Must be, it's not a very common name, is it?' said Harry. 'Why?'", "begin": 2448.473, "end": 2453.593, "localBegin": 423.8, "localEnd": 428.92}, {"id": "c003_f000062", "text": "'I've heard Dad talking about him,' said George. 'He was a big supporter of You Know Who.'", "begin": 2453.593, "end": 2459.913, "localBegin": 428.92, "localEnd": 435.24}, {"id": "c003_f000063", "text": "'And when You Know Who disappeared,' said Fred, craning around to look at Harry, 'Lucius Malfoy came back saying he'd never meant any of it. Load of dung - Dad reckons he was right in You Know Who's inner circle.'", "begin": 2459.913, "end": 2474.953, "localBegin": 435.24, "localEnd": 450.28}, {"id": "c003_f000064", "text": "Harry had heard these rumours about Malfoy's family before, and they didn't surprise him at all. Draco Malfoy made Dudley Dursley look like a kind, thoughtful and sensitive boy.", "begin": 2474.953, "end": 2486.393, "localBegin": 450.28, "localEnd": 461.72}, {"id": "c003_f000065", "text": "'I don't know whether the Malfoys own a house-elf ...' said Harry.", "begin": 2486.393, "end": 2490.793, "localBegin": 461.72, "localEnd": 466.12}, {"id": "c003_f000066", "text": "'Well, whoever owns him will be an old wizarding family, and they'll be rich,' said Fred.", "begin": 2490.793, "end": 2496.513, "localBegin": 466.12, "localEnd": 471.84}, {"id": "c003_f000067", "text": "'Yeah, Mum's always wishing we had a house-elf to do the ironing,' said George. 'But all we've got is a lousy old ghoul in the attic", "begin": 2496.513, "end": 2503.473, "localBegin": 471.84, "localEnd": 478.8}, {"id": "c003_f000068", "text": "and gnomes all over the garden. House-elves come with big old manors and castles and places like that, you wouldn't catch one in our house ...'", "begin": 2503.473, "end": 2513.313, "localBegin": 478.8, "localEnd": 488.64}, {"id": "c003_f000069", "text": "Harry was silent. Judging by the fact that Draco Malfoy usually had the best of everything, his family was rolling in wizard gold; he could just see Malfoy strutting around a large manor house. Sending the family servant to stop Harry going back to Hogwarts also sounded exactly like the sort of thing Malfoy would do. Had Harry been stupid to take Dobby seriously?", "begin": 2513.313, "end": 2536.513, "localBegin": 488.64, "localEnd": 511.84}, {"id": "c003_f000070", "text": "'I'm glad we came to get you, anyway,' said Ron. 'I was getting really worried when you didn't answer any of my letters. I thought it was Errol's fault at first -'", "begin": 2536.513, "end": 2544.593, "localBegin": 511.84, "localEnd": 519.92}, {"id": "c003_f000071", "text": "'Who's Errol?'", "begin": 2544.593, "end": 2545.913, "localBegin": 519.92, "localEnd": 521.24}, {"id": "c003_f000072", "text": "'Our owl. He's ancient. It wouldn't be the first time he'd collapsed on a delivery. So then I tried to borrow Hermes -'", "begin": 2545.913, "end": 2553.673, "localBegin": 521.24, "localEnd": 529.0}, {"id": "c003_f000073", "text": "'Who?'", "begin": 2553.673, "end": 2554.033, "localBegin": 529.0, "localEnd": 529.36}, {"id": "c003_f000074", "text": "'The owl Mum and Dad bought Percy when he was made a prefect,' said Fred from the front.", "begin": 2554.033, "end": 2559.233, "localBegin": 529.36, "localEnd": 534.56}, {"id": "c003_f000075", "text": "'But Percy wouldn't lend him to me,' said Ron. 'Said he needed him.'", "begin": 2559.233, "end": 2563.913, "localBegin": 534.56, "localEnd": 539.24}, {"id": "c003_f000076", "text": "'Percy's been acting very oddly this summer,' said George, frowning. 'And he has been sending a lot of letters and spending a load of time shut up in his room ... I mean, there's only so many times you can polish a prefect badge ... You're driving too far west, Fred,' he added, pointing at a compass on
