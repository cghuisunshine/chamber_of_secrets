mile. The Howler was obviously still on his mind.", "begin": 8562.609, "end": 8566.609, "localBegin": 797.48, "localEnd": 801.48}, {"id": "c006_f000070", "text": "'That Lockhart's something, isn't he?' said Justin happily, as they began filling their plant pots with dragon-dung compost. 'Awfully brave chap. Have you read his books? I'd have died of fear if I'd been cornered in a telephone box by a werewolf, but he stayed cool and - zap - just fantastic.", "begin": 8566.609, "end": 8586.129, "localBegin": 801.48, "localEnd": 821.0}, {"id": "c006_f000071", "text": "'My name was down for Eton, you know, I can't tell you how glad I am I came here instead. Of course, mother was slightly disappointed, but since I made her read Lockhart's books I think she's begun to see how useful it'll be to have a fully trained wizard in the family ...'", "begin": 8586.129, "end": 8601.849, "localBegin": 821.0, "localEnd": 836.72}, {"id": "c006_f000072", "text": "After that they didn't have much chance to talk. Their earmuffs were back on and they needed to concentrate on the Mandrakes. Professor Sprout had made it look extremely easy, but it wasn't. The Mandrakes didn't like coming out of the earth, but didn't seem to want to go back into it either. They squirmed, kicked, flailed their sharp little fists and gnashed their teeth; Harry spent ten whole minutes trying to squash a particularly fat one into a pot.", "begin": 8601.849, "end": 8626.449, "localBegin": 836.72, "localEnd": 861.32}, {"id": "c006_f000073", "text": "By the end of the class, Harry, like everyone else, was sweaty, aching and covered in earth. They traipsed back to the castle for a quick wash and then the Gryffindors hurried off to Transfiguration.", "begin": 8626.449, "end": 8639.049, "localBegin": 861.32, "localEnd": 873.92}, {"id": "c006_f000074", "text": "Professor McGonagall's classes were always hard work, but today was especially difficult. Everything Harry had learned last year seemed to have leaked out of his head during the summer. He was supposed to be turning a beetle into a button, but all he managed to do was give his beetle a lot of exercise as it scuttled over the desk top avoiding his wand.", "begin": 8639.049, "end": 8660.489, "localBegin": 873.92, "localEnd": 895.36}, {"id": "c006_f000075", "text": "Ron was having far worse problems. He had patched up his wand with some borrowed Spellotape, but it seemed to be damaged beyond repair. It kept crackling and sparking at odd moments, and every time Ron tried to transfigure his beetle it engulfed him in thick grey smoke which smelled of rotten eggs. Unable to see what he was doing, Ron accidentally squashed his beetle with his elbow and had to ask for a new one. Professor McGonagall wasn't pleased.", "begin": 8660.489, "end": 8689.449, "localBegin": 895.36, "localEnd": 924.32}, {"id": "c006_f000076", "text": "Harry was relieved to hear the lunch bell. His brain felt like a wrung sponge. Everyone filed out of the classroom except him and Ron, who was whacking his wand furiously on the desk.", "begin": 8689.449, "end": 8700.209, "localBegin": 924.32, "localEnd": 935.08}, {"id": "c006_f000077", "text": "'Stupid ... useless ... thing ...'", "begin": 8700.209, "end": 8703.809, "localBegin": 935.08, "localEnd": 938.68}, {"id": "c006_f000078", "text": "'Write home for another one,' Harry suggested, as the wand let off a volley of bangs like a firecracker.", "begin": 8703.809, "end": 8710.209, "localBegin": 938.68, "localEnd": 945.08}, {"id": "c006_f000079", "text": "'Oh yeah, and get another Howler back,' said Ron, stuffing the now hissing wand into his bag. 'It's your own fault your wand got snapped -'", "begin": 8710.209, "end": 8719.169, "localBegin": 945.08, "localEnd": 954.04}, {"id": "c006_f000080", "text": "They went down to lunch, where Ron's mood was not improved by Hermione showing them the handful of perfect coat buttons she had produced in Transfiguration.", "begin": 8719.169, "end": 8730.569, "localBegin": 954.04, "localEnd": 965.44}, {"id": "c006_f000081", "text": "'What've we got this afternoon?' said Harry, hastily changing the subject.", "begin": 8730.569, "end": 8735.209, "localBegin": 965.44, "localEnd": 970.08}, {"id": "c006_f000082", "text": "'Defence Against the Dark Arts,' said Hermione at once.", "begin": 8735.209, "end": 8739.689, "localBegin": 970.08, "localEnd": 974.56}, {"id": "c006_f000083", "text": "'Why,' demanded Ron, seizing her timetable, 'have you outlined all Lockhart's lessons in little hearts?'", "begin": 8739.689, "end": 8745.769, "localBegin": 974.56, "localEnd": 980.64}, {"id": "c006_f000084", "text": "Hermione snatched the timetable back, flushing furiously.", "begin": 8745.769, "end": 8749.769, "localBegin": 980.64, "localEnd": 984.64}, {"id": "c006_f000085", "text": "They finished lunch and went outside into the overcast courtyard. Hermione sat down on a stone step and buried her nose in Voyages with Vampires again. Harry and Ron stood talking about Quidditch for several minutes before Harry became aware that he was being closely watched. Looking up, he saw the very small, mousey-haired boy he'd seen trying on the Sorting Hat last night, staring at Harry as though transfixed. He was clutching what looked like an ordinary Muggle camera, and the moment Harry looked at him, he went bright red.", "begin": 8749.769, "end": 8782.889, "localBegin": 984.64, "localEnd": 1017.76}, {"id": "c006_f000086", "text": "'All right, Harry? I'm - I'm Colin Creevey,' he said breathlessly, taking a tentative step forward. 'I'm in Gryffindor, too. D'you think - would it be all right if - can I have a picture?' he said, raising the camera hopefully.", "begin": 8782.889, "end": 8797.169, "localBegin": 1017.76, "localEnd": 1032.04}, {"id": "c006_f000087", "text": "'A picture?' Harry repeated blankly.", "begin": 8797.169, "end": 8799.529, "localBegin": 1032.04, "localEnd": 1034.4}, {"id": "c006_f000088", "text": "'So I can prove I've met you,' said Colin Creevey eagerly, edging further forwards. 'I know all about you. Everyone's told me. About how you survived when You Know Who tried to kill you and how he disappeared and everything and how you've still got a lightning scar on your forehead' (his eyes raked Harry's hairline), 'and a boy in my dormitory said if I develop the film in the right potion, the pictures'll move.' Colin drew a great shuddering breath of excitement and said, 'It's brilliant here, isn't it? I never knew all the odd stuff I could do was magic till I got the letter from Hogwarts. My dad's a milkman, he couldn't believe it either. So I'm taking loads of pictures to send home to him. And it'd be really good if I had one of you -' he looked imploringly at Harry, 'maybe your friend could take it and I could stand next to you? And then, could you sign it?'", "begin": 8799.529, "end": 8854.009, "localBegin": 1034.4, "localEnd": 1088.88}, {"id": "c006_f000089", "text": "'Signed photos? You're giving out signed photos, Potter?'", "begin": 8854.009, "end": 8859.889, "localBegin": 1088.88, "localEnd": 1094.76}, {"id": "c006_f000090", "text": "Loud and scathing, Draco Malfoy's voice echoed around the courtyard. He had stopped right behind Colin, flanked, as he always was at Hogwarts, by his large and thuggish cronies, Crabbe and Goyle.", "begin": 8859.889, "end": 8872.809, "localBegin": 1094.76, "localEnd": 1107.68}, {"id": "c006_f000091", "text": "'Everyone queue up!' Malfoy roared to the crowd. 'Harry Potter's giving out signed photos!'", "begin": 8872.809, "end": 8879.089, "localBegin": 1107.68, "localEnd": 1113.96}, {"id": "c006_f000092", "text": "'No, I'm not,' said Harry angrily, his fists clenching. 'Shut up, Malfoy.'", "begin": 8879.089, "end": 8884.409, "localBegin": 1113.96, "localEnd": 1119.28}, {"id": "c006_f000093", "text": "'You're just jealous,' piped up Colin, whose entire body was about as thick as Crabbe's neck.", "begin": 8884.409, "end": 8890.329, "localBegin": 1119.28, "localEnd": 1125.2}, {"id": "c006_f000094", "text": "'Jealous?' said Malfoy, who didn't need to shout any more; half the courtyard was listening in. 'Of what? I don't want a foul scar right across my head, thanks. I don't think getting your head cut open makes you that special, myself.'", "begin": 8890.329, "end": 8905.769, "localBegin": 1125.2, "localEnd": 1140.64}, {"id": "c006_f000095", "text": "Crabbe and Goyle were sniggering stupidly.", "begin": 8905.769, "end": 8909.729, "localBegin": 1140.64, "localEnd": 1144.6}, {"id": "c006_f000096", "text": "'Eat slugs, Malfoy,' said Ron angrily. Crabbe stopped laughing and started rubbing his conker-like knuckles in a menacing way.", "begin": 8909.729, "end": 8916.249, "localBegin": 1144.6, "localEnd": 1151.12}, {"id": "c006_f000097", "text": "'Be careful, Weasley,' sneered Malfoy. 'You don't want to start any trouble or your mummy'll have to come and take you away from school.' He put on a shrill, piercing voice. 'If you put another toe out of line -'", "begin": 8916.249, "end": 8930.009, "localBegin": 1151.12, "localEnd": 1164.88}, {"id": "c006_f000098", "text": "A knot of Slytherin fifth-years nearby laughed loudly at this.", "begin": 8930.009, "end": 8934.009, "localBegin": 1164.88, "localEnd": 1168.88}, {"id": "c006_f000099", "text": "'Weasley would like a signed photo, Potter,' smirked Malfoy. 'It'd be worth more than his family's whole house.'", "begin": 8934.009, "end": 8941.849, "localBegin": 1168.88, "localEnd": 1176.72}, {"id": "c006_f000100", "text": "Ron whipped out his Spellotaped wand, but Hermione shut Voyages with Vampires with a snap and whispered, 'Look out!'", "begin": 8941.849, "end": 8947.769, "localBegin": 1176.72, "localEnd": 1182.64}, {"id": "c006_f000101", "text": "'What's all this, what's all this?' Gilderoy Lockhart was striding towards them, his turquoise robes swirling behind him. 'Who's giving out signed photos?'", "begin": 8947.769, "end": 8961.049, "localBegin": 1182.64, "localEnd": 1195.92}, {"id": "c006_f000102", "text": "Harry started to speak but he was cut short as Lockhart flung an arm around his shoulders and thundered jovially, 'Shouldn't have asked! We meet again, Harry!'", "begin": 8961.049, "end": 8970.809, "localBegin": 1195.92, "localEnd": 1205.68}, {"id": "c006_f000103", "text": "Pinned to Lockhart's side and burning with humiliation, Harry saw Malfoy slide smirking back into the crowd.", "begin": 8970.809, "end": 8978.289, "localBegin": 1205.68, "localEnd": 1213.16}, {"id": "c006_f000104", "text": "'Come on then, Mr Creevey,' said Lockhart, beaming at Colin. 'A double portrait, can't say fairer than that, and we'll both sign it for you.'", "begin": 8978.289, "end": 8988.849, "localBegin": 1213.16, "localEnd": 1223.72}, {"id": "c006_f000105", "text": "Colin fumbled for his camera and took the picture as the bell rang behind them, signalling the start of afternoon classes.", "begin": 8988.849, "end": 8996.289, "localBegin": 1223.72, "localEnd": 1231.16}, {"id": "c006_f000106", "text": "'Off you go, move along there,' Lockhart called to the crowd, and he set off back to the castle with Harry, who was wishing he knew a good vanishing spell, still clasped to his side.", "begin": 8996.289, "end": 9009.129, "localBegin": 1231.16, "localEnd": 1244.0}, {"id": "c006_f000107", "text": "'A word to the wise, Harry,' said Lockhart paternally as they entered the building through a side door. 'I covered up for you back there with young Creevey - if he was photographing me, too, your schoolfellows won't think you're setting yourself up so much ...'", "begin": 9009.129, "end": 9025.369, "localBegin": 1244.0, "localEnd": 1260.24}, {"id": "c006_f000108", "text": "Deaf to Harry's stammers, Lockhart swept him down a corridor", "begin": 9025.369, "end": 9028.649, "localBegin": 1260.24, "localEnd": 1263.52}, {"id": "c006_f000109", "text": "lined with staring students and up a staircase.", "begin": 9028.649, "end": 9031.569, "localBegin": 1263.52, "localEnd": 1266.44}, {"id": "c006_f000110", "text": "'Let me just say that handing out signed pictures at this stage of your career isn't sensible - looks a tad bigheaded, Harry, to be frank. There may well come a time when, like me, you'll need to keep a stack handy wherever you go, but -' he gave a little chortle, 'I don't think you're quite there yet.'", "begin": 9031.569, "end": 9052.769, "localBegin": 1266.44, "localEnd": 1287.64}, {"id": "c006_f000111", "text": "They had reached Lockhart's classroom and he let Harry go at last. Harry yanked his robes straight and headed for a seat at the very back of the class, where he busied himself with piling all seven of Lockhart's books in front of him, so that he could avoid looking at the real thing.", "begin": 9052.769, "end": 9069.089, "localBegin": 1287.64, "localEnd": 1303.96}, {"id": "c006_f000112", "text": "The rest of the class came clattering in and Ron and Hermione sat down on either side of Harry.", "begin": 9069.089, "end": 9075.649, "localBegin": 1303.96, "localEnd": 1310.52}, {"id": "c006_f000113", "text": "'You could've fried an egg on your face' said Ron. 'You'd better hope Creevey doesn't meet Ginny, they'll be starting a Harry Potter fan club.'", "begin": 9075.649, "end": 9083.209, "localBegin": 1310.52, "localEnd": 1318.08}, {"id": "c006_f000114", "text": "'Shut up,' snapped Harry. The last thing he needed was for Lockhart to hear the phrase 'Harry Potter fan club'.", "begin": 9083.209, "end": 9090.289, "localBegin": 1318.08, "localEnd": 1325.16}, {"id": "c006_f000115", "text": "When the whole class was seated, Lockhart cleared his throat loudly and silence fell. He reached forward, picked up Neville Longbottom's copy of Travels with Trolls and held it up to show his own, winking portrait on the front.", "begin": 9090.289, "end": 9105.529, "localBegin": 1325.16, "localEnd": 1340.4}, {"id": "c006_f000116", "text": "'Me,' he said, pointing at it and winking as well, 'Gilderoy Lockhart, Order of Merlin, Third Class, Honorary Member of the Dark Force Defence League and five times winner of Witch Weekly's Most-Charming-Smile Award - but I don't talk about that. I didn't get rid of the Bandon Banshee by smiling at her!'", "begin": 9105.529, "end": 9129.089, "localBegin": 1340.4, "localEnd": 1363.96}, {"id": "c006_f000117", "text": "He waited for them to laugh; a few people smiled weakly.", "begin": 9129.089, "end": 9134.409, "localBegin": 1363.96, "localEnd": 1369.28}, {"id": "c006_f000118", "text": "'I see you've all bought a complete set of my books - well done. I thought we'd start today with a little quiz. Nothing to worry about - just to check how well you've read them, how much you've taken in ...'", "begin": 9134.409, "end": 9148.489, "localBegin": 1369.28, "localEnd": 1383.36}, {"id": "c006_f000119", "text": "When he had handed out the test papers he returned to the front of the class and said, 'You have thirty minutes. Start - now!'", "begin": 9148.489, "end": 9157.889, "localBegin": 1383.36, "localEnd": 1392.76}, {"id": "c006_f000120", "text": "Harry looked down at his paper and read:", "begin": 9157.889, "end": 9161.569, "localBegin": 1392.76, "localEnd": 1396.44}, {"id": "c006_f000121", "text": "1. What is Gilderoy Lockhart's favourite colour?", "begin": 9161.569, "end": 9164.969, "localBegin": 1396.44, "localEnd": 1399.84}, {"id": "c006_f000122", "text": "2. What is Gilderoy Lockhart's secret ambition?", "begin": 9164.969, "end": 9168.369, "localBegin": 1399.84, "localEnd": 1403.24}, {"id": "c006_f000123", "text": "3. What, in your opinion, is Gilderoy Lockhart's greatest achievement to date?", "begin": 9168.369, "end": 9173.609, "localBegin": 1403.24, "localEnd": 1408.48}, {"id": "c006_f000124", "text": "On and on it went, over three sides of paper, right down to:", "begin": 9173.609, "end": 9178.929, "localBegin": 1408.48, "localEnd": 1413.8}, {"id": "c006_f000125", "text": "54. When is Gilderoy Lockhart's birthday, and what would his ideal gift be?", "begin": 9178.929, "end": 9185.409, "localBegin": 1413.8, "localEnd": 1420.28}, {"id": "c006_f000126", "text": "Half an hour later, Lockhart collected in the papers and rifled through them in front of the class.", "begin": 9185.409, "end": 9191.529, "localBegin": 1420.28, "localEnd": 1426.4}, {"id": "c006_f000127", "text": "'Tut, tut - hardly any of you remembered that my favourite colour is lilac. I say so in Year with a Yeti. And a few of you need to read Wanderings with Werewolves more carefully - I clearly state in chapter twelve that my ideal birthday gift would be harmony between all magic and non-magic peoples - though I wouldn't say no to a large bottle of Ogden's Old Firewhisky!'", "begin": 9191.529, "end": 9221.329, "localBegin": 1426.4, "localEnd": 1456.2}, {"id": "c006_f000128", "text": "He gave them another roguish wink. Ron was now staring at Lockhart with an expression of disbelief on his face; Seamus Finnigan and Dean Thomas, who were sitting in front, were shaking with silent laughter. Hermione, on the other hand, was listening to Lockhart with rapt attention, and gave a start when he mentioned her name.", "begin": 9221.329, "end": 9240.329, "localBegin": 1456.2, "localEnd": 1475.2}, {"id": "c006_f000129", "text": "'... but Miss Hermione Granger knew my secret ambition is to rid the world of evil and market my own range of hair-care potions - good girl! In fact -' he flipped her paper over, 'full marks! Where is Miss Hermione Granger?'", "begin": 9240.329, "end": 9259.489, "localBegin": 1475.2, "localEnd": 1494.36}, {"id": "c006_f000130", "text": "Hermione raised a trembling hand.", "begin": 9259.489, "end": 9262.369, "localBegin": 1494.36, "localEnd": 1497.24}, {"id": "c006_f000131", "text": "'Excellent!' beamed Lockhart. 'Quite excellent! Take ten points for Gryffindor! And so, to business ...'", "begin": 9262.369, "end": 9271.369, "localBegin": 1497.24, "localEnd": 1506.24}, {"id": "c006_f000132", "text": "He bent down behind his desk and lifted a large, covered cage onto it.", "begin": 9271.369, "end": 9275.729, "localBegin": 1506.24, "localEnd": 1510.6}, {"id": "c006_f000133", "text": "'Now - be warned! It is my job to arm you against the foulest creatures known to wizardkind! You may find yourselves facing your worst fears in this room. Know only that no harm can befall you whilst I am here. All I ask is that you remain calm.'", "begin": 9275.729, "end": 9296.249, "localBegin": 1510.6, "localEnd": 1531.12}, {"id": "c006_f000134", "text": "In spite of himself, Harry leaned around his pile of books for a better look at the cage. Lockhart placed a hand on the cover. Dean and Seamus had stopped laughing now. Neville was cowering in his front-row seat.", "begin": 9296.249, "end": 9309.289, "localBegin": 1531.12, "localEnd": 1544.16}, {"id": "c006_f000135", "text": "'I must ask you not to scream,' said Lockhart in a low voice. 'It might provoke them.'", "begin": 9309.289, "end": 9315.849, "localBegin": 1544.16, "localEnd": 1550.72}, {"id": "c006_f000136", "text": "As the whole class held its breath, Lockhart whipped off the cover.", "begin": 9315.849, "end": 9320.569, "localBegin": 1550.72, "localEnd": 1555.44}, {"id": "c006_f000137", "text": "'Yes,' he said dramatically. 'Freshly caught Cornish pixies.'", "begin": 9320.569, "end": 9326.929, "localBegin": 1555.44, "localEnd": 1561.8}, {"id": "c006_f000138", "text": "Seamus Finnigan couldn't control himself. He let out a snort of laughter which even Lockhart couldn't mistake for a scream of terror.", "begin": 9326.929, "end": 9334.809, "localBegin": 1561.8, "localEnd": 1569.68}, {"id": "c006_f000139", "text": "'Yes?' he smiled at Seamus.", "begin": 9334.809, "end": 9337.489, "localBegin": 1569.68, "localEnd": 1572.36}, {"id": "c006_f000140", "text": "'Well, they're not - they're not very - dangerous, are they?' Seamus choked.", "begin": 9337.489, "end": 9343.169, "localBegin": 1572.36, "localEnd": 1578.04}, {"id": "c006_f000141", "text": "'Don't be so sure!' said Lockhart, waggling a finger annoyingly at Seamus. 'Devilish tricky little blighters they can be!'", "begin": 9343.169, "end": 9352.689, "localBegin": 1578.04, "localEnd": 1587.56}, {"id": "c006_f000142", "text": "The pixies were electric blue and about eight inches high, with pointed faces and voices so shrill it was like listening to a lot of budgies arguing. The moment the cover had been removed, they had started jabbering and rocketing around, rattling the bars and pulling bizarre faces at the people nearest them.", "begin": 9352.689, "end": 9372.689, "localBegin": 1587.56, "localEnd": 1607.56}, {"id": "c006_f000143", "text": "'Right then,' Lockhart said loudly. 'Let's see what you make of them!' And he opened the cage.", "begin": 9372.689, "end": 9380.529, "localBegin": 1607.56, "localEnd": 1615.4}, {"id": "c006_f000144", "text": "It was pandemonium. The pixies shot in every direction like rockets. Two of them seized Neville by the ears and lifted him into the air. Several shot straight through the window, showering the back row with broken glass. The rest proceeded to wreck the classroom more effectively than a rampaging rhino. They grabbed ink bottles and sprayed the class with them, shredded books and papers, tore pictures from the walls, upended the waste bin, grabbed bags and books and threw them out of the smashed window; within minutes, half the class was sheltering under desks and Neville was swinging from the candelabra in the ceiling.", "begin": 9380.529, "end": 9417.129, "localBegin": 1615.4, "localEnd": 1652.0}, {"id": "c006_f000145", "text": "'Come on now, round them up, round them up, they're only pixies ...' Lockhart shouted.", "begin": 9417.129, "end": 9425.129, "localBegin": 1652.0, "localEnd": 1660.0}, {"id": "c006_f000146", "text": "He rolled up his sleeves, brandished his wand and bellowed, 'Peskipiksi Pesternomi!'", "begin": 9425.129, "end": 9432.849, "localBegin": 1660.0, "localEnd": 1667.72}, {"id": "c006_f000147", "text": "It had absolutely no effect; one of the pixies seized Lockhart's wand and threw it out of the window, too. Lockhart gulped and dived under his own desk, narrowly avoiding being squashed by Neville, who fell a second later as the candelabra gave way.", "begin": 9432.849, "end": 9447.929, "localBegin": 1667.72, "localEnd": 1682.8}, {"id": "c006_f000148", "text": "The bell rang and there was a mad rush towards the exit. In the relative calm that followed, Lockhart straightened up, caught sight of Harry, Ron and Hermione, who were almost at the door, and said, 'Well, I'll ask you three to just nip the rest of them back into their cage.' He swept past them and shut the door quickly behind him.", "begin": 9447.929, "end": 9469.889, "localBegin": 1682.8, "localEnd": 1704.76}, {"id": "c006_f000149", "text": "'Can you believe him?' roared Ron, as one of the remaining pixies bit him painfully on the ear.", "begin": 9469.889, "end": 9476.929, "localBegin": 1704.76, "localEnd": 1711.8}, {"id": "c006_f000150", "text": "'He just wants to give us some hands-on experience,' said Hermione, immobilising two pixies at once with a clever Freezing Charm and stuffing them back into their cage.", "begin": 9476.929, "end": 9486.769, "localBegin": 1711.8, "localEnd": 1721.64}, {"id": "c006_f000151", "text": "'Hands on?' said Harry, who was trying to grab a pixie dancing out of reach with its tongue out. 'Hermione, he didn't have a clue what he was doing.'", "begin": 9486.769, "end": 9496.169, "localBegin": 1721.64, "localEnd": 1731.04}, {"id": "c006_f000152", "text": "'Rubbish,' said Hermione. 'You've read his books - look at all those amazing things he's done ...'", "begin": 9496.169, "end": 9500.529, "localBegin": 1731.04, "localEnd": 1735.4}, {"id": "c006_f000153", "text": "'He says he's done,' Ron muttered.", "begin": 9500.529, "end": 9505.529, "localBegin": 1735.4, "localEnd": 1740.4}]}, {"kind": "chapter", "number": 7, "title": "Mudbloods and Murmurs", "audio": "audio/chapter_007.mp3", "start": 9505.567, "end": 11198.567, "duration": 1693.0, "paragraphs": [{"id": "c007_f000001", "text": "Chapter Seven. Mudbloods and Murmurs.", "begin": 9505.567, "end": 9510.087, "localBegin": 0.0, "localEnd": 4.52}, {"id": "c007_f000002", "text": "Harry spent a lot of time over the next few days dodging out of sight whenever he saw Gilderoy Lockhart coming down a corridor. Harder to avoid was Colin Creevey, who seemed to have memorised Harry's timetable. Nothing seemed to give Colin a bigger thrill than to say, 'All right, Harry?' six or seven times a day and hear, 'Hullo, Colin,' back, however exasperated Harry sounded when he said it.", "begin": 9510.087, "end": 9533.487, "localBegin": 4.52, "localEnd": 27.92}, {"id": "c007_f000003", "text": "Hedwig was still angry with Harry about the disastrous car journey and Ron's wand was still malfunctioning, surpassing itself on Friday morning by shooting out of Ron's hand in Charms and hitting tiny old Professor Flitwick squarely between the eyes, creating a large, throbbing green boil where it had struck. So, with one thing and another, Harry was quite glad to reach the weekend. He, Ron and Hermione were planning to visit Hagrid on Saturday morning. Harry, however, was shaken awake several hours earlier than he would have liked by Oliver Wood, captain of the Gryffindor Quidditch team.", "begin": 9533.487, "end": 9570.047, "localBegin": 27.92, "localEnd": 64.48}, {"id": "c007_f000004", "text": "'Whassamatter?' said Harry groggily.", "begin": 9570.047, "end": 9572.407, "localBegin": 64.48, "localEnd": 66.84}, {"id": "c007_f000005", "text": "'Quidditch practice!' said Wood. 'Come on!'", "begin": 9572.407, "end": 9576.247, "localBegin": 66.84, "localEnd": 70.68}, {"id": "c007_f000006", "text": "Harry squinted at the window. There was a thin mist hanging across the pink and gold sky. Now he was awake, he couldn't understand how he could have slept through the racket the birds were making.", "begin": 9576.247, "end": 9586.567, "localBegin": 70.68, "localEnd": 81.0}, {"id": "c007_f000007", "text": "'Oliver,' Harry croaked, 'it's the crack of dawn.'", "begin": 9586.567, "end": 9590.767, "localBegin": 81.0, "localEnd": 85.2}, {"id": "c007_f000008", "text": "'Exactly,' said Wood. He was a tall and burly sixth-year and, at the moment, his eyes were gleaming with a mad enthusiasm. 'It's part of our new training programme. Come on, grab your broom and let's go,' said Wood heartily. 'None of the other teams have started training yet, we're going to be first off the mark this year ...'", "begin": 9590.767, "end": 9610.207, "localBegin": 85.2, "localEnd": 104.64}, {"id": "c007_f000009", "text": "Yawning and shivering slightly, Harry climbed out of bed and", "begin": 9610.207, "end": 9613.247, "localBegin": 104.64, "localEnd": 107.68}, {"id": "c007_f000010", "text": "tried to find his Quidditch robes.", "begin": 9613.247, "end": 9615.807, "localBegin": 107.68, "localEnd": 110.24}, {"id": "c007_f000011", "text": "'Good man,' said Wood. 'Meet you on the pitch in fifteen minutes.'", "begin": 9615.807, "end": 9621.407, "localBegin": 110.24, "localEnd": 115.84}, {"id": "c007_f000012", "text": "When he'd found his scarlet team robes and pulled on his cloak for warmth, Harry scribbled a note to Ron explaining where he'd gone and went down the spiral staircase to the common room, his Nimbus Two Thousand on his shoulder. He had just reached the portrait hole when there was a clatter behind him and Colin Creevey came dashing down the spiral staircase, his camera swinging madly around his neck and something clutched in his hand.", "begin": 9621.407, "end": 9646.127, "localBegin": 115.84, "localEnd": 140.56}, {"id": "c007_f000013", "text": "'I heard someone saying your name on the stairs, Harry! Look what I've got here! I've had it developed, I wanted to show you -'", "begin": 9646.127, "end": 9653.487, "localBegin": 140.56, "localEnd": 147.92}, {"id": "c007_f000014", "text": "Harry looked bemusedly at the photograph Colin was brandishing under his nose.", "begin": 9653.487, "end": 9658.287, "localBegin": 147.92, "localEnd": 152.72}, {"id": "c007_f000015", "text": "A moving, black and white Lockhart was tugging hard on an arm Harry recognised as his own. He was pleased to see that his photographic self was putting up a good fight and refusing to be dragged into view. As Harry watched, Lockhart gave up and slumped, panting, against the white edge of the picture.", "begin": 9658.287, "end": 9675.207, "localBegin": 152.72, "localEnd": 169.64}, {"id": "c007_f000016", "text": "'Will you sign it?' said Colin eagerly.", "begin": 9675.207, "end": 9678.727, "localBegin": 169.64, "localEnd": 173.16}, {"id": "c007_f000017", "text": "'No,' said Harry flatly, glancing around to check that the room was really deserted. 'Sorry, Colin, I'm in a hurry - Quidditch practice.'", "begin": 9678.727, "end": 9687.287, "localBegin": 173.16, "localEnd": 181.72}, {"id": "c007_f000018", "text": "He climbed through the portrait hole.", "begin": 9687.287, "end": 9689.167, "localBegin": 181.72, "localEnd": 183.6}, {"id": "c007_f000019", "text": "'Oh wow! Wait for me! I've never watched a Quidditch game before!'", "begin": 9689.167, "end": 9692.927, "localBegin": 183.6, "localEnd": 187.36}, {"id": "c007_f000020", "text": "Colin scrambled through the hole after him.", "begin": 9692.927, "end": 9696.207, "localBegin": 187.36, "localEnd": 190.64}, {"id": "c007_f000021", "text": "'It'll be really boring,' Harry said quickly, but Colin ignored him, his face shining with excitement.", "begin": 9696.207, "end": 9702.167, "localBegin": 190.64, "localEnd": 196.6}, {"id": "c007_f000022", "text": "'You were the youngest house player in a hundred years, weren't you, Harry? Weren't you?' said Colin, trotting alongside him. 'You must be brilliant. I've never flown. Is it easy? Is that your own broom? Is that the best one there is?'", "begin": 9702.167, "end": 9716.527, "localBegin": 196.6, "localEnd": 210.96}, {"id": "c007_f000023", "text": "Harry didn't know how to get rid of him. It was like having an extremely talkative shadow.", "begin": 9716.527, "end": 9722.007, "localBegin": 210.96, "localEnd": 216.44}, {"id": "c007_f000024", "text": "'I don't really understand Quidditch,' said Colin breathlessly. 'Is it true there are four balls? And two of them fly round trying to knock people off their brooms?'", "begin": 9722.007, "end": 9731.967, "localBegin": 216.44, "localEnd": 226.4}, {"id": "c007_f000025", "text": "'Yes,' said Harry heavily, resigned to explaining the complicated", "begin": 9731.967, "end": 9736.367, "localBegin": 226.4, "localEnd": 230.8}, {"id": "c007_f000026", "text": "rules of Quidditch. 'They're called Bludgers. There are two Beaters on each team, who carry clubs to beat the Bludgers away from their side. Fred and George Weasley are the Gryffindor Beaters.'", "begin": 9736.367, "end": 9747.767, "localBegin": 230.8, "localEnd": 242.2}, {"id": "c007_f000027", "text": "'And what are the other balls for?' Colin asked, tripping down a couple of steps because he was gazing open-mouthed at Harry.", "begin": 9747.767, "end": 9754.647, "localBegin": 242.2, "localEnd": 249.08}, {"id": "c007_f000028", "text": "'Well, the Quaffle - that's the biggish red one - is the one that scores goals. Three Chasers on each team throw the Quaffle to each other and try and get it through the goalposts at the end of the pitch - they're three long poles with hoops on the end.'", "begin": 9754.647, "end": 9769.127, "localBegin": 249.08, "localEnd": 263.56}, {"id": "c007_f000029", "text": "'And the fourth ball -'", "begin": 9769.127, "end": 9770.607, "localBegin": 263.56, "localEnd": 265.04}, {"id": "c007_f000030", "text": "'- is the Golden Snitch,' said Harry, 'and it's very small, very fast and difficult to catch. But that's what the Seeker's got to do, because a game of Quidditch doesn't end until the Snitch has been caught. And whichever team's Seeker gets the Snitch earns his team an extra hundred and fifty points.'", "begin": 9770.607, "end": 9788.087, "localBegin": 265.04, "localEnd": 282.52}, {"id": "c007_f000031", "text": "'And you're Gryffindor Seeker, aren't you?' said Colin in awe.", "begin": 9788.087, "end": 9793.127, "localBegin": 282.52, "localEnd": 287.56}, {"id": "c007_f000032", "text": "'Yes,' said Harry, as they left the castle and started across the dew-drenched grass. 'And there's the Keeper, too. He guards the goalposts. That's it, really.'", "begin": 9793.127, "end": 9804.687, "localBegin": 287.56, "localEnd": 299.12}, {"id": "c007_f000033", "text": "But Colin didn't stop questioning Harry all the way down the sloping lawns to the Quidditch pitch, and Harry only shook him off when he reached the changing rooms. Colin called after him in a piping voice, 'I'll go and get a good seat, Harry!' and hurried off to the stands.", "begin": 9804.687, "end": 9820.767, "localBegin": 299.12, "localEnd": 315.2}, {"id": "c007_f000034", "text": "The rest of the Gryffindor team were already in the changing room. Wood was the only person who looked truly awake. Fred and George Weasley were sitting, puffy-eyed and tousle-haired, next to fourth-year Alicia Spinnet, who seemed to be nodding off against the wall behind her. Her fellow Chasers, Katie Bell and Angelina Johnson, were yawning, side by side, opposite them.", "begin": 9820.767, "end": 9842.167, "localBegin": 315.2, "localEnd": 336.6}, {"id": "c007_f000035", "text": "'There you are, Harry, what kept you?' said Wood briskly. 'Now, I wanted a quick talk with you all before we actually get onto the pitch, because I spent the summer devising a whole new training programme, which I really think will make all the difference ...'", "begin": 9842.167, "end": 9856.487, "localBegin": 336.6, "localEnd": 350.92}, {"id": "c007_f000036", "text": "Wood was holding up a large diagram of a Quidditch pitch, on which were drawn many lines, arrows and crosses in differentcoloured inks. He took out his wand, tapped the board and the arrows began to wiggle over the diagram like caterpillars. As Wood launched into a speech about his new tactics, Fred Weasley's head drooped right onto Alicia Spinnet's shoulder and", "begin": 9856.487, "end": 9876.847, "localBegin": 350.92, "localEnd": 371.28}, {"id": "c007_f000037", "text": "he began to snore.", "begin": 9876.847, "end": 9879.287, "localBegin": 371.28, "localEnd": 373.72}, {"id": "c007_f000038", "text": "The first board took nearly twenty minutes to explain, but there was another board under that, and a third under that one. Harry sank into a stupor as Wood droned on and on.", "begin": 9879.287, "end": 9891.127, "localBegin": 373.72, "localEnd": 385.56}, {"id": "c007_f000039", "text": "'So,' said Wood, at long last, jerking Harry from a wistful fantasy about what he could be eating for breakfast at this very moment up at the castle, 'is that clear? Any questions?'", "begin": 9891.127, "end": 9902.927, "localBegin": 385.56, "localEnd": 397.36}, {"id": "c007_f000040", "text": "'I've got a question, Oliver,' said George, who had woken with a start. 'Why couldn't you have told us all this yesterday when we were awake?'", "begin": 9902.927, "end": 9911.807, "localBegin": 397.36, "localEnd": 406.24}, {"id": "c007_f000041", "text": "Wood wasn't pleased.", "begin": 9911.807, "end": 9913.167, "localBegin": 406.24, "localEnd": 407.6}, {"id": "c007_f000042", "text": "'Now, listen here, you lot,' he said, glowering at them all, 'we should have won the Quidditch Cup last year. We're easily the best team. But unfortunately, owing to circumstances beyond our control ...'", "begin": 9913.167, "end": 9926.207, "localBegin": 407.6, "localEnd": 420.64}, {"id": "c007_f000043", "text": "Harry shifted guiltily in his seat. He had been unconscious in the hospital wing for the final match of the previous year, meaning that Gryffindor had been a player short and had suffered their worst defeat in three hundred years.", "begin": 9926.207, "end": 9939.767, "localBegin": 420.64, "localEnd": 434.2}, {"id": "c007_f000044", "text": "Wood took a moment to regain control of himself. Their last defeat was clearly still torturing him.", "begin": 9939.767, "end": 9946.327, "localBegin": 434.2, "localEnd": 440.76}, {"id": "c007_f000045", "text": "'So, this year, we train harder than ever before ... OK, let's go and put our new theories into practice!' Wood shouted, seizing his broomstick and leading the way out of the changing rooms. Stiff-legged and still yawning, his team followed.", "begin": 9946.327, "end": 9960.847, "localBegin": 440.76, "localEnd": 455.28}, {"id": "c007_f000046", "text": "They had been in the changing room so long that the sun was up properly now, although remnants of mist hung over the grass in the stadium. As Harry walked onto the pitch, he saw Ron and Hermione sitting in the stands.", "begin": 9960.847, "end": 9973.327, "localBegin": 455.28, "localEnd": 467.76}, {"id": "c007_f000047", "text": "'Aren't you finished yet?' called Ron incredulously.", "begin": 9973.327, "end": 9977.007, "localBegin": 467.76, "localEnd": 471.44}, {"id": "c007_f000048", "text": "'Haven't even started,' said Harry, looking jealously at the toast and marmalade Ron and Hermione had brought out of the Great Hall. 'Wood's been teaching us new moves.'", "begin": 9977.007, "end": 9986.927, "localBegin": 471.44, "localEnd": 481.36}, {"id": "c007_f000049", "text": "He mounted his broomstick and kicked at the ground, soaring up into the air. The cool morning air whipped his face, waking him far more effectively than Wood's long talk. It felt wonderful to be back on the Quidditch pitch. He soared right around the stadium at full speed, racing Fred and George.", "begin": 9986.927, "end": 10005.647, "localBegin": 481.36, "localEnd": 500.08}, {"id": "c007_f000050", "text": "'What's that funny clicking noise?' called Fred, as they hurtled around the corner.", "begin": 10005.647, "end": 10010.007, "localBegin": 500.08, "localEnd": 504.44}, {"id": "c007_f000051", "text": "Harry looked into the stands. Colin was sitting in one of the highest seats, his camera raised, taking picture after picture, the sound strangely magnified in the deserted stadium.", "begin": 10010.007, "end": 10021.727, "localBegin": 504.44, "localEnd": 516.16}, {"id": "c007_f000052", "text": "'Look this way, Harry! This way!' he cried shrilly.", "begin": 10021.727, "end": 10025.607, "localBegin": 516.16, "localEnd": 520.04}, {"id": "c007_f000053", "text": "'Who's that?' said Fred.", "begin": 10025.607, "end": 10027.727, "localBegin": 520.04, "localEnd": 522.16}, {"id": "c007_f000054", "text": "'No idea,' Harry lied, putting on a spurt of speed that took him as far away as possible from Colin.", "begin": 10027.727, "end": 10034.007, "localBegin": 522.16, "localEnd": 528.44}, {"id": "c007_f000055", "text": "'What's going on?' said Wood, frowning, as he skimmed through the air towards them. 'Why's that first-year taking pictures? I don't like it. He could be a Slytherin spy, trying to find out about our new training programme.'", "begin": 10034.007, "end": 10045.727, "localBegin": 528.44, "localEnd": 540.16}, {"id": "c007_f000056", "text": "'He's in Gryffindor,' said Harry quickly.", "begin": 10045.727, "end": 10048.367, "localBegin": 540.16, "localEnd": 542.8}, {"id": "c007_f000057", "text": "'And the Slytherins don't need a spy, Oliver,' said George.", "begin": 10048.367, "end": 10051.687, "localBegin": 542.8, "localEnd": 546.12}, {"id": "c007_f000058", "text": "'What makes you say that?' said Wood testily.", "begin": 10051.687, "end": 10054.327, "localBegin": 546.12, "localEnd": 548.76}, {"id": "c007_f000059", "text": "'Because they're here in person,' said George, pointing.", "begin": 10054.327, "end": 10058.407, "localBegin": 548.76, "localEnd": 552.84}, {"id": "c007_f000060", "text": "Several people in green robes were walking onto the pitch, broomsticks in their hands.", "begin": 10058.407, "end": 10063.647, "localBegin": 552.84, "localEnd": 558.08}, {"id": "c007_f000061", "text": "'I don't believe it!' Wood hissed in outrage. 'I booked the pitch for today! We'll see about this!'", "begin": 10063.647, "end": 10071.047, "localBegin": 558.08, "localEnd": 565.48}, {"id": "c007_f000062", "text": "Wood shot towards the ground, landing rather harder than he meant to in his anger, staggering slightly as he dismounted. Harry, Fred and George followed.", "begin": 10071.047, "end": 10080.367, "localBegin": 565.48, "localEnd": 574.8}, {"id": "c007_f000063", "text": "'Flint!' Wood bellowed at the Slytherin captain. 'This is our practice time! We got up specially! You can clear off now!'", "begin": 10080.367, "end": 10089.447, "localBegin": 574.8, "localEnd": 583.88}, {"id": "c007_f000064", "text": "Marcus Flint was even larger than Wood. He had a look of trollish cunning on his face as he replied, 'Plenty of room for all of us, Wood.'", "begin": 10089.447, "end": 10098.847, "localBegin": 583.88, "localEnd": 593.28}, {"id": "c007_f000065", "text": "Angelina, Alicia and Katie had come over, too. There were no girls on the Slytherin team - who stood, shoulder to shoulder, facing the Gryffindors, leering to a man.", "begin": 10098.847, "end": 10109.127, "localBegin": 593.28, "localEnd": 603.56}, {"id": "c007_f000066", "text": "'But I booked the pitch!' said Wood, positively spitting with rage. 'I booked it!'", "begin": 10109.127, "end": 10115.367, "localBegin": 603.56, "localEnd": 609.8}, {"id": "c007_f000067", "text": "'Ah,' said Flint, 'but I've got a specially signed note here from Professor Snape. I, Professor S. Snape, give the Slytherin team permission to practise today on the Quidditch pitch, owing to the need to train their new Seeker.'", "begin": 10115.367, "end": 10129.087, "localBegin": 609.8, "localEnd": 623.52}, {"id": "c007_f000068", "text": "'You've got a new Seeker?' said Wood, distracted. 'Where?'", "begin": 10129.087, "end": 10134.287, "localBegin": 623.52, "localEnd": 628.72}, {"id": "c007_f000069", "text": "And from behind the six large figures before them came a seventh, smaller boy, smirking all over his pale, pointed face. It was Draco Malfoy.", "begin": 10134.287, "end": 10144.887, "localBegin": 628.72, "localEnd": 639.32}, {"id": "c007_f000070", "text": "'Aren't you Lucius Malfoy's son?' said Fred, looking at Malfoy with dislike.", "begin": 10144.887, "end": 10149.967, "localBegin": 639.32, "localEnd": 644.4}, {"id": "c007_f000071", "text": "'Funny you should mention Draco's father,' said Flint, as the whole Slytherin team smiled still more broadly. 'Let me show you the generous gift he's made to the Slytherin team.'", "begin": 10149.967, "end": 10162.407, "localBegin": 644.4, "localEnd": 656.84}, {"id": "c007_f000072", "text": "All seven of them held out their broomsticks. Seven highly polished, brand-new handles and seven sets of fine gold lettering spelling the words 'Nimbus Two Thousand and One' gleamed under the Gryffindors' noses in the early-morning sun.", "begin": 10162.407, "end": 10175.247, "localBegin": 656.84, "localEnd": 669.68}, {"id": "c007_f000073", "text": "'Very latest model. Only came out last month,' said Flint carelessly, flicking a speck of dust from the end of his own. 'I believe it outstrips the old Two Thousand series by a considerable amount. As for the old Cleansweeps,' he smiled nastily at Fred and George, who were both clutching Cleansweep Fives, 'sweeps the board with them.'", "begin": 10175.247, "end": 10198.887, "localBegin": 669.68, "localEnd": 693.32}, {"id": "c007_f000074", "text": "None of the Gryffindor team could think of anything to say for a moment. Malfoy was smirking so broadly his cold eyes were reduced to slits.", "begin": 10198.887, "end": 10207.207, "localBegin": 693.32, "localEnd": 701.64}, {"id": "c007_f000075", "text": "'Oh look,' said Flint. 'A pitch invasion.'", "begin": 10207.207, "end": 10211.727, "localBegin": 701.64, "localEnd": 706.16}, {"id": "c007_f000076", "text": "Ron and Hermione were crossing the grass to see what was going on.", "begin": 10211.727, "end": 10215.567, "localBegin": 706.16, "localEnd": 710.0}, {"id": "c007_f000077", "text": "'What's happening?' Ron asked Harry. 'Why aren't you playing? And what's he doing here?'", "begin": 10215.567, "end": 10219.847, "localBegin": 710.0, "localEnd": 714.28}, {"id": "c007_f000078", "text": "He was looking at Malfoy, taking in his Slytherin Quidditch robes.", "begin": 10219.847, "end": 10225.287, "localBegin": 714.28, "localEnd": 719.72}, {"id": "c007_f000079", "text": "'I'm the new Slytherin Seeker, Weasley,' said Malfoy, smugly. 'Everyone's just been admiring the brooms my father's bought our team.'", "begin": 10225.287, "end": 10235.447, "localBegin": 719.72, "localEnd": 729.88}, {"id": "c007_f000080", "text": "Ron gaped, open-mouthed, at the seven superb broomsticks in front of him.", "begin": 10235.447, "end": 10240.447, "localBegin": 729.88, "localEnd": 734.88}, {"id": "c007_f000081", "text": "'Good, aren't they?' said Malfoy smoothly. 'But perhaps the Gryffindor team will be able to raise some gold and get new brooms, too. You could raffle off those Cleansweep Fives, I expect a museum would bid for them.'", "begin": 10240.447, "end": 10253.567, "localBegin": 734.88, "localEnd": 748.0}, {"id": "c007_f000082", "text": "The Slytherin team howled with laughter.", "begin": 10253.567, "end": 10257.007, "localBegin": 748.0, "localEnd": 751.44}, {"id": "c007_f000083", "text": "'At least no one on the Gryffindor team had to buy their way in,' said Hermione sharply. 'They got in on pure talent.'", "begin": 10257.007, "end": 10263.287, "localBegin": 751.44, "localEnd": 757.72}, {"id": "c007_f000084", "text": "The smug look on Malfoy's face flickered.", "begin": 10263.287, "end": 10266.607, "localBegin": 757.72, "localEnd": 761.04}, {"id": "c007_f000085", "text": "'No one asked your opinion, you filthy little Mudblood,' he spat.", "begin": 10266.607, "end": 10272.687, "localBegin": 761.04, "localEnd": 767.12}, {"id": "c007_f000086", "text": "Harry knew at once that Malfoy had said something really bad because there was an instant uproar at his words. Flint had to dive in front of Malfoy to stop Fred and George jumping on him, Alicia shrieked, 'How dare you!' and Ron plunged his hand into his robes, pulled out his wand, yelling, 'You'll pay for that one, Malfoy!' and pointed it furiously under Flint's arm at Malfoy's face.", "begin": 10272.687, "end": 10297.567, "localBegin": 767.12, "localEnd": 792.0}, {"id": "c007_f000087", "text": "A loud bang echoed around the stadium and a jet of green light shot out of the wrong end of Ron's wand, hitting him in the stomach and sending him reeling backwards onto the grass.", "begin": 10297.567, "end": 10308.207, "localBegin": 792.0, "localEnd": 802.64}, {"id": "c007_f000088", "text": "'Ron! Ron! Are you all right?' squealed Hermione.", "begin": 10308.207, "end": 10311.607, "localBegin": 802.64, "localEnd": 806.04}, {"id": "c007_f000089", "text": "Ron opened his mouth to speak, but no words came out. Instead he gave an almighty belch and several slugs dribbled out of his mouth onto his lap.", "begin": 10311.607, "end": 10323.127, "localBegin": 806.04, "localEnd": 817.56}, {"id": "c007_f000090", "text": "The Slytherin team were paralysed with laughter. Flint was doubled up, hanging on to his new broomstick for support. Malfoy was on all fours, banging the ground with his fist. The Gryffindors were gathered around Ron, who kept belching large, glistening slugs. Nobody seemed to want to touch him.", "begin": 10323.127, "end": 10341.127, "localBegin": 817.56, "localEnd": 835.56}, {"id": "c007_f000091", "text": "'We'd better get him to Hagrid's, it's nearest,' said Harry to Hermione, who nodded bravely, and the pair of them pulled Ron up by the arms.", "begin": 10341.127, "end": 10348.367, "localBegin": 835.56, "localEnd": 842.8}, {"id": "c007_f000092", "text": "'What happened, Harry? What happened? Is he ill? But you can cure him, can't you?' Colin had run down from his seat and was now dancing alongside them as they left the pitch. Ron gave a huge heave and more slugs dribbled down his front.", "begin": 10348.367, "end": 10362.927, "localBegin": 842.8, "localEnd": 857.36}, {"id": "c007_f000093", "text": "'Oooh,' said Colin, fascinated and raising his camera. 'Can you hold him still, Harry?'", "begin": 10362.927, "end": 10368.767, "localBegin": 857.36, "localEnd": 863.2}, {"id": "c007_f000094", "text": "'Get out of the way, Colin!' said Harry angrily. He and Hermione supported Ron out of the stadium and across the grounds towards the edge of the Forest.", "begin": 10368.767, "end": 10377.967, "localBegin": 863.2, "localEnd": 872.4}, {"id": "c007_f000095", "text": "'Nearly there, Ron,' said Hermione, as the gamekeeper's cabin came into view. 'You'll be all right in a minute ... almost there ...'", "begin": 10377.967, "end": 10385.607, "localBegin": 872.4, "localEnd": 880.04}, {"id": "c007_f000096", "text": "They were within twenty feet of Hagrid's house when the front door opened, but it wasn't Hagrid who emerged. Gilderoy Lockhart, wearing robes of palest mauve today, came striding out.", "begin": 10385.607, "end": 10398.087, "localBegin": 880.04, "localEnd": 892.52}, {"id": "c007_f000097", "text": "'Quick, behind here,' Harry hissed, dragging Ron behind a nearby bush. Hermione followed, somewhat reluctantly.", "begin": 10398.087, "end": 10406.767, "localBegin": 892.52, "localEnd": 901.2}, {"id": "c007_f000098", "text": "'It's a simple matter if you know what you're doing!' Lockhart was saying loudly to Hagrid. 'If you need help, you know where I", "begin": 10406.767, "end": 10414.807, "localBegin": 901.2, "localEnd": 909.24}, {"id": "c007_f000099", "text": "am! I'll let you have a copy of my book - I'm surprised you haven't already got one. I'll sign one tonight and send it over. Well, goodbye!' And he strode away towards the castle.", "begin": 10414.807, "end": 10425.887, "localBegin": 909.24, "localEnd": 920.32}, {"id": "c007_f000100", "text": "Harry waited until Lockhart was out of sight, then pulled Ron out of the bush and up to Hagrid's front door. They knocked urgently.", "begin": 10425.887, "end": 10434.247, "localBegin": 920.32, "localEnd": 928.68}, {"id": "c007_f000101", "text": "Hagrid appeared at once, looking very grumpy, but his expression brightened when he saw who it was.", "begin": 10434.247, "end": 10439.487, "localBegin": 928.68, "localEnd": 933.92}, {"id": "c007_f000102", "text": "'Bin wonderin' when you'd come ter see me - come in, come in - thought you mighta bin Professor Lockhart back again.'", "begin": 10439.487, "end": 10447.807, "localBegin": 933.92, "localEnd": 942.24}, {"id": "c007_f000103", "text": "Harry and Hermione supported Ron over the threshold, into the one-roomed cabin, which had an enormous bed in one corner, a fire crackling merrily in another. Hagrid didn't seem perturbed by Ron's slug problem, which Harry hastily explained as he lowered Ron into a chair.", "begin": 10447.807, "end": 10463.647, "localBegin": 942.24, "localEnd": 958.08}, {"id": "c007_f000104", "text": "'Better out than in,' he said cheerfully, plonking a large copper basin in front of him. 'Get 'em all up, Ron.'", "begin": 10463.647, "end": 10470.967, "localBegin": 958.08, "localEnd": 965.4}, {"id": "c007_f000105", "text": "'I don't think there's anything to do except wait for it to stop,' said Hermione anxiously, watching Ron bend over the basin. 'That's a difficult curse to work at the best of times, but with a broken wand ...'", "begin": 10470.967, "end": 10483.487, "localBegin": 965.4, "localEnd": 977.92}, {"id": "c007_f000106", "text": "Hagrid was bustling around, making them tea. His boarhound, Fang, was slobbering over Harry.", "begin": 10483.487, "end": 10489.567, "localBegin": 977.92, "localEnd": 984.0}, {"id": "c007_f000107", "text": "'What did Lockhart want with you, Hagrid?' Harry asked, scratching Fang's ears.", "begin": 10489.567, "end": 10494.847, "localBegin": 984.0, "localEnd": 989.28}, {"id": "c007_f000108", "text": "'Givin' me advice on gettin' kelpies out of a well,' growled Hagrid, moving a half-plucked rooster off his scrubbed table and setting down the teapot. 'Like I don' know. An' bangin' on about some Banshee he banished. If one word of it was true, I'll eat my kettle.'", "begin": 10494.847, "end": 10512.287, "localBegin": 989.28, "localEnd": 1006.72}, {"id": "c007_f000109", "text": "It was most unlike Hagrid to criticise a Hogwarts teacher and Harry looked at him in surprise. Hermione, however, said in a voice somewhat higher than usual, 'I think you're being a bit unfair. Professor Dumbledore obviously thought he was the best man for the job -'", "begin": 10512.287, "end": 10527.447, "localBegin": 1006.72, "localEnd": 1021.88}, {"id": "c007_f000110", "text": "'He was the on'y man for the job,' said Hagrid, offering them a plate of treacle toffee, while Ron coughed squelchily into his basin. 'An' I mean the on'y one. Gettin' very difficult ter find anyone fer the Dark Arts job. People aren't too keen ter take it on, see. They're startin' ter think it's jinxed. No one's lasted long fer a", "begin": 10527.447, "end": 10548.527, "localBegin": 1021.88, "localEnd": 1042.96}, {"id": "c007_f000111", "text": "while now. So tell me,' said Hagrid, jerking his head at Ron, 'who was he tryin' ter curse?'", "begin": 10548.527, "end": 10555.687, "localBegin": 1042.96, "localEnd": 1050.12}, {"id": "c007_f000112", "text": "'Malfoy called Hermione something. It must've been really bad, because everyone went mad.'", "begin": 10555.687, "end": 10561.007, "localBegin": 1050.12, "localEnd": 1055.44}, {"id": "c007_f000113", "text": "'It was bad,' said Ron hoarsely, emerging over the table top, looking pale and sweaty. 'Malfoy called her \"Mudblood\", Hagrid -'", "begin": 10561.007, "end": 10569.607, "localBegin": 1055.44, "localEnd": 1064.04}, {"id": "c007_f000114", "text": "Ron dived out of sight again as a fresh wave of slugs made their appearance. Hagrid looked outraged.", "begin": 10569.607, "end": 10576.687, "localBegin": 1064.04, "localEnd": 1071.12}, {"id": "c007_f000115", "text": "'He didn'!' he growled at Hermione.", "begin": 10576.687, "end": 10579.967, "localBegin": 1071.12, "localEnd": 1074.4}, {"id": "c007_f000116", "text": "'He did,' she said. 'But I don't know what it means. I could tell it was really rude, of course ...'", "begin": 10579.967, "end": 10586.447, "localBegin": 1074.4, "localEnd": 1080.88}, {"id": "c007_f000117", "text": "'It's about the most insulting thing he could think of,' gasped Ron, coming back up. 'Mudblood's a really foul name for someone who was Muggle-born - you know, non-magic parents. There are some wizards - like Malfoy's family - who think they're better than everyone else because they're what people call pure-blood.' He gave a small burp, and a single slug fell into his outstretched hand. He threw it into the basin and continued, 'I mean, the rest of us know it doesn't make any difference at all. Look at Neville Longbottom - he's pure-blood and he can hardly stand a cauldron the right way up.'", "begin": 10586.447, "end": 10623.007, "localBegin": 1080.88, "localEnd": 1117.44}, {"id": "c007_f000118", "text": "'An' they haven't invented a spell our Hermione can't do,' said Hagrid proudly, making Hermione go a brilliant shade of magenta.", "begin": 10623.007, "end": 10631.927, "localBegin": 1117.44, "localEnd": 1126.36}, {"id": "c007_f000119", "text": "'It's a disgusting thing to call someone,' said Ron, wiping his sweaty brow with a shaking hand. 'Dirty blood, see. Common blood. It's mad. Most wizards these days are half-blood anyway. If we hadn't married Muggles we'd've died out.'", "begin": 10631.927, "end": 10648.407, "localBegin": 1126.36, "localEnd": 1142.84}, {"id": "c007_f000120", "text": "He retched and ducked out of sight again.", "begin": 10648.407, "end": 10651.207, "localBegin": 1142.84, "localEnd": 1145.64}, {"id": "c007_f000121", "text": "'Well, I don' blame yeh fer tryin' ter curse him, Ron,' said Hagrid loudly over the thuds of more slugs hitting the basin. 'Bu' maybe it was a good thing yer wand backfired. 'Spect Lucius Malfoy would've come marchin' up ter school if yeh'd cursed his son. Least yer not in trouble.'", "begin": 10651.207, "end": 10667.727, "localBegin": 1145.64, "localEnd": 1162.16}, {"id": "c007_f000122", "text": "Harry would have pointed out that trouble didn't come much worse than having slugs pouring out of your mouth, but he couldn't; Hagrid's treacle toffee had cemented his jaws together.", "begin": 10667.727, "end": 10678.607, "localBegin": 1162.16, "localEnd": 1173.04}, {"id": "c007_f000123", "text": "'Harry,' said Hagrid suddenly, as though struck by a sudden thought, 'gotta bone ter pick with yeh. I've heard you've bin givin' out signed photos. How come I haven't got one?'", "begin": 10678.607, "end": 10689.287, "localBegin": 1173.04, "localEnd": 1183.72}, {"id": "c007_f000124", "text": "Furious, Harry wrenched his teeth apart.", "begin": 10689.287, "end": 10692.407, "localBegin": 1183.72, "localEnd": 1186.84}, {"id": "c007_f000125", "text": "'I have not been giving out signed photos,' he said hotly. 'If Lockhart's still putting that about -'", "begin": 10692.407, "end": 10698.447, "localBegin": 1186.84, "localEnd": 1192.88}, {"id": "c007_f000126", "text": "But then he saw that Hagrid was laughing.", "begin": 10698.447, "end": 10701.167, "localBegin": 1192.88, "localEnd": 1195.6}, {"id": "c007_f000127", "text": "'I'm on'y jokin',' he said, patting Harry genially on the back and sending him, face first, into the table. 'I knew yeh hadn't really. I told Lockhart yeh didn' need teh. Yer more famous than him without tryin'.'", "begin": 10701.167, "end": 10715.727, "localBegin": 1195.6, "localEnd": 1210.16}, {"id": "c007_f000128", "text": "'Bet he didn't like that,' said Harry, sitting up and rubbing his chin.", "begin": 10715.727, "end": 10719.847, "localBegin": 1210.16, "localEnd": 1214.28}, {"id": "c007_f000129", "text": "'Don' think he did,' said Hagrid, his eyes twinkling. 'An' then I told him I'd never read one o' his books an' he decided ter go. Treacle toffee, Ron?' he added, as Ron re-appeared.", "begin": 10719.847, "end": 10731.247, "localBegin": 1214.28, "localEnd": 1225.68}, {"id": "c007_f000130", "text": "'No thanks,' said Ron weakly. 'Better not risk it.'", "begin": 10731.247, "end": 10735.287, "localBegin": 1225.68, "localEnd": 1229.72}, {"id": "c007_f000131", "text": "'Come an' see what I've bin growin',' said Hagrid, as Harry and Hermione finished the last of their tea.", "begin": 10735.287, "end": 10742.447, "localBegin": 1229.72, "localEnd": 1236.88}, {"id": "c007_f000132", "text": "In the small vegetable patch behind Hagrid's house were a dozen of the largest pumpkins Harry had ever seen. Each was the size of a large boulder.", "begin": 10742.447, "end": 10751.207, "localBegin": 1236.88, "localEnd": 1245.64}, {"id": "c007_f000133", "text": "'Gettin' on well, aren't they?' said Hagrid happily. 'Fer the Hallowe'en feast ... should be big enough by then.'", "begin": 10751.207, "end": 10759.607, "localBegin": 1245.64, "localEnd": 1254.04}, {"id": "c007_f000134", "text": "'What've you been feeding them?' said Harry.", "begin": 10759.607, "end": 10762.767, "localBegin": 1254.04, "localEnd": 1257.2}, {"id": "c007_f000135", "text": "Hagrid looked over his shoulder to check that they were alone.", "begin": 10762.767, "end": 10766.127, "localBegin": 1257.2, "localEnd": 1260.56}, {"id": "c007_f000136", "text": "'Well, I've bin givin' them - you know - a bit o' help.'", "begin": 10766.127, "end": 10770.607, "localBegin": 1260.56, "localEnd": 1265.04}, {"id": "c007_f000137", "text": "Harry noticed Hagrid's flowery pink umbrella leaning against the back wall of the cabin. Harry had had reason to believe before now that this umbrella was not all it looked; in fact, he had the strong impression that Hagrid's old school wand was concealed inside it. Hagrid wasn't supposed to use magic. He had been expelled from Hogwarts in his third year, but Harry had never found out why - any mention of the matter and Hagrid would clear his throat loudly and become mysteriously deaf until the subject was changed.", "begin": 10770.607, "end": 10801.487, "localBegin": 1265.04, "localEnd": 1295.92}, {"id": "c007_f000138", "text": "'An Engorgement Charm, I suppose?' said Hermione, halfway between disapproval and amusement. 'Well, you've done a good job on them.'", "begin": 10801.487, "end": 10810.727, "localBegin": 1295.92, "localEnd": 1305.16}, {"id": "c007_f000139", "text": "'That's what yer little sister said,' said Hagrid, nodding at Ron. 'Met her jus' yesterday.' Hagrid looked sideways at Harry, his beard twitching. 'Said she was jus' lookin' round the grounds, but I reckon she was hopin' she might run inter someone else at my house.' He winked at Harry. 'If yeh ask me, she wouldn' say no ter a signed -'", "begin": 10810.727, "end": 10832.887, "localBegin": 1305.16, "localEnd": 1327.32}, {"id": "c007_f000140", "text": "'Oh, shut up,' said Harry. Ron snorted with laughter and the ground was sprayed with slugs.", "begin": 10832.887, "end": 10839.207, "localBegin": 1327.32, "localEnd": 1333.64}, {"id": "c007_f000141", "text": "'Watch it!' Hagrid roared, pulling Ron away from his precious pumpkins.", "begin": 10839.207, "end": 10844.927, "localBegin": 1333.64, "localEnd": 1339.36}, {"id": "c007_f000142", "text": "It was nearly lunchtime and as Harry had only had one bit of treacle toffee since dawn, he was keen to go back to school to eat. They said goodbye to Hagrid and walked back up to the castle, Ron hiccoughing occasionally, but only bringing up two, very small slugs.", "begin": 10844.927, "end": 10860.687, "localBegin": 1339.36, "localEnd": 1355.12}, {"id": "c007_f000143", "text": "They had barely set foot in the cool Entrance Hall when a voice rang out. 'There you are, Potter, Weasley.' Professor McGonagall was walking towards them, looking stern. 'You will both do your detentions this evening.'", "begin": 10860.687, "end": 10875.287, "localBegin": 1355.12, "localEnd": 1369.72}, {"id": "c007_f000144", "text": "'What are we doing, Professor?' said Ron, nervously suppressing a burp.", "begin": 10875.287, "end": 10879.447, "localBegin": 1369.72, "localEnd": 1373.88}, {"id": "c007_f000145", "text": "'You will be polishing the silver in the trophy room with Mr Filch,' said Professor McGonagall. 'And no magic, Weasley elbow grease.'", "begin": 10879.447, "end": 10887.487, "localBegin": 1373.88, "localEnd": 1381.92}, {"id": "c007_f000146", "text": "Ron gulped. Argus Filch, the caretaker, was loathed by every student in the school.", "begin": 10887.487, "end": 10893.167, "localBegin": 1381.92, "localEnd": 1387.6}, {"id": "c007_f000147", "text": "'And you, Potter, will be helping Professor Lockhart answer his fan mail,' said Professor McGonagall.", "begin": 10893.167, "end": 10899.287, "localBegin": 1387.6, "localEnd": 1393.72}, {"id": "c007_f000148", "text": "'Oh no - can't I go and do the trophy room, too?' said Harry desperately.", "begin": 10899.287, "end": 10904.887, "localBegin": 1393.72, "localEnd": 1399.32}, {"id": "c007_f000149", "text": "'Certainly not,' said Professor McGonagall, raising her eyebrows. 'Professor Lockhart requested you particularly. Eight o'clock sharp, both of you.'", "begin": 10904.887, "end": 10913.247, "localBegin": 1399.32, "localEnd": 1407.68}, {"id": "c007_f000150", "text": "Harry and Ron slouched into the Great Hall in states of deepest gloom, Hermione behind them, wearing a well-you-did-break-school-rules sort of expression. Harry didn't fancy his shepherd's pie as much as he'd thought. Both he and Ron felt they'd got the worse deal.", "begin": 10913.247, "end": 10930.007, "localBegin": 1407.68, "localEnd": 1424.44}, {"id": "c007_f000151", "text": "'Filch'll have me there all night,' said Ron heavily. 'No magic! There must be about a hundred cups in that room. I'm no good at Muggle cleaning.'", "begin": 10930.007, "end": 10941.207, "localBegin": 1424.44, "localEnd": 1435.64}, {"id": "c007_f000152", "text": "'I'd swap any time,' said Harry hollowly. 'I've had loads of practice with the Dursleys. Answering Lockhart's fan mail ... he'll be a nightmare ...'", "begin": 10941.207, "end": 10951.127, "localBegin": 1435.64, "localEnd": 1445.56}, {"id": "c007_f000153", "text": "Saturday afternoon seemed to melt away, and in what seemed like no time, it was five minutes to eight, and Harry was dragging", "begin": 10951.127, "end": 10959.247, "localBegin": 1445.56, "localEnd": 1453.68}, {"id": "c007_f000154", "text": "his feet along the second-floor corridor to Lockhart's office. He gritted his teeth and knocked.", "begin": 10959.247, "end": 10964.087, "localBegin": 1453.68, "localEnd": 1458.52}, {"id": "c007_f000155", "text": "The door flew open at once. Lockhart beamed down at him.", "begin": 10964.087, "end": 10968.367, "localBegin": 1458.52, "localEnd": 1462.8}, {"id": "c007_f000156", "text": "'Ah, here's the scallywag!' he said. 'Come in, Harry, come in.'", "begin": 10968.367, "end": 10974.287, "localBegin": 1462.8, "localEnd": 1468.72}, {"id": "c007_f000157", "text": "Shining brightly on the walls by the light of many candles were countless framed photographs of Lockhart. He had even signed a few of them. Another large pile lay on his desk.", "begin": 10974.287, "end": 10985.767, "localBegin": 1468.72, "localEnd": 1480.2}, {"id": "c007_f000158", "text": "'You can address the envelopes!' Lockhart told Harry, as though this was a huge treat. 'This first one's to Gladys Gudgeon, bless her - huge fan of mine.'", "begin": 10985.767, "end": 10998.847, "localBegin": 1480.2, "localEnd": 1493.28}, {"id": "c007_f000159", "text": "The minutes snailed by. Harry let Lockhart's voice wash over him, occasionally saying, 'Mmm' and 'Right' and 'Yeah'. Now and then he caught a phrase like 'Fame's a fickle friend, Harry' or 'Celebrity is as celebrity does, remember that'.", "begin": 10998.847, "end": 11018.367, "localBegin": 1493.28, "localEnd": 1512.8}, {"id": "c007_f000160", "text": "The candles burned lower and lower, making the light dance over the many moving faces of Lockhart watching him. Harry moved his aching hand over what felt like the thousandth envelope, writing out Veronica Smethley's address. It must be nearly time to leave, Harry thought miserably, please let it be nearly time ...", "begin": 11018.367, "end": 11040.887, "localBegin": 1512.8, "localEnd": 1535.32}, {"id": "c007_f000161", "text": "And then he heard something - something quite apart from the spitting of the dying candles and Lockhart's prattle about his fans.", "begin": 11040.887, "end": 11050.367, "localBegin": 1535.32, "localEnd": 1544.8}, {"id": "c007_f000162", "text": "It was a voice, a voice to chill the bone-marrow, a voice of breath-taking, ice-cold venom.", "begin": 11050.367, "end": 11057.847, "localBegin": 1544.8, "localEnd": 1552.28}, {"id": "c007_f000163", "text": "'Come ... come to me ... let me rip you ... let me tear you ... let me kill you ...'", "begin": 11057.847, "end": 11071.167, "localBegin": 1552.28, "localEnd": 1565.6}, {"id": "c007_f000164", "text": "Harry gave a huge jump and a large lilac blot appeared on Veronica Smethley's street.", "begin": 11071.167, "end": 11077.407, "localBegin": 1565.6, "localEnd": 1571.84}, {"id": "c007_f000165", "text": "'What?' he said loudly.", "begin": 11077.407, "end": 11078.647, "localBegin": 1571.84, "localEnd": 1573.08}, {"id": "c007_f000166", "text": "'I know!' said Lockhart. 'Six solid months at the top of the bestseller list! Broke all records!'", "begin": 11078.647, "end": 11086.047, "localBegin": 1573.08, "localEnd": 1580.48}, {"id": "c007_f000167", "text": "'No,' said Harry frantically. 'That voice!'", "begin": 11086.047, "end": 11088.567, "localBegin": 1580.48, "localEnd": 1583.0}, {"id": "c007_f000168", "text": "'Sorry?' said Lockhart, looking puzzled. 'What voice?'", "begin": 11088.567, "end": 11092.807, "localBegin": 1583.0, "localEnd": 1587.24}, {"id": "c007_f000169", "text": "'That - that voice that said - didn't you hear it?'", "begin": 11092.807, "end": 11096.967, "localBegin": 1587.24, "localEnd": 1591.4}, {"id": "c007_f000170", "text": "Lockhart was looking at Harry in high astonishment.", "begin": 11096.967, "end": 11100.287, "localBegin": 1591.4, "localEnd": 1594.72}, {"id": "c007_f000171", "text": "'What are you talking about, Harry? Perhaps you're getting a little drowsy? Great Scott - look at the time! We've been here nearly four hours! I'd never have believed it - the time's flown, hasn't it?'", "begin": 11100.287, "end": 11113.967, "localBegin": 1594.72, "localEnd": 1608.4}, {"id": "c007_f000172", "text": "Harry didn't answer. He was straining his ears to hear the voice again, but there was no sound now except for Lockhart telling", "begin": 11113.967, "end": 11121.447, "localBegin": 1608.4, "localEnd": 1615.88}, {"id": "c007_f000173", "text": "him he mustn't expect a treat like this every time he got detention. Feeling dazed, Harry left.", "begin": 11121.447, "end": 11128.767, "localBegin": 1615.88, "localEnd": 1623.2}, {"id": "c007_f000174", "text": "It was so late that the Gryffindor common room was almost empty. Harry went straight up to the dormitory. Ron wasn't back yet. Harry pulled on his pyjamas, got into bed and waited. Half an hour later, Ron arrived, nursing his right arm and bringing a strong smell of polish into the darkened room.", "begin": 11128.767, "end": 11146.607, "localBegin": 1623.2, "localEnd": 1641.04}, {"id": "c007_f000175", "text": "'My muscles have all seized up,' he groaned, sinking on his bed. 'Fourteen times he made me buff up that Quidditch Cup before he was satisfied. And then I had another slug attack all over a Special Award for Services to the School. Took ages to shift the slime ... How was it with Lockhart?'", "begin": 11146.607, "end": 11166.367, "localBegin": 1641.04, "localEnd": 1660.8}, {"id": "c007_f000176", "text": "Keeping his voice low so as not to wake Neville, Dean and Seamus, Harry told Ron exactly what he had heard.", "begin": 11166.367, "end": 11173.847, "localBegin": 1660.8, "localEnd": 1668.28}, {"id": "c007_f000177", "text": "'And Lockhart said he couldn't hear it?' said Ron. Harry could see him frowning in the moonlight. 'D'you think he was lying? But I don't get it - even someone invisible would've had to open the door.'", "begin": 11173.847, "end": 11187.407, "localBegin": 1668.28, "localEnd": 1681.84}, {"id": "c007_f000178", "text": "'I know,' said Harry, lying back in his four-poster and staring at the canopy above him. 'I don't get it, either.'", "begin": 11187.407, "end": 11198.567, "localBegin": 1681.84, "localEnd": 1693.0}]}, {"kind": "chapter", "number": 8, "title": "The Deathday Party", "audio": "audio/chapter_008.mp3", "start": 11198.567, "end": 12963.5, "duration": 1764.933, "paragraphs": [{"id": "c008_f000001", "text": "Chapter Eight. The Deathday Party.", "begin": 11198.567, "end": 11203.767, "localBegin": 0.0, "localEnd": 5.2}, {"id": "c008_f000002", "text": "October arrived, spreading a damp chill over the grounds and into the castle. Madam Pomfrey, the matron, was kept busy by a sudden spate of colds among the staff and students. Her Pepperup Potion worked instantly, though it left the drinker smoking at the ears for several hours afterwards. Ginny Weasley, who had been looking peaky, was bullied into taking some by Percy. The steam pouring from under her vivid hair gave the impression that her whole head was on fire.", "begin": 11203.767, "end": 11231.847, "localBegin": 5.2, "localEnd": 33.28}, {"id": "c008_f000003", "text": "Raindrops the size of bullets thundered on the castle windows for days on end; the lake rose, the flowerbeds turned into muddy streams and Hagrid's pumpkins swelled to the size of garden sheds. Oliver Wood's enthusiasm for regular training sessions, however, was not dampened, which was why Harry was to be found, late one stormy Saturday afternoon a few days before Hallowe'en, returning to Gryffindor Tower, drenched to the skin and splattered with mud.", "begin": 11231.847, "end": 11261.887, "localBegin": 33.28, "localEnd": 63.32}, {"id": "c008_f000004", "text": "Even aside from the rain and wind it hadn't been a happy practice session. Fred and George, who had been spying on the Slytherin team, had seen for themselves the speed of those new Nimbus Two Thousand and Ones. They reported that the Slytherin team were no more than seven greenish blurs, shooting through the air like jump-jets.", "begin": 11261.887, "end": 11281.327, "localBegin": 63.32, "localEnd": 82.76}, {"id": "c008_f000005", "text": "As Harry squelched along the deserted corridor he came across somebody who looked just as preoccupied as he was. Nearly Headless Nick, the ghost of Gryffindor Tower, was staring morosely out of a window, muttering under his breath, '... don't fulfil their requirements ... half an inch, if that ...'", "begin": 11281.327, "end": 11300.727, "localBegin": 82.76, "localEnd": 102.16}, {"id": "c008_f000006", "text": "'Hello, Nick,' said Harry.", "begin": 11300.727, "end": 11302.967, "localBegin": 102.16, "localEnd": 104.4}, {"id": "c008_f000007", "text": "'Hello, hello,' said Nearly Headless Nick, starting and looking round. He wore a dashing, plumed hat on his long curly hair, and", "begin": 11302.967, "end": 11311.847, "localBegin": 104.4, "localEnd": 113.28}, {"id": "c008_f000008", "text": "a tunic with a ruff, which concealed the fact that his neck was almost completely severed. He was pale as smoke, and Harry could see right through him to the dark sky and torrential rain outside.", "begin": 11311.847, "end": 11324.247, "localBegin": 113.28, "localEnd": 125.68}, {"id": "c008_f000009", "text": "'You look troubled, young Potter,' said Nick, folding a transparent letter as he spoke and tucking it inside his doublet.", "begin": 11324.247, "end": 11332.687, "localBegin": 125.68, "localEnd": 134.12}, {"id": "c008_f000010", "text": "'So do you,' said Harry.", "begin": 11332.687, "end": 11335.247, "localBegin": 134.12, "localEnd": 136.68}, {"id": "c008_f000011", "text": "'Ah,' Nearly Headless Nick waved an elegant hand, 'a matter of no importance ... it's not as though I really wanted to join ... thought I'd apply, but apparently I \"don't fulfil requirements\".'", "begin": 11335.247, "end": 11350.287, "localBegin": 136.68, "localEnd": 151.72}, {"id": "c008_f000012", "text": "In spite of his airy tone, there was a look of great bitterness on his face.", "begin": 11350.287, "end": 11355.047, "localBegin": 151.72, "localEnd": 156.48}, {"id": "c008_f000013", "text": "'But you would think, wouldn't you,' he erupted suddenly, pulling the letter back out of his pocket, 'that getting hit forty-five times in the neck with a blunt axe would qualify you to join the Headless Hunt?'", "begin": 11355.047, "end": 11369.007, "localBegin": 156.48, "localEnd": 170.44}, {"id": "c008_f000014", "text": "'Oh - yes,' said Harry, who was obviously supposed to agree.", "begin": 11369.007, "end": 11373.047, "localBegin": 170.44, "localEnd": 174.48}, {"id": "c008_f000015", "text": "'I mean, nobody wishes more than I do that it had all been quick and clean, and my head had come off properly, I mean, it would have saved me a great deal of pain and ridicule. However ...' Nearly Headless Nick shook his letter open and read furiously.", "begin": 11373.047, "end": 11389.367, "localBegin": 174.48, "localEnd": 190.8}, {"id": "c008_f000016", "text": "'We can only accept huntsmen whose heads have parted company with their bodies. You will appreciate that it would be impossible otherwise for members to participate in hunt activities such as Horseback Head-Juggling and Head Polo. It is with the greatest regret, therefore, that I must inform you that you do not fulfil our requirements. With very best wishes, Sir Patrick Delaney-Podmore.'", "begin": 11389.367, "end": 11415.007, "localBegin": 190.8, "localEnd": 216.44}, {"id": "c008_f000017", "text": "Fuming, Nearly Headless Nick stuffed the letter away.", "begin": 11415.007, "end": 11418.727, "localBegin": 216.44, "localEnd": 220.16}, {"id": "c008_f000018", "text": "'Half an inch of skin and sinew holding my neck on, Harry! Most people would think that's good and beheaded, but oh no, it's not enough for Sir Properly Decapitated-Podmore.'", "begin": 11418.727, "end": 11432.767, "localBegin": 220.16, "localEnd": 234.2}, {"id": "c008_f000019", "text": "Nearly Headless Nick took several deep breaths and then said, in a far calmer tone, 'So - what's bothering you? Anything I can do?'", "begin": 11432.767, "end": 11443.687, "localBegin": 234.2, "localEnd": 245.12}, {"id": "c008_f000020", "text": "'No,' said Harry. 'Not unless you know where we can get seven free Nimbus Two Thousand and Ones for our match against Sly-'", "begin": 11443.687, "end": 11450.887, "localBegin": 245.12, "localEnd": 252.32}, {"id": "c008_f000021", "text": "The rest of Harry's sentence was drowned by a high-pitched mewing from somewhere near his ankles. He looked down and found himself gazing into a pair of lamp-like yellow eyes. It was Mrs Norris, the skeletal grey cat who was used by the caretaker,", "begin": 11450.887, "end": 11466.287, "localBegin": 252.32, "localEnd": 267.72}, {"id": "c008_f000022", "text": "Argus Filch, as a sort of deputy in his endless battle against students.", "begin": 11466.287, "end": 11471.607, "localBegin": 267.72, "localEnd": 273.04}, {"id": "c008_f000023", "text": "'You'd better get out of here, Harry,' said Nick quickly. 'Filch isn't in a good mood. He's got flu and some third-years accidentally plastered frog brains all over the ceiling in dungeon five; he's been cleaning all morning, and if he sees you dripping mud all over the place ...'", "begin": 11471.607, "end": 11492.327, "localBegin": 273.04, "localEnd": 293.76}, {"id": "c008_f000024", "text": "'Right,' said Harry, backing away from the accusing stare of Mrs Norris, but not quickly enough. Drawn to the spot by the mysterious power that seemed to connect him with his foul cat, Argus Filch burst suddenly through a tapestry to Harry's right, wheezing and looking wildly about for the rule-breaker. There was a thick tartan scarf bound around his head, and his nose was unusually purple.", "begin": 11492.327, "end": 11516.647, "localBegin": 293.76, "localEnd": 318.08}, {"id": "c008_f000025", "text": "'Filth!' he shouted, his jowls aquiver, his eyes popping alarmingly as he pointed at the muddy puddle that had dripped from Harry's Quidditch robes. 'Mess and muck everywhere! I've had enough of it, I tell you! Follow me, Potter!'", "begin": 11516.647, "end": 11531.727, "localBegin": 318.08, "localEnd": 333.16}, {"id": "c008_f000026", "text": "So Harry waved a gloomy goodbye to Nearly Headless Nick, and followed Filch back downstairs, doubling the number of muddy footprints on the floor.", "begin": 11531.727, "end": 11541.247, "localBegin": 333.16, "localEnd": 342.68}, {"id": "c008_f000027", "text": "Harry had never been inside Filch's office before; it was a place most students avoided. The room was dingy and windowless, lit by a single oil lamp dangling from the low ceiling. A faint smell of fried fish lingered about the place. Wooden filing cabinets stood around the walls; from their labels, Harry could see that they contained details of every pupil Filch had ever punished. Fred and George Weasley had an entire drawer to themselves. A highly polished collection of chains and manacles hung on the wall behind Filch's desk. It was common knowledge that he was always begging Dumbledore to let him suspend students by their ankles from the ceiling.", "begin": 11541.247, "end": 11581.567, "localBegin": 342.68, "localEnd": 383.0}, {"id": "c008_f000028", "text": "Filch grabbed a quill from a pot on his desk and began shuffling around looking for parchment.", "begin
