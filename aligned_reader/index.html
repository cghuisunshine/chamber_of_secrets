ve forgotten the", "begin": 20504.508, "end": 20507.908, "localBegin": 1298.32, "localEnd": 1301.72}, {"id": "c012_f000131", "text": "way to our common room.'", "begin": 20507.908, "end": 20509.908, "localBegin": 1301.72, "localEnd": 1303.72}, {"id": "c012_f000132", "text": "'I beg your pardon?' said the girl stiffly. 'Our common room? I'm a Ravenclaw.'", "begin": 20509.908, "end": 20516.388, "localBegin": 1303.72, "localEnd": 1310.2}, {"id": "c012_f000133", "text": "She walked away, looking suspiciously back at them.", "begin": 20516.388, "end": 20519.988, "localBegin": 1310.2, "localEnd": 1313.8}, {"id": "c012_f000134", "text": "Harry and Ron hurried down the stone steps into the darkness, their footsteps echoing particularly loudly as Crabbe and Goyle's huge feet hit the floor, feeling that this wasn't going to be as easy as they had hoped.", "begin": 20519.988, "end": 20534.788, "localBegin": 1313.8, "localEnd": 1328.6}, {"id": "c012_f000135", "text": "The labyrinthine passages were deserted. They walked deeper and deeper under the school, constantly checking their watches to see how much time they had left. After a quarter of an hour, just when they were getting desperate, they heard a sudden movement ahead.", "begin": 20534.788, "end": 20549.348, "localBegin": 1328.6, "localEnd": 1343.16}, {"id": "c012_f000136", "text": "'Ha!' said Ron excitedly. 'There's one of them now!'", "begin": 20549.348, "end": 20553.308, "localBegin": 1343.16, "localEnd": 1347.12}, {"id": "c012_f000137", "text": "The figure was emerging from a side room. As they hurried nearer, however, their hearts sank. It wasn't a Slytherin, it was Percy.", "begin": 20553.308, "end": 20563.068, "localBegin": 1347.12, "localEnd": 1356.88}, {"id": "c012_f000138", "text": "'What're you doing down here?' said Ron in surprise.", "begin": 20563.068, "end": 20566.428, "localBegin": 1356.88, "localEnd": 1360.24}, {"id": "c012_f000139", "text": "Percy looked affronted.", "begin": 20566.428, "end": 20568.348, "localBegin": 1360.24, "localEnd": 1362.16}, {"id": "c012_f000140", "text": "'That,' he said stiffly, 'is none of your business. It's Crabbe, isn't it?'", "begin": 20568.348, "end": 20572.868, "localBegin": 1362.16, "localEnd": 1366.68}, {"id": "c012_f000141", "text": "'Wh- oh, yeah,' said Ron.", "begin": 20572.868, "end": 20575.948, "localBegin": 1366.68, "localEnd": 1369.76}, {"id": "c012_f000142", "text": "'Well, get off to your dormitories,' said Percy sternly. 'It's not safe to go wandering around dark corridors these days.'", "begin": 20575.948, "end": 20582.908, "localBegin": 1369.76, "localEnd": 1376.72}, {"id": "c012_f000143", "text": "'You are,' Ron pointed out.", "begin": 20582.908, "end": 20585.628, "localBegin": 1376.72, "localEnd": 1379.44}, {"id": "c012_f000144", "text": "'I,' said Percy, drawing himself up, 'am a Prefect. Nothing's about to attack me.'", "begin": 20585.628, "end": 20591.148, "localBegin": 1379.44, "localEnd": 1384.96}, {"id": "c012_f000145", "text": "A voice suddenly echoed behind Harry and Ron. Draco Malfoy was strolling towards them, and for the first time in his life, Harry was pleased to see him.", "begin": 20591.148, "end": 20600.748, "localBegin": 1384.96, "localEnd": 1394.56}, {"id": "c012_f000146", "text": "'There you are,' he drawled, looking at them. 'Have you two been pigging out in the Great Hall all this time? I've been looking for you, I want to show you something really funny.'", "begin": 20600.748, "end": 20612.308, "localBegin": 1394.56, "localEnd": 1406.12}, {"id": "c012_f000147", "text": "Malfoy glanced witheringly at Percy.", "begin": 20612.308, "end": 20615.148, "localBegin": 1406.12, "localEnd": 1408.96}, {"id": "c012_f000148", "text": "'And what're you doing down here, Weasley?' he sneered.", "begin": 20615.148, "end": 20618.908, "localBegin": 1408.96, "localEnd": 1412.72}, {"id": "c012_f000149", "text": "Percy looked outraged.", "begin": 20618.908, "end": 20620.868, "localBegin": 1412.72, "localEnd": 1414.68}, {"id": "c012_f000150", "text": "'You want to show a bit more respect to a school Prefect!' he said. 'I don't like your attitude!'", "begin": 20620.868, "end": 20626.508, "localBegin": 1414.68, "localEnd": 1420.32}, {"id": "c012_f000151", "text": "Malfoy sneered and motioned Harry and Ron to follow him. Harry almost said something apologetic to Percy but caught him-", "begin": 20626.508, "end": 20634.308, "localBegin": 1420.32, "localEnd": 1428.12}, {"id": "c012_f000152", "text": "self just in time. He and Ron hurried after Malfoy, who said as they turned into the next passage, 'That Peter Weasley -'", "begin": 20634.308, "end": 20643.468, "localBegin": 1428.12, "localEnd": 1437.28}, {"id": "c012_f000153", "text": "'Percy,' Ron corrected him automatically.", "begin": 20643.468, "end": 20646.588, "localBegin": 1437.28, "localEnd": 1440.4}, {"id": "c012_f000154", "text": "'Whatever,' said Malfoy. 'I've noticed him sneaking around a lot lately. And I bet I know what he's up to. He thinks he's going to catch Slytherin's heir single-handed.'", "begin": 20646.588, "end": 20656.908, "localBegin": 1440.4, "localEnd": 1450.72}, {"id": "c012_f000155", "text": "He gave a short, derisive laugh. Harry and Ron exchanged excited looks.", "begin": 20656.908, "end": 20661.868, "localBegin": 1450.72, "localEnd": 1455.68}, {"id": "c012_f000156", "text": "Malfoy paused by a stretch of bare, damp stone wall.", "begin": 20661.868, "end": 20665.828, "localBegin": 1455.68, "localEnd": 1459.64}, {"id": "c012_f000157", "text": "'What's the new password again?' he said to Harry.", "begin": 20665.828, "end": 20669.548, "localBegin": 1459.64, "localEnd": 1463.36}, {"id": "c012_f000158", "text": "'Er -' said Harry.", "begin": 20669.548, "end": 20671.828, "localBegin": 1463.36, "localEnd": 1465.64}, {"id": "c012_f000159", "text": "'Oh yeah - pure-blood!' said Malfoy, not listening, and a stone door concealed in the wall slid open. Malfoy marched through it and Harry and Ron followed him.", "begin": 20671.828, "end": 20682.468, "localBegin": 1465.64, "localEnd": 1476.28}, {"id": "c012_f000160", "text": "The Slytherin common room was a long, low underground room with rough stone walls and ceiling, from which round, greenish lamps were hanging on chains. A fire was crackling under an elaborately carved mantelpiece ahead of them, and several Slytherins were silhouetted around it in carved chairs.", "begin": 20682.468, "end": 20700.748, "localBegin": 1476.28, "localEnd": 1494.56}, {"id": "c012_f000161", "text": "'Wait here,' said Malfoy to Harry and Ron, motioning them to a pair of empty chairs set back from the fire. 'I'll go and get it - my father's just sent it to me -'", "begin": 20700.748, "end": 20710.948, "localBegin": 1494.56, "localEnd": 1504.76}, {"id": "c012_f000162", "text": "Wondering what Malfoy was going to show them, Harry and Ron sat down, doing their best to look at home.", "begin": 20710.948, "end": 20716.908, "localBegin": 1504.76, "localEnd": 1510.72}, {"id": "c012_f000163", "text": "Malfoy came back a minute later, holding what looked like a newspaper cutting. He thrust it under Ron's nose.", "begin": 20716.908, "end": 20723.348, "localBegin": 1510.72, "localEnd": 1517.16}, {"id": "c012_f000164", "text": "'That'll give you a laugh,' he said.", "begin": 20723.348, "end": 20726.188, "localBegin": 1517.16, "localEnd": 1520.0}, {"id": "c012_f000165", "text": "Harry saw Ron's eyes widen in shock. He read the cutting quickly, gave a very forced laugh and handed it to Harry.", "begin": 20726.188, "end": 20734.148, "localBegin": 1520.0, "localEnd": 1527.96}, {"id": "c012_f000166", "text": "It had been clipped out of the Daily Prophet, and it said:", "begin": 20734.148, "end": 20737.788, "localBegin": 1527.96, "localEnd": 1531.6}, {"id": "c012_f000167", "text": "ENQUIRY AT THE MINISTRY OF MAGIC", "begin": 20737.788, "end": 20740.628, "localBegin": 1531.6, "localEnd": 1534.44}, {"id": "c012_f000168", "text": "Arthur Weasley, Head of the Misuse of Muggle Artefacts Office,", "begin": 20740.628, "end": 20745.068, "localBegin": 1534.44, "localEnd": 1538.88}, {"id": "c012_f000169", "text": "was today fined fifty Galleons for bewitching a Muggle car. Mr Lucius Malfoy, a governor of Hogwarts School of", "begin": 20745.068, "end": 20752.828, "localBegin": 1538.88, "localEnd": 1546.64}, {"id": "c012_f000170", "text": "Witchcraft and Wizardry, where the enchanted car crashed earlier", "begin": 20752.828, "end": 20756.228, "localBegin": 1546.64, "localEnd": 1550.04}, {"id": "c012_f000171", "text": "this year, called today for Mr Weasley's resignation. 'Weasley has brought the Ministry info disrepute,' Mr", "begin": 20756.228, "end": 20763.108, "localBegin": 1550.04, "localEnd": 1556.92}, {"id": "c012_f000172", "text": "Malfoy told our reporter. 'He is clearly unfit to draw up our", "begin": 20763.108, "end": 20766.668, "localBegin": 1556.92, "localEnd": 1560.48}, {"id": "c012_f000173", "text": "laws and his ridiculous Muggle Protection Act should be scrapped", "begin": 20766.668, "end": 20770.668, "localBegin": 1560.48, "localEnd": 1564.48}, {"id": "c012_f000174", "text": "immediately.' Mr Weasley was unavailable for comment, although his", "begin": 20770.668, "end": 20774.788, "localBegin": 1564.48, "localEnd": 1568.6}, {"id": "c012_f000175", "text": "wife told reporters to clear off or she'd set the family ghoul", "begin": 20774.788, "end": 20778.228, "localBegin": 1568.6, "localEnd": 1572.04}, {"id": "c012_f000176", "text": "on them.", "begin": 20778.228, "end": 20778.668, "localBegin": 1572.04, "localEnd": 1572.48}, {"id": "c012_f000177", "text": "'Well?' said Malfoy impatiently, as Harry handed the cutting back to him. 'Don't you think it's funny?'", "begin": 20778.668, "end": 20786.068, "localBegin": 1572.48, "localEnd": 1579.88}, {"id": "c012_f000178", "text": "'Ha, ha,' said Harry bleakly.", "begin": 20786.068, "end": 20789.068, "localBegin": 1579.88, "localEnd": 1582.88}, {"id": "c012_f000179", "text": "'Arthur Weasley loves Muggles so much he should snap his wand in half and go and join them,' said Malfoy scornfully. 'You'd never know the Weasleys were pure-bloods, the way they behave.'", "begin": 20789.068, "end": 20800.228, "localBegin": 1582.88, "localEnd": 1594.04}, {"id": "c012_f000180", "text": "Ron's - or rather, Crabbe's - face was contorted with fury.", "begin": 20800.228, "end": 20804.628, "localBegin": 1594.04, "localEnd": 1598.44}, {"id": "c012_f000181", "text": "'What's up with you, Crabbe?' snapped Malfoy.", "begin": 20804.628, "end": 20807.908, "localBegin": 1598.44, "localEnd": 1601.72}, {"id": "c012_f000182", "text": "'Stomach ache,' Ron grunted.", "begin": 20807.908, "end": 20810.388, "localBegin": 1601.72, "localEnd": 1604.2}, {"id": "c012_f000183", "text": "'Well, go up to the hospital wing and give all those Mudbloods a kick from me,' said Malfoy, snickering. 'You know, I'm surprised the Daily Prophet hasn't reported all these attacks yet,' he went on thoughtfully. 'I suppose Dumbledore's trying to hush it all up. He'll be sacked if it doesn't stop soon. Father's always said Dumbledore's the worst thing that's ever happened to this place. He loves Muggle-borns. A decent Headmaster would never've let slime like that Creevey in.'", "begin": 20810.388, "end": 20838.388, "localBegin": 1604.2, "localEnd": 1632.2}, {"id": "c012_f000184", "text": "Malfoy started taking pictures with an imaginary camera and did a cruel but accurate impression of Colin: 'Potter, can I have your picture, Potter? Can I have your autograph? Can I lick your shoes, please, Potter?'", "begin": 20838.388, "end": 20850.908, "localBegin": 1632.2, "localEnd": 1644.72}, {"id": "c012_f000185", "text": "He dropped his hands and looked at Harry and Ron.", "begin": 20850.908, "end": 20853.788, "localBegin": 1644.72, "localEnd": 1647.6}, {"id": "c012_f000186", "text": "'What's the matter with you two?'", "begin": 20853.788, "end": 20856.148, "localBegin": 1647.6, "localEnd": 1649.96}, {"id": "c012_f000187", "text": "Far too late, Harry and Ron forced themselves to laugh, but Malfoy seemed satisfied; perhaps Crabbe and Goyle were always slow on the uptake.", "begin": 20856.148, "end": 20864.868, "localBegin": 1649.96, "localEnd": 1658.68}, {"id": "c012_f000188", "text": "'Saint Potter, the Mudbloods' friend,' said Malfoy slowly. 'He's another one with no proper wizard feeling, or he wouldn't go around with that jumped-up Granger Mudblood. And people think he's Slytherin's heir!'", "begin": 20864.868, "end": 20878.228, "localBegin": 1658.68, "localEnd": 1672.04}, {"id": "c012_f000189", "text": "Harry and Ron waited with bated breath: Malfoy was surely seconds away from telling them it was him. But then -", "begin": 20878.228, "end": 20885.868, "localBegin": 1672.04, "localEnd": 1679.68}, {"id": "c012_f000190", "text": "'I wish I knew who it is,' said Malfoy petulantly. 'I could help them.'", "begin": 20885.868, "end": 20892.508, "localBegin": 1679.68, "localEnd": 1686.32}, {"id": "c012_f000191", "text": "Ron's jaw dropped so that Crabbe's face looked even more gormless than usual. Fortunately, Malfoy didn't notice, and Harry, thinking fast, said, 'You must have some idea who's behind it all ...'", "begin": 20892.508, "end": 20904.028, "localBegin": 1686.32, "localEnd": 1697.84}, {"id": "c012_f000192", "text": "'You know I haven't, Goyle, how many times do I have to tell you?' snapped Malfoy. 'And father won't tell me anything about the last time the Chamber was opened, either. Of course, it was fifty years ago, so it was before his time, but he knows all about it, and he says that it was all kept quiet and it'll look suspicious if I know too much about it. But I know one thing: last time the Chamber of Secrets was opened, a Mudblood died. So I bet it's only a matter of time before one of them's killed this time ... I hope it's Granger,' he said with relish.", "begin": 20904.028, "end": 20938.988, "localBegin": 1697.84, "localEnd": 1732.8}, {"id": "c012_f000193", "text": "Ron was clenching Crabbe's gigantic fists. Feeling that it would be a bit of a give-away if Ron punched Malfoy, Harry shot him a warning look and said, 'D'you know if the person who opened the Chamber last time was caught?'", "begin": 20938.988, "end": 20952.348, "localBegin": 1732.8, "localEnd": 1746.16}, {"id": "c012_f000194", "text": "'Oh, yeah ... whoever it was was expelled,' said Malfoy. 'They're probably still in Azkaban.'", "begin": 20952.348, "end": 20959.108, "localBegin": 1746.16, "localEnd": 1752.92}, {"id": "c012_f000195", "text": "'Azkaban?' said Harry, puzzled.", "begin": 20959.108, "end": 20962.068, "localBegin": 1752.92, "localEnd": 1755.88}, {"id": "c012_f000196", "text": "'Azkaban - the wizard prison, Goyle,' said Malfoy, looking at him in disbelief. 'Honestly, if you were any slower, you'd be going backwards.'", "begin": 20962.068, "end": 20970.508, "localBegin": 1755.88, "localEnd": 1764.32}, {"id": "c012_f000197", "text": "He shifted restlessly in his chair and said, 'Father says to keep my head down and let the heir of Slytherin get on with it. He says the school needs ridding of all the Mudblood filth, but not to get mixed up in it. Of course, he's got a lot on his plate at the moment. You know the Ministry of Magic raided our Manor last week?'", "begin": 20970.508, "end": 20989.828, "localBegin": 1764.32, "localEnd": 1783.64}, {"id": "c012_f000198", "text": "Harry tried to force Goyle's dull face into a look of concern.", "begin": 20989.828, "end": 20993.828, "localBegin": 1783.64, "localEnd": 1787.64}, {"id": "c012_f000199", "text": "'Yeah ...' said Malfoy. 'Luckily, they didn't find much. Father's got some very valuable Dark Arts stuff. But luckily, we've got our own secret chamber under the drawing-room floor -'", "begin": 20993.828, "end": 21006.068, "localBegin": 1787.64, "localEnd": 1799.88}, {"id": "c012_f000200", "text": "'Ho!' said Ron.", "begin": 21006.068, "end": 21008.388, "localBegin": 1799.88, "localEnd": 1802.2}, {"id": "c012_f000201", "text": "Malfoy looked at him. So did Harry. Ron blushed. Even his hair was turning red. His nose was also slowly lengthening - their hour was up. Ron was turning back into himself, and from the look of horror he was suddenly giving Harry, he must be, too.", "begin": 21008.388, "end": 21024.308, "localBegin": 1802.2, "localEnd": 1818.12}, {"id": "c012_f000202", "text": "They both jumped to their feet.", "begin": 21024.308, "end": 21026.268, "localBegin": 1818.12, "localEnd": 1820.08}, {"id": "c012_f000203", "text": "'Medicine for my stomach,' Ron grunted, and without further", "begin": 21026.268, "end": 21030.588, "localBegin": 1820.08, "localEnd": 1824.4}, {"id": "c012_f000204", "text": "ado they sprinted the length of the Slytherin common room, hurled themselves at the stone wall and dashed up the passage, hoping against hope that Malfoy hadn't noticed anything. Harry could feel his feet slipping around in Goyle's huge shoes and had to hoist up his robes as he shrank; they crashed up the steps into the dark Entrance Hall, which was full of a muffled pounding coming from the cupboard where they'd locked Crabbe and Goyle. Leaving their shoes outside the cupboard door, they sprinted in their socks up the marble staircase towards Moaning Myrtle's bathroom.", "begin": 21030.588, "end": 21062.548, "localBegin": 1824.4, "localEnd": 1856.36}, {"id": "c012_f000205", "text": "'Well, it wasn't a complete waste of time,' Ron panted, closing the bathroom door behind them. 'I know we still haven't found out who's doing the attacks, but I'm going to write to Dad tomorrow and tell him to check under the Malfoys' drawing room.'", "begin": 21062.548, "end": 21076.428, "localBegin": 1856.36, "localEnd": 1870.24}, {"id": "c012_f000206", "text": "Harry checked his face in the cracked mirror. He was back to normal. He put his glasses on as Ron hammered on the door of Hermione's cubicle.", "begin": 21076.428, "end": 21084.388, "localBegin": 1870.24, "localEnd": 1878.2}, {"id": "c012_f000207", "text": "'Hermione, come out, we've got loads to tell you -'", "begin": 21084.388, "end": 21087.468, "localBegin": 1878.2, "localEnd": 1881.28}, {"id": "c012_f000208", "text": "'Go away!' Hermione squeaked.", "begin": 21087.468, "end": 21090.388, "localBegin": 1881.28, "localEnd": 1884.2}, {"id": "c012_f000209", "text": "Harry and Ron looked at each other.", "begin": 21090.388, "end": 21092.628, "localBegin": 1884.2, "localEnd": 1886.44}, {"id": "c012_f000210", "text": "'What's the matter?' said Ron. 'You must be back to normal by now, we are ...'", "begin": 21092.628, "end": 21096.708, "localBegin": 1886.44, "localEnd": 1890.52}, {"id": "c012_f000211", "text": "But Moaning Myrtle glided suddenly through the cubicle door. Harry had never seen her looking so happy.", "begin": 21096.708, "end": 21102.748, "localBegin": 1890.52, "localEnd": 1896.56}, {"id": "c012_f000212", "text": "'Ooooooh, wait till you see,' she said. 'It's awful!'", "begin": 21102.748, "end": 21109.388, "localBegin": 1896.56, "localEnd": 1903.2}, {"id": "c012_f000213", "text": "They heard the lock slide back and Hermione emerged, sobbing, her robes pulled up over her head.", "begin": 21109.388, "end": 21115.908, "localBegin": 1903.2, "localEnd": 1909.72}, {"id": "c012_f000214", "text": "'What's up?' said Ron uncertainly. 'Have you still got Millicent's nose or something?'", "begin": 21115.908, "end": 21121.308, "localBegin": 1909.72, "localEnd": 1915.12}, {"id": "c012_f000215", "text": "Hermione let her robes fall and Ron backed into the sink.", "begin": 21121.308, "end": 21125.908, "localBegin": 1915.12, "localEnd": 1919.72}, {"id": "c012_f000216", "text": "Her face was covered in black fur. Her eyes had gone yellow and there were long pointed ears poking through her hair.", "begin": 21125.908, "end": 21133.428, "localBegin": 1919.72, "localEnd": 1927.24}, {"id": "c012_f000217", "text": "'It was a c-cat hair!' she howled. 'M-Millicent Bulstrode m-must have a cat! And the P-Potion isn't supposed to be used for animal transformations!'", "begin": 21133.428, "end": 21147.148, "localBegin": 1927.24, "localEnd": 1940.96}, {"id": "c012_f000218", "text": "'Uh oh,' said Ron.", "begin": 21147.148, "end": 21149.628, "localBegin": 1940.96, "localEnd": 1943.44}, {"id": "c012_f000219", "text": "'You'll be teased something dreadful,' said Myrtle happily.", "begin": 21149.628, "end": 21154.828, "localBegin": 1943.44, "localEnd": 1948.64}, {"id": "c012_f000220", "text": "'It's OK, Hermione,' said Harry quickly. 'We'll take you up to the hospital wing. Madam Pomfrey never asks too many questions ...'", "begin": 21154.828, "end": 21162.548, "localBegin": 1948.64, "localEnd": 1956.36}, {"id": "c012_f000221", "text": "It took a long time to persuade Hermione to leave the bathroom. Moaning Myrtle sped them on their way with a hearty guffaw.", "begin": 21162.548, "end": 21170.268, "localBegin": 1956.36, "localEnd": 1964.08}, {"id": "c012_f000222", "text": "'Wait till everyone finds out you've got a tail!'", "begin": 21170.268, "end": 21177.228, "localBegin": 1964.08, "localEnd": 1971.04}]}, {"kind": "chapter", "number": 13, "title": "The Very Secret Diary", "audio": "audio/chapter_013.mp3", "start": 21177.26, "end": 23231.26, "duration": 2054.0, "paragraphs": [{"id": "c013_f000001", "text": "Chapter Thirteen. The Very Secret Diary.", "begin": 21177.26, "end": 21182.26, "localBegin": 0.0, "localEnd": 5.0}, {"id": "c013_f000002", "text": "Hermione remained in the hospital wing for several weeks. There was a flurry of rumour about her disappearance when the rest of the school arrived back from their Christmas holidays, because of course everyone thought that she had been attacked. So many students filed past the hospital wing trying to catch a glimpse of her that Madam Pomfrey took out her curtains again and placed them around Hermione's bed, to spare her the shame of being seen with a furry face.", "begin": 21182.26, "end": 21206.74, "localBegin": 5.0, "localEnd": 29.48}, {"id": "c013_f000003", "text": "Harry and Ron went to visit her every evening. When the new term started, they brought her each day's homework.", "begin": 21206.74, "end": 21213.34, "localBegin": 29.48, "localEnd": 36.08}, {"id": "c013_f000004", "text": "'If I'd sprouted whiskers, I'd take a break from work,' said Ron, tipping a stack of books onto Hermione's bedside table one evening.", "begin": 21213.34, "end": 21220.86, "localBegin": 36.08, "localEnd": 43.6}, {"id": "c013_f000005", "text": "'Don't be silly, Ron, I've got to keep up,' said Hermione briskly. Her spirits were greatly improved by the fact that all the hair had gone from her face and her eyes were turning slowly back to brown. 'I don't suppose you've got any new leads?' she added in a whisper, so that Madam Pomfrey couldn't hear her.", "begin": 21220.86, "end": 21239.06, "localBegin": 43.6, "localEnd": 61.8}, {"id": "c013_f000006", "text": "'Nothing,' said Harry gloomily.", "begin": 21239.06, "end": 21241.58, "localBegin": 61.8, "localEnd": 64.32}, {"id": "c013_f000007", "text": "'I was so sure it was Malfoy,' said Ron, for about the hundredth time.", "begin": 21241.58, "end": 21246.66, "localBegin": 64.32, "localEnd": 69.4}, {"id": "c013_f000008", "text": "'What's that?' asked Harry, pointing to something gold sticking out from under Hermione's pillow.", "begin": 21246.66, "end": 21252.34, "localBegin": 69.4, "localEnd": 75.08}, {"id": "c013_f000009", "text": "'Just a Get Well card,' said Hermione hastily, trying to poke it out of sight, but Ron was too quick for her. He pulled it out, flicked it open and read aloud:", "begin": 21252.34, "end": 21260.66, "localBegin": 75.08, "localEnd": 83.4}, {"id": "c013_f000010", "text": "'To Miss Granger, wishing you a speedy recovery, from your concerned teacher, Professor Gilderoy Lockhart, Order of Merlin, Third Class, Honorary Member of the Dark Force Defence League and five times winner of Witch Weekly's Most-Charming-Smile Award.'", "begin": 21260.66, "end": 21277.94, "localBegin": 83.4, "localEnd": 100.68}, {"id": "c013_f000011", "text": "Ron looked up at Hermione, disgusted.", "begin": 21277.94, "end": 21280.86, "localBegin": 100.68, "localEnd": 103.6}, {"id": "c013_f000012", "text": "'You sleep with this under your pillow?'", "begin": 21280.86, "end": 21284.26, "localBegin": 103.6, "localEnd": 107.0}, {"id": "c013_f000013", "text": "But Hermione was spared answering by Madam Pomfrey sweeping over with her evening dose of medicine.", "begin": 21284.26, "end": 21290.54, "localBegin": 107.0, "localEnd": 113.28}, {"id": "c013_f000014", "text": "'Is Lockhart the smarmiest bloke you've ever met, or what?' Ron said to Harry as they left the dormitory and started up the stairs towards Gryffindor Tower. Snape had given them so much homework, Harry thought he was likely to be in the sixth year before he finished it. Ron was just saying he wished he had asked Hermione how many rat tails you were supposed to add to a Hair- Raising Potion, when an angry outburst from the floor above reached their ears.", "begin": 21290.54, "end": 21316.18, "localBegin": 113.28, "localEnd": 138.92}, {"id": "c013_f000015", "text": "'That's Filch,' Harry muttered, as they hurried up the stairs and paused, out of sight, listening hard.", "begin": 21316.18, "end": 21322.98, "localBegin": 138.92, "localEnd": 145.72}, {"id": "c013_f000016", "text": "'You don't think someone else's been attacked?' said Ron tensely.", "begin": 21322.98, "end": 21327.34, "localBegin": 145.72, "localEnd": 150.08}, {"id": "c013_f000017", "text": "They stood still, their heads inclined towards Filch's voice, which sounded quite hysterical.", "begin": 21327.34, "end": 21332.9, "localBegin": 150.08, "localEnd": 155.64}, {"id": "c013_f000018", "text": "'... even more work for me! Mopping all night, like I haven't got enough to do! No, this is the final straw, I'm going to Dumbledore ...'", "begin": 21332.9, "end": 21341.82, "localBegin": 155.64, "localEnd": 164.56}, {"id": "c013_f000019", "text": "His footsteps receded and they heard a distant door slam.", "begin": 21341.82, "end": 21347.58, "localBegin": 164.56, "localEnd": 170.32}, {"id": "c013_f000020", "text": "They poked their heads around the corner. Filch had clearly been manning his usual lookout post: they were once again on the spot where Mrs Norris had been attacked. They saw at a glance what Filch had been shouting about. A great flood of water stretched over half the corridor, and it looked as though it was still seeping from under the door of Moaning Myrtle's bathroom. Now Filch had stopped shouting, they could hear Myrtle's wails echoing off the bathroom walls.", "begin": 21347.58, "end": 21373.38, "localBegin": 170.32, "localEnd": 196.12}, {"id": "c013_f000021", "text": "'Now what's up with her?' said Ron.", "begin": 21373.38, "end": 21376.14, "localBegin": 196.12, "localEnd": 198.88}, {"id": "c013_f000022", "text": "'Let's go and see,' said Harry, and holding their robes over their ankles they stepped through the great wash of water to the door bearing its 'Out of Order' sign, ignored it as always, and entered.", "begin": 21376.14, "end": 21388.58, "localBegin": 198.88, "localEnd": 211.32}, {"id": "c013_f000023", "text": "Moaning Myrtle was crying, if possible, louder and harder than ever before. She seemed to be hiding down her usual toilet. It was dark in the bathroom, because the candles had been extinguished in the great rush of water that had left both walls and floor soaking wet.", "begin": 21388.58, "end": 21403.66, "localBegin": 211.32, "localEnd": 226.4}, {"id": "c013_f000024", "text": "'What's up, Myrtle?' said Harry.", "begin": 21403.66, "end": 21406.3, "localBegin": 226.4, "localEnd": 229.04}, {"id": "c013_f000025", "text": "'Who's that?' glugged Myrtle miserably. 'Come to throw some-", "begin": 21406.3, "end": 21410.66, "localBegin": 229.04, "localEnd": 233.4}, {"id": "c013_f000026", "text": "thing else at me?'", "begin": 21410.66, "end": 21413.06, "localBegin": 233.4, "localEnd": 235.8}, {"id": "c013_f000027", "text": "Harry waded across to her cubicle and said, 'Why would I throw something at you?'", "begin": 21413.06, "end": 21418.42, "localBegin": 235.8, "localEnd": 241.16}, {"id": "c013_f000028", "text": "'Don't ask me,' Myrtle shouted, emerging with a wave of yet more water, which splashed onto the already sopping floor. 'Here I am, minding my own business, and someone thinks it's funny to throw a book at me ...'", "begin": 21418.42, "end": 21433.1, "localBegin": 241.16, "localEnd": 255.84}, {"id": "c013_f000029", "text": "'But it can't hurt you if someone throws something at you,' said Harry, reasonably. 'I mean, it'd just go right through you, wouldn't it?'", "begin": 21433.1, "end": 21441.14, "localBegin": 255.84, "localEnd": 263.88}, {"id": "c013_f000030", "text": "He had said the wrong thing. Myrtle puffed herself up and shrieked, 'Let's all throw books at Myrtle, because she can't feel it! Ten points if you can get it through her stomach! Fifty points if it goes through her head! Well, ha ha ha! What a lovely game, I don't think!'", "begin": 21441.14, "end": 21461.62, "localBegin": 263.88, "localEnd": 284.36}, {"id": "c013_f000031", "text": "'Who threw it at you, anyway?' asked Harry.", "begin": 21461.62, "end": 21464.78, "localBegin": 284.36, "localEnd": 287.52}, {"id": "c013_f000032", "text": "'I don't know ... I was just sitting in the U-bend, thinking about death, and it fell right through the top of my head,' said Myrtle, glaring at them. 'It's over there, it got washed out.'", "begin": 21464.78, "end": 21479.22, "localBegin": 287.52, "localEnd": 301.96}, {"id": "c013_f000033", "text": "Harry and Ron looked under the sink, where Myrtle was pointing. A small, thin book lay there. It had a shabby black cover and was as wet as everything else in the bathroom. Harry stepped forward to pick it up, but Ron suddenly flung out an arm to hold him back.", "begin": 21479.22, "end": 21494.02, "localBegin": 301.96, "localEnd": 316.76}, {"id": "c013_f000034", "text": "'What?' said Harry.", "begin": 21494.02, "end": 21495.74, "localBegin": 316.76, "localEnd": 318.48}, {"id": "c013_f000035", "text": "'Are you mad?' said Ron. 'It could be dangerous.'", "begin": 21495.74, "end": 21499.42, "localBegin": 318.48, "localEnd": 322.16}, {"id": "c013_f000036", "text": "'Dangerous?' said Harry, laughing. 'Come off it, how could it be dangerous?'", "begin": 21499.42, "end": 21505.02, "localBegin": 322.16, "localEnd": 327.76}, {"id": "c013_f000037", "text": "'You'd be surprised,' said Ron, who was looking apprehensively at the book. 'Some of the books the Ministry's confiscated - Dad's told me - there was one that burned your eyes out. And everyone who read Sonnets of a Sorcerer spoke in limericks for the rest of their lives. And some old witch in Bath had a book that you could never stop reading! You just had to wander around with your nose in it, trying to do everything one-handed. And -'", "begin": 21505.02, "end": 21530.5, "localBegin": 327.76, "localEnd": 353.24}, {"id": "c013_f000038", "text": "'All right, I've got the point,' said Harry.", "begin": 21530.5, "end": 21534.3, "localBegin": 353.24, "localEnd": 357.04}, {"id": "c013_f000039", "text": "The little book lay on the floor, nondescript and soggy.", "begin": 21534.3, "end": 21537.62, "localBegin": 357.04, "localEnd": 360.36}, {"id": "c013_f000040", "text": "'Well, we won't find out unless we look at it,' he said, and he ducked round Ron and picked it off the floor.", "begin": 21537.62, "end": 21544.18, "localBegin": 360.36, "localEnd": 366.92}, {"id": "c013_f000041", "text": "Harry saw at once that it was a diary, and the faded year on the", "begin": 21544.18, "end": 21547.82, "localBegin": 366.92, "localEnd": 370.56}, {"id": "c013_f000042", "text": "cover told him it was fifty years old. He opened it eagerly. On the first page he could just make out the name 'T. M. Riddle' in smudged ink.", "begin": 21547.82, "end": 21557.3, "localBegin": 370.56, "localEnd": 380.04}, {"id": "c013_f000043", "text": "'Hang on,' said Ron, who had approached cautiously and was looking over Harry's shoulder. 'I know that name ... T. M. Riddle got an award for special services to the school fifty years ago.'", "begin": 21557.3, "end": 21570.42, "localBegin": 380.04, "localEnd": 393.16}, {"id": "c013_f000044", "text": "'How on earth d'you know that?' said Harry in amazement.", "begin": 21570.42, "end": 21573.82, "localBegin": 393.16, "localEnd": 396.56}, {"id": "c013_f000045", "text": "'Because Filch made me polish his shield about fifty times in detention,' said Ron resentfully. 'That was the one I burped slugs all over. If you'd wiped slime off a name for an hour, you'd remember it, too.'", "begin": 21573.82, "end": 21584.62, "localBegin": 396.56, "localEnd": 407.36}, {"id": "c013_f000046", "text": "Harry peeled the wet pages apart. They were completely blank. There wasn't the faintest trace of writing on any of them, not even 'Auntie Mabel's birthday', or 'dentist, half past three'.", "begin": 21584.62, "end": 21597.62, "localBegin": 407.36, "localEnd": 420.36}, {"id": "c013_f000047", "text": "'He never wrote in it,' said Harry, disappointed.", "begin": 21597.62, "end": 21601.34, "localBegin": 420.36, "localEnd": 424.08}, {"id": "c013_f000048", "text": "'I wonder why someone wanted to flush it away?' said Ron curiously.", "begin": 21601.34, "end": 21605.58, "localBegin": 424.08, "localEnd": 428.32}, {"id": "c013_f000049", "text": "Harry turned to the back cover of the book and saw the printed name of a newsagent's in Vauxhall Road, London.", "begin": 21605.58, "end": 21613.06, "localBegin": 428.32, "localEnd": 435.8}, {"id": "c013_f000050", "text": "'He must've been Muggle-born,' said Harry thoughtfully, 'to have bought a diary from Vauxhall Road ...'", "begin": 21613.06, "end": 21619.78, "localBegin": 435.8, "localEnd": 442.52}, {"id": "c013_f000051", "text": "'Well, it's not much use to you,' said Ron. He dropped his voice. 'Fifty points if you can get it through Myrtle's nose.'", "begin": 21619.78, "end": 21627.14, "localBegin": 442.52, "localEnd": 449.88}, {"id": "c013_f000052", "text": "Harry, however, pocketed it. * Hermione left the hospital wing, de-whiskered, tail-less and furfree, at the beginning of February. On her first evening back in Gryffindor Tower, Harry showed her T. M. Riddle's diary and told her the story of how they had found it.", "begin": 21627.14, "end": 21645.42, "localBegin": 449.88, "localEnd": 468.16}, {"id": "c013_f000053", "text": "'Oooh, it might have hidden powers,' said Hermione enthusiastically, taking the diary and looking at it closely.", "begin": 21645.42, "end": 21652.5, "localBegin": 468.16, "localEnd": 475.24}, {"id": "c013_f000054", "text": "'If it has, it's hiding them very well,' said Ron. 'Maybe it's shy. I don't know why you don't chuck it, Harry.'", "begin": 21652.5, "end": 21659.46, "localBegin": 475.24, "localEnd": 482.2}, {"id": "c013_f000055", "text": "'I wish I knew why someone did try to chuck it,' said Harry. 'I wouldn't mind knowing how Riddle got an award for special services to Hogwarts, either.'", "begin": 21659.46, "end": 21668.02, "localBegin": 482.2, "localEnd": 490.76}, {"id": "c013_f000056", "text": "'Could've been anything,' said Ron. 'Maybe he got thirty O.W.Ls or saved a teacher from the giant squid. Maybe he murdered Myrtle, that would've done everyone a favour ...'", "begin": 21668.02, "end": 21679.54, "localBegin": 490.76, "localEnd": 502.28}, {"id": "c013_f000057", "text": "But Harry could tell from the arrested look on Hermione's face", "begin": 21679.54, "end": 21682.58, "localBegin": 502.28, "localEnd": 505.32}, {"id": "c013_f000058", "text": "that she was thinking what he was thinking.", "begin": 21682.58, "end": 21685.34, "localBegin": 505.32, "localEnd": 508.08}, {"id": "c013_f000059", "text": "'What?' said Ron, looking from one to the other.", "begin": 21685.34, "end": 21688.74, "localBegin": 508.08, "localEnd": 511.48}, {"id": "c013_f000060", "text": "'Well, the Chamber of Secrets was opened fifty years ago, wasn't it?' he said. 'That's what Malfoy said.'", "begin": 21688.74, "end": 21695.9, "localBegin": 511.48, "localEnd": 518.64}, {"id": "c013_f000061", "text": "'Yeah ...' said Ron slowly.", "begin": 21695.9, "end": 21698.14, "localBegin": 518.64, "localEnd": 520.88}, {"id": "c013_f000062", "text": "'And this diary is fifty years old,' said Hermione, tapping it excitedly.", "begin": 21698.14, "end": 21703.1, "localBegin": 520.88, "localEnd": 525.84}, {"id": "c013_f000063", "text": "'So?'", "begin": 21703.1, "end": 21704.42, "localBegin": 525.84, "localEnd": 527.16}, {"id": "c013_f000064", "text": "'Oh, Ron, wake up,' snapped Hermione. 'We know the person who opened the Chamber last time was expelled fifty years ago. We know T. M. Riddle got an award for special services to the school fifty years ago. Well, what if Riddle got his special award for catching the heir of Slytherin? His diary would probably tell us everything: where the Chamber is, and how to open it, and what sort of creature lives in it. The person who's behind the attacks this time wouldn't want that lying around, would they?'", "begin": 21704.42, "end": 21734.06, "localBegin": 527.16, "localEnd": 556.8}, {"id": "c013_f000065", "text": "'That's a brilliant theory, Hermione,' said Ron, 'with just one tiny little flaw. There's nothing written in his diary.'", "begin": 21734.06, "end": 21742.54, "localBegin": 556.8, "localEnd": 565.28}, {"id": "c013_f000066", "text": "But Hermione was pulling her wand out of her bag.", "begin": 21742.54, "end": 21745.9, "localBegin": 565.28, "localEnd": 568.64}, {"id": "c013_f000067", "text": "'It might be invisible ink!' she whispered.", "begin": 21745.9, "end": 21749.94, "localBegin": 568.64, "localEnd": 572.68}, {"id": "c013_f000068", "text": "She tapped the diary three times and said, 'Aparecium!'", "begin": 21749.94, "end": 21755.18, "localBegin": 572.68, "localEnd": 577.92}, {"id": "c013_f000069", "text": "Nothing happened. Undaunted, Hermione shoved her hand back into her bag and pulled out what appeared to be a bright red eraser.", "begin": 21755.18, "end": 21764.3, "localBegin": 577.92, "localEnd": 587.04}, {"id": "c013_f000070", "text": "'It's a Revealer, I got it in Diagon Alley,' she said.", "begin": 21764.3, "end": 21768.58, "localBegin": 587.04, "localEnd": 591.32}, {"id": "c013_f000071", "text": "She rubbed hard on 'January the first'. Nothing happened.", "begin": 21768.58, "end": 21772.98, "localBegin": 591.32, "localEnd": 595.72}, {"id": "c013_f000072", "text": "'I'm telling you, there's nothing to find in there,' said Ron. 'Riddle just got a diary for Christmas and couldn't be bothered filling it in.' * Harry couldn't explain, even to himself, why he didn't just throw Riddle's diary away. The fact was that even though he knew the diary was blank, he kept absent-mindedly picking it up and turning the pages, as though it was a story he wanted to finish. And while Harry was sure he had never heard the name T. M. Riddle before, it still seemed to mean something to him, almost as though Riddle was a friend he'd had when he was very small, and half-forgotten. But this was absurd. He'd never had friends before Hogwarts, Dudley had made sure of that.", "begin": 21772.98, "end": 21816.58, "localBegin": 595.72, "localEnd": 639.32}, {"id": "c013_f000073", "text": "Nevertheless, Harry was determined to find out more about", "begin": 21816.58, "end": 21820.7, "localBegin": 639.32, "localEnd": 643.44}, {"id": "c013_f000074", "text": "Riddle, so, next day at break, he headed for the trophy room to examine Riddle's special award, accompanied by an interested Hermione and a thoroughly unconvinced Ron, who told them he'd seen enough of the trophy room to last him a lifetime.", "begin": 21820.7, "end": 21834.3, "localBegin": 643.44, "localEnd": 657.04}, {"id": "c013_f000075", "text": "Riddle's burnished gold shield was tucked away in a corner cabinet. It didn't carry details of why it had been given to him ('Good thing, too, or it'd be even bigger and I'd still be polishing it,' said Ron). However, they did find Riddle's name on an old Medal for Magical Merit, and on a list of old Head Boys.", "begin": 21834.3, "end": 21855.62, "localBegin": 657.04, "localEnd": 678.36}, {"id": "c013_f000076", "text": "'He sounds like Percy,' said Ron, wrinkling his nose in disgust. 'Prefect, Head Boy - probably top of every class.'", "begin": 21855.62, "end": 21863.18, "localBegin": 678.36, "localEnd": 685.92}, {"id": "c013_f000077", "text": "'You say that like it's a bad thing,' said Hermione, in a slightly hurt voice. * The sun had now begun to shine weakly on Hogwarts again. Inside the castle, the mood had grown more hopeful. There had been no more attacks since those on Justin and Nearly Headless Nick, and Madam Pomfrey was pleased to report that the Mandrakes were becoming moody and secretive, meaning that they were fast leaving childhood.", "begin": 21863.18, "end": 21891.02, "localBegin": 685.92, "localEnd": 713.76}, {"id": "c013_f000078", "text": "'The moment their acne clears up, they'll be ready for repotting again,' Harry heard her telling Filch kindly one afternoon. 'And after that, it won't be long until we're cutting them up and stewing them. You'll have Mrs Norris back in no time.'", "begin": 21891.02, "end": 21906.74, "localBegin": 713.76, "localEnd": 729.48}, {"id": "c013_f000079", "text": "Perhaps the heir of Slytherin had lost his or her nerve, thought Harry. It must be getting riskier and riskier to open the Chamber of Secrets, with the school so alert and suspicious. Perhaps the monster, whatever it was, was even now settling itself down to hibernate for another fifty years ...", "begin": 21906.74, "end": 21924.66, "localBegin": 729.48, "localEnd": 747.4}, {"id": "c013_f000080", "text": "Ernie Macmillan of Hufflepuff didn't take this cheerful view. He was still convinced that Harry was the guilty one, that he had 'given himself away' at the Duelling Club. Peeves wasn't helping matters: he kept popping up in the crowded corridors singing 'Oh Potter, you rotter ...', now with a dance-routine to match.", "begin": 21924.66, "end": 21944.34, "localBegin": 747.4, "localEnd": 767.08}, {"id": "c013_f000081", "text": "Gilderoy Lockhart seemed to think he himself had made the attacks stop. Harry overheard him telling Professor McGonagall so while the Gryffindors were lining up for Transfiguration.", "begin": 21944.34, "end": 21955.58, "localBegin": 767.08, "localEnd": 778.32}, {"id": "c013_f000082", "text": "'I don't think there'll be any more trouble, Minerva,' he said, tapping his nose knowingly and winking. 'I think the Chamber has been locked for good this time. The culprit must have known", "begin": 21955.58, "end": 21966.98, "localBegin": 778.32, "localEnd": 789.72}, {"id": "c013_f000083", "text": "it was only a matter of time before I caught them. Rather sensible to stop now, before I came down hard on them.", "begin": 21966.98, "end": 21975.74, "localBegin": 789.72, "localEnd": 798.48}, {"id": "c013_f000084", "text": "'You know, what the school needs now is a morale-booster. Wash away the memories of last term! I won't say any more just now, but I think I know just the thing ...'", "begin": 21975.74, "end": 21987.3, "localBegin": 798.48, "localEnd": 810.04}, {"id": "c013_f000085", "text": "He tapped his nose again and strode off.", "begin": 21987.3, "end": 21990.3, "localBegin": 810.04, "localEnd": 813.04}, {"id": "c013_f000086", "text": "Lockhart's idea of a morale-booster became clear at breakfast time on February the fourteenth. Harry hadn't had much sleep because of a late-running Quidditch practice the night before, and he hurried down to the Great Hall slightly late. He thought, for a moment, that he'd walked through the wrong doors.", "begin": 21990.3, "end": 22008.9, "localBegin": 813.04, "localEnd": 831.64}, {"id": "c013_f000087", "text": "The walls were all covered with large, lurid pink flowers. Worse still, heart-shaped confetti was falling from the pale blue ceiling. Harry went over to the Gryffindor table, where Ron was sitting looking sickened, and Hermione seemed to have come over rather giggly.", "begin": 22008.9, "end": 22024.94, "localBegin": 831.64, "localEnd": 847.68}, {"id": "c013_f000088", "text": "'What's going on?' Harry asked them, sitting down, and wiping confetti off his bacon.", "begin": 22024.94, "end": 22030.66, "localBegin": 847.68, "localEnd": 853.4}, {"id": "c013_f000089", "text": "Ron pointed to the teachers' table, apparently too disgusted to speak. Lockhart, wearing lurid pink robes to match the decorations, was waving for silence. The teachers on either side of him were looking stony-faced. From where he sat, Harry could see a muscle going in Professor McGonagall's cheek. Snape looked as though someone had just fed him a large beaker of Skele-Gro.", "begin": 22030.66, "end": 22052.58, "localBegin": 853.4, "localEnd": 875.32}, {"id": "c013_f000090", "text": "'Happy Valentine's Day!' Lockhart shouted. 'And may I thank the forty-six people who have so far sent me cards! Yes, I have taken the liberty of arranging this little surprise for you all - and it doesn't end here!'", "begin": 22052.58, "end": 22071.22, "localBegin": 875.32, "localEnd": 893.96}, {"id": "c013_f000091", "text": "Lockhart clapped his hands and through the doors to the Entrance Hall marched a dozen surly-looking dwarfs. Not just any dwarfs, however. Lockhart had them all wearing golden wings and carrying harps.", "begin": 22071.22, "end": 22083.62, "localBegin": 893.96, "localEnd": 906.36}, {"id": "c013_f000092", "text": "'My friendly, card-carrying cupids!' beamed Lockhart. 'They will be roving around the school today delivering your Valentines! And the fun doesn't stop here! I'm sure my colleagues will want to enter into the spirit of the occasion! Why not ask Professor Snape to show you how to whip up a Love Potion! And while you're at it, Professor Flitwick knows more about Entrancing Enchantments than any wizard I've ever met, the sly old dog!'", "begin": 22083.62, "end": 22115.66, "localBegin": 906.36, "localEnd": 938.4}, {"id": "c013_f000093", "text": "Professor Flitwick buried his face in his hands. Snape was look-", "begin": 22115.66, "end": 22120.26, "localBegin": 938.4, "localEnd": 943.0}, {"id": "c013_f000094", "text": "ing as though the first person to ask him for a Love Potion would be force-fed poison.", "begin": 22120.26, "end": 22125.38, "localBegin": 943.0, "localEnd": 948.12}, {"id": "c013_f000095", "text": "'Please, Hermione, tell me you weren't one of the forty-six,' said Ron, as they left the Great Hall for their first lesson. Hermione suddenly became very interested in searching her bag for her timetable and didn't answer.", "begin": 22125.38, "end": 22139.7, "localBegin": 948.12, "localEnd": 962.44}, {"id": "c013_f000096", "text": "All day long, the dwarfs kept barging into their classes to deliver Valentines, to the annoyance of the teachers, and late that afternoon, as the Gryffindors were walking upstairs for Charms, one of them caught up with Harry.", "begin": 22139.7, "end": 22151.86, "localBegin": 962.44, "localEnd": 974.6}, {"id": "c013_f000097", "text": "'Oy, you! 'Arry Potter!' shouted a particularly grim-looking dwarf, elbowing people out of the way to get to Harry.", "begin": 22151.86, "end": 22160.58, "localBegin": 974.6, "localEnd": 983.32}, {"id": "c013_f000098", "text": "Hot all over at the thought of being given a Valentine in front of a queue of first-years, which happened to include Ginny Weasley, Harry tried to escape. The dwarf, however, cut his way through the crowd by kicking people's shins, and reached him before he'd gone two paces.", "begin": 22160.58, "end": 22176.94, "localBegin": 983.32, "localEnd": 999.68}, {"id": "c013_f000099", "text": "'I've got a musical message to deliver to 'Arry Potter in person,' he said, twanging his harp in a threatening sort of way.", "begin": 22176.94, "end": 22185.34, "localBegin": 999.68, "localEnd": 1008.08}, {"id": "c013_f000100", "text": "'Not here,' Harry hissed, trying to escape.", "begin": 22185.34, "end": 22188.94, "localBegin": 1008.08, "localEnd": 1011.68}, {"id": "c013_f000101", "text": "'Stay still!' grunted the dwarf, grabbing hold of Harry's bag and pulling him back.", "begin": 22188.94, "end": 22194.14, "localBegin": 1011.68, "localEnd": 1016.88}, {"id": "c013_f000102", "text": "'Let me go!' Harry snarled, tugging.", "begin": 22194.14, "end": 22198.18, "localBegin": 1016.88, "localEnd": 1020.92}, {"id": "c013_f000103", "text": "With a loud ripping noise, his bag split in two. His books, wand, parchment and quill spilled onto the floor and his ink bottle smashed over the lot.", "begin": 22198.18, "end": 22207.58, "localBegin": 1020.92, "localEnd": 1030.32}, {"id": "c013_f000104", "text": "Harry scrambled around, trying to pick it all up before the dwarf started singing, causing something of a hold-up in the corridor.", "begin": 22207.58, "end": 22214.3, "localBegin": 1030.32, "localEnd": 1037.04}, {"id": "c013_f000105", "text": "'What's going on here?' came the cold, drawling voice of Draco Malfoy. Harry started stuffing everything feverishly into his ripped bag, desperate to get away before Malfoy could hear his musical Valentine.", "begin": 22214.3, "end": 22228.3, "localBegin": 1037.04, "localEnd": 1051.04}, {"id": "c013_f000106", "text": "'What's all this commotion?' said another familiar voice, as Percy Weasley arrived.", "begin": 22228.3, "end": 22234.02, "localBegin": 1051.04, "localEnd": 1056.76}, {"id": "c013_f000107", "text": "Losing his head, Harry tried to make a run for it, but the dwarf seized him around the knees and brought him crashing to the floor.", "begin": 22234.02, "end": 22240.74, "localBegin": 1056.76, "localEnd": 1063.48}, {"id": "c013_f000108", "text": "'Right,' he said, sitting on Harry's ankles, 'here is your singing Valentine:", "begin": 22240.74, "end": 22245.78, "localBegin": 1063.48, "localEnd": 1068.52}, {"id": "c013_f000109", "text": "'His eyes are as green as afresh pickled toad,", "begin": 22245.78, "end": 22250.98, "localBegin": 1068.52, "localEnd": 1073.72}, {"id": "c013_f000110", "text": "His hair is as dark as a blackboard.", "begin": 22250.98, "end": 22255.38, "localBegin": 1073.72, "localEnd": 1078.12}, {"id": "c013_f000111", "text": "I wish he was mine, he's really divine,", "begin": 22255.38, "end": 22261.22, "localBegin": 1078.12, "localEnd": 1083.96}, {"id": "c013_f000112", "text": "The hero who conquered the Dark Lord.'", "begin": 22261.22, "end": 22266.34, "localBegin": 1083.96, "localEnd": 1089.08}, {"id": "c013_f000113", "text": "Harry would have given all the gold in Gringotts to evaporate on the spot. Trying valiantly to laugh along with everyone else, he got up, his feet numb from the weight of the dwarf, as Percy Weasley did his best to disperse the crowd, some of whom were crying with mirth.", "begin": 22266.34, "end": 22284.22, "localBegin": 1089.08, "localEnd": 1106.96}, {"id": "c013_f000114", "text": "'Off you go, off you go, the bell rang five minutes ago, off to class, now,' he said, shooing some of the younger students away. 'And you, Malfoy.'", "begin": 22284.22, "end": 22293.54, "localBegin": 1106.96, "localEnd": 1116.28}, {"id": "c013_f000115", "text": "Harry, glancing over, saw Malfoy stoop and snatch up something. Leering, he showed it to Crabbe and Goyle, and Harry realised that he'd got Riddle's diary.", "begin": 22293.54, "end": 22303.74, "localBegin": 1116.28, "localEnd": 1126.48}, {"id": "c013_f000116", "text": "'Give that back,' said Harry quietly.", "begin": 22303.74, "end": 22307.22, "localBegin": 1126.48, "localEnd": 1129.96}, {"id": "c013_f000117", "text": "'Wonder what Potter's written in this?' said Malfoy, who obviously hadn't noticed the year on the cover, and thought he had Harry's own diary. A hush fell over the onlookers. Ginny was staring from the diary to Harry, looking terrified.", "begin": 22307.22, "end": 22321.58, "localBegin": 1129.96, "localEnd": 1144.32}, {"id": "c013_f000118", "text": "'Hand it over, Malfoy,' said Percy sternly.", "begin": 22321.58, "end": 22326.18, "localBegin": 1144.32, "localEnd": 1148.92}, {"id": "c013_f000119", "text": "'When I've had a look,' said Malfoy, waving the diary tauntingly at Harry.", "begin": 22326.18, "end": 22331.78, "localBegin": 1148.92, "localEnd": 1154.52}, {"id": "c013_f000120", "text": "Percy said, 'As a school Prefect -', but Harry had lost his temper. He pulled out his wand and shouted, 'Expelliarmus!' and just as Snape had disarmed Lockhart, so Malfoy found the diary shooting out of his hand into the air. Ron, grinning broadly, caught it.", "begin": 22331.78, "end": 22348.66, "localBegin": 1154.52, "localEnd": 1171.4}, {"id": "c013_f000121", "text": "'Harry!' said Percy loudly. 'No magic in the corridors. I'll have to report this, you know!'", "begin": 22348.66, "end": 22354.54, "localBegin": 1171.4, "localEnd": 1177.28}, {"id": "c013_f000122", "text": "But Harry didn't care, he'd got one over on Malfoy, and that was worth five points from Gryffindor any day. Malfoy was looking furious, and as Ginny passed him to enter her classroom, he yelled spitefully after her, 'I don't think Potter liked your Valentine much!'", "begin": 22354.54, "end": 22372.22, "localBegin": 1177.28, "localEnd": 1194.96}, {"id": "c013_f000123", "text": "Ginny covered her face with her hands and ran into class. Snarling, Ron pulled out his wand, too, but Harry pulled him away. Ron didn't need to spend the whole of Charms belching slugs.", "begin": 22372.22, "end": 22384.86, "localBegin": 1194.96, "localEnd": 1207.6}, {"id": "c013_f000124", "text": "It wasn't until they had reached Professor Flitwick's class that Harry noticed something rather odd about Riddle's diary. All his", "begin": 22384.86, "end": 22392.18, "localBegin": 1207.6, "localEnd": 1214.92}, {"id": "c013_f000125", "text": "other books were drenched in scarlet ink. The diary, however, was as clean as it had been before the ink bottle had smashed all over it. He tried to point this out to Ron, but Ron was having trouble with his wand again; large purple bubbles were blossoming out of the end, and he wasn't much interested in anything else. * Harry went to bed before anyone else in his dormitory that night. This was partly because he didn't think he could stand Fred and George singing, 'His eyes are as green as a fresh pickled toad', one more time, and partly because he wanted to examine Riddle's diary again, and knew that Ron thought he was wasting his time.", "begin": 22392.18, "end": 22434.42, "localBegin": 1214.92, "localEnd": 1257.16}, {"id": "c013_f000126", "text": "Harry sat on his four-poster and flicked through the blank pages, not one of which had a trace of scarlet ink on it. Then he pulled a new bottle out of his bedside cabinet, dipped his quill into it, and dropped a blot onto the first page of the diary.", "begin": 22434.42, "end": 22450.66, "localBegin": 1257.16, "localEnd": 1273.4}, {"id": "c013_f000127", "text": "The ink shone brightly on the paper for a second and then, as though it was being sucked into the page, vanished. Excited, Harry loaded up his quill a second time and wrote, 'My name is Harry Potter.'", "begin": 22450.66, "end": 22463.74, "localBegin": 1273.4, "localEnd": 1286.48}, {"id": "c013_f000128", "text": "The words shone momentarily on the page and they too sank without trace. Then, at last, something happened.", "begin": 22463.74, "end": 22473.26, "localBegin": 1286.48, "localEnd": 1296.0}, {"id": "c013_f000129", "text": "Oozing back out of the page, in his very own ink, came words Harry had never written.", "begin": 22473.26, "end": 22481.98, "localBegin": 1296.0, "localEnd": 1304.72}, {"id": "c013_f000130", "text": "'Hello, Harry Potter. My name is Tom Riddle. How did you come by my diary?'", "begin": 22481.98, "end": 22489.94, "localBegin": 1304.72, "localEnd": 1312.68}, {"id": "c013_f000131", "text": "These words, too, faded away, but not before Harry had started to scribble back.", "begin": 22489.94, "end": 22495.42, "localBegin": 1312.68, "localEnd": 1318.16}, {"id": "c013_f000132", "text": "'Someone tried to flush it down a toilet.'", "begin": 22495.42, "end": 22499.1, "localBegin": 1318.16, "localEnd": 1321.84}, {"id": "c013_f000133", "text": "He waited eagerly for Riddle's reply.", "begin": 22499.1, "end": 22502.02, "localBegin": 1321.84, "localEnd": 1324.76}, {"id": "c013_f000134", "text": "'Lucky that I recorded my memories in some more lasting way than ink. But I always knew that there would be those who would not want this diary read.'", "begin": 22502.02, "end": 22513.14, "localBegin": 1324.76, "localEnd": 1335.88}, {"id": "c013_f000135", "text": "'What do you mean?' Harry scrawled, blotting the page in his excitement.", "begin": 22513.14, "end": 22518.94, "localBegin": 1335.88, "localEnd": 1341.68}, {"id": "c013_f000136", "text": "'I mean that this diary holds memories of terrible things. Things which were covered up. Things which happened at Hogwarts School of Witchcraft and Wizardry.'", "begin": 22518.94, "end": 22528.66, "localBegin": 1341.68, "localEnd": 1351.4}, {"id": "c013_f000137", "text": "'That's where I am now,' Harry wrote quickly. 'I'm at Hogwarts, and horrible stuff's been happening. Do you know anything about the Chamber of Secrets?'", "begin": 22528.66, "end": 22538.22, "localBegin": 1351.4, "localEnd": 1360.96}, {"id": "c013_f000138", "text": "His heart was hammering. Riddle's reply came quickly, his writing becoming untidier, as though he was hurrying to tell all he knew.", "begin": 22538.22, "end": 22546.1, "localBegin": 1360.96, "localEnd": 1368.84}, {"id": "c013_f000139", "text": "'Of course I know about the Chamber of Secrets. In my day, they told us it was a legend, that it did not exist. But this was a lie. In my fifth year, the Chamber was opened and the monster attacked several students, finally killing one. I caught the person who'd opened the Chamber and he was expelled. But the Headmaster, Professor Dippet, ashamed that such a thing had happened at Hogwarts, forbade me to tell the truth. A story was given out that the girl had died in a freak accident. They gave me a nice, shiny, engraved trophy for my trouble and warned me to keep my mouth shut. But I knew it could happen again. The monster lived on, and the one who had the power to release it was not imprisoned.'", "begin": 22546.1, "end": 22587.82, "localBegin": 1368.84, "localEnd": 1410.56}, {"id": "c013_f000140", "text": "Harry nearly upset his ink bottle in his hurry to write back.", "begin": 22587.82, "end": 22591.66, "localBegin": 1410.56, "localEnd": 1414.4}, {"id": "c013_f000141", "text": "'It's happening again now. There have been three attacks and no one seems to know who's behind them. Who was it last time?'", "begin": 22591.66, "end": 22598.58, "localBegin": 1414.4, "localEnd": 1421.32}, {"id": "c013_f000142", "text": "'I can show you, if you like,' came Riddle's reply. 'You don't have to take my word for it. I can take you inside my memory of the night when I caught him.'", "begin": 22598.58, "end": 22610.22, "localBegin": 1421.32, "localEnd": 1432.96}, {"id": "c013_f000143", "text": "Harry hesitated, his quill suspended over the diary. What did Riddle mean? How could he be taken inside somebody else's memory? He glanced nervously at the door to the dormitory, which was growing dark. When he looked back at the diary, he saw fresh words forming.", "begin": 22610.22, "end": 22626.3, "localBegin": 1432.96, "localEnd": 1449.04}, {"id": "c013_f000144", "text": "'Let me show you.'", "begin": 22626.3, "end": 22628.38, "localBegin": 1449.04, "localEnd": 1451.12}, {"id": "c013_f000145", "text": "Harry paused for a fraction of a second and then wrote two letters.", "begin": 22628.38, "end": 22634.06, "localBegin": 1451.12, "localEnd": 1456.8}, {"id": "c013_f000146", "text": "'OK.'", "begin": 22634.06, "end": 22635.78, "localBegin": 1456.8, "localEnd": 1458.52}, {"id": "c013_f000147", "text": "The pages of the diary began to blow as though caught in a high wind, stopping halfway through the month of June. Mouth hanging open, Harry saw that the little square for June the thirteenth seemed to have turned into a minuscule television screen. His hands trembling slightly, he raised the book to press his eye against the little window, and before he knew what was happening, he was tilting forwards; the window was widening, he felt his body leave his bed and he was pitched headfirst through the opening in the page, into a whirl of colour and shadow.", "begin": 22635.78, "end": 22666.86, "localBegin": 1458.52, "localEnd": 1489.6}, {"id": "c013_f000148", "text": "He felt his feet hit solid ground, and stood, shaking, as the blurred shapes around him came suddenly into focus.", "begin": 22666.86, "end": 22674.78, "localBegin": 1489.6, "localEnd": 1497.52}, {"id": "c013_f000149", "text": "He knew immediately where he was. This circular room with the sleeping portraits was Dumbledore's office - but it wasn't Dumbledore who was sitting behind the desk. A wizened, fraillooking wizard, bald except for a few wisps of white hair, was reading a letter by candlelight. Harry had never seen this man before.", "begin": 22674.78, "end": 22694.42, "localBegin": 1497.52, "localEnd": 1517.16}, {"id": "c013_f000150", "text": "'I'm sorry,' he said shakily, 'I didn't mean to butt in ...'", "begin": 22694.42, "end": 22698.82, "localBegin": 1517.16, "localEnd": 1521.56}, {"id": "c013_f000151", "text": "But the wizard didn't look up. He continued to read, frowning slightly. Harry drew nearer to his desk and stammered, 'Er - I'll just go, shall I?'", "begin": 22698.82, "end": 22708.9, "localBegin": 1521.56, "localEnd": 1531.64}, {"id": "c013_f000152", "text": "Still the wizard ignored him. He didn't seem even to have heard him. Thinking that the wizard might be deaf, Harry raised his voice.", "begin": 22708.9, "end": 22717.46, "localBegin": 1531.64, "localEnd": 1540.2}, {"id": "c013_f000153", "text": "'Sorry I disturbed you, I'll go now,' he half-shouted.", "begin": 22717.46, "end": 22722.1, "localBegin": 1540.2, "localEnd": 1544.84}, {"id": "c013_f000154", "text": "The wizard folded up the letter with a sigh, stood up, walked past Harry without glancing at him and went to draw the curtains at his window.", "begin": 22722.1, "end": 22730.3, "localBegin": 1544.84, "localEnd": 1553.04}, {"id": "c013_f000155", "text": "The sky outside the window was ruby red; it seemed to be sunset. The wizard went back to the desk, sat down and twiddled his thumbs, watching the door.", "begin": 22730.3, "end": 22740.82, "localBegin": 1553.04, "localEnd": 1563.56}, {"id": "c013_f000156", "text": "Harry looked around the office. No Fawkes the phoenix; no whirring silver contraptions. This was Hogwarts as Riddle had known it, meaning that this unknown wizard was Headmaster, not Dumbledore, and he, Harry, was little more than a phantom, completely invisible to the people of fifty years ago.", "begin": 22740.82, "end": 22761.62, "localBegin": 1563.56, "localEnd": 1584.36}, {"id": "c013_f000157", "text": "There was a knock on the office door.", "begin": 22761.62, "end": 22764.54, "localBegin": 1584.36, "localEnd": 1587.28}, {"id": "c013_f000158", "text": "'Enter,' said the old wizard in a feeble voice.", "begin": 22764.54, "end": 22769.1, "localBegin": 1587.28, "localEnd": 1591.84}, {"id": "c013_f000159", "text": "A boy of about sixteen entered, taking off his pointed hat. A silver Prefect's badge was glinting on his chest. He was much taller than Harry, but he, too, had jet-black hair.", "begin": 22769.1, "end": 22781.02, "localBegin": 1591.84, "localEnd": 1603.76}, {"id": "c013_f000160", "text": "'Ah, Riddle,' said the Headmaster.", "begin": 22781.02, "end": 22784.62, "localBegin": 1603.76, "localEnd": 1607.36}, {"id": "c013_f000161", "text": "'You wanted to see me, Professor Dippet?' said Riddle. He looked nervous.", "begin": 22784.62, "end": 22789.18, "localBegin": 1607.36, "localEnd": 1611.92}, {"id": "c013_f000162", "text": "'Sit down,' said Dippet. 'I've just been reading the letter you sent me.'", "begin": 22789.18, "end": 22795.5, "localBegin": 1611.92, "localEnd": 1618.24}, {"id": "c013_f000163", "text": "'Oh,' said Riddle. He sat down, gripping his hands together very tightly.", "begin": 22795.5, "end": 22800.9, "localBegin": 1618.24, "localEnd": 1623.64}, {"id": "c013_f000164", "text": "'My dear boy,' said Dippet kindly, 'I cannot possibly let you stay at school over the summer. Surely you want to go home for the holidays?'", "begin": 22800.9, "end": 22812.58, "localBegin": 1623.64, "localEnd": 1635.32}, {"id": "c013_f000165", "text": "'No,' said Riddle at once, 'I'd much rather stay at Hogwarts than go back to that - to that -'", "begin": 22812.58, "end": 22819.74, "localBegin": 1635.32, "localEnd": 1642.48}, {"id": "c013_f000166", "text": "'You live in a Muggle orphanage during the holidays, I believe?' said Dippet curiously.", "begin": 22819.74, "end": 22825.38, "localBegin": 1642.48, "localEnd": 1648.12}, {"id": "c013_f000167", "text": "'Yes, sir,' said Riddle, reddening slightly.", "begin": 22825.38, "end": 22829.38, "localBegin": 1648.12, "localEnd": 1652.12}, {"id": "c013_f000168", "text": "'You are Muggle-born?'", "begin": 22829.38, "end": 22831.54, "localBegin": 1652.12, "localEnd": 1654.28}, {"id": "c013_f000169", "text": "'Half-blood, sir,' said Riddle. 'Muggle father, witch mother.'", "begin": 22831.54, "end": 22835.9, "localBegin": 1654.28, "localEnd": 1658.64}, {"id": "c013_f000170", "text": "'And are both your parents -?'", "begin": 22835.9, "end": 22838.74, "localBegin": 1658.64, "localEnd": 1661.48}, {"id": "c013_f000171", "text": "'My mother died just after I was born, sir. They told me at the orphanage she lived just long enough to name me: Tom after my father, Marvolo after my grandfather.'", "begin": 22838.74, "end": 22850.94, "localBegin": 1661.48, "localEnd": 1673.68}, {"id": "c013_f000172", "text": "Dippet clucked his tongue sympathetically.", "begin": 22850.94, "end": 22852.94, "localBegin": 1673.68, "localEnd": 1675.68}, {"id": "c013_f000173", "text": "'The thing is, Tom,' he sighed, 'special arrangements might have been made for you, but in the current circumstances ...'", "begin": 22852.94, "end": 22861.54, "localBegin": 1675.68, "localEnd": 1684.28}, {"id": "c013_f000174", "text": "'You mean all these attacks, sir?' said Riddle, and Harry's heart leapt, and he moved closer, scared of missing anything.", "begin": 22861.54, "end": 22868.74, "localBegin": 1684.28, "localEnd": 1691.48}, {"id": "c013_f000175", "text": "'Precisely,' said the Headmaster. 'My dear boy, you must see how foolish it would be of me to allow you to remain at the castle when term ends. Particularly in the light of the recent tragedy ... the death of that poor little girl ... You will be safer by far at your orphanage. As a matter of fact, the Ministry of Magic is even now talking about closing the school. We are no nearer locating the er - source of all this unpleasantness ...'", "begin": 22868.74, "end": 22902.66, "localBegin": 1691.48, "localEnd": 1725.4}, {"id": "c013_f000176", "text": "Riddle's eyes had widened.", "begin": 22902.66, "end": 22905.1, "localBegin": 1725.4, "localEnd": 1727.84}, {"id": "c013_f000177", "text": "'Sir - if the person was caught ... If it all stopped ...'", "begin": 22905.1, "end": 22908.9, "localBegin": 1727.84, "localEnd": 1731.64}, {"id": "c013_f000178", "text": "'What do you mean?' said Dippet, with a squeak in his voice, sitting up in his chair. 'Riddle, do you mean you know something about these attacks?'", "begin": 22908.9, "end": 22918.54, "localBegin": 1731.64, "localEnd": 1741.28}, {"id": "c013_f000179", "text": "'No, sir,' said Riddle quickly.", "begin": 22918.54, "end": 22920.78, "localBegin": 1741.28, "localEnd": 1743.52}, {"id": "c013_f000180", "text": "But Harry was sure it was the same sort of 'no' that he himself had given Dumbledore.", "begin": 22920.78, "end": 22926.18, "localBegin": 1743.52, "localEnd": 1748.92}, {"id": "c013_f000181", "text": "Dippet sank back, looking faintly disappointed.", "begin": 22926.18, "end": 22929.66, "localBegin": 1748.92, "localEnd": 1752.4}, {"id": "c013_f000182", "text": "'You may go, Tom ...'", "begin": 22929.66, "end": 22931.78, "localBegin": 1752.4, "localEnd": 1754.52}, {"id": "c013_f000183", "text": "Riddle slid off his chair and stumped out of the room. Harry followed him.", "begin": 22931.78, "end": 22936.94, "localBegin": 1754.52, "localEnd": 1759.68}, {"id": "c013_f000184", "text": "Down the moving spiral staircase they went, emerging next to the gargoyle in the darkening corridor. Riddle stopped, and so did Harry, watching him. Harry could tell that Riddle was doing some serious thinking. He was biting his lip, his forehead furrowed.", "begin": 22936.94, "end": 22952.74, "localBegin": 1759.68, "localEnd": 1775.48}, {"id": "c013_f000185", "text": "Then, as though he had suddenly reached a decision, he hur-", "begin": 22952.74, "end": 22955.9, "localBegin": 1775.48, "localEnd": 1778.64}, {"id": "c013_f000186", "text": "ried off, Harry gliding noiselessly behind him. They didn't see another person until they reached the Entrance Hall, when a tall wizard with long, sweeping auburn hair and beard called to Riddle from the marble staircase.", "begin": 22955.9, "end": 22968.58, "localBegin": 1778.64, "localEnd": 1791.32}, {"id": "c013_f000187", "text": "'What are you doing, wandering around this late, Tom?'", "begin": 22968.58, "end": 22971.5, "localBegin": 1791.32, "localEnd": 1794.24}, {"id": "c013_f000188", "text": "Harry gaped at the wizard. He was none other than a fifty-year-younger Dumbledore.", "begin": 22971.5, "end": 22977.38, "localBegin": 1794.24, "localEnd": 1800.12}, {"id": "c013_f000189", "text": "'I had to see the Headmaster, sir,' said Riddle.", "begin": 22977.38, "end": 22980.78, "localBegin": 1800.12, "localEnd": 1803.52}, {"id": "c013_f000190", "text": "'Well, hurry off to bed,' said Dumbledore, giving Riddle exactly the kind of penetrating stare Harry knew so well. 'Best not to roam the corridors these days. Not since ...'", "begin": 22980.78, "end": 22991.86, "localBegin": 1803.52, "localEnd": 1814.6}, {"id": "c013_f000191", "text": "He sighed heavily, bade Riddle goodnight and strode off. Riddle watched him out of sight and then, moving quickly, headed straight down the stone steps to the dungeons, with Harry in hot pursuit.", "begin": 22991.86, "end": 23004.7, "localBegin": 1814.6, "localEnd": 1827.44}, {"id": "c013_f000192", "text": "But to Harry's disappointment, Riddle led him not into a hidden passageway or a secret tunnel but the very dungeon in which Harry had Potions with Snape. The torches hadn't been lit, and when Riddle pushed the door almost closed, Harry could only just see Riddle, standing stock-still by the door, watching the passage outside.", "begin": 23004.7, "end": 23024.9, "localBegin": 1827.44, "localEnd": 1847.64}, {"id": "c013_f000193", "text": "It felt to Harry that they were there for at least an hour. All he could see was the figure of Riddle at the door, staring through the crack, waiting like a statue. And just when Harry had stopped feeling expectant and tense, and started wishing he could return to the present, he heard something move beyond the door.", "begin": 23024.9, "end": 23043.62, "localBegin": 1847.64, "localEnd": 1866.36}, {"id": "c013_f000194", "text": "Someone was creeping along the passage. He heard whoever it was pass the dungeon where he and Riddle were hidden. Riddle, quiet as a shadow, edged through the door and followed, Harry tiptoeing behind him, forgetting that he couldn't be heard.", "begin": 23043.62, "end": 23059.98, "localBegin": 1866.36, "localEnd": 1882.72}, {"id": "c013_f000195", "text": "For perhaps five minutes they followed the footsteps, until Riddle stopped suddenly, his head inclined in the direction of new noises. Harry heard a door creak open, and then someone speaking in a hoarse whisper.", "begin": 23059.98, "end": 23073.86, "localBegin": 1882.72, "localEnd": 1896.6}, {"id": "c013_f000196", "text": "'C'mon ... gotta get yeh outta here ... c'mon now ... in the box ...'", "begin": 23073.86, "end": 23078.98, "localBegin": 1896.6, "localEnd": 1901.72}, {"id": "c013_f000197", "text": "There was something familiar about that voice.", "begin": 23078.98, "end": 23082.82, "localBegin": 1901.72, "localEnd": 1905.56}, {"id": "c013_f000198", "text": "Riddle suddenly jumped around the corner. Harry stepped out behind him. He could see the dark outline of a huge boy who was crouching in front of an open door, a very large box next to it.", "begin": 23082.82, "end": 23093.98, "localBegin": 1905.56, "localEnd": 1916.72}, {"id": "c013_f000199", "text": "'Evening, Rubeus,' said Riddle sharply.", "begin": 23093.98, "end": 23097.38, "localBegin": 1916.72, "localEnd": 1920.12}, {"id": "c013_f000200", "text": "The boy slammed the door shut and stood up.", "begin": 23097.38, "end": 23099.78, "localBegin": 1920.12, "localEnd": 1922.52}, {"id": "c013_f000201", "text": "'What yer doin' down here, Tom?'", "begin": 23099.78, "end": 23101.9, "localBegin": 1922.52, "localEnd": 1924.64}, {"id": "c013_f000202", "text": "Riddle stepped closer.", "begin": 23101.9, "end": 23103.78, "localBegin": 1924.64, "localEnd": 1926.52}, {"id": "c013_f000203", "text": "'It's all over,' he said. 'I'm going to have to turn you in, Rubeus. They're talking about closing Hogwarts if the attacks don't stop.'", "begin": 23103.78, "end": 23111.78, "localBegin": 1926.52, "localEnd": 1934.52}, {"id": "c013_f000204", "text": "'What d'yeh -'", "begin": 23111.78, "end": 23112.46, "localBegin": 1934.52, "localEnd": 1935.2}, {"id": "c013_f000205", "text": "'I don't think you meant to kill anyone. But monsters don't make good pets. I suppose you just let it out for exercise and -'", "begin": 23112.46, "end": 23120.7, "localBegin": 1935.2, "localEnd": 1943.44}, {"id": "c013_f000206", "text": "'It never killed no one!' said the large boy, backing against the closed door. From behind him, Harry could hear a funny rustling and clicking.", "begin": 23120.7, "end": 23129.22, "localBegin": 1943.44, "localEnd": 1951.96}, {"id": "c013_f000207", "text": "'Come on, Rubeus,' said Riddle, moving yet closer. 'The dead girl's parents will be here tomorrow. The least Hogwarts can do is make sure that the thing that killed their daughter is slaughtered ...'", "begin": 23129.22, "end": 23140.66, "localBegin": 1951.96, "localEnd": 1963.4}, {"id": "c013_f000208", "text": "'It wasn' him!' roared the boy, his voice echoing in the dark passage. 'He wouldn'! He never!'", "begin": 23140.66, "end": 23147.02, "localBegin": 1963.4, "localEnd": 1969.76}, {"id": "c013_f000209", "text": "'Stand aside,' said Riddle, drawing out his wand.", "begin": 23147.02, "end": 23150.62, "localBegin": 1969.76, "localEnd": 1973.36}, {"id": "c013_f000210", "text": "His spell lit the corridor with a sudden flaming light. The door behind the large boy flew open with such force it knocked him into the wall opposite. And out of it came something that made Harry let out a long, piercing scream no one but he seemed to hear.", "begin": 23150.62, "end": 23165.94, "localBegin": 1973.36, "localEnd": 1988.68}, {"id": "c013_f000211", "text": "A vast, low-slung, hairy body and a tangle of black legs; a gleam of many eyes and a pair of razor-sharp pincers - Riddle raised his wand again, but he was too late. The thing bowled him over as it scuttled away, tearing up the corridor and out of sight. Riddle scrambled to his feet, looking after it; he raised his wand, but the huge boy leapt on him, seized his wand and threw him back down, yelling, 'NOOOOOOO!'", "begin": 23165.94, "end": 23192.02, "localBegin": 1988.68, "localEnd": 2014.76}, {"id": "c013_f000212", "text": "The scene whirled, the darkness became complete, Harry felt himself falling and, with a crash, he landed spread-eagled on his four-poster in the Gryffindor dormitory, Riddle's diary lying open on his stomach.", "begin": 23192.02, "end": 23206.38, "localBegin": 2014.76, "localEnd": 2029.12}, {"id": "c013_f000213", "text": "Before he had had time to regain his breath, the dormitory door opened and Ron came in.", "begin": 23206.38, "end": 23212.1, "localBegin": 2029.12, "localEnd": 2034.84}, {"id": "c013_f000214", "text": "'There you are,' he said.", "begin": 23212.1, "end": 23214.54, "localBegin": 2034.84, "localEnd": 2037.28}, {"id": "c013_f000215", "text": "Harry sat up. He was sweating and shaking.", "begin": 23214.54, "end": 23217.9, "localBegin": 2037.28, "localEnd": 2040.64}, {"id": "c013_f000216", "text": "'What's up?' said Ron, looking at him with concern.", "begin": 23217.9, "end": 23221.66, "localBegin": 2040.64, "localEnd": 2044.4}, {"id": "c013_f000217", "text": "'It was Hagrid, Ron. Hagrid opened the Chamber of Secrets fifty years ago.'", "begin": 23221.66, "end": 23231.26, "localBegin": 2044.4, "localEnd": 2054.0}]}, {"kind": "chapter", "number": 14, "title": "Cornelius Fudge", "audio": "audio/chapter_014.mp3", "start": 23231.26, "end": 24738.298, "duration": 1507.038, "paragraphs": [{"id": "c014_f000001", "text": "Chapter Fourteen. Cornelius Fudge.", "begin": 23231.26, "end": 23236.62, "localBegin": 0.0, "localEnd": 5.36}, {"id": "c014_f000002", "text": "Harry, Ron and Hermione had always known that Hagrid had an unfortunate liking for large and monstrous creatures. During their first year at Hogwarts he had tried to raise a dragon in his little wooden house, and it would be a long time before they forgot the giant, three-headed dog he'd christened 'Fluffy'. And if, as a boy, Hagrid had heard that a monster was hidden somewhere in the castle, Harry was sure he'd have gone to any lengths for a glimpse of it. He'd probably thought it was a shame that the monster had been cooped up so long, and thought it deserved the chance to stretch its many legs; Harry could just imagine the thirteen-year-old Hagrid trying to fit a lead and collar on it. But he was equally certain that Hagrid would never have meant to kill anybody.", "begin": 23236.62, "end": 23278.9, "localBegin": 5.36, "localEnd": 47.64}, {"id": "c014_f000003", "text": "Harry half-wished he hadn't found out how to work Riddle's diary. Again and again Ron and Hermione made him recount what he'd seen, until he was heartily sick of telling them and sick of the long, circular conversations that followed.", "begin": 23278.9, "end": 23293.18, "localBegin": 47.64, "localEnd": 61.92}, {"id": "c014_f000004", "text": "'Riddle might have got the wrong person,' said Hermione. 'Maybe it was some other monster that was attacking people ...'", "begin": 23293.18, "end": 23300.02, "localBegin": 61.92, "localEnd": 68.76}, {"id": "c014_f000005", "text": "'How many monsters d'you think this place can hold?' Ron asked dully.", "begin": 23300.02, "end": 23304.9, "localBegin": 68.76, "localEnd": 73.64}, {"id": "c014_f000006", "text": "'We always knew Hagrid had been expelled,' said Harry miserably. 'And the attacks must've stopped after Hagrid was kicked out. Otherwise, Riddle wouldn't have got his award.'", "begin": 23304.9, "end": 23315.06, "localBegin": 73.64, "localEnd": 83.8}, {"id": "c014_f000007", "text": "Ron tried a different tack.", "begin": 23315.06, "end": 23317.06, "localBegin": 83.8, "localEnd": 85.8}, {"id": "c014_f000008", "text": "'Riddle does sound like Percy - who asked him to grass on Hagrid, anyway?'", "begin": 23317.06, "end": 23322.14, "localBegin": 85.8, "localEnd": 90.88}, {"id": "c014_f000009", "text": "'But the monster had killed someone, Ron,' said Hermione.", "begin": 23322.14, "end": 23326.42, "localBegin": 90.88, "localEnd": 95.16}, {"id": "c014_f000010", "text": "'And R
