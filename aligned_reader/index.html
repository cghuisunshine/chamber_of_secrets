": 11581.567, "end": 11587.887, "localBegin": 383.0, "localEnd": 389.32}, {"id": "c008_f000029", "text": "'Dung,' he muttered furiously, 'great sizzling dragon bogies ... frog brains ... rat intestines ... I've had enough of it ... make an example ... where's the form ... yes ...'", "begin": 11587.887, "end": 11600.207, "localBegin": 389.32, "localEnd": 401.64}, {"id": "c008_f000030", "text": "He retrieved a large roll of parchment from his desk drawer and stretched it out in front of him, dipping his long black quill into the ink pot.", "begin": 11600.207, "end": 11608.047, "localBegin": 401.64, "localEnd": 409.48}, {"id": "c008_f000031", "text": "'Name ... Harry Potter. Crime ...'", "begin": 11608.047, "end": 11611.887, "localBegin": 409.48, "localEnd": 413.32}, {"id": "c008_f000032", "text": "'It was only a bit of mud!' said Harry.", "begin": 11611.887, "end": 11615.087, "localBegin": 413.32, "localEnd": 416.52}, {"id": "c008_f000033", "text": "'It's only a bit of mud to you, boy, but to me it's an extra hour scrubbing!' shouted Filch, a drip shivering unpleasantly at the end of his bulbous nose. 'Crime ... befouling the castle ... suggested sentence ...'", "begin": 11615.087, "end": 11629.687, "localBegin": 416.52, "localEnd": 431.12}, {"id": "c008_f000034", "text": "Dabbing at his streaming nose, Filch squinted unpleasantly at Harry, who waited with bated breath for his sentence to fall.", "begin": 11629.687, "end": 11637.207, "localBegin": 431.12, "localEnd": 438.64}, {"id": "c008_f000035", "text": "But as Filch lowered his quill, there was a great BANG! on the ceiling of the office, which made the oil lamp rattle.", "begin": 11637.207, "end": 11642.887, "localBegin": 438.64, "localEnd": 444.32}, {"id": "c008_f000036", "text": "'PEEVES!' Filch roared, flinging down his quill in a transport of rage. 'I'll have you this time, I'll have you!'", "begin": 11642.887, "end": 11653.047, "localBegin": 444.32, "localEnd": 454.48}, {"id": "c008_f000037", "text": "And without a backwards glance at Harry, Filch ran flat-footed from the office, Mrs Norris streaking alongside him.", "begin": 11653.047, "end": 11659.407, "localBegin": 454.48, "localEnd": 460.84}, {"id": "c008_f000038", "text": "Peeves was the school poltergeist, a grinning, airborne menace who lived to cause havoc and distress. Harry didn't much like Peeves, but couldn't help feeling grateful for his timing. Hopefully, whatever Peeves had done (and it sounded as though he'd wrecked something very big this time) would distract Filch from Harry.", "begin": 11659.407, "end": 11679.247, "localBegin": 460.84, "localEnd": 480.68}, {"id": "c008_f000039", "text": "Thinking that he should probably wait for Filch to come back, Harry sank into a moth-eaten chair next to the desk. There was only one thing on it apart from his half-completed form: a large, glossy, purple envelope with silver lettering on the front. With a quick glance at the door to check that Filch wasn't on his way back, Harry picked up the envelope and read:", "begin": 11679.247, "end": 11699.447, "localBegin": 480.68, "localEnd": 500.88}, {"id": "c008_f000040", "text": "KWIKSPELL A Correspondence Course in Beginners' Magic", "begin": 11699.447, "end": 11705.127, "localBegin": 500.88, "localEnd": 506.56}, {"id": "c008_f000041", "text": "Intrigued, Harry flicked the envelope open and pulled out the sheaf of parchment inside. More curly silver writing on the front page said:", "begin": 11705.127, "end": 11714.487, "localBegin": 506.56, "localEnd": 515.92}, {"id": "c008_f000042", "text": "Feel out of step in the world of modern magic? Find yourself", "begin": 11714.487, "end": 11718.087, "localBegin": 515.92, "localEnd": 519.52}, {"id": "c008_f000043", "text": "making excuses not to perform simple spells? Ever been taunted", "begin": 11718.087, "end": 11722.407, "localBegin": 519.52, "localEnd": 523.84}, {"id": "c008_f000044", "text": "for your woeful wandwork?", "begin": 11722.407, "end": 11724.447, "localBegin": 523.84, "localEnd": 525.88}, {"id": "c008_f000045", "text": "There is an answer!", "begin": 11724.447, "end": 11725.447, "localBegin": 525.88, "localEnd": 526.88}, {"id": "c008_f000046", "text": "Kwikspell is an all-new, fail-safe, quick-result, easy-learn", "begin": 11725.447, "end": 11729.927, "localBegin": 526.88, "localEnd": 531.36}, {"id": "c008_f000047", "text": "course. Hundreds of witches and wizards have benefited from", "begin": 11729.927, "end": 11733.407, "localBegin": 531.36, "localEnd": 534.84}, {"id": "c008_f000048", "text": "the Kwikspell method!", "begin": 11733.407, "end": 11735.327, "localBegin": 534.84, "localEnd": 536.76}, {"id": "c008_f000049", "text": "Madam Z. Nettles of Topsham writes:", "begin": 11735.327, "end": 11737.727, "localBegin": 536.76, "localEnd": 539.16}, {"id": "c008_f000050", "text": "'I had no memory for incantations and my potions were a family", "begin": 11737.727, "end": 11741.527, "localBegin": 539.16, "localEnd": 542.96}, {"id": "c008_f000051", "text": "joke! Now, after a Kwikspell course, I am the centre of attention", "begin": 11741.527, "end": 11745.807, "localBegin": 542.96, "localEnd": 547.24}, {"id": "c008_f000052", "text": "at parties and friends beg for the recipe of my Scintillation", "begin": 11745.807, "end": 11749.647, "localBegin": 547.24, "localEnd": 551.08}, {"id": "c008_f000053", "text": "Solution!'", "begin": 11749.647, "end": 11751.047, "localBegin": 551.08, "localEnd": 552.48}, {"id": "c008_f000054", "text": "Warlock D.J. Prod of Didsbury says:", "begin": 11751.047, "end": 11753.807, "localBegin": 552.48, "localEnd": 555.24}, {"id": "c008_f000055", "text": "'My wife used to sneer at my feeble charms but one month into", "begin": 11753.807, "end": 11757.287, "localBegin": 555.24, "localEnd": 558.72}, {"id": "c008_f000056", "text": "your fabulous Kwikspell course I succeeded in turning her into a", "begin": 11757.287, "end": 11761.567, "localBegin": 558.72, "localEnd": 563.0}, {"id": "c008_f000057", "text": "yak! Thank you, Kwikspell!'", "begin": 11761.567, "end": 11763.967, "localBegin": 563.0, "localEnd": 565.4}, {"id": "c008_f000058", "text": "Fascinated, Harry thumbed through the rest of the envelope's contents. Why on earth did Filch want a Kwikspell course? Did this mean he wasn't a proper wizard? Harry was just reading 'Lesson One: Holding Your Wand (Some Useful Tips)' when shuffling footsteps outside told him Filch was coming back. Stuffing the parchment back into the envelope, Harry threw it back onto the desk just as the door opened.", "begin": 11763.967, "end": 11790.127, "localBegin": 565.4, "localEnd": 591.56}, {"id": "c008_f000059", "text": "Filch was looking triumphant.", "begin": 11790.127, "end": 11792.487, "localBegin": 591.56, "localEnd": 593.92}, {"id": "c008_f000060", "text": "'That vanishing cabinet was extremely valuable!' he was saying gleefully to Mrs Norris. 'We'll have Peeves out this time, my sweet.'", "begin": 11792.487, "end": 11801.927, "localBegin": 593.92, "localEnd": 603.36}, {"id": "c008_f000061", "text": "His eyes fell on Harry and then darted to the Kwikspell envelope which, Harry realised too late, was lying two feet away from where it had started.", "begin": 11801.927, "end": 11811.527, "localBegin": 603.36, "localEnd": 612.96}, {"id": "c008_f000062", "text": "Filch's pasty face went brick red. Harry braced himself for a tidal wave of fury. Filch hobbled across to his desk, snatched up the envelope and threw it into a drawer.", "begin": 11811.527, "end": 11822.687, "localBegin": 612.96, "localEnd": 624.12}, {"id": "c008_f000063", "text": "'Have you - did you read -?' he spluttered.", "begin": 11822.687, "end": 11826.007, "localBegin": 624.12, "localEnd": 627.44}, {"id": "c008_f000064", "text": "'No,' Harry lied quickly.", "begin": 11826.007, "end": 11828.007, "localBegin": 627.44, "localEnd": 629.44}, {"id": "c008_f000065", "text": "Filch's knobbly hands were twisting together.", "begin": 11828.007, "end": 11831.527, "localBegin": 629.44, "localEnd": 632.96}, {"id": "c008_f000066", "text": "'If I thought you'd read my private ... not that it's mine ... for a friend ... be that as it may ... however ...'", "begin": 11831.527, "end": 11840.127, "localBegin": 632.96, "localEnd": 641.56}, {"id": "c008_f000067", "text": "Harry was staring at him, alarmed; Filch had never looked madder. His eyes were popping, a tic was going in one of his pouchy cheeks and the tartan scarf didn't help.", "begin": 11840.127, "end": 11849.047, "localBegin": 641.56, "localEnd": 650.48}, {"id": "c008_f000068", "text": "'Very well ... go ... and don't breathe a word ... not that ... how-", "begin": 11849.047, "end": 11855.087, "localBegin": 650.48, "localEnd": 656.52}, {"id": "c008_f000069", "text": "ever, if you didn't read ... go now, I have to write up Peeves' report ... go ...'", "begin": 11855.087, "end": 11861.367, "localBegin": 656.52, "localEnd": 662.8}, {"id": "c008_f000070", "text": "Amazed at his luck, Harry sped out of the office, up the corridor and back upstairs. To escape from Filch's office without punishment was probably some kind of school record.", "begin": 11861.367, "end": 11872.367, "localBegin": 662.8, "localEnd": 673.8}, {"id": "c008_f000071", "text": "'Harry! Harry! Did it work?'", "begin": 11872.367, "end": 11876.047, "localBegin": 673.8, "localEnd": 677.48}, {"id": "c008_f000072", "text": "Nearly Headless Nick came gliding out of a classroom. Behind him, Harry could see the wreckage of a large black and gold cabinet which appeared to have been dropped from a great height.", "begin": 11876.047, "end": 11886.767, "localBegin": 677.48, "localEnd": 688.2}, {"id": "c008_f000073", "text": "'I persuaded Peeves to crash it right over Filch's office,' said Nick eagerly. 'Thought it might distract him -'", "begin": 11886.767, "end": 11894.647, "localBegin": 688.2, "localEnd": 696.08}, {"id": "c008_f000074", "text": "'Was that you?' said Harry gratefully. 'Yeah, it worked, I didn't even get detention. Thanks, Nick!'", "begin": 11894.647, "end": 11901.927, "localBegin": 696.08, "localEnd": 703.36}, {"id": "c008_f000075", "text": "They set off up the corridor together. Nearly Headless Nick, Harry noticed, was still holding Sir Patrick's rejection letter.", "begin": 11901.927, "end": 11909.527, "localBegin": 703.36, "localEnd": 710.96}, {"id": "c008_f000076", "text": "'I wish there was something I could do for you about the Headless Hunt,' Harry said.", "begin": 11909.527, "end": 11914.687, "localBegin": 710.96, "localEnd": 716.12}, {"id": "c008_f000077", "text": "Nearly Headless Nick stopped in his tracks and Harry walked right through him. He wished he hadn't; it was like stepping through an icy shower.", "begin": 11914.687, "end": 11921.767, "localBegin": 716.12, "localEnd": 723.2}, {"id": "c008_f000078", "text": "'But there is something you could do for me,' said Nick excitedly. 'Harry - would I be asking too much - but no, you wouldn't want -'", "begin": 11921.767, "end": 11933.247, "localBegin": 723.2, "localEnd": 734.68}, {"id": "c008_f000079", "text": "'What is it?' said Harry.", "begin": 11933.247, "end": 11934.687, "localBegin": 734.68, "localEnd": 736.12}, {"id": "c008_f000080", "text": "'Well, this Hallowe'en will be my five hundredth deathday,' said Nearly Headless Nick, drawing himself up and looking dignified.", "begin": 11934.687, "end": 11943.327, "localBegin": 736.12, "localEnd": 744.76}, {"id": "c008_f000081", "text": "'Oh,' said Harry, not sure whether he should look sorry or happy about this. 'Right.'", "begin": 11943.327, "end": 11951.447, "localBegin": 744.76, "localEnd": 752.88}, {"id": "c008_f000082", "text": "'I'm holding a party down in one of the roomier dungeons. Friends will be coming from all over the country. It would be such an honour if you would attend. Mr Weasley and Miss Granger would be most welcome too, of course - but I dare say you'd rather go to the school feast?' He watched Harry on tenterhooks.", "begin": 11951.447, "end": 11971.367, "localBegin": 752.88, "localEnd": 772.8}, {"id": "c008_f000083", "text": "'No,' said Harry quickly, 'I'll come -'", "begin": 11971.367, "end": 11974.047, "localBegin": 772.8, "localEnd": 775.48}, {"id": "c008_f000084", "text": "'My dear boy! Harry Potter, at my Deathday Party! And,' he hesitated, looking excited, 'do you think you could possibly mention to Sir Patrick how very frightening and impressive you find me?'", "begin": 11974.047, "end": 11991.847, "localBegin": 775.48, "localEnd": 793.28}, {"id": "c008_f000085", "text": "'Of - of course,' said Harry.", "begin": 11991.847, "end": 11994.927, "localBegin": 793.28, "localEnd": 796.36}, {"id": "c008_f000086", "text": "Nearly Headless Nick beamed at him. *", "begin": 11994.927, "end": 11999.567, "localBegin": 796.36, "localEnd": 801.0}, {"id": "c008_f000087", "text": "'A Deathday Party?' said Hermione keenly, when Harry had changed at last and joined her and Ron in the common room. 'I bet there aren't many living people who can say they've been to one of those - it'll be fascinating!'", "begin": 11999.567, "end": 12012.767, "localBegin": 801.0, "localEnd": 814.2}, {"id": "c008_f000088", "text": "'Why would anyone want to celebrate the day they died?' said Ron, who was halfway through his Potions homework and grumpy. 'Sounds dead depressing to me ...'", "begin": 12012.767, "end": 12021.327, "localBegin": 814.2, "localEnd": 822.76}, {"id": "c008_f000089", "text": "Rain was still lashing the windows, which were now inky black, but inside, all looked bright and cheerful. The firelight glowed over the countless squashy armchairs where people sat reading, talking, doing homework or, in the case of Fred and George Weasley, trying to find out what would happen if you fed a Filibuster Firework to a Salamander. Fred had 'rescued' the brilliant orange, fire-dwelling lizard from a Care of Magical Creatures class and it was now smouldering gently on a table surrounded by a knot of curious people.", "begin": 12021.327, "end": 12055.527, "localBegin": 822.76, "localEnd": 856.96}, {"id": "c008_f000090", "text": "Harry was on the point of telling Ron and Hermione about Filch and the Kwikspell course when the Salamander suddenly whizzed into the air, emitting loud sparks and bangs as it whirled wildly round the room. The sight of Percy bellowing himself hoarse at Fred and George, the spectacular display of tangerine stars showering from the Salamander's mouth, and its escape into the fire, with accompanying explosions, drove both Filch and the Kwikspell envelope from Harry's mind. * By the time Hallowe'en arrived, Harry was regretting his rash promise to go to the Deathday Party. The rest of the school were happily anticipating their Hallowe'en feast; the Great Hall had been decorated with the usual live bats, Hagrid's vast pumpkins had been carved into lanterns large enough for three men to sit in and there were rumours that Dumbledore had booked a troupe of dancing skeletons for the entertainment.", "begin": 12055.527, "end": 12111.247, "localBegin": 856.96, "localEnd": 912.68}, {"id": "c008_f000091", "text": "'A promise is a promise,' Hermione reminded Harry bossily. 'You said you'd go to the Deathday Party.'", "begin": 12111.247, "end": 12118.607, "localBegin": 912.68, "localEnd": 920.04}, {"id": "c008_f000092", "text": "So, at seven o'clock, Harry, Ron and Hermione walked straight past the doorway to the packed Great Hall, which was glittering invitingly with gold plates and candles, and directed their steps instead towards the dungeons.", "begin": 12118.607, "end": 12131.047, "localBegin": 920.04, "localEnd": 932.48}, {"id": "c008_f000093", "text": "The passageway leading to Nearly Headless Nick's party had been lined with candles too, though the effect was far from cheer-", "begin": 12131.047, "end": 12139.007, "localBegin": 932.48, "localEnd": 940.44}, {"id": "c008_f000094", "text": "ful: these were long, thin, jet-black tapers, all burning bright blue, casting a dim, ghostly light even over their own living faces. The temperature dropped with every step they took. As Harry shivered and drew his robes tightly around him, he heard what sounded like a thousand fingernails scraping an enormous blackboard.", "begin": 12139.007, "end": 12161.447, "localBegin": 940.44, "localEnd": 962.88}, {"id": "c008_f000095", "text": "'Is that supposed to be music?' Ron whispered. They turned a corner and saw Nearly Headless Nick standing at a doorway hung with black velvet drapes.", "begin": 12161.447, "end": 12171.487, "localBegin": 962.88, "localEnd": 972.92}, {"id": "c008_f000096", "text": "'My dear friends,' he said mournfully, 'welcome, welcome ... so pleased you could come ...'", "begin": 12171.487, "end": 12178.567, "localBegin": 972.92, "localEnd": 980.0}, {"id": "c008_f000097", "text": "He swept off his plumed hat and bowed them inside.", "begin": 12178.567, "end": 12183.247, "localBegin": 980.0, "localEnd": 984.68}, {"id": "c008_f000098", "text": "It was an incredible sight. The dungeon was full of hundreds of pearly-white, translucent people, mostly drifting around a crowded dance floor, waltzing to the dreadful, quavering sound of thirty musical saws, played by an orchestra on a black-draped platform. A chandelier overhead blazed midnight blue with a thousand more black candles. Their breath rose in a mist before them; it was like stepping into a freezer.", "begin": 12183.247, "end": 12211.527, "localBegin": 984.68, "localEnd": 1012.96}, {"id": "c008_f000099", "text": "'Shall we have a look around?' Harry suggested, wanting to warm up his feet.", "begin": 12211.527, "end": 12215.487, "localBegin": 1012.96, "localEnd": 1016.92}, {"id": "c008_f000100", "text": "'Careful not to walk through anyone,' said Ron nervously, and they set off around the edge of the dance floor. They passed a group of gloomy nuns, a ragged man wearing chains, and the Fat Friar, a cheerful Hufflepuff ghost, who was talking to a knight with an arrow sticking out of his forehead. Harry wasn't surprised to see that the Bloody Baron, a gaunt, staring Slytherin ghost covered in silver bloodstains, was being given a wide berth by the other ghosts.", "begin": 12215.487, "end": 12245.527, "localBegin": 1016.92, "localEnd": 1046.96}, {"id": "c008_f000101", "text": "'Oh no,' said Hermione, stopping abruptly. 'Turn back, turn back, I don't want to talk to Moaning Myrtle -'", "begin": 12245.527, "end": 12252.207, "localBegin": 1046.96, "localEnd": 1053.64}, {"id": "c008_f000102", "text": "'Who?' said Harry, as they backtracked quickly.", "begin": 12252.207, "end": 12257.047, "localBegin": 1053.64, "localEnd": 1058.48}, {"id": "c008_f000103", "text": "'She haunts the girls' toilet on the first floor,' said Hermione.", "begin": 12257.047, "end": 12260.487, "localBegin": 1058.48, "localEnd": 1061.92}, {"id": "c008_f000104", "text": "'She haunts a toilet?'", "begin": 12260.487, "end": 12262.407, "localBegin": 1061.92, "localEnd": 1063.84}, {"id": "c008_f000105", "text": "'Yes. It's been out of order all year because she keeps having tantrums and flooding the place. I never went in there anyway if I could avoid it, it's awful trying to go to the loo with her wailing at you -'", "begin": 12262.407, "end": 12274.447, "localBegin": 1063.84, "localEnd": 1075.88}, {"id": "c008_f000106", "text": "'Look, food!' said Ron.", "begin": 12274.447, "end": 12277.527, "localBegin": 1075.88, "localEnd": 1078.96}, {"id": "c008_f000107", "text": "On the other side of the dungeon was a long table, also covered in black velvet. They approached it eagerly, but next moment had", "begin": 12277.527, "end": 12284.327, "localBegin": 1078.96, "localEnd": 1085.76}, {"id": "c008_f000108", "text": "stopped in their tracks, horrified. The smell was quite disgusting. Large, rotten fish were laid on handsome silver platters; cakes, burned charcoal black, were heaped on salvers; there was a great maggoty haggis, a slab of cheese covered in furry green mould and, in pride of place, an enormous grey cake in the shape of a tombstone, with tar-like icing forming the words,", "begin": 12284.327, "end": 12310.527, "localBegin": 1085.76, "localEnd": 1111.96}, {"id": "c008_f000109", "text": "Sir Nicholas de Mimsy-Porpington died 31st October, 1492", "begin": 12310.527, "end": 12317.807, "localBegin": 1111.96, "localEnd": 1119.24}, {"id": "c008_f000110", "text": "Harry watched, amazed, as a portly ghost approached the table, crouched low and walked through it, his mouth held wide so that it passed through one of the stinking salmon.", "begin": 12317.807, "end": 12329.567, "localBegin": 1119.24, "localEnd": 1131.0}, {"id": "c008_f000111", "text": "'Can you taste it if you walk through it?' Harry asked him.", "begin": 12329.567, "end": 12333.967, "localBegin": 1131.0, "localEnd": 1135.4}, {"id": "c008_f000112", "text": "'Almost,' said the ghost sadly, and he drifted away.", "begin": 12333.967, "end": 12338.327, "localBegin": 1135.4, "localEnd": 1139.76}, {"id": "c008_f000113", "text": "'I expect they've let it rot to give it a stronger flavour,' said Hermione knowledgeably, pinching her nose and leaning closer to look at the putrid haggis.", "begin": 12338.327, "end": 12347.327, "localBegin": 1139.76, "localEnd": 1148.76}, {"id": "c008_f000114", "text": "'Can we move? I feel sick,' said Ron.", "begin": 12347.327, "end": 12351.287, "localBegin": 1148.76, "localEnd": 1152.72}, {"id": "c008_f000115", "text": "They had barely turned around, however, when a little man swooped suddenly from under the table and came to a halt in mid-air before them.", "begin": 12351.287, "end": 12358.887, "localBegin": 1152.72, "localEnd": 1160.32}, {"id": "c008_f000116", "text": "'Hello, Peeves,' said Harry cautiously.", "begin": 12358.887, "end": 12362.847, "localBegin": 1160.32, "localEnd": 1164.28}, {"id": "c008_f000117", "text": "Unlike the ghosts around them, Peeves the poltergeist was the very reverse of pale and transparent. He was wearing a bright orange party hat, a revolving bow-tie and a broad grin on his wide, wicked face.", "begin": 12362.847, "end": 12376.247, "localBegin": 1164.28, "localEnd": 1177.68}, {"id": "c008_f000118", "text": "'Nibbles?' he said sweetly, offering them a bowl of peanuts covered in fungus.", "begin": 12376.247, "end": 12381.807, "localBegin": 1177.68, "localEnd": 1183.24}, {"id": "c008_f000119", "text": "'No thanks,' said Hermione.", "begin": 12381.807, "end": 12384.127, "localBegin": 1183.24, "localEnd": 1185.56}, {"id": "c008_f000120", "text": "'Heard you talking about poor Myrtle,' said Peeves, his eyes dancing. 'Rude you was about poor Myrtle.' He took a deep breath and bellowed, 'OY! MYRTLE!'", "begin": 12384.127, "end": 12395.887, "localBegin": 1185.56, "localEnd": 1197.32}, {"id": "c008_f000121", "text": "'Oh, no, Peeves, don't tell her what I said, she'll be really upset,' Hermione whispered frantically. 'I didn't mean it, I don't mind her - er, hello, Myrtle.'", "begin": 12395.887, "end": 12406.047, "localBegin": 1197.32, "localEnd": 1207.48}, {"id": "c008_f000122", "text": "The squat ghost of a girl had glided over. She had the glummest face Harry had ever seen, half-hidden behind lank hair and thick, pearly spectacles.", "begin": 12406.047, "end": 12416.367, "localBegin": 1207.48, "localEnd": 1217.8}, {"id": "c008_f000123", "text": "'What?' she said sulkily.", "begin": 12416.367, "end": 12420.087, "localBegin": 1217.8, "localEnd": 1221.52}, {"id": "c008_f000124", "text": "'How are you, Myrtle?' said Hermione, in a falsely bright voice. 'It's nice to see you out of the toilet.'", "begin": 12420.087, "end": 12426.247, "localBegin": 1221.52, "localEnd": 1227.68}, {"id": "c008_f000125", "text": "Myrtle sniffed.", "begin": 12426.247, "end": 12427.887, "localBegin": 1227.68, "localEnd": 1229.32}, {"id": "c008_f000126", "text": "'Miss Granger was just talking about you -' said Peeves slyly in Myrtle's ear.", "begin": 12427.887, "end": 12433.807, "localBegin": 1229.32, "localEnd": 1235.24}, {"id": "c008_f000127", "text": "'Just saying - saying - how nice you look tonight,' said Hermione, glaring at Peeves.", "begin": 12433.807, "end": 12440.567, "localBegin": 1235.24, "localEnd": 1242.0}, {"id": "c008_f000128", "text": "Myrtle eyed Hermione suspiciously.", "begin": 12440.567, "end": 12443.287, "localBegin": 1242.0, "localEnd": 1244.72}, {"id": "c008_f000129", "text": "'You're making fun of me,' she said, silver tears welling rapidly in her small, see-through eyes.", "begin": 12443.287, "end": 12451.207, "localBegin": 1244.72, "localEnd": 1252.64}, {"id": "c008_f000130", "text": "'No - honestly - didn't I just say how nice Myrtle's looking?' said Hermione, nudging Harry and Ron painfully in the ribs.", "begin": 12451.207, "end": 12459.527, "localBegin": 1252.64, "localEnd": 1260.96}, {"id": "c008_f000131", "text": "'Oh, yeah ...'", "begin": 12459.527, "end": 12461.047, "localBegin": 1260.96, "localEnd": 1262.48}, {"id": "c008_f000132", "text": "'She did ...'", "begin": 12461.047, "end": 12462.047, "localBegin": 1262.48, "localEnd": 1263.48}, {"id": "c008_f000133", "text": "'Don't lie to me,' Myrtle gasped, tears now flooding down her face, while Peeves chuckled happily over her shoulder. 'D'you think I don't know what people call me behind my back? Fat Myrtle! Ugly Myrtle! Miserable, moaning, moping Myrtle!'", "begin": 12462.047, "end": 12484.647, "localBegin": 1263.48, "localEnd": 1286.08}, {"id": "c008_f000134", "text": "'You've missed out \"spotty\",' Peeves hissed in her ear.", "begin": 12484.647, "end": 12489.127, "localBegin": 1286.08, "localEnd": 1290.56}, {"id": "c008_f000135", "text": "Moaning Myrtle burst into anguished sobs and fled from the dungeon. Peeves shot after her, pelting her with mouldy peanuts, yelling, 'Spotty! Spotty!'", "begin": 12489.127, "end": 12498.847, "localBegin": 1290.56, "localEnd": 1300.28}, {"id": "c008_f000136", "text": "'Oh, dear,' said Hermione sadly.", "begin": 12498.847, "end": 12502.127, "localBegin": 1300.28, "localEnd": 1303.56}, {"id": "c008_f000137", "text": "Nearly Headless Nick now drifted towards them through the crowd.", "begin": 12502.127, "end": 12506.327, "localBegin": 1303.56, "localEnd": 1307.76}, {"id": "c008_f000138", "text": "'Enjoying yourselves?'", "begin": 12506.327, "end": 12508.527, "localBegin": 1307.76, "localEnd": 1309.96}, {"id": "c008_f000139", "text": "'Oh, yes,' they lied.", "begin": 12508.527, "end": 12511.007, "localBegin": 1309.96, "localEnd": 1312.44}, {"id": "c008_f000140", "text": "'Not a bad turnout,' said Nearly Headless Nick proudly. 'The Wailing Widow came all the way up from Kent ... It's nearly time for my speech, I'd better go and warn the orchestra ...'", "begin": 12511.007, "end": 12523.207, "localBegin": 1312.44, "localEnd": 1324.64}, {"id": "c008_f000141", "text": "The orchestra, however, stopped playing at that very moment. They, and everyone else in the dungeon, fell silent, looking around in excitement, as a hunting horn sounded.", "begin": 12523.207, "end": 12534.967, "localBegin": 1324.64, "localEnd": 1336.4}, {"id": "c008_f000142", "text": "'Oh, here we go,' said Nearly Headless Nick bitterly.", "begin": 12534.967, "end": 12539.167, "localBegin": 1336.4, "localEnd": 1340.6}, {"id": "c008_f000143", "text": "Through the dungeon wall burst a dozen ghost horses, each ridden by a headless horseman. The assembly clapped wildly; Harry started to clap too, but stopped quickly at the sight of Nick's face.", "begin": 12539.167, "end": 12551.127, "localBegin": 1340.6, "localEnd": 1352.56}, {"id": "c008_f000144", "text": "The horses galloped into the middle of the dance floor and halted, rearing and plunging; a large ghost at the front, whose", "begin": 12551.127, "end": 12559.887, "localBegin": 1352.56, "localEnd": 1361.32}, {"id": "c008_f000145", "text": "bearded head was under his arm, blowing the horn, leapt down, lifted his head high in the air so he could see over the crowd (everyone laughed) and strode over to Nearly Headless Nick, squashing his head back onto his neck.", "begin": 12559.887, "end": 12574.847, "localBegin": 1361.32, "localEnd": 1376.28}, {"id": "c008_f000146", "text": "'Nick!' he roared. 'How are you? Head still hanging in there?'", "begin": 12574.847, "end": 12580.087, "localBegin": 1376.28, "localEnd": 1381.52}, {"id": "c008_f000147", "text": "He gave a hearty guffaw and clapped Nearly Headless Nick on the shoulder.", "begin": 12580.087, "end": 12584.567, "localBegin": 1381.52, "localEnd": 1386.0}, {"id": "c008_f000148", "text": "'Welcome, Patrick,' said Nick stiffly.", "begin": 12584.567, "end": 12588.087, "localBegin": 1386.0, "localEnd": 1389.52}, {"id": "c008_f000149", "text": "'Live 'uns!' said Sir Patrick, spotting Harry, Ron and Hermione and giving a huge, fake jump of astonishment, so that his head fell off again (the crowd howled with laughter).", "begin": 12588.087, "end": 12599.287, "localBegin": 1389.52, "localEnd": 1400.72}, {"id": "c008_f000150", "text": "'Very amusing,' said Nearly Headless Nick darkly.", "begin": 12599.287, "end": 12604.727, "localBegin": 1400.72, "localEnd": 1406.16}, {"id": "c008_f000151", "text": "'Don't mind Nick!' shouted Sir Patrick's head from the floor. 'Still upset we won't let him join the Hunt! But I mean to say look at the fellow -'", "begin": 12604.727, "end": 12614.807, "localBegin": 1406.16, "localEnd": 1416.24}, {"id": "c008_f000152", "text": "'I think,' said Harry hurriedly, at a meaningful look from Nick, 'Nick's very - frightening and - er -'", "begin": 12614.807, "end": 12622.367, "localBegin": 1416.24, "localEnd": 1423.8}, {"id": "c008_f000153", "text": "'Ha!' yelled Sir Patrick's head. 'Bet he asked you to say that!'", "begin": 12622.367, "end": 12626.487, "localBegin": 1423.8, "localEnd": 1427.92}, {"id": "c008_f000154", "text": "'If I could have everyone's attention, it's time for my speech!' said Nearly Headless Nick loudly, striding towards the podium and climbing into an icy-blue spotlight.", "begin": 12626.487, "end": 12637.247, "localBegin": 1427.92, "localEnd": 1438.68}, {"id": "c008_f000155", "text": "'My late lamented lords, ladies and gentlemen, it is my great sorrow ...'", "begin": 12637.247, "end": 12644.967, "localBegin": 1438.68, "localEnd": 1446.4}, {"id": "c008_f000156", "text": "But nobody heard much more. Sir Patrick and the rest of the Headless Hunt had just started a game of Head Hockey and the crowd were turning to watch. Nearly Headless Nick tried vainly to recapture his audience, but gave up as Sir Patrick's head went sailing past him to loud cheers.", "begin": 12644.967, "end": 12661.527, "localBegin": 1446.4, "localEnd": 1462.96}, {"id": "c008_f000157", "text": "Harry was very cold by now, not to mention hungry.", "begin": 12661.527, "end": 12665.247, "localBegin": 1462.96, "localEnd": 1466.68}, {"id": "c008_f000158", "text": "'I can't stand much more of this,' Ron muttered, his teeth chattering, as the orchestra ground back into action and the ghosts swept back onto the dance floor.", "begin": 12665.247, "end": 12674.447, "localBegin": 1466.68, "localEnd": 1475.88}, {"id": "c008_f000159", "text": "'Let's go,' Harry agreed.", "begin": 12674.447, "end": 12676.967, "localBegin": 1475.88, "localEnd": 1478.4}, {"id": "c008_f000160", "text": "They backed towards the door, nodding and beaming at anyone who looked at them, and a minute later were hurrying back up the passageway full of black candles.", "begin": 12676.967, "end": 12686.007, "localBegin": 1478.4, "localEnd": 1487.44}, {"id": "c008_f000161", "text": "'Pudding might not be finished yet,' said Ron hopefully, leading the way towards the steps to the Entrance Hall.", "begin": 12686.007, "end": 12692.927, "localBegin": 1487.44, "localEnd": 1494.36}, {"id": "c008_f000162", "text": "And then Harry heard it.", "begin": 12692.927, "end": 12695.207, "localBegin": 1494.36, "localEnd": 1496.64}, {"id": "c008_f000163", "text": "'... rip ... tear ... kill ...'", "begin": 12695.207, "end": 12703.207, "localBegin": 1496.64, "localEnd": 1504.64}, {"id": "c008_f000164", "text": "It was the same voice, the same cold, murderous voice he had heard in Lockhart's office.", "begin": 12703.207, "end": 12710.527, "localBegin": 1504.64, "localEnd": 1511.96}, {"id": "c008_f000165", "text": "He stumbled to a halt, clutching at the stone wall, listening with all his might, looking around, squinting up and down the dimly lit passageway.", "begin": 12710.527, "end": 12719.847, "localBegin": 1511.96, "localEnd": 1521.28}, {"id": "c008_f000166", "text": "'Harry, what're you -?'", "begin": 12719.847, "end": 12721.887, "localBegin": 1521.28, "localEnd": 1523.32}, {"id": "c008_f000167", "text": "'It's that voice again - shut up a minute -'", "begin": 12721.887, "end": 12724.727, "localBegin": 1523.32, "localEnd": 1526.16}, {"id": "c008_f000168", "text": "'... soo hungry ... for so long ...'", "begin": 12724.727, "end": 12731.447, "localBegin": 1526.16, "localEnd": 1532.88}, {"id": "c008_f000169", "text": "'Listen!' said Harry urgently, and Ron and Hermione froze, watching him.", "begin": 12731.447, "end": 12737.967, "localBegin": 1532.88, "localEnd": 1539.4}, {"id": "c008_f000170", "text": "'... kill ... time to kill ...'", "begin": 12737.967, "end": 12744.127, "localBegin": 1539.4, "localEnd": 1545.56}, {"id": "c008_f000171", "text": "The voice was growing fainter. Harry was sure it was moving away - moving upwards. A mixture of fear and excitement gripped him as he stared at the dark ceiling; how could it be moving upwards? Was it a phantom, to whom stone ceilings didn't matter?", "begin": 12744.127, "end": 12762.727, "localBegin": 1545.56, "localEnd": 1564.16}, {"id": "c008_f000172", "text": "'This way,' he shouted, and he began to run, up the stairs, into the Entrance Hall. It was no good hoping to hear anything here, the babble of talk from the Hallowe'en feast was echoing out of the Great Hall. Harry sprinted up the marble staircase to the first floor, Ron and Hermione clattering behind him.", "begin": 12762.727, "end": 12780.967, "localBegin": 1564.16, "localEnd": 1582.4}, {"id": "c008_f000173", "text": "'Harry, what are we -'", "begin": 12780.967, "end": 12782.607, "localBegin": 1582.4, "localEnd": 1584.04}, {"id": "c008_f000174", "text": "'SHH!'", "begin": 12782.607, "end": 12784.127, "localBegin": 1584.04, "localEnd": 1585.56}, {"id": "c008_f000175", "text": "Harry strained his ears. Distantly, from the floor above, and growing fainter still, he heard the voice: '... I smell blood ... I SMELL BLOOD!'", "begin": 12784.127, "end": 12794.407, "localBegin": 1585.56, "localEnd": 1595.84}, {"id": "c008_f000176", "text": "His stomach lurched. 'It's going to kill someone!' he shouted, and ignoring Ron and Hermione's bewildered faces, he ran up the next flight of steps three at a time, trying to listen over his own pounding footsteps.", "begin": 12794.407, "end": 12813.807, "localBegin": 1595.84, "localEnd": 1615.24}, {"id": "c008_f000177", "text": "Harry hurtled around the whole of the second floor, Ron and Hermione panting behind him, not stopping until they turned a corner into the last, deserted passage.", "begin": 12813.807, "end": 12823.007, "localBegin": 1615.24, "localEnd": 1624.44}, {"id": "c008_f000178", "text": "'Harry, what was that all about?' said Ron, wiping sweat off his face. 'I couldn't hear anything ...'", "begin": 12823.007, "end": 12829.767, "localBegin": 1624.44, "localEnd": 1631.2}, {"id": "c008_f000179", "text": "But Hermione gave a sudden gasp, pointing down the corridor.", "begin": 12829.767, "end": 12835.447, "localBegin": 1631.2, "localEnd": 1636.88}, {"id": "c008_f000180", "text": "'Look!'", "begin": 12835.447, "end": 12835.767, "localBegin": 1636.88, "localEnd": 1637.2}, {"id": "c008_f000181", "text": "Something was shining on the wall ahead. They approached, slowly, squinting through the darkness. Foot-high words had been daubed on the wall between two windows, shimmering in the", "begin": 12835.767, "end": 12847.887, "localBegin": 1637.2, "localEnd": 1649.32}, {"id": "c008_f000182", "text": "light cast by the flaming torches.", "begin": 12847.887, "end": 12850.127, "localBegin": 1649.32, "localEnd": 1651.56}, {"id": "c008_f000183", "text": "THE CHAMBER OF SECRETS HAS BEEN OPENED. ENEMIES OF THE HEIR, BEWARE.", "begin": 12850.127, "end": 12857.207, "localBegin": 1651.56, "localEnd": 1658.64}, {"id": "c008_f000184", "text": "'What's that thing - hanging underneath?' said Ron, a slight quiver in his voice.", "begin": 12857.207, "end": 12863.767, "localBegin": 1658.64, "localEnd": 1665.2}, {"id": "c008_f000185", "text": "As they edged nearer, Harry almost slipped over: there was a large puddle of water on the floor. Ron and Hermione grabbed him, and they inched towards the message, eyes fixed on a dark shadow beneath it. All three of them realised what it was at once, and leapt backwards with a splash.", "begin": 12863.767, "end": 12881.047, "localBegin": 1665.2, "localEnd": 1682.48}, {"id": "c008_f000186", "text": "Mrs Norris, the caretaker's cat, was hanging by her tail from the torch bracket. She was stiff as a board, her eyes wide and staring.", "begin": 12881.047, "end": 12890.807, "localBegin": 1682.48, "localEnd": 1692.24}, {"id": "c008_f000187", "text": "For a few seconds, they didn't move. Then Ron said, 'Let's get out of here.'", "begin": 12890.807, "end": 12897.207, "localBegin": 1692.24, "localEnd": 1698.64}, {"id": "c008_f000188", "text": "'Shouldn't we try and help -' Harry began awkwardly.", "begin": 12897.207, "end": 12901.007, "localBegin": 1698.64, "localEnd": 1702.44}, {"id": "c008_f000189", "text": "'Trust me,' said Ron. 'We don't want to be found here.'", "begin": 12901.007, "end": 12904.207, "localBegin": 1702.44, "localEnd": 1705.64}, {"id": "c008_f000190", "text": "But it was too late. A rumble, as though of distant thunder, told them that the feast had just ended. From either end of the corridor where they stood came the sound of hundreds of feet climbing the stairs, and the loud, happy talk of well-fed people; next moment, students were crashing into the passage from both ends.", "begin": 12904.207, "end": 12922.207, "localBegin": 1705.64, "localEnd": 1723.64}, {"id": "c008_f000191", "text": "The chatter, the bustle, the noise died suddenly as the people in front spotted the hanging cat. Harry, Ron and Hermione stood alone, in the middle of the corridor, as silence fell among the mass of students, pressing forward to see the grisly sight.", "begin": 12922.207, "end": 12939.527, "localBegin": 1723.64, "localEnd": 1740.96}, {"id": "c008_f000192", "text": "Then someone shouted through the quiet.", "begin": 12939.527, "end": 12942.727, "localBegin": 1740.96, "localEnd": 1744.16}, {"id": "c008_f000193", "text": "'Enemies of the heir, beware! You'll be next, Mudbloods!'", "begin": 12942.727, "end": 12949.247, "localBegin": 1744.16, "localEnd": 1750.68}, {"id": "c008_f000194", "text": "It was Draco Malfoy. He had pushed to the front of the crowd, his cold eyes alive, his usually bloodless face flushed, as he grinned at the sight of the hanging, immobile cat.", "begin": 12949.247, "end": 12963.487, "localBegin": 1750.68, "localEnd": 1764.92}]}, {"kind": "chapter", "number": 9, "title": "The Writing on the Wall", "audio": "audio/chapter_009.mp3", "start": 12963.5, "end": 14988.5, "duration": 2025.0, "paragraphs": [{"id": "c009_f000001", "text": "Chapter Nine. The Writing on the Wall.", "begin": 12963.5, "end": 12967.86, "localBegin": 0.0, "localEnd": 4.36}, {"id": "c009_f000002", "text": "'What's going on here? What's going on?'", "begin": 12967.86, "end": 12971.02, "localBegin": 4.36, "localEnd": 7.52}, {"id": "c009_f000003", "text": "Attracted no doubt by Malfoy's shout, Argus Filch came shouldering his way through the crowd. Then he saw Mrs Norris and fell back, clutching his face in horror.", "begin": 12971.02, "end": 12981.18, "localBegin": 7.52, "localEnd": 17.68}, {"id": "c009_f000004", "text": "'My cat! My cat! What's happened to Mrs Norris?' he shrieked.", "begin": 12981.18, "end": 12988.5, "localBegin": 17.68, "localEnd": 25.0}, {"id": "c009_f000005", "text": "And his popping eyes fell on Harry.", "begin": 12988.5, "end": 12990.54, "localBegin": 25.0, "localEnd": 27.04}, {"id": "c009_f000006", "text": "'You!' he screeched, 'You! You've murdered my cat! You've killed her! I'll kill you! I'll -'", "begin": 12990.54, "end": 13000.58, "localBegin": 27.04, "localEnd": 37.08}, {"id": "c009_f000007", "text": "'Argus!'", "begin": 13000.58, "end": 13002.34, "localBegin": 37.08, "localEnd": 38.84}, {"id": "c009_f000008", "text": "Dumbledore had arrived on the scene, followed by a number of other teachers. In seconds, he had swept past Harry, Ron and Hermione and detached Mrs Norris from the torch bracket.", "begin": 13002.34, "end": 13013.26, "localBegin": 38.84, "localEnd": 49.76}, {"id": "c009_f000009", "text": "'Come with me, Argus,' he said to Filch. 'You too, Mr Potter, Mr Weasley, Miss Granger.'", "begin": 13013.26, "end": 13021.42, "localBegin": 49.76, "localEnd": 57.92}, {"id": "c009_f000010", "text": "Lockhart stepped forward eagerly.", "begin": 13021.42, "end": 13023.7, "localBegin": 57.92, "localEnd": 60.2}, {"id": "c009_f000011", "text": "'My office is nearest, Headmaster - just upstairs - please feel free -'", "begin": 13023.7, "end": 13029.1, "localBegin": 60.2, "localEnd": 65.6}, {"id": "c009_f000012", "text": "'Thank you, Gilderoy,' said Dumbledore.", "begin": 13029.1, "end": 13033.06, "localBegin": 65.6, "localEnd": 69.56}, {"id": "c009_f000013", "text": "The silent crowd parted to let them pass. Lockhart, looking excited and important, hurried after Dumbledore; so did Professors McGonagall and Snape.", "begin": 13033.06, "end": 13043.34, "localBegin": 69.56, "localEnd": 79.84}, {"id": "c009_f000014", "text": "As they entered Lockhart's darkened office there was a flurry of movement across the walls; Harry saw several of the Lockharts in the pictures dodging out of sight, their hair in rollers. The real Lockhart lit the candles on his desk and stood back. Dumbledore laid Mrs Norris on the polished surface and began to examine her. Harry, Ron and Hermione exchanged tense looks and sank into chairs outside the pool of candlelight, watching.", "begin": 13043.34, "end": 13071.62, "localBegin": 79.84, "localEnd": 108.12}, {"id": "c009_f000015", "text": "The tip of Dumbledore's long, crooked nose was barely an inch from Mrs Norris's fur. He was looking at her closely through his", "begin": 13071.62, "end": 13078.42, "localBegin": 108.12, "localEnd": 114.92}, {"id": "c009_f000016", "text": "half-moon spectacles, his long fingers gently prodding and poking. Professor McGonagall was bent almost as close, her eyes narrowed. Snape loomed behind them, half in shadow, wearing a most peculiar expression: it was as though he was trying hard not to smile. And Lockhart was hovering around all of them, making suggestions.", "begin": 13078.42, "end": 13100.5, "localBegin": 114.92, "localEnd": 137.0}, {"id": "c009_f000017", "text": "'It was definitely a curse that killed her - probably the Transmogrifian Torture. I've seen it used many times, so unlucky I wasn't there, I know the very counter-curse that would have saved her ...'", "begin": 13100.5, "end": 13115.78, "localBegin": 137.0, "localEnd": 152.28}, {"id": "c009_f000018", "text": "Lockhart's comments were punctuated by Filch's dry, racking sobs. He was slumped in a chair by the desk, unable to look at Mrs Norris, his face in his hands. Much as he detested Filch, Harry couldn't help feeling a bit sorry for him, though not nearly as sorry as he felt for himself. If Dumbledore believed Filch, he would be expelled for sure.", "begin": 13115.78, "end": 13138.78, "localBegin": 152.28, "localEnd": 175.28}, {"id": "c009_f000019", "text": "Dumbledore was now muttering strange words under his breath and tapping Mrs Norris with his wand, but nothing happened: she continued to look as though she had been recently stuffed.", "begin": 13138.78, "end": 13149.98, "localBegin": 175.28, "localEnd": 186.48}, {"id": "c009_f000020", "text": "'... I remember something very similar happening in Ouagadougou,' said Lockhart, 'a series of attacks, the full story's in my autobiography. I was able to provide the townsfolk with various amulets which cleared the matter up at once ...'", "begin": 13149.98, "end": 13165.86, "localBegin": 186.48, "localEnd": 202.36}, {"id": "c009_f000021", "text": "The photographs of Lockhart on the walls were all nodding in agreement as he talked. One of them had forgotten to remove his hairnet.", "begin": 13165.86, "end": 13174.22, "localBegin": 202.36, "localEnd": 210.72}, {"id": "c009_f000022", "text": "At last Dumbledore straightened up.", "begin": 13174.22, "end": 13176.54, "localBegin": 210.72, "localEnd": 213.04}, {"id": "c009_f000023", "text": "'She's not dead, Argus,' he said softly.", "begin": 13176.54, "end": 13181.18, "localBegin": 213.04, "localEnd": 217.68}, {"id": "c009_f000024", "text": "Lockhart stopped abruptly in the middle of counting the number of murders he had prevented.", "begin": 13181.18, "end": 13186.3, "localBegin": 217.68, "localEnd": 222.8}, {"id": "c009_f000025", "text": "'Not dead?' choked Filch, looking through his fingers at Mrs Norris. 'But why's she all - all stiff and frozen?'", "begin": 13186.3, "end": 13194.02, "localBegin": 222.8, "localEnd": 230.52}, {"id": "c009_f000026", "text": "'She has been Petrified,' said Dumbledore ('Ah! I thought so!' said Lockhart). 'But how, I cannot say ...'", "begin": 13194.02, "end": 13205.46, "localBegin": 230.52, "localEnd": 241.96}, {"id": "c009_f000027", "text": "'Ask him!' shrieked Filch, turning his blotched and tear-stained face to Harry.", "begin": 13205.46, "end": 13210.58, "localBegin": 241.96, "localEnd": 247.08}, {"id": "c009_f000028", "text": "'No second-year could have done this,' said Dumbledore firmly. 'It would take Dark Magic of the most advanced -'", "begin": 13210.58, "end": 13218.3, "localBegin": 247.08, "localEnd": 254.8}, {"id": "c009_f000029", "text": "'He did it, he did it!' Filch spat, his pouchy face purpling. 'You", "begin": 13218.3, "end": 13222.98, "localBegin": 254.8, "localEnd": 259.48}, {"id": "c009_f000030", "text": "saw what he wrote on the wall! He found - in my office - he knows I'm a - I'm a -' Filch's face worked horribly. 'He knows I'm a Squib!' he finished.", "begin": 13222.98, "end": 13236.3, "localBegin": 259.48, "localEnd": 272.8}, {"id": "c009_f000031", "text": "'I never touched Mrs Norris!' Harry said loudly, uncomfortably aware of everyone looking at him, including all the Lockharts on the walls. 'And I don't even know what a Squib is.'", "begin": 13236.3, "end": 13247.66, "localBegin": 272.8, "localEnd": 284.16}, {"id": "c009_f000032", "text": "'Rubbish!' snarled Filch. 'He saw my Kwikspell letter!'", "begin": 13247.66, "end": 13252.78, "localBegin": 284.16, "localEnd": 289.28}, {"id": "c009_f000033", "text": "'If I might speak, Headmaster,' said Snape from the shadows, and Harry's sense of foreboding increased; he was sure nothing Snape had to say was going to do him any good.", "begin": 13252.78, "end": 13264.14, "localBegin": 289.28, "localEnd": 300.64}, {"id": "c009_f000034", "text": "'Potter and his friends may have simply been in the wrong place at the wrong time,' he said, a slight sneer curling his mouth as though he doubted it, 'but we do have a set of suspicious circumstances here. Why were they in the upstairs corridor at all? Why weren't they at the Hallowe'en feast?'", "begin": 13264.14, "end": 13287.18, "localBegin": 300.64, "localEnd": 323.68}, {"id": "c009_f000035", "text": "Harry, Ron and Hermione all launched into an explanation about the Deathday Party, '... there were hundreds of ghosts, they'll tell you we were there -'", "begin": 13287.18, "end": 13295.94, "localBegin": 323.68, "localEnd": 332.44}, {"id": "c009_f000036", "text": "'But why not join the feast afterwards?' said Snape, his black eyes glittering in the candlelight. 'Why go up to that corridor?'", "begin": 13295.94, "end": 13305.06, "localBegin": 332.44, "localEnd": 341.56}, {"id": "c009_f000037", "text": "Ron and Hermione looked at Harry.", "begin": 13305.06, "end": 13306.5, "localBegin": 341.56, "localEnd": 343.0}, {"id": "c009_f000038", "text": "'Because - because -' Harry said, his heart thumping very fast; something told him it would sound very far-fetched if he told them he had been led there by a bodiless voice no one but he could hear, 'because we were tired and wanted to go to bed,' he said.", "begin": 13306.5, "end": 13325.02, "localBegin": 343.0, "localEnd": 361.52}, {"id": "c009_f000039", "text": "'Without any supper?' said Snape, a triumphant smile flickering across his gaunt face. 'I didn't think ghosts provided food fit for living people at their parties.'", "begin": 13325.02, "end": 13337.82, "localBegin": 361.52, "localEnd": 374.32}, {"id": "c009_f000040", "text": "'We weren't hungry,' said Ron loudly, as his stomach gave a huge rumble.", "begin": 13337.82, "end": 13342.7, "localBegin": 374.32, "localEnd": 379.2}, {"id": "c009_f000041", "text": "Snape's nasty smile widened.", "begin": 13342.7, "end": 13345.9, "localBegin": 379.2, "localEnd": 382.4}, {"id": "c009_f000042", "text": "'I suggest, Headmaster, that Potter is not being entirely truthful,' he said. 'It might be a good idea if he were deprived of certain privileges until he is ready to tell us the whole story. I personally feel he should be taken off the Gryffindor Quidditch team until he is ready to be honest.'", "begin": 13345.9, "end": 13366.02, "localBegin": 382.4, "localEnd": 402.52}, {"id": "c009_f000043", "text": "'Really, Severus,' said Professor McGonagall sharply, 'I see no reason to stop the boy playing Quidditch. This cat wasn't hit over the head with a broomstick. There is no evidence at all that Potter", "begin": 13366.02, "end": 13377.7, "localBegin": 402.52, "localEnd": 414.2}, {"id": "c009_f000044", "text": "has done anything wrong.'", "begin": 13377.7, "end": 13380.22, "localBegin": 414.2, "localEnd": 416.72}, {"id": "c009_f000045", "text": "Dumbledore was giving Harry a searching look. His twinkling light-blue gaze made Harry feel as though he was being X-rayed.", "begin": 13380.22, "end": 13387.62, "localBegin": 416.72, "localEnd": 424.12}, {"id": "c009_f000046", "text": "'Innocent until proven guilty, Severus,' he said firmly.", "begin": 13387.62, "end": 13393.22, "localBegin": 424.12, "localEnd": 429.72}, {"id": "c009_f000047", "text": "Snape looked furious. So did Filch.", "begin": 13393.22, "end": 13395.62, "localBegin": 429.72, "localEnd": 432.12}, {"id": "c009_f000048", "text": "'My cat has been Petrified!' he shrieked, his eyes popping. 'I want to see some punishment!'", "begin": 13395.62, "end": 13402.9, "localBegin": 432.12, "localEnd": 439.4}, {"id": "c009_f000049", "text": "We will be able to cure her, Argus,' said Dumbledore patiently. 'Professor Sprout recently managed to procure some Mandrakes. As soon as they have reached their full size, I will have a potion made which will revive Mrs Norris.'", "begin": 13402.9, "end": 13419.98, "localBegin": 439.4, "localEnd": 456.48}, {"id": "c009_f000050", "text": "'I'll make it,' Lockhart butted in. 'I must have done it a hundred times, I could whip up a Mandrake Restorative Draught in my sleep -'", "begin": 13419.98, "end": 13429.66, "localBegin": 456.48, "localEnd": 466.16}, {"id": "c009_f000051", "text": "'Excuse me,' said Snape icily, 'but I believe I am the Potions master at this school.'", "begin": 13429.66, "end": 13437.38, "localBegin": 466.16, "localEnd": 473.88}, {"id": "c009_f000052", "text": "There was a very awkward pause.", "begin": 13437.38, "end": 13441.34, "localBegin": 473.88, "localEnd": 477.84}, {"id": "c009_f000053", "text": "'You may go,' Dumbledore said to Harry, Ron and Hermione.", "begin": 13441.34, "end": 13445.98, "localBegin": 477.84, "localEnd": 482.48}, {"id": "c009_f000054", "text": "They went, as quickly as they could without actually running. When they were a floor up from Lockhart's office, they turned into an empty classroom and closed the door quietly behind them. Harry squinted at his friends' darkened faces.", "begin": 13445.98, "end": 13460.34, "localBegin": 482.48, "localEnd": 496.84}, {"id": "c009_f000055", "text": "'D'you think I should have told them about that voice I heard?'", "begin": 13460.34, "end": 13463.98, "localBegin": 496.84, "localEnd": 500.48}, {"id": "c009_f000056", "text": "'No,' said Ron, without hesitation. 'Hearing voices no one else can hear isn't a good sign, even in the wizarding world.'", "begin": 13463.98, "end": 13471.18, "localBegin": 500.48, "localEnd": 507.68}, {"id": "c009_f000057", "text": "Something in Ron's voice made Harry ask, 'You do believe me, don't you?'", "begin": 13471.18, "end": 13477.14, "localBegin": 507.68, "localEnd": 513.64}, {"id": "c009_f000058", "text": "''Course I do,' said Ron quickly. 'But - you must admit it's weird ...'", "begin": 13477.14, "end": 13483.06, "localBegin": 513.64, "localEnd": 519.56}, {"id": "c009_f000059", "text": "'I know it's weird,' said Harry. 'The whole thing's weird. What was that writing on the wall about? The Chamber has been opened ... what's that supposed to mean?'", "begin": 13483.06, "end": 13492.42, "localBegin": 519.56, "localEnd": 528.92}, {"id": "c009_f000060", "text": "'You know, it rings a sort of bell,' said Ron slowly. 'I think someone told me a story about a secret chamber at Hogwarts once ... might've been Bill ...'", "begin": 13492.42, "end": 13502.14, "localBegin": 528.92, "localEnd": 538.64}, {"id": "c009_f000061", "text": "'And what on earth's a Squib?' said Harry.", "begin": 13502.14, "end": 13504.98, "localBegin": 538.64, "localEnd": 541.48}, {"id": "c009_f000062", "text": "To his surprise, Ron stifled a snigger.", "begin": 13504.98, "end": 13508.22, "localBegin": 541.48, "localEnd": 544.72}, {"id": "c009_f000063", "text": "'Well - it's not funny really - but as it's Filch ...' he said. 'A Squib is someone who was born into a wizarding family but hasn't got any magic powers. Kind of the opposite of Muggle-born wizards,", "begin": 13508.22, "end": 13520.54, "localBegin": 544.72, "localEnd": 557.04}, {"id": "c009_f000064", "text": "but Squibs are quite unusual. If Filch's trying to learn magic from a Kwikspell course, I reckon he must be a Squib. It would explain a lot. Like why he hates students so much.' Ron gave a satisfied smile. 'He's bitter.'", "begin": 13520.54, "end": 13536.3, "localBegin": 557.04, "localEnd": 572.8}, {"id": "c009_f000065", "text": "A clock chimed somewhere.", "begin": 13536.3, "end": 13537.78, "localBegin": 572.8, "localEnd": 574.28}, {"id": "c009_f000066", "text": "'Midnight,' said Harry. 'We'd better get to bed before Snape comes along and tries to frame us for something else.' * For a few days, the school could talk of little but the attack on Mrs Norris. Filch kept it fresh in everyone's minds by pacing the spot where she had been attacked, as though he thought the attacker might come back. Harry had seen him scrubbing the message on the wall with 'Mrs Skower's All-Purpose Magical Mess Remover', but to no effect; the words still gleamed as brightly as ever on the stone. When Filch wasn't guarding the scene of the crime, he was skulking red-eyed through the corridors, lunging out at unsuspecting students and trying to put them in detention for things like 'breathing loudly' and 'looking happy'.", "begin": 13537.78, "end": 13585.38, "localBegin": 574.28, "localEnd": 621.88}, {"id": "c009_f000067", "text": "Ginny Weasley seemed very disturbed by Mrs Norris's fate. According to Ron, she was a great cat-lover.", "begin": 13585.38, "end": 13593.46, "localBegin": 621.88, "localEnd": 629.96}, {"id": "c009_f000068", "text": "'But you hadn't really got to know Mrs Norris,' Ron told her bracingly. 'Honestly, we're much better off without her.' Ginny's lip trembled. 'Stuff like this doesn't often happen at Hogwarts,' Ron assured her. 'They'll catch the nutter who did it and have him out of here in no time. I just hope he's got time to Petrify Filch before he's expelled. I'm only joking -' Ron added hastily, as Ginny blanched.", "begin": 13593.46, "end": 13618.34, "localBegin": 629.96, "localEnd": 654.84}, {"id": "c009_f000069", "text": "The attack had also had an effect on Hermione. It was quite usual for Hermione to spend a lot of time reading, but she was now doing almost nothing else. Nor could Harry and Ron get much response from her when they asked what she was up to, and not until the following Wednesday did they find out.", "begin": 13618.34, "end": 13636.94, "localBegin": 654.84, "localEnd": 673.44}, {"id": "c009_f000070", "text": "Harry had been held back in Potions, where Snape had made him stay behind to scrape tubeworms off the desks. After a hurried lunch, he went upstairs to meet Ron in the library, and saw Justin Finch-Fletchley, the Hufflepuff boy from Herbology, coming towards him. Harry had just opened his mouth to say hello when Justin caught sight of him, turned abruptly and sped off in the opposite direction.", "begin": 13636.94, "end": 13660.74, "localBegin": 673.44, "localEnd": 697.24}, {"id": "c009_f000071", "text": "Harry found Ron at the back of the library, measuring his", "begin": 13660.74, "end": 13665.06, "localBegin": 697.24, "localEnd": 701.56}, {"id": "c009_f000072", "text": "History of Magic homework. Professor Binns had asked for a three-foot long composition on 'The Medieval Assembly of European Wizards'.", "begin": 13665.06, "end": 13673.66, "localBegin": 701.56, "localEnd": 710.16}, {"id": "c009_f000073", "text": "'I don't believe it, I'm still eight inches short ...' said Ron furiously, letting go of his parchment, which sprang back into a roll, 'and Hermione's done four feet seven inches and her writing's tiny.'", "begin": 13673.66, "end": 13686.38, "localBegin": 710.16, "localEnd": 722.88}, {"id": "c009_f000074", "text": "Where is she?' asked Harry, grabbing the tape measure and unrolling his own homework.", "begin": 13686.38, "end": 13690.38, "localBegin": 722.88, "localEnd": 726.88}, {"id": "c009_f000075", "text": "'Somewhere over there,' said Ron, pointing along the shelves, 'looking for another book. I think she's trying to read the whole library before Christmas.'", "begin": 13690.38, "end": 13698.46, "localBegin": 726.88, "localEnd": 734.96}, {"id": "c009_f000076", "text": "Harry told Ron about Justin Finch-Fletchley running away from him.", "begin": 13698.46, "end": 13702.98, "localBegin": 734.96, "localEnd": 739.48}, {"id": "c009_f000077", "text": "'Dunno why you care, I thought he was a bit of an idiot,' said Ron, scribbling away, making his writing as large as possible. 'All that rubbish about Lockhart being so great -'", "begin": 13702.98, "end": 13713.86, "localBegin": 739.48, "localEnd": 750.36}, {"id": "c009_f000078", "text": "Hermione emerged from between the bookshelves. She looked irritable and at last seemed ready to talk to them.", "begin": 13713.86, "end": 13720.1, "localBegin": 750.36, "localEnd": 756.6}, {"id": "c009_f000079", "text": "'All the copies of Hogwarts: A History have been taken out,' she said, sitting down next to Harry and Ron. 'And there's a two-week waiting list. I wish I hadn't left my copy at home, but I couldn't fit it in my trunk with all the Lockhart books.'", "begin": 13720.1, "end": 13733.58, "localBegin": 756.6, "localEnd": 770.08}, {"id": "c009_f000080", "text": "'Why do you want it?' said Harry.", "begin": 13733.58, "end": 13736.86, "localBegin": 770.08, "localEnd": 773.36}, {"id": "c009_f000081", "text": "'The same reason everyone else wants it,' said Hermione, 'to read up on the legend of the Chamber of Secrets.'", "begin": 13736.86, "end": 13743.22, "localBegin": 773.36, "localEnd": 779.72}, {"id": "c009_f000082", "text": "'What's that?' said Harry quickly.", "begin": 13743.22, "end": 13744.94, "localBegin": 779.72, "localEnd": 781.44}, {"id": "c009_f000083", "text": "'That's just it. I can't remember,' said Hermione, biting her lip. 'And I can't find the story anywhere else -'", "begin": 13744.94, "end": 13751.38, "localBegin": 781.44, "localEnd": 787.88}, {"id": "c009_f000084", "text": "'Hermione, let me read your composition,' said Ron desperately, checking his watch.", "begin": 13751.38, "end": 13756.78, "localBegin": 787.88, "localEnd": 793.28}, {"id": "c009_f000085", "text": "'No, I won't,' said Hermione, suddenly severe. 'You've had ten days to finish it.'", "begin": 13756.78, "end": 13761.74, "localBegin": 793.28, "localEnd": 798.24}, {"id": "c009_f000086", "text": "'I only need another two inches, go on ...'", "begin": 13761.74, "end": 13764.46, "localBegin": 798.24, "localEnd": 800.96}, {"id": "c009_f000087", "text": "The bell rang. Ron and Hermione led the way to History of Magic, bickering.", "begin": 13764.46, "end": 13769.7, "localBegin": 800.96, "localEnd": 806.2}, {"id": "c009_f000088", "text": "History of Magic was the dullest subject on their timetable. Professor Binns, who taught it, was their only ghost teacher, and the most exciting thing that ever happened in his classes was his entering the room through the blackboard. Ancient and shrivelled, many people said he hadn't noticed he was dead. He had", "begin": 13769.7, "end": 13788.74, "localBegin": 806.2, "localEnd": 825.24}, {"id": "c009_f000089", "text": "simply got up to teach one day and left his body behind him in an armchair in front of the staff-room fire; his routine had not varied in the slightest since.", "begin": 13788.74, "end": 13798.18, "localBegin": 825.24, "localEnd": 834.68}, {"id": "c009_f000090", "text": "Today was as boring as ever. Professor Binns opened his notes and began to read in a flat drone like an old vacuum cleaner until nearly everyone in the class was in a deep stupor, occasionally coming round long enough to copy down a name or date, then falling asleep again. He had been speaking for half an hour when something happened that had never happened before. Hermione put up her hand.", "begin": 13798.18, "end": 13822.86, "localBegin": 834.68, "localEnd": 859.36}, {"id": "c009_f000091", "text": "Professor Binns, glancing up in the middle of a deadly dull lecture on the International Warlock Convention of 1289, looked amazed.", "begin": 13822.86, "end": 13833.34, "localBegin": 859.36, "localEnd": 869.84}, {"id": "c009_f000092", "text": "'Miss - er -?'", "begin": 13833.34, "end": 13834.54, "localBegin": 869.84, "localEnd": 871.04}, {"id": "c009_f000093", "text": "'Granger, Professor. I was wondering if you could tell us anything about the Chamber of Secrets,' said Hermione in a clear voice.", "begin": 13834.54, "end": 13843.34, "localBegin": 871.04, "localEnd": 879.84}, {"id": "c009_f000094", "text": "Dean Thomas, who had been sitting with his mouth hanging open, gazing out of the window, jerked out of his trance; Lavender Brown's head came up off her arms and Neville's elbow slipped off his desk.", "begin": 13843.34, "end": 13854.78, "localBegin": 879.84, "localEnd": 891.28}, {"id": "c009_f000095", "text": "Professor Binns blinked.", "begin": 13854.78, "end": 13856.74, "localBegin": 891.28, "localEnd": 893.24}, {"id": "c009_f000096", "text": "'My subject is History of Magic,' he said in his dry, wheezy voice. 'I deal with facts, Miss Granger, not myths and legends.' He cleared his throat with a small noise like chalk snapping and continued, 'In September of that year, a sub-committee of Sardinian sorcerers -'", "begin": 13856.74, "end": 13877.5, "localBegin": 893.24, "localEnd": 914.0}, {"id": "c009_f000097", "text": "He stuttered to a halt. Hermione's hand was waving in the air again.", "begin": 13877.5, "end": 13881.7, "localBegin": 914.0, "localEnd": 918.2}, {"id": "c009_f000098", "text": "'Miss Grant?'", "begin": 13881.7, "end": 13884.14, "localBegin": 918.2, "localEnd": 920.64}, {"id": "c009_f000099", "text": "'Please, sir, don't legends always have a basis in fact?'", "begin": 13884.14, "end": 13888.9, "localBegin": 920.64, "localEnd": 925.4}, {"id": "c009_f000100", "text": "Professor Binns was looking at her in such amazement, Harry was sure no student had ever interrupted him before, alive or dead.", "begin": 13888.9, "end": 13897.18, "localBegin": 925.4, "localEnd": 933.68}, {"id": "c009_f000101", "text": "'Well,' said Professor Binns slowly, 'yes, one could argue that, I suppose.' He peered at Hermione as though he had never seen a student properly before. 'However, the legend of which you speak is such a very sensational, even ludicrous tale ...'", "begin": 13897.18, "end": 13917.5, "localBegin": 933.68, "localEnd": 954.0}, {"id": "c009_f000102", "text": "But the whole class was now hanging on Professor Binns's every word. He looked dimly at them all, every face turned to his. Harry", "begin": 13917.5, "end": 13927.02, "localBegin": 954.0, "localEnd": 963.52}, {"id": "c009_f000103", "text": "could tell he was completely thrown by such an unusual show of interest.", "begin": 13927.02, "end": 13931.9, "localBegin": 963.52, "localEnd": 968.4}, {"id": "c009_f000104", "text": "'Oh, very well,' he said slowly. 'Let me see ... the Chamber of Secrets ...", "begin": 13931.9, "end": 13939.7, "localBegin": 968.4, "localEnd": 976.2}, {"id": "c009_f000105", "text": "'You all know, of course, that Hogwarts was founded over a thousand years ago - the precise date is uncertain - by the four greatest witches and wizards of the age. The four school houses are named after them: Godric Gryffindor, Helga Hufflepuff, Rowena Ravenclaw and Salazar Slytherin. They built this castle together, far from prying Muggle eyes, for it was an age when magic was feared by common people, and witches and wizards suffered much persecution.'", "begin": 13939.7, "end": 13976.3, "localBegin": 976.2, "localEnd": 1012.8}, {"id": "c009_f000106", "text": "He paused, gazed blearily around the room, and continued, 'For a few years, the founders worked in harmony together, seeking out youngsters who showed signs of magic and bringing them to the castle to be educated. But then disagreements sprang up between them. A rift began to grow between Slytherin and the others. Slytherin wished to be more selective about the students admitted to Hogwarts. He believed that magical learning should be kept within all-magic families. He disliked taking students of Muggle parentage, believing them to be untrustworthy. After a while, there was a serious argument on the subject between Slytherin and Gryffindor, and Slytherin left the school.'", "begin": 13976.3, "end": 14027.7, "localBegin": 1012.8, "localEnd": 1064.2}, {"id": "c009_f000107", "text": "Professor Binns paused again, pursing his lips, looking like a wrinkled old tortoise.", "begin": 14027.7, "end": 14033.5, "localBegin": 1064.2, "localEnd": 1070.0}, {"id": "c009_f000108", "text": "'Reliable historical sources tell us this much,' he said, 'but these honest facts have been obscured by the fanciful legend of the Chamber of Secrets. The story goes that Slytherin had built a hidden chamber in the castle, of which the other founders knew nothing.", "begin": 14033.5, "end": 14053.66, "localBegin": 1070.0, "localEnd": 1090.16}, {"id": "c009_f000109", "text": "'Slytherin, according to the legend, sealed the Chamber of Secrets so that none would be able to open it until his own true heir arrived at the school. The heir alone would be able to unseal the Chamber of Secrets, unleash the horror within, and use it to purge the school of all who were unworthy to study magic.'", "begin": 14053.66, "end": 14077.7, "localBegin": 1090.16, "localEnd": 1114.2}, {"id": "c009_f000110", "text": "There was silence as he finished telling the story, but it wasn't the usual, sleepy silence that filled Professor Binns's classes. There was unease in the air as everyone continued to watch him, hoping for more. Professor Binns looked faintly annoyed.", "begin": 14077.7, "end": 14094.34, "localBegin": 1114.2, "localEnd": 1130.84}, {"id": "c009_f000111", "text": "'The whole thing is arrant nonsense, of course,' he said. 'Naturally, the school has been searched for evidence of such a", "begin": 14094.34, "end": 14104.3, "localBegin": 1130.84, "localEnd": 1140.8}, {"id": "c009_f000112", "text": "chamber, many times, by the most learned witches and wizards. It does not exist. A tale told to frighten the gullible.'", "begin": 14104.3, "end": 14114.3, "localBegin": 1140.8, "localEnd": 1150.8}, {"id": "c009_f000113", "text": "Hermione's hand was back in the air.", "begin": 14114.3, "end": 14117.02, "localBegin": 1150.8, "localEnd": 1153.52}, {"id": "c009_f000114", "text": "'Sir - what exactly do you mean by the 'horror within' the Chamber?'", "begin": 14117.02, "end": 14121.02, "localBegin": 1153.52, "localEnd": 1157.52}, {"id": "c009_f000115", "text": "'That is believed to be some sort of monster, which the heir of Slytherin alone can control,' said Professor Binns in his dry, reedy voice.", "begin": 14121.02, "end": 14130.9, "localBegin": 1157.52, "localEnd": 1167.4}, {"id": "c009_f000116", "text": "The class exchanged nervous looks.", "begin": 14130.9, "end": 14133.86, "localBegin": 1167.4, "localEnd": 1170.36}, {"id": "c009_f000117", "text": "'I tell you, the thing does not exist,' said Professor Binns, shuffling his notes. 'There is no Chamber and no monster.'", "begin": 14133.86, "end": 14143.9, "localBegin": 1170.36, "localEnd": 1180.4}, {"id": "c009_f000118", "text": "'But, sir,' said Seamus Finnigan, 'if the Chamber can only be opened by Slytherin's true heir, no one else would be able to find it, would they?'", "begin": 14143.9, "end": 14154.18, "localBegin": 1180.4, "localEnd": 1190.68}, {"id": "c009_f000119", "text": "'Nonsense, O'Flaherty,' said Professor Binns in an aggravated tone. 'If a long succession of Hogwarts headmasters and headmistresses haven't found the thing -'", "begin": 14154.18, "end": 14166.42, "localBegin": 1190.68, "localEnd": 1202.92}, {"id": "c009_f000120", "text": "'But, Professor,' piped up Parvati Patil, 'you'd probably have to use Dark Magic to open it -'", "begin": 14166.42, "end": 14173.38, "localBegin": 1202.92, "localEnd": 1209.88}, {"id": "c009_f000121", "text": "'Just because a wizard doesn't use Dark Magic, doesn't mean he can't, Miss Pennyfeather,' snapped Professor Binns. 'I repeat, if the likes of Dumbledore -'", "begin": 14173.38, "end": 14185.98, "localBegin": 1209.88, "localEnd": 1222.48}, {"id": "c009_f000122", "text": "'But maybe you've got to be related to Slytherin, so Dumbledore couldn't -' began Dean Thomas, but Professor Binns had had enough.", "begin": 14185.98, "end": 14193.7, "localBegin": 1222.48, "localEnd": 1230.2}, {"id": "c009_f000123", "text": "'That will do,' he said sharply. 'It is a myth! It does not exist! There is not a shred of evidence that Slytherin ever built so much as a secret broom cupboard! I regret telling you such a foolish story! We will return, if you please, to history, to solid, believable, verifiable fact!'", "begin": 14193.7, "end": 14218.1, "localBegin": 1230.2, "localEnd": 1254.6}, {"id": "c009_f000124", "text": "And within five minutes, the class had sunk back into its usual torpor. * 'I always knew Salazar Slytherin was a twisted old loony,' Ron told Harry and Hermione, as they fought their way through the teeming corridors at the end of the lesson to drop off their bags before dinner. 'But I never knew he started all this pure-blood stuff. I wouldn't be in his house if you paid me. Honestly, if the Sorting Hat had tried to put me in Slytherin, I'd've got the train straight back home ...'", "begin": 14218.1, "end": 14249.62, "localBegin": 1254.6, "localEnd": 1286.12}, {"id": "c009_f000125", "text": "Hermione nodded fervently, but Harry didn't say anything. His stomach had just dropped unpleasantly.", "begin": 14249.62, "end": 14256.38, "localBegin": 1286.12, "localEnd": 1292.88}, {"id": "c009_f000126", "text": "Harry had never told Ron and Hermione that the Sorting Hat had seriously considered putting him in Slytherin. He could remember, as though it was yesterday, the small voice that had spoken in his ear when he'd placed the Hat on his head a year before.", "begin": 14256.38, "end": 14271.22, "localBegin": 1292.88, "localEnd": 1307.72}, {"id": "c009_f000127", "text": "'You could be great, you know, it's all here in your head, and Slytherin would help you on the way to greatness, no doubt about that ...'", "begin": 14271.22, "end": 14279.5, "localBegin": 1307.72, "localEnd": 1316.0}, {"id": "c009_f000128", "text": "But Harry, who had already heard of Slytherin house's reputation for turning out dark wizards, had thought desperately, 'Not Slytherin!' and the Hat had said, 'Oh, well, if you're sure ... better be Gryffindor ...'", "begin": 14279.5, "end": 14294.62, "localBegin": 1316.0, "localEnd": 1331.12}, {"id": "c009_f000129", "text": "As they were shunted along in the throng, Colin Creevey went past.", "begin": 14294.62, "end": 14299.26, "localBegin": 1331.12, "localEnd": 1335.76}, {"id": "c009_f000130", "text": "'Hiya, Harry!'", "begin": 14299.26, "end": 14300.46, "localBegin": 1335.76, "localEnd": 1336.96}, {"id": "c009_f000131", "text": "'Hullo, Colin,' said Harry automatically.", "begin": 14300.46, "end": 14303.66, "localBegin": 1336.96, "localEnd": 1340.16}, {"id": "c009_f000132", "text": "'Harry - Harry - a boy in my class has been saying you're -'", "begin": 14303.66, "end": 14306.9, "localBegin": 1340.16, "localEnd": 1343.4}, {"id": "c009_f000133", "text": "But Colin was so small he couldn't fight against the tide of people bearing him towards the Great Hall; they heard him squeak, 'See you, Harry!' and he was gone.", "begin": 14306.9, "end": 14316.18, "localBegin": 1343.4, "localEnd": 1352.68}, {"id": "c009_f000134", "text": "'What's a boy in his class saying about you?' Hermione wondered.", "begin": 14316.18, "end": 14320.54, "localBegin": 1352.68, "localEnd": 1357.04}, {"id": "c009_f000135", "text": "'That I'm Slytherin's heir, I expect,' said Harry, his stomach dropping another inch or so, as he suddenly remembered the way Justin Finch-Fletchley had run away from him at lunchtime.", "begin": 14320.54, "end": 14332.38, "localBegin": 1357.04, "localEnd": 1368.88}, {"id": "c009_f000136", "text": "'People here'll believe anything,' said Ron in disgust.", "begin": 14332.38, "end": 14336.22, "localBegin": 1368.88, "localEnd": 1372.72}, {"id": "c009_f000137", "text": "The crowd thinned and they were able to climb the next staircase without difficulty.", "begin": 14336.22, "end": 14341.22, "localBegin": 1372.72, "localEnd": 1377.72}, {"id": "c009_f000138", "text": "'D'you really think there's a Chamber of Secrets?' Ron asked Hermione.", "begin": 14341.22, "end": 14345.34, "localBegin": 1377.72, "localEnd": 1381.84}, {"id": "c009_f000139", "text": "'I don't know,' she said, frowning. 'Dumbledore couldn't cure Mrs Norris, and that makes me think that whatever attacked her might not be - well - human.'", "begin": 14345.34, "end": 14356.02, "localBegin": 1381.84, "localEnd": 1392.52}, {"id": "c009_f000140", "text": "As she spoke, they turned a corner and found themselves at the end of the very corridor where the attack had happened. They stopped and looked. The scene was just as it had been that night, except that there was no stiff cat hanging from the torch bracket, and an empty chair stood against the wall bearing the message", "begin": 14356.02, "end": 14374.86, "localBegin": 1392.52, "localEnd": 1411.36}, {"id": "c009_f000141", "text": "'The Chamber has been opened.'", "begin": 14374.86, "end": 14376.94, "localBegin": 1411.36, "localEnd": 1413.44}, {"id": "c009_f000142", "text": "'That's where Filch has been keeping guard,' Ron muttered.", "begin": 14376.94, "end": 14381.94, "localBegin": 1413.44, "localEnd": 1418.44}, {"id": "c009_f000143", "text": "They looked at each other. The corridor was deserted.", "begin": 14381.94, "end": 14384.9, "localBegin": 1418.44, "localEnd": 1421.4}, {"id": "c009_f000144", "text": "'Can't hurt to have a poke around,' said Harry, dropping his bag and getting to his hands and knees so that he could crawl along, searching for clues.", "begin": 14384.9, "end": 14393.22, "localBegin": 1421.4, "localEnd": 1429.72}, {"id": "c009_f000145", "text": "'Scorch marks!' he said. 'Here - and here -'", "begin": 14393.22, "end": 14398.42, "localBegin": 1429.72, "localEnd": 1434.92}, {"id": "c009_f000146", "text": "'Come and look at this!' said Hermione. 'This is funny ...'", "begin": 14398.42, "end": 14403.02, "localBegin": 1434.92, "localEnd": 1439.52}, {"id": "c009_f000147", "text": "Harry got up and crossed to the window next to the message on the wall. Hermione was pointing at the topmost pane, where around twenty spiders were scuttling, apparently fighting to get through a small crack in the glass. A long, silvery thread was dangling like a rope, as though they had all climbed it in their hurry to get outside.", "begin": 14403.02, "end": 14422.26, "localBegin": 1439.52, "localEnd": 1458.76}, {"id": "c009_f000148", "text": "'Have you ever seen spiders act like that?' said Hermione wonderingly.", "begin": 14422.26, "end": 14427.14, "localBegin": 1458.76, "localEnd": 1463.64}, {"id": "c009_f000149", "text": "'No,' said Harry, 'have you, Ron? Ron?'", "begin": 14427.14, "end": 14431.58, "localBegin": 1463.64, "localEnd": 1468.08}, {"id": "c009_f000150", "text": "He looked over his shoulder. Ron was standing well back, and seemed to be fighting the impulse to run.", "begin": 14431.58, "end": 14437.82, "localBegin": 1468.08, "localEnd": 1474.32}, {"id": "c009_f000151", "text": "'What's up?' said Harry.", "begin": 14437.82, "end": 14440.94, "localBegin": 1474.32, "localEnd": 1477.44}, {"id": "c009_f000152", "text": "'I - don't - like - spiders,' said Ron tensely.", "begin": 14440.94, "end": 14446.34, "localBegin": 1477.44, "localEnd": 1482.84}, {"id": "c009_f000153", "text": "'I never knew that,' said Hermione, looking at Ron in surprise. 'You've used spiders in potions loads of times ...'", "begin": 14446.34, "end": 14453.06, "localBegin": 1482.84, "localEnd": 1489.56}, {"id": "c009_f000154", "text": "'I don't mind them dead,' said Ron, who was carefully looking anywhere but at the window, 'I just don't like the way they move ...'", "begin": 14453.06, "end": 14461.22, "localBegin": 1489.56, "localEnd": 1497.72}, {"id": "c009_f000155", "text": "Hermione giggled.", "begin": 14461.22, "end": 14462.74, "localBegin": 1497.72, "localEnd": 1499.24}, {"id": "c009_f000156", "text": "'It's not funny,' said Ron, fiercely. 'If you must know, when I was three, Fred turned my - my teddy bear into a dirty great spider because I broke his toy broomstick. You wouldn't like them either if you'd been holding your bear and suddenly it had too many legs and ...'", "begin": 14462.74, "end": 14478.5, "localBegin": 1499.24, "localEnd": 1515.0}, {"id": "c009_f000157", "text": "He broke off, shuddering. Hermione was obviously still trying not to laugh. Feeling they had better get off the subject, Harry said, 'Remember all that water on the floor? Where did that come from? Someone's mopped it up.'", "begin": 14478.5, "end": 14492.66, "localBegin": 1515.0, "localEnd": 1529.16}, {"id": "c009_f000158", "text": "'It was about here,' said Ron, recovering himself to walk a few paces past Filch's chair and pointing. 'Level with this door.'", "begin": 14492.66, "end": 14501.62, "localBegin": 1529.16, "localEnd": 1538.12}, {"id": "c009_f000159", "text": "He reached for the brass doorknob but suddenly withdrew his hand as though he'd been burned.", "begin": 14501.62, "end": 14506.18, "localBegin": 1538.12, "localEnd": 1542.68}, {"id": "c009_f000160", "text": "'What's the matter?' said Harry.", "begin": 14506.18, "end": 14508.02, "localBegin": 1542.68, "localEnd": 1544.52}, {"id": "c009_f000161", "text": "'Can't go in there,' said Ron gruffly, 'that's a girls
